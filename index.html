/* ===== ADVIES AAN DE KAPITEIN =====
   Eén doorlopende werkvolgorde voor de dienst 07:00–19:00. Er is één duwboot,
   dus één taak tegelijk. Prioriteit: (1) bij wind ≥ 6 Bft eerst duwboten
   assisteren, (2) voorkomen dat een duwboot moet wachten, (3) machines nooit
   stil. De kapitein beslist: elke taak is af te vinken, over te slaan of te
   verschuiven. Tijden komen uit een standaardtabel (later per gebruiker in te
   stellen). De taken worden afgeleid uit de planning en de haventoestand. */
const ADVIES_TIJDEN = { ladenPerBak:60, weghalen4:45, weghalen6:60, bijhalen4:20, bijhalen6:30, verhalen:15 };
const ADVIES_STATUS_KEY='duwbakken-advies-status';
const ADVIES_VOLGORDE_KEY='duwbakken-advies-volgorde';
const ADVIES_WIND_KEY='duwbakken-advies-wind';
const ADVIES_TYPE = {
  bijhalen:{ic:'📥',naam:'Bijhalen',kl:'#4a9d6a'},
  laden:{ic:'⚙️',naam:'Laden',kl:'#3f8d9c'},
  weghalen:{ic:'⬆️',naam:'Weghalen',kl:'#c2683a'},
  verhalen:{ic:'↔️',naam:'Verhalen',kl:'#8792a3'},
  assisteren:{ic:'🆘',naam:'Assisteren',kl:'#A32E1E'},
};
function adviesLaad(k,f){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?f:v; }catch(_){ return f; } }
function adviesBewaar(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }
function adviesShiftKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function adviesWeghalenMin(n){ return n<=4?ADVIES_TIJDEN.weghalen4:ADVIES_TIJDEN.weghalen6; }
function adviesBijhalenMin(n){ return n<=4?ADVIES_TIJDEN.bijhalen4:ADVIES_TIJDEN.bijhalen6; }
function adviesFmtDuur(m){ const h=Math.floor(m/60),mm=m%60; return (h?h+'u ':'')+(mm?mm+'m':(h?'':'0m')); }

// Taken afleiden uit de actieve ritten. Per rit (= set aan een binnenbelader):
// bijhalen (als de set er ligt maar nog niet op de lengte), laden (machinewerk),
// en weghalen (geladen set weg — urgent als de ophaalboot dreigt te wachten).
/* Een zelfvarend schip, geen duwbak: de bak komt op eigen naam aan én vertrekt
   op eigen naam (baknaam = aankomstboot = vertrekboot). Zulke schepen varen zelf
   voor de wal — die slepen wij niet. Niet op naam-patroon filteren (dat ging in
   1.171 mis op echte baknamen), maar op deze relatie in de data. shipNamesMatch
   vangt schrijfwijzen af. */
function rijIsZelflader(trip, r){
  if(!(r && r.leichter && r.ankunftsboot && trip.schubboot)) return false;
  /* Een zelflader met een tweede romp heet "Schip II" of "Schip 2" op de bak
     (Themhof 2 van het KVB bijvoorbeeld), terwijl aankomst- en vertrekboot
     gewoon "Schip" heten. Alleen een los Romeins of Arabisch cijfer aan het
     eind telt mee — shipNamesMatch wijst de stomp ("VH" zonder nummer) alsnog
     af tegen een echte duwboot, dus "VH 116" blijft geen "VH 11". */
  const namen = [r.leichter, r.leichter.replace(/\s+(?:[IVX]+|\d+)$/i, '')];
  if(namen.some(n => shipNamesMatch(n, r.ankunftsboot) && shipNamesMatch(n, trip.schubboot))) return true;
  /* Een scheepsnaam van twee woorden ("Michael Angelo", "La Primavera") loopt in de PDF over
     twee regels en komt binnen als twee losse bakken: "Michael" en "Angelo". Elk stuk is dan
     een woord van de aankomstboot én van de vertrekboot. Een echte duwbak ("VH 74") is nooit
     een woord van de naam van het schip waarmee hij komt. */
  const woorden = t => normalizeBargeName(t).split(' ');
  const stuk = woorden(r.leichter);
  return stuk.every(w => woorden(r.ankunftsboot).includes(w) && woorden(trip.schubboot).includes(w));
}

function adviesTaken(active, shiftKey){
  const taken=[];
  /* Onze eigen bakken staan op de VH- of HGK-lijst. Een bak die op geen van beide staat is van een
     ander (bijvoorbeeld een tweede bak die bij een externe zelflader hoort) en krijgt geen taak.
     Alleen als beide lijsten zijn ingelezen: anders is "niet op de lijst" geen bewijs, en zou elke
     bak wegvallen. Wat op deze manier wegvalt, staat onder de lijst (taken.overgeslagen), zodat een
     verouderde lijst niet ongemerkt een echte bak laat verdwijnen. */
  const lijsten=vhBakken.length>0&&hgkBakken.length>0;
  const opLijst=new Set();
  if(lijsten) [...vhBakken,...hgkBakken].forEach(v=>{ if(v&&v.naam) bargeSleutels(v.naam).forEach(k=>opLijst.add(k)); });
  const overgeslagen=new Set();
  active.forEach(trip=>{
    // Alleen duwbakken: zelfvarende schepen eruit (zie rijIsZelflader).
    const duwbakRows=(trip.rows||[]).filter(r=>{
      if(!r.leichter||isDummyName(r.leichter)||rijIsZelflader(trip,r)) return false;
      if(lijsten&&!bargeSleutels(r.leichter).some(k=>opLijst.has(k))){ overgeslagen.add(r.leichter); return false; }
      return true;
    });
    const namen=[...new Set(duwbakRows.map(r=>r.leichter))];
    if(!namen.length) return;           // niets voor ons te doen op deze rit
    const n=namen.length;
    const nummers=namen.join(', ');
    const boten=vertrekbotenVoorTrip(trip);
    const bootTxt=boten.length?` → ${boten.join(' / ')}`:'';
    const t=computeTripTimes(trip);
    const pb=planMs(trip.planbegin), pe=planMs(trip.planeinde);
    const machine=trip.station||'Overig';
    const mk=(type,titel,min,tijd,extra={})=>taken.push({ id:`${shiftKey}::${trip.id}::${type}`, tripId:trip.id, machine, type, titel, sub:(trip.liegeplaats||trip.station||''), min, tijd: tijd==null?0:tijd, ...extra });
    // Laden zelf doet de belader, niet wij — daarom geen laadtaak. Wij brengen
    // alleen de lege set bij (bijhalen) en halen de volle set weg (weghalen).
    if(trip.aangemeerd && !trip.klaarOmTeLaden)
      mk('bijhalen', `${n}x leeg bij: ${nummers}${bootTxt}`, adviesBijhalenMin(n), (pb!=null? pb - adviesBijhalenMin(n)*60000 : (t.aankomstMs||0)));
    mk('weghalen', `${n}x vol weg: ${nummers}${bootTxt}`, adviesWeghalenMin(n), (pe!=null?pe:0), { vertrekMs:t.vertrekMs||null, vertrekDisplay:t.vertrekDisplay });
  });
  taken.overgeslagen=[...overgeslagen];
  return taken;
}

/* Ongedaan maken voor dit tabblad. De statussen en de volgorde staan los van de
   planning in hun eigen opslag, dus ook los van "Ongedaan maken" in de topbalk:
   die draait de planning terug en laat deze lijst met rust. Alleen in het geheugen,
   hoogstens 20 stappen. */
const advUndo = [];
function advOnthoud(omschrijving){
  advUndo.push({ omschrijving, status: adviesLaad(ADVIES_STATUS_KEY, {}), volgorde: adviesLaad(ADVIES_VOLGORDE_KEY, []) });
  if(advUndo.length > 20) advUndo.shift();
}
function advHerstel(){
  const stap = advUndo.pop();
  if(!stap) return;
  adviesBewaar(ADVIES_STATUS_KEY, stap.status);
  adviesBewaar(ADVIES_VOLGORDE_KEY, stap.volgorde);
  render();
}

/* Taken verslepen. ids = de open taken in de volgorde waarin ze nu staan (de
   NU DOEN-tegel eerst). Met de muis of pen pak je een tegel overal, met een
   vinger alleen bij het ↕-handvat (anders scrolt de pagina niet meer). De tegel
   volgt de aanwijzer, een streep laat zien waar hij komt te staan, en bij de rand
   van het scherm scrolt de pagina mee. Het handvat werkt ook met de pijltjes
   omhoog en omlaag. verplaats(id, naarIndex) bewaart de nieuwe volgorde. */
function advKoppelSleep(wrap, ids, verplaats){
  const rijen = ids.map(id => wrap.querySelector('[data-taak-id="' + CSS.escape(id) + '"]'));
  let sl = null, scrollLus = 0;
  const doc = e => e.clientY + window.scrollY;

  const werkBij = () => {
    sl.rij.style.transform = 'translateY(' + (sl.laatsteY + window.scrollY - sl.y0) + 'px)';
    const anderen = rijen.filter((_, i) => i !== sl.van);
    let doel = 0;
    sl.midden.forEach((m, i) => { if(i !== sl.van && sl.laatsteY + window.scrollY > m) doel++; });
    sl.doel = doel;
    rijen.forEach(r => r && r.classList.remove('drop-voor', 'drop-na'));
    if(doel < anderen.length) anderen[doel].classList.add('drop-voor');
    else if(anderen.length) anderen[anderen.length - 1].classList.add('drop-na');
  };
  const scrolLus = () => {
    if(!sl || !sl.actief) return;
    const rand = 90;
    const stap = sl.laatsteY < rand ? -14 : sl.laatsteY > window.innerHeight - rand ? 14 : 0;
    if(stap){ window.scrollBy(0, stap); werkBij(); }
    scrollLus = requestAnimationFrame(scrolLus);
  };
  const stop = () => {
    cancelAnimationFrame(scrollLus);
    if(!sl) return;
    sl.rij.classList.remove('sleept'); sl.rij.style.transform = '';
    rijen.forEach(r => r && r.classList.remove('drop-voor', 'drop-na'));
    document.body.classList.remove('adv-sleept');
    sl = null;
  };

  wrap.addEventListener('pointerdown', e => {
    const rij = e.target.closest('.adv-taak:not(.dood)');
    if(!rij || (e.button != null && e.button !== 0)) return;
    const handvat = e.target.closest('.adv-sleep');
    if(!handvat && (e.target.closest('button, input, label') || e.pointerType === 'touch')) return;
    const van = ids.indexOf(rij.dataset.taakId);
    if(van < 0) return;
    sl = { van, rij, id: rij.dataset.taakId, y0: doc(e), laatsteY: e.clientY, actief: false,
           midden: rijen.map(r => { const b = r.getBoundingClientRect(); return b.top + window.scrollY + b.height / 2; }) };
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e => {
    if(!sl) return;
    sl.laatsteY = e.clientY;
    if(!sl.actief){
      if(Math.abs(doc(e) - sl.y0) < 6) return;
      sl.actief = true;
      sl.rij.classList.add('sleept');
      document.body.classList.add('adv-sleept');
      scrollLus = requestAnimationFrame(scrolLus);
    }
    werkBij();
    e.preventDefault();
  });
  wrap.addEventListener('pointerup', () => {
    if(!sl) return;
    const { actief, id, van, doel } = sl;
    stop();
    if(actief && doel !== van) verplaats(id, doel);
  });
  wrap.addEventListener('pointercancel', stop);

  wrap.addEventListener('keydown', e => {
    const handvat = e.target.closest && e.target.closest('.adv-sleep');
    if(!handvat || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    const van = ids.indexOf(handvat.dataset.id);
    const naar = van + (e.key === 'ArrowUp' ? -1 : 1);
    e.preventDefault();
    if(van < 0 || naar < 0 || naar >= ids.length) return;
    verplaats(handvat.dataset.id, naar);
  });
}

function renderAdviesTab(main, active){
  const nu=Date.now();
  const shiftKey=adviesShiftKey();
  const wind=!!adviesLaad(ADVIES_WIND_KEY,false);
  const statusAlle=adviesLaad(ADVIES_STATUS_KEY,{});
  const volgorde=adviesLaad(ADVIES_VOLGORDE_KEY,[]);

  let taken=adviesTaken(active, shiftKey);
  taken.forEach(t=>{
    t.status = statusAlle[t.id] === 'klaar' ? 'klaar' : 'open';   // 'over' (overslaan) bestaat niet meer
    // Duwboot dreigt te wachten: geladen set nog niet weg terwijl de ophaalboot
    // binnen een uur (of al) komt. Dan gaat de prioriteit daarnaartoe.
    t.urgent = t.type==='weghalen' && t.vertrekMs!=null && t.vertrekMs <= nu + 60*60000;
  });

  /* Volgnummers per dienst: chronologisch 1..N. Koppelt een blokje op de
     tijdlijn aan zijn tegel in de lijst, en het hoogste nummer = aantal
     handelingen in de dienst (KPI voor drukte). Elke dienst (07:00 / 19:00)
     begint weer bij 1 — de advieslijst is sowieso per dienst, dus dat gaat
     vanzelf. */
  taken.slice().sort((a,b)=>a.tijd-b.tijd).forEach((t,i)=>{ t.volgnr=i+1; });

  const open=taken.filter(t=>t.status==='open');
  const klaar=taken.filter(t=>t.status==='klaar');
  const rang=new Map(volgorde.map((id,i)=>[id,i]));
  open.sort((a,b)=>{
    const ra=rang.has(a.id), rb=rang.has(b.id);
    if(ra&&rb) return rang.get(a.id)-rang.get(b.id);   // handmatige volgorde (kapitein overrulet)
    if(ra!==rb) return ra?-1:1;
    if(a.urgent!==b.urgent) return a.urgent?-1:1;       // boot-wacht eerst
    return a.tijd-b.tijd;                               // anders op tijd (machines bezig houden)
  });

  const restMin=open.reduce((s,t)=>s+t.min,0);
  const klaarRond=new Date(nu+restMin*60000);
  const klaarRondTxt=String(klaarRond.getHours()).padStart(2,'0')+':'+String(klaarRond.getMinutes()).padStart(2,'0');

  const mChip=(m)=>`<span class="adv-mchip" style="background:${stationAccentColor(m)||'var(--teal)'}">${esc(m)}</span>`;

  function taakRij(t, isNu){
    const ty=ADVIES_TYPE[t.type]||ADVIES_TYPE.verhalen;
    const dood = t.status!=='open';
    const cls=['adv-taak', isNu?'nu':'', t.urgent&&t.status==='open'?'urgent':'', dood?'dood':''].filter(Boolean).join(' ');
    const ctrl = dood
      ? `<button data-adv="terug" data-id="${t.id}" title="Terugzetten">↩</button>`
      : `<button class="vink" data-adv="klaar" data-id="${t.id}" title="Klaar" aria-label="Klaar">✓</button>
         <button class="adv-sleep" data-adv="sleep" data-id="${t.id}" title="Slepen naar een andere plek, of pijl omhoog en omlaag" aria-label="Verplaats deze taak: sleep, of gebruik pijl omhoog en omlaag">↕</button>`;
    const wacht = (t.urgent && t.status==='open') ? `<span class="adv-wacht" title="Ophaalboot ${esc(t.vertrekDisplay||'')}">boot wacht</span>` : '';
    return `<div class="${cls}" data-taak-id="${esc(t.id)}" style="--tc:${ty.kl}">
      ${isNu?'<span class="adv-nutag">NU DOEN</span>':''}
      <span class="adv-nr" title="Handeling ${t.volgnr} in deze dienst">${t.volgnr}</span>
      ${mChip(t.machine)}
      <span class="adv-ic">${ty.ic}</span>
      <div class="adv-body">
        <div class="adv-titel">${esc(t.titel)} ${wacht}</div>
        ${t.sub?`<div class="adv-sub2">${esc(t.sub)}</div>`:''}
      </div>
      <div class="adv-ctrl">${ctrl}</div>
    </div>`;
  }

  const wrap=document.createElement('div');
  wrap.className='adv-wrap';

  if(!active.length){
    wrap.innerHTML=`<div class="empty-state"><h2>Geen planning</h2>
      <p>Importeer een planlijst-PDF; de taken worden daaruit opgebouwd.</p></div>`;
    main.appendChild(wrap); return;
  }

  const nuTaak=open[0]||null;
  const rest=open.slice(1);

  // Tijdlijnbalk: de openstaande taken op de dienstklok — de dienst 07:00–19:00
  // plus 2 uur ervoor en 2 uur erna (05:00–21:00). Elke taak op zijn eigen tijd;
  // taken die op hetzelfde moment vallen komen onder elkaar (eigen rijtje).
  function taakTijdlijn(){
    const H=3600000, hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
    const dStart=new Date(nu); dStart.setHours(7,0,0,0);
    const dEind=new Date(nu); dEind.setHours(19,0,0,0);
    const start=dStart.getTime()-2*H, eind=dEind.getTime()+2*H, range=eind-start;
    /* Zelfde datum-negeer-verschuiving als de laadvolgorde (🔧-testknop): schuif
       de taaktijden met hele dagen zodat ze in het dienstvenster van vandaag
       vallen — zo is de balk ook te zien met planning van een andere dag. In
       echt gebruik (planning van vandaag) is de verschuiving 0. */
    let advShift=0;
    if(lvTestNegeerDatum && open.length){
      const dag=24*H, vroegste=Math.min(...open.map(t=>t.tijd));
      advShift=Math.round((start-vroegste)/dag)*dag;
    }
    const tTijd=t=>t.tijd+advShift;
    const items=open.filter(t=>tTijd(t)>=start && tTijd(t)<=eind);
    // Ook tonen als er niets (meer) openstaat: de dienstklok met de nu-lijn geeft
    // op zichzelf al overzicht; een lege balk is beter dan geen balk.
    // Rij-indeling: één duwboot doet één taak tegelijk, dus taken die elkaar in
    // de tijd overlappen mogen niet over elkaar heen — leg ze op de eerste vrije
    // rij (greedy). Zo blijft elke taak leesbaar en zie je botsingen meteen.
    const laneEinde=[];
    items.slice().sort((a,b)=>tTijd(a)-tTijd(b)).forEach(t=>{
      const b=tTijd(t), e=tTijd(t)+Math.max(5,t.min)*60000;
      let l=laneEinde.findIndex(x=>x<=b);
      if(l===-1){ l=laneEinde.length; laneEinde.push(e); } else laneEinde[l]=e;
      t._lane=l;
    });
    const H_RIJ=26, GAP=3, lanes=Math.max(1,laneEinde.length);
    const spoorH=lanes*(H_RIJ+GAP)-GAP+8;
    let as='';
    for(let ms=start; ms<=eind+1; ms+=2*H){
      const pct=((ms-start)/range)*100, uur=new Date(ms).getHours();
      const tr= pct>97?'translateX(-100%)':(pct<3?'translateX(0)':'translateX(-50%)');
      as+=`<div class="merk${(uur===7||uur===19)?' dienst':''}" style="left:${pct}%;transform:${tr}">${String(uur).padStart(2,'0')}:00</div>`;
    }
    const dLeft=((dStart.getTime()-start)/range)*100, dW=((dEind.getTime()-dStart.getTime())/range)*100;
    const nuPct=((nu-start)/range)*100;
    const nuHtml=(nuPct>=0&&nuPct<=100)?`<div class="adv-tl-nu" style="left:${nuPct}%"></div>`:'';
    const blokken=items.map(t=>{
      const ty=ADVIES_TYPE[t.type]||ADVIES_TYPE.verhalen;
      const left=((tTijd(t)-start)/range)*100, width=Math.max(1.8,((Math.max(5,t.min)*60000)/range)*100);
      const top=4+t._lane*(H_RIJ+GAP);
      const cls=['adv-tl-blok', t.urgent?'urgent':''].filter(Boolean).join(' ');
      return `<button type="button" class="${cls}" data-adv-nr="${esc(t.id)}" style="left:${left}%;width:${width}%;top:${top}px;height:${H_RIJ}px;bottom:auto;--tc:${ty.kl}" title="${t.volgnr}. ${esc(t.titel)} · ${hhmm(tTijd(t))} · ${adviesFmtDuur(t.min)}"><span class="adv-tl-nr">${t.volgnr}</span></button>`;
    }).join('');
    const leeg = items.length ? '' : `<div class="adv-tl-leeg">Geen openstaande taken in deze dienst</div>`;
    return `<div class="adv-tl">
      <div class="adv-tl-as">${as}</div>
      <div class="adv-tl-spoor" style="height:${spoorH}px">
        <div class="adv-tl-dienst" style="left:${dLeft}%;width:${dW}%"></div>
        ${nuHtml}${blokken}${leeg}
      </div>
    </div>`;
  }

  wrap.innerHTML=`
    <div class="adv-kop">
      <div>
        <h2>Taken voor de havenduwboot</h2>
        <div class="adv-sub">Werkvolgorde · dienst 07:00 – 19:00</div>
      </div>
      <div class="adv-voortgang">
        <div><b>${klaar.length} / ${taken.length}</b><span class="k">taken klaar</span></div>
        <div><b>~${adviesFmtDuur(restMin)}</b><span class="k">werk resterend</span></div>
        <div><b>${klaarRondTxt}</b><span class="k">klaar rond</span></div>
      </div>
      <button type="button" class="btn btn-secondary adv-undo" id="advUndo"${advUndo.length ? ' title="Ongedaan maken: ' + esc(advUndo[advUndo.length - 1].omschrijving) + '"' : ' hidden'}>↺ Ongedaan maken</button>
      <label class="adv-wind ${wind?'aan':''}">
        <input type="checkbox" id="adviesWind" ${wind?'checked':''}> Wind ≥ 6 Bft
      </label>
    </div>
    ${wind?`<div class="adv-assist">🆘 <b>Wind ≥ 6 Bft — assisteer eerst de duwboten.</b> Dat gaat vóór alle taken hieronder; de kapitein bepaalt wanneer de gewone volgorde weer oppakt.</div>`:''}
    ${taakTijdlijn()}
    ${nuTaak?taakRij(nuTaak,true):`<div class="adv-leeg">Alle taken zijn klaar. 🎉</div>`}
    <div class="adv-lijst">
      ${rest.map(t=>taakRij(t,false)).join('')}
      ${klaar.length?`<div class="adv-groep">Klaar</div>`+klaar.map(t=>taakRij(t,false)).join(''):''}
    </div>
    ${taken.overgeslagen&&taken.overgeslagen.length?`<div class="adv-noot adv-overgeslagen">Niet meegeteld, want niet op de VH- of HGK-lijst: <b>${esc(taken.overgeslagen.slice(0,12).join(', '))}${taken.overgeslagen.length>12?` en ${taken.overgeslagen.length-12} meer`:''}</b>. Klopt dat niet, lees dan de lijst opnieuw in.</div>`:''}
    <div class="adv-noot">Alleen onze taken staan hier — laden doet de belader. Tijden uit de standaard (set van 4 weg 45 min · set van 6 weg 1 u · set van 4 bijhalen 20 min · set van 6 bijhalen 30 min · losse bak verhalen 15 min). De kapitein beslist: ✓ afvinken · ↕ slepen naar een andere plek (of pijl omhoog en omlaag) · ↺ ongedaan maken.</div>`;

  main.appendChild(wrap);

  wrap.querySelector('#adviesWind').addEventListener('change', (e)=>{
    adviesBewaar(ADVIES_WIND_KEY, e.target.checked); render();
  });
  wrap.querySelectorAll('[data-adv]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id=btn.dataset.id, actie=btn.dataset.adv;
      if(actie==='sleep') return;                    // verplaatsen gaat met slepen of de pijltjestoetsen
      const st=adviesLaad(ADVIES_STATUS_KEY,{});
      if(actie==='klaar'){ advOnthoud('taak afgevinkt'); st[id]='klaar'; adviesBewaar(ADVIES_STATUS_KEY,st); }
      else if(actie==='terug'){ advOnthoud('taak teruggezet'); delete st[id]; adviesBewaar(ADVIES_STATUS_KEY,st); }
      render();
    });
  });
  wrap.querySelector('#advUndo').addEventListener('click', advHerstel);
  advKoppelSleep(wrap, [nuTaak,...rest].filter(Boolean).map(t=>t.id), (id, naar)=>{
    const lijst=[nuTaak,...rest].filter(Boolean).map(t=>t.id);
    lijst.splice(lijst.indexOf(id),1); lijst.splice(naar,0,id);
    advOnthoud('taak verplaatst');
    adviesBewaar(ADVIES_VOLGORDE_KEY, lijst);
    render();
    document.querySelector('.adv-sleep[data-id="' + CSS.escape(id) + '"]')?.focus({ preventScroll:true });
  });

  // Een genummerd blokje op de tijdlijn springt naar zijn tegel in de lijst.
  wrap.querySelectorAll('[data-adv-nr]').forEach(blok=>{
    blok.addEventListener('click', ()=>{
      const rij=wrap.querySelector(`[data-taak-id="${CSS.escape(blok.dataset.advNr)}"]`);
      if(!rij) return;
      rij.scrollIntoView({ block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      rij.classList.remove('zoek-flits'); void rij.offsetWidth; rij.classList.add('zoek-flits');
      setTimeout(()=>rij.classList.remove('zoek-flits'), 1800);
    });
  });
}

/* ===== DASHBOARD (Overzicht) =====
   Nieuw tabblad, standaard geopend. Puur lezend: telt en leest `active`/
   `history` (al berekend in render()), `vhBakken`/`hgkBakken` en `actionLog`
   — dezelfde brondata als de rest van de app, maar hier nooit gewijzigd.
   Geen enkele bestaande functie is aangepast om dit tabblad te bouwen. */
// Welk 18-uurs venster de laadvolgorde toont: 0 = huidige dienst, ±1 per dienst
// (12 u). Blijft staan over re-renders (klok, wijziging), tot de knop 'Nu'.
let dashLaadDienstOffset = 0;
// ponytail: tijdelijke TESTKNOP in de laadvolgorde-kop. Staat hij aan, dan
// negeert de laadvolgorde de datum en legt elke rit op zijn tijd-van-de-dag in
// het huidige venster — zo zie je de laadvolgorde ook met planning van een
// andere dag. Alleen voor testen; dit blok + de knop weer weghalen als het af is.
let lvTestNegeerDatum = false;

function renderDashboardTab(main, active, history){
  const nu = Date.now();
  const wrap = document.createElement('div');
  wrap.className = 'dash-wrap';

  const bakkenInHaven = havenBakken().length;
  const openDiffs = computeDifferences().filter(d => !checkedDiffs[d.id] && d.type !== 'aankomsttijd').length;

  // Bakken, niet ritten: één rit is een heel duwstel, en "aangemeerd" alleen
  // zegt dus niets over hoeveel bakken er al liggen. bakkenInHaven (boven) is
  // dat totaal al; hier de twee plaatsen waar ze dan liggen (kade-weergave).
  const wachtrij = havenWachtrij();
  const bakkenMetPlek = havenBakkenMetPlek();
  const bakkenLeeg = bakkenMetPlek.filter(b => b.zone === 'leeg').length;
  const bakkenVol = bakkenMetPlek.filter(b => b.zone === 'vol').length;

  /* Op verzoek: 12-uurs diensten (07:00–19:00 en 19:00–07:00) i.p.v. een
     kalenderdag. huidigeDienst() bepaalt eerst vandaag 07:00 en 19:00, en
     kijkt dan in welk van de drie mogelijke blokken "nu" valt: overdag
     (tussen die twee), of 's nachts (vóór 07:00, dus nog de dienst van
     gisterenavond; of ná 19:00, de dienst tot morgenvroeg). */
  function huidigeDienst(ms){
    const d = new Date(ms);
    const start0700 = new Date(d); start0700.setHours(7,0,0,0);
    const start1900 = new Date(d); start1900.setHours(19,0,0,0);
    if(ms < start0700.getTime()){
      const vorige1900 = new Date(start1900); vorige1900.setDate(vorige1900.getDate() - 1);
      return { start: vorige1900.getTime(), eind: start0700.getTime() };
    }
    if(ms < start1900.getTime()) return { start: start0700.getTime(), eind: start1900.getTime() };
    const volgende0700 = new Date(start0700); volgende0700.setDate(volgende0700.getDate() + 1);
    return { start: start1900.getTime(), eind: volgende0700.getTime() };
  }
  const dienstNu = huidigeDienst(nu);
  const dienstVolgende = { start: dienstNu.eind, eind: dienstNu.eind + (dienstNu.eind - dienstNu.start) };
  let aankomstenDienstNu = 0, aankomstenDienstVolgende = 0;
  const tijdlijnEvents = [];
  active.forEach(t => {
    const tijden = computeTripTimes(t);
    if(tijden.aankomstMs){
      if(tijden.aankomstMs >= dienstNu.start && tijden.aankomstMs < dienstNu.eind) aankomstenDienstNu++;
      else if(tijden.aankomstMs >= dienstVolgende.start && tijden.aankomstMs < dienstVolgende.eind) aankomstenDienstVolgende++;
    }
    if(tijden.aankomstMs && !t.aangemeerd) tijdlijnEvents.push({ ms: tijden.aankomstMs, soort: 'aankomst', trip: t });
    if(tijden.vertrekMs) tijdlijnEvents.push({ ms: tijden.vertrekMs, soort: 'vertrek', trip: t });
  });
  tijdlijnEvents.sort((a,b) => a.ms - b.ms);
  // Op verzoek twee eigen lijstjes i.p.v. één gemengde tijdlijn — dan hoeft
  // een badge er niet meer bij te vertellen wat voor moment het is.
  const aankomstLijst = tijdlijnEvents.filter(e => e.soort === 'aankomst' && e.ms >= nu - 3600000).slice(0, 6);
  const vertrekLijst = tijdlijnEvents.filter(e => e.soort === 'vertrek' && e.ms >= nu - 3600000).slice(0, 6);

  // Rijen voor de aankomst- en de vertrekkolom delen dezelfde opmaak; alleen
  // welke lijst erin gaat verschilt. Geen badge meer nodig — welke kolom het
  // is zegt al genoeg.
  function dashTijdlijnRijen(lijst){
    if(!lijst.length) return `<div class="dash-empty">Niets gepland op dit moment.</div>`;
    return lijst.map(e => `
      <div class="dash-tl-row">
        <div class="dash-tl-time">${fmtDateTime(e.ms)}</div>
        <div class="dash-tl-dot" style="background:${esc(stationAccentColor(e.trip.station) || 'var(--teal)')}"></div>
        <div class="dash-tl-body">
          <div class="naam">${esc(verkortSchipnaam(e.trip.schubboot) || '—')}</div>
          <div class="meta">${esc(e.trip.station || 'Overig')} · ${esc(e.trip.liegeplaats || '—')}</div>
        </div>
      </div>`).join('');
  }

  /* ── Kade-weergave ──────────────────────────────────────────────────
     Alles hierboven is al geteld; dit zet dezelfde bakken alleen op hun plek.
     Net als bij renderCard geldt: reken hier niets opnieuw uit wat boven al
     staat, anders lopen de twee weergaven na verloop van tijd uiteen.

     Wat er wél bijkomt is de indeling zelf: welke bak ligt op welke kolom van
     welke laadlengte. Dat komt uit dezelfde bakkenMetPlek die de bezetting
     hierboven al gebruikt, en uit de lengtes van de zone — dus als de haven
     verbouwd wordt, verhuist dit beeld vanzelf mee. */
  /* Hoe diep een kolom getekend wordt. Bewust géén vast getal: de haven kent
     geen harde capaciteit per plek — HAVEN_KADES noemt de kade "twee diep",
     maar in de praktijk liggen er vier achter elkaar. Een verzonnen maximum
     zou dus vrije ruimte tonen die er niet is. Daarom de diepste kolom die er
     nú ligt, met twee als ondergrens. De lege plekken die je dan ziet zeggen
     "hier ligt minder dan bij de buren" — en dat klopt altijd. */
  function kadeDiepte(ligplaatsen){
    return Math.max(2, ...ligplaatsen.flatMap(lp => lp.kolommen.map(k => k.length)));
  }

  function kadeLigplaatsenVanZone(zoneId){
    const zone = havenZone(zoneId);
    if(!zone || !zone.lengtes) return [];
    // Per laadlengte: de kolommen die eronder vallen, en per kolom de bakken
    // op volgorde van rij. Zo staat het ook in de haventekening.
    return zone.lengtes.slice().sort((a,b) => a.vanKolom - b.vanKolom).map(l => {
      /* Met stappen van twee, niet van één. Het raster telt in halve
         baklengtes (HALVE_BAK_M), dus een bak beslaat twee kolommen en ligt
         altijd op de even kolom vanaf het begin van zijn laadlengte. Tel je
         per kolom, dan komt er tussen elke twee bakken een plek te staan
         waar nooit iets kan liggen — en dan lijkt de kade half leeg terwijl
         hij vol is. */
      const kolommen = [];
      for(let k = l.vanKolom; k < l.vanKolom + l.kolommen; k += 2){
        const inKolom = bakkenMetPlek
          .filter(b => b.zone === zoneId && b.plek && b.plek.kol === k)
          .sort((a,b) => a.plek.rij - b.plek.rij);
        // Een kolom zonder bakken hoort er wél bij: dat je hem leeg ziet ís
        // de informatie. Alleen een laadlengte zonder enige kolom valt af.
        kolommen.push(inKolom);
      }
      return {
        naam: `${l.station ? l.station + ' ' : ''}${l.nummer}e`,
        kolommen
      };
    }).filter(lp => lp.kolommen.length);
  }

  function kadeBakHtml(naam, kleur, vracht){
    const stel = kleur ? `<span class="stel" style="background:${esc(kleur)}"></span>` : '';
    const wat = vracht === 'leeg' ? 'leeg' : vracht === 'vol' ? 'geladen' : 'aan de kade';
    return `<div class="kade-bak" data-vracht="${vracht}" title="${esc(naam)} — ${wat}">
              ${stel}<span class="laag"></span><span class="nr">${esc(naam)}</span>
            </div>`;
  }

  function kadeLigplaatsHtml(lp, vracht, diepte){
    return `
      <div class="kade-ligplaats">
        <div class="naam">${esc(lp.naam)}</div>
        <div class="kade-kolommen">
          ${lp.kolommen.map(kol => `
            <div class="kade-kolom">
              ${kol.map(b => kadeBakHtml(b.naam, b.kleur, vracht)).join('')}
              ${Array.from({length: Math.max(0, diepte - kol.length)},
                           () => '<div class="kade-vrij"></div>').join('')}
            </div>`).join('')}
        </div>
      </div>`;
  }

  // De twee bakkenplaatsen liggen niet op laadlengtes maar in een vrij raster;
  // die verdelen we gewoon over kolommen van dezelfde diepte.
  const KADE_PLAATS_PER_KOLOM = 5;
  function kadePlaatsLigplaats(zoneId, label){
    const erin = bakkenMetPlek.filter(b => b.zone === zoneId && b.plek)
      .sort((a,b) => (a.plek.kol - b.plek.kol) || (a.plek.rij - b.plek.rij));
    const kolommen = [];
    for(let i = 0; i < erin.length; i += KADE_PLAATS_PER_KOLOM){
      kolommen.push(erin.slice(i, i + KADE_PLAATS_PER_KOLOM));
    }
    if(!kolommen.length) kolommen.push([]);
    return { naam: label, kolommen };
  }

  // ── Laadvolgorde per binnenbelader: één rij per B-machine over 18 u ──
  const LV_UUR = 3600000, LV_VENSTER_UREN = 18;
  const lvDienstStart = huidigeDienst(nu).start;
  const lvStart = lvDienstStart + dashLaadDienstOffset * 12 * LV_UUR;
  const lvEind = lvStart + LV_VENSTER_UREN * LV_UUR;
  const lvRange = lvEind - lvStart;
  // MB1 is de reservemachine: alleen een rij als er echt iets op staat.
  const LV_MACHINES = ['B2', 'B3', 'B4'].concat(active.some(t => t.station === 'MB1') ? ['MB1'] : []);
  const LV_DAGEN = ['zo','ma','di','wo','do','vr','za'];
  const lvTijdLabel = ms => { const d = new Date(ms); return `${LV_DAGEN[d.getDay()]} ${String(d.getHours()).padStart(2,'0')}:00`; };
  const lvDuur = u => Number.isInteger(u) ? u + 'u' : u.toFixed(1).replace('.', ',') + 'u';

  // Label = baknaam: eerste echte bak + aantal extra (set). Geen bak? val terug
  // op de duwbootnaam.
  function lvBakLabel(t){
    const namen = [...new Set((t.rows || []).map(r => r.leichter).filter(n => n && !isDummyName(n)))];
    if(!namen.length){ const s = verkortSchipnaam(t.schubboot) || '—'; return { kort: s, vol: s }; }
    return { kort: namen[0] + (namen.length > 1 ? ` +${namen.length - 1}` : ''), vol: namen.join(' · ') };
  }

  // Trips met een laadvenster, per B-machine, gesorteerd; botsing = overlap op
  // dezelfde machine (één machine laadt er één tegelijk).
  const lvPerMachine = {};
  LV_MACHINES.forEach(m => lvPerMachine[m] = []);
  /* TEST-modus: negeer de kálenderdatum, maar hou de onderlinge dag/tijd-
     structuur intact. We verschuiven de héle planning met een vast aantal hele
     dagen, zodat de vroegste rit in het huidige venster valt. Zo blijven echte
     botsingen echt en verdwijnen de schijn-botsingen die ontstonden toen elke
     rit los op één dag werd gestapeld. (Tijd-van-de-dag blijft gelijk; met
     ◀ ▶ blader je door de dagen van de planning.) */
  let lvTestShift = 0;
  if(lvTestNegeerDatum){
    const starts = active.map(t => planMs(t.planbegin)).filter(x => x != null);
    if(starts.length){
      const dag = 24 * LV_UUR;
      lvTestShift = Math.round((lvStart - Math.min(...starts)) / dag) * dag;
    }
  }
  active.forEach(t => {
    let b = planMs(t.planbegin), e = planMs(t.planeinde);
    if(b == null || e == null || e <= b) return;
    if(!lvPerMachine[t.station]) return;           // alleen B2/B3/B4 (en MB1 als die in gebruik is)
    if(lvTestNegeerDatum){ b += lvTestShift; e += lvTestShift; }
    lvPerMachine[t.station].push({ t, b, e });
  });
  LV_MACHINES.forEach(m => {
    const lijst = lvPerMachine[m].sort((a, z) => a.b - z.b);
    lijst.forEach((x, i) => { x.bots = lijst.some((o, j) => j !== i && o.b < x.e && o.e > x.b); });
  });

  // Tijd-as: label elke 6 u (07:00/19:00 vet als dienstgrens).
  let lvAsHtml = '';
  for(let ms = lvStart; ms <= lvEind + 1; ms += 6 * LV_UUR){
    const pct = ((ms - lvStart) / lvRange) * 100, uur = new Date(ms).getHours();
    const tr = pct > 97 ? 'translateX(-100%)' : (pct < 3 ? 'translateX(0)' : 'translateX(-50%)');

// Groepeert ladingsregels met dezelfde baknaam (deellading: 1 bak met 2
// soorten lading, herkenbaar aan dezelfde baknaam die 2x in de tegel staat).
// Verandert niets aan trip.rows zelf — dat blijft de brondata voor matching,
// ruilen en tellingen — alleen de kaartweergave voegt ze samen tot 1 regel.
function parseMenge(s){
  if(!s) return null;
  const clean = s.toString().replace(/\./g, '').replace(',', '.').trim();
  const n = parseFloat(clean);
  return isNaN(n) ? null : n;
}

// Referentietonnage voor een tegel: het gemiddelde van de bakken die maar
// 1 soort lading hebben (geen deellading) — daarmee vergelijken we of een
// deellading-optelling ongeveer op 1 volle bak uitkomt.
function referenceTonnageForTrip(displayGroups){
  const singles = displayGroups
    .filter(g => g.rows.length === 1)
    .map(g => parseMenge(g.rows[0].menge))
    .filter(n => n != null);
  if(!singles.length) return null;
  return singles.reduce((a,b) => a+b, 0) / singles.length;
}

/* Welke bakken gaan straks samen de berg op?

   Dat staat in de VH/HGK-lijst: bakken met dezelfde vertrekgroep vertrekken
   met dezelfde duwboot. Elke groep heeft daar al een kleur, dezelfde die de
   haven gebruikt — een bak ziet er in de lijst dus net zo uit als op de kade.

   Elke set krijgt zijn kleur, ook als hij helemaal op één tegel ligt.

   Dat was eerst anders: alleen verdeelde sets kleurden, zodat de lijst rustig
   bleef. In de praktijk werkte dat averechts. Staan er twee sets op één tegel
   en ligt de ene wél verdeeld en de andere niet, dan kleurt de helft van de
   regels en de andere helft niet — zonder dat je kunt zien waarom. En klopt
   de indeling een keer niet, dan zag je dat zo juist níét: twee bakken die bij
   elkaar horen maar in verschillende groepen belanden vallen nu op doordat ze
   verschillende kleuren krijgen, in plaats van dat er eentje stilletjes grijs
   blijft.

   Geen kleur betekent daarmee nog maar één ding: deze bak staat niet in de
   VH/HGK-planning. */
function setInfoVoorTegel(trip, displayGroups){
  const eigenNamen = trip.rows.filter(r => r.leichter).map(r => r.leichter);
  const bekend = new Map();
  return displayGroups.map(g => {
    const r = g.rows[0];
    if(!r.leichter || isDummyName(r.leichter)) return null;
    const grp = getEffectiveGroupForRow(r);
    if(!grp) return null;
    if(!bekend.has(grp.key)){
      const samen = grp.list.filter(v => bakGroupKey(v, grp.source) === grp.key);
      const elders = samen.filter(s => !eigenNamen.some(n => bargeNamesMatch(s.naam, n)));
      bekend.set(grp.key, {
        key: grp.key,
        kleur: vhGroupColorMap.get(grp.key) || null,
        verdeeld: elders.length > 0,
        aantal: samen.length,
        elders: elders.length,
        boot: (samen.find(v => v.vertrekboot) || {}).vertrekboot || null
      });
    }
    return bekend.get(grp.key);
  });
}

/* De beugel langs de regels: bakken van dezelfde verdeelde set die hier onder
   elkaar staan, krijgen één doorlopend streepje. Zo zie je dat het om één
   groep gaat en niet om losse regels die toevallig dezelfde kleur hebben. */
function setBeugelKlassen(setInfo){
  return setInfo.map((s, i) => {
    if(!s || !s.kleur) return '';
    const zelfde = (x) => x && x.kleur && x.key === s.key;
    const voor = zelfde(setInfo[i-1]), na = zelfde(setInfo[i+1]);
    if(voor && na) return ' set-midden';
    if(voor) return ' set-eind';
    if(na) return ' set-begin';
    return ' set-alleen';
  });
}

function buildDisplayRowGroups(trip){
  const groups = [];
  const seenAt = new Map();
  trip.rows.forEach((r, idx) => {
    const key = (r.leichter && !isDummyName(r.leichter)) ? normalizeBargeName(r.leichter) : null;
    if(key && seenAt.has(key)){
      const g = groups[seenAt.get(key)];
      g.indices.push(idx);
      g.rows.push(r);
    } else {
      groups.push({ indices: [idx], rows: [r] });
      if(key) seenAt.set(key, groups.length - 1);
    }
  });
  return groups;
}

/* Een woord vóór elk verschil dat zegt wat voor soort het is, met de bijpassende
   status-label-kleur (hergebruikt van de tegels). De sleutel vóór de '|' in d.id
   bepaalt het soort. (1.236) */
function verschilSoort(d){
  const wat = String(d.id || '').split('|')[0];
  return ({
    teLaat:      ['te-laat', 'niet op tijd'],
    missingList: ['weg', 'niet in VH/HGK'],
    missingEecv: ['gewijzigd', 'niet op EECV'],
    eldersOpEecv:['kijk', 'laadt elders'],
    dubbelLijst: ['kijk', 'op beide lijsten']
  })[wat] || ['onderweg', 'verschil'];
}

    const soort = verschilSoort(d);
    div.innerHTML = `<label class="diff-vink" title="Verschil accepteren"><input type="checkbox" aria-label="Accepteren: ${esc(d.message)}"></label>
      <span class="status-label" data-status="${soort[0]}">${esc(soort[1])}</span>
      <div class="diff-message">${esc(d.message)}</div>
      ${d.tripId ? `<div class="diff-acties"><button type="button" class="diff-knop" data-actie="toon">Tegel</button></div>` : ''}`;
    // Een vinkje accepteert het verschil (zelfde als wegvegen). pointerdown niet
    // laten doorlopen naar de veeg-afhandeling eronder.
    const vink = div.querySelector('.diff-vink input');
    vink.addEventListener('pointerdown', e => e.stopPropagation());
    vink.addEventListener('change', () => { if(vink.checked) checkOffDifference(d); });
    div.querySelectorAll('.diff-knop').forEach(b => {
      b.addEventListener('pointerdown', e => e.stopPropagation());
      b.addEventListener('click', e => { e.stopPropagation(); snelzoekNaarTegel(d.tripId); });
    });
    wrap.appendChild(div);
    main.appendChild(wrap);
    attachDiffSwipe(div, wrap, d);
  });

  if(openTijd.length){
    const details = document.createElement('details');
    details.style.cssText = 'margin-top:16px;';
    const summary = document.createElement('summary');
    summary.style.cssText = 'font-size:13px;color:var(--text-dim);font-weight:600;cursor:pointer;padding:6px 0;';
    summary.textContent = `Aankomsttijd-afwijkingen (${openTijd.length}) — meestal niet relevant`;
    details.appendChild(summary);
    openTijd.forEach(d => {
      const div = document.createElement('div');
      div.className = 'hist-item';
      div.style.cssText = 'margin-top:6px;';
      div.innerHTML = `<div class="hist-meta">${esc(d.message)}</div>`;
      details.appendChild(div);
    });
    main.appendChild(details);
  }

  if(checkedIds.length){
    const checkedHeader = document.createElement('div');
    checkedHeader.style.cssText = 'font-size:13px;color:var(--text-dim);font-weight:600;margin:20px 0 8px 0;';
    checkedHeader.textContent = `Afgevinkt (${checkedIds.length})`;
    main.appendChild(checkedHeader);
    checkedIds
      .sort((a,b) => (checkedDiffs[b].checkedAt||0) - (checkedDiffs[a].checkedAt||0))
      .forEach(id => {
        const c = checkedDiffs[id];
        const div = document.createElement('div');
        div.className = 'hist-item';
        div.style.opacity = '0.6';
        div.innerHTML = `<div class="hist-meta">✓ ${esc(c.message)}</div>
          <button type="button" class="hist-restore" data-id="${esc(id)}" style="margin-top:6px;">Weer openzetten</button>`;
        main.appendChild(div);
      });
    main.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', () => uncheckDifference(el.dataset.id));
    });
  }
}

/* ── De greep op een aanwijzer ────────────────────────────────
   Alle drie de swipes hieronder doen hetzelfde: bij het neerzetten van een
   vinger de aanwijzer aan het element vastknopen, zodat pointermove en
   pointerup daar blijven landen ook als de vinger er allang naast zit.
   Daarmee mogen de luisteraars op het element staan in plaats van op window,
   en dat is het hele punt — zie de uitleg onderaan attachSwipe.

   Beide functies kunnen gooien: een aanwijzer die niet meer bestaat is geen
   geldige id meer. Vandaar dezelfde try/catch als bij de scrollduim van de
   Onderweg-kolom en bij de haventekening. */
function pakGreep(el, id){
  try{ el.setPointerCapture(id); }catch(_){}
}
function laatGreepLos(el, id){
  try{ if(el.hasPointerCapture(id)) el.releasePointerCapture(id); }catch(_){}
}

// Swipe naar rechts om een verschil af te vinken — zelfde gebaar als bij het
// afronden van een rit, maar dan voor een regel in de Verschillen-lijst.
function attachDiffSwipe(item, wrap, diff){
  let startX=0, startY=0, dx=0, dragging=false, locked=null, aanwijzer=null;
  const bgEl = wrap.querySelector('.hist-bg-check');

  function onDown(e){
    // Ligt er al een vinger op deze regel én heeft die de greep nog, dan is
    // dit een tweede vinger en negeren we hem.
    if(aanwijzer !== null && item.hasPointerCapture(aanwijzer)) return;
    aanwijzer = e.pointerId;
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; locked = null;
    item.classList.add('dragging');
    pakGreep(item, e.pointerId);
  }
  function onMove(e){
    if(!dragging || e.pointerId !== aanwijzer) return;
    const ddx = e.clientX - startX;
    const ddy = e.clientY - startY;
    if(locked === null){
      locked = Math.abs(ddx) > Math.abs(ddy) + 4 ? 'x' : (Math.abs(ddy) > 4 ? 'y' : null);
    }
    if(locked === 'y'){
      // Verticaal is scrollen. Greep meteen teruggeven, anders blijft deze
      // regel tot het loslaten alle aanwijsberichten opslokken.
      dragging = false; item.classList.remove('dragging');
      laatGreepLos(item, aanwijzer); aanwijzer = null;
      return;
    }
    if(locked === 'x'){
      if(e.cancelable) e.preventDefault();
      dx = Math.max(0, ddx);
      if(bgEl) bgEl.style.opacity = dx > 0 ? '1' : '0';
      item.style.transform = `translateX(${dx}px)`;
      item.style.opacity = String(1 - Math.min(dx / 300, 0.5));
    }
  }
  function onUp(e){
    if(e.pointerId !== aanwijzer) return;
    aanwijzer = null;
    if(!dragging) return;
    dragging = false;
    item.classList.remove('dragging');
    const threshold = Math.min(140, item.offsetWidth * 0.35);
    if(dx > threshold){
      item.style.transform = 'translateX(110%)';
      item.style.opacity = '0';
      setTimeout(() => checkOffDifference(diff), 180);
    } else {
      item.style.transform = 'translateX(0)';
      item.style.opacity = '';
      if(bgEl) bgEl.style.opacity = '';
    }
  }

  // Zie attachSwipe: alleen pointer-events, en op het element zelf.
  item.addEventListener('pointerdown', onDown);
  item.addEventListener('pointermove', onMove);
  item.addEventListener('pointerup', onUp);
  item.addEventListener('pointercancel', onUp);
}

        </div>
      </div>
      <div style="margin-top:12px;">
        <!-- Geen <label>: dat kan een knop niet benoemen. De kleurknoppen dragen
             hun eigen naam al via aria-label; wat ontbrak was een naam voor de
             groep als geheel. -->
        <div id="accentLabel" style="font-size:13px;color:var(--text-dim);margin-bottom:6px;">Hoofdkleur</div>
        <div role="group" aria-labelledby="accentLabel" style="display:flex;gap:8px;flex-wrap:wrap;">
          ${Object.entries(ACCENTEN).map(([sleutel, a]) => {

        </label>
      </div>
      <div style="margin-top:12px;">
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:4px;">Achtergrondkleur</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
            <input type="color" id="bgKleurDonker" value="${esc(s.bgKleurDonker || '#0D1620')}"
                   style="width:38px;height:28px;padding:0;border:0;background:none;cursor:pointer;">
            donkere modus
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
            <input type="color" id="bgKleurLicht" value="${esc(s.bgKleurLicht || '#F4F5F6')}"
                   style="width:38px;height:28px;padding:0;border:0;background:none;cursor:pointer;">
            lichte modus

                  style="padding:4px 10px;font-size:12px;">Standaard</button>

        </div>
      </div>
      <div style="margin-top:12px;">
        <label for="darkSlider" style="font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:4px;">
          <span>Donkerte achtergrond (donkere modus)</span>

          <span id="bgGraySliderWaarde" style="font-family:'JetBrains Mono',monospace;color:var(--text);"></span>
        </label>
        <div style="display:flex;align-items:center;gap:10px;">
          <input type="range" id="bgGraySlider" min="0" max="30" value="${s.lightBgGray ?? (s.lightGray ?? 6)}" style="flex:1;">
          <span id="bgGraySliderPreview" class="instelling-preview" aria-hidden="true" title="Zo ziet de pagina-achtergrond eruit in lichte modus, ongeacht welk thema nu actief is"></span>
        </div>
      </div>
      <div style="margin-top:12px;">
        <label for="tileGraySlider" style="font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:4px;">
          <span>Grijstint tegel (lichte modus)</span>
          <span id="tileGraySliderWaarde" style="font-family:'JetBrains Mono',monospace;color:var(--text);"></span>
        </label>
        <div style="display:flex;align-items:center;gap:10px;">
          <input type="range" id="tileGraySlider" min="0" max="30" value="${s.lightTileGray ?? (s.lightGray ?? 8)}" style="flex:1;">
          <span id="tileGraySliderPreview" class="instelling-preview" aria-hidden="true" title="Zo ziet een tegel eruit in lichte modus, ongeacht welk thema nu actief is"></span>
        </div>
      </div>
      <div style="margin-top:12px;">
        <label for="tegelZoomSlider" style="font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:4px;">
          <span>Vergroting bij tikken op een tegel (lege bakkenplaats)</span>
          <span id="tegelZoomSliderWaarde" style="font-family:'JetBrains Mono',monospace;color:var(--text);"></span>
        </label>
        <input type="range" id="tegelZoomSlider" min="120" max="400" step="20" value="${s.tegelZoomPercentage ?? 200}" style="width:100%;">
      </div>

        <button class="btn btn-secondary" id="changePinBtn">Pincode wijzigen</button>
      </div>`;
    gebrWrap.appendChild(panel);

    const pastelToggle = panel.querySelector('#pastelToggle');
    const darkSlider = panel.querySelector('#darkSlider');
    const bgGraySlider = panel.querySelector('#bgGraySlider');
    const tileGraySlider = panel.querySelector('#tileGraySlider');
    const tegelZoomSlider = panel.querySelector('#tegelZoomSlider');

    /* Een schuif zonder cijfer erbij liet je nooit de precieze stand zien —
       alleen "ergens tussen 6 en 24" op het oog. En omdat applyCurrentUserSettings()
       alleen de kleuren van het thema wijzigt waar je nú in zit, zag je bij de
       twee lichte-modus-schuiven in de donkere modus (verreweg de gewone stand)
       helemaal niets gebeuren. Dit blokje rekent daarom zelf, los van het
       actieve thema, uit hoe elke stand eruitziet — met dezelfde sommen als
       applyCurrentUserSettings — en toont dat als cijfer én als vlakje. */
    function verversPreviews(){
      panel.querySelector('#darkSliderWaarde').textContent = darkSlider.value;
      panel.querySelector('#bgGraySliderWaarde').textContent = bgGraySlider.value;
      panel.querySelector('#tileGraySliderWaarde').textContent = tileGraySlider.value;

      const l = Math.max(6, Math.min(24, +darkSlider.value));
      panel.querySelector('#darkSliderPreview').style.background = hslToHex(211, 24, l);

      const bgGray = Math.max(0, Math.min(30, +bgGraySlider.value));
      panel.querySelector('#bgGraySliderPreview').style.background =
        hslToHex(222, Math.min(bgGray, 18), Math.max(55, 97 - bgGray * 1.4));

      const tileGray = Math.max(0, Math.min(30, +tileGraySlider.value));
      panel.querySelector('#tileGraySliderPreview').style.background =
        hslToHex(222, Math.min(tileGray, 18), Math.max(50, 96 - tileGray * 1.4));

      panel.querySelector('#tegelZoomSliderWaarde').textContent = tegelZoomSlider.value + '%';
    }
    verversPreviews();
    [darkSlider, bgGraySlider, tileGraySlider, tegelZoomSlider].forEach(el => el.addEventListener('input', verversPreviews));

    /* De achtergrondkleur staat los van de schuiven: hij levert de tint, zij
       de lichtheid. Leeg betekent "de vaste tint van het thema" — daar zet de
       knop Standaard het ook weer op. Alle instellingen worden voortaan via
       één plek samengesteld, zodat een nieuw veld niet in het ene pad wel en
       in het andere niet meekomt. */
    const bgKleurDonker = panel.querySelector('#bgKleurDonker');
    const bgKleurLicht = panel.querySelector('#bgKleurLicht');
    let eigenBgDonker = (current.settings || {}).bgKleurDonker || '';
    let eigenBgLicht = (current.settings || {}).bgKleurLicht || '';
    const huidigeInstellingen = () => ({
      ...(current.settings || defaultUserSettings()),
      pastel: pastelToggle.checked,
      darkBgLightness: +darkSlider.value,
      lightBgGray: +bgGraySlider.value,
      lightTileGray: +tileGraySlider.value,
      tegelZoomPercentage: +tegelZoomSlider.value,
      bgKleurDonker: eigenBgDonker,
      bgKleurLicht: eigenBgLicht
    });

    async function saveSettings(){
      current.settings = huidigeInstellingen();
      await saveUsers();
      applyCurrentUserSettings();
      render();
    }
    // Tijdens het slepen meteen de kleuren bijwerken; pas bij loslaten opslaan
    // en opnieuw tekenen. Met alleen 'change' gebeurde er niets zolang je aan
    // het schuiven was, en dat voelt alsof de schuif niet werkt.
    function toonDirect(){
      current.settings = huidigeInstellingen();
      applyCurrentUserSettings();
    }

    /* Meteen meekijken terwijl je de kleur uitzoekt, en pas opslaan als je 'm
       loslaat — net als bij de schuiven.

       Er stond hier ook een contrastwaarschuwing, maar die kon nooit afgaan:
       de lichtheid komt van de schuiven, dus een kleurkeuze verschuift alleen
       de tint. Een onleesbare achtergrond is er zo niet mee te maken. Een
       controle die altijd goedkeurt is erger dan geen controle — die wekt de
       indruk dat er op gelet wordt. */
    bgKleurDonker.addEventListener('input', () => { eigenBgDonker = bgKleurDonker.value; toonDirect(); });
    bgKleurLicht.addEventListener('input', () => { eigenBgLicht = bgKleurLicht.value; toonDirect(); });
    [bgKleurDonker, bgKleurLicht].forEach(el => el.addEventListener('change', saveSettings));
    panel.querySelector('#bgKleurStandaard').addEventListener('click', async () => {
      eigenBgDonker = ''; eigenBgLicht = '';
      bgKleurDonker.value = '#0D1620';
      bgKleurLicht.value = '#F4F5F6';
      await saveSettings();
    });
    [darkSlider, bgGraySlider, tileGraySlider, tegelZoomSlider].forEach(el => {
      el.addEventListener('input', toonDirect);
      el.addEventListener('change', saveSettings);
    });
    pastelToggle.addEventListener('change', saveSettings);

    panel.querySelectorAll('.accent-knop').forEach(knop => {
      knop.addEventListener('click', async () => {
        current.settings = { ...(current.settings || defaultUserSettings()), accent: knop.dataset.accent };
        await saveUsers();
        applyCurrentUserSettings();
        render();
      });
    });

    // Thema per gebruiker: setTheme() schrijft de keuze naar deze (actieve)
    // gebruiker en past hem meteen toe.
    panel.querySelectorAll('.thema-knop').forEach(knop => {
      knop.addEventListener('click', () => setTheme(knop.dataset.thema));
    });

    panel.querySelector('#changePinBtn').addEventListener('click', () => openChangePinModal(current));
  }

  addBtn.addEventListener('click', async () => {
    const naam = await vraagTekst({
      titel: 'Nieuwe gebruiker',
      uitleg: 'Onder welke naam moet dit profiel in de lijst komen?',
      placeholder: 'bijv. Herman',
      bevestig: 'Aanmaken'
    });
    if(!naam) return;
    const user = {
      id: 'u_' + Date.now() + '_' + bytesNaarHex(crypto.getRandomValues(new Uint8Array(4))),
      naam: naam.trim().slice(0, 60),
      settings: defaultUserSettings(),
      pinIsStandaard: true
    };
    try{
      await setUserPin(user, '1234');
    }catch(e){
      console.error('Pincode instellen mislukt:', e);
      showToast('Deze browser ondersteunt het veilig opslaan van een pincode niet — gebruiker niet aangemaakt.');
      return;
    }
    users.push(user);
    // Is er nog niemand actief, dan wordt dit profiel het meteen. Anders maak je
    // een gebruiker aan, gebeurt er zichtbaar niets, en blijven de instellingen
    // verborgen tot je toevallig op "Wisselen" klikt.
    const wasNiemandActief = !getCurrentUser();
    if(wasNiemandActief) currentUserId = user.id;
    await saveUsers();
    pasGebruikersThemaToe();
    render();
    showToast(wasNiemandActief
      ? `"${user.naam}" aangemaakt en meteen actief. Standaardpincode 1234 — wijzig deze.`
      : `"${user.naam}" aangemaakt met standaardpincode 1234 — wijzig deze meteen.`);
  });
  main.querySelectorAll('.user-switch-btn').forEach(el => {
    el.addEventListener('click', () => {
      const target = users.find(u => u.id === el.dataset.id);
      if(target) openPinModal(target, async () => {
        currentUserId = target.id;
        await saveUsers();
        pasGebruikersThemaToe();
        render();
      });
    });
  });
  main.querySelectorAll('.user-delete-btn').forEach(el => {
    el.addEventListener('click', () => {
      const target = users.find(u => u.id === el.dataset.id);
      if(!target) return;
      openPinModal(target, async () => {
        users = users.filter(u => u.id !== target.id);
        if(currentUserId === target.id) currentUserId = null;
        await saveUsers();
        pasGebruikersThemaToe();
        render();
      });
    });
  });
}

      <label class="alleen-voorlezer" for="pinInput">Pincode</label>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="6" autocomplete="current-password" aria-describedby="pinError" placeholder="••••" style="width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);padding:12px;font-size:20px;letter-spacing:6px;text-align:center;">
      <div id="pinError" role="alert" style="color:var(--danger);font-size:13px;margin-top:8px;display:none;">Onjuiste pincode.</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelPin">Annuleren</button>
        <button class="btn btn-primary" id="confirmPin">Bevestigen</button>
      </div>
    </div>`;
  toonModal(bd);
  const input = document.getElementById('pinInput');
  const foutmelding = document.getElementById('pinError');
  const bevestigKnop = document.getElementById('confirmPin');
  input.focus();
  document.getElementById('cancelPin').addEventListener('click', closeModal);

  function toonFout(tekst){
    foutmelding.textContent = tekst;
    foutmelding.style.display = 'block';
    // Het veld zelf meldt dat er iets mis is; role="alert" op de melding zorgt
    // dat hij ook voorgelezen wordt in plaats van alleen rood te kleuren.
    input.setAttribute('aria-invalid', 'true');
  }

  let bezig = false;
  async function tryConfirm(){
    if(bezig) return;
    const rest = pinBlokkadeRest(user.id);
    if(rest > 0){
      toonFout(`Te veel pogingen. Probeer over ${rest} seconden opnieuw.`);
      return;
    }
    bezig = true;
    bevestigKnop.disabled = true;
    try{
      const goed = await verifyUserPin(user, input.value);
      if(goed){
        wisPinPogingen(user.id);
        closeModal();
        onSuccess();
        return;
      }
      registreerPinFout(user.id);
      const nieuweRest = pinBlokkadeRest(user.id);
      toonFout(nieuweRest > 0
        ? `Onjuiste pincode. Te veel pogingen — wacht ${nieuweRest} seconden.`
        : 'Onjuiste pincode.');
      input.value = '';
    }catch(e){
      console.error('Pincodecontrole mislukt:', e);
      toonFout('Pincode kan niet gecontroleerd worden in deze browser.');
    }finally{
      bezig = false;
      bevestigKnop.disabled = false;
    }
  }
  bevestigKnop.addEventListener('click', tryConfirm);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') tryConfirm(); });
}

function openChangePinModal(user){
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'modalBackdrop';
  bd.innerHTML = `<div class="modal">
      <h2>Pincode wijzigen</h2>
      <div class="sub">Kies een nieuwe pincode van 4 of 6 cijfers.</div>
      <input type="password" id="newPinInput" inputmode="numeric" maxlength="6" placeholder="Nieuwe pincode" style="width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);padding:12px;font-size:20px;letter-spacing:6px;text-align:center;">
      <div id="newPinError" style="color:var(--danger);font-size:13px;margin-top:8px;display:none;">Moet precies 4 of 6 cijfers zijn.</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelNewPin">Annuleren</button>
        <button class="btn btn-primary" id="confirmNewPin">Opslaan</button>
      </div>
    </div>`;
  toonModal(bd);
  document.getElementById('cancelNewPin').addEventListener('click', closeModal);
  document.getElementById('confirmNewPin').addEventListener('click', async () => {
    const val = document.getElementById('newPinInput').value;
    const fout = document.getElementById('newPinError');
    if(!/^\d{4}$|^\d{6}$/.test(val)){
      fout.textContent = 'Moet precies 4 of 6 cijfers zijn.';
      fout.style.display = 'block';
      return;
    }
    if(/^(\d)\1+$/.test(val) || val === '1234' || val === '123456'){
      fout.textContent = 'Kies een minder voor de hand liggende pincode.';
      fout.style.display = 'block';
      return;
    }
    try{
      await setUserPin(user, val);
      user.pinIsStandaard = false;
    }catch(e){
      console.error('Pincode instellen mislukt:', e);
      fout.textContent = 'Deze browser ondersteunt het veilig opslaan van een pincode niet.';
      fout.style.display = 'block';
      return;
    }
    await saveUsers();
    closeModal();
    render();
  });
}

// Plekhouder voor een scheepsnaam die nergens (EECV, VH, HGK) bekend is. Een
// kaal "?" oogde als een fout in de gegevens; dit zegt met een woord en een
// title wat er werkelijk aan de hand is: het is nog niet ingevuld.
const ONBEKEND_VELD_HTML = '<span class="onbekend-veld" title="Nog niet bekend uit de EECV-, VH- of HGK-lijst">onbekend</span>';

function renderCard(trip, groupList, idx){
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  const stations = getKnownStations();
  const optionsHtml = stations.map(s => `<option value="${esc(s)}" ${s===trip.station?'selected':''}>${esc(s)}</option>`).join('')
    + `<option value="__new__">+ nieuwe…</option>`;
  const isFirst = !groupList || idx === 0;
  const isLast = !groupList || idx === groupList.length - 1;
  const accentColor = stationAccentColor(trip.station);
  const times = computeTripTimes(trip);
  const planbeginMs = trip.planbegin ? new Date(trip.planbegin).getTime() : null;
  const planeindeMs = trip.planeinde ? new Date(trip.planeinde).getTime() : null;
  const planbeginBad = times.aankomstMs != null && planbeginMs != null && planbeginMs < times.aankomstMs;
  const planeindeBad = times.vertrekMs != null && planeindeMs != null && planeindeMs > times.vertrekMs;
  const orderControlsHtml = `<div class="order-controls">
          <button type="button" class="order-btn" data-dir="up" ${isFirst?'disabled':''} aria-label="Tegel naar boven" title="Naar boven"><span aria-hidden="true">▲</span></button>
          <button type="button" class="order-btn" data-dir="down" ${isLast?'disabled':''} aria-label="Tegel naar beneden" title="Naar beneden"><span aria-hidden="true">▼</span></button>
        </div>`;
  const stationSelectHtml = `<div class="station-badge"><select class="station-select" aria-label="Binnenbelader voor ${esc(trip.schubboot || 'deze rit')}">${optionsHtml}</select></div>`;
  // Zonder liegeplaats is de zichtbare tekst een kastlijntje, en dat is geen
  // naam. De waarde blijft er letterlijk in staan, zodat spraakbediening de
  // knop op zijn zichtbare tekst kan vinden.
  const lengteKnopHtml = `<button type="button" class="lengte-badge lengte-knop"
                  aria-label="Laadlengte ${esc(trip.liegeplaats) || 'nog niet gekozen'} — tik om klaar om te laden te zetten"
                  title="Tik: klaar om te laden. Ingedrukt houden: andere laadlengte kiezen.">${esc(trip.liegeplaats || '—')}</button>`;
  /* De vier tijden waren vier stempels in een 2×2-rooster op 10 px. Het zijn
     geen vier losse feiten maar één tijdvak: je komt aan, wacht, laadt, en
     vertrekt. Als balk lees je die vorm meteen — en naast elkaar op één schaal
     zie je ook welke ritten elkaar in de weg zitten.

     Zonder plantijden (of met maar één rit in beeld, dan is er geen schaal om
     op te vergelijken) valt het terug op de oude regels: dan is een balk
     zonder venster misleidend, en vier stempels nog altijd leesbaar. */
  const botsingen = planlijstBotsingen.get(trip.id) || [];
  const pbPct = planlijstPct(planbeginMs), pePct = planlijstPct(planeindeMs);
  const uurTekst = (ms) => (ms / 3600000).toFixed(1).replace('.', ',') + ' u';

  const cardTimesHtml = (planlijstVenster && pbPct != null && pePct != null) ? (() => {
    const aPct = planlijstPct(times.aankomstMs);
    const vPct = planlijstPct(times.vertrekMs);
    const wachtVan = aPct != null ? Math.min(aPct, pbPct) : pbPct;
    return `<div class="rit-tijdvak">
          <div class="rit-balk" data-botsing="${botsingen.length ? 'ja' : 'nee'}"
               title="${esc(times.aankomstDisplay)} aangekomen · laden ${fmtDateTime(trip.planbegin)} tot ${fmtDateTime(trip.planeinde)} · vertrek ${esc(times.vertrekDisplay)}">
            <span class="spoor"></span>
            <span class="wacht" style="left:${wachtVan}%;width:${Math.max(0, pbPct - wachtVan)}%"></span>
            <span class="laden" style="left:${pbPct}%;width:${Math.max(1, pePct - pbPct)}%"></span>
            ${aPct != null ? `<span class="merk" style="left:${aPct}%"></span>` : ''}
            ${vPct != null ? `<span class="merk vertrek" style="left:${vPct}%"></span>` : ''}
          </div>
          <div class="rit-tijden">
            <span${planbeginBad ? ' class="fout"' : ''}>${fmtDateTime(trip.planbegin)}</span>
            <span class="duur">laden ${uurTekst(planeindeMs - planbeginMs)}</span>
            <span${planeindeBad ? ' class="fout"' : ''}>${fmtDateTime(trip.planeinde)}</span>
          </div>
        </div>`;
  })() : `<div class="card-times">
          <div>Aankomst <b>${esc(times.aankomstDisplay)}</b></div>
          <div>Planbegin <b${planbeginBad?' class="time-bad"':''}>${fmtDateTime(trip.planbegin)}</b></div>
          <div>Planeinde <b${planeindeBad?' class="time-bad"':''}>${fmtDateTime(trip.planeinde)}</b></div>
          <div>Vertrek <b>${esc(times.vertrekDisplay)}</b></div>
        </div>`;

  /* Kop op één regel: [▲▼] [laadlengte] [——tijdbalk——] [B-machine]. De
     tijdbalk zit in de 1fr-kolom tussen de laadlengte en de vierkante B-knop
     rechts, zodat hij de volle vrije breedte pakt in plaats van op een eigen
     regel eronder te staan (dat kostte een hele regel tegel­hoogte). Op smal
     scherm valt de balk via een media-query alsnog naar een eigen regel terug.

     De "gepland:"- en "verdeeld:"-tags zijn zeldzaam (alleen bij een omplanning
     of een over meerdere plekken verdeelde set). Ze vallen daarom naar een
     eigen regel ónder de kop: zo maken ze de vierkante B-knop niet breder en
     drukken ze de tijdbalk niet weg. */
  const annotatiesHtml = [
    trip.liegeplaatsGepland && trip.liegeplaatsGepland !== trip.liegeplaats ? `<span class="was-tag left">laadlengte gepland: ${esc(trip.liegeplaatsGepland)}</span>` : '',
    trip.stationGepland && trip.stationGepland !== trip.station ? `<span class="was-tag left">B-machine gepland: ${esc(trip.stationGepland)}</span>` : '',
    havenVerdeeldTag(trip)
  ].filter(Boolean).join('');
  const cardTopHtml = `
      <div class="card-top">
        ${orderControlsHtml}
        <div class="lengte-col">
          ${lengteKnopHtml}
        </div>
        ${cardTimesHtml}
        <div class="station-col">
          ${stationSelectHtml}
        </div>
        ${annotatiesHtml ? `<div class="card-top-annotaties">${annotatiesHtml}</div>` : ''}
      </div>`;

  const rowsHtml = (() => {
          const displayGroups = buildDisplayRowGroups(trip);
          const refTonnage = referenceTonnageForTrip(displayGroups);
          const setInfo = setInfoVoorTegel(trip, displayGroups);
          const beugels = setBeugelKlassen(setInfo);
          return displayGroups.map((group, gIdx) => {
          const rIdx = group.indices[0];
          const set = setInfo[gIdx];
          const toonSet = set && set.kleur;
          const r = {
            leichter: group.rows[0].leichter,
            ankunftsboot: group.rows[0].ankunftsboot,
            materiaal: group.rows.map(x => x.materiaal || '—').join(' / '),
            menge: group.rows.map(x => x.menge || '?').join(' / '),
            kunde: [...new Set(group.rows.map(x => x.kunde).filter(Boolean))].join(' / ')
          };
          const isDeellading = group.rows.length > 1;
          let tonnageBad = false;
          if(isDeellading && refTonnage != null){
            const parts = group.rows.map(x => parseMenge(x.menge)).filter(n => n != null);
            if(parts.length === group.rows.length){
              const sum = parts.reduce((a,b) => a+b, 0);
              tonnageBad = Math.abs(sum - refTonnage) > 50;
            }
          }
          const isDummy = r.leichter && isDummyName(r.leichter);
          let vhLine = '';
          const anyListLoaded = vhBakken.length || hgkBakken.length;
          let manualFlag = false;
          let grp = null;
          if(!isDummy && r.leichter){
            grp = getEffectiveGroupForRow(r);
            if(grp){
              manualFlag = grp.manual;
            } else if(anyListLoaded){
              // Was een aparte tekstregel onder de rij ("niet gevonden in VH/HGK-
              // planning") — op verzoek nu een klein rood kruisje vlak achter de
              // baknaam. Zelfde tik-actie (openGroupPickerModal), alleen compacter.
              vhLine = `<button class="bak-mismatch" data-row-idx="${rIdx}" title="Niet gevonden in VH/HGK-planning — tik om handmatig aan een vertrekgroep te koppelen">✕</button>`;
            }
          }
          // scheepsnamen (geen VH/HGK/ANT/ANTV/WZ/ESP-patroon) leveren nooit een match op — geen melding nodig
          let ankomst, ankomstOnzeker = false;
          if(r.ankunftsboot && r.ankunftsboot.trim()){
            ankomst = esc(r.ankunftsboot);
          } else if(grp && grp.entry.schip){
            // EECV weet het niet — aanvullen met het schip dat VH/HGK bij deze bak noemt
            ankomst = esc(grp.entry.schip);
            ankomstOnzeker = true;
          } else {
            // Een kaal vraagteken zonder opschrift oogde als een storing in
            // plaats van "nog niet bekend".
            ankomst = ONBEKEND_VELD_HTML;
          }
          const vertrek = trip.schubboot ? esc(trip.schubboot) : ONBEKEND_VELD_HTML;
          // VH/HGK zijn leidend: wijkt de EECV-lijst af, dan kleurt die naam rood
          // en zetten we de juiste er klein achter.
          const controle = bootControle(trip, r);
          // De juiste naam (uit VH/HGK) staat vooraan en groot; wat de EECV-lijst
          // ervan maakte komt er klein en rood achter. Klopt alles, dan blijft de
          // naam gewoon in de normale kleur staan.
          const toon = (eecvNaam, juist, wat) => juist
            ? `<span class="boot-juist" title="Volgens de ${esc(lijstBotenVoorRegel(r).bron)}-lijst is de ${wat} ${esc(juist)}">${esc(juist)}</span>` +
              // eecvNaam is door de aanroeper al geëscaped; er nóg een keer
              // esc() overheen maakte van een & in een scheepsnaam "&amp;" in
              // de tooltip.
              `<span class="boot-fout" title="De EECV-lijst zegt ${eecvNaam} — dat klopt niet">${eecvNaam}</span>`
            : eecvNaam;
          const ankomstHtml = toon(ankomst, controle.aankomstJuist, 'aankomstboot');
          const vertrekHtml = toon(vertrek, controle.vertrekJuist, 'vertrekboot');
          // Zelflader (ingehuurd schip): aankomstboot, vertrekboot én bak dragen
          // dezelfde naam. Dan is het geen duwbak; de naam één keer tonen volstaat.
          const isZelflader = !isDummy && rijIsZelflader(trip, r);
          const shipNameHtml = isZelflader
            ? `<span class="ship-name zelflader" title="Zelflader: aankomstboot, vertrekboot en bak dragen dezelfde naam — ingehuurd schip, geen duwbak">zelflader${manualFlag?' ✎':''}</span>`
            : `<span class="ship-name">${ankomstHtml}${ankomstOnzeker?'<span class="onzeker" title="Niet bekend uit de EECV-lijst, aangevuld vanuit VH/HGK">?</span>':''} &rarr; ${vertrekHtml}${manualFlag?' ✎':''}</span>`;
          const bakStatus = group.rows[0].bakStatus || null;
          let bakHtml;
          if(isDummy){
            bakHtml = `<button class="bak-nummer dummy-pending" data-row-idx="${rIdx}" title="Tik om de echte baknaam in te vullen">${esc(r.leichter)}</button>`;
          } else {
            // Hoort de bak bij een set die over meerdere tegels ligt, dan
            // krijgt hij dezelfde gekleurde rand als op de kade.
            const setTitel = toonSet
              ? `Gaat samen de berg op met ${set.aantal - 1} andere bak${set.aantal === 2 ? '' : 'ken'}${
                  set.boot ? ` achter ${set.boot}` : ''}` +
                (set.elders
                  ? ` — ${set.elders} daarvan ${set.elders === 1 ? 'staat' : 'staan'} niet op deze tegel.`
                  : ` — de hele set staat op deze tegel.`) +
                ` Tik om de status van deze bak aan te passen.`
              : 'Tik om de status van deze bak aan te passen';
            bakHtml = `<button class="bak-nummer bak-status-btn${toonSet ? ' in-set' : ''}"${
              toonSet ? ` style="border-color:${safeColor(set.kleur)}"` : ''
            } data-row-indices="${group.indices.join(',')}" title="${esc(setTitel)}">${esc(r.leichter)||'—'}</button>${group.rows[0]._dummyLabel ? ` <button class="dummy-edit-btn" data-row-idx="${rIdx}" aria-label="Baknaam wijzigen voor ${esc(r.leichter) || 'deze regel'}" title="Baknaam wijzigen"><span aria-hidden="true">✎</span></button>` : ''}`;
          }
          const statusTagHtml = bakStatus === 'niet_aanwezig' ? '<span class="status-tag">niet aanwezig</span>'
            : bakStatus === 'repareren' ? '<span class="status-tag repareren" title="Moet repareren"><span aria-hidden="true">⚙</span> Repareren</span>' : '';
          const rowStatusClass = bakStatus === 'niet_aanwezig' ? ' status-niet-aanwezig' : bakStatus === 'repareren' ? ' status-repareren' : '';
          // De ⇄ is op de tablet het enige dat deze knop benoemt: daar is geen
          // muisaanwijzer, dus de title verschijnt er nooit. De baknaam gaat mee
          // in de naam, want er staan er meerdere onder elkaar.
          const moveBtnHtml = `<button class="move-btn" data-row-indices="${group.indices.join(',')}"
                    aria-label="Verplaats ${esc(r.leichter) || 'deze bak'} naar een andere tegel"
                    title="Verplaats naar andere tegel"><span aria-hidden="true">⇄</span></button>`;
          return `<div class="card-row${rowStatusClass}${beugels[gIdx]}"${
            toonSet ? ` style="--setkleur:${safeColor(set.kleur)}"` : ''}>
            <div class="row-left">
              ${shipNameHtml}
              ${bakHtml}
              ${vhLine}
              ${statusTagHtml}
              <span class="erts" title="${esc(r.materiaal)}${isDeellading?' — deellading (2 soorten lading in 1 bak)':''}">${esc(r.materiaal)}</span>
            </div>
            <span class="tonnage${tonnageBad?' tonnage-bad':''}"${tonnageBad?' title="Som wijkt meer dan 50 ton af van een volle bak op deze tegel"':''}>${esc(r.menge)} t</span>
            <span class="kunde">${esc(r.kunde)}</span>
            ${moveBtnHtml}
          </div>`;
          }).join('');
        })();

  const footerHtml = (() => {
        // unieke sets (VH/HGK-groepen) van deze kaart, één keer getoond i.p.v. per bak-regel
        const ownRowNames = trip.rows.filter(r => r.leichter).map(r => r.leichter);
        const seenGroups = new Set();
        const setLines = [];
        trip.rows.forEach(r => {
          if(!r.leichter) return;
          const grp = getEffectiveGroupForRow(r);
          if(!grp) return;
          const { source, list } = grp;
          const gKey = grp.key;
          if(seenGroups.has(gKey)) return;
          seenGroups.add(gKey);
          const siblings = list.filter(v => bakGroupKey(v, source) === gKey);
          const elders = siblings.filter(s => !ownRowNames.some(n => bargeNamesMatch(s.naam, n)));
          if(!elders.length) return; // hele set staat al op deze tegel
          // groeperen per locatie (of VH/HGK-bestemming als de locatie nog
          // niet bekend is uit de actieve EECV-planning) — bakken die samen
          // op dezelfde tegel staan, komen achter elkaar met de plek er 1x achter.
          // Een gewone ladingsoort (erts/kolen/koks) is geen nuttige locatie-info
          // en laten we hier weg; iets specifieks zoals "VKV LADEN EMO" wel.
          const tagGroups = new Map();
          elders.forEach(s => {
            const bestemmingBruikbaar = s.bestemming && !/^(erts|kolen|koks|cokes)$/i.test(s.bestemming.trim());
            const tag = findBargeLocation(s.naam) || (bestemmingBruikbaar ? s.bestemming : '') || '';
            if(!tagGroups.has(tag)) tagGroups.set(tag, []);
            tagGroups.get(tag).push(s.naam);
          });
          const parts = [];
          tagGroups.forEach((names, tag) => {
            parts.push(tag ? `${names.map(esc).join(', ')} (${esc(tag)})` : names.map(esc).join(', '));
          });
          // welke duwboot deze set meeneemt; staat in de Excel vaak maar op één
          // regel van de kleurgroep ingevuld, dus pak de eerste die hem heeft
          const setVertrekboot = (siblings.find(v => v.vertrekboot) || {}).vertrekboot;
          setLines.push(`<div>Set van ${siblings.length}${
            setVertrekboot ? ` voor ${esc(setVertrekboot)}` : ''
          }: ${parts.join(', ')}</div>`);
        });
        /* Een lege notitie-textarea stond vroeger op élke tegel en kostte zo
           een vaste regel hoogte die bijna altijd leeg bleef. Zonder notitie
           tonen we nu een klein "+ notitie"-knopje; bij een tik verschijnt het
           echte veld (zie de handler hieronder). Staat er al tekst, dan blijft
           het veld gewoon meteen zichtbaar. */
        const heeftNotitie = (trip.note || '').trim() !== '';
        const notitieHtml = heeftNotitie
          ? `<div class="card-note">
              <textarea placeholder="Notitie…" aria-label="Notitie bij ${esc(trip.schubboot || 'deze rit')}">${esc(trip.note)}</textarea>
            </div>`
          : `<button type="button" class="notitie-toevoegen" aria-label="Notitie toevoegen bij ${esc(trip.schubboot || 'deze rit')}">+ notitie</button>`;
        return `<div class="card-footer${heeftNotitie ? '' : ' leeg'}">
          ${notitieHtml}
        </div>
        ${setLines.length ? `<div class="vh-set-footer">${setLines.join('')}</div>` : ''}`;
      })();

  wrap.innerHTML = `
    <div class="card-bg right">✓ Afronden</div>
    <div class="card${trip.aangemeerd?' aangemeerd':''}${trip.klaarOmTeLaden?' klaar-laden':''}" data-id="${trip.id}">
      ${cardTopHtml}
      <div class="card-rows">
        ${rowsHtml}
      </div>
      ${footerHtml}
    </div>
  `;

  const card = wrap.querySelector('.card');

  // De notitie-textarea bestaat alleen nog als er al tekst staat (zie footer).
  // Eén plek die een textarea bedienbaar maakt, zodat het ook klopt voor het
  // veld dat pas na "+ notitie" wordt ingevoegd.
  function wireNotitie(textarea){
    textarea.addEventListener('pointerdown', e => e.stopPropagation());
    textarea.addEventListener('click', e => e.stopPropagation());
    textarea.addEventListener('change', async () => {
      await logAction(`Notitie gewijzigd: ${trip.schubboot||'?'} (${trip.station||'?'})`);
      trip.note = textarea.value;
      saveTrips();
    });
  }
  const bestaandeNotitie = wrap.querySelector('.card-note textarea');
  if(bestaandeNotitie) wireNotitie(bestaandeNotitie);

  const notitieKnop = wrap.querySelector('.notitie-toevoegen');
  if(notitieKnop){
    notitieKnop.addEventListener('pointerdown', e => e.stopPropagation());
    notitieKnop.addEventListener('click', (e) => {
      e.stopPropagation();
      const footer = notitieKnop.closest('.card-footer');
      footer.classList.remove('leeg');
      footer.innerHTML = `<div class="card-note">
        <textarea placeholder="Notitie…" aria-label="Notitie bij ${esc(trip.schubboot || 'deze rit')}"></textarea>
      </div>`;
      const ta = footer.querySelector('textarea');
      wireNotitie(ta);
      ta.focus();
    });
  }

  wrap.querySelectorAll('.bak-mismatch').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openGroupPickerModal(trip, +btn.dataset.rowIdx);
    });
  });

  wrap.querySelectorAll('.dummy-pending, .dummy-edit-btn').forEach(el => {
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openDummyNameModal(trip, +el.dataset.rowIdx);
    });
  });

  wrap.querySelectorAll('.bak-status-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openBakStatusModal(trip, btn.dataset.rowIndices.split(',').map(Number));
    });
  });

  // Afgekapte ertssoort: een tik klapt de volledige naam uit (en weer in). Op de
  // tablet is er geen muis, dus de title-tooltip verschijnt daar nooit — dit is
  // de manier om de hele naam te zien. stopPropagation zodat de tik de tegel
  // niet laat vegen of slepen.
  wrap.querySelectorAll('.erts').forEach(el => {
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      el.classList.toggle('erts-open');
    });
  });

  wrap.querySelectorAll('.move-btn').forEach(btn => {
