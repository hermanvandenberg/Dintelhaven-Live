<!-- Beperkt wat de pagina mag laden en waarheen ze mag praten. De belangrijkste
     regel is connect-src: ook als er ooit toch script wordt binnengesmokkeld via
     een geïmporteerd bestand, kan de planning niet naar een externe server
     worden gestuurd. object-src/base-uri/form-action sluiten de gebruikelijke
     omwegen af. 'unsafe-inline'/'unsafe-eval' zijn nodig zolang Tailwind in de
     browser draait en de app inline scripts gebruikt.
     Let op: frame-ancestors werkt alleen als HTTP-header — die zet de server. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  font-src 'self' data:;
  connect-src 'self';
  worker-src 'self' blob:;
  frame-src 'self' data: blob:;
  object-src 'none';
  base-uri 'none';
  form-action 'none';
">

<script>
/* Stuurt het opstartscherm aan. Staat hier los boven de app-code omdat het
   nog vóór de eerste tekening moet draaien: de animatie begint zodra het
   scherm er staat, en de tijdschaal moet dus al goed staan.

   Een gebruiker die de app tien keer per dienst opent zat tot nu toe elke
   keer de volle vijf seconden uit te zitten. Aangezet: de eerste keer op een
   dag krijg je de volle, sfeervolle versie; daarna diezelfde dag versneld
   (1,5 s, animatie op driemaal snelheid via --sp). Wegtikken (elke klik of
   toets) blijft altijd meteen werken, ook bij de volle versie.

   Bewust op localStorage en niet op loadJson(): dat is async en dan is de
   animatie al begonnen voordat het antwoord er is. Gaat het lezen mis, dan
   krijg je de volle versie — dat is de onschuldige kant om op te vallen. */
(function(){
  var KORT_NA_EERSTE_KEER = true;   // op false: altijd de volle vijf seconden
  var SPLASH_DAG_KEY = 'duwbakken-splash-dag';
  var VOL_MS = 5000, KORT_MS = 1500;
  var splash = document.getElementById('splash');
  if(!splash) return;

  // Alleen bijhouden welke dag het was als de verkorting ook echt aanstaat.
  // Anders zou de eerste start ná het aanzetten al als "gezien" tellen en
  // meteen de korte versie geven.
  var alGezien = false;
  if(KORT_NA_EERSTE_KEER){
    var vandaag = new Date().toLocaleDateString('sv');   // JJJJ-MM-DD
    try{
      alGezien = localStorage.getItem(SPLASH_DAG_KEY) === vandaag;
      localStorage.setItem(SPLASH_DAG_KEY, vandaag);
    }catch(e){ /* geen opslag: dan maar elke keer de volle versie */ }
  }

  var stil = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  splash.style.setProperty('--sp', alGezien ? '0.3' : '1');
  var duur = stil ? 600 : (alGezien ? KORT_MS : VOL_MS);

  var weg = false;
  function verbergSplash(){
    if(weg) return;
    weg = true;
    splash.classList.add('splash-weg');
    setTimeout(function(){ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 350);
  }
  splash.addEventListener('click', verbergSplash);
  /* Wegtikken kon alleen met een muis of vinger. Nu slaat elke toets het over
     — Escape en Enter het duidelijkst, maar wie hem al kent drukt gewoon iets.
     De luisteraar gaat er meteen weer af, zodat hij niet in de weg zit zodra
     het scherm weg is. */
  function opToets(e){
    if(e.key === 'Tab') return;          // Tab hoort gewoon te navigeren
    verbergSplash();
    document.removeEventListener('keydown', opToets);
  }
  document.addEventListener('keydown', opToets);
  setTimeout(verbergSplash, duur);
})();
</script>

<script>
function loadScript(url){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Kon bibliotheek niet laden: ' + url));
    document.head.appendChild(s);
  });
}

// Bibliotheken staan lokaal in lib/ zodat de app volledig offline werkt
// (o.a. op de iPad zonder internet). Bewust GEEN terugval naar een CDN:
// dat haalde code van een derde partij binnen zonder integriteitscontrole,
// dus een aangetast CDN had de hele planning kunnen uitlezen. Ontbreekt een
// lokale kopie, dan is dat een installatiefout en moet die opvallen.
const PDFJS_LIB_URL = 'lib/pdf.min.js';
const PDFJS_WORKER_URL = 'lib/pdf.worker.min.js';
const XLSX_LIB_URL = 'lib/xlsx.full.min.js';
let workerReady = null;
let xlsxReady = null;
let pdfWorkerUrlInUse = PDFJS_WORKER_URL;

async function ensurePdfWorker(){
  if(workerReady) return workerReady;
  workerReady = (async () => {
    // de bibliotheek pas nu laden (niet al bij het openen van de pagina) —
    // scheelt geheugen zolang er nog geen PDF wordt geïmporteerd
    if(typeof pdfjsLib === 'undefined'){
      await loadScript(PDFJS_LIB_URL);
    }
    if(typeof pdfjsLib === 'undefined'){
      throw new Error('De PDF-bibliotheek kon niet geladen worden: lib/pdf.min.js ontbreekt. Zet de map lib/ terug naast dit bestand.');
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = pdfWorkerUrlInUse;

    // Wordt de app niet via een webadres geopend maar rechtstreeks vanaf het
    // apparaat, dan mag de browser geen achtergrondproces starten en ook niets
    // ophalen — Firefox geeft elk lokaal bestand een eigen afgeschermde
    // herkomst. De workercode nu alvast als gewoon <script> inladen; dat mag
    // wél. pdf.js kijkt zelf of globalThis.pdfjsWorker bestaat en gebruikt die
    // dan, zonder iets te starten of op te halen.
    //
    // Dit moet vooraf: pdf.js onthoudt zijn eerste mislukte poging en probeert
    // het daarna niet opnieuw, dus achteraf repareren werkt niet.
    //
    // Prijs: het inlezen gebeurt dan op de hoofddraad en de app staat even
    // stil. Alleen in dit geval; via de server blijft het een echte worker.
    const viaWebadres = location.protocol === 'http:' || location.protocol === 'https:';
    if(!viaWebadres && !globalThis.pdfjsWorker){
      try{ await loadScript(PDFJS_WORKER_URL); }
      catch(e){ console.warn('[PDF] Worker vooraf laden mislukte:', e); }
    }
  })();
  return workerReady;
}

// Zwaardere terugvaloptie: sommige browsers (o.a. Safari bij lokaal geopende
// bestanden) blokkeren het laden van een worker-script van een ander domein.
// Alleen wanneer de lichte variant écht faalt, halen we de workercode zelf op
// en draaien we 'm als een lokale blob. Werkt niet als ook fetch geblokkeerd
// is — dat vangt de voorbereiding in ensurePdfWorker() af.
async function useBlobWorkerFallback(){
  const res = await fetch(pdfWorkerUrlInUse);
  if(!res.ok) throw new Error('worker fetch status ' + res.status);
  const code = await res.text();
  const blob = new Blob([code], {type: 'application/javascript'});
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
}

async function ensureXlsx(){
  if(xlsxReady) return xlsxReady;
  xlsxReady = (async () => {
    if(typeof XLSX === 'undefined'){
      await loadScript(XLSX_LIB_URL);
    }
    if(typeof XLSX === 'undefined'){
      throw new Error('De Excel-bibliotheek kon niet geladen worden: lib/xlsx.full.min.js ontbreekt. Zet de map lib/ terug naast dit bestand.');
    }
  })();
  return xlsxReady;
}

// 1.302 (10-10-2026) — Volle bakkenplaats, stap 2 (deel 2) + een bugfix. (1) Intra-set swap: een bak binnen
//       zijn eigen set op een andere plek slepen wisselt hem om met de bak of ghost die daar ligt. Nieuwe
//       weergave-override havenBakPlekOverrides (baknaam → lineaire celindex in het tegelraster), toegepast
//       in havenBakBlokjes; elke cel draagt nu data-cel, de swap zelf zit in havenWisselBakBinnenTegel.
//       (2) Bugfix: een set uit Vol slepen liet hem verdwijnen — het vaste vol-vlak ligt als overlay óver de
//       haven (o.a. over de palen), en een drop erbinnen viel door naar de zone eronder, waardoor de set
//       achter het vlak belandde. Nu blijft een drop binnen het vlak gewoon in Vol, en het vlak verbergt
//       zich niet meer mid-drag (zoals de lege kolom al deed). Test voor de swap erbij. Suite groen (115).
const APP_VERSION = '1.302';

<script>
/* Auteur: HvdB */

const STORAGE_KEY = 'duwbakken-trips';
const SEED_TRIPS = []; // demo-data verwijderd om het bestand lichter te maken

/* ---------------------------------------------------------------
   PERSISTENCE — gebruikt Claude's opslag indien beschikbaar,
   anders localStorage (voor gebruik als losse HTML in de browser)
--------------------------------------------------------------- */
function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

async function loadJson(key, fallback){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : fallback;
    }catch(e){ /* val terug op localStorage */ }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}

function isQuotaError(e){
  return e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
}

// Opslagfouten mogen nooit stil blijven: als de planning niet wegschrijft,
// is de gebruiker bij de volgende reload zijn werk kwijt zonder het te weten.
let quotaWaarschuwingGetoond = false;
function meldOpslagProbleem(key, e){
  console.error(`Opslaan van "${key}" mislukt`, e);
  if(isQuotaError(e)){
    if(quotaWaarschuwingGetoond) return;
    quotaWaarschuwingGetoond = true;
    try{
      showToast('Opslag vol — wijzigingen worden NIET bewaard. Ruim op via ⋯ → Historie.');
    }catch(_){ /* toast nog niet beschikbaar tijdens init */ }
  }
}

async function saveJson(key, value){
  const json = JSON.stringify(value);
  if(hasClaudeStorage()){
    try{
      await window.storage.set(key, json, false);
      return true;
    }catch(e){ /* val terug op localStorage */ }
  }
  try{
    localStorage.setItem(key, json);
    return true;
  }catch(e){
    meldOpslagProbleem(key, e);
    return false;
  }
}

const VH_STORAGE_KEY = 'duwbakken-vh-bakken';
let vhBakken = [];        // vlakke lijst: {naam, positie, schip, tijd, bestemming, volgende, sheet}
let vhImportedAt = null;

/* Wanneer is de EECV-lijst ingelezen? De VH- en HGK-lijst bewaren dat al naast
   hun items (vhImportedAt/hgkImportedAt), maar de planning zelf niet — die
   staat als kale array onder duwbakken-trips en daar een veld aan toevoegen
   verandert de vorm van iets waar veel code op leunt. Vandaar een eigen,
   piepkleine sleutel. Uitgerekend de belangrijkste lijst was zo de enige
   waarvan je niet kon zien hoe oud hij was.

   storeLastFile() bewaart ook een importedAt, maar die is er alleen als het
   bronbestand klein genoeg was om te bewaren — dus niet altijd. */
const EECV_IMPORT_KEY = 'duwbakken-eecv-import';

// Een eerdere versie schreef de velden `plek` en `setKey` op de bakken in de
// VH/HGK-lijst. De haventekening gebruikt die niet, maar ze blijven wel in de
// opslag staan en `setKey` botst met de groepsindeling. Eenmalig opruimen.
function schoonBakkenlijst(lijst){
  let opgeruimd = 0;
  lijst.forEach(b => {
    if('plek' in b){ delete b.plek; opgeruimd++; }
    if('setKey' in b){ delete b.setKey; opgeruimd++; }
  });
  return opgeruimd;
}

/* Bakken die met dezelfde boot op hetzelfde moment binnenkomen horen bij
   elkaar, ook als niet elke regel in de VH/HGK-lijst zijn eigen kleurcel heeft
   ingevuld. Een lege kleurcel betekent "in reparatie, vaart niet mee": de bak
   hoort wél bij zijn set, maar mag die kleur NIET krijgen — anders is hij op het
   scherm niet van zijn blokgenoten te onderscheiden en ziet getRepairConflicts()
   hem niet meer als conflict (Herman, 21-09: "de bak mag niet dezelfde kleur
   krijgen maar moet wel bij de set blijven"). Zie 1.208.

   Daarom gaat het lidmaatschap via een apart veld `groepKleur`: dat telt mee in
   bakGroupKey(), maar `kleur` blijft leeg zodat de bak grijs getekend wordt.

   Niet aanvullen als de positiecode zelf niet leesbaar is (bijv. "NNB" — nog
   niet bekend): dan staat nog niet vast hóe de bak bij de set hoort (Herman zag
   bij VH 4: 3 roze bakken + 1 kleurloze op "NNB" allevier roze). */
function vulGroepKleurenAan(lijst){
  const kleurPerBlok = new Map();
  lijst.forEach(v => {
    if(!v.kleur || !v.schip) return;
    const blokKey = v.schip + '|' + (v.tijd || '');
    if(!kleurPerBlok.has(blokKey)) kleurPerBlok.set(blokKey, v.kleur);
  });
  let gevuld = 0;
  lijst.forEach(v => {
    /* Een `groepKleur` die niet meer klopt omdat de bak inmiddels zijn eigen
       kleurcel heeft gekregen: weghalen. */
    if(v.kleur){ if(v.groepKleur) delete v.groepKleur; return; }
    if(!v.schip || v.groepKleur) return;
    if(!ontleedPositie(v.positie)) return;
    const kleur = kleurPerBlok.get(v.schip + '|' + (v.tijd || ''));
    if(kleur){ v.groepKleur = kleur; gevuld++; }
  });
  return gevuld;
}

/* De vertrekboot staat in de VH/HGK-sheet vaak maar op één regel van een groep
   ingevuld; een lege cel betekent daar "dezelfde als de rest". Sinds 1.209 telt
   vertrekboot + vertrektijd mee in de setsleutel (anders vallen twee
   vertrekmomenten met dezelfde celkleur samen tot één set — volgens Herman
   dagelijks), en dan moet die lege cel eerst aangevuld worden. Twee bronnen, in
   volgorde: (1) kleur + blok (schip+tijd, het veiligst — binnen één blok hoort
   één kleur bij één vertrek), (2) de kleur als geheel, maar alléén als die in de
   hele lijst één vertrek kent — een kleur mag met opzet over blokgrenzen lopen;
   kent hij twee vertrekken, dan is dat juist de splitsing die we willen zien en
   vullen we niets in. */
function vertrekSleutel(entry){
  if(!entry || (!entry.vertrekboot && !entry.vertrektijd)) return '';
  return normalizeBargeName(entry.vertrekboot || '') + '~' + (entry.vertrektijd || '');
}

function vulOntbrekendeVertrekAan(lijst){
  const blokVan = v => (v.kleur || v.groepKleur) + '|' + (v.schip || '') + '|' + (v.tijd || '');
  const perBlok = new Map();
  const perKleur = new Map();          // kleur -> bron-entry, of 'MEERDERE'

  lijst.forEach(v => {
    const kleur = v.kleur || v.groepKleur;
    if(!kleur || !vertrekSleutel(v)) return;
    if(!perBlok.has(blokVan(v))) perBlok.set(blokVan(v), v);
    const eerder = perKleur.get(kleur);
    if(eerder === undefined) perKleur.set(kleur, v);
    else if(eerder !== 'MEERDERE' && vertrekSleutel(eerder) !== vertrekSleutel(v)){
      perKleur.set(kleur, 'MEERDERE');
    }
  });

  let gevuld = 0;
  lijst.forEach(v => {
    const kleur = v.kleur || v.groepKleur;
    if(!kleur || vertrekSleutel(v)) return;
    let bron = perBlok.get(blokVan(v));
    if(!bron){
      const heel = perKleur.get(kleur);
      if(heel && heel !== 'MEERDERE') bron = heel;
    }
    if(!bron) return;
    v.vertrekboot = bron.vertrekboot || null;
    v.vertrektijd = bron.vertrektijd || null;
    gevuld++;
  });
  return gevuld;
}

async function loadVhBakken(){
  const data = await loadJson(VH_STORAGE_KEY, {items: [], importedAt: null});
  vhBakken = data.items || [];

  const opgeschoond = schoonBakkenlijst(vhBakken) + splitsVertrekbootOpnieuw(vhBakken) + vulGroepKleurenAan(vhBakken) + vulOntbrekendeVertrekAan(vhBakken);
  if(opgeschoond) await saveVhBakken();
}
async function saveVhBakken(){
  havenVergeetBerekening();   // de VH-lijst voedt de haven
  await saveJson(VH_STORAGE_KEY, {items: vhBakken, importedAt: vhImportedAt});
}

// Bewaart het laatst geïmporteerde bestand per soort (EECV/VH/HGK) als
// data-URL, zodat het origineel later live naast het dashboard bekeken kan
// worden ("Origineel checken").
const LAST_FILES_KEY = 'duwbakken-laatste-bestanden';
let lastFiles = {};
async function loadLastFiles(){
  lastFiles = await loadJson(LAST_FILES_KEY, {});
}
async function saveLastFiles(){
  return saveJson(LAST_FILES_KEY, lastFiles);
}
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
// Een origineel wordt als base64 bewaard en dat is fors: base64 maakt een
// bestand ~33% groter en localStorage biedt in totaal maar zo'n 5 MB. De
// planning zelf gaat vóór op deze kopie voor "Origineel checken" — een te
// groot bestand slaan we daarom niet op in plaats van de opslag vol te zetten
// en de planning niet meer te kunnen bewaren.
const MAX_ORIGINEEL_BYTES = 1_500_000;

async function storeLastFile(type, file){
  try{
    const dataUrl = await fileToDataURL(file);
    if(dataUrl.length > MAX_ORIGINEEL_BYTES){
      lastFiles[type] = { filename: file.name, dataUrl: null, importedAt: Date.now(), teGroot: true };
      await saveLastFiles();
      showToast(`"${file.name}" is te groot om te bewaren voor "Origineel checken". De planning zelf is wel gewoon opgeslagen.`);
      return;
    }
    lastFiles[type] = { filename: file.name, dataUrl, importedAt: Date.now() };
    const ok = await saveLastFiles();
    if(ok === false){
      // Opslag vol: gooi de kopie weg zodat de planning wél ruimte houdt.
      lastFiles[type] = { filename: file.name, dataUrl: null, importedAt: Date.now(), teGroot: true };
      await saveLastFiles();
    }
  }catch(e){
    console.error('Kon origineel bestand niet bewaren voor "Origineel checken":', e);
  }
}

// Bewust GEEN automatische her-import van de laatste bestanden bij het opstarten.
// De planning, de VH- en de HGK-lijst worden zelf al bewaard en door
// loadTrips/loadVhBakken/loadHgkBakken teruggezet. De bronbestanden opnieuw
// inlezen zou applyCategorizedImport() draaien, en die overschrijft rows —
// dus bakstatussen, ingevulde dummynamen en handmatige groepskoppelingen —
// en trekt afgeronde ritten uit Historie terug naar Actief. Dat kostte bij
// elke reload werk. Moest je toch steeds opnieuw importeren, dan was de
// opslag vol; dat wordt nu gemeld in plaats van stil te falen.

/* Verschillen die écht een probleem zijn — bewust géén losse naam-/tijdtypfouten.
   Alleen deze drie dingen worden gemeld (zie Hermans uitleg):

   (A) Bakken die niet op tijd klaar zijn voor hun vertrek: de laadeindtijd
       (planeinde) ligt ná de vertrektijd. VH/HGK is leidend voor die vertrektijd
       (kolom F); anders de EECV-Abfahrt. Volledige datum+tijd, zodat een vertrek
       de volgende dag goed telt. Dat de EECV- en VH-vertrektijd van elkaar
       verschillen is op zichzelf geen probleem — zolang de bakken op tijd klaar
       zijn is dat hooguit een typfout, geen melding waard.

   (B) Bakken die je verwacht maar niet terugvindt: een bak op de EECV-lijst die
       op géén van beide lijsten (VH/HGK) staat, en een bak die in VH/HGK gepland
       staat maar niet op de actieve EECV-lijst. Gevonden op één lijst is genoeg:
       een VH-bak hoort niet op HGK te staan en andersom.

   (C) Een bak die op zowel de VH- als de HGK-lijst staat — dat hoort maar op één
       lijst, dus dat is wél een probleem.

   Weggelaten t.o.v. vroeger: losse meldingen voor een afwijkende aankomstboot,
   aankomsttijd, vertrekboot of vertrektijd, en voor een set die geen 4 of 6
   bakken telt. Die veroorzaakten ruis zonder een echt operationeel probleem. */
function computeDifferences(){
  const diffs = [];
  const activeTrips = trips.filter(t => t.status === 'actief');
  const anyListLoaded = vhBakken.length || hgkBakken.length;

  activeTrips.forEach(trip => {
    const st = trip.station || '?';
    const planeindeMs = trip.planeinde ? new Date(trip.planeinde).getTime() : null;
    const eecvVertrekMs = parseDate(trip.abfahrt);
    const missingInVh = [];   // (B1) op EECV, maar op geen van beide lijsten
    const teLaatNamen = [];   // (A) pas klaar met laden ná de geplande vertrektijd
    trip.rows.forEach(r => {
      // Zelfladers eruit: een zelfvarend schip komt op eigen naam aan én vertrekt
      // op eigen naam, brengt of haalt geen bakken, en staat daarom terecht wél op
      // EECV en niet op VH — geen probleem. Zelfde uitsluiting als in adviesTaken.
      if(!r.leichter || isDummyName(r.leichter) || rijIsZelflader(trip, r)) return;
      const grp = getEffectiveGroupForRow(r);
      if(!grp){
        // Niet teruggevonden op VH of HGK (getEffectiveGroupForRow kijkt in
        // allebei) — gevonden op één lijst is genoeg, dus dit is echt "weg".
        if(anyListLoaded) missingInVh.push(r.leichter);
        return;
      }
      // (A) Is de bak op tijd klaar voor zijn vertrek? De vertrektijd uit VH/HGK
      // (kolom F) is leidend; ontbreekt die, dan de EECV-Abfahrt. Volledige
      // datum+tijd, zodat een vertrek de volgende dag goed meetelt. Verschilt de
      // EECV-vertrektijd van die van VH, dan is dat op zichzelf geen melding: zolang
      // de bak vóór de (leidende) vertrektijd klaar is, is er geen probleem.
      const vhVertrekMs = grp.entry && grp.entry.vertrektijd ? parseVhTijd(grp.entry.vertrektijd, trip.planbegin) : null;
      const vertrekMs = vhVertrekMs != null ? vhVertrekMs : eecvVertrekMs;
      if(planeindeMs != null && vertrekMs != null && planeindeMs > vertrekMs) teLaatNamen.push(r.leichter);
    });
    if(teLaatNamen.length){
      const namen = [...new Set(teLaatNamen)];
      const voor = namen.length === 1 ? namen[0] : `Set (${namen.length}): ${namen.join(', ')}`;
      const zijn = namen.length === 1 ? 'is' : 'zijn';
      diffs.push({
        id: `teLaat|${trip.id}|${namen.map(normalizeBargeName).join(',')}`,
        tripId: trip.id,
        message: `${voor} ${zijn} pas ná de geplande vertrektijd klaar met laden — niet op tijd klaar voor ${trip.schubboot||'vertrek'} (${st})`
      });
    }
    if(missingInVh.length){
      const namen = [...new Set(missingInVh)];
      const voor = namen.length === 1 ? namen[0] : `Set (${namen.length}): ${namen.join(', ')}`;
      const staan = namen.length === 1 ? 'staat' : 'staan';
      diffs.push({
        id: `missingList|${trip.id}|${namen.map(normalizeBargeName).join(',')}`,
        tripId: trip.id,
        message: `${voor} ${staan} op de EECV-lijst (${trip.schubboot||'?'}, ${st}) maar niet in VH of HGK`
      });
    }
  });

  const activeLeichterNames = [];
  activeTrips.forEach(t => t.rows.forEach(r => { if(r.leichter) activeLeichterNames.push(r.leichter); }));
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([source, list]) => {
    // Bakken die in VH/HGK gepland staan maar niet op de actieve EECV-lijst,
    // gebundeld per vertrekset (celkleur-groep). Vier bakken van dezelfde
    // vertrekboot die allemaal ontbreken zijn zo één melding i.p.v. vier.
    // Bakken die volgens VH/HGK ergens anders laden (Gent/EBS/EMO/Terneuzen/
    // Hoge Waard) horen per definitie niet op de EECV-lijst — die horen hier
    // níét thuis. De omgekeerde fout wél: laadt-elders maar staat tóch op EECV.
    const missing = new Map(); // bakGroupKey -> {namen: [], vertrekboot}
    const elders  = new Map(); // bakGroupKey -> {namen: [], plek}
    list.filter(v => v.kleur).forEach(v => {
      const opEecv = activeLeichterNames.some(n => bargeNamesMatch(v.naam, n));
      const plek = plekBuitenDeHaven(v);
      if(plek){
        if(!opEecv) return; // laadt elders én niet op EECV: zo hoort het
        if(!elders.has(plek)) elders.set(plek, { namen: [], plek });
        elders.get(plek).namen.push(v.naam);
        return;
      }
      if(opEecv) return; // laadt bij EECV én staat op EECV: prima
      const key = bakGroupKey(v, source);
      if(!missing.has(key)) missing.set(key, { namen: [], vertrekboot: '' });
      const g = missing.get(key);
      g.namen.push(v.naam);
      if(!g.vertrekboot) g.vertrekboot = v.vertrekboot || v.schip || '';
    });
    missing.forEach((g, key) => {
      const namen = [...new Set(g.namen)];
      const voor = namen.length === 1 ? namen[0] : `Set (${namen.length}): ${namen.join(', ')}`;
      const staan = namen.length === 1 ? 'staat' : 'staan';
      diffs.push({
        id: `missingEecv|${source}|${key}`,
        tripId: null,
        message: `${voor} ${staan} gepland in ${source} (vertrekboot ${g.vertrekboot||'?'}) maar niet op de actieve EECV-lijst`
      });
    });
    elders.forEach((g, plek) => {
      const namen = [...new Set(g.namen)];
      const voor = namen.length === 1 ? namen[0] : `Set (${namen.length}): ${namen.join(', ')}`;
      const staan = namen.length === 1 ? 'staat' : 'staan';
      const laden = namen.length === 1 ? 'laadt' : 'laden';
      diffs.push({
        id: `eldersOpEecv|${source}|${normalizeBargeName(plek)}|${namen.map(normalizeBargeName).join(',')}`,
        tripId: null,
        message: `${voor} ${staan} op de EECV-lijst maar ${laden} volgens ${source} bij ${plek} — hoort niet op de EECV-lijst`
      });
    });
  });

  // (C) Een bak die op zowel de VH- als de HGK-lijst staat hoort maar op één van
  // beide — dat is een echte fout in de lijsten en dus een melding waard. Eén
  // melding per baknaam.
  const gemeldDubbel = new Set();
  (vhBakken || []).forEach(v => {
    if(!v || !v.naam) return;
    const sleutel = normalizeBargeName(v.naam);
    if(gemeldDubbel.has(sleutel)) return;
    if((hgkBakken || []).some(h => h && h.naam && bargeNamesMatch(h.naam, v.naam))){
      gemeldDubbel.add(sleutel);
      diffs.push({
        id: `dubbelLijst|${sleutel}`,
        tripId: null,
        message: `${v.naam} staat op zowel de VH- als de HGK-lijst — dat hoort maar op één lijst`
      });
    }
  });

  return diffs;
}

const CHECKED_DIFFS_KEY = 'duwbakken-verschillen-afgevinkt';
let checkedDiffs = {};
async function loadCheckedDiffs(){

// Actielog voor "ongedaan maken" — vóór elke wijziging aan de planning wordt
// een momentopname van trips bewaard. Ongedaan maken herstelt gewoon die
// vorige opname; dat is betrouwbaarder dan voor elke actie een eigen
// "omgekeerde" bewerking te schrijven. Bewaard voor 7 dagen.
const ACTION_LOG_KEY = 'duwbakken-actielog';
const ACTION_LOG_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;
let actionLog = [];

/* Elke regel in het actielog draagt een volledige momentopname van de hele
   planning — dat is wat ongedaan maken mogelijk maakt. Met vijfhonderd
   regels is dat al gauw meer dan een megabyte, en dan loopt de
   browseropslag vol en wordt er níéts meer bewaard.

   De geschiedenis blijft daarom lang leesbaar, maar alleen de laatste tien
   regels houden hun momentopname. De beschrijving blijft wel staan, zodat je
   kunt teruglezen wat er gebeurd is.

   Stond op veertig. Gemeten op een planning van vijftien ritten is één
   momentopname 22 KB, dus veertig ervan maakten het log 1 MB — en dat hele
   log werd bij élke handeling opnieuw omgezet en weggeschreven. Op de PC is
   dat 7 ms en merk je niets; op de tablet schrijft de browseropslag synchroon
   en veel trager, en zolang dat loopt reageert het scherm niet. Dat was de
   grootste reden dat de app daar traag begon te voelen naarmate er langer aan
   een planning gewerkt werd. Tien stappen terug is op verzoek ruim genoeg. */
const ACTIELOG_MET_MOMENTOPNAME = 10;
/* Opruimen van de browseropslag.
 *
 * De melding "opslag vol" wees naar het import-archief, maar dat is het niet:
 * gemeten op een echte planning was dat 1 KB van de 2100. De ruimte gaat op aan
 * het actielog met zijn momentopnames en aan de synchronisatiewachtrij. Dit
 * ruimt op waar het werkelijk zit, en toont ook hoeveel het scheelde — anders
 * druk je op een knop en weet je niet of er iets gebeurd is. */
function opslagInKB(){
  let n = 0;
  try{
    for(let i = 0; i < localStorage.length; i++){
      n += (localStorage.getItem(localStorage.key(i)) || '').length;
    }
  }catch(e){ return null; }
  return Math.round(n / 1024);
}

function toonOpslagMaat(){
  const el = document.getElementById('opslagMaat');
  if(!el) return;
  const kb = opslagInKB();
  el.textContent = kb == null
    ? 'opslag niet te meten'
    : `browseropslag: ${kb} KB · ${actionLog.length} acties`;
}

async function ruimOpslagOp(){
  const voor = opslagInKB();

  // Het actielog helemaal legen zou ook ongedaan maken wegnemen. De laatste
  // tien stappen blijven daarom staan; de rest verdwijnt inclusief hun
  // momentopnames, en dat is waar de ruimte zit.
  actionLog = actionLog.slice(-10);
  await saveActionLog();

  // De bewaarde originelen voor "Origineel checken" (tot 1,5 MB per stuk,
  // drie stuks = tot 4,5 MB) telden hier nog niet mee, terwijl dat een van de
  // grootste losse posten is. Ze zijn zelf altijd opnieuw te importeren; dit
  // is geen planningsgegeven, dus veilig om weg te gooien.
  lastFiles = {};
  await saveLastFiles();

  try{
    localStorage.removeItem('duwbakken-sync-queue');
  }catch(e){ /* geen opslag */ }

  const na = opslagInKB();
  toonOpslagMaat();
  updateUndoButton();
  showToast(voor != null && na != null
    ? `Opgeruimd: ${Math.max(0, voor - na)} KB vrijgemaakt (${na} KB over).`
    : 'Opgeruimd.');
}

function pruneActionLog(){
  const cutoff = Date.now() - ACTION_LOG_MAX_AGE_MS;
  actionLog = actionLog.filter(a => a.at >= cutoff);
  if(actionLog.length > 500) actionLog = actionLog.slice(actionLog.length - 500);
  const grens = actionLog.length - ACTIELOG_MET_MOMENTOPNAME;
  for(let i = 0; i < grens; i++) delete actionLog[i].snapshot;
}
async function loadActionLog(){
  actionLog = await loadJson(ACTION_LOG_KEY, []);
  pruneActionLog();
}
async function saveActionLog(){
  pruneActionLog();
  let ok = await saveJson(ACTION_LOG_KEY, actionLog);
  /* De momentopnames maken dit de grootste losse regel die de app wegschrijft
     — bij een planning die al een tijd meegaat kan zelfs veertig momentopnames
     (ACTIELOG_MET_MOMENTOPNAME) nog te veel zijn voor wat er nog vrij is.
     Zonder dit bleef dezelfde te grote schrijfactie keer op keer mislukken,
     stil (alleen in de console), tot iemand het toevallig zag. Nu knipt hij
     zichzelf drastischer terug tot het wél past, in plaats van het gewoon
     op te geven. */
  if(ok === false){
    const grens = actionLog.length - 10;
    for(let i = 0; i < grens; i++) delete actionLog[i].snapshot;
    ok = await saveJson(ACTION_LOG_KEY, actionLog);
  }
  if(ok === false && actionLog.length > 20){
    actionLog = actionLog.slice(-20);
    ok = await saveJson(ACTION_LOG_KEY, actionLog);
  }
  return ok;
}
// Aanroepen VLAK VOORDAT je `trips`/`vhBakken`/`hgkBakken` wijzigt, met een
// korte, duidelijke omschrijving van de actie.
/* Het actielog hoeft niet op de milliseconde op schijf te staan.

   Het wegschrijven gebeurt daarom niet meer midden in de handeling zelf, maar
   kort erna — meerdere handelingen achter elkaar leveren zo één schrijfactie
   in plaats van een stuk of vijf. Dat haalt het zwaarste werk weg uit het
   moment waarop je op een knop drukt; op de tablet is dat precies waar het
   scherm even stilstond.

   Wat er gebeurt als de pagina tussendoor dichtgaat: `flushActionLog()` hangt
   aan pagehide/visibilitychange, dus dan gaat het alsnog mee. En mocht er
   écht iets tussen vallen, dan verlies je hoogstens een regel geschiedenis —
   de planning zelf (ritten en ligplaatsen) wordt apart en wél meteen bewaard. */
const ACTIELOG_SCHRIJF_VERTRAGING_MS = 800;
let actielogSchrijfTimer = null;

function planActionLogSchrijf(){
  if(actielogSchrijfTimer) return;
  actielogSchrijfTimer = setTimeout(() => {
    actielogSchrijfTimer = null;
    saveActionLog();
  }, ACTIELOG_SCHRIJF_VERTRAGING_MS);
}

function flushActionLog(){
  if(!actielogSchrijfTimer) return;
  clearTimeout(actielogSchrijfTimer);
  actielogSchrijfTimer = null;
  saveActionLog();
}

async function logAction(description){
  /* De ligplaatsen horen er ook bij. Ze staan niet in `trips` maar in een
     eigen lijst op baknaam, en zonder die lijst deed ongedaan maken na een
     verplaatsing in de haven niets: de melding kwam wel, de bakken bleven
     liggen waar ze lagen. */
  actionLog.push({ at: Date.now(), description,
                   snapshot: JSON.stringify({ trips, vhBakken, hgkBakken, havenPosities }) });
  planActionLogSchrijf();
  updateUndoButton();
}
function updateUndoButton(){
  const btn = document.getElementById('undoLink');
  if(!btn) return;
  const last = actionLog[actionLog.length - 1];
  btn.style.display = last ? '' : 'none';
  btn.title = last ? `Ongedaan maken: ${last.description}` : '';
}
async function undoLastAction(){
  const last = actionLog[actionLog.length - 1];
  if(!last) return;
  if(!last.snapshot){
    showToast('Deze stap ligt te ver terug om nog ongedaan te maken.');
    return;
  }
  actionLog.pop();
  const data = JSON.parse(last.snapshot);
  trips = data.trips;
  vhBakken = data.vhBakken;
  hgkBakken = data.hgkBakken;
  // Oudere regels uit het log kennen de ligplaatsen nog niet; die laten de
  // haven dan met rust in plaats van hem leeg te maken.
  if(data.havenPosities){
    havenPosities = data.havenPosities;
    await saveHavenPosities();
  }
  await saveActionLog();
  await saveTrips();
  await saveVhBakken();
  await saveHgkBakken();
  updateUndoButton();
  render();
  showToast(`Ongedaan gemaakt: ${last.description}`);
}

// Lichte modus — geschikt voor kleurenblinde gebruikers (witte achtergrond,
// hoger contrast). Blijft bewaard tussen sessies.
const THEME_STORAGE_KEY = 'duwbakken-theme';
let currentTheme = 'light';
async function loadTheme(){
  // Nog geen eigen keuze opgeslagen (nieuw apparaat / data gewist)? Dan is licht
  // de standaard (v1.282). Zodra de gebruiker zelf een thema kiest, staat dat
  // opgeslagen en wint het hierboven.
  currentTheme = await loadJson(THEME_STORAGE_KEY, 'light');
  // De Originele planlijst (PDF-bladspiegel op de tegel) is met v1.167
  // vervallen — bracht niet wat de bedoeling was. Wie hem nog aan had staan
  // valt terug op de lichte modus, waar origineel zijn chrome toch al van
  // leende: dat is de kleinste, minst verrassende stap terug.
  if(currentTheme === 'origineel') currentTheme = 'light';
  // Neumorfisme is met v1.279 vervallen — wie het nog aan had staan valt terug
  // op de lichte modus, waar neu toch al zijn kleurbasis van leende.
  if(currentTheme === 'neumorphism') currentTheme = 'light';
  applyTheme();
}
/* Eenmalig bij v1.282: licht werd de standaard, dus wie al een donker thema had
   staan (apparaat én profielen) gaat één keer mee naar licht. Daarna kiest
   iedereen zelf weer; de vlag zorgt dat dit niet nog eens gebeurt. */
const LICHT_STANDAARD_KEY = 'duwbakken-licht-standaard';
async function zetLichtAlsStandaard(){
  if(await loadJson(LICHT_STANDAARD_KEY, false)) return;
  currentTheme = 'light';
  await saveTheme();
  if(users.length){
    users.forEach(u => { u.settings = { ...(u.settings || defaultUserSettings()), thema: 'light' }; });
    await saveUsers();
  }
  await saveJson(LICHT_STANDAARD_KEY, true);
}
async function saveTheme(){
  await saveJson(THEME_STORAGE_KEY, currentTheme);
}
/* Sommige keuzes (haven donker-op-licht, kade, stations, accent-licht) hangen
   aan de lichte modus. Eén helper, zodat niet overal currentTheme === 'light'
   uitgeschreven staat. */
function themaIsLichtAchtig(){ return currentTheme === 'light'; }

/* Twee standen voor het Overzicht, net als de rit-tegel er twee heeft: dezelfde
   cijfers, een ander sjabloon. 'tegels' is wat er altijd al stond; 'kade' zet
   de ligplaatsen op schaal neer en hangt de rest eraan.

   Dit is bewust géén vierde thema. Een thema verft de hele app; dit verandert
   alleen hoe één tabblad zijn gegevens neerzet, en moet in donker én licht
   werken. Daarom een eigen sleutel en een eigen knop, en niets in applyTheme(). */
const OVERZICHT_STORAGE_KEY = 'duwbakken-overzicht-weergave';
let overzichtWeergave = 'tegels';
async function loadOverzichtWeergave(){
  const bewaard = await loadJson(OVERZICHT_STORAGE_KEY, 'tegels');
  overzichtWeergave = bewaard === 'kade' ? 'kade' : 'tegels';
}
async function setOverzichtWeergave(modus){
  if(modus !== 'tegels' && modus !== 'kade') return;
  if(modus === overzichtWeergave) return;
  overzichtWeergave = modus;
  await saveJson(OVERZICHT_STORAGE_KEY, overzichtWeergave);
  render();
}

function applyTheme(){
  document.body.classList.toggle('light-theme', themaIsLichtAchtig());
  // De schuifbalk van de pagina zelf kijkt naar <html>, niet naar <body> — de
  // klasse hierboven bereikt hem dus nooit. Vandaar deze tweede zet.
  document.documentElement.style.colorScheme = themaIsLichtAchtig() ? 'light' : 'dark';
  // Twee losse knoppen in plaats van één die wisselt: elke knop zegt zelf al
  // wat hij is, aria-checked zegt welke er nu aanstaat.
  document.querySelectorAll('.theme-item').forEach(knop => {
    knop.setAttribute('aria-checked', String(knop.dataset.thema === currentTheme));
  });
  applyCurrentUserSettings();
}
async function setTheme(modus){
  if(modus !== 'dark' && modus !== 'light') return;
  currentTheme = modus;
  // Thema hoort bij de gebruiker: schrijf het naar de actieve gebruiker. De
  // globale sleutel blijft de terugval voor als er niemand actief is.
  const u = getCurrentUser();
  if(u){ u.settings = { ...(u.settings || defaultUserSettings()), thema: modus }; await saveUsers(); }
  await saveTheme();
  applyTheme();
  render();
}

// Zet currentTheme naar het thema van de actieve gebruiker (terugval: de laatst
// bekende/globale waarde) en past het toe. Aanroepen zodra de actieve gebruiker
// verandert of bij het opstarten.
function pasGebruikersThemaToe(){
  const u = getCurrentUser();
  const t = u && u.settings && u.settings.thema;
  if(t === 'dark' || t === 'light') currentTheme = t;
  applyTheme();
}

// Gebruikers — elke collega kan een eigen profiel hebben met een pincode
// (standaard 1234) en persoonlijke kleurinstellingen (pastel, donkerte van
// de achtergrond, grijstint in de lichte modus). Blijft samen bewaard.
const USERS_STORAGE_KEY = 'duwbakken-gebruikers';
let users = [];
let currentUserId = null;
let pastelFactor = 1;

/* Keuze voor de hoofdkleur. Elke kleur is vooraf doorgemeten tegen zowel de
   donkere als de lichte achtergrond, zodat elke optie in beide modi leesbaar
   blijft — een echt geel haalde dat niet (contrast 1,6 op licht), vandaar oker.
   Alleen de hoofdkleur is instelbaar: --done (klaar) en --danger (let op)
   blijven vast, want die betekenen iets. */
const ACCENTEN = {
  /* Nieuw bij de restyle naar het donker+lime sci-fi-ontwerp: dezelfde tint
     als lib/tokens.css nu standaard gebruikt (--rust), hier als eigen,
     kiesbare hoofdkleur — zodat iemand met een al bestaand profiel (dat
     zijn eigen --rust nog op zijn oude keuze zet) 'm alsnog kan aanzetten
     zonder een nieuw profiel te hoeven maken. */
  lime:   { naam:'Lime',   donker:'#C4F236', donkerDim:'#6B7A1E', licht:'#4F6B08', lichtDim:'#3A4F06' },
  oranje: { naam:'Oranje', donker:'#CF6A30', donkerDim:'#743C1B', licht:'#F26B3A', lichtDim:'#C94E22' },
  blauw:  { naam:'Blauw',  donker:'#337ACC', donkerDim:'#1D4572', licht:'#337ACC', lichtDim:'#255893' },
  groen:  { naam:'Groen',  donker:'#46B976', donkerDim:'#276842', licht:'#37905C', lichtDim:'#235C3B' },
  paars:  { naam:'Paars',  donker:'#9160C3', donkerDim:'#593181', licht:'#8046B9', lichtDim:'#5C3285' },
  oker:   { naam:'Oker',   donker:'#D9A326', donkerDim:'#795B15', licht:'#A0791C', lichtDim:'#644B12' }
};

function defaultUserSettings(){
  // Was 'oranje' — een nieuw profiel opent nu meteen in de nieuwe standaardkleur
  // (lime); wie het profiel al had staat op wat hij zelf koos en verandert niet.
  /* bgKleurDonker/bgKleurLicht zijn leeg tenzij je zelf een achtergrondkleur
     kiest. Wat er gekozen wordt is de kleurtoon (tint en verzadiging); hoe
     licht of donker de achtergrond is blijft aan de schuiven hieronder. Zo
     blijft het verschil tussen pagina, tegel en verhoogd vlak staan — daar
     leunt de hele opmaak op — en kun je toch elke kleur nemen. */
  return { pastel: false, darkBgLightness: 14, lightBgGray: 6, lightTileGray: 8, accent: 'lime',
           tegelZoomPercentage: 200, bgKleurDonker: '', bgKleurLicht: '', thema: 'light' };
}
/* Pincodes worden gehasht bewaard (PBKDF2-SHA256, per gebruiker een eigen
   salt). Eerder stond de pincode leesbaar in de opslag; iedereen die bij het
   browserprofiel kon, kon hem zo overnemen. Bestaande profielen migreren
   automatisch zodra de pincode een keer goed wordt ingevoerd. */
const PIN_ITERATIES = 150000;

function heeftWebCrypto(){
  return typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.deriveBits === 'function';
}
function bytesNaarHex(buf){
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function nieuweSalt(){
  const ruw = new Uint8Array(16);
  if(typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(ruw);
  else for(let i = 0; i < ruw.length; i++) ruw[i] = Math.floor(Math.random() * 256);
  return bytesNaarHex(ruw);
}

/* PBKDF2 ook zónder WebCrypto.

   crypto.subtle bestaat alleen in een "veilige context": via https of via
   localhost. Open je DintelhavenPlanner.html rechtstreeks vanaf de schijf
   (file://), dan is het er niet — en dan kon je geen gebruiker meer aanmaken
   ("deze browser ondersteunt het veilig opslaan van een pincode niet").

   Daarom staat dezelfde berekening hieronder nog een keer in gewoon
   JavaScript: SHA-256, HMAC daaromheen, PBKDF2 daaromheen. Exact dezelfde
   parameters als de WebCrypto-versie, dus exact dezelfde uitkomst — een
   pincode die je vanaf de schijf instelt werkt daarna gewoon via de server,
   en andersom. WebCrypto blijft de eerste keus waar het bestaat: dat is
   sneller en in C geschreven. */
const SHA256_TABELLEN = (() => {
  const k = [], h = [];
  const isPriem = (x) => { for(let i = 2; i * i <= x; i++) if(x % i === 0) return false; return true; };
  for(let n = 2; k.length < 64; n++){
    if(!isPriem(n)) continue;
    if(h.length < 8) h.push(((Math.sqrt(n) % 1) * 4294967296) >>> 0);
    k.push(((Math.cbrt(n) % 1) * 4294967296) >>> 0);
  }
  return { k, h };
})();

function sha256Bytes(bytes){
  const { k, h } = SHA256_TABELLEN;
  const H = h.slice();
  const rotr = (x, n) => ((x >>> n) | (x << (32 - n))) >>> 0;
  const lengte = bytes.length;
  const totaal = ((lengte + 9 + 63) >> 6) << 6;
  const blok = new Uint8Array(totaal);
  blok.set(bytes);
  blok[lengte] = 0x80;
  const dv = new DataView(blok.buffer);
  dv.setUint32(totaal - 8, Math.floor(lengte / 536870912), false);   // hoge helft van de bitlengte
  dv.setUint32(totaal - 4, (lengte * 8) >>> 0, false);
  const w = new Uint32Array(64);
  for(let off = 0; off < totaal; off += 64){
    for(let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
    for(let i = 16; i < 64; i++){
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], hh = H[7];
    for(let i = 0; i < 64; i++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + k[i] + w[i]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    const nieuw = [a,b,c,d,e,f,g,hh];
    for(let i = 0; i < 8; i++) H[i] = (H[i] + nieuw[i]) >>> 0;
  }
  const uit = new Uint8Array(32);
  const uitDv = new DataView(uit.buffer);
  H.forEach((v, i) => uitDv.setUint32(i * 4, v, false));
  return uit;
}

function hmacSha256(sleutel, bericht){
  let k = sleutel.length > 64 ? sha256Bytes(sleutel) : sleutel;
  const blok = new Uint8Array(64);
  blok.set(k);
  const binnen = new Uint8Array(64 + bericht.length);
  const buiten = new Uint8Array(64 + 32);
  for(let i = 0; i < 64; i++){
    binnen[i] = blok[i] ^ 0x36;
    buiten[i] = blok[i] ^ 0x5c;
  }
  binnen.set(bericht, 64);
  buiten.set(sha256Bytes(binnen), 64);
  return sha256Bytes(buiten);
}

function pbkdf2Sha256(wachtwoord, salt, iteraties, lengte){
  const uit = new Uint8Array(lengte);
  let gedaan = 0, blokNr = 1;
  while(gedaan < lengte){
    const eerste = new Uint8Array(salt.length + 4);
    eerste.set(salt);
    new DataView(eerste.buffer).setUint32(salt.length, blokNr, false);
    let u = hmacSha256(wachtwoord, eerste);
    const t = u.slice();
    for(let i = 1; i < iteraties; i++){
      u = hmacSha256(wachtwoord, u);
      for(let j = 0; j < t.length; j++) t[j] ^= u[j];
    }
    const neem = Math.min(t.length, lengte - gedaan);
    uit.set(t.subarray(0, neem), gedaan);
    gedaan += neem;
    blokNr++;
  }
  return uit;
}

async function hashPin(pin, saltHex){
  const enc = new TextEncoder();
  if(heeftWebCrypto()){
    const key = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt: enc.encode(saltHex), iterations: PIN_ITERATIES, hash:'SHA-256' },
      key, 256
    );
    return bytesNaarHex(bits);
  }
  return bytesNaarHex(pbkdf2Sha256(enc.encode(pin), enc.encode(saltHex), PIN_ITERATIES, 32));
}
// Vergelijking in constante tijd, zodat de duur niets over de hash verraadt.
function gelijkInConstanteTijd(a, b){
  if(typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
  let diff = 0;
  for(let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}
async function setUserPin(user, pin){
  user.pinSalt = nieuweSalt();
  user.pinHash = await hashPin(pin, user.pinSalt);
  user.pinLengte = pin.length;
  delete user.pin;                       // oude leesbare pincode weggooien
}
async function verifyUserPin(user, invoer){
  // Migratiepad: profiel van vóór het hashen heeft nog een leesbare pincode.
  if(user.pin != null && !user.pinHash){
    if(!gelijkInConstanteTijd(String(invoer), String(user.pin))) return false;
    try{ await setUserPin(user, String(invoer)); await saveUsers(); }
    catch(e){ console.warn('Kon pincode niet omzetten naar hash:', e); }
    return true;
  }
  if(!user.pinHash || !user.pinSalt) return false;
  return gelijkInConstanteTijd(await hashPin(String(invoer), user.pinSalt), user.pinHash);
}

// Een pincode van 4 cijfers is zonder rem in seconden door te proberen.
const pinPogingen = new Map();           // userId -> {aantal, blokTot}
function pinBlokkadeRest(userId){
  const st = pinPogingen.get(userId);
  if(!st || !st.blokTot) return 0;
  return Math.max(0, Math.ceil((st.blokTot - Date.now()) / 1000));
}
function registreerPinFout(userId){
  const st = pinPogingen.get(userId) || { aantal: 0, blokTot: 0 };
  st.aantal++;
  if(st.aantal >= 5){
    st.blokTot = Date.now() + Math.min(300, 15 * Math.pow(2, st.aantal - 5)) * 1000;
  }
  pinPogingen.set(userId, st);
}
function wisPinPogingen(userId){ pinPogingen.delete(userId); }

async function loadUsers(){
  const data = await loadJson(USERS_STORAGE_KEY, { users: [], currentUserId: null });
  users = data.users || [];
  currentUserId = data.currentUserId || null;
  applyCurrentUserSettings();
}
async function saveUsers(){
  await saveJson(USERS_STORAGE_KEY, { users, currentUserId });
}
function getCurrentUser(){
  return users.find(u => u.id === currentUserId) || null;
}
function applyCurrentUserSettings(){
  const user = getCurrentUser();
  // Op body, niet op documentElement. De lichte modus zet --bg/--surface in
  // lib/tokens.css op `body.light-theme`, en die staat dichter bij de inhoud dan
  // :root — een waarde op documentElement werd daardoor volledig genegeerd en de
  // twee grijsschuiven deden in de lichte modus dus niets. Inline op body wint
  // van die klasseregel, en werkt ook in de donkere modus.
  const root = document.body;
  if(!user){
    ['--bg','--surface','--surface-2','--rust','--rust-dim','--haven-tegel-zoom'].forEach(v => root.style.removeProperty(v));
    pastelFactor = 1;
    return;
  }
  const s = user.settings || defaultUserSettings();
  pastelFactor = s.pastel ? 0.5 : 1;
  root.style.setProperty('--haven-tegel-zoom', (s.tegelZoomPercentage ?? 200) / 100);

  // hoofdkleur: per modus een eigen waarde, allebei op contrast gecontroleerd
  const accent = ACCENTEN[s.accent] || ACCENTEN.oranje;
  if(themaIsLichtAchtig()){
    /* 'lime' is de standaardkeuze van elk profiel en hoort bij het donkere
       thema. In licht is de huiskleur het oranje uit lib/tokens.css; alleen wie
       zelf een andere kleur koos houdt die. */
    if(s.accent === 'lime'){
      root.style.removeProperty('--rust');
      root.style.removeProperty('--rust-dim');
    } else {
      root.style.setProperty('--rust', accent.licht);
      root.style.setProperty('--rust-dim', accent.lichtDim);
    }
  } else {
    root.style.setProperty('--rust', accent.donker);
    root.style.setProperty('--rust-dim', accent.donkerDim);
  }

  /* De zelfgekozen achtergrondkleur levert alleen de tint en de verzadiging;
     de lichtheid blijft van de schuiven komen. Anders zou één kleur de drie
     vlakken (pagina, tegel, verhoogd) gelijk trekken en valt het verschil weg
     waar de hele opmaak op leunt. Niets gekozen: dezelfde vaste tinten als
     altijd (222 in de lichte modus, 211 in de donkere). */
  const eigenKleur = themaIsLichtAchtig() ? s.bgKleurLicht : s.bgKleurDonker;
  const eigen = eigenKleur ? hexNaarHsl(safeColor(eigenKleur, null) || '') : null;

  if(themaIsLichtAchtig()){
    /* De bodem lag op 84% lichtheid — zelfs met de schuif helemaal dicht
       (30) bleef de lichte modus daardoor bijna wit en dus fel. De schuif
       zelf hoefde niet breder (0-30 blijft een prettige duimafstand); de som
       erachter rekent nu steiler (0,55 → 1,4) en de bodem ligt op 55%, zodat
       "helemaal dicht" ook echt gedimd aanvoelt in plaats van nauwelijks
       anders dan de standaardstand. Op 0 verandert er niets — wie de schuif
       nooit aanraakte, ziet dezelfde lichte modus als voorheen. */
    const bgGray = Math.max(0, Math.min(30, s.lightBgGray ?? 6));
    const tileGray = Math.max(0, Math.min(30, s.lightTileGray ?? (s.lightGray ?? 8)));
    /* Met de schuiven op hun beginstand en geen eigen kleur blijven de crème
       tinten uit lib/tokens.css staan. Alleen wie eraan draait krijgt de
       berekende kleuren, en dan op een warme tint in plaats van grijsblauw. */
    const beginstand = !eigen && bgGray === 6 && tileGray === 8;
    if(beginstand){
      ['--bg','--surface','--surface-2'].forEach(v => root.style.removeProperty(v));
      return;
    }
    const tint = eigen ? eigen.h : 34;
    // Met een eigen kleur telt zijn verzadiging mee, maar begrensd: een volle
    // kleur over het hele scherm maakt de tekst erop onleesbaar.
    const verz = (gray) => eigen ? Math.min(40, Math.max(eigen.s * 0.5, gray)) : Math.min(gray, 18);
    root.style.setProperty('--bg', hslToHex(tint, verz(Math.min(bgGray, 18)), Math.max(55, 97 - bgGray * 1.4)));
    root.style.setProperty('--surface', hslToHex(tint, verz(Math.min(tileGray, 18)), Math.max(50, 96 - tileGray * 1.4)));
    root.style.setProperty('--surface-2', hslToHex(tint, verz(Math.min(tileGray, 18) + 4), Math.max(42, 90 - tileGray * 1.4)));
  } else {
    const l = Math.max(6, Math.min(24, s.darkBgLightness ?? 14));
    const tint = eigen ? eigen.h : 211;
    const verz = eigen ? Math.min(45, Math.max(10, eigen.s)) : 24;
    root.style.setProperty('--bg', hslToHex(tint, verz, Math.max(4, l - 4)));
    root.style.setProperty('--surface', hslToHex(tint, verz, l));
    root.style.setProperty('--surface-2', hslToHex(tint, verz, l + 5));
  }
}

async function loadTrips(){
  trips = await loadJson(STORAGE_KEY, []);
  if(trips.length === 0 && SEED_TRIPS.length){
    trips = JSON.parse(JSON.stringify(SEED_TRIPS));
    await saveTrips();
  }
  let migrated = false;
  trips.forEach(t => {
    if(t.stationGepland === undefined){ t.stationGepland = t.station; migrated = true; }
    if(t.liegeplaatsGepland === undefined){ t.liegeplaatsGepland = t.liegeplaats; migrated = true; }
    if(t.aangemeerd === undefined){ t.aangemeerd = false; migrated = true; }
    if(t.klaarOmTeLaden === undefined){ t.klaarOmTeLaden = false; migrated = true; }
    if(t.order === undefined){ t.order = t.planbegin ?? 0; migrated = true; }
    if(t.dummyResolutions === undefined){ t.dummyResolutions = {}; migrated = true; }
    // Bakstatus en groepskoppeling stonden vroeger alleen op de regel zelf en
    // gingen daardoor verloren bij een her-import. Wat er nu op de regels
    // staat, halen we eenmalig over naar de tegel.
    if(t.bakKenmerken === undefined){
      t.bakKenmerken = {};
      (t.rows || []).forEach(r => {
        if(!r.leichter) return;
        if(r.bakStatus) onthoudBakKenmerk(t, r.leichter, 'status', r.bakStatus);
        if(r.manualGroupKey) onthoudBakKenmerk(t, r.leichter, 'groepKey', r.manualGroupKey);
      });
      migrated = true;
    }
  });
  if(migrated) await saveTrips();
  const removedOnLoad = dedupeActiveTrips();
  if(removedOnLoad) await saveTrips();
  dataLoaded = true;
}

async function resetAllData(){
  await logAction('Alles gewist');
  trips = [];
  /* De haven hoort er ook bij. Waar een bak ligt staat niet in `trips` maar
     in een eigen lijst op baknaam, en die bleef staan — dan was de planlijst
     leeg terwijl de haven tot de nok toe vol lag. */
  havenPosities = {};
  havenOpenPlaats = null;
  havenSelectie.clear();
  havenGekozenSets.clear();
  havenGekozenBakken.clear();
  /* Ook de VH- en HGK-lijsten. Zonder die stap zetten bakken zonder
     aankomsttijd zichzelf meteen weer op de lege bakkenplaats — die staan
     immers in de lijst als "ligt er al" — en leek de haven nooit leeg te
     krijgen. */
  vhBakken = [];
  hgkBakken = [];
  vhImportedAt = null;
  hgkImportedAt = null;
  await saveHavenPosities();
  await saveVhBakken();
  await saveHgkBakken();
  await saveTrips();
  render();
}

// Alleen het wegschrijven naar de opslag. saveTrips() verderop roept dit aan
// en stuurt de planning daarna ook naar de meekijkers. Deze twee mogen niet
// dezelfde naam dragen: functiedeclaraties worden gehesen, dus een tweede
// `function saveTrips` verderop in het bestand overschrijft deze al vóórdat er
// ook maar één regel draait.
async function saveTripsNaarOpslag(){
  havenVergeetBerekening();   // de haven leest hieruit; opnieuw uitrekenen
  await saveJson(STORAGE_KEY, trips);
}
