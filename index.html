    const zoneSlots = havenZoneSlots(zone);
    const schaduwHtml = [];
    for(let r = 0; r < rijenGetekend; r++){
      const bezetHier = sets.some(s => s.rij <= r && s.rij + s.hoogte > r);
      if(bezetHier) continue;
      const slot = zoneSlots.find(sl => sl.rij === r && sl.kol === 0);
      if(!slot) continue;
      const bandHoogte = legeRijPx;
      schaduwHtml.push(`<div class="plaats-schaduw" data-schaduw-slot="${slot.index}" style="top:${rijTops[r]}px;height:${bandHoogte}px"></div>`);
    }
    if(schaduwHtml.length) raster.insertAdjacentHTML('beforeend', schaduwHtml.join(''));
    raster.querySelectorAll('.plaats-schaduw').forEach(el => {
      /* Staat er een tegel vergroot (aangetikt in Onderweg of op de lege
         plaats), dan is die het die hierheen gaat (v1.332). */
      el.addEventListener('click', () => havenGezoomdeTegel
        ? havenPlaatsGezoomdeTegel(id, +el.dataset.schaduwSlot)
        : havenZetGekozenSets(id, +el.dataset.schaduwSlot));
    });
  }

  /* De vertrek-hoek werkt óók als aanwijsdoel, niet alleen als sleepdoel: tik je
     eerst een set aan en dan op "Vertrokken", dan vaart die set weg — net zoals
     een tik op een lege rij hem daarheen verplaatst. Zonder dit moest je een
     tegel per se naar het vak slépen (melding Herman, okt 2026). */
  const vertrekvak = container.querySelector('#havenVertrekvak');
  if(vertrekvak){
    vertrekvak.addEventListener('click', async () => {
      if(!havenGekozenSets.size && !havenGekozenBakken.size){
        showToast('Tik eerst een set aan, dan op Vertrokken.');
        return;
      }
      if(havenGekozenBakken.size){
        const namen = havenBakken().filter(b => havenGekozenBakken.has(b.sleutel)).map(b => b.naam);
        if(namen.length) await havenLaatBakkenVertrekken(namen);
        havenGekozenBakken.clear();
      }
      for(const key of [...havenGekozenSets]) await havenLaatSetVertrekken(key);
      havenGekozenSets.clear();
      havenToonGekozenSets();
      havenHertekenPlaatsContainer(container, id);
      render();
    });
  }
}

function havenZetPlaatsPaneel(id){
  const vorige = havenOpenPlaats;
  havenOpenPlaats = id;
  const paneel = document.getElementById('havenPlaatsPaneel');
  if(!paneel) return;
  havenTekenPlaatsTabs();

  if(!id){
    paneel.hidden = true; paneel.innerHTML = '';
    havenOntkoppelBuitenKlik();
    return;
  }
  havenKoppelBuitenKlik();

  const vol = id === 'vol';

  /* Het paneel dekt de haven niet meer helemaal af. De lege plaats opent
     vanaf het westen over de halve haven, de volle vanaf het oosten over
     zeventig procent. Zo blijft er altijd een stuk haven zichtbaar om
     naartoe te slepen — en zie je meteen waar je vandaan komt. */
  paneel.hidden = false;
  paneel.classList.toggle('vanuit-west', id !== 'vol');
  paneel.classList.toggle('vanuit-onder', id === 'vol');

  /* De volle plaats komt van onderen omhoog en krijgt daarom twee grepen: een
     liggende bovenop, waar je hem wegduwt in de richting waar hij vandaan
     kwam, en dezelfde greep aan de zijkant als altijd — met de punt nu ook
     naar beneden, want daar gaat hij heen. */
  const grepen = vol
    ? [{ plek:'op-boven', richting:'naar-onder' }, { plek:'op-links', richting:'naar-onder' }]
    : [{ plek:'op-rechts', richting:'naar-west' }];
  const greepHtml = grepen.map(g => `
    <!-- ❮ en ❯ zijn interpunctie: veel schermlezers slaan die over, en dan
         blijft er letterlijk "knop" over. De title helpt hier niet, want dit
         paneel wordt met de vinger bediend en daar is geen muisaanwijzer. -->
    <button type="button" class="haven-paneelgreep ${g.plek} ${g.richting}"
            aria-label="Menu aan de kant schuiven"
            title="Menu aan de kant schuiven — wat je hebt aangetikt blijft klaarstaan">
      <span class="ribbel"></span>
      <span class="punt" aria-hidden="true">${g.richting === 'naar-west' ? '❮' : '❯'}</span>
      <span class="ribbel"></span>
    </button>`).join('');

  havenVulPlaatsContainer(id, paneel, { extraHtml: greepHtml, autoBreedte: true });

  paneel.querySelectorAll('.haven-paneelgreep').forEach(g =>
    g.addEventListener('click', havenSchuifPaneelDicht));

  /* Openen schuift net zo goed, vanaf de kant waar het paneel hoort. Alleen
     als het paneel er nog niet stond: de haven wordt bij elke wijziging
     opnieuw getekend, en dan zou het menu telkens weer naar binnen komen. */
  if(vorige !== id) havenSchuifPaneelOpen(paneel);
}

/* De lege bakkenplaats als vaste, altijd zichtbare kolom (breed scherm) —
   zie havenVulPlaatsContainer voor de inhoud zelf. Geen greep, geen
   auto-breedte (de kolom heeft een vaste CSS-breedte), nooit verborgen. De
   kop is zelf ook een bestemming: tik 'm aan om een gekozen set hierheen te
   sturen zónder een specifieke schaduw te kiezen — zoals de oude tabknop
   deed (havenTekenPlaatsTabs). */
/* "Wat ligt waar" — per duwboot hoeveel bakken er zijn en op welke plekken.
   Dit stond in het voorstel over de tekening heen, in het lege water midden in
   het bassin. Daar is het niet neer te zetten zonder te gokken: de tekening
   schaalt op hoogte mee met het scherm, dus dat lege stuk zit nooit op een
   vaste plaats en een blok eroverheen zou vroeg of laat een bak afdekken.
   Onder de lege-bakkenplaatskolom is de plek wél voorspelbaar, en daar stond
   toch al bijna tweehonderd pixels niets. */
function havenIndexHtml(){
  const perBoot = new Map();
  const voegToe = (boot, plek) => {
    const naam = verkortSchipnaam(boot) || boot;
    if(!naam) return;
    if(!perBoot.has(naam)) perBoot.set(naam, { totaal: 0, plekken: new Map() });
    const r = perBoot.get(naam);
    r.totaal++;
    r.plekken.set(plek, (r.plekken.get(plek) || 0) + 1);
  };
  havenBakkenMetPlek().forEach(b => {
    if(!b.plek) return;
    voegToe(b.vertrekbootEcht || b.vertrekboot, HAVEN_PLEKNAAM[b.zone] || b.zone);
  });
  havenWachtrij().forEach(set => set.bakken.forEach(() => voegToe(set.schip, 'onderweg')));

  if(!perBoot.size) return '';
  const regels = [...perBoot.entries()]
    .sort((a, b) => b[1].totaal - a[1].totaal)
    .map(([boot, r]) => {
      const plekken = [...r.plekken.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([p, n]) => `${n}× ${esc(p)}`).join(' · ');
      return `<div class="haven-index-regel">
                <span class="boot">${esc(boot)}</span>
                <span class="n">${r.totaal}</span>
                <span class="waar">${plekken}</span>
              </div>`;
    }).join('');
  return `<section class="haven-index" aria-label="Wat ligt waar, per duwboot">
            <h3>Wat ligt waar</h3>${regels}
          </section>`;
}

function havenTekenLegeKolom(){
  const kolom = document.getElementById('havenLegeKolom');
  if(!kolom) return;
  havenVulPlaatsContainer('leeg', kolom, { schaduw: true, extraHtml: havenIndexHtml() });
  const kop = kolom.querySelector('.haven-plaatskop');
  if(kop){
    kop.style.cursor = 'pointer';
    kop.title = 'Tik om een gekozen set hierheen te sturen';
    kop.addEventListener('click', () => havenZetGekozenSets('leeg'));
  }
}

/* De duwbakkenpalen als vaste kolom boven Onderweg (breed scherm). Zelfde
   inhoud en bediening als de lege kolom, alleen 4 bakken diep. */
function havenTekenPalenKolom(){
  const kolom = document.getElementById('havenPalenKolom');
  if(!kolom) return;
  havenVulPlaatsContainer('palen', kolom, { schaduw: true });
  const kop = kolom.querySelector('.haven-plaatskop');
  if(kop){
    kop.style.cursor = 'pointer';
    kop.title = 'Tik om een gekozen set hierheen te sturen';
    kop.addEventListener('click', () => havenZetGekozenSets('palen'));
  }
}

/* De zichtbare container van de volle plaats: op een breed scherm de vaste
   kolom (#havenVolVlak), op telefoon het in/uitschuivende paneel. Sinds de
   kolom bestaat moeten plekken die "het vol-paneel" opzochten hier langs. */
function havenVolContainer(){
  const vlak = document.getElementById('havenVolVlak');
  if(vlak && !vlak.hidden) return vlak;
  return document.getElementById('havenPlaatsPaneel');
}

/* De volle bakkenplaats als vaste kolom rechts van de tekening
   (havenVulPlaatsContainer 'vol', mét het Vertrokken-vak). Tot 1.368 was het
   een zwevend vlak over het water, met een greep en een eigen positionering
   op de waterrand; als kolom is dat allemaal niet meer nodig. De kop is ook
   een bestemming: tik 'm aan om een gekozen set hierheen te sturen. Alleen op
   een breed scherm; op telefoon loopt 'vol' via het mobiele tabblad + paneel. */
function havenTekenVolVlak(){
  const vlak = document.getElementById('havenVolVlak');
  if(!vlak) return;
  // schaduw: toon de lege rijen als gestippelde ghost-plekken (drop-doelen).
  havenVulPlaatsContainer('vol', vlak, { schaduw: true });
  const kop = vlak.querySelector('.haven-plaatskop');
  if(kop){
    kop.style.cursor = 'pointer';
    kop.title = 'Tik om een gekozen set hierheen te sturen';
    kop.addEventListener('click', () => havenZetGekozenSets('vol'));
    /* Achter-, midden-, kopbak (1.339): kies er een, en de eerstvolgende set die
       je hier neerlegt komt in die kolom van zijn tegel — twee kolen als kopbak,
       dan kunnen de vier erts er later achter. Nog een keer tikken zet hem uit. */
    const keuzes = document.createElement('div');
    keuzes.className = 'haven-vol-kolomkeuze';
    keuzes.setAttribute('role', 'group');
    keuzes.setAttribute('aria-label', 'Leg de volgende set neer als');
    keuzes.innerHTML = HAVEN_VOL_KOLOMMEN.map(k =>
      `<button type="button" data-kolom="${k}" aria-pressed="${havenVolKolomKeuze === k}">${k}bak</button>`).join('');
    keuzes.addEventListener('pointerdown', e => e.stopPropagation());
    keuzes.addEventListener('click', e => {
      e.stopPropagation();
      const knop = e.target.closest('button[data-kolom]');
      if(!knop) return;
      // Aangetikte bakken op Vol: die verschuiven nu meteen (1.340).
      if(havenZetGekozenInKolom(vlak, knop.dataset.kolom)) return;
      havenVolKolomKeuze = havenVolKolomKeuze === knop.dataset.kolom ? null : knop.dataset.kolom;
      keuzes.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kolom === havenVolKolomKeuze)));
    });
    kop.after(keuzes);
  }
}

/* Na een sleep die eindigt in zijn eigen container (rij/kolom opschuiven),
   moet precies díe container opnieuw getekend worden. Welke dat is hangt af
   van het element zelf, niet van zoneId: dezelfde 'leeg' kan zowel bij de
   vaste kolom horen (breed scherm) als bij het gedeelde paneel (telefoon).
   Vóór deze functie riep havenKoppelPaneelSlepen hier altijd
   havenZetPlaatsPaneel(zoneId) aan, en dat opent voor 'leeg' op een breed
   scherm per ongeluk het oude, inmiddels overbodige paneel weer. */
function havenHertekenPlaatsContainer(container, zoneId){
  if(container.id === 'havenLegeKolom') havenTekenLegeKolom();
  else if(container.id === 'havenPalenKolom') havenTekenPalenKolom();
  else if(container.id === 'havenVolVlak') havenTekenVolVlak();
  else havenZetPlaatsPaneel(zoneId);
}

/* Buiten het menu drukken sluit het.

   Het pijltje blijft, maar een menu dat over de haven ligt wil je ook kwijt
   kunnen zonder eerst naar de greep te hoeven. Drie uitzonderingen: binnen
   het menu zelf gebeurt van alles, een tabje regelt zijn eigen open en dicht,
   en staat er iets klaar voor een bestemming, dan is die druk buiten het menu
   juist het aanwijzen van die plek — dan mag het menu niet onder je vinger
   vandaan schuiven. */
let havenBuitenKlikLos = null;

function havenKoppelBuitenKlik(){
  havenOntkoppelBuitenKlik();
  const luister = (e) => {
    const paneel = document.getElementById('havenPlaatsPaneel');
    if(!paneel || paneel.hidden) return;
    if(paneel.contains(e.target)) return;
    if(e.target.closest && e.target.closest('.haven-plaatstab')) return;
    // Op telefoon bepaalt de eigen tabbalk (havenKiesMobielTab, via
    // renderHavenTab) of het paneel open moet — een tik op een ander tabje
    // mag niet ook nog eens de "buiten geklikt"-sluiting triggeren, anders
    // wint de laatste (met een vertraging van 340ms) alsnog en klapt het
    // net-geopende paneel na de tabwissel weer dicht.
    if(e.target.closest && e.target.closest('.haven-mobieltab')) return;
    if(havenWachtOpBestemming()) return;
    havenSchuifPaneelDicht();
  };
  document.addEventListener('pointerdown', luister, true);
  havenBuitenKlikLos = () => document.removeEventListener('pointerdown', luister, true);
}

function havenOntkoppelBuitenKlik(){
  if(havenBuitenKlikLos){ havenBuitenKlikLos(); havenBuitenKlikLos = null; }
}

function havenSchuifPaneelOpen(paneel){
  const doek = paneel.closest('.haven-canvas');
  if(doek) doek.classList.add('schuift');
  paneel.classList.add('schuift-dicht');
  void paneel.offsetWidth;                       // stand vastzetten vóór de overgang
  paneel.classList.remove('schuift-dicht');
  setTimeout(() => { if(doek) doek.classList.remove('schuift'); }, PANEEL_SCHUIF_MS);
}

/* Het menu aan de kant schuiven zonder de keuze te verliezen.
   Met de tikfunctie kies je een set of een bak in het menu en wijs je daarna
   de plek op de kade aan — maar de B3- en B4-lengtes liggen precies onder het
   menu. Dit schuift het weg; wat aanstaat blijft aanstaan, en het tabje
   onderaan zet het weer open. */
const PANEEL_SCHUIF_MS = 340;

function havenSchuifPaneelDicht(){
  const paneel = document.getElementById('havenPlaatsPaneel');
  if(!paneel || paneel.hidden) return havenZetPlaatsPaneel(null);
  const doek = paneel.closest('.haven-canvas');
  if(doek) doek.classList.add('schuift');
  paneel.classList.add('schuift-dicht');
  setTimeout(() => {
    paneel.classList.remove('schuift-dicht');
    havenZetPlaatsPaneel(null);
    if(doek) doek.classList.remove('schuift');
  }, PANEEL_SCHUIF_MS);
}

// Sleep je over een tabje, dan klapt het bijbehorende paneel open. Alleen
// als het nog niet openstaat — anders knippert het bij elke muisbeweging.
function havenTabOnderAanwijzer(e){
  const balk = document.getElementById('havenPlaatsTabs');
  if(!balk) return null;
  for(const knop of balk.querySelectorAll('.haven-plaatstab')){
    const r = knop.getBoundingClientRect();
    if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){
      return knop.dataset.plaats;
    }
  }
  return null;
}

function havenBinnenElement(el, e){
  if(!el) return false;
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right &&
         e.clientY >= r.top  && e.clientY <= r.bottom;
}

/* Welke bakkenplaats ligt onder de aanwijzer, als je hier iets zou laten
   vallen? Eerst de lege-bakkenplaats-kolom (altijd 'leeg' als hij zichtbaar
   is en je erboven zit — geen toggle-status meer nodig, hij staat toch
   altijd op dezelfde plek), dan het in/uitschuivende paneel (dat blijft ofwel
   'vol', ofwel — op telefoon — 'leeg', dus havenOpenPlaats zelf zegt welke).
   Vervangt de oude "havenBovenPaneel(e) ? havenOpenPlaats : null" nu er twee
   containers tegelijk een geldige bestemming kunnen zijn in plaats van één
   gedeelde. */
function havenPlaatsZoneOnderAanwijzer(e){
  const kolom = document.getElementById('havenLegeKolom');
  if(kolom && !kolom.hidden && havenBinnenElement(kolom, e)) return 'leeg';
  const palen = document.getElementById('havenPalenKolom');
  if(palen && !palen.hidden && havenBinnenElement(palen, e)) return 'palen';
  // De volle bakkenplaats is een vaste kolom rechts (breed scherm) — altijd
  // 'vol' als je erboven zit. Dichtgeschoven heeft hij geen maat, dus geen doel.
  const volVlak = document.getElementById('havenVolVlak');
  if(volVlak && !volVlak.hidden && havenBinnenElement(volVlak, e)) return 'vol';
  const paneel = document.getElementById('havenPlaatsPaneel');
  if(paneel && !paneel.hidden && havenBinnenElement(paneel, e)) return havenOpenPlaats;
  return null;
}

// Alleen de vraag "sta ik boven een van de twee bakkenplaatsen" — gebruikt
// waar de precieze zone er niet toe doet (doelwit-markering, "heb ik het
// paneel verlaten"-tracking). Voor de bestemming zelf: havenPlaatsZoneOnderAanwijzer.
function havenBovenPaneel(e){
  return havenPlaatsZoneOnderAanwijzer(e) != null;
}

// --- Slepen en selecteren -------------------------------------------
/* Druk je tussen de bakken van een set — het midden van een blok van vier, of
   de naad tussen twee — dan pak je de hele set op. Daar ligt geen bak, dus de
   aanraking komt anders op de zone eronder terecht en zou de selectie wissen.

   Met een vinger is dat de natuurlijke beweging: je legt hem midden op de set
   die je wilt verplaatsen. Een losse bak pak je nog steeds door hem zelf aan te
   raken. */
function havenSetOnderSvgPunt(px, py){
  const perSet = new Map();
  havenBakkenMetPlek().forEach(b => {
    if(!b.plek) return;
    const k = b.zone + '|' + havenPlaatsGroepKey(b);
    if(!perSet.has(k)) perSet.set(k, []);
    perSet.get(k).push(b);
  });

  let beste = null, besteOppervlak = Infinity;
  perSet.forEach(lijst => {
    if(lijst.length < 2) return;
    const links  = Math.min(...lijst.map(b => hx(b.plek.x)));
    const rechts = Math.max(...lijst.map(b => hx(b.plek.x + b.plek.w)));
    const boven  = Math.min(...lijst.map(b => hy(b.plek.y)));
    const onder  = Math.max(...lijst.map(b => hy(b.plek.y + b.plek.h)));
    if(px < links || px > rechts || py < boven || py > onder) return;
    // Overlappen er twee, dan wint de kleinste — dat is de set die je bedoelt.
    const oppervlak = (rechts - links) * (onder - boven);
    if(oppervlak < besteOppervlak){
      besteOppervlak = oppervlak;
      beste = lijst.map(b => b.sleutel);
    }
  });
  return beste;
}

/* Terugslepen naar Onderweg. Handig als een set te vroeg naar binnen is
   gehaald — dat gebeurt, je ziet een schip aankomen en bent net te snel.

   De ligplaats blijft bewaard: havenWachtrij() zet de set terug in de kolom en
   onthoudt waar hij lag, dus haal je hem later opnieuw binnen dan komt hij op
   dezelfde plek terug. Klaar om te laden gaat wel uit — een set die er nog niet
   is, kan ook niet klaarliggen. */
async function havenTerugNaarOnderweg(sleutels){
  const alle = havenBakken();
  const setKeys = new Set(alle.filter(b => sleutels.includes(b.sleutel)).map(b => b.tegelSleutel));
  const tripIds = new Set(alle.filter(b => setKeys.has(b.tegelSleutel) && b.tripId).map(b => b.tripId));

  // Eerst kijken wát er teruggaat, dan vastleggen, dan pas omzetten — anders
  // bewaart het actielog de stand van ná de wijziging en doet ongedaan maken
  // niets.
  const teruggaand = [...tripIds]
    .map(id => trips.find(x => x.id === id))
    .filter(t => t && t.aangemeerd);

  if(!teruggaand.length){
    showToast('Deze bakken horen bij geen enkele reis — die kunnen niet terug naar Onderweg.');
    return 0;
  }
  const namen = teruggaand.map(t => t.schubboot || t.station || '?');
  await logAction(`Haven: terug naar Onderweg (${namen.join(', ')})`);
  // Ook een afgeronde rit kan zo de haven uit: zijn bakken zijn vertrokken.
  teruggaand.forEach(t => {
    t.aangemeerd = false; t.klaarOmTeLaden = false;
    delete t.bakkenInHaven;
  });
  const aantal = teruggaand.length;
  await saveTrips();
  return aantal;
}

/* Ghost: laat vóór het loslaten zien waar de set terechtkomt.

   Zonder dit sleep je op gevoel en zie je pas ná het loslaten of het goed
   ging — en ging het mis, dan moet je het terugslepen. De ghost gebruikt
   dezelfde berekening als de verplaatsing zelf (havenZoekPlaats), dus wat je
   ziet is precies wat er gebeurt. Past het nergens, dan is er geen ghost en
   weet je meteen dat loslaten niets oplevert. */
function havenWisGhost(svg){
  svg.querySelectorAll('.haven-ghost').forEach(n => n.remove());
  havenVerbergInfoBalk();
}

/* De info-balk (idee 14): wat je vroeger op de Onderweg-tegel las, plus wat er
   onder je vinger gebeurt — alleen zolang je sleept of iets hebt aangetikt.
   Alle sleeproutes komen langs havenToonGhost/havenWisGhost en het aantikken
   langs havenToonAlleGloei/havenVerbergAlleGloei; daar haakt hij in, dus hij
   werkt voor alles tegelijk. `zoneId` en `plan` zijn de plek onder de vinger
   (weg te laten bij aantikken). */
function havenInfoVoorBakken(namen, zoneId, plan){
  const regels = [];
  const inHaven = new Map(havenBakken().map(b => [b.sleutel, b]));
  const ritVan = naam => trips.find(t => t.status === 'actief' &&
    t.rows.some(r => r.leichter && bargeNamesMatch(r.leichter, naam))) || null;
  const ritten = namen.map(ritVan);
  const zonder = ritten.filter(t => !t).length;
  if(zonder) regels.push({ tekst: zonder === namen.length ? 'Niet op de EECV-lijst'
                                  : `${zonder} van ${namen.length} niet op de EECV-lijst`, soort: 'waarschuw' });
  const gepland = new Set();
  ritten.filter(Boolean).forEach(t => {
    if(!t.station && !t.liegeplaats) return;
    const kade = t.liegeplaats && laadlengteBereikbaar(t).includes(t.liegeplaats) ? laadlengteKade(t, t.liegeplaats) : '';
    gepland.add(`Gepland: ${[t.station, t.liegeplaats, kade].filter(Boolean).join(' · ')}`);
  });
  gepland.forEach(tekst => regels.push({ tekst }));
  const vertrek = new Set();
  namen.forEach(n => {
    const b = inHaven.get(normalizeBargeName(n));
    const v = b ? { boot: b.vertrekbootEcht, tijd: b.vertrektijd } : ((findBakMatch(n) || {}).entry || {});
    const boot = b ? v.boot : v.vertrekboot, tijd = b ? v.tijd : v.vertrektijd;
    if(boot) vertrek.add(`Vertrek: ${verkortSchipnaam(boot)}${tijd ? ' ' + tijd : ''}`);
  });
  vertrek.forEach(tekst => regels.push({ tekst }));

  if(zoneId){
    const zone = havenZone(zoneId);
    if(!plan) regels.push({ tekst: `Past hier niet${zone ? ' (' + havenZoneNaam(zoneId) + ')' : ''}`, soort: 'gevaar' });
    else if(zone && zone.type === 'kade'){
      // Bereik van de machine (idee 8/9): waarschuwen, niet weigeren.
      new Set(ritten.filter(Boolean).map(t => t.station)).forEach(station => {
        const mc = (zone.machines || []).find(m => m.station === station);
        const buiten = plan.plekken.filter(p => !mc || p.kol < mc.vanKolom || p.kol + 1 > mc.totKolom).length;
        if(buiten) regels.push({ tekst: `${buiten === plan.plekken.length ? 'Buiten' : 'Deels buiten'} bereik van ${station}`,
                                 soort: 'waarschuw' });
      });
    }
  }
  return regels;
}

function havenToonInfoBalk(namen, zoneId, plan){
  const svg = document.getElementById('havenSvg');
  if(!svg || !namen || !namen.length) return;
  const regels = havenInfoVoorBakken(namen, zoneId, plan);
  if(!regels.length){ havenVerbergInfoBalk(); return; }
  const host = svg.parentNode;
  let balk = host.querySelector('#havenInfoBalk');
  if(!balk){
    balk = document.createElement('div');
    balk.id = 'havenInfoBalk';
    balk.className = 'haven-info-balk';
    balk.setAttribute('role', 'status');
    host.appendChild(balk);
  }
  const html = regels.map(r => `<span class="${r.soort || ''}">${esc(r.tekst)}</span>`).join('<span class="sep" aria-hidden="true">·</span>');
  if(balk.innerHTML !== html) balk.innerHTML = html;   // niet bij elke muisbeweging opnieuw voorlezen
}
function havenVerbergInfoBalk(){
  document.querySelectorAll('#havenInfoBalk').forEach(n => n.remove());
}

/* De set past niet waar hij nu boven hangt (1.353): op die plek een rode
   schaduw in zijn eigen vorm — dan zie je dát en wáár, en loslaten doet niets.
   `groepen` zijn de gesleepte bakken met hun oorspronkelijke plek; sdx/sdy
   schuift ze naar de plek waar ze zouden landen. */
function havenToonRodeGhost(svg, namen, zoneId, groepen, sdx, sdy){
  havenWisGhost(svg);
  havenToonInfoBalk(namen, zoneId, null);
  const NS = 'http://www.w3.org/2000/svg';
  const groep = document.createElementNS(NS, 'g');
  groep.setAttribute('class', 'haven-ghost past-niet');
  groepen.forEach(v => {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', v.x + sdx + 1.5);
    r.setAttribute('y', v.y + sdy + 1.5);
    r.setAttribute('width',  hx(BAK_LENGTE_M) - 3);
    r.setAttribute('height', hy(BAK_BREEDTE_M) - 3);
    r.setAttribute('rx', 2.5);
    groep.appendChild(r);
  });
  svg.appendChild(groep);
  return groep;
}

function havenToonGhost(svg, namen, zoneId, startSlot, herindelen, strikt){
  havenWisGhost(svg);
  if(!namen.length) return;
  const plan = havenZoekPlaats(namen, zoneId, startSlot, herindelen, strikt);
  havenToonInfoBalk(namen, zoneId, plan);
  if(!plan) return;

  const NS = 'http://www.w3.org/2000/svg';
  const zone = plan.zone;
  const groep = document.createElementNS(NS, 'g');
  groep.setAttribute('class', 'haven-ghost');

  // Net als bij de bakken zelf: aaneengesloten vanaf de westelijke bak, zodat
  // het gat tussen twee laadlengtes niet middenin de ghost valt.
  const westKolom = Math.min(...plan.plekken.map(p => p.kol));
  const westX = havenKolomX(zone, westKolom);
  const stap = havenKolomStap(zone);

  havenZoneSlots(zone).forEach(s => {
    if(!plan.plekken.some(p => p.slot === s.index)) return;
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', hx(westX + (s.kol - westKolom) * stap) + 1.5);
    r.setAttribute('y', hy(s.y) + 1.5);
    // Een plek is een halve baklengte breed, maar een bak beslaat er twee.
    // De ghost moet de bak laten zien, niet de helft ervan.
    r.setAttribute('width',  hx(BAK_LENGTE_M) - 3);
    r.setAttribute('height', hy(s.h) - 3);
    r.setAttribute('rx', 2.5);
    groep.appendChild(r);
  });

  // Vooraan, zodat de ghost niet achter een bak verdwijnt die er al ligt.
  svg.appendChild(groep);
  return groep;
}

/* De tegels in de haventekening: één omlijning om alles wat bij elkaar hoort,
   met onderaan een tabje per duwboot (zelfde vorm als het tabje van de volle
   bakkenplaats: een lip met een pijl erin, zo breed als de naam nodig heeft).

   Aantikken zet alleen de bakken van díe boot in de selectie — daarna wijs je
   een bestemming aan zoals altijd (havenZetGekozenSets kent havenSelectie al
   als geldige bron). */
const TEGELTAB = { hoogte: 11, tekst: 8, padding: 4, gat: 3, teken: 6 };

function havenTegelGroepen(bakken, mobielZone){
  const groepen = new Map();
  bakken.forEach(b => {
    if(!b.plek) return;
    const zone = havenZone(b.zone);
    if(zone && zone.virtueel) return;
    if(mobielZone && b.zone !== mobielZone.id) return;
    const k = b.zone + '|' + b.tegelSleutel;
    if(!groepen.has(k)) groepen.set(k, []);
    groepen.get(k).push(b);
  });
  return groepen;
}

function havenTegelKader(lijst){
  return {
    links:  Math.min(...lijst.map(b => hx(b.plek.x))),
    rechts: Math.max(...lijst.map(b => hx(b.plek.x + b.plek.w))),
    boven:  Math.min(...lijst.map(b => hy(b.plek.y))),
    onder:  Math.max(...lijst.map(b => hy(b.plek.y + b.plek.h)))
  };
}

/* Tegels die dezelfde boot ophaalt, als één vlak getekend — op verzoek.

   havenTegelGroepen hierboven blijft de bron van waarheid voor wát bij
   elkaar hoort (aankomst, zie tegelSleutel): dat blijft zo, want één
   aankomstset met meerdere kleuren/boten moet één eenheid blijven bij een
   her-import, en dát mag dit visuele samenvoegen niet verstoren. Dit is dus
   puur de tékening: twee aparte aankomsttegels die toch met dezelfde boot op
   dezelfde tijd vertrekken (zie ook perZoneBoot hieronder, dat ze al één
   gedeeld tabje gaf) krijgen hier ook één omlijning, zodat je niet meer apart
   hoeft te combineren "deze twee horen eigenlijk bij elkaar".

   Alleen samenvoegen binnen dezelfde zone en als de kaders dicht genoeg bij
   elkaar liggen (MAX_GAT): twee leveringen voor dezelfde boot die toevallig
   aan weerskanten van een hele kade liggen, horen niet tot één gerekt vlak
   over al het water ertussen te worden — dan lees je niet meer waar de
   bakken echt liggen. Ver uit elkaar blijven ze gewoon twee vlakken; het
   gedeelde tabje regelt dan nog steeds dat je ze in één keer kunt
   verplaatsen. */
/* Een tegel waarvan een bak los is gelegd, valt in stukken uiteen (idee 12).
   Eerder werd het kader om álle bakken van de tegelsleutel getrokken; schoof
   je één bak van de 4e naar de 1e lengte, dan rekte de tegel zich uit over de
   hele kade. Stukken = bakken die elkaar raken (ook schuin op een hoek); een
   kier van een kwart bak telt nog als raken, een halve bak niet meer. */
function havenTegelStukken(lijst){
  const MARGE = HALVE_BAK_M / 2;
  const raakt = (a, b) =>
    Math.max(a.plek.x - (b.plek.x + b.plek.w), b.plek.x - (a.plek.x + a.plek.w)) <= MARGE &&
    Math.max(a.plek.y - (b.plek.y + b.plek.h), b.plek.y - (a.plek.y + a.plek.h)) <= MARGE;
  const over = [...lijst], stukken = [];
  while(over.length){
    const stuk = [over.shift()];
    for(let i = 0; i < stuk.length; i++){
      for(let j = over.length - 1; j >= 0; j--){
        if(raakt(stuk[i], over[j])) stuk.push(over.splice(j, 1)[0]);
      }
    }
    stukken.push(stuk);
  }
  return stukken;
}

function havenTegelVisueleGroepen(bakken, mobielZone){
  const groepen = [...havenTegelGroepen(bakken, mobielZone).entries()]
    .flatMap(([sleutel, lijst]) => havenTegelStukken(lijst).map(stuk =>
      ({ lijst: stuk, zone: stuk[0].zone, kader: havenTegelKader(stuk), sleutels: new Set([sleutel]) })));

  const vertrekSleutels = (g) => new Set(g.lijst
    .filter(b => b.vertrekbootEcht)
    .map(b => b.vertrekbootEcht + '|' + (b.vertrektijd || '')));

  const MAX_GAT = HALVE_BAK_M * 3;   // ruim een baklengte speling
  let gewijzigd = true;
  while(gewijzigd){
    gewijzigd = false;
    buiten:
    for(let i = 0; i < groepen.length; i++){
      for(let j = i + 1; j < groepen.length; j++){
        const a = groepen[i], b = groepen[j];
        if(a.zone !== b.zone) continue;
        // Stukken van dezelfde tegel zijn juist met opzet uit elkaar gelegd.
        if([...b.sleutels].some(s => a.sleutels.has(s))) continue;
        const aSleutels = vertrekSleutels(a);
        if(![...vertrekSleutels(b)].some(s => aSleutels.has(s))) continue;
        const gat = Math.max(a.kader.links - b.kader.rechts, b.kader.links - a.kader.rechts, 0);
        if(gat > MAX_GAT) continue;
        a.lijst = a.lijst.concat(b.lijst);
        a.kader = havenTegelKader(a.lijst);
        b.sleutels.forEach(s => a.sleutels.add(s));
        groepen.splice(j, 1);
        gewijzigd = true;
        break buiten;
      }
    }
  }
  return groepen;
}

/* Het vlak van de tegel — vóór de bakken getekend, zodat de bakjes er net als
   in Onderweg en de lege kolom ín liggen in plaats van erop. */
function havenTekenTegelVlakken(svg, bakken, mobielZone){
  const NS = 'http://www.w3.org/2000/svg';
  const el = (naam, attrs) => {
    const e = document.createElementNS(NS, naam);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  havenTegelVisueleGroepen(bakken, mobielZone).forEach(({ kader: k }) => {
    const x = k.links - 3, y = k.boven - 3;
    const b = (k.rechts - k.links) + 6, h = (k.onder - k.boven) + 6;

    const groep = el('g', { class: 'haven-tegel-vlak-groep' });
    groep.appendChild(el('rect', { x, y, width: b, height: h, rx: 3.5, class: 'haven-tegel-vlak' }));
    svg.appendChild(groep);
  });
}

function havenTekenTegelsInTekening(svg, bakken, mobielZone){
  const NS = 'http://www.w3.org/2000/svg';
  // Eigen hulpje: het gelijknamige in renderHavenTab staat daar lokaal.
  const el = (naam, attrs) => {
    const e = document.createElementNS(NS, naam);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };

  /* Het tabje is een lip van de tegel, geen los knopje: de kant die tegen de
     tegel aan ligt is recht (geen ruimte ertussen), de kant die vrij ligt is
     afgerond. Zo hangt het eraan vast in plaats van ervoor te zweven.
     `omhoog` betekent: de lip hangt bóven de tegel, dus is hij aan de
     bovenkant afgerond en zit hij met zijn onderrand vast. */
  const lipPad = (x, y, b, h, r, omhoog) => omhoog
    ? `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y}` +
      ` L${x + b - r},${y} Q${x + b},${y} ${x + b},${y + r}` +
      ` L${x + b},${y + h} Z`
    : `M${x},${y} L${x + b},${y} L${x + b},${y + h - r}` +
      ` Q${x + b},${y + h} ${x + b - r},${y + h}` +
      ` L${x + r},${y + h} Q${x},${y + h} ${x},${y + h - r} Z`;

  const tegels = havenTegelVisueleGroepen(bakken, mobielZone)
    .map(g => ({ ...g, groep: el('g', { class: 'haven-tegel' }) }));

  /* Eén tabje per duwboot per getekende tegel (idee 12).

     Dichtbij liggende tegels van dezelfde boot zijn al één vlak
     (havenTegelVisueleGroepen), dus daar staat ook maar één tabje. Een los
     gelegd stuk krijgt zijn eigen tabje, met de kleur van de bakken ín dat
     stuk. Aantikken kiest wel álle bakken van die boot in deze zone, ook die
     in het andere stuk: de set blijft één eenheid. Dezelfde boot op twee
     vertrektijden blijft twee tabjes: dat zijn in het echt twee vertrekken. */
  /* Herziening na v1.322 (Hermans schets): één tabje per groep bakken van
     dezelfde boot die elkaar écht raken — niet per getekende tegel. Twee
     lengtes die als één vlak getekend worden (2e + 1e) gaven anders één kluitje
     tabjes in het midden, onder niemands bakken. En aantikken kiest alleen die
     groep: HK 12 onder de 2e lengte neemt niet ongevraagd de HK 12-bak op de
     1e mee. */
  const bootSleutel = (zone, b) => zone + '|' + b.vertrekbootEcht + '|' + (b.vertrektijd || '');
  const perBoot = new Map();
  tegels.forEach(t => t.lijst.forEach(b => {
    if(!b.vertrekbootEcht) return;            // aankomstboot krijgt geen tabje
    const sleutel = bootSleutel(t.zone, b);
    if(!perBoot.has(sleutel)) perBoot.set(sleutel, { boot: b.vertrekbootEcht, tijd: b.vertrektijd || null, zone: t.zone, bakken: [] });
    perBoot.get(sleutel).bakken.push(b);
  }));
  const perTegelBoot = [];
  perBoot.forEach(v => havenTegelStukken(v.bakken).forEach(groep => {
    const tegel = tegels.find(t => t.lijst.includes(groep[0]));
    perTegelBoot.push({ ...v, bakken: groep, tegel });
  }));

  /* Waar hangt het tabje: gecentreerd onder de bakken van de groep waarvan de
     onderkant vrij is; zijn die er niet (er ligt overal een andere bak onder),
     dan boven de bakken waarvan de bovenkant vrij is. */
  const MARGE = HALVE_BAK_M / 2;
  const alleBakken = tegels.flatMap(t => t.lijst.map(b => ({ b, zone: t.zone })));
  const buurAan = (b, zone, onder) => alleBakken.some(({ b: o, zone: z }) => o !== b && z === zone &&
    o.plek.x < b.plek.x + b.plek.w - MARGE && o.plek.x + o.plek.w > b.plek.x + MARGE &&
    Math.abs(onder ? o.plek.y - (b.plek.y + b.plek.h) : (o.plek.y + o.plek.h) - b.plek.y) <= MARGE);
  const tabAnker = (v) => {
    const vrijOnder = v.bakken.filter(b => !buurAan(b, v.zone, true));
    if(vrijOnder.length) return { kader: havenTegelKader(vrijOnder), omhoog: false };
    const vrijBoven = v.bakken.filter(b => !buurAan(b, v.zone, false));
    return { kader: havenTegelKader(vrijBoven.length ? vrijBoven : v.bakken), omhoog: !!vrijBoven.length };
  };

  /* Een tabje mag nooit over andere bakken heen liggen.

     Ligt er een tegel vlak onder deze, dan lag het tabje dwars over die
     bakken heen: twee baknummers onleesbaar en een naam die je niet kon
     thuisbrengen. Het schuift nu langs de rand van zijn eigen tegel tot het
     vrij ligt — eerst naar rechts en links langs de onderrand, en pas als
     daar niets vrij is naar de bovenrand. Losmaken van de tegel doen we
     nooit: een tabje dat ergens los zweeft hoort zichtbaar bij niets meer.
     Daarom moet het altijd minstens MIN_VAST breed tegen zijn tegel aan
     blijven liggen, en is de terugval (echt nergens plek) gewoon zijn eigen
     hoek — dan ligt hij erover, maar wel aan de juiste tegel. */
  const RAAKT = 0.5;                          // tegen elkaar aan mag, eroverheen niet
  const MIN_VAST = 8;                         // zoveel moet het tabje zijn tegel raken
  const obstakels = tegels.map(t => ({
    x: t.kader.links - 3, y: t.kader.boven - 3,
    b: (t.kader.rechts - t.kader.links) + 6,
    h: (t.kader.onder - t.kader.boven) + 6
  }));
  const botst = (r) => obstakels.some(o =>
    r.x < o.x + o.b - RAAKT && r.x + r.b > o.x + RAAKT &&
    r.y < o.y + o.h - RAAKT && r.y + r.h > o.y + RAAKT);

  function zoekTabPlek(anker, breedte){
    const k = anker.kader;
    const links = k.links - 3;
    const minX = links - (breedte - MIN_VAST);
    const maxX = k.rechts + 3 - MIN_VAST;
    /* Het tabje begint in het midden van zijn eigen bakken (idee 13, na de
       schets per groep). Omdat het midden elke keer uit het kader komt,
       schuift het vanzelf mee als de groep van maat verandert. */
    const midden = Math.max(minX, Math.min(maxX, (k.links + k.rechts - breedte) / 2));
    const maxStap = Math.ceil(Math.max(maxX - midden, midden - minX) / 2);
    for(const omhoog of (anker.omhoog ? [true, false] : [false, true])){
      const y = omhoog ? k.boven - 3 - TEGELTAB.hoogte : k.onder + 3;
      for(let stap = 0; stap <= maxStap; stap++){
        // Botst het midden, dan afwisselend een stapje naar rechts en links.
        for(const kant of (stap === 0 ? [1] : [1, -1])){
          const x = midden + kant * stap * 2;
          if(x < minX || x > maxX) continue;
          if(!botst({ x, y, b: breedte, h: TEGELTAB.hoogte })) return { x, y, omhoog };
        }
      }
    }
    return { x: midden, y: k.onder + 3, omhoog: false };
  }

  perTegelBoot.forEach(v => {
    const t = v.tegel;
    const label = verkortSchipnaam(v.boot) || '?';
    // JetBrains Mono is vast van breedte: ~0,6 van de lettergrootte per teken.
    const breedte = Math.round(TEGELTAB.padding * 2 + TEGELTAB.teken +
                               label.length * TEGELTAB.tekst * 0.6) + 2;
    const plek = zoekTabPlek(tabAnker(v), breedte);
    const x = plek.x, y = plek.y;
    // Het volgende tabje moet om dít tabje heen, met een kier ertussen.
    obstakels.push({ x: x - TEGELTAB.gat, y, b: breedte + TEGELTAB.gat * 2, h: TEGELTAB.hoogte });

    /* De kleur van de bakken waar dit tabje bij hoort — dezelfde kleur als de
       rand van die bakken (setKleurVoorThema), zodat je vóór het aantikken al
       ziet welke set eraan hangt. Kleur en vertrekset zijn hetzelfde gegeven,
       dus meer dan één kleur onder één boot hoort niet voor te komen; gebeurt
       het toch, dan wint de kleur die de meeste bakken hebben. */
    const kleurTelling = new Map();
    v.bakken.forEach(b => {
      const c = safeColor(b.kleur, null);
      if(c) kleurTelling.set(c, (kleurTelling.get(c) || 0) + 1);
    });
    let bronKleur = null, meeste = 0;
    kleurTelling.forEach((n, c) => { if(n > meeste){ meeste = n; bronKleur = c; } });
    const vulling = bronKleur ? setKleurVoorThema(bronKleur) : null;
    // Zwarte of witte letters, afhankelijk van hoe licht die vulling uitvalt.
    const opVulling = vulling ? (hexNaarLab(vulling).l > 62 ? '#141414' : '#ffffff') : null;

    const tab = el('g', {
      class: 'haven-boottab',
      'data-boottab': v.boot,
      'data-boottijd': v.tijd || '',
      'data-bootzone': v.zone,
      'data-tabbakken': v.bakken.map(b => b.sleutel).join('|'),
      tabindex: '0', role: 'button',
      'aria-label': `${label}: deze groep bakken kiezen (${v.bakken.length})`
    });
    const omtrek = lipPad(x, y, breedte, TEGELTAB.hoogte, 3, plek.omhoog);
    tab.appendChild(el('path', {
      d: omtrek, class: 'haven-boottab-vlak',
      ...(vulling ? { style: `fill:${vulling}` } : {})
    }));
    tab.appendChild(el('path', { d: omtrek, class: 'haven-boottab-keuzerand' }));
    const pijl = el('text', {
      x: x + TEGELTAB.padding, y: y + TEGELTAB.hoogte / 2, class: 'haven-boottab-pijl',
      ...(opVulling ? { style: `fill:${opVulling};fill-opacity:.75` } : {})
    });
    pijl.textContent = '❯';
    tab.appendChild(pijl);
    const naam = el('text', {
      x: x + TEGELTAB.padding + TEGELTAB.teken, y: y + TEGELTAB.hoogte / 2, class: 'haven-boottab-naam',
      ...(opVulling ? { style: `fill:${opVulling}` } : {})
    });
    naam.textContent = label;
    tab.appendChild(naam);
    const titel = document.createElementNS(NS, 'title');
    titel.textContent = `${v.boot}${v.tijd ? ' — ' + v.tijd : ''} · ${v.bakken.map(b => b.naam).join(', ')}`;
    tab.appendChild(titel);

    /* Tik op het tabje = alle bakken die met die boot vertrekken selecteren,
       zodat je ze in één keer kunt verplaatsen. De randen van de bakken worden
       hier meteen bijgewerkt, net als bij een gewone tik op een bak
       (havenSchakelBakSelectie) — zonder dat stond de keuze wel in het geheugen
       maar zag je er niets van. Nog een keer tikken zet de keuze weer uit. */
    const kiesDezeBoot = (ev) => {
      ev.stopPropagation();
      const eigen = v.bakken.map(b => b.sleutel);   // alleen deze groep, niet de hele boot
      const stondAan = eigen.length && havenSelectie.size === eigen.length
                       && eigen.every(k => havenSelectie.has(k));
      havenSelectie.clear();
      if(!stondAan) eigen.forEach(k => havenSelectie.add(k));
      svg.querySelectorAll('.haven-bak').forEach(n => {
        const aan = havenSelectie.has(n.dataset.bak);
        n.classList.toggle('gekozen', aan);
        n.setAttribute('aria-pressed', String(aan));
      });
      svg.querySelectorAll('.haven-boottab').forEach(x => x.classList.remove('gekozen'));
      if(havenSelectie.size) tab.classList.add('gekozen');
      havenToonSelectie();
      havenVerversGhostVoorSelectie();
    };
    // Een tik komt via de sleepcode binnen (havenKoppelSlepen, beeindig): die
    // houdt de aanwijzer vast, dus een gewone click op het tabje komt niet aan.
    tab._kies = kiesDezeBoot;
    tab.addEventListener('keydown', (ev) => {
      if(ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      kiesDezeBoot(ev);
    });
    t.groep.appendChild(tab);
  });

  tegels.forEach(t => svg.appendChild(t.groep));
}

/* Alle plekken laten oplichten waar de vergrote tegel terecht kán.

   Tik je een tegel op de lege plaats aan, dan vergroot die zich én lichten
   alle laadlengtes op waar hij past. Tik je zo'n oplichtende plek aan, dan
   schuift de hele tegel daarheen — als tegel, niet als losse bakken.

   Zelfde berekening als de ghost hierboven (havenZoekPlaats), maar dan voor
   álle zones tegelijk in plaats van alleen die onder de aanwijzer. De
   klik-afhandelaar hangt aan de vakjes die we hier zelf maken, zodat de
   bestaande sleepcode in havenKoppelSlepen niets hoeft te weten
   van dit pad. */
function havenVerbergAlleGloei(){
  document.querySelectorAll('.haven-gloei').forEach(n => n.remove());
  havenVerbergInfoBalk();
}

/* Liggen er ghosts over elkaar (bij één bak tientallen), dan wint die waarvan
   het midden het dichtst bij de vinger ligt — niet de bovenste. (fout 21) */
function havenDichtstbijzijndeGloei(x, y){
  let beste = null, afstand = Infinity;
  document.querySelectorAll('.haven-gloei').forEach(g => {
    const r = g.getBoundingClientRect();
    if(x < r.left || x > r.right || y < r.top || y > r.bottom) return;
    const d = Math.hypot(x - (r.left + r.right) / 2, y - (r.top + r.bottom) / 2);
    if(d < afstand){ afstand = d; beste = g; }
  });
  return beste;
}

function havenToonAlleGloei(namen){
  havenVerbergAlleGloei();
  const svg = document.getElementById('havenSvg');
  if(!svg || !namen || !namen.length) return;
  havenToonInfoBalk(namen);   // idee 14: ook bij aantikken

  const NS = 'http://www.w3.org/2000/svg';
  const tekenPlan = (plan, dun) => {
    const groep = document.createElementNS(NS, 'g');
    groep.setAttribute('class', 'haven-gloei' + (dun ? ' dun' : ''));
    const westKolom = Math.min(...plan.plekken.map(p => p.kol));
    const westX = havenKolomX(plan.zone, westKolom);
    const stap = havenKolomStap(plan.zone);

    havenZoneSlots(plan.zone).forEach(s => {
      if(!plan.plekken.some(p => p.slot === s.index)) return;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', hx(westX + (s.kol - westKolom) * stap) + 1.5);
      r.setAttribute('y', hy(s.y) + 1.5);
      r.setAttribute('width',  hx(BAK_LENGTE_M) - 3);
      r.setAttribute('height', hy(s.h) - 3);
      r.setAttribute('rx', 2.5);
      groep.appendChild(r);
    });
    if(!groep.childNodes.length) return;
    /* Fout 21: de hele ghost is aantikbaar, ook het water tussen de bakvakjes.
       Eén onzichtbaar vlak over de volle omvang, onder de vakjes. */
    const vakken = [...groep.childNodes];
    const xs = vakken.map(v => +v.getAttribute('x')), ys = vakken.map(v => +v.getAttribute('y'));
    const raak = document.createElementNS(NS, 'rect');
    raak.setAttribute('class', 'raak');
    raak.setAttribute('x', Math.min(...xs) - 1.5);
    raak.setAttribute('y', Math.min(...ys) - 1.5);
    raak.setAttribute('width',  Math.max(...vakken.map((v, i) => xs[i] + +v.getAttribute('width')))  - Math.min(...xs) + 3);
    raak.setAttribute('height', Math.max(...vakken.map((v, i) => ys[i] + +v.getAttribute('height'))) - Math.min(...ys) + 3);
    groep.insertBefore(raak, groep.firstChild);

    groep.dataset.zone = plan.zone.id;
    groep.dataset.start = Math.min(...plan.plekken.map(p => p.slot));
    groep.dataset.slots = plan.plekken.map(p => p.slot).join(',');
    groep.addEventListener('click', async (e) => {
      e.stopPropagation();
      const doel = havenDichtstbijzijndeGloei(e.clientX, e.clientY) || groep;
      await havenPlaatsGezoomdeTegel(doel.dataset.zone, +doel.dataset.start);
    });
    svg.appendChild(groep);
  };

  HAVEN_LAYOUT.zones.forEach(zone => {
    // De bakkenplaatsen zijn virtueel (alleen een rekenmaat, geen tekening) —
    // daar valt dus niets op te laten lichten. Die bereik je met hun eigen
    // kolom/paneel, zoals altijd.
    if(zone.virtueel || zone.id === HAVEN_VERTROKKEN) return;

    /* Elke laadlengte waar de set past krijgt zijn eigen schaduw, niet alleen
       de eerste die toevallig vrij is. Eerder lichtte er per kade één plek op;
       tikte je net ernaast, dan gebeurde er niets en leek de set terug te
       vallen naar de lege plaats. Nu is elke plek waar hij zou passen ook echt
       aan te wijzen. */
    const slots = havenZoneSlots(zone);
    const rijen = slots.length ? slots[slots.length - 1].rij + 1 : 0;
    const walRij = havenVultVanOnderen(zone) ? rijen - 1 : 0;
    const gezien = new Set();
    const teken = (plan) => {
      if(!plan) return false;
      const sleutel = plan.plekken.map(p => p.slot).sort((a, b) => a - b).join(',');
      if(gezien.has(sleutel)) return false;
      gezien.add(sleutel);
      tekenPlan(plan, namen.length === 1);
      return true;
    };

    /* Op een kade (idee 11): elke plek die de wal of een andere bak raakt.
       Eén bak: elke bakplek in elke rij (dun getekend, op de ertskade al gauw
       vijftig). Een set: het begin van elke laadlengte, in elke rij. De
       contactregel zit in havenZoekPlaats. */
    if(zone.type === 'kade'){
      const maxKol = slots.length ? Math.max(...slots.map(s => s.kol)) : 0;
      const kolommen = namen.length === 1
        ? null
        : (zone.lengtes || []).map(l => l.vanKolom);
      /* Eén bak: eerst de plekken op het bakraster van elke lengte, dan wat er
         in de gaten nog past zonder over een al getoonde plek te vallen. Zo
         liggen de ghosts netjes naast en achter de bakken, niet een halve bak
         verschoven (havenZoekPlaats keurt een halve buur af: 'scheef'). */
      const raster = [];
      (zone.lengtes || []).forEach(l => { for(let k = l.vanKolom; k + 1 < l.vanKolom + l.kolommen; k += KOLOMMEN_PER_BAK) raster.push(k); });
      const volgorde = [...raster, ...Array.from({ length: maxKol + 1 }, (_, k) => k).filter(k => !raster.includes(k))];
      for(let r = 0; r < rijen; r++){
        if(kolommen){ kolommen.forEach(k => teken(havenZoekPlaats(namen, zone.id, undefined, true, { cel: { r, k } }))); continue; }
        const getoond = new Set();
        // ponytail: één zoektocht per cel (≈ 6 × 19 per kade); sneller kan met één bezet-kaart als het hapert
        volgorde.forEach(k => {
          if(getoond.has(k) || getoond.has(k + 1)) return;
          if(teken(havenZoekPlaats(namen, zone.id, undefined, true, { cel: { r, k } }))){ getoond.add(k); getoond.add(k + 1); }
        });
      }
      if(namen.length > 1 && !gezien.size){
        // Past de set op geen enkel lengtebegin, dan nog de dichtstbijzijnde plek per lengte.
        (zone.lengtes || []).forEach(l => {
          const s = slots.find(x => x.rij === walRij && x.kol === l.vanKolom);
          if(s) teken(havenZoekPlaats(namen, zone.id, s.index, true));
        });
      }
      return;
    }

    // De palen: gewoon de eerste plek waar het past.
    teken(havenZoekPlaats(namen, zone.id, undefined, true));
  });
}

/* Een losse bak bij een tegel voegen. Legt de bak naast de tegel neer én
   onthoudt dat hij daar nu bij hoort, zodat een hertekening of een volgende
   import hem er niet weer uit haalt. Omgekeerd hoeft er niets: een bak die je
   ergens anders neerlegt, hoort daar dan ook weer bij zijn eigen tegel. */
/* Welke tegel ligt er onder de aanwijzer, binnen dít paneel? Niet via
   elementFromPoint: het meebewegende kopietje zit er vlak onder de muis
   tussen, en dat is geen tegel. De tegels zijn absoluut geplaatst en kennen
   hun eigen vak, dus rechttoe rechtaan nameten is hier zowel eenvoudiger als
   betrouwbaarder. */
function havenTegelOnderAanwijzer(paneel, ev){
  return [...paneel.querySelectorAll('.plaats-set')].find(t => {
    const r = t.getBoundingClientRect();
    return ev.clientX >= r.left && ev.clientX <= r.right
        && ev.clientY >= r.top  && ev.clientY <= r.bottom;
  }) || null;
}

/* Intra-set swap: een bak binnen zijn eigen tegel op een andere cel neerleggen.
   De bak onder de aanwijzer (of de ghost/lege cel daar) wisselt van plek met de
   gesleepte bak. Puur een weergave-override (havenBakPlekOverrides, lineaire
   celindex in het tegelraster); de ligplaats-slots blijven ongemoeid. Geeft
   true als er echt iets gewisseld is. */
async function havenWisselBakBinnenTegel(losBakje, ev, kaart, paneel, zoneId){
  const doel = document.elementFromPoint(ev.clientX, ev.clientY);
  const doelCel = doel && doel.closest && doel.closest('.haven-wachtrij-bak[data-cel]');
  // Alleen een cel binnen dezelfde tegel, en niet het bakje zelf.
  if(!doelCel || !kaart.contains(doelCel) || doelCel === losBakje) return false;
  const src = Number(losBakje.dataset.cel);
  const dst = Number(doelCel.dataset.cel);
  if(!Number.isInteger(src) || !Number.isInteger(dst) || src === dst) return false;
  const srcSleutel = losBakje.dataset.baksleutel;
  if(!srcSleutel) return false;
  const dstSleutel = doelCel.dataset.baksleutel;   // leeg of ghost: undefined
  const cel = el => ({ r: Number(el.dataset.r), k: Number(el.dataset.k) });
  // De hele tegel vastzetten zoals hij nu staat, anders schikken de bakken
  // zonder vaste cel zich na de wissel opnieuw en schuift de rest mee.
  kaart.querySelectorAll('.haven-wachtrij-bak[data-baksleutel]').forEach(el => {
    havenBakPlekOverrides[el.dataset.baksleutel] = cel(el);
  });
  havenBakPlekOverrides[srcSleutel] = cel(doelCel);
  // Bak↔bak: de ander neemt de vrijgekomen plek. Bak↔ghost/leeg: alleen de
  // gesleepte bak krijgt een plek; de ghost schuift vanzelf naar de lege cel.
  if(dstSleutel && dstSleutel !== srcSleutel) havenBakPlekOverrides[dstSleutel] = cel(losBakje);
  await saveHavenBakPlekOverrides();
  havenHertekenPlaatsContainer(paneel, zoneId);
  render();
  return true;
}

async function havenVoegBakBijTegel(naam, tegelSleutel, zoneId){
  if(!naam || !tegelSleutel) return;
  const tegelBakken = havenBakkenMetPlek()
    .filter(b => havenPlaatsGroepKey(b) === tegelSleutel && b.zone === zoneId && b.plek);
  if(!tegelBakken.length) return;
  // Hoort hij er al bij, dan is er niets te doen — en zou de override alleen
  // maar vastleggen wat de lijst zelf al zegt.
  if(tegelBakken.some(b => normalizeBargeName(b.naam) === normalizeBargeName(naam))) return;
  // Vóór het hertekenen onthouden: render() hieronder wist de zoom.
  const stondVergroot = !!havenGezoomdeTegel;

  havenTegelOverrides[normalizeBargeName(naam)] = tegelSleutel;
  await saveHavenTegelOverrides();

  // Naast de tegel neerleggen: dezelfde zone, aansluitend op wat er al ligt.
  const namen = [...tegelBakken.map(b => b.naam), naam];
  const start = Math.min(...tegelBakken.map(b => b.slot).filter(Number.isInteger));
  await havenVerplaatsBakken(namen, zoneId, start, true,
    `Haven: ${naam} bij tegel ${tegelSleutel} gezet`);
  render();
  /* De tegel is na het hertekenen een ander element; opnieuw opzoeken en weer
     vergroten, zodat je gewoon door kunt gaan waar je was. Welk paneel dat is
     hangt af van de plaats: de lege heeft zijn eigen vaste kolom, de volle het
     in/uitschuivende paneel. Stond hij niet vergroot (bijvoorbeeld omdat je
     het bakje ernaartoe sleepte in plaats van aantikte), dan blijft het
     daarbij — dan heb je het al gezien. */
  const host = zoneId === 'leeg' ? document.getElementById('havenLegeKolom')
    : zoneId === 'palen' ? document.getElementById('havenPalenKolom')
    : havenVolContainer();
  const nieuw = stondVergroot && host &&
    host.querySelector(`.plaats-set[data-plaatsset="${CSS.escape(tegelSleutel)}"]`);
  if(nieuw){
    const bakNamen = havenBakkenMetPlek()
      .filter(b => havenPlaatsGroepKey(b) === tegelSleutel && b.zone === zoneId && b.plek)
      .map(b => b.naam);
    havenGezoomdeTegelNamen = bakNamen;
    havenToonTegelZoom(nieuw, false);
    havenToonAlleGloei(bakNamen);
  }
}

/* De onderlinge ligging van bakken op een kade (of bij de palen), als cellen
   {r,k} vanaf linksboven: rij = rij in de tekening, kolom = hele baklengte
   (een bak beslaat KOLOMMEN_PER_BAK kolommen; een halve verstek valt weg).
   Bakken die niet op een kade liggen komen er niet in. */
function havenIndelingVanBakken(bakken){
  const uit = new Map();
  const opKade = bakken.filter(b => b.plek && Number.isInteger(b.plek.kol) && Number.isInteger(b.plek.rij)
    && ['kade', 'palen'].includes(havenZone(b.zone)?.type));
  if(!opKade.length) return uit;
  const minR = Math.min(...opKade.map(b => b.plek.rij));
  const minK = Math.min(...opKade.map(b => b.plek.kol));
  opKade.forEach(b => uit.set(b.sleutel,
    { r: b.plek.rij - minR, k: Math.floor((b.plek.kol - minK) / KOLOMMEN_PER_BAK) }));
  return uit;
}

/* Komen bakken de volle plaats op, dan nemen ze hun ligging uit de haven mee:
   twee die op de kade naast elkaar lagen, liggen op de tegel ook naast elkaar.
   Schuift er alleen iets binnen Vol (er ligt al een van deze bakken), dan
   blijft de tegel zoals hij is — dat regelt havenVoegBakkenBijTegel zelf. */
async function havenNeemIndelingMeeNaarVol(namen){
  const sleutels = namen.map(normalizeBargeName);
  const bakken = havenBakkenMetPlek().filter(b => sleutels.includes(b.sleutel));
  const keuze = havenVolKolomKeuze;
  havenVolKolomKeuze = null;                          // geldt voor één keer
  const alOpVol = bakken.some(b => b.zone === 'vol');
  if(alOpVol && !keuze) return;
  if(!alOpVol && !keuze && havenNeemGhostPlekIn(sleutels)){ await saveHavenBakPlekOverrides(); return; }
  let vorm;
  if(alOpVol){
    // Binnen Vol opnieuw neerleggen: de ligging die hij al had, alleen verschoven.
    vorm = new Map(sleutels.filter(sl => havenBakPlekOverrides[sl]).map(sl => [sl, havenBakPlekOverrides[sl]]));
  } else {
    vorm = havenIndelingVanBakken(bakken);
  }
  if(keuze && vorm.size < bakken.length) vorm = havenStandaardVolVorm(bakken);
  if(keuze && vorm.size){
    /* Achter-, midden- of kopbak (1.339): de set schuift naar die kolom van de
       tegel, zodat de rest er later voor of achter kan. Kolom 0 ligt tegen de
       duwboot (achter), 2 is de kop. */
    const cellen = [...vorm.values()];
    const minK = Math.min(...cellen.map(c => c.k));
    const breed = Math.max(...cellen.map(c => c.k)) - minK + 1;
    const start = havenVolStartKolom(keuze, breed);
    vorm = new Map([...vorm].map(([sl, c]) => [sl, { r: c.r, k: c.k - minK + start }]));
  }
  sleutels.forEach(sl => delete havenBakPlekOverrides[sl]);
  vorm.forEach((c, sl) => { havenBakPlekOverrides[sl] = c; });
  await saveHavenBakPlekOverrides();
}

/* Staan de binnenkomende bakken al als ghost in een tegel op de volle plaats,
   dan gaan ze precies daar liggen — de voorspelling (havenVoorspelGhosts) wordt
   zo de echte plek, en de rest van de tegel blijft staan. (1.341) */
function havenNeemGhostPlekIn(sleutels){
  const vlak = document.getElementById('havenVolVlak');
  if(!vlak) return false;
  const ghosts = sleutels.map(sl => vlak.querySelector(`.haven-wachtrij-bak.ontbreekt[data-zoeksleutel="${CSS.escape(sl)}"]`));
  if(ghosts.some(g => !g)) return false;
  const cel = el => ({ r: Number(el.dataset.r), k: Number(el.dataset.k) });
  new Set(ghosts.map(g => g.closest('.plaats-set'))).forEach(kaart => {
    if(kaart) kaart.querySelectorAll('.haven-wachtrij-bak[data-baksleutel]').forEach(el => { havenBakPlekOverrides[el.dataset.baksleutel] = cel(el); });
  });
  sleutels.forEach((sl, i) => { havenBakPlekOverrides[sl] = cel(ghosts[i]); });
  return true;
}

/* Achter-, midden- of kopbak: de keuze uit de knoppen op de volle plaats, voor
   de eerstvolgende set die daar neergelegd wordt. Van links naar rechts, zoals
   op de tegel: de duwboot links, dan achter, midden, kop. */
const HAVEN_VOL_KOLOMMEN = ['achter', 'midden', 'kop'];
let havenVolKolomKeuze = null;
const havenVolStartKolom = (keuze, breed) => Math.max(0, keuze === 'kop' ? 3 - breed : HAVEN_VOL_KOLOMMEN.indexOf(keuze));

/* Bak op de volle plaats aantikken en dan Achter-/Midden-/Kopbak: hij schuift
   binnen zijn tegel naar die kolom, op dezelfde rij, en blijft daar (vaste cel
   in havenBakPlekOverrides) tot je een andere kolom kiest of de set vertrekt.
   Ligt er al een bak op die plek, dan wisselen ze, net als bij slepen
   (havenWisselBakBinnenTegel); een ghost schuift vanzelf naar de vrije cel.
   Geeft false als er op Vol niets aangetikt is — dan geldt de knop voor de
   volgende set die hier neergelegd wordt. */
function havenZetGekozenInKolom(vlak, keuze){
  const gekozen = [...vlak.querySelectorAll('.plaats-set .haven-wachtrij-bak[data-baksleutel]')]
    .filter(el => havenGekozenBakken.has(el.dataset.baksleutel));
  if(!gekozen.length) return false;
  const cel = el => ({ r: Number(el.dataset.r), k: Number(el.dataset.k) });
  new Set(gekozen.map(el => el.closest('.plaats-set'))).forEach(kaart => {
    // De hele tegel vastzetten zoals hij nu staat, anders schikt de rest zich opnieuw.
    const alle = [...kaart.querySelectorAll('.haven-wachtrij-bak[data-baksleutel]')];
    alle.forEach(el => { havenBakPlekOverrides[el.dataset.baksleutel] = cel(el); });
    const hier = gekozen.filter(el => kaart.contains(el));
    const minK = Math.min(...hier.map(el => cel(el).k));
    const breed = Math.max(...hier.map(el => cel(el).k)) - minK + 1;
    const dk = havenVolStartKolom(keuze, breed) - minK;
    if(!dk) return;
    hier.forEach(el => {
      const van = cel(el), naar = { r: van.r, k: van.k + dk };
      const ander = alle.find(o => !hier.includes(o) && cel(o).r === naar.r && cel(o).k === naar.k);
      havenBakPlekOverrides[el.dataset.baksleutel] = naar;
      if(ander) havenBakPlekOverrides[ander.dataset.baksleutel] = van;
    });
  });
  havenGekozenBakken.clear();
  havenLegLog('kolom', gekozen.map(el => el.firstChild?.textContent || el.dataset.baksleutel), { keuze });
  saveHavenBakPlekOverrides().then(() => render());
  return true;
}

/* Een verse set van zes op de volle plaats (Herman, 13-10): de daalvaart-code
   uit de lijst wordt de bergvaart-plek. Stuurboord boven (r0), bakboord onder
   (r1); kolom 0/1/2 = achter/midden/kop. SV→BA, SA→BBM, MV→SA, MA→SBM,
   BA→BV, BV→SBV — de BB-fles wordt dus de kopbak. (1.341) */
const HAVEN_VOL_ZES = {
  MV: { r: 0, k: 0 }, MA: { r: 0, k: 1 }, BV: { r: 0, k: 2 },
  SV: { r: 1, k: 0 }, SA: { r: 1, k: 1 }, BA: { r: 1, k: 2 }
};
function havenPositieUitLijst(naam){
  const s = normalizeBargeName(naam);
  const v = [...vhBakken, ...hgkBakken].find(x => x.naam && normalizeBargeName(x.naam) === s);
  return v ? v.positie || null : null;
}

/* Waar hoort een ontbrekende bak bij — welk "blokje"? Bakken die nu samen
   liggen of samen komen, komen ook samen in de tegel: dezelfde rit/machine,
   dezelfde tegel in de haven, of dezelfde aankomstboot. (1.341) */
function havenBlokVan(naam){
  const s = normalizeBargeName(naam);
  const b = havenBakkenMetPlek().find(x => x.sleutel === s);
  if(b) return 'haven|' + b.zone + '|' + (b.tripId || b.tegelSleutel || '');
  const w = havenWachtrij().find(set => set.bakken.some(x => x.sleutel === s));
  if(w) return 'onderweg|' + w.key;
  const e = havenElders().find(set => set.bakken.some(x => x.sleutel === s));
  return e ? 'elders|' + e.key : 'los|' + s;
}

/* Voorspellen waar de ontbrekende bakken in een tegel op de volle plaats
   komen. Een verse set van zes met codes: elk op zijn vaste plek
   (HAVEN_VOL_ZES). Anders per blokje, grootste eerst: een paar of meer neemt
   hele vrije kolommen (zo blijft een blok van vier bij elkaar, achter +
   midden), een losse bak vult een kolom aan waar er al één ligt — naast de 108
   op de kop, in Hermans voorbeeld. Geeft Map "r,k" -> ghost. */
function havenVoorspelGhosts(raster, breedte, ontbreekt, totaal){
  const uit = new Map();
  const vrij = (r, k) => raster[r] && !raster[r][k] && !uit.has(r + ',' + k);
  const zet = (r, k, g) => uit.set(r + ',' + k, g);
  let rest = ontbreekt.slice();
  // Vaste plek per code alleen voor een verse set: alles wat mist komt samen (één blok).
  if(totaal === 6 && new Set(ontbreekt.map(g => g.blok)).size <= 1){
    rest = rest.filter(g => {
      const c = HAVEN_VOL_ZES[(ontleedPositie(g.positie) || {}).code];
      if(c && vrij(c.r, c.k)){ zet(c.r, c.k, g); return false; }
      return true;
    });
  }
  const vrijIn = k => raster.map((_, r) => r).filter(r => vrij(r, k));
  const blokken = new Map();
  rest.forEach(g => { const b = g.blok || ('los|' + g.naam); if(!blokken.has(b)) blokken.set(b, []); blokken.get(b).push(g); });
  [...blokken.values()].sort((a, b) => b.length - a.length).forEach(blok => {
    let i = 0;
    // Hele kolommen voor paren, van achter naar voren.
    for(let k = 0; k < breedte && blok.length - i >= 2; k++){
      const rijen = vrijIn(k);
      if(rijen.length < raster.length) continue;
      rijen.forEach(r => { if(i < blok.length) zet(r, k, blok[i++]); });
    }
    // De rest: eerst naast een bak die er al ligt (kolom met één vrije plek).
    while(i < blok.length){
      let k = [...Array(breedte).keys()].find(k => vrijIn(k).length === 1 && vrijIn(k).length < raster.length);
      if(k === undefined) k = [...Array(breedte).keys()].find(k => vrijIn(k).length);
      if(k === undefined) break;
      zet(havenRijNaastFlesgenoot(raster, vrijIn(k), blok[i]), k, blok[i++]);
    }
  });
  return uit;
}

/* Een losse bak in een lege kolom (de vijfde, op de kop): op de rij van zijn
   flesgenoot — de bak met dezelfde dwars-letter (BA/BV, SA/SV) — en anders
   bakboord, de onderste rij. (fout 20) */
function havenRijNaastFlesgenoot(raster, vrijeRijen, g){
  if(vrijeRijen.length < 2) return vrijeRijen[0];
  const p = ontleedPositie(g && g.positie);
  const genoot = p && raster.findIndex(rij => rij.some(b => b && ontleedPositie(b.positie)?.dwars === p.dwars));
  if(genoot != null && genoot >= 0 && vrijeRijen.includes(genoot)) return genoot;
  return vrijeRijen.includes(1) ? 1 : vrijeRijen[0];
}

/* Leglogboek (1.341): wie legt wat waar en hoe — bij elke verplaatsing en
   elke achter/midden/kop-keuze. Alleen bewaard, nog niet gebruikt; hieruit
   kan later de takenlijst leren hoe er echt gelegd wordt. Max 5000 regels. */
const HAVEN_LEGLOG_KEY = 'duwbakken-leglogboek';
function havenLegLog(soort, namen, extra){
  try {
    const sleutels = namen.map(normalizeBargeName);
    const plek = new Map(havenBakkenMetPlek().map(b => [b.sleutel, b]));
    const log = JSON.parse(localStorage.getItem(HAVEN_LEGLOG_KEY) || '[]');
    log.push({ at: Date.now(), soort, door: (getCurrentUser() || {}).naam || null, ...extra,
      bakken: namen.map((naam, i) => {
        const b = plek.get(sleutels[i]) || {};
        return { naam, positie: havenPositieUitLijst(naam), zone: b.zone || null,
                 plek: b.plek ? { rij: b.plek.rij, kol: b.plek.kol } : null,
                 cel: havenBakPlekOverrides[sleutels[i]] || null, set: b.setKey || null };
      }) });
    localStorage.setItem(HAVEN_LEGLOG_KEY, JSON.stringify(log.slice(-5000)));
  } catch(e){ meldOpslagProbleem(HAVEN_LEGLOG_KEY, e); }   // logboek is bijzaak: nooit een verplaatsing laten mislukken
}

/* Zonder ligging uit de haven (bijv. rechtstreeks uit Onderweg): in paren, zoals
   de volle plaats een tegel ook zonder vaste cellen leest — dwars = kolom,
   voor/achter = rij. */
function havenStandaardVolVorm(bakken){
  const dwars = [...new Set(bakken.map(b => ontleedPositie(b.positie)?.dwars).filter(v => v != null))].sort((a, b) => a - b);
  return new Map(bakken.map((b, i) => {
    const p = ontleedPositie(b.positie);
    const k = p && dwars.length * 2 >= bakken.length && dwars.length <= Math.ceil(bakken.length / 2) ? dwars.indexOf(p.dwars) : Math.floor(i / 2);
    return [b.sleutel, { r: p ? p.langs : i % 2, k }];
  }));
}

/* Gekozen bakken bij een set op de volle plaats voegen door op die tegel te
   tikken. De tegel blijft staan zoals hij nu getekend is (alle cellen worden
   vastgezet); de nieuwe bakken houden hun onderlinge ligging uit de haven en
   komen op de eerste plek waar die vorm vrij past — anders ernaast. */
async function havenVoegBakkenBijTegel(namen, tegelSleutel, zoneId, kaart){
  const alle = havenBakkenMetPlek();
  const tegelBakken = alle.filter(b => havenPlaatsGroepKey(b) === tegelSleutel && b.zone === zoneId && b.plek);
  if(!tegelBakken.length || !namen.length) return false;
  const sleutels = namen.map(normalizeBargeName);
  const nieuw = alle.filter(b => sleutels.includes(b.sleutel));

  const bezet = new Set();
  kaart.querySelectorAll('.haven-wachtrij-bak[data-baksleutel]').forEach(el => {
    const c = { r: Number(el.dataset.r), k: Number(el.dataset.k) };
    havenBakPlekOverrides[el.dataset.baksleutel] = c;
    bezet.add(c.r + ',' + c.k);
  });
  sleutels.forEach(sl => delete havenBakPlekOverrides[sl]);

  const vorm = havenIndelingVanBakken(nieuw);
  if(vorm.size){
    const cellen = [...vorm.values()];
    const bezetCellen = [...bezet].map(x => x.split(',').map(Number));
    const breed = Math.max(0, ...bezetCellen.map(([, k]) => k + 1));
    const vh = Math.max(...cellen.map(c => c.r)) + 1;
    const hoog = Math.max(2, vh, ...bezetCellen.map(([r]) => r + 1));
    let dr = 0, dk = breed;   // ernaast past altijd
    const keuze = havenVolKolomKeuze;
    havenVolKolomKeuze = null;
    const vormBreed = Math.max(...cellen.map(c => c.k)) + 1;
    // Gekozen achter/midden/kop: daar neerleggen, de rest van de tegel blijft staan.
    if(keuze){ dk = havenVolStartKolom(keuze, vormBreed); }
    else zoek: for(let k0 = 0; k0 < breed; k0++){
      for(let r0 = 0; r0 + vh <= hoog; r0++){
        if(cellen.every(c => !bezet.has((c.r + r0) + ',' + (c.k + k0)))){ dr = r0; dk = k0; break zoek; }
      }
    }
    vorm.forEach((c, sl) => { havenBakPlekOverrides[sl] = { r: c.r + dr, k: c.k + dk }; });
  }
  await saveHavenBakPlekOverrides();

  nieuw.forEach(b => { havenTegelOverrides[b.sleutel] = tegelSleutel; });
  await saveHavenTegelOverrides();

  const start = Math.min(...tegelBakken.map(b => b.slot).filter(Number.isInteger));
  return havenVerplaatsBakken([...tegelBakken.map(b => b.naam), ...nieuw.map(b => b.naam)],
    zoneId, Number.isFinite(start) ? start : undefined, true,
    `Haven: ${nieuw.map(b => b.naam).join(', ')} bij tegel ${tegelSleutel} gezet`);
}

/* Wat staat er klaar om neergelegd te worden?

   Een deel van een tegel gaat vóór de hele tegel: heb je binnen een vergrote
   tegel een paar bakjes aangetikt, dan bedoel je díe, en de rest blijft
   liggen. Daarna is er nog van alles over om een tweede plek voor te zoeken,
   dus de tegel blijft vergroot staan met nieuwe schaduwen. */
function havenKlaargezetteBakken(){
  if(havenGekozenBakken.size){
    const namen = havenBakken().filter(b => havenGekozenBakken.has(b.sleutel)).map(b => b.naam);
    if(namen.length) return { namen, bron: 'bakjes' };
  }
  if(havenSelectie.size){
    const namen = havenBakken().filter(b => havenSelectie.has(b.sleutel)).map(b => b.naam);
    if(namen.length) return { namen, bron: 'selectie' };
  }
  if(havenGezoomdeTegel && havenGezoomdeTegelNamen.length){
    return { namen: havenGezoomdeTegelNamen.slice(), bron: 'tegel' };
  }
  return { namen: [], bron: null };
}

async function havenPlaatsGezoomdeTegelDirect(zoneId, startSlot){
  const { namen, bron } = havenKlaargezetteBakken();
  if(!namen.length) return false;

  /* Een vergrote tegel uit Onderweg ligt nog niet in de haven: die moet
     binnengehaald worden (havenLaatSetBinnen zet ook de bijbehorende ritten
     op aanwezig), niet verplaatst. */
  const wachtset = havenGezoomdeTegel ? havenGezoomdeTegel.dataset.wachtset : null;
  if(wachtset && bron === 'tegel'){
    const ok = await havenLaatSetBinnen(wachtset, zoneId, startSlot);
    havenVerbergTegelZoom();
    if(ok) render();
    else showToast(`Daar is geen ruimte op ${havenZoneNaam(zoneId)} — de set blijft in Onderweg staan.`);
    return ok;
  }

  // Welke tegel stond er vergroot, en wat lag daar nog meer op? Dat bepaalt
  // of we na afloop doorgaan met de rest of de vergroting sluiten.
  const tegelSleutel = havenGezoomdeTegel ? havenGezoomdeTegel.dataset.plaatsset : null;
  const tegelZone = tegelSleutel
    ? (havenBakkenMetPlek().find(b => b.tegelSleutel === tegelSleutel && b.plek) || {}).zone
    : null;

  const gelukt = await havenVerplaatsBakken(namen, zoneId, startSlot, true,
    `Haven: ${namen.length} bak${namen.length === 1 ? '' : 'ken'} naar ${havenZoneNaam(zoneId)} (${namen.join(', ')})`);

  if(!gelukt){
    showToast(`Daar is geen ruimte op ${havenZoneNaam(zoneId)} — er blijft alles liggen waar het lag.`);
    return false;
  }

  havenGekozenBakken.clear();
  havenSelectie.clear();
  havenVerbergTegelZoom();
  render();

  /* Ging het om een deel van een vergrote tegel, dan blijft de rest liggen —
     en die wil je meteen ergens anders neer kunnen leggen. De tegel is na het
     hertekenen een ander element, dus opnieuw opzoeken, opnieuw vergroten en
     opnieuw doorrekenen waar wat er nog ligt zou passen. */
  if(bron !== 'tegel' && tegelSleutel && tegelZone){
    const rest = havenBakkenMetPlek()
      .filter(b => b.tegelSleutel === tegelSleutel && b.zone === tegelZone && b.plek);
    const nieuw = document.querySelector(
      `#havenLegeKolom .plaats-set[data-plaatsset="${CSS.escape(tegelSleutel)}"]`);
    if(rest.length && nieuw){
      havenGezoomdeTegelNamen = rest.map(b => b.naam);
      havenToonTegelZoom(nieuw, false);
      havenToonAlleGloei(havenGezoomdeTegelNamen);
    }
  }
  return true;
}

// Ligt de aanwijzer boven de Onderweg-kolom? De svg heeft de aanraking
// vastgehouden, dus e.target helpt hier niet — de schermpositie wel.
function havenBovenWachtrij(e){
  const kolom = document.getElementById('havenWachtrij');
  if(!kolom) return false;
  const r = kolom.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right &&
         e.clientY >= r.top  && e.clientY <= r.bottom;
}

function havenKoppelSlepen(svg){
  let actief = null;
  let lus = null;      // { x, y, bewogen } — tik op leeg water (wist de selectie)
  let pan = null;       // { startClientX, startScrollLeft, canvas, bewogen } — pannen op een zone-tabje
  // Onder deze afstand telt het als een tik — zie havenTikDrempel(): met een
  // vinger mag er meer beweging in zitten dan met een muis.

  const naarSvgPunt = (e) => {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };

  // Het midden van de gesleepte set als aanwijspunt, voor de HTML-doelen
  // (Onderweg, de bakkenplaatsen, de tabjes): de set schuift star mee met de
  // vinger, dus het midden ligt steeds op dezelfde afstand ervan.
  const setPunt = (h, e) => ({ clientX: e.clientX + h.setOff.x, clientY: e.clientY + h.setOff.y,
                               pointerType: e.pointerType });

  /* Waar komt de set in de tekening te liggen? De kade onder het midden van
     de set, en daarop de plek die het dichtst bij zijn noordwesthoek ligt:
     stappen van een halve bak, ook in de diepte. Precies daar of nergens
     (strikt: cel) — geen zoektocht naar een plek verderop. `plan` is null als
     hij daar niet past; sdx/sdy is de verschuiving van de bakken naar die plek
     (voor de rode schaduw). */
  const setDoel = (h, p) => {
    const dx = p.x - h.startX, dy = p.y - h.startY;
    const zone = havenZoneOnderSvg(h.midden.x + dx, h.midden.y + dy);
    if(!zone) return null;
    const ax = h.anker.x + dx, ay = h.anker.y + dy;
    let slot = null, afstand = Infinity;
    havenZoneSlots(zone).forEach(s => {
      const d = Math.hypot(hx(s.x) - ax, hy(s.y) - ay);
      if(d < afstand){ afstand = d; slot = s; }
    });
    if(!slot) return null;
    const strikt = { cel: { r: slot.rij, k: slot.kol } };
    return { zone, slot, strikt, plan: havenZoekPlaats(h.bakNamen, zone.id, slot.index, false, strikt),
             sdx: hx(slot.x) - h.anker.x, sdy: hy(slot.y) - h.anker.y };
  };

  svg.addEventListener('pointerdown', (e) => {
    const p = naarSvgPunt(e);

    /* Het vertrekboot-tabje: vasthouden en slepen neemt precies zijn groep
       bakken mee, net als een tegel (v1.331). Een tik erop kiest die groep
       (kiesDezeBoot, in beeindig hieronder) — niet ook nog eens de set
       eronder, want dan ging de keuze aan en meteen weer uit (v1.330). */
    const tabEl = e.target.closest('.haven-boottab');
    const g = tabEl ? null : e.target.closest('.haven-bak');
    let sleutel, namen;

    if(tabEl){
      namen = tabEl.dataset.tabbakken.split('|');
      sleutel = namen[0];
    } else if(g){
      sleutel = g.dataset.bak;
      // sleep de hele selectie mee als deze bak erin zit, anders alleen deze
      namen = havenSelectie.has(sleutel) ? [...havenSelectie] : [sleutel];
    } else {
      // Tussen de bakken van een set gedrukt? Dan pak je de hele set op.
      // Tik naast de bakken terwijl er sets gekozen zijn: dat is de
      // bestemming, niet het wissen van een selectie.
      //
      // Ook als er alleen in de tekening zelf iets gekozen is (havenSelectie,
      // via een tik) telt een tik op een zone als bestemming —
      // niet alleen bij havenGekozenSets/havenGekozenBakken. Dat is de enige
      // manier om op een telefoon een bak van het ene naar het andere
      // zone-tabje te krijgen: slepen kan daar niet, dat zijn twee losse
      // svg's. Bewust ALLEEN hier, niet in havenWachtOpBestemming() zelf of
      // in beeindig()'s "tik op een andere bak" hieronder — anders zou een
      // tweede tik op een bak niet meer aan de selectie toevoegen zodra er
      // al één bak gekozen was, en dat is nu juist hoe je met de vinger een
      // meervoudige selectie opbouwt.
      /* Staat er een tegel vergroot, dan is elke tik in de haven een
         bestemming — niet alleen precies op een oplichtende schaduw. Tikte je
         er net naast, dan gebeurde er niets en leek de tegel terug te vallen
         naar de lege plaats. */
      if(havenGezoomdeTegel){
        const zone = havenZoneOnderSvg(p.x, p.y);
        if(zone){
          havenPlaatsGezoomdeTegel(zone.id, havenSlotOpLaadlengte(zone, havenSlotOnderSvg(zone, p.x, p.y)));
          return;
        }
      }
      if(havenWachtOpBestemming() || havenSelectie.size){
        const zone = havenZoneOnderSvg(p.x, p.y);
        if(zone){
          havenZetGekozenSets(zone.id, havenSlotOpLaadlengte(zone, havenSlotOnderSvg(zone, p.x, p.y)));
          return;
        }
      }
      const set = havenSetOnderSvgPunt(p.x, p.y);
      if(!set){
        /* Op een zone-tabje (telefoon) is de kade met opzet breder dan het
           scherm (renderHavenTab, svgPixelStijl) — anders is een rij niet
           bruikbaar breed — en moet dus zijwaarts te bewegen zijn om de rest
           te zien. Dat gebeurt hier, niet via CSS overflow-x + touch-action:
           dat laatste kan "pannen op leeg water" niet onderscheiden van het
           (ook op leeg water beginnende) oppakken van een hele set tussen de
           bakken door — allebei beginnen met precies hetzelfde gebaar. Met
           een handmatige scrollLeft blijft die keus in JS, waar de rest van
           de sleeplogica toch al zit. */
        if(havenIsTelefoon() && HAVEN_ZONE_TAB_IDS.includes(havenMobielTab)){
          const canvas = svg.closest('.haven-canvas');
          pan = { startClientX: e.clientX, startScrollLeft: canvas ? canvas.scrollLeft : 0, canvas, bewogen: false };
          try { svg.setPointerCapture(e.pointerId); } catch(_){}
          return;
        }
        /* Echt naast alles: een tik wist de selectie (zie beeindig hieronder).
           Een sleep vanaf hier doet niets — de lasso is er in v1.329 uit. */
        lus = { x: p.x, y: p.y, bewogen: false };
        try { svg.setPointerCapture(e.pointerId); } catch(_){}
        return;
      }
      namen = set;
      sleutel = set[0];
    }

    const groepen = namen
      .map(k => svg.querySelector(`.haven-bak[data-bak="${CSS.escape(k)}"]`))
      .filter(Boolean)
      .map(node => {
        const m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(node.getAttribute('transform')) || [0,0,0];
        return { node, x: parseFloat(m[1]), y: parseFloat(m[2]) };
      });

    if(!groepen.length) return;               // niets om te slepen
    /* De baknamen die bij deze sleutels horen liggen voor de duur van deze
       sleep vast, dus één keer uitrekenen bij het oppakken. Ze stonden in de
       pointermove-handler, waar havenBakken() bij élke vingerbeweging de hele
       bakkenlijst opnieuw opbouwde — inclusief de drievoudige lus over
       VH/HGK × ritten × rijen — voor een uitkomst die niet verandert.
       Gemeten met 25 bakken in de haven: 1 ms per vingerbeweging, zo'n 30 ms
       per sleep.

       Dit haalt één van de drie aanroepen per vingerbeweging weg (3,6 -> 2,6
       ms). De andere twee zitten in havenZoekPlaats, dat havenBakkenMetPlek()
       zowel zelf aanroept als via havenRelatieveIndeling. Die zijn hier niet
       weg te nemen: havenZoekPlaats draait ook op het mutatiepad, waar een
       oude lijst juist wel verkeerd zou uitpakken. Daarvoor moet havenBakken()
       zelf goedkoper worden.

       Dat de lijst niet kan verschuiven tijdens een sleep is geen aanname:
       alles wat de bakken wijzigt loopt via render(), en render() bouwt de
       haven-svg helemaal opnieuw op. De bakken waar je aan trekt hangen dan
       niet meer in het document en de sleep is sowieso afgelopen. */
    const bakNamen = havenBakken()
      .filter(b => namen.includes(b.sleutel))
      .map(b => b.naam);
    /* De set bepaalt waar hij landt, niet de vinger (1.353). Pakte je hem bij
       het boottabje — dat hangt onder of boven de set, in een andere rij — dan
       nam de oude code de rij van de vinger. Daar raakte de set niets (een set
       ligt tegen de wal of tegen een andere bak), dus ging havenZoekPlaats
       zoeken, en vond een plek onder de buurset een lengte verder: de schaduw
       stond op de 3e terwijl de bakken boven de 2e hingen. Nu onthouden we de
       noordwesthoek (anker: die rondt af op de dichtstbijzijnde plek) en het
       midden van de set (welke kade of kolom het doel is), en wordt er niet
       meer gezocht: past het daar niet, dan is de schaduw rood. */
