  if(!doelCel || !kaart.contains(doelCel) || doelCel === losBakje) return false;
  const src = Number(losBakje.dataset.cel);
  const dst = Number(doelCel.dataset.cel);
  if(!Number.isInteger(src) || !Number.isInteger(dst) || src === dst) return false;
  const srcSleutel = losBakje.dataset.baksleutel;
  if(!srcSleutel) return false;
  const dstSleutel = doelCel.dataset.baksleutel;   // leeg of ghost: undefined
  havenBakPlekOverrides[srcSleutel] = dst;
  // Bak↔bak: de ander neemt de vrijgekomen plek. Bak↔ghost/leeg: alleen de
  // gesleepte bak krijgt een plek; de ghost schuift vanzelf naar de lege cel.
  if(dstSleutel && dstSleutel !== srcSleutel) havenBakPlekOverrides[dstSleutel] = src;
  await saveHavenBakPlekOverrides();
  havenHertekenPlaatsContainer(paneel, zoneId);
  render();
  return true;
}

async function havenVoegBakBijTegel(naam, tegelSleutel, zoneId){
  if(!naam || !tegelSleutel) return;
  const tegelBakken = havenBakkenMetPlek()
    .filter(b => b.tegelSleutel === tegelSleutel && b.zone === zoneId && b.plek);
  if(!tegelBakken.length) return;
  // Hoort hij er al bij, dan is er niets te doen — en zou de override alleen
  // maar vastleggen wat de lijst zelf al zegt.
  if(tegelBakken.some(b => normalizeBargeName(b.naam) === normalizeBargeName(naam))) return;
  // Vóór het hertekenen onthouden: render() hieronder wist de zoom.
  const stondVergroot = !!havenGezoomdeTegel;

  havenTegelOverrides[normalizeBargeName(naam)] = tegelSleutel;
  await saveHavenTegelOverrides();

  // Naast de tegel neerleggen: dezelfde zone, aansluitend op wat er al ligt.
  const namen = [...tegelBakken.map(b => b.naam), naam];
  const start = Math.min(...tegelBakken.map(b => b.slot).filter(Number.isInteger));
  await havenVerplaatsBakken(namen, zoneId, start, true,
    `Haven: ${naam} bij tegel ${tegelSleutel} gezet`);
  render();
  /* De tegel is na het hertekenen een ander element; opnieuw opzoeken en weer
     vergroten, zodat je gewoon door kunt gaan waar je was. Welk paneel dat is
     hangt af van de plaats: de lege heeft zijn eigen vaste kolom, de volle het
     in/uitschuivende paneel. Stond hij niet vergroot (bijvoorbeeld omdat je
     het bakje ernaartoe sleepte in plaats van aantikte), dan blijft het
     daarbij — dan heb je het al gezien. */
  const host = zoneId === 'leeg'
    ? document.getElementById('havenLegeKolom')
    : havenVolContainer();
  const nieuw = stondVergroot && host &&
    host.querySelector(`.plaats-set[data-plaatsset="${CSS.escape(tegelSleutel)}"]`);
  if(nieuw){
    const bakNamen = havenBakkenMetPlek()
      .filter(b => b.tegelSleutel === tegelSleutel && b.zone === zoneId && b.plek)
      .map(b => b.naam);
    havenGezoomdeTegelNamen = bakNamen;
    havenToonTegelZoom(nieuw, false);
    havenToonAlleGloei(bakNamen);
  }
}

/* Wat staat er klaar om neergelegd te worden?

   Een deel van een tegel gaat vóór de hele tegel: heb je binnen een vergrote
   tegel een paar bakjes aangetikt, dan bedoel je díe, en de rest blijft
   liggen. Daarna is er nog van alles over om een tweede plek voor te zoeken,
   dus de tegel blijft vergroot staan met nieuwe schaduwen. */
function havenKlaargezetteBakken(){
  if(havenGekozenBakken.size){
    const namen = havenBakken().filter(b => havenGekozenBakken.has(b.sleutel)).map(b => b.naam);
    if(namen.length) return { namen, bron: 'bakjes' };
  }
  if(havenSelectie.size){
    const namen = havenBakken().filter(b => havenSelectie.has(b.sleutel)).map(b => b.naam);
    if(namen.length) return { namen, bron: 'selectie' };
  }
  if(havenGezoomdeTegel && havenGezoomdeTegelNamen.length){
    return { namen: havenGezoomdeTegelNamen.slice(), bron: 'tegel' };
  }
  return { namen: [], bron: null };
}

async function havenPlaatsGezoomdeTegel(zoneId, startSlot){
  const { namen, bron } = havenKlaargezetteBakken();
  if(!namen.length) return false;

  /* Een vergrote tegel uit Onderweg ligt nog niet in de haven: die moet
     binnengehaald worden (havenLaatSetBinnen zet ook de bijbehorende ritten
     op aanwezig), niet verplaatst. */
  const wachtset = havenGezoomdeTegel ? havenGezoomdeTegel.dataset.wachtset : null;
  if(wachtset && bron === 'tegel'){
    const ok = await havenLaatSetBinnen(wachtset, zoneId, startSlot);
    havenVerbergTegelZoom();
    if(ok) render();
    else showToast(`Daar is geen ruimte op ${havenZoneNaam(zoneId)} — de set blijft in Onderweg staan.`);
    return ok;
  }

  // Welke tegel stond er vergroot, en wat lag daar nog meer op? Dat bepaalt
  // of we na afloop doorgaan met de rest of de vergroting sluiten.
  const tegelSleutel = havenGezoomdeTegel ? havenGezoomdeTegel.dataset.plaatsset : null;
  const tegelZone = tegelSleutel
    ? (havenBakkenMetPlek().find(b => b.tegelSleutel === tegelSleutel && b.plek) || {}).zone
    : null;

  const gelukt = await havenVerplaatsBakken(namen, zoneId, startSlot, true,
    `Haven: ${namen.length} bak${namen.length === 1 ? '' : 'ken'} naar ${havenZoneNaam(zoneId)} (${namen.join(', ')})`);

  if(!gelukt){
    showToast(`Daar is geen ruimte op ${havenZoneNaam(zoneId)} — er blijft alles liggen waar het lag.`);
    return false;
  }

  havenGekozenBakken.clear();
  havenSelectie.clear();
  havenVerbergTegelZoom();
  render();

  /* Ging het om een deel van een vergrote tegel, dan blijft de rest liggen —
     en die wil je meteen ergens anders neer kunnen leggen. De tegel is na het
     hertekenen een ander element, dus opnieuw opzoeken, opnieuw vergroten en
     opnieuw doorrekenen waar wat er nog ligt zou passen. */
  if(bron !== 'tegel' && tegelSleutel && tegelZone){
    const rest = havenBakkenMetPlek()
      .filter(b => b.tegelSleutel === tegelSleutel && b.zone === tegelZone && b.plek);
    const nieuw = document.querySelector(
      `#havenLegeKolom .plaats-set[data-plaatsset="${CSS.escape(tegelSleutel)}"]`);
    if(rest.length && nieuw){
      havenGezoomdeTegelNamen = rest.map(b => b.naam);
      havenToonTegelZoom(nieuw, false);
      havenToonAlleGloei(havenGezoomdeTegelNamen);
    }
  }
  return true;
}

// Ligt de aanwijzer boven de Onderweg-kolom? De svg heeft de aanraking
// vastgehouden, dus e.target helpt hier niet — de schermpositie wel.
function havenBovenWachtrij(e){
  const kolom = document.getElementById('havenWachtrij');
  if(!kolom) return false;
  const r = kolom.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right &&
         e.clientY >= r.top  && e.clientY <= r.bottom;
}

// Standaard "punt-in-veelhoek"-test (ray casting): telt hoe vaak een
// horizontale lijn vanuit (x,y) naar rechts de rand van de veelhoek kruist.
// Oneven aantal kruisingen = binnen. Geen library nodig, en de lus hoeft
// niet netjes convex of zelfs maar helemaal gesloten getekend te zijn —
// het eindpunt telt automatisch mee als terug naar het beginpunt.
function havenPuntInVeelhoek(x, y, punten){
  let binnen = false;
  for(let i = 0, j = punten.length - 1; i < punten.length; j = i++){
    const xi = punten[i].x, yi = punten[i].y;
    const xj = punten[j].x, yj = punten[j].y;
    const snijdt = ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if(snijdt) binnen = !binnen;
  }
  return binnen;
}

/* Alle bakken selecteren waarvan het midden binnen de getekende lus valt.
   Vervangt de huidige selectie, net zoals een tik op leeg water die nu ook
   leegmaakt — een nieuwe lus is een nieuwe keuze, geen toevoeging.

   Bakposities komen uit havenBakkenMetPlek() in dezelfde metereenheden als
   de rest van de tekening; hx()/hy() zet ze om naar precies de ruimte
   waarin de lus zelf ook getekend is (naarSvgPunt geeft SVG-viewBox-
   coördinaten, en dat is exact hx()/hy()'s eenheid). */
function havenSelecteerViaLus(svg, punten){
  if(punten.length < 3) return;
  const geraakt = havenBakkenMetPlek()
    .filter(b => b.plek && havenPuntInVeelhoek(
      hx(b.plek.x + b.plek.w / 2), hy(b.plek.y + b.plek.h / 2), punten))
    .map(b => b.sleutel);

  havenSelectie = new Set(geraakt);
  svg.querySelectorAll('.haven-bak').forEach(n => {
    const aan = havenSelectie.has(n.dataset.bak);
    n.classList.toggle('gekozen', aan);
    n.setAttribute('aria-pressed', String(aan));
  });
  havenToonSelectie();
}

function havenKoppelSlepen(svg){
  let actief = null;
  let lus = null;      // { punten:[{x,y}], pathEl } — lasso vanaf leeg water
  let pan = null;       // { startClientX, startScrollLeft, canvas, bewogen } — pannen op een zone-tabje
  // Onder deze afstand telt het als een tik — zie havenTikDrempel(): met een
  // vinger mag er meer beweging in zitten dan met een muis.

  const naarSvgPunt = (e) => {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };

  svg.addEventListener('pointerdown', (e) => {
    const p = naarSvgPunt(e);

    const g = e.target.closest('.haven-bak');
    let sleutel, namen;

    if(g){
      sleutel = g.dataset.bak;
      // sleep de hele selectie mee als deze bak erin zit, anders alleen deze
      namen = havenSelectie.has(sleutel) ? [...havenSelectie] : [sleutel];
    } else {
      // Tussen de bakken van een set gedrukt? Dan pak je de hele set op.
      // Tik naast de bakken terwijl er sets gekozen zijn: dat is de
      // bestemming, niet het wissen van een selectie.
      //
      // Ook als er alleen in de tekening zelf iets gekozen is (havenSelectie,
      // via een tik of de lasso) telt een tik op een zone als bestemming —
      // niet alleen bij havenGekozenSets/havenGekozenBakken. Dat is de enige
      // manier om op een telefoon een bak van het ene naar het andere
      // zone-tabje te krijgen: slepen kan daar niet, dat zijn twee losse
      // svg's. Bewust ALLEEN hier, niet in havenWachtOpBestemming() zelf of
      // in beeindig()'s "tik op een andere bak" hieronder — anders zou een
      // tweede tik op een bak niet meer aan de selectie toevoegen zodra er
      // al één bak gekozen was, en dat is nu juist hoe je met de vinger een
      // meervoudige selectie opbouwt.
      /* Staat er een tegel vergroot, dan is elke tik in de haven een
         bestemming — niet alleen precies op een oplichtende schaduw. Tikte je
         er net naast, dan gebeurde er niets en leek de tegel terug te vallen
         naar de lege plaats. */
      if(havenGezoomdeTegel){
        const zone = havenZoneOnderSvg(p.x, p.y);
        if(zone){
          havenPlaatsGezoomdeTegel(zone.id, havenSlotOpLaadlengte(zone, havenSlotOnderSvg(zone, p.x, p.y)));
          return;
        }
      }
      if(havenWachtOpBestemming() || havenSelectie.size){
        const zone = havenZoneOnderSvg(p.x, p.y);
        if(zone){
          havenZetGekozenSets(zone.id, havenSlotOpLaadlengte(zone, havenSlotOnderSvg(zone, p.x, p.y)));
          return;
        }
      }
      const set = havenSetOnderSvgPunt(p.x, p.y);
      if(!set){
        /* Op een zone-tabje (telefoon) is de kade met opzet breder dan het
           scherm (renderHavenTab, svgPixelStijl) — anders is een rij niet
           bruikbaar breed — en moet dus zijwaarts te bewegen zijn om de rest
           te zien. Dat gebeurt hier, niet via CSS overflow-x + touch-action:
           dat laatste kan "pannen op leeg water" niet onderscheiden van het
           (ook op leeg water beginnende) oppakken van een hele set tussen de
           bakken door — allebei beginnen met precies hetzelfde gebaar. Met
           een handmatige scrollLeft blijft die keus in JS, waar de rest van
           de sleeplogica toch al zit. Op een zone-tabje wint pannen dus van
           de lasso; die blijft wel gewoon werken op een groot scherm (muis),
           waar dit knelpunt niet bestaat. */
        if(havenIsTelefoon() && HAVEN_ZONE_TAB_IDS.includes(havenMobielTab)){
          const canvas = svg.closest('.haven-canvas');
          pan = { startClientX: e.clientX, startScrollLeft: canvas ? canvas.scrollLeft : 0, canvas, bewogen: false };
          try { svg.setPointerCapture(e.pointerId); } catch(_){}
          return;
        }
        /* Echt naast alles: hier begon voorheen meteen het wissen van de
           selectie. Dat blijft de uitkomst van een gewone tik (zie beeindig
           hieronder, de tak zonder bewogen lus), maar een sleep vanaf hier
           is nu vrije ruimte voor de lasso — er lag toch nooit een ander
           sleepgedrag op deze plek. Nog niets tekenen of selecteren: dat
           gebeurt pas in pointermove zodra de DREMPEL gehaald wordt, zodat
           een gewone tik nog steeds gewoon een tik is. */
        lus = { punten: [{ x: p.x, y: p.y }], pathEl: null, bewogen: false };
        try { svg.setPointerCapture(e.pointerId); } catch(_){}
        return;
      }
      namen = set;
      sleutel = set[0];
    }

    const groepen = namen
      .map(k => svg.querySelector(`.haven-bak[data-bak="${CSS.escape(k)}"]`))
      .filter(Boolean)
      .map(node => {
        const m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(node.getAttribute('transform')) || [0,0,0];
        return { node, x: parseFloat(m[1]), y: parseFloat(m[2]) };
      });

    if(!groepen.length) return;               // niets om te slepen
    const bron = havenZoneOnderSvg(p.x, p.y);
    /* De baknamen die bij deze sleutels horen liggen voor de duur van deze
       sleep vast, dus één keer uitrekenen bij het oppakken. Ze stonden in de
       pointermove-handler, waar havenBakken() bij élke vingerbeweging de hele
       bakkenlijst opnieuw opbouwde — inclusief de drievoudige lus over
       VH/HGK × ritten × rijen — voor een uitkomst die niet verandert.
       Gemeten met 25 bakken in de haven: 1 ms per vingerbeweging, zo'n 30 ms
       per sleep.

       Dit haalt één van de drie aanroepen per vingerbeweging weg (3,6 -> 2,6
       ms). De andere twee zitten in havenZoekPlaats, dat havenBakkenMetPlek()
       zowel zelf aanroept als via havenRelatieveIndeling. Die zijn hier niet
       weg te nemen: havenZoekPlaats draait ook op het mutatiepad, waar een
       oude lijst juist wel verkeerd zou uitpakken. Daarvoor moet havenBakken()
       zelf goedkoper worden.

       Dat de lijst niet kan verschuiven tijdens een sleep is geen aanname:
       alles wat de bakken wijzigt loopt via render(), en render() bouwt de
       haven-svg helemaal opnieuw op. De bakken waar je aan trekt hangen dan
       niet meer in het document en de sleep is sowieso afgelopen. */
    const bakNamen = havenBakken()
      .filter(b => namen.includes(b.sleutel))
      .map(b => b.naam);
    actief = { sleutel, namen, bakNamen, groepen, startX:p.x, startY:p.y, bewogen:false,
               hoofd: g || groepen[0].node, viaSet: !g,
               greepKol: havenGreepKolom(namen, bron, p.x, p.y) };
    groepen.forEach(v => { v.node.classList.add('sleept'); svg.appendChild(v.node); });
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    e.preventDefault();
  });

  svg.addEventListener('pointermove', (e) => {
    if(pan){
      const dx = e.clientX - pan.startClientX;
      if(!pan.bewogen){
        if(Math.abs(dx) < havenTikDrempel(e)) return;
        pan.bewogen = true;
      }
      if(pan.canvas) pan.canvas.scrollLeft = pan.startScrollLeft - dx;
      e.preventDefault();
      return;
    }
    if(lus){
      const p = naarSvgPunt(e);
      const laatste = lus.punten[lus.punten.length - 1];
      const afstand = Math.hypot(p.x - laatste.x, p.y - laatste.y);
      if(!lus.bewogen){
        if(Math.hypot(p.x - lus.punten[0].x, p.y - lus.punten[0].y) < havenTikDrempel(e)) return;
        lus.bewogen = true;
      }
      // Niet elk vingerpunt bewaren — dat maakt het pad nodeloos lang bij een
      // langzame beweging. 3 SVG-eenheden (~3 m) is fijn genoeg voor een lus.
      if(afstand < 3) return;
      lus.punten.push({ x: p.x, y: p.y });
      if(!lus.pathEl){
        lus.pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        lus.pathEl.setAttribute('class', 'haven-lus-pad');
        svg.appendChild(lus.pathEl);
      }
      lus.pathEl.setAttribute('d', lus.punten
        .map((pt, i) => `${i === 0 ? 'M' : 'L'}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(' '));
      e.preventDefault();
      return;
    }
    if(!actief) return;
    const p = naarSvgPunt(e);
    const dx = p.x - actief.startX, dy = p.y - actief.startY;
    if(!actief.bewogen && Math.hypot(dx, dy) < havenTikDrempel(e)) return;
    actief.bewogen = true;

    actief.groepen.forEach(v =>
      v.node.setAttribute('transform', `translate(${v.x + dx},${v.y + dy})`));

    svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
    const kolom = document.getElementById('havenWachtrij');
    const bovenWachtrij = havenBovenWachtrij(e);
    if(kolom) kolom.classList.toggle('doelwit', bovenWachtrij);

    // Boven een tabje: dat paneel openklappen en als doel markeren.
    const tab = havenTabOnderAanwijzer(e);
    document.querySelectorAll('.haven-plaatstab').forEach(k =>
      k.classList.toggle('doelwit', k.dataset.plaats === tab));
    if(tab && havenOpenPlaats !== tab) havenZetPlaatsPaneel(tab);
    // Elk mogelijk doel krijgt zijn eigen doelwit-markering — zie dezelfde
    // toelichting in havenKoppelWachtrijSlepen hierboven.
    const paneel = document.getElementById('havenPlaatsPaneel');
    if(paneel) paneel.classList.toggle('doelwit', !paneel.hidden && havenBinnenElement(paneel, e));
    const plaatsKolom = document.getElementById('havenLegeKolom');
    if(plaatsKolom) plaatsKolom.classList.toggle('doelwit', !plaatsKolom.hidden && havenBinnenElement(plaatsKolom, e));

    havenWisGhost(svg);
    if(!bovenWachtrij && !tab && !havenBovenPaneel(e)){
      const doel = havenZoneOnderSvg(p.x, p.y);
      if(doel){
        // bakNamen staat vast sinds het oppakken; zie de uitleg bij pointerdown
        havenToonGhost(svg, actief.bakNamen, doel.id,
                       havenSlotMetGreep(doel, p.x, p.y, actief.greepKol));
      }
    }
    e.preventDefault();
  });

  const beeindig = async (e) => {
    if(pan){
      const p2 = pan;
      pan = null;
      // scrollLeft staat al goed — dat gebeurde al live in pointermove. Was
      // er geen beweging (dus de DREMPEL nooit gehaald), dan was dit gewoon
      // een tik naast alles: zelfde gedrag als bij de lasso hieronder.
      if(!p2.bewogen && havenSelectie.size){
        havenSelectie.clear();
        svg.querySelectorAll('.haven-bak.gekozen').forEach(n => n.classList.remove('gekozen'));
        havenToonSelectie();
      }
      return;
    }
    if(lus){
      const l = lus;
      lus = null;
      if(l.pathEl) l.pathEl.remove();
      if(l.bewogen){
        // De lus sluiten (eindpunt terug naar start) en alle bakken
        // selecteren waarvan het midden erbinnen valt — vervangt de huidige
        // selectie, net als een tik op leeg water dat nu ook doet.
        havenSelecteerViaLus(svg, l.punten);
      } else if(havenSelectie.size){
        // Geen lus, gewoon een tik naast alles: het oude gedrag.
        havenSelectie.clear();
        svg.querySelectorAll('.haven-bak.gekozen').forEach(n => n.classList.remove('gekozen'));
        havenToonSelectie();
      }
      return;
    }
    if(!actief) return;
    const h = actief;
    actief = null;
    h.groepen.forEach(v => v.node.classList.remove('sleept'));
    havenWisGhost(svg);
    svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
    const kolomEl = document.getElementById('havenWachtrij');
    if(kolomEl) kolomEl.classList.remove('doelwit');

    if(!h.bewogen && havenWachtOpBestemming()){
      // Er staat iets gekozen in Onderweg: deze tik wijst de bestemming aan.
      const p = naarSvgPunt(e);
      const zone = havenZoneOnderSvg(p.x, p.y);
      if(zone){ await havenZetGekozenSets(zone.id, havenSlotOpLaadlengte(zone, havenSlotOnderSvg(zone, p.x, p.y))); return; }
    }

    if(!h.bewogen){                            // tik: selectie aan/uit
      /* Tik je midden op een set, dan gaat de hele set aan of uit — dezelfde
         plek waar je hem ook in zijn geheel oppakt. Tik je een bak zelf aan,
         dan gaat het om die ene. Eerder ging in beide gevallen alleen de
         eerste bak aan, waardoor een tik op een set van vier er één selecteerde
         en je de andere drie apart moest aantikken. */
      const raakt = h.viaSet ? h.namen : [h.sleutel];
      // de gesleepte kopie snapt terug naar zijn eigen plek; de rest van het
      // aan/uit-zetten zit in havenSchakelBakSelectie, gedeeld met het
      // toetsenbord (Enter/spatie op een bak, zie havenKoppelSlepen hieronder)
      h.groepen.forEach(v => v.node.setAttribute('transform',
        `translate(${v.x},${v.y})`));
      havenSchakelBakSelectie(svg, raakt);
      return;
    }

    document.querySelectorAll('.haven-plaatstab').forEach(k => k.classList.remove('doelwit'));
    const paneelEl = document.getElementById('havenPlaatsPaneel');
    if(paneelEl) paneelEl.classList.remove('doelwit');
    const legeKolomEl = document.getElementById('havenLegeKolom');
    if(legeKolomEl) legeKolomEl.classList.remove('doelwit');

    // Losgelaten op een tabje, in het geopende paneel, of op de lege kolom:
    // naar die plaats.
    const doelPlaats = havenTabOnderAanwijzer(e) || havenPlaatsZoneOnderAanwijzer(e);
    if(doelPlaats){
      // dezelfde lijst als waarmee de ghost getekend is, zodat neerleggen niet
      // iets anders kan doen dan wat je in beeld zag
      await havenVerplaatsBakken(h.bakNamen, doelPlaats, undefined, true);
      havenSelectie.clear();
      havenZetPlaatsPaneel(null);
      render();
      return;
    }

    // Losgelaten boven de Onderweg-kolom: de set gaat terug de wachtrij in.
    if(havenBovenWachtrij(e)){
      const aantal = await havenTerugNaarOnderweg(h.namen);
      if(aantal) havenSelectie.clear();
      render();
      return;
    }

    const p = naarSvgPunt(e);
    const zone = havenZoneOnderSvg(p.x, p.y);
    if(zone){
      const slot = havenSlotMetGreep(zone, p.x, p.y, h.greepKol);
      const namen = havenBakken()
        .filter(b => h.namen.includes(b.sleutel))
        .map(b => b.naam);
      await havenVerplaatsBakken(namen, zone.id, slot);
      havenSelectie.clear();
    }
    render();
  };

  svg.addEventListener('pointerup', beeindig);
  svg.addEventListener('pointercancel', beeindig);

  /* Toetsenbordbediening voor het slepen. Zonder muis of vinger kon er in de
     haventekening niets: geen bak te selecteren, geen bestemming te kiezen —
     het kernproces van dit scherm was op geen enkele manier met het
     toetsenbord te doen. Beide bakken en zones hebben tabindex/role gekregen
     bij het tekenen (hierboven); hier komt alleen de bediening bij.

     Op een bak: Enter/spatie zet 'm aan of uit — hetzelfde als de muis-tik
     zonder te bewegen, via dezelfde havenSchakelBakSelectie(). Op een zone:
     Enter/spatie zet alles wat gekozen is daar neer, via dezelfde
     havenZetGekozenSets() die de plaatstab-knoppen ook al gebruiken. Is er
     niets gekozen, dan doet die functie zelf niets — geen extra controle
     hier nodig.

     Geen los pad voor "een hele set in één keer oppakken zoals de muis dat
     kan door tussen de bakken te tikken": op de tekening is dat overbodig,
     want elke bak die bij een set hoort kan gewoon los aangetikt worden. */
  svg.addEventListener('keydown', async (e) => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const bak = e.target.closest('.haven-bak');
    if(bak){
      e.preventDefault();
      havenSchakelBakSelectie(svg, [bak.dataset.bak]);
      return;
    }
    const zone = e.target.closest('.haven-zone');
    if(zone){
      e.preventDefault();
      await havenZetGekozenSets(zone.dataset.zone);
    }
  });
}

// Zones en plekken staan in meters; het aanwijspunt komt in svg-eenheden
// binnen, dus rekenen we de diepte-as terug.
function havenZoneOnderSvg(sx, sy){
  const xm = sx, ym = sy / HAVEN_DIEPTEFACTOR;
  // Virtuele zones staan niet in de tekening, dus je kunt er ook niet op
  // loslaten. Die bereik je via hun paneel.
  return HAVEN_LAYOUT.zones.find(z => !z.virtueel &&
    xm >= z.x && xm <= z.x + z.w && ym >= z.y && ym <= z.y + z.h) || null;
}
/* Welke plek wijs je aan?

   Dit eiste eerst een treffer binnen een plek. Tussen twee laadlengtes ligt
   een halve baklengte vrije kade, en daar raak je niets — wees je op de
   westkant van de 4e lengte, dan kwam er geen ghost en leek het alsof je daar
   niet neer kon leggen. Pas verder naar het oosten sprong hij aan.

   Nu wordt de dichtstbijzijnde plek in dezelfde rij gepakt. Wijs je buiten de
   zone, dan is er nog steeds niets. */
function havenSlotOnderSvg(zone, sx, sy){
  const xm = sx, ym = sy / HAVEN_DIEPTEFACTOR;
  const slots = havenZoneSlots(zone);

  const raak = slots.find(s =>
    xm >= s.x && xm <= s.x + s.w && ym >= s.y && ym <= s.y + s.h);
  if(raak) return raak.index;

  const inRij = slots.filter(s => ym >= s.y && ym <= s.y + s.h);
  if(!inRij.length) return null;
  let beste = inRij[0], besteAfstand = Infinity;
  inRij.forEach(s => {
    const midden = s.x + s.w / 2;
    const afstand = Math.abs(xm - midden);
    if(afstand < besteAfstand){ besteAfstand = afstand; beste = s; }
  });
  return beste.index;
}
/* Waar je een set beetpakt bepaalt waar hij landt.

   Een set sprong vroeger met zijn westkant naar je vinger. Pak je een blok
   van vier in het midden beet, dan schoot hij dus twee baklengtes vooruit —
   en een set een halve bak opschuiven op een laadlengte was daardoor niet te
   doen. Nu onthouden we hoeveel halve baklengtes je aangrijppunt ten oosten
   van de westkant lag, en trekken we dat er bij het neerleggen weer af. De
   set blijft zo onder je vinger liggen en schuift precies mee met wat je
   beweegt, net als een tegel in een bakkenplaats-menu. */
function havenGreepKolom(sleutels, zone, sx, sy){
  if(!zone) return 0;
  const index = havenSlotOnderSvg(zone, sx, sy);
  const onder = havenZoneSlots(zone).find(s => s.index === index);
  if(!onder) return 0;
  const eigen = havenBakkenMetPlek()
    .filter(b => sleutels.includes(b.sleutel) && b.plek && b.zone === zone.id);
  if(!eigen.length) return 0;
  return Math.max(0, onder.kol - Math.min(...eigen.map(b => b.plek.kol)));
}

function havenSlotMetGreep(zone, sx, sy, greepKol){
  const index = havenSlotOnderSvg(zone, sx, sy);
  if(index == null || !greepKol) return index;
  const slots = havenZoneSlots(zone);
  const onder = slots.find(s => s.index === index);
  if(!onder) return index;
  const rij = slots.filter(s => s.rij === onder.rij);
  const westKol = Math.min(...rij.map(s => s.kol));
  const doel = rij.find(s => s.kol === Math.max(westKol, onder.kol - greepKol));
  return doel ? doel.index : index;
}

/* ═══ HAVEN [blok: einde] ═══════════════════════════════════════════ */
</script>

<script>
/* Auteur: HvdB */

/* Het wegschrijven heet saveTripsNaarOpslag(); saveTrips() is de publieke naam
   die overal wordt aangeroepen. Twee functies met dezelfde naam gaf eerder een
   hijsprobleem waarbij de planning nooit werd opgeslagen. */
async function saveTrips(){
  await saveTripsNaarOpslag();
}


/* Klok in de topbalk. Elke seconde kijken maar alleen schrijven als de tekst
   echt verandert — dat scheelt een DOM-wijziging per seconde die niets doet.
   De minuut is fijn genoeg voor een planning; seconden zouden alleen maar
   onrust geven in een scherm waar je de hele dag naar kijkt. */
const KLOK_DAGEN = ['zo','ma','di','wo','do','vr','za'];
const KLOK_MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
let klokVorige = null;

function klokTekst(d){
  const tijd = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const datum = KLOK_DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + KLOK_MAANDEN[d.getMonth()];
  return { tijd, datum };
}

function tikKlok(){
  const el = document.getElementById('klok');
  if(!el) return;
  const { tijd, datum } = klokTekst(new Date());
  const nieuw = tijd + '|' + datum;
  if(nieuw === klokVorige) return;
  klokVorige = nieuw;
  el.innerHTML = `${esc(tijd)} <span class="klok-datum">${esc(datum)}</span> <span class="klok-versie">v${esc(APP_VERSION)}</span>`;
  // Meeliften op de klok: dit punt wordt door de guard hierboven maar één keer
  // per minuut bereikt, en vaker dan dat hoeft "5 u" niet bijgewerkt te worden.
  tekenBronnen();
}

function startKlok(){
  tikKlok();
  setInterval(tikKlok, 1000);
}

function doFullscreen(){
  if(document.fullscreenElement){
    document.exitFullscreen().catch(() => {});
  } else {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

document.addEventListener('keydown', (e) => {
  if((e.altKey || (e.ctrlKey && e.shiftKey)) && e.key === 'f'){
    e.preventDefault();
    doFullscreen();
  }
});

const fsBtn = document.getElementById('fullscreenBtn');
// Geen Fullscreen API (o.a. Safari op de iPhone): de knop zou stil niets doen.
if(fsBtn && !document.documentElement.requestFullscreen) fsBtn.style.display = 'none';
else if(fsBtn) fsBtn.addEventListener('click', doFullscreen);

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */

(async function init(){
  document.getElementById('versionTag').textContent = 'v' + APP_VERSION;
  const splashVersie = document.getElementById('splashVersie');
  if(splashVersie) splashVersie.textContent = 'v' + APP_VERSION;
  startKlok();
  await loadTheme();
  await loadOverzichtWeergave();
  await loadEecvImport();
  await loadUsers();
  await zetLichtAlsStandaard();
  pasGebruikersThemaToe();   // thema van de actieve gebruiker toepassen (na loadTheme's terugval)
  await loadTrips();
  await loadVhBakken();
  await loadHgkBakken();
  tekenBronnen();   // pas hier: vhImportedAt/hgkImportedAt komen uit de twee laders hierboven
  await loadActionLog();
  await loadLastFiles();
  await loadCheckedDiffs();
  await loadHavenPosities();          // HAVEN-KOPPELING
  await loadHavenTegelOverrides();    // handmatig bij een andere tegel gezet
  await loadHavenKleurOverrides();    // handmatig bij een andere bergvaart gezet
  await loadHavenBakPlekOverrides();  // handmatig op een andere plek in de tegel gezet
  if(autoMarkAlBinnen()) await saveTrips();
  updateUndoButton();
  pasTopbarLandscapeAan();   // na het laden van alle modules (zie 04-import.js)
  render();

  /* Het actielog wordt kort ná een handeling weggeschreven (zie
     planActionLogSchrijf). Gaat de pagina eerder dicht — tabblad weg, app naar
     de achtergrond op de tablet — dan moet die laatste schrijfactie alsnog
     gebeuren. pagehide is daarvoor de betrouwbare gebeurtenis; op iOS wordt
     een app die je wegtikt vaak alleen verborgen, vandaar visibilitychange
     erbij. */
  window.addEventListener('pagehide', flushActionLog);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden') flushActionLog();
  });
})();
</script>
