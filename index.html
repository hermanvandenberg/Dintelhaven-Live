    const minX = Math.min(...groepen.map(v => v.x)), minY = Math.min(...groepen.map(v => v.y));
    const midden = {
      x: (minX + Math.max(...groepen.map(v => v.x)) + hx(BAK_LENGTE_M)) / 2,
      y: (minY + Math.max(...groepen.map(v => v.y)) + hy(BAK_BREEDTE_M)) / 2
    };
    const pt = svg.createSVGPoint();
    pt.x = midden.x; pt.y = midden.y;
    const mc = pt.matrixTransform(svg.getScreenCTM());
    actief = { sleutel, namen, bakNamen, groepen, startX:p.x, startY:p.y, bewogen:false,
               hoofd: g || groepen[0].node, viaSet: !g, tabEl,
               anker: { x: minX, y: minY }, midden,
               setOff: { x: mc.x - e.clientX, y: mc.y - e.clientY } };
    groepen.forEach(v => { v.node.classList.add('sleept'); svg.appendChild(v.node); });
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    e.preventDefault();
  });

  svg.addEventListener('pointermove', (e) => {
    if(pan){
      const dx = e.clientX - pan.startClientX;
      if(!pan.bewogen){
        if(Math.abs(dx) < havenTikDrempel(e)) return;
        pan.bewogen = true;
      }
      if(pan.canvas) pan.canvas.scrollLeft = pan.startScrollLeft - dx;
      e.preventDefault();
      return;
    }
    if(lus){
      // De lasso is eruit (v1.329, gaf meer ergernis dan gemak): een sleep
      // vanaf leeg water doet niets meer, alleen een tik wist de selectie.
      const p = naarSvgPunt(e);
      if(Math.hypot(p.x - lus.x, p.y - lus.y) >= havenTikDrempel(e)) lus.bewogen = true;
      return;
    }
    if(!actief) return;
    const p = naarSvgPunt(e);
    const dx = p.x - actief.startX, dy = p.y - actief.startY;
    if(!actief.bewogen && Math.hypot(dx, dy) < havenTikDrempel(e)) return;
    actief.bewogen = true;

    actief.groepen.forEach(v =>
      v.node.setAttribute('transform', `translate(${v.x + dx},${v.y + dy})`));

    svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
    // Alle doelen volgen het midden van de set, niet de vinger (1.353).
    const se = setPunt(actief, e);
    const kolom = document.getElementById('havenWachtrij');
    const bovenWachtrij = havenBovenWachtrij(se);
    if(kolom) kolom.classList.toggle('doelwit', bovenWachtrij);

    // Boven een tabje: dat paneel openklappen en als doel markeren.
    const tab = havenTabOnderAanwijzer(se);
    document.querySelectorAll('.haven-plaatstab').forEach(k =>
      k.classList.toggle('doelwit', k.dataset.plaats === tab));
    if(tab && havenOpenPlaats !== tab) havenZetPlaatsPaneel(tab);
    // Elk mogelijk doel krijgt zijn eigen doelwit-markering — zie dezelfde
    // toelichting in havenKoppelWachtrijSlepen hierboven.
    const paneel = document.getElementById('havenPlaatsPaneel');
    if(paneel) paneel.classList.toggle('doelwit', !paneel.hidden && havenBinnenElement(paneel, se));
    document.querySelectorAll('#havenLegeKolom, #havenPalenKolom').forEach(k =>
      k.classList.toggle('doelwit', !k.hidden && havenBinnenElement(k, se)));

    havenWisGhost(svg);
    if(!bovenWachtrij && !tab && !havenBovenPaneel(se)){
      const doel = setDoel(actief, p);
      // bakNamen staat vast sinds het oppakken; zie de uitleg bij pointerdown
      if(doel && doel.plan) havenToonGhost(svg, actief.bakNamen, doel.zone.id, doel.slot.index, false, doel.strikt);
      else if(doel) havenToonRodeGhost(svg, actief.bakNamen, doel.zone.id, actief.groepen, doel.sdx, doel.sdy);
    }
    e.preventDefault();
  });

  const beeindig = async (e) => {
    if(pan){
      const p2 = pan;
      pan = null;
      // scrollLeft staat al goed — dat gebeurde al live in pointermove. Was
      // er geen beweging (dus de DREMPEL nooit gehaald), dan was dit gewoon
      // een tik naast alles: zelfde gedrag als hieronder.
      if(!p2.bewogen && havenSelectie.size){
        havenSelectie.clear();
        svg.querySelectorAll('.haven-bak.gekozen').forEach(n => n.classList.remove('gekozen'));
        havenToonSelectie();
      }
      return;
    }
    if(lus){
      const l = lus;
      lus = null;
      if(!l.bewogen && havenSelectie.size){
        havenSelectie.clear();
        svg.querySelectorAll('.haven-bak.gekozen').forEach(n => n.classList.remove('gekozen'));
        havenToonSelectie();
      }
      return;
    }
    if(!actief) return;
    const h = actief;
    actief = null;
    h.groepen.forEach(v => v.node.classList.remove('sleept'));
    havenWisGhost(svg);
    svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
    const kolomEl = document.getElementById('havenWachtrij');
    if(kolomEl) kolomEl.classList.remove('doelwit');

    if(!h.bewogen && h.tabEl){ h.tabEl._kies(e); return; }
    if(!h.bewogen && havenWachtOpBestemming()){
      // Er staat iets gekozen in Onderweg: deze tik wijst de bestemming aan.
      const p = naarSvgPunt(e);
      const zone = havenZoneOnderSvg(p.x, p.y);
      if(zone){ await havenZetGekozenSets(zone.id, havenSlotOpLaadlengte(zone, havenSlotOnderSvg(zone, p.x, p.y))); return; }
    }

    if(!h.bewogen){                            // tik: selectie aan/uit
      /* Tik je midden op een set, dan gaat de hele set aan of uit — dezelfde
         plek waar je hem ook in zijn geheel oppakt. Tik je een bak zelf aan,
         dan gaat het om die ene. Eerder ging in beide gevallen alleen de
         eerste bak aan, waardoor een tik op een set van vier er één selecteerde
         en je de andere drie apart moest aantikken. */
      const raakt = h.viaSet ? h.namen : [h.sleutel];
      // de gesleepte kopie snapt terug naar zijn eigen plek; de rest van het
      // aan/uit-zetten zit in havenSchakelBakSelectie, gedeeld met het
      // toetsenbord (Enter/spatie op een bak, zie havenKoppelSlepen hieronder)
      h.groepen.forEach(v => v.node.setAttribute('transform',
        `translate(${v.x},${v.y})`));
      havenSchakelBakSelectie(svg, raakt);
      /* Dubbeltik op dezelfde bak = vertrekboot met de hand (idee 6). De twee
         tikken zetten de selectie aan en weer uit, dus die blijft zoals hij was. */
      if(!h.viaSet && havenIsDubbeltik(h.sleutel)) havenVraagVertrekboot(h.sleutel);
      return;
    }

    document.querySelectorAll('.haven-plaatstab').forEach(k => k.classList.remove('doelwit'));
    const paneelEl = document.getElementById('havenPlaatsPaneel');
    if(paneelEl) paneelEl.classList.remove('doelwit');
    document.querySelectorAll('#havenLegeKolom, #havenPalenKolom').forEach(k => k.classList.remove('doelwit'));

    // Losgelaten op een tabje, in het geopende paneel, of op de lege kolom:
    // naar die plaats. Net als tijdens het slepen telt het midden van de set.
    const se = setPunt(h, e);
    const doelPlaats = havenTabOnderAanwijzer(se) || havenPlaatsZoneOnderAanwijzer(se);
    if(doelPlaats){
      // dezelfde lijst als waarmee de ghost getekend is, zodat neerleggen niet
      // iets anders kan doen dan wat je in beeld zag
      await havenVerplaatsBakken(h.bakNamen, doelPlaats, undefined, true);
      havenSelectie.clear();
      havenZetPlaatsPaneel(null);
      render();
      return;
    }

    // Losgelaten boven de Onderweg-kolom: de set gaat terug de wachtrij in.
    if(havenBovenWachtrij(se)){
      const aantal = await havenTerugNaarOnderweg(h.namen);
      if(aantal) havenSelectie.clear();
      render();
      return;
    }

    // Dezelfde berekening als de schaduw: landen waar hij stond, of — bij een
    // rode schaduw — niets doen; render() zet de set dan terug waar hij lag.
    const doel = setDoel(h, naarSvgPunt(e));
    if(doel && doel.plan &&
       await havenVerplaatsBakken(h.bakNamen, doel.zone.id, doel.slot.index, false, undefined, doel.strikt)){
      havenSelectie.clear();
    }
    render();
  };

  svg.addEventListener('pointerup', beeindig);
  svg.addEventListener('pointercancel', beeindig);

  /* Toetsenbordbediening voor het slepen. Zonder muis of vinger kon er in de
     haventekening niets: geen bak te selecteren, geen bestemming te kiezen —
     het kernproces van dit scherm was op geen enkele manier met het
     toetsenbord te doen. Beide bakken en zones hebben tabindex/role gekregen
     bij het tekenen (hierboven); hier komt alleen de bediening bij.

     Op een bak: Enter/spatie zet 'm aan of uit — hetzelfde als de muis-tik
     zonder te bewegen, via dezelfde havenSchakelBakSelectie(). Op een zone:
     Enter/spatie zet alles wat gekozen is daar neer, via dezelfde
     havenZetGekozenSets() die de plaatstab-knoppen ook al gebruiken. Is er
     niets gekozen, dan doet die functie zelf niets — geen extra controle
     hier nodig.

     Geen los pad voor "een hele set in één keer oppakken zoals de muis dat
     kan door tussen de bakken te tikken": op de tekening is dat overbodig,
     want elke bak die bij een set hoort kan gewoon los aangetikt worden. */
  svg.addEventListener('keydown', async (e) => {
    // V op een bak: vertrekboot met de hand, hetzelfde als een dubbeltik.
    if((e.key === 'v' || e.key === 'V') && e.target.closest('.haven-bak')){
      e.preventDefault();
      havenVraagVertrekboot(e.target.closest('.haven-bak').dataset.bak);
      return;
    }
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const bak = e.target.closest('.haven-bak');
    if(bak){
      e.preventDefault();
      havenSchakelBakSelectie(svg, [bak.dataset.bak]);
      return;
    }
    const zone = e.target.closest('.haven-zone');
    if(zone){
      e.preventDefault();
      await havenZetGekozenSets(zone.dataset.zone);
    }
  });
}

// Zones en plekken staan in meters; het aanwijspunt komt in svg-eenheden
// binnen, dus rekenen we de diepte-as terug.
function havenZoneOnderSvg(sx, sy){
  const xm = sx, ym = sy / HAVEN_DIEPTEFACTOR;
  // Virtuele zones staan niet in de tekening, dus je kunt er ook niet op
  // loslaten. Die bereik je via hun paneel.
  return HAVEN_LAYOUT.zones.find(z => !z.virtueel &&
    xm >= z.x && xm <= z.x + z.w && ym >= z.y && ym <= z.y + z.h) || null;
}
/* Welke plek wijs je aan?

   Dit eiste eerst een treffer binnen een plek. Tussen twee laadlengtes ligt
   een halve baklengte vrije kade, en daar raak je niets — wees je op de
   westkant van de 4e lengte, dan kwam er geen ghost en leek het alsof je daar
   niet neer kon leggen. Pas verder naar het oosten sprong hij aan.

   Nu wordt de dichtstbijzijnde plek in dezelfde rij gepakt. Wijs je buiten de
   zone, dan is er nog steeds niets. */
function havenSlotOnderSvg(zone, sx, sy){
  const xm = sx, ym = sy / HAVEN_DIEPTEFACTOR;
  const slots = havenZoneSlots(zone);

  const raak = slots.find(s =>
    xm >= s.x && xm <= s.x + s.w && ym >= s.y && ym <= s.y + s.h);
  if(raak) return raak.index;

  const inRij = slots.filter(s => ym >= s.y && ym <= s.y + s.h);
  if(!inRij.length) return null;
  let beste = inRij[0], besteAfstand = Infinity;
  inRij.forEach(s => {
    const midden = s.x + s.w / 2;
    const afstand = Math.abs(xm - midden);
    if(afstand < besteAfstand){ besteAfstand = afstand; beste = s; }
  });
  return beste.index;
}
/* Een greep van `greepKol` halve bakken ten oosten van de westkant: de set
   begint zoveel kolommen westelijker dan de aanwijzer. Alleen nog voor het
   slepen vanuit een bakkenplaats-paneel (havenSlotGecentreerd); binnen de
   tekening rekent havenKoppelSlepen sinds 1.353 vanaf de set zelf. */
function havenSlotMetGreep(zone, sx, sy, greepKol){
  const index = havenSlotOnderSvg(zone, sx, sy);
  if(index == null || !greepKol) return index;
  const slots = havenZoneSlots(zone);
  const onder = slots.find(s => s.index === index);
  if(!onder) return index;
  const rij = slots.filter(s => s.rij === onder.rij);
  const westKol = Math.min(...rij.map(s => s.kol));
  const doel = rij.find(s => s.kol === Math.max(westKol, onder.kol - greepKol));
  return doel ? doel.index : index;
}

/* Een set uit een bakkenplaats-menu de haven in slepen: de ghost ligt met
   zijn midden onder de aanwijzer, en de zwevende tegel hangt daar recht
   onder (of op de kolenkade recht boven), met hetzelfde midden.

   Eerder begon de ghost bij de aanwijzer en liep hij naar het oosten, terwijl
   de tegel links-boven de aanwijzer hing — tegel en ghost stonden dan schots
   en scheef naast elkaar en je zag slecht waar de set zou landen. Eerst een
   proefplan voor de breedte (een set van zes kan gekanteld liggen), dan de
   greep op de helft daarvan. Het loslaten gebruikt dezelfde functie, dus wat
   de ghost laat zien is wat er gebeurt. */
function havenSlotGecentreerd(zone, sx, sy, namen){
  const index = havenSlotOnderSvg(zone, sx, sy);
  const plan = index != null && havenZoekPlaats(namen, zone.id, index, true);
  if(!plan) return index;
  const kols = plan.plekken.map(p => p.kol);
  const breedte = Math.max(...kols) - Math.min(...kols) + (zone.perPositie ? 1 : KOLOMMEN_PER_BAK);
  return havenSlotMetGreep(zone, sx, sy, Math.round((breedte - 1) / 2));
}

/* De kolenkade ligt bovenin: de tegel gaat dan boven de ghost hangen, zodat
   hij niet over de kade en de set heen valt. Elders hangt hij eronder. Geen
   ghost (het past niet): dan dezelfde kant, maar vanaf de aanwijzer. */
function havenZweefBijGhost(zweef, ev, ghost, tegelBoven){
  const t = zweef.getBoundingClientRect();
  const g = ghost && ghost.getBoundingClientRect();
  const m = SLEEP_VERSCHUIVING.marge;
  // Op het midden van de ghost, niet van de aanwijzer: de ghost springt per
  // halve baklengte, en anders staan ze tot een halve bak naast elkaar.
  zweef.style.left = ((g ? (g.left + g.right) / 2 : ev.clientX) - t.width / 2) + 'px';
  zweef.style.top = (tegelBoven
    ? (g ? g.top : ev.clientY) - m - t.height
    : (g ? g.bottom : ev.clientY) + m) + 'px';
}

/* ═══ HAVEN [blok: einde] ═══════════════════════════════════════════ */
</script>

<script>
/* Auteur: HvdB */

/* Het wegschrijven heet saveTripsNaarOpslag(); saveTrips() is de publieke naam
   die overal wordt aangeroepen. Twee functies met dezelfde naam gaf eerder een
   hijsprobleem waarbij de planning nooit werd opgeslagen. */
async function saveTrips(){
  await saveTripsNaarOpslag();
}


/* Klok in de topbalk. Elke seconde kijken maar alleen schrijven als de tekst
   echt verandert — dat scheelt een DOM-wijziging per seconde die niets doet.
   De minuut is fijn genoeg voor een planning; seconden zouden alleen maar
   onrust geven in een scherm waar je de hele dag naar kijkt. */
const KLOK_DAGEN = ['zo','ma','di','wo','do','vr','za'];
const KLOK_MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
let klokVorige = null;

function klokTekst(d){
  const tijd = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  const datum = KLOK_DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + KLOK_MAANDEN[d.getMonth()];
  return { tijd, datum };
}

function tikKlok(){
  const el = document.getElementById('klok');
  if(!el) return;
  const { tijd, datum } = klokTekst(new Date());
  const nieuw = tijd + '|' + datum;
  if(nieuw === klokVorige) return;
  klokVorige = nieuw;
  el.innerHTML = `${esc(tijd)} <span class="klok-datum">${esc(datum)}</span> <span class="klok-versie">v${esc(APP_VERSION)}</span>`;
  // Meeliften op de klok: dit punt wordt door de guard hierboven maar één keer
  // per minuut bereikt, en vaker dan dat hoeft "5 u" niet bijgewerkt te worden.
  tekenBronnen();
}

function startKlok(){
  tikKlok();
  setInterval(tikKlok, 1000);
}

function doFullscreen(){
  if(document.fullscreenElement){
    document.exitFullscreen().catch(() => {});
  } else {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

document.addEventListener('keydown', (e) => {
  if((e.altKey || (e.ctrlKey && e.shiftKey)) && e.key === 'f'){
    e.preventDefault();
    doFullscreen();
  }
});

const fsBtn = document.getElementById('fullscreenBtn');
// Geen Fullscreen API (o.a. Safari op de iPhone): de knop zou stil niets doen.
if(fsBtn && !document.documentElement.requestFullscreen) fsBtn.style.display = 'none';
else if(fsBtn) fsBtn.addEventListener('click', doFullscreen);

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */

(async function init(){
  document.getElementById('versionTag').textContent = 'v' + APP_VERSION;
  const splashVersie = document.getElementById('splashVersie');
  if(splashVersie) splashVersie.textContent = 'v' + APP_VERSION;
  startKlok();
  await loadTheme();
  await loadOverzichtWeergave();
  await loadEecvImport();
  await loadUsers();
  await zetLichtAlsStandaard();
  pasGebruikersThemaToe();   // thema van de actieve gebruiker toepassen (na loadTheme's terugval)
  await loadTrips();
  await loadVhBakken();
  await loadHgkBakken();
  tekenBronnen();   // pas hier: vhImportedAt/hgkImportedAt komen uit de twee laders hierboven
  await loadActionLog();
  await loadLastFiles();
  await loadCheckedDiffs();
  await loadHavenPosities();          // HAVEN-KOPPELING
  await loadHavenTegelOverrides();    // handmatig bij een andere tegel gezet
  await loadHavenKleurOverrides();    // handmatig bij een andere bergvaart gezet
  await loadHavenBakPlekOverrides();  // handmatig op een andere plek in de tegel gezet
  await loadHavenBewaard();           // laatst bekende gegevens van bakken in de haven (idee 6)
  await loadHavenVertrekOverrides();  // vertrekboot met de hand gezet (idee 6)
  if(autoMarkAlBinnen()) await saveTrips();
  updateUndoButton();
  pasTopbarLandscapeAan();   // na het laden van alle modules (zie 04-import.js)
  render();

  /* Wie heeft er dienst: bij openen, bij terughalen van de app en elke halve
     minuut, zodat de vraag om 07:00 en 19:00 ook komt als de app al open staat. */
  controleerDienst();
  setInterval(controleerDienst, 30000);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') controleerDienst();
  });

  /* Het actielog wordt kort ná een handeling weggeschreven (zie
     planActionLogSchrijf). Gaat de pagina eerder dicht — tabblad weg, app naar
     de achtergrond op de tablet — dan moet die laatste schrijfactie alsnog
     gebeuren. pagehide is daarvoor de betrouwbare gebeurtenis; op iOS wordt
     een app die je wegtikt vaak alleen verborgen, vandaar visibilitychange
     erbij. */
  window.addEventListener('pagehide', flushActionLog);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden') flushActionLog();
  });

  /* Offline openen op de iPad (stap 4, docs/IDEEEN.md): alleen op de echte
     hosting (https). Vanaf de schijf kan het niet, en in de projectmap zou de
     cache oude ontwikkelversies vasthouden. persist() vraagt de browser de
     opslag (haven-ligging, gebruikers) niet zelf op te ruimen bij ruimtegebrek. */
  if(location.protocol === 'https:' && 'serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker niet geregistreerd:', e));
  }
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
