     diep. Tik je twee bakken aan die op de kade naast elkaar liggen, dan is
     dat blok twee breed en past het daar niet — terwijl ze er in het echt
     gewoon achter elkaar tussen de palen liggen. Zonder deze tweede regel
     lichtten de palen dus nooit op. */
  const rijenInZone = rijen;
  const bakkenPerRij = Math.max(1, Math.floor(
    ((slots.length ? Math.max(...slots.map(s => s.kol)) : 0) + 1) / stapPerBak));
  const hoogte = Math.max(...indeling.map(v => v.rij)) + 1;
  const breedte = Math.max(...indeling.map(v => v.kol)) + 1;
  if(hoogte > rijenInZone && breedte <= rijenInZone){
    indeling = indeling.map(v => ({ sleutel: v.sleutel, rij: v.kol, kol: v.rij }));
  } else if(breedte > bakkenPerRij && hoogte <= bakkenPerRij){
    indeling = indeling.map(v => ({ sleutel: v.sleutel, rij: v.kol, kol: v.rij }));
  } else if(bakkenPerRij === 1 && breedte > 1){
    /* Eén bak breed (de palen): een blok van 2×2 past gekanteld nog steeds
       niet. Daar liggen ze gewoon achter elkaar, dus één kolom. */
    indeling = [...indeling].sort((a, b) => a.rij - b.rij || a.kol - b.kol)
      .map((v, i) => ({ sleutel: v.sleutel, rij: i, kol: 0 }));
  }

  const blokH = Math.max(...indeling.map(v => v.rij)) + 1;
  const blokB = Math.max(...indeling.map(v => v.kol)) + 1;
  const ankerSlot = slots.find(s => s.index === startSlot) || slots[0];
  const aKol = ankerSlot ? ankerSlot.kol : 0;
  /* Zonder aangewezen plek begint de zoektocht aan de walkant: bovenin bij
     B2/B3, onderin bij B4 (zie havenVultVanOnderen). */
  const vanOnderen = havenVultVanOnderen(zone);
  const walRij = vanOnderen ? Math.max(0, rijen - blokH) : 0;
  const aRij = startSlot != null && ankerSlot ? ankerSlot.rij : walRij;
  const maxKol = slots.length ? Math.max(...slots.map(s => s.kol)) : 0;

  // v.kol telt in bakken; op een kade telt het raster in halve bakken
  // (stapPerBak = 2, en dan moeten beide helften vrij zijn), op een
  // bakkenplaats is één kolom al een hele bak (stapPerBak = 1, geen tweede
  // helft om te checken).
  const vrij = (rij, kol) => indeling.every(v => {
    const links = opRijKol(rij + v.rij, kol + v.kol * stapPerBak);
    if(!links || bezet.has(links.index)) return false;
    if(zone.perPositie) return true;
    const rechts = opRijKol(rij + v.rij, kol + v.kol * stapPerBak + 1);
    return rechts && !bezet.has(rechts.index);
  });
  /* Contact (idee 11): op een kade ligt een bak nooit los in het water. Hij
     raakt de wal (de walrij), of zij aan zij of kop aan kont een andere bak —
     een hoekje schuin telt niet. Geldt voor tikken, slepen en de ghost: alles
     loopt via deze ene regel. */
  const wandRij = vanOnderen ? rijen - 1 : 0;
  const bezetOp = (r, k) => { const s = opRijKol(r, k); return !!s && bezet.has(s.index); };
  const raakt = (rij, kol) => indeling.some(v => {
    const r = rij + v.rij, l = kol + v.kol * stapPerBak, re = l + stapPerBak - 1;
    if(r === wandRij || bezetOp(r, l - 1) || bezetOp(r, re + 1)) return true;
    for(let c = l; c <= re; c++) if(bezetOp(r - 1, c) || bezetOp(r + 1, c)) return true;
    return false;
  });
  /* Zij aan zij ligt een bak altijd precies gelijk naast een andere bak, nooit
     een halve bak verschoven — die halve schuif bestaat alleen langs de wal.
     Raakt een bak in de rij ernaast deze plek, dan moet die op dezelfde kolom
     beginnen; anders ligt de ghost half op een bak en half op niks. */
  const bakBegin = new Set(havenBakkenMetPlek()
    .filter(b => b.zone === zone.id && !sleutels.includes(b.sleutel) && b.slot != null).map(b => b.slot));
  const beginOp = (r, k) => { const s = opRijKol(r, k); return !!s && bakBegin.has(s.index); };
  const scheef = (rij, kol) => indeling.some(v => {
    const r = rij + v.rij, l = kol + v.kol * stapPerBak, re = l + stapPerBak - 1;
    return [r - 1, r + 1].some(n => (bezetOp(n, l) || bezetOp(n, re)) && !beginOp(n, l));
  });
  const past = (rij, kol) => vrij(rij, kol) && (zone.type !== 'kade' || (raakt(rij, kol) && !scheef(rij, kol)));

  // Zoek een plek waar het hele blok past, te beginnen bij waar losgelaten is.
  // Eerder werd alleen naar beneden gezocht en bleef de kolom vast op de
  // kolom waar je losliet. Een set van twee bakken breed die je op de laatste
  // kolom neerzette, viel daardoor altijd buiten de zone: dan volgde "past
  // niet", ook al was de bakkenplaats leeg. Nu schuift hij ook opzij.
  /* Op een kade beginnen de laadlengtes om de twee baklengtes, met een half
     gat ertussen. Een set die op zo'n grens begint ligt netjes binnen de
     vakken; eentje die er middenin begint valt over het gat heen en oogt
     uit elkaar getrokken. Daarom eerst de plekken die op een grens vallen,
     en pas als er geen is de rest. Elders (bakkenplaats) is er geen grens en
     telt alles even zwaar. */
  const opGrens = (k) => zone.type !== 'kade' || k % KOLOMSTAP_PER_LAADLENGTE === 0;

  const zoekVanaf = (beginRij) => {
    /* Op een kade met de wal onderin (B4) lopen de rijen de andere kant op:
       eerst de rij die het dichtst tegen de wal ligt, dan verder het water in.
       Elders blijft het van boven naar beneden. */
    const rijVolgorde = [];
    if(vanOnderen){
      for(let r = Math.min(beginRij, rijen - blokH); r >= 0; r--) rijVolgorde.push(r);
    } else {
      for(let r = beginRij; r + blokH <= rijen; r++) rijVolgorde.push(r);
    }
    for(const r of rijVolgorde){
      const hier = zoekOpRij(r);
      if(hier) return hier;
    }
    return null;
  };
  function zoekOpRij(r){
    const start = Math.min(aKol, Math.max(0, maxKol - (blokB - 1) * stapPerBak));

    /* Waar je loslaat wint, altijd. Dat is wat je bedoelde, ook als het een
       halve baklengte verschoven is — precies de reden dat het raster in
       halve bakken telt. Pas als het dáár niet past gaan we zoeken, en dan
       heeft een plek op een laadlengtegrens de voorkeur, want anders schuift
       een set die net niet paste half over het gat tussen twee lengtes. */
    if(past(r, start)) return { r, k: start };

    const kandidaten = [];
    for(let k = start - 1; k >= 0; k--) if(past(r, k)) kandidaten.push(k);
    for(let k = start + 1; k + (blokB - 1) * stapPerBak <= maxKol; k++) if(past(r, k)) kandidaten.push(k);
    if(!kandidaten.length) return null;
    const netjes = kandidaten.find(opGrens);
    return { r, k: netjes != null ? netjes : kandidaten[0] };
  }
  /* Bakkenplaats met een aangetikte rij: de vrije plek die daar het dichtst
     bij ligt, bij gelijke afstand de hogere (die dekt de aangetikte rij nog).
     Eerder viel hij terug op de walkant, dus bovenaan, zodra hij vanaf de
     aangetikte rij naar beneden nergens paste (v1.332). */
  const zoekDichtbij = () => {
    const volgorde = [...Array(Math.max(0, rijen - blokH + 1)).keys()]
      .sort((a, b) => Math.abs(a - aRij) - Math.abs(b - aRij) || a - b);
    for(const r of volgorde){
      const hier = zoekOpRij(r);
      if(hier) return hier;
    }
    return null;
  };

  // Lukt het nergens vanaf de aanwijsrij, dan alsnog de hele zone vanaf de
  // walkant. Een eenheid mag nooit uit elkaar vallen en bakken van een andere
  // set worden nooit opzijgeschoven; past het echt nergens, dan gaat het niet
  // door en houdt de aanroeper alles staan zoals het lag.
  /* Een strikte plek die op rij 0 is aangewezen — zoals de laadlengte-knop op
     de tegel doet (havenLaadlengteZoneVoorTegel) — hoort op B4 alsnog tegen de
     wal te liggen, niet aan de waterkant. */
  const strikteRij = vanOnderen ? (aRij === 0 ? walRij : Math.min(aRij, walRij)) : aRij;
  /* Voorkeur, in deze volgorde: binnen het bereik van de machine, dan helemaal
     binnen de lengte (niet half over het gat naar de buurlengte). Een set van
     drie breed past nooit in één lengte van twee; die mag dan doorlopen. */
  const zoekInLengte = (l) => {
    const laatsteKol = k => k + (blokB - 1) * stapPerBak + (zone.perPositie ? 0 : 1);
    const inBereik = k => !l.bereik || (k >= l.bereik.vanKolom && laatsteKol(k) <= l.bereik.totKolom);
    const score = k => (inBereik(k) ? 0 : 2) + (laatsteKol(k) <= l.totKolom ? 0 : 1);
    let beste = null;
    for(let i = 0; i + blokH <= rijen; i++){
      const r = vanOnderen ? rijen - blokH - i : i;
      for(let k = l.vanKolom; k <= l.totKolom; k++){
        if(!past(r, k)) continue;
        const s = score(k);
        if(s === 0) return { r, k };
        if(!beste || s < beste.s) beste = { r, k, s };
      }
    }
    return beste;
  };
  const doel = strikt && strikt.cel
    ? (past(strikt.cel.r, strikt.cel.k) ? { r: strikt.cel.r, k: strikt.cel.k } : null)   // precies deze cel (havenToonAlleGloei)
    : strikt && typeof strikt === 'object'
    ? zoekInLengte(strikt)
    : strikt
    ? (past(strikteRij, aKol) ? { r: strikteRij, k: aKol } : null)
    : startSlot != null && zone.type !== 'kade'
    ? zoekDichtbij()
    : (zoekVanaf(aRij) || (aRij !== walRij ? zoekVanaf(walRij) : null));

  if(!doel) return null;
  return {
    zone,
    plekken: indeling.map(v => {
      const s = opRijKol(doel.r + v.rij, doel.k + v.kol * stapPerBak);
      return { sleutel: v.sleutel, slot: s.index, rij: s.rij, kol: s.kol };
    })
  };
}

/* `logTekst` bepaalt wat er in het actielog komt:
   weglaten = de standaardregel, een tekst = die tekst, `null` = niets, voor
   wanneer de aanroeper de handeling zelf al heeft vastgelegd.

   Het vastleggen gebeurt hier vóór de eerste wijziging. Dat moest: de
   momentopname werd eerder pas achteraf genomen, dus ongedaan maken zette de
   haven terug naar de stand van ná de verplaatsing — en dan gebeurde er
   zichtbaar niets. */
async function havenVerplaatsBakken(namen, zoneId, startSlot, herindelen, logTekst, strikt){
  const plan = havenZoekPlaats(namen, zoneId, startSlot, herindelen, strikt);
  if(!plan){
    /* Bij een strikte poging hoort geen rode balk boven de haven. Die zegt
       "de set past hier nergens", en dat is niet waar: hij past alleen niet
       op die ene plek waar je hem naartoe schoof. Hij ligt er meestal al. De
       aanroeper meldt zelf wat er aan de hand is. */
    if(!strikt) havenMelding = `De set past niet op ${havenZoneNaam(zoneId)} — hij blijft liggen waar hij lag.`;
    return false;
  }
  if(logTekst !== null){
    await logAction(logTekst || `Haven: ${namen.join(', ')} naar ${havenZoneNaam(zoneId)}`);
  }

  // Vóór het overschrijven: waar kwamen ze vandaan (voor het leglogboek), en
  // de ligging in de haven is dan nog te lezen.
  const vanZone = new Map(havenBakkenMetPlek().map(b => [b.sleutel, b.zone]));
  const volKeuze = havenVolKolomKeuze;
  const bronTegels = zoneId === 'vol' ? havenBronTegels(namen) : null;
  if(zoneId === 'vol') await havenNeemIndelingMeeNaarVol(namen);

  const sleutels = namen.map(normalizeBargeName);
  const nu = Date.now();
  plan.plekken.forEach(v => {
    havenPosities[v.sleutel] = havenNieuwePositie(v.sleutel, zoneId, v.slot, nu);
  });
  await saveHavenPosities();
  if(bronTegels) await havenHoudTegelsBijElkaar(bronTegels);

  // Welke tegels raken hierdoor van plek? Zoek rechtstreeks in de ritten,
  // niet via havenBakken() — die telt alleen aangemeerde tegels, en bij een
  // set die net binnenkomt staat die vlag nog niet aan.
  const geraakteTrips = trips
    .filter(t => t.status === 'actief' &&
                 t.rows.some(r => r.leichter && sleutels.includes(normalizeBargeName(r.leichter))))
    .map(t => t.id);
  let tripsGewijzigd = false;
  geraakteTrips.forEach(id => {
    const trip = trips.find(t => t.id === id);
    if(!trip) return;
    const pos = havenTegelPositie(trip);
    if(pos.verdeeld) return;                    // laat station met rust
    const z = havenZone(pos.zone);
    if(z && z.type === 'kade'){
      // De kade is één strook, dus de laadlengte volgt uit de kolom waar de
      // set begint — niet meer uit het vak waarin hij is losgelaten. Een set
      // van zes loopt over twee lengtes heen en houdt de naam van de lengte
      // waar hij begint.
      const kolommen = trip.rows
        .map(r => r.leichter && havenSlotVanBak(r.leichter))
        .filter(i => i != null)
        .map(i => havenZoneSlots(z).find(s => s.index === i))
        .filter(Boolean)
        .map(s => s.kol);
      const startKolom = kolommen.length ? Math.min(...kolommen) : 0;

      // Bij B2/B3 kunnen twee machines dezelfde kolom bedienen. Stond de tegel
      // al op een van die twee, dan laten we die keuze staan.
      const bereikbaar = havenMachinesVoorKolom(z, startKolom);
      if(bereikbaar.length && !bereikbaar.includes(trip.station)){
        trip.station = bereikbaar[0];
      }
      const lengte = havenLengteVoorKolom(z, startKolom);
      if(lengte) trip.liegeplaats = lengte.lengte;
      trip.klaarOmTeLaden = true;
      tripsGewijzigd = true;
    }
    else if(z && z.type === 'bakkenplaats' && trip.klaarOmTeLaden){
      // Weg van de kade: de bakken liggen er nog wel, maar staan niet meer
      // klaar om te laden. De lengte blijft staan als laatst bekende plek.
      trip.klaarOmTeLaden = false;
      tripsGewijzigd = true;
    }
  });

  if(tripsGewijzigd) await saveTrips();
  havenLegLog('verplaatst', namen, { naar: zoneId, van: namen.map(n => vanZone.get(normalizeBargeName(n)) || 'onderweg'), keuze: zoneId === 'vol' ? volKeuze : null });
  return true;
}

/* Fout 19 — de hand wint van de lijst. Wat je in één keer naar de volle plaats
   brengt en daarvoor één tegel was (op de kade, de lege plaats of in Onderweg),
   blijft daar één tegel, ook als de lijst de bakken over twee vertreksleutels
   verdeelt (HK 12). Dat geldt voor een tegel van een kade (laadlengte): daar
   heb jij de formatie gelegd. Uit Onderweg of van de lege plaats is een tegel
   nog de aankomst volgens de lijst, en twee vertrekken die samen binnenkwamen
   blijven dan twee sets (bug na v1.302). Haal je juist een deel uit een tegel op Vol naar een andere
   rij, dan wordt dat deel een eigen tegel. Bakken die los binnenkomen volgen
   gewoon de lijst (boot + tijd + kleur, havenPlaatsGroepKey). Vastgelegd in
   havenTegelOverrides, zoals elke eigen keuze. */
function havenBronTegels(namen){
  const nu = new Map(havenBakkenMetPlek().map(b => [b.sleutel, b]));
  const groepen = new Map();
  namen.forEach(naam => {
    const sl = normalizeBargeName(naam);
    const b = nu.get(sl);
    const bron = b && b.zone === 'vol' ? 'vol|' + havenPlaatsGroepKey(b) : havenBlokVan(naam);
    if(!groepen.has(bron)) groepen.set(bron, []);
    groepen.get(bron).push(sl);
  });
  return groepen;
}
async function havenHoudTegelsBijElkaar(groepen){
  const opVol = havenBakkenMetPlek().filter(b => b.zone === 'vol');
  const verplaatst = new Set([...groepen.values()].flat());
  let gewijzigd = false;
  groepen.forEach((sleutels, bron) => {
    if(bron.startsWith('vol|')){
      const tegel = bron.slice(4);
      const blijft = opVol.some(b => havenPlaatsGroepKey(b) === tegel && !verplaatst.has(b.sleutel));
      if(!blijft) return;                                // de hele tegel schoof mee
      const deel = 'deel|' + sleutels[0] + '|' + Date.now();
      sleutels.forEach(sl => { havenTegelOverrides[sl] = deel; delete havenBakPlekOverrides[sl]; });
      gewijzigd = true;
      return;
    }
    const [soort, zoneId] = bron.split('|');
    if(soort !== 'haven' || (havenZone(zoneId) || {}).type !== 'kade') return;
    const bakken = opVol.filter(b => sleutels.includes(b.sleutel));
    if(bakken.length < 2) return;
    // Naar de sleutel die de meeste al hebben, zodat er zo min mogelijk vast komt te liggen.
    const tel = new Map();
    bakken.forEach(b => { const k = havenPlaatsGroepKey(b); tel.set(k, (tel.get(k) || 0) + 1); });
    const doel = [...tel].sort((a, b) => b[1] - a[1])[0][0];
    bakken.forEach(b => {
      if(havenPlaatsGroepKey(b) !== doel){ havenTegelOverrides[b.sleutel] = doel; gewijzigd = true; }
    });
  });
  if(gewijzigd){ await saveHavenTegelOverrides(); await saveHavenBakPlekOverrides(); }
}

/* Idee 22 — een nieuwe VH/HGK-lijst komt binnen. Een dummy die in de haven ligt:
   - noemt de lijst voor dezelfde boot, dag en positie een bak die nog nergens
     ligt (echte naam, of een dummy met een verschoven tijd), dan neemt die zijn
     plek over, met alles wat jij er met de hand aan deed;
   - staat de boot er niet meer op, dan blijft de dummy liggen tot jij hem
     weghaalt (hij gaat mee in de nieuwe lijst).
   Dummy's in Onderweg volgen gewoon de lijst. Geeft de nieuwe lijst terug. */
async function havenDummiesOvernemen(oud, nieuw){
  const dag = t => +((String(t || '').match(/^\d{4}-\d{2}-(\d{2})/) || String(t || '').match(/^\s*(\d{1,2})/) || [])[1] || 0);
  const zelfde = (a, b) => normalizeBargeName(a || '') === normalizeBargeName(b || '');
  const nieuweNamen = new Set(nieuw.map(v => normalizeBargeName(v.naam || '')));
  const genomen = new Set();
  let verplaatst = false;
  oud.filter(d => isDummyName(d.naam) && havenPosities[normalizeBargeName(d.naam)]).forEach(d => {
    const van = normalizeBargeName(d.naam);
    if(nieuweNamen.has(van)) return;                    // dezelfde dummy, niets te doen
    // Is de bak al binnen, dan staat er geen tijd meer bij: dan telt de dag niet.
    const echt = nieuw.find(v => v.naam && !genomen.has(v) && !havenPosities[normalizeBargeName(v.naam)]
      && zelfde(v.schip, d.schip) && zelfde(v.positie, d.positie) && (!v.tijd || dag(v.tijd) === dag(d.tijd)));
    if(!echt){ nieuw.push(d); return; }
    genomen.add(echt);
    const naar = normalizeBargeName(echt.naam);
    [havenPosities, havenBakPlekOverrides, havenTegelOverrides, havenKleurOverrides].forEach(tabel => {
      if(tabel[van] !== undefined){ tabel[naar] = tabel[van]; delete tabel[van]; }
    });
    verplaatst = true;
  });
  if(verplaatst){
    await saveHavenPosities();
    await saveHavenBakPlekOverrides();
    await saveHavenTegelOverrides();
    await saveHavenKleurOverrides();
  }
  return nieuw;
}

// Leesbare naam van een zone, voor tegels en meldingen.
/* Ingeklapte kolommen (idee 10). Per gebruiker (optie A): wie dienst heeft
   krijgt zijn eigen indeling, in zijn profiel (settings.havenIngeklapt), dus
   bij een dienstwissel klapt het scherm mee. Niemand actief: per apparaat.
   Browseropslag kan ontbreken (privévenster), dan staat alles gewoon open. */
const HAVEN_INGEKLAPT_KEY = 'duwbakken-haven-ingeklapt';
function havenIngeklapt(){
  const u = getCurrentUser();
  let stand = {};
  if(u) stand = { ...((u.settings && u.settings.havenIngeklapt) || {}) };
  else try{ stand = JSON.parse(localStorage.getItem(HAVEN_INGEKLAPT_KEY)) || {}; }catch(e){}
  // Tot 1.368 heette de strook met Palen + Onderweg 'rechts'.
  if(stand.onder === undefined && stand.rechts !== undefined) stand.onder = stand.rechts;
  return stand;
}
function havenZetIngeklapt(kant, dicht){
  const stand = havenIngeklapt();
  stand[kant] = dicht;
  const u = getCurrentUser();
  if(u){
    u.settings = { ...(u.settings || {}), havenIngeklapt: stand };
    saveUsers();
    return;
  }
  try{ localStorage.setItem(HAVEN_INGEKLAPT_KEY, JSON.stringify(stand)); }catch(e){ meldOpslagProbleem(HAVEN_INGEKLAPT_KEY, e); }
}
/* Sleep je iets boven een ingeklapt lipje, dan schuift die kolom na een
   tel even open — zonder hertekening van de pagina (die zou het slepen
   afbreken) en zonder het te onthouden: bij de volgende hertekening is hij
   weer dicht. Eén luisteraar op het document, want tijdens het slepen houdt
   de sleepcode de aanwijzer vast (pointer capture). */
let havenLipTimer = null;
document.addEventListener('pointermove', e => {
  const lip = e.buttons ? [...document.querySelectorAll('.haven-lip.dicht')].find(l => {
    const r = l.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }) : null;
  if(!lip){ clearTimeout(havenLipTimer); havenLipTimer = null; return; }
  if(havenLipTimer) return;
  havenLipTimer = setTimeout(() => {
    havenLipTimer = null;
    lip.classList.remove('dicht');
    lip.closest('[data-paneel]')?.classList.remove('dicht');
    if(lip.dataset.lip === 'leeg') havenTekenLegeKolom();
    else if(lip.dataset.lip === 'vol') havenTekenVolVlak();
    else havenTekenPalenKolom();
  }, 400);
});

function havenZoneNaam(id){
  const z = havenZone(id);
  if(!z) return '?';
  if(z.type !== 'kade') return z.label;
  const m = (z.stations || []).join('/');
  return `kade ${m}`;
}

// Markering op de tegel wanneer zijn bakken niet op één plek liggen. Dan
// kan station/liegeplaats niet kloppen voor allemaal, dus zeggen we het.
// HAVEN-KOPPELING: aangeroepen vanuit renderCard.
function havenVerdeeldTag(trip){
  const pos = havenTegelPositie(trip);
  // Vol en lege plaats staan sinds 1.356 als tekst achter de bak zelf; het
  // label is alleen nog nodig als de bakken over meer dan één andere plek liggen.
  if(pos.zones.filter(z => z !== 'vol' && z !== 'leeg').length < 2) return '';
  return `<div class="verdeeld-tag" title="De bakken van deze tegel liggen op meerdere plekken in de haven">
    verdeeld: ${pos.zones.map(z => esc(havenZoneNaam(z))).join(' · ')}
  </div>`;
}

// --- Onderweg: sets die nog moeten aankomen ------------------------
// Uit de VH- en HGK-lijst, gegroepeerd per kleurset en op aankomsttijd
// gesorteerd. Alleen sets waarvan de tegel nog niet op aanwezig staat —
// zodra je een set naar de lege bakkenplaats sleept is hij binnen.
/* Bakken die niet in de Dintelhaven liggen.

   In de VH/HGK-lijst staat achter zo'n bak waar hij heen gaat of waar hij
   ligt: "VKV laden Gent", EBS, EMO of HWAARD — dat laatste is de werf Hoge
   Waard. Die laden niet bij EECV, staan dus ook niet op de EECV-lijst, en
   horen daarom niet in Onderweg en niet op een bakkenplaats.

   Ze werden er wél bij gezet, en dan kreeg je een tegel met bakken die er
   helemaal niet lagen: twee bakken die met dezelfde boot waren gebracht maar
   in een andere reis, en die daarna naar Gent doorgingen.

   Ze krijgen later een eigen tabje. Tot die tijd blijven ze buiten beeld.
   Deze lijst is met opzet met de hand geschreven en niet "alles wat geen
   ladingsoort is": zo kan er nooit per ongeluk een bak wegvallen die hier wél
   ligt. Komt er een plek bij, dan hoort hij hier.

   1.316: HBTR is een externe laadplek in de Hartelhaven en wordt behandeld
   zoals EMO ("ERTS ex HBTR ( 6e spil 2 )"). "liegt im Hartelhaven" (HGK 97 op
   de lijst van 12-10) betekent dat nog niet bekend is of de bak hierheen komt.
   Staat zo'n bak niet meer op de volgende lijst, dan is hij vertrokken en
   verdwijnt hij vanzelf: Elders wordt elke keer opnieuw uit de lijst berekend. */
const PLEKKEN_BUITEN_DE_HAVEN = [
  { naam:'Gent',       patroon:/\bgent\b/i },
  { naam:'EBS',        patroon:/\bebs\b/i },
  { naam:'EMO',        patroon:/\bemo\b/i },
  { naam:'Terneuzen',  patroon:/\bterneuzen\b/i },
  { naam:'Hoge Waard', patroon:/\bh(?:oge)?\s*waard\b/i },
  { naam:'HBTR',        patroon:/\bhbtr\b/i },
  { naam:'Hartelhaven', patroon:/\bhartel\s*haven\b/i }
];

function plekBuitenDeHaven(v){
  const tekst = [v && v.bestemming, v && v.locatie, v && v.opmerking]
    .filter(Boolean).join(' ');
  if(!tekst.trim()) return null;
  const gevonden = PLEKKEN_BUITEN_DE_HAVEN.find(p => p.patroon.test(tekst));
  return gevonden ? gevonden.naam : null;
}

/* Waar de bak NU ligt, niet waar hij laadt. Een bak met een aankomsttijd komt
   eerst hier binnen (lege plaats, haven of palen) en gaat pas daarna naar
   EMO/HBTR/… — dus Onderweg, niet Elders, tot hij hier vertrokken is (1.334,
   HGK 16: "KOLEN ex HBTR", komt met de Daan). plekBuitenDeHaven() blijft
   zeggen wáár hij laadt (EECV-controle). */
function plekNuBuitenDeHaven(v){
  const plek = plekBuitenDeHaven(v);
  if(!plek) return null;
  const komtNogHier = v.tijd && String(v.tijd).trim() && !havenIsVertrokken(v.naam);
  return komtNogHier ? null : plek;
}

/* De tegenhanger van havenWachtrij(): precies de bakken die dáár wegvallen
   omdat ze ergens anders laden (Gent/EBS/EMO/HBTR/Hoge Waard). Zelfde vorm als een
   Onderweg-set, zodat havenTekenWachtrij en havenBakBlokjes er niets nieuws
   voor hoeven te leren. Gegroepeerd per laadplaats + aankomstschip + tijd: twee
   bakken met dezelfde boot waarvan de een naar Gent en de ander naar EMO gaat
   zijn twee mededelingen, geen tegel met twee bestemmingen. (1.210) */
function havenElders(){
  const binnen = new Set(havenBakken().map(b => b.sleutel));
  const gezien = new Set();
  const sets = new Map();

  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.filter(v => v.naam).forEach(v => {
      const plek = plekNuBuitenDeHaven(v);
      if(!plek) return;                               // die staan in Onderweg
      const sleutel = normalizeBargeName(v.naam);
      if(binnen.has(sleutel)) return;                 // ligt tóch hier
      if(gezien.has(sleutel)) return;
      gezien.add(sleutel);

      const key = plek + '|' + havenTegelSleutel(v.schip, v.tijd);
      const setKleur = vhGroupColorMap.get(bakGroupKey(v, bron)) || v.kleur || '#8D98A5';
      const bakKleur = v.kleur ? setKleur : '#8D98A5';   // geen kleurcel = NNB, nog geen vertrekset
      if(!sets.has(key)){
        sets.set(key, { key, bron, plek, kleur: setKleur,
                        schip: v.schip || '?', tijd: v.tijd || null, bakken: [] });
      }
      sets.get(key).bakken.push({ naam: v.naam, sleutel, positie: v.positie || null,
                                  tripId: null, kleur: bakKleur });
    });
  });

  /* Op plaats, dan op tijd: je leest deze lijst per bestemming ("wat ligt er
     bij EMO"), niet als één aflopende klok zoals Onderweg. */
  const nu = Date.now();
  return [...sets.values()]
    .map(s => ({ ...s, tijdMs: s.tijd ? parseVhTijd(s.tijd, nu) : null }))
    .sort((a, b) => a.plek.localeCompare(b.plek)
                 || (a.tijdMs ?? Infinity) - (b.tijdMs ?? Infinity)
                 || String(a.schip).localeCompare(String(b.schip)));
}

function havenWachtrij(){
  // "Ligt al in de haven" volgt havenBakken(): die past de aanwezig-vlag
  // toe én neemt bakken zonder EECV-tegel mee. Zet je een tegel weer op
  // niet-aanwezig, dan komt zijn set hier vanzelf weer bij te staan — met
  // behoud van de ligplaats, zodat hij bij terugzetten weer op zijn plek komt.
  const binnen = new Set(havenBakken().map(b => b.sleutel));
  // Een bak kan in meerdere blokken van de lijst voorkomen. Hij hoort bij
  // precies één set, anders zou dezelfde bak op twee plekken opduiken en
  // zou een set nooit compleet naar binnen kunnen.
  const gezien = new Set();
  const sets = new Map();

  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.filter(v => v.naam).forEach(v => {
      const sleutel = normalizeBargeName(v.naam);
      if(binnen.has(sleutel)) return;                 // ligt al in de haven
      if(gezien.has(sleutel)) return;                 // hoort al bij een set
      if(plekNuBuitenDeHaven(v)) return;              // ligt nu ergens anders
      gezien.add(sleutel);
      // Groepeer per aankomstschip + aankomsttijd (niet per kleur)
      const key = havenTegelSleutel(v.schip, v.tijd);
      // Dezelfde kleur als in de haven en de planlijst: die van de vertrekset
      // uit de sheet. Hier stond de ruwe celkleur en daar de eigen kleur van
      // de app, en dan veranderde een bak van kleur zodra hij binnenkwam.
      const setKleur = vhGroupColorMap.get(bakGroupKey(v, bron)) || v.kleur || '#8D98A5';
      if(!sets.has(key)){
        sets.set(key, {
          key, bron,
          kleur: setKleur,
          schip: v.schip || '?',
          tijd: v.tijd || null,
          bakken: []
        });
      }
      const s = sets.get(key);
      if(!s.kleur && setKleur) s.kleur = setKleur;
      // welke actieve rit hoort bij deze bak? die moeten we op aanwezig
      // kunnen zetten zodra de set binnenkomt
      let tripId = null;
      for(const t of trips){
        if(t.status !== 'actief') continue;
        if(t.rows.some(r => r.leichter && bargeNamesMatch(r.leichter, v.naam))){ tripId = t.id; break; }
      }
      s.bakken.push({ naam: v.naam, sleutel, positie: v.positie || null, tripId, kleur: setKleur });
    });
  });

  const nu = Date.now();
  return [...sets.values()]
    .map(s => ({ ...s, tijdMs: s.tijd ? parseVhTijd(s.tijd, nu) : null,
                 koppelbaar: s.bakken.some(b => b.tripId) }))
    .sort((a,b) => {
      if(a.tijdMs != null && b.tijdMs != null) return a.tijdMs - b.tijdMs;
      if(a.tijdMs != null) return -1;
      if(b.tijdMs != null) return 1;
      return String(a.schip).localeCompare(String(b.schip));
    });
}

/* Een set die links in de kolom staat, of hij nu in Onderweg of in Elders
   staat. Allebei zijn ze naar de haven te slepen; de sleutels botsen niet
   (een elders-sleutel is met zijn laadplaats geprefixt). */
function havenKolomSet(key){
  return havenWachtrij().find(s => s.key === key)
      || havenElders().find(s => s.key === key)
      || null;
}

// Zet een wachtende set in de haven: de bijbehorende tegels op aanwezig, en
// de bakken op de gekozen plek — een laadlengte of een van de bakkenplaatsen.
async function havenLaatSetBinnen(setKey, zoneId, slot){
  const set = havenKolomSet(setKey);
  if(!set) return false;

  const zone = havenZone(zoneId);
  if(!zone) return false;

  // Eerst neerleggen: lukt dat niet, dan verandert er niets en blijft de
  // set gewoon in de wachtrij staan.
  const namen = set.bakken.map(b => b.naam);
  const melding = `Haven: set "${set.schip}" aangekomen op ${havenZoneNaam(zoneId)}` +
                  ` (${namen.join(', ')})`;
  if(!await havenVerplaatsBakken(namen, zoneId, slot, false, melding)) return false;

  // Pas nu de tegels die aan deze set hangen op aanwezig zetten. Bakken
  // zonder tegel horen er net zo goed bij; die herkennen we aan hun
  // vastgelegde ligplaats.
  const geraakt = [...new Set(set.bakken.map(b => b.tripId).filter(Boolean))];
  geraakt.forEach(id => {
    const t = trips.find(x => x.id === id);
    if(t) t.aangemeerd = true;
  });

  await saveTrips();
  return true;
}

/* Elke bak even groot, op elke zijde dezelfde marge.

   Dit gaf eerder 0 marge aan een zijde waar een buur uit dezelfde set tegenaan
   lag en 2 aan de andere zijden. Bedoeling was dat een set als één blok zou
   ogen, maar het gevolg was dat de bakken verschillende maten kregen: eentje
   midden in een set werd het grootst, aan de rand kleiner, en een losse bak
   het kleinst. Hun randen lagen daardoor niet in lijn, en juist dat suggereerde
   verbanden die er niet waren — bakken die samen één blok leken maar uit
   verschillende sets kwamen.

   Bij welke set een bak hoort blijkt al uit zijn kleur; dat hoeft de maatvoering
   er niet nog eens bij te vertellen. Nu is elke bak identiek en ligt alles op
   hetzelfde raster. */
function havenBakInsets(){
  const RUIMTE = 1.5;
  return { links: RUIMTE, rechts: RUIMTE, boven: RUIMTE, onder: RUIMTE };
}

// --- Tekenen --------------------------------------------------------
// x is in meters op schaal; y wordt uitvergroot met HAVEN_DIEPTEFACTOR.
const hx = m => m;
const hy = m => mDiep(m);

let havenSelectie = new Set();      // genormaliseerde baknamen
let havenMelding = null;            // uitleg als een verplaatsing niet doorging
/* De overloopbalk wordt bij élke hertekening opnieuw opgebouwd, ook als er niets
   aan veranderd is. Ging hij dan telkens naar de voorleesregel, dan ratelt de
   schermlezer bij iedere verplaatsing elders in de haven en bij iedere sync.
   Daarom onthouden we wat er als laatste over de overloop is gezegd, en zwijgen
   we zolang dat hetzelfde blijft. */
let havenLaatsteOverloop = '';

/* ── Haven op telefoonbreedte ─────────────────────────────────────────
   Vanaf 760px (dezelfde grens als de planlijst, regel ~901) past de hele
   haven — 766,75 eenheden breed, kades tot 6 bakken diep sinds v1.155 —
   niet meer leesbaar in één scherm: een bak wordt dan een streepje van
   nog geen 35px. In plaats van alles verkleind te tonen (dat lost niets
   op) krijgt de haven op een telefoon een tabbalk: één zone tegelijk,
   uitvergroot tot een eigen viewBox, plus een alleen-lezen Overzicht.
   Vanaf 761px verandert er niets — dezelfde svg, dezelfde
   canvas-naast-Onderweg-indeling als altijd.

   Een telefoon plat gehouden (landscape) is smal genoeg in hoogte om ook
   als "telefoon" te tellen, óók als de breedte daarbij boven de 760px
   komt (bijv. 812px breed bij 375px hoog) — anders viel hij terug op de
   volledige desktop-tekening, die voor die hoogte niet is gebouwd. Er is
   bewust geen ScreenOrientation.lock() geprobeerd om de telefoon in
   landscape te dwingen: Safari op de iPhone ondersteunt lock() niet, ook
   niet in fullscreen — en fullscreen zelf kan daar al niet. De haven
   past zich dus aan wat de telefoon al doet, in plaats van het apparaat
   te willen sturen; zie havenIsTelefoonLandscape(). */
function havenIsTelefoon(){
  return window.matchMedia('(max-width:760px)').matches || havenIsTelefoonLandscape();
}
function havenIsTelefoonLandscape(){
  return window.matchMedia('(orientation:landscape) and (max-height:500px)').matches;
}

/* De rij met kolommen loopt tot de onderrand van het scherm. Waar hij begint
   hangt af van de topbalk, en die loopt op een smallere tablet over twee
   regels — een vaste aftrek in de CSS klopt dan niet. Dus meten, en bij een
   ander formaat (draaien) opnieuw; de svg schaalt daarna zelf mee. */
let havenRijHoogteGekoppeld = false;
function havenZetRijHoogte(){
  const rij = document.querySelector('.haven-wrap:not(.haven-mobiel) .haven-kolommen');
  if(rij) rij.style.setProperty('--haven-rij-boven', Math.round(rij.getBoundingClientRect().top + scrollY) + 'px');
  if(!havenRijHoogteGekoppeld){
    havenRijHoogteGekoppeld = true;
    window.addEventListener('resize', havenZetRijHoogte);
  }
}

let havenMobielTab = 'overzicht';   // welk tabblad actief is op telefoonbreedte
/* renderHavenTab() bouwt de tabbalk bij ELKE hertekening helemaal opnieuw op
   (main.innerHTML = '' staat al vóór de tab-dispatch in render()) — een
   losgescrolde balk (om bijv. "Onderweg" te bereiken) zou daardoor bij elke
   volgende hertekening terugspringen naar links, ook als die hertekening
   niets met de haven te maken had. Deze waarde volgt de balk live (scroll-
   listener hieronder) en wordt na elke opbouw teruggezet. */
let havenMobielTabsScrollLeft = 0;
const HAVEN_ZONE_TAB_IDS = ['b2b3-kade', 'b4-kade'];
const HAVEN_MOBIEL_TABS = [
  { id:'overzicht', label:'Overzicht' },
  { id:'b2b3-kade', label:'B2/B3' },
  { id:'b4-kade',   label:'B4' },
  { id:'palen',     label:'Palen' },
  { id:'onderweg',  label:'Onderweg' },
  { id:'leeg',      label:'Lege plaats' },
  { id:'vol',       label:'Volle plaats' }
];

function havenMobielTabsHtml(){
  return `<div class="haven-mobieltabs" role="tablist" aria-label="Havenonderdeel">${
    HAVEN_MOBIEL_TABS.map(t => `<button type="button"
        class="haven-mobieltab${t.id === havenMobielTab ? ' actief' : ''}"
        data-mobieltab="${t.id}" role="tab" aria-selected="${t.id === havenMobielTab}">
        ${esc(t.label)}</button>`).join('')
  }</div>`;
}

/* Alleen het tabblad zelf onthouden; of het bakkenplaats-paneel mee open
   moet staan bepaalt renderHavenTab() straks aan het eind, op basis van
   telefoon + havenMobielTab (zie daar) — één plek die dat beslist, in
   plaats van hier alvast en dan aan het eind van renderHavenTab nog eens. */
function havenKiesMobielTab(id){
  havenMobielTab = id;
  render();
}

function renderHavenTab(main){
  const L = HAVEN_LAYOUT;
  havenVerankerPosities();          // nieuwe plekken meteen vastzetten
  const bakken = havenBakkenMetPlek();
  const wachtrij = havenWachtrij();

  const telefoon = havenIsTelefoon();
  // Plat gehouden: veel meer breedte beschikbaar dan rechtop, maar weinig
  // hoogte. De tabbalk verhuist dan naar een kolom links (CSS hieronder) en
  // de svg hoeft niet meer kunstmatig vergroot te worden — passend-op-de-
  // beschikbare-ruimte geeft in landscape al een bruikbare rijhoogte, zie
  // svgPixelStijl verderop.
  const landscape = telefoon && havenIsTelefoonLandscape();
  if(telefoon && !HAVEN_MOBIEL_TABS.some(t => t.id === havenMobielTab)) havenMobielTab = 'overzicht';
  // Alleen op de drie zone-tabjes toont de svg één zone i.p.v. de hele haven
  // — dát lost het probleem op (te weinig ruimte om iets aan te tikken), niet
  // alles verkleind tonen. Overzicht toont, net als op een groot scherm,
  // alles, maar dan zonder tabindex/role en met pointer-events uit: er valt
  // op dat tabje bewust niets te bedienen.
  const mobielZone = telefoon && HAVEN_ZONE_TAB_IDS.includes(havenMobielTab) ? havenZone(havenMobielTab) : null;
  const alleenLezen = telefoon && havenMobielTab === 'overzicht';
  // Het bakkenplaats-paneel (#havenPlaatsPaneel) zit ín #havenCanvas, samen
  // met de svg — bij 'leeg'/'vol' moet de svg weg maar het paneel juist
  // blijven staan (dat IS dan de inhoud van het tabblad), dus alleen de svg
  // zelf verbergen, niet de hele canvas. Bij 'onderweg' mag de hele canvas
  // dicht, want daar staat toch niets van te tonen.
  const svgVerbergen = telefoon && ['onderweg', 'leeg', 'vol', 'palen'].includes(havenMobielTab);
  const canvasVerbergen = telefoon && havenMobielTab === 'onderweg';
  const wachtrijTonen = !telefoon || havenMobielTab === 'onderweg';
  // Rond een uitgelichte zone, zodat de rand niet tegen de schermrand plakt.
  const marge = 10;
  const viewBoxX = mobielZone ? hx(mobielZone.x) - marge : 0;
  const viewBoxY = mobielZone ? hy(mobielZone.y) - marge : 0;
  const viewBoxW = mobielZone ? hx(mobielZone.w) + marge * 2 : L.breedte;
  const viewBoxH = mobielZone ? hy(mobielZone.h) + marge * 2 : L.hoogte;
  /* Een kade is van zichzelf lang en smal (de B2/B3-zone is ruim 6x zo
     breed als diep) — "passend maken op de schermbreedte" (preserveAspect-
     Ratio, hierboven al voor Overzicht) duwt zo'n zone dan ook terug tot een
     reepje van maar een paar pixels hoog, en dan is er alweer niets aan te
     tikken. Op een zone-tabje krijgt de svg daarom nooit gewoon "meet".

     Rechtop krijgt hij een eigen, vaste pixelmaat: groot genoeg om een rij
     bruikbaar te maken, en het canvas (CSS overflow-x:auto) scrolt zijwaarts
     naar de rest. Een vaste maat is daar de juiste keus omdat de beschikbare
     hoogte zelf ook vast/beperkt is (calc(100vh - 260px) op het canvas).

     Plat gehouden ligt dat anders: een echt toestel bleek daar vaak veel
     méér hoogte te geven dan 1,2 px/eenheid gebruikt — Herman zag een
     tekening die maar een deel van het scherm vulde. Daar dus geen vaste
     maat maar hoogte:100% van het canvas (dat in landscape zelf al de volle
     rijhoogte krijgt, zie .haven-mobiel-landscape hieronder) plus
     aspect-ratio, zodat de breedte daar automatisch uit volgt — de svg wordt
     zo altijd zo groot als de hoogte toelaat. Is de resulterende breedte
     groter dan het canvas (bij B2/B3 met 19 kolommen bijna altijd), dan
     scrolt hetzelfde overflow-x:auto zijwaarts als rechtop al deed. */
  const HAVEN_MOBIEL_SCHAAL = 1.2;   // px per svg-eenheid op een zone-tabje, alleen rechtop
  const svgPixelStijl = mobielZone
    ? (landscape
        ? `height:100%; width:auto; max-width:none; aspect-ratio:${viewBoxW} / ${viewBoxH};`
        : `width:${Math.round(viewBoxW * HAVEN_MOBIEL_SCHAAL)}px; height:${Math.round(viewBoxH * HAVEN_MOBIEL_SCHAAL)}px; max-width:none;`)
    : '';
  // Niet het hidden-attribuut: browsers passen [hidden]{display:none} niet
  // betrouwbaar toe op <svg> (het is een HTML-regel, svg heeft zijn eigen
  // standaard-stijlblad) — bleek hier ook zo: de svg bleef gewoon
  // meetellen in de layout en duwde het paneel eronder weg. display:none
  // rechtstreeks in de stijl werkt wel overal hetzelfde.
  const svgStijl = svgPixelStijl + (svgVerbergen ? ' display:none;' : '');

  /* Idee 10, sinds 1.368 als vaste indeling: Leeg links, Vol rechts, en
     Onderweg + Palen als strook onder de tekening. Elk is dicht te schuiven tot
     een rail met naam en teller (niet op telefoon: daar zijn het tabbladen). */
  const ingeklapt = telefoon ? {} : havenIngeklapt();
  const dichtKlasse = kant => ingeklapt[kant] ? ' dicht' : '';
  const lip = (kant) => {
    if(telefoon) return '';
    const dicht = !!ingeklapt[kant];
    const alle = havenBakken();
    const tel = z => alle.filter(b => b.zone === z).length;
    const naam = { leeg:'Lege bakken', vol:'Volle bakken', onder:'Onderweg en palen' }[kant];
    const tekst = kant === 'onder'
      ? `Onderweg ${wachtrij.length} · Palen ${tel('palen')}/4`
      : `${naam} · ${tel(kant)}`;
    const pijl = kant === 'onder' ? (dicht ? '▴' : '▾') : ((kant === 'leeg') === dicht ? '›' : '‹');
    return `<button type="button" class="haven-lip haven-lip-${kant}${dicht ? ' dicht' : ''}" data-lip="${kant}"
              aria-expanded="${!dicht}" aria-label="${tekst}: ${dicht ? 'openen' : 'dichtschuiven'}"
              title="${naam}: ${dicht ? 'openen' : 'dichtschuiven'}"><span class="lip-pijl" aria-hidden="true">${pijl}</span><span
              class="lip-tekst" aria-hidden="true">${tekst}</span></button>`;
  };

  const wrap = document.createElement('div');
  wrap.className = 'haven-wrap' + (telefoon ? ' haven-mobiel' : '') + (landscape ? ' haven-mobiel-landscape' : '');
  wrap.innerHTML = `
    ${telefoon ? havenMobielTabsHtml() : ''}
    <div class="haven-kolommen">
      <!-- Links op het scherm, vóór de tekening — een vaste, altijd
           zichtbare kolom voor de lege bakkenplaats, net als Onderweg rechts
           van de tekening. Op telefoon blijft dit verborgen: daar bestaat
           'leeg' al als eigen mobiel tabblad (havenMobielTab), dat via het
           in/uitschuivende paneel (#havenPlaatsPaneel) tekent. -->
      <div class="haven-zijkolom${dichtKlasse('leeg')}" data-paneel="leeg">
        ${lip('leeg')}
        <aside class="haven-lege-kolom" id="havenLegeKolom"${telefoon ? ' hidden' : ''}></aside>
      </div>
      <div class="haven-midden">
      <div class="haven-canvas${mobielZone ? ' haven-canvas-svg haven-canvas-zone' : alleenLezen ? ' haven-canvas-svg' : ''}" id="havenCanvas"${canvasVerbergen ? ' hidden' : ''}>
        <!-- Deze tekening is niet alleen plaatje: je klikt en sleept er bakken in.
             role="img" zou de inhoud tot één plaatje platslaan en daarmee de titels
             van de losse bakken wegnemen — juist daar staan nummer, vertrekboot en
             materiaal. Vandaar een groep met een naam en een beschrijving: de naam
             zegt waar je bent, de beschrijving wat er te zien is, en de inhoud blijft
             bereikbaar. De naam staat in aria-label en niet in een <title>, want een
             <title> op de svg zelf laat bij elke zweefbeweging boven het water een
             tooltip opkomen; de tooltip van de bak moet de enige in de tekening zijn.
             Op Overzicht (alleenLezen) is dat allemaal niet van toepassing — daar
             valt niets te bedienen, dus komt er ook geen bedienings-uitleg. -->
        <svg viewBox="${viewBoxX} ${viewBoxY} ${viewBoxW} ${viewBoxH}" id="havenSvg"
             preserveAspectRatio="xMidYMid meet" style="${svgStijl}"
             class="${alleenLezen ? 'haven-alleen-lezen' : ''}"
             ${alleenLezen
               ? 'aria-hidden="true"'
               : 'role="group" aria-label="Haventekening Dintelhaven" aria-describedby="havenSvgUitleg"'}>
          ${alleenLezen ? '' : `<desc id="havenSvgUitleg">Bovenaanzicht van de haven; links is west, rechts
            is oost. Bovenlangs kade B2/B3 met vier laadlengtes — B2 laadt de 1e en de
            2e, B3 de 3e en de 4e — en onderlangs kade B4 met twee laadlengtes. De
            duwbakkenpalen (Palen) staan in een eigen kolom naast Onderweg. De bakken die er liggen staan als
            genummerde vakken op hun plek, elk met zijn vertrekboot en materiaal. De
            lege en de volle bakkenplaats worden hier niet getekend; die openen via de
            knoppen langs de rand. Sets die nog moeten aankomen staan in de lijst
            Onderweg naast de tekening. Bakken verplaatsen gaat met slepen, en vraagt
            dus een muis of een aanraakscherm.</desc>`}
        </svg>
        <div class="haven-plaatstabs" id="havenPlaatsTabs"${telefoon ? ' hidden' : ''}></div>
        <div class="haven-plaatspaneel" id="havenPlaatsPaneel" hidden></div>
      </div>
      <!-- Onder de tekening: Onderweg met rechts de duwbakkenpalen (4 bakken). -->
      <div class="haven-onder${dichtKlasse('onder')}" data-paneel="onder">
        ${lip('onder')}
        <div class="haven-rechterkolom">
          <aside class="haven-lege-kolom haven-palen-kolom" id="havenPalenKolom"${telefoon ? ' hidden' : ''}></aside>
          <aside class="haven-wachtrij" id="havenWachtrij"${wachtrijTonen ? '' : ' hidden'}></aside>
          <!-- Elders als eigen, scrollende kolom tussen Onderweg en Palen (1.370).
               Op telefoon niet: daar staat Elders onder Onderweg in hetzelfde tabblad. -->
          ${telefoon ? '' : '<aside class="haven-elders" id="havenElders"></aside>'}
        </div>
      </div>
      </div>
      <!-- Rechts: de volle bakkenplaats als vaste kolom. Op telefoon verborgen:
           daar loopt 'vol' via het mobiele tabblad + #havenPlaatsPaneel. -->
      <div class="haven-zijkolom haven-zij-vol${dichtKlasse('vol')}" data-paneel="vol">
        ${lip('vol')}
        <section class="haven-vol-vlak" id="havenVolVlak"${telefoon ? ' hidden' : ''}></section>
      </div>
    </div>`;
  main.appendChild(wrap);
  wrap.querySelectorAll('[data-lip]').forEach(knop => knop.addEventListener('click', () => {
    havenZetIngeklapt(knop.dataset.lip, !knop.classList.contains('dicht'));
    render();
  }));
  havenZetRijHoogte();

  if(telefoon){
    wrap.querySelectorAll('.haven-mobieltab').forEach(knop => {
      knop.addEventListener('click', () => havenKiesMobielTab(knop.dataset.mobieltab));
    });
    const tabbalk = wrap.querySelector('.haven-mobieltabs');
    if(tabbalk){
      tabbalk.scrollLeft = havenMobielTabsScrollLeft;
      tabbalk.addEventListener('scroll', () => { havenMobielTabsScrollLeft = tabbalk.scrollLeft; });
    }
  }

  const svg = wrap.querySelector('#havenSvg');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (naam, attrs) => {
    const e = document.createElementNS(NS, naam);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };

  svg.appendChild(el('rect', { x:0, y:0, width:L.breedte, height:L.hoogte, class:'haven-water' }));

  // alleen de kadelijnen; bereik en lengtematen laten we weg voor de rust
  L.kades.forEach(kade => {
    const rand = kade.kant === 'boven'
      ? hy(kade.yM) - 5
      : hy(kade.yM + LIGDIEPTE_M) + 5;
    svg.appendChild(el('line', {
      x1:hx(kade.vanM), y1:rand, x2:hx(kade.totM), y2:rand, class:'haven-kadelijn'
    }));
  });

  // zones met hun bakplekken — op een zone-tabje alleen die ene zone
  L.zones.filter(z => !z.virtueel && (!mobielZone || z.id === mobielZone.id)).forEach(z => {
    /* Toetsenbordbediening: een zone is een bestemming. Staat er iets gekozen
       — een bak in deze tekening, of een set in Onderweg of het paneel — dan
       zet Enter/spatie het daar neer, via dezelfde havenZetGekozenSets() die
       de tik op een plaatstab-knop al gebruikt (zie havenKoppelSlepen). Staat
       er niets klaar, dan doet die functie zelf niets. Op Overzicht (alleenLezen)
       is een zone geen bestemming — daar valt niets aan te wijzen. */
    const g = el('g', {
      class:'haven-zone', 'data-zone': z.id,
      ...(alleenLezen ? {} : { tabindex:'0', role:'button', 'aria-label': `Naar ${havenZoneNaam(z.id)}` })
    });
    g.appendChild(el('rect', {
      x:hx(z.x), y:hy(z.y), width:hx(z.w), height:hy(z.h), rx:2,
      class:`haven-zone-vlak ${z.type}`
    }));

    // naam van een bakkenplaats in het vak zelf, ver weggezakt zodat de
    // bakken die erop komen te liggen goed leesbaar blijven
    //
    // (Voor 'bakkenplaats' is deze tak sowieso dode code: die
    // zones zijn virtueel:true en worden hierboven, bij `L.zones.filter(z =>
    // !z.virtueel)`, al weggefilterd vóór dit punt — ze staan in een eigen
    // paneel. De voorwaarde blijft toch op 'bakkenplaats' staan, klaar voor
    // als dat ooit weer een getekende zone wordt.)
    if(z.type === 'bakkenplaats'){
      // in een lage zone moet de naam meekrimpen, anders steekt hij eruit
      const grootte = Math.min(15, hy(z.h) * 0.42, hx(z.w) / (z.label.length * 0.62));
      const naam = el('text', {
        x: hx(z.x + z.w/2), y: hy(z.y + z.h/2) + grootte*0.35,
        class:'haven-plaats-naam', 'font-size': grootte.toFixed(1)
      });
      naam.textContent = z.label;
      g.appendChild(naam);
    }

    // De bakplekken als fijn wit raster. Elke plek tekende eerst zijn eigen
    // rechthoek, waardoor op elke scheiding twee stippellijnen vlak naast
    // elkaar kwamen te liggen — dat oogde rommelig. Nu verzamelen we de randen
    // van alle plekken en tekenen we elke rand één keer: een gedeelde rand
    // komt twee keer voor en wordt dus één lijn.
    // De buitenrand van het raster valt samen met de omlijning van de zone
    // zelf (blauw bij een bakkenplaats, oranje bij een laadlengte). Die
    // tekenen we hier niet nog eens in het wit — anders staan er alsnog twee
    // stippellijnen naast elkaar.
    const zl = hx(z.x), zr = hx(z.x + z.w), zb = hy(z.y), zo = hy(z.y + z.h);
    const opRand = (x1,y1,x2,y2) => {
      const bijna = (a,b) => Math.abs(a-b) < 0.5;
      if(bijna(y1,y2)) return bijna(y1,zb) || bijna(y1,zo);   // horizontaal
      if(bijna(x1,x2)) return bijna(x1,zl) || bijna(x1,zr);   // verticaal
      return false;
    };

    const randen = new Map();
    havenZoneSlots(z).forEach(s => {
      const l = hx(s.x), r = hx(s.x + s.w), b = hy(s.y), o = hy(s.y + s.h);
      const k = (x1,y1,x2,y2) => `${x1.toFixed(2)},${y1.toFixed(2)},${x2.toFixed(2)},${y2.toFixed(2)}`;
      [[l,b,r,b], [l,o,r,o], [l,b,l,o], [r,b,r,o]].forEach(([x1,y1,x2,y2]) => {
        if(opRand(x1,y1,x2,y2)) return;
        randen.set(k(x1,y1,x2,y2), { x1, y1, x2, y2 });
      });
    });
    // Het witte stippelraster tussen de bakplekken is er in v1.111 uit:
    // het waren hulplijnen die alleen lieten zien waar een bak zóu kunnen
    // liggen, en met veertig bakken in beeld werd dat een waas. De randen
    // van de zones en de bakken zelf zeggen nu genoeg. De berekening
    // hierboven blijft staan: havenZoneSlots() is ook de indeling waarop
    // geplaatst en gesleept wordt.

    // laadlengtes: naam boven de bovenste kade, onder de onderste
    if(z.type === 'kade'){
      const boven = z.kade === 'b2b3';

      /* Elke laadlengte krijgt zijn eigen omlijning, met een halve baklengte
         ertussen. Eerder was het één doorlopende strook met streepjes erin,
         maar dan zie je niet waar de ene lengte ophoudt en de volgende begint.

         Dat ze los getekend worden betekent niet dat ze iets begrenzen: een
         set van zes loopt er gewoon overheen, want de plekken lopen door.
         Het gat is ruimte op de kade, geen muur.

         De naam van de binnenbelader staat erbij — B2 bij de 1e en 2e, B3 bij
         de 3e en 4e — in plaats van de losse bereikbalken die er eerst boven
         hingen. Dat is dezelfde informatie op de plek waar je hem nodig hebt. */
      (z.lengtes || []).forEach(l => {
        const xVan = hx(havenKolomX(z, l.vanKolom));
        const xTot = hx(havenKolomX(z, l.vanKolom + l.kolommen - 1) + HALVE_BAK_M);
        /* Het vak zelf toont hooguit LAADLENGTE_VAK_RIJEN rijen (twee breed ×
           twee diep is vier bakken) — niet de volle kadediepte (tot 6 rijen).
           Meer bakken neerleggen kan nog steeds, ze steken dan zichtbaar
           onder het vak uit in plaats van dat het vak meegroeit tot een vlak
           dat oogt als plek voor twaalf.

           Bij B2/B3 hoort de kadelijn (en het label) bovenaan, dus sluit het
           vak boven aan (y = z.y, groeit naar beneden). Bij B4 hoort de
           kadelijn onderaan — daar moet het vak juist ónderaan aansluiten
           (groeit naar boven), anders blijft er een leeg stuk kade tussen het
           vak en de witte lijn hangen. */
        const vakHoogte = BAK_BREEDTE_M * LAADLENGTE_VAK_RIJEN;
        g.appendChild(el('rect', {
          x: xVan, y: boven ? hy(z.y) : hy(z.y + z.h) - hy(vakHoogte),
          width: xTot - xVan, height: hy(vakHoogte), rx: 2,
          class: 'haven-lengte-vak'
        }));
        const t = el('text', {
          x: (xVan + xTot) / 2,
          // Eén regel verder van de kadelijn dan tot 1.369 (was -9/+16): de
          // boottabjes van de bakken hangen tegen de lijn en dekten het label af.
          y: boven ? hy(z.y) - 22 : hy(z.y + z.h) + 29,
          class:'haven-zone-label'
        });
        t.textContent = `${l.station ? l.station + (l.reserve ? '/' + l.reserve : '') + ' ' : ''}${l.nummer}e`;
        g.appendChild(t);
      });

      /* Let op bij latere logica: op het scherm is links wést en rechts óóst.
         "4e lengte west" is dus de meest westelijke bakpositie van de 4e —
         de eerste plek die je daar kunt innemen. Die termen worden op de
         werkvloer gebruikt; ze staan niet in beeld, maar wel in de code. */
    }

    svg.appendChild(g);
  });

  /* Eerst het vlak van elke tegel, dan pas de bakken: zo liggen de bakjes ín
     de tegel, net als in Onderweg en de lege kolom. De naam en de
     duwboot-tabjes komen ná de bakken (havenTekenTegelsInTekening), want die
     moeten bovenop liggen en aantikbaar blijven. */
  if(!alleenLezen) havenTekenTegelVlakken(svg, bakken, mobielZone);

  // bakken — alleen die in de haventekening liggen; wat op een bakkenplaats
  // ligt staat in het paneel van die plaats.
  bakken.forEach(b => {
    if(!b.plek) return;                       // past niet in de zone
    const zoneVanBak = havenZone(b.zone);
    if(zoneVanBak && zoneVanBak.virtueel) return;
    if(mobielZone && b.zone !== mobielZone.id) return;   // op een zone-tabje alleen díe bakken
    const p = b.plek;
    const in_ = havenBakInsets();
    // Toetsenbordbediening: Enter/spatie zet deze bak aan of uit in de
    // selectie, hetzelfde als een tik zonder te bewegen (havenKoppelSlepen).
    // aria-pressed volgt havenSelectie; havenSchakelBakSelectie houdt hem bij.
    // Op Overzicht (alleenLezen) is een bak niet aanwijsbaar — geen knop, dus
    // ook geen aria-pressed nodig.
    const gekozen = havenSelectie.has(b.sleutel);
    const g = el('g', {
      class: 'haven-bak' + (gekozen ? ' gekozen' : '')
                         + (b.zonderRit ? ' zonder-rit' : ''),
      'data-bak': b.sleutel,
      ...(alleenLezen ? {} : {
        tabindex:'0', role:'button', 'aria-pressed': String(gekozen),
        'aria-label': `${b.naam}, ${havenZoneNaam(b.zone)}`
      }),
      transform: `translate(${hx(p.x)},${hy(p.y)})`
    });
    const bx = in_.links, by = in_.boven;
    const bw = hx(p.w) - in_.links - in_.rechts;
    const bh = hy(p.h) - in_.boven - in_.onder;
    g.appendChild(el('rect', {
      x: bx, y: by, width: bw, height: bh,
      rx: 2.5,
      class:'haven-bak-vlak', stroke:safeColor(b.kleur)
    }));
    // Het nummer hoort in het midden van het getékende vak, niet in het midden
    // van de plek. Die twee zijn niet hetzelfde: de marges boven en onder
    // verschillen per bak (daarmee ontstaan de tussenruimtes), dus met
    // hy(p.h)/2 stond het nummer scheef. De vaste correctie van +2,9 die dat
    // moest opvangen is vervangen door dominant-baseline in de CSS, die het
    // echte midden van de letterhoogte pakt — ongeacht de lettergrootte.
    const midX = (in_.links + hx(p.w) - in_.rechts) / 2;
    const midY = (in_.boven + hy(p.h) - in_.onder) / 2;
    const metRepareren = b.status === 'repareren';
    // Tandwiel voor "moet repareren" (openBakStatusModal, src/06), zo groot
    // als het vakje toelaat, meteen achter de baknaam — niet een klein
    // hoekbadge zoals eerst: dat was op een uitgezoomde haven nauwelijks te
    // zien. De naam schuift een stukje naar links (text-anchor:end i.p.v.
    // midden) zodat ernaast nog ruimte overblijft voor het tandwiel, dat tot
    // de hoogte van de bak zelf mag groeien — straks is dit ook de plek waar
    // een API-koppeling laat zien wélke reparatie het is (nog niet gebouwd).
    const nr = el('text', {
      x: metRepareren ? midX - 1 : midX, y: midY,
      class: 'haven-bak-nr' + (metRepareren ? ' met-repareren' : '')
    });
    nr.textContent = b.naam;
    g.appendChild(nr);
    if(metRepareren){
      const icoonGrootte = Math.max(5, Math.min(bh * 0.85, bw * 0.4));
      const icoon = el('text', {
        x: midX + 1, y: midY, class: 'haven-bak-repareren-icoon',
        style: `font-size:${icoonGrootte.toFixed(1)}px`
      });
      icoon.textContent = '⚙';
      g.appendChild(icoon);
    }
    /* Idee 6: dagen binnen rechtsboven, "niet op lijst" (⊘) en vertrekboot
       met de hand (✎) linksboven. Klein, zodat het baknummer leesbaar blijft. */
    const merk = havenBakMerken(b);
    const merkGrootte = Math.max(4, Math.min(bh * 0.4, 7)).toFixed(1);
    if(merk.dagen){
      const d = el('text', { x: bx + bw - 1, y: by + 0.5, class: 'haven-bak-dagen ' + merk.dagenKlasse,
                             style: `font-size:${merkGrootte}px` });
      d.textContent = merk.dagen + 'd';
      g.appendChild(d);
    }
    if(merk.nietOpLijst || merk.hand){
      const m = el('text', { x: bx + 1, y: by + 0.5, class: 'haven-bak-merk', style: `font-size:${merkGrootte}px` });
      m.textContent = (merk.nietOpLijst ? '⊘' : '') + (merk.hand ? '✎' : '');
      g.appendChild(m);
    }
    const titel = document.createElementNS(NS, 'title');
    titel.textContent = `${b.naam} — ${b.vertrekboot}${b.materiaal ? ' · ' + b.materiaal : ''}` +
                        (merk.nietOpLijst ? ' · staat op geen enkele lijst meer'
                          : b.zonderRit ? ' · staat niet op de EECV-lijst' : '') +
                        (merk.hand ? ' · vertrekboot met de hand gezet' : '') +
                        (merk.dagen ? ` · ${merk.dagen} dag${merk.dagen === 1 ? '' : 'en'} binnen` : '') +
                        (b.status === 'repareren' ? ' · moet repareren' : '');
    g.appendChild(titel);
    svg.appendChild(g);
  });

  /* Tegels in de tekening zelf.

     De bakken liggen al als eenheid bij elkaar (zie havenBakkenMetPlek), maar
     je zag alleen losse bakjes — welke bij elkaar horen moest je uit de
     kleuren opmaken. Nu krijgt elke tegel één omlijning, met onderaan een
     tabje per duwboot die er een deel van komt halen. Tik zo'n tabje aan en
     alleen díe bakken staan gekozen; daarna wijs je een bestemming aan, net
     als bij een bak die je zelf aantikt.

     Wordt ná de bakken getekend: de omlijning heeft geen vulling en dekt dus
     niets af, en de tabjes moeten aantikbaar bovenop liggen — ook als de
     tegel eronder tegen ze aan ligt. */
  if(!alleenLezen) havenTekenTegelsInTekening(svg, bakken, mobielZone);

  /* Beide balken hieronder zijn rood en groot, maar puur visueel: wie de app
     laat voorlezen merkt er niets van. Bij een mislukte sleepbeweging naar een
     ander tabblad is die eerste balk zelfs het énige signaal — daar komt geen
     toast aan te pas. Dus gaan ze ook naar de meldregel. We verzamelen de tekst
     eerst en spreken hem in één keer uit: twee losse meld()-aanroepen
     overschrijven elkaar, dan hoor je alleen de laatste. */
  const teZeggen = [];

  if(havenMelding){
    const m = document.createElement('div');
    m.className = 'haven-overloop';
    m.textContent = havenMelding;
    wrap.insertBefore(m, wrap.querySelector('.haven-kolommen'));
    teZeggen.push(havenMelding);
    havenMelding = null;                       // eenmalig tonen
  }

  // Bakken die nergens meer passen mogen niet stilzwijgend verdwijnen.
  const overloop = bakken.filter(b => !b.plek);
  if(overloop.length){
    const waarschuwing = document.createElement('div');
    waarschuwing.className = 'haven-overloop';
    waarschuwing.innerHTML =
      `<strong>${overloop.length} bak${overloop.length===1?'':'ken'} passen nergens meer:</strong> ` +
      overloop.map(b => esc(b.naam)).join(' · ') +
      ` — de plekken in de haven zijn vol. Sleep bakken weg of vergroot een bakkenplaats.`;
    // .haven-canvas zit in .haven-kolommen, niet rechtstreeks in wrap — en
    // insertBefore eist een eigen kind. Dit gooide een fout op het moment dat
    // de waarschuwing juist nodig was.
    wrap.insertBefore(waarschuwing, wrap.firstChild);

    /* Voorgelezen tekst is geen HTML, dus apart opgebouwd: geen <strong>, en
       geen esc() — dat zou een bak met een & in de naam als "ampersand-a-m-p"
       laten uitspreken. De scheidingspuntjes worden komma's; die leest een
       schermlezer anders voor als "middelpunt". */
    const gezegd = `${overloop.length} bak${overloop.length===1?'':'ken'} passen nergens meer: ` +
                   overloop.map(b => b.naam).join(', ') +
                   '. De plekken in de haven zijn vol.';
    if(gezegd !== havenLaatsteOverloop){
      teZeggen.push(gezegd);
      havenLaatsteOverloop = gezegd;
    }
  } else {
    /* Opgelost. Niets zeggen — dat hoor je al aan de toast van de verplaatsing
       die het oploste — maar wel vergeten, zodat een volgende overloop weer
       wordt uitgesproken. */
    havenLaatsteOverloop = '';
  }

  /* Alleen schrijven als er echt iets te zeggen valt. Een lege meld() zou bij
     elke gewone hertekening de toasttekst wissen die er net in is gezet. */
  if(teZeggen.length) meld(teZeggen.join(' '));

  havenTekenWachtrij(wrap.querySelector('#havenWachtrij'), wachtrij, wrap.querySelector('#havenElders'));
  havenKoppelWachtrijSlepen(wrap, svg);
  havenKoppelWachtrijSlepen(wrap, svg, wrap.querySelector('#havenElders'));
  havenToonSelectie();
  havenTekenPlaatsTabs();
  // Altijd tekenen op een breed scherm (geen open/dicht-status zoals het
  // paneel) — op telefoon bestaat 'leeg' al als eigen mobiel tabblad, zie
  // verderop in deze functie.
  if(!telefoon) havenTekenLegeKolom();
  if(!telefoon) havenTekenPalenKolom();
  if(!telefoon) havenTekenVolVlak();
  havenToonGekozenSets();
  // Op telefoonbreedte bepaalt het tabblad of het paneel open moet: 'leeg'/
  // 'vol' zijn zélf een tabblad, dus dat paneel staat dan altijd open, en op
  // elk ander tabblad juist dicht (ook als havenOpenPlaats nog een oude
  // stand vasthoudt van vóór de tabwissel). Op een groot scherm ongewijzigd:
  // havenOpenPlaats is daar de enige waarheid, gezet door de plaatstab-knoppen.
  if(telefoon && ['leeg', 'vol', 'palen'].includes(havenMobielTab)){
    havenZetPlaatsPaneel(havenMobielTab);
  } else if(havenOpenPlaats){
    havenZetPlaatsPaneel(telefoon ? null : havenOpenPlaats);
  }
  havenKoppelScrollbalk(wrap.querySelector('#havenWachtrij'));
  havenKoppelPaneelSlepen(wrap.querySelector('#havenPlaatsPaneel'), svg, havenOpenPlaats);
  if(!telefoon) havenKoppelPaneelSlepen(wrap.querySelector('#havenLegeKolom'), svg, 'leeg');
  if(!telefoon) havenKoppelPaneelSlepen(wrap.querySelector('#havenPalenKolom'), svg, 'palen');
  if(!telefoon) havenKoppelPaneelSlepen(wrap.querySelector('#havenVolVlak'), svg, 'vol');
  havenKoppelSlepen(svg);
}
// --- Onderweg: kolom naast de haven ---------------------------------
// Als HTML in plaats van in de tekening. Dat scheelt de haven honderden
// pixels hoogte, geeft de lijst een eigen scrollbalk, en zet de sets naast
// de plek waar ze heen moeten — schelen in sleepafstand.
/* eldersHost: de eigen Elders-kolom op een breed scherm; zonder (telefoon)
   komt Elders onder Onderweg in dezelfde kolom, zoals vóór 1.370. */
function havenTekenWachtrij(host, wachtrij, eldersHost){
  const blokjes = (set) => havenBakBlokjes(set.bakken, set.kleur);

  // tabindex/role/aria-pressed: Enter/spatie kiest deze set, hetzelfde als
  // een tik zonder te bewegen (zie de keydown hieronder in
  // havenKoppelWachtrijSlepen). De zichtbare tekst (schip, tijd) is al de
  // naam die een schermlezer nodig heeft; geen los aria-label nodig.
  /* De tegels staan in een lijst die op een breed scherm naast elkaar loopt en
     doorloopt op een volgende regel (CSS .haven-wachtrij-lijst); op telefoon
     blijven ze onder elkaar. */
  const onderwegHtml = wachtrij.length
    ? `<div class="haven-wachtrij-kop">Onderweg <span>${wachtrij.length}</span></div><div class="haven-wachtrij-lijst">` +
      wachtrij.map(set => `
        <div class="haven-wachtrij-set${set.koppelbaar ? '' : ' losgekoppeld'}" data-wachtset="${esc(set.key)}"
             tabindex="0" role="button" aria-pressed="${havenGekozenSets.has(set.key)}"${
             set.koppelbaar ? '' : ' title="Niet op de EECV-lijst"'}>
          <div class="haven-wachtrij-tijd">${esc(set.tijd || 'tijd onbekend')}${
            /* Alleen datum en tijd (idee 14); de rest staat in de info-balk tijdens het slepen. */
            set.koppelbaar ? '' : '<span class="bak-merk-uitleg">, niet op de EECV-lijst</span>'}</div>
          <div class="wachtrij-rij-schip">
            <div class="plaats-bakken">${blokjes(set)}</div>
            <div class="plaats-schip">
              <div class="haven-wachtrij-schip">${esc(verkortSchipnaam(set.schip))}</div>
            </div>
          </div>
        </div>`).join('') + '</div>'
    : `<div class="haven-wachtrij-kop">Onderweg</div>
       <p class="haven-wachtrij-leeg">Geen sets in de VH/HGK-lijst die nog moeten aankomen.</p>`;

  /* Elders, in dezelfde kolom eronder — "dan staan ze mooi bij elkaar". De
     laadplaats staat in elke tegel, want dat is het hele punt van dit blok.
     (1.210) Sinds Herman ze óók de haven in wil kunnen slepen (een bak die
     volgens de lijst naar Gent/EBS/EMO/de werf gaat maar in het echt toch hier
     komt te liggen) zijn ze net zo sleepbaar en aanwijsbaar als een
     Onderweg-set: data-wachtset + tabindex/role, dezelfde sleeplogica
     (havenKoppelWachtrijSlepen) en dezelfde sleutel-opzoeker
     (havenKolomSet). */
  const elders = havenElders();
  const eldersHtml = elders.length
    ? `<div class="haven-wachtrij-kop elders-kop">Elders <span>${
         elders.reduce((n, s) => n + s.bakken.length, 0)}</span></div><div class="haven-wachtrij-lijst">` +
      elders.map(set => `
        <div class="haven-wachtrij-set elders-set" data-wachtset="${esc(set.key)}"
             tabindex="0" role="button" aria-pressed="${havenGekozenSets.has(set.key)}">
          <div class="haven-wachtrij-tijd">
            <span class="elders-plek">${esc(set.plek)}</span>${
            set.tijd ? ' · ' + esc(set.tijd) : ''}</div>
          <div class="wachtrij-rij-schip">
            <div class="plaats-bakken">${blokjes(set)}</div>
            <div class="plaats-schip">
              <div class="haven-wachtrij-schip">${esc(verkortSchipnaam(set.schip))}</div>
            </div>
          </div>
        </div>`).join('') + '</div>'
    : '';

  if(eldersHost){
    host.innerHTML = onderwegHtml;
    eldersHost.innerHTML = eldersHtml;
    eldersHost.hidden = !elders.length;
  } else host.innerHTML = onderwegHtml + eldersHtml;
  host.querySelectorAll('.haven-wachtrij-lijst').forEach(lijst =>
    new ResizeObserver(() => havenMarkeerRijen(lijst)).observe(lijst));
}

/* Lopen de tegels door op een tweede (of derde) regel, dan krijgt elke tegel
   daar een lijntje erboven (CSS .na-eerste-rij), zodat je ziet waar een nieuwe
   regel begint. Welke tegel waar terechtkomt weet alleen de browser, dus na
   elke breedtewissel opnieuw kijken. */
function havenMarkeerRijen(lijst){
  const eerste = lijst.firstElementChild;
  if(!eerste) return;
  const boven = eerste.offsetTop;
  for(const tegel of lijst.children) tegel.classList.toggle('na-eerste-rij', tegel.offsetTop > boven + 2);
}

/* Eigen scrollbalk voor de Onderweg-kolom.

   De systeembalk verdwijnt op een tablet zodra je hem loslaat, en met een
   vinger is er dan niets om beet te pakken — je kunt alleen vegen, en met
   zestien sets erin is dat veel vegen. Deze balk staat er altijd, is breed
   genoeg voor een duim, en je kunt hem slepen.

   De balk wordt niet getekend als alles al past; een balk die niets doet is
   alleen maar verwarrend. */
function havenKoppelScrollbalk(kolom){
  if(!kolom) return;
  const oud = kolom.parentNode.querySelector('.haven-scrollbalk');
  if(oud) oud.remove();

  const balk = document.createElement('div');
  balk.className = 'haven-scrollbalk';
  balk.innerHTML = '<div class="haven-scrollduim"></div>';
  kolom.parentNode.appendChild(balk);
  const duim = balk.querySelector('.haven-scrollduim');

  const werkBij = () => {
    const zichtbaar = kolom.clientHeight;
    const totaal = kolom.scrollHeight;
    if(totaal <= zichtbaar + 2){ balk.style.display = 'none'; return; }
    balk.style.display = '';
    // Sinds de palen erboven staan begint de lijst niet meer bovenaan zijn
    // ouder: de balk loopt alleen langs de lijst zelf.
    balk.style.top = kolom.offsetTop + 'px';
    balk.style.height = zichtbaar + 'px';
    // En niet meer per se langs de rechterrand van zijn ouder: sinds 1.369
    // staan de palen rechts náást Onderweg. Dus langs de lijst zelf.
    balk.style.right = 'auto';
    balk.style.left = (kolom.offsetLeft + kolom.offsetWidth - balk.offsetWidth) + 'px';
    // Nooit kleiner dan 36 px, anders is hij niet te pakken met een vinger.
    const hoogte = Math.max(36, Math.round(zichtbaar / totaal * zichtbaar));
    const maxTop = zichtbaar - hoogte;
    const deel = kolom.scrollTop / (totaal - zichtbaar);
    duim.style.height = hoogte + 'px';
    duim.style.transform = `translateY(${Math.round(deel * maxTop)}px)`;
  };

  kolom.addEventListener('scroll', werkBij, { passive: true });
  new ResizeObserver(werkBij).observe(kolom);
  werkBij();

  let sleept = false, greepY = 0, startScroll = 0;
  const naarScroll = (y) => {
    const zichtbaar = kolom.clientHeight;
    const totaal = kolom.scrollHeight;
    const hoogte = duim.getBoundingClientRect().height;
    const maxTop = zichtbaar - hoogte;
    if(maxTop <= 0) return;
    const top = Math.min(maxTop, Math.max(0, y));
    kolom.scrollTop = (top / maxTop) * (totaal - zichtbaar);
  };

  duim.addEventListener('pointerdown', (e) => {
    sleept = true;
    greepY = e.clientY - duim.getBoundingClientRect().top;
    startScroll = kolom.scrollTop;
    duim.setPointerCapture(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  });
  duim.addEventListener('pointermove', (e) => {
    if(!sleept) return;
    naarScroll(e.clientY - balk.getBoundingClientRect().top - greepY);
    e.preventDefault();
  });
  const los = (e) => {
    if(!sleept) return;
    sleept = false;
    try{ duim.releasePointerCapture(e.pointerId); }catch(_){}
  };
  duim.addEventListener('pointerup', los);
  duim.addEventListener('pointercancel', los);

  // Tikken naast de duim springt daarheen, net als bij een gewone scrollbalk.
  balk.addEventListener('pointerdown', (e) => {
    if(e.target === duim) return;
    const y = e.clientY - balk.getBoundingClientRect().top;
    naarScroll(y - duim.getBoundingClientRect().height / 2);
  });
}

function havenToonSelectie(){
  if(typeof havenToonGekozenSets === 'function') havenToonGekozenSets();
  havenVerversGhostVoorSelectie();
  const el = document.getElementById('havenSelectieInfo');
  if(!el) return;
  const n = havenSelectie.size;
  el.textContent = n ? `${n} bak${n===1?'':'ken'} geselecteerd` : '';
}

/* Wat je hebt aangetikt bepaalt waar de schaduwen komen te liggen.

   Tik je losse bakken aan — twee naast elkaar, of een hele boot via zijn
   tabje — dan hoor je meteen te zien waar díe bakken passen, ook op de palen.
   Daarvoor hoeft er geen tegel vergroot te staan; dat was eerder wel zo,
   waardoor een selectie in de tekening zelf nergens een schaduw opleverde.

   Staat er een tegel vergroot, dan gaat die voor: dan zijn de schaduwen van
   die tegel (havenGezoomdeTegelNamen) wat je aanwijst. */
function havenVerversGhostVoorSelectie(){
  if(havenGezoomdeTegel) return;              // de vergrote tegel bepaalt het
  if(!havenSelectie.size){ havenVerbergAlleGloei(); return; }
  const namen = havenBakken().filter(b => havenSelectie.has(b.sleutel)).map(b => b.naam);
  havenToonAlleGloei(namen);
}

/* Eén bak (of een hele set) in of uit de selectie zetten. Gedeeld door de
   muis (een tik op de haventekening zonder te bewegen, in havenKoppelSlepen)
   en het toetsenbord (Enter/spatie op een bak) — vandaar hier apart, zodat er
   maar één plek is die "geselecteerd" bepaalt en bijhoudt.

   Bouwt de tekening NIET opnieuw op: dat is traag en zou de svg onder een
   volgende aanraking of toetsaanslag wegtrekken. Alleen de randen en
   aria-pressed van de bakken die er al staan worden bijgewerkt. */
function havenSchakelBakSelectie(svg, namen){
  const staatAan = namen.every(k => havenSelectie.has(k));
  namen.forEach(k => staatAan ? havenSelectie.delete(k) : havenSelectie.add(k));
  svg.querySelectorAll('.haven-bak').forEach(n => {
    const aan = havenSelectie.has(n.dataset.bak);
    n.classList.toggle('gekozen', aan);
    n.setAttribute('aria-pressed', String(aan));
  });
  havenToonSelectie();
}

// Slepen vanuit de wachtrij-kolom naar de haventekening. Die twee zijn nu
// aparte panelen, dus we volgen de vinger op documentniveau en rekenen bij
// het loslaten om naar de coördinaten van de tekening.
// kolom: Onderweg, of (sinds 1.370) de eigen Elders-kolom — zelfde tegels, zelfde slepen.
function havenKoppelWachtrijSlepen(wrap, svg, kolom = wrap.querySelector('#havenWachtrij')){
  if(!kolom) return;

  // Toetsenbordbediening: Enter/spatie kiest een set, hetzelfde als een tik
  // zonder te bewegen hieronder. De set wordt pas verplaatst zodra daarna een
  // bestemming gekozen wordt (een zone in de tekening of een plaatstab-knop —
  // beide al met het toetsenbord te bedienen, zie havenKoppelSlepen).
  kolom.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const kaart = e.target.closest('.haven-wachtrij-set[data-wachtset]');
    if(!kaart) return;
    e.preventDefault();
    havenKiesSet(kaart.dataset.wachtset);
  });

  kolom.addEventListener('pointerdown', (e) => {
    const kaart = e.target.closest('.haven-wachtrij-set');
    if(!kaart) return;
    if(e.button != null && e.button !== 0) return;   // alleen linkermuisknop

    // Zonder dit begint de browser bij het indrukken een tekstselectie, en
    // sleep je halve pagina blauw in plaats van de set. preventDefault op
    // pointermove is te laat: de selectie loopt dan al.
    e.preventDefault();

    const vak = kaart.getBoundingClientRect();
    const greep = { x: e.clientX - vak.left, y: e.clientY - vak.top };
    let bewogen = false;
    let zweef = null;

    const maakZweef = () => {
      zweef = kaart.cloneNode(true);
      zweef.classList.add('zweeft');
      zweef.style.width = vak.width + 'px';
      document.body.appendChild(zweef);
      kaart.classList.add('wordtGesleept');
    };
    const verplaats = (x, y) => {
      zweef.style.left = sleepLinksVan(x, vak.width) + 'px';
      zweef.style.top  = (y - greep.y + SLEEP_VERSCHUIVING.y) + 'px';
    };
    const zoekZone = (x, y) => {
      const pt = svg.createSVGPoint();
      pt.x = x; pt.y = y;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      return { zone: havenZoneOnderSvg(p.x, p.y), p };
    };
    const licht = (zone) => {
      svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
      /* niets te markeren: de ghost laat de plek zelf zien */
    };

    const beweeg = (ev) => {
      if(!bewogen){
        if(Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < havenTikDrempel(e)) return;
        bewogen = true;
        maakZweef();
      }
      verplaats(ev.clientX, ev.clientY);
      const tab = havenTabOnderAanwijzer(ev);
      document.querySelectorAll('.haven-plaatstab').forEach(k =>
        k.classList.toggle('doelwit', k.dataset.plaats === tab));
      if(tab && havenOpenPlaats !== tab) havenZetPlaatsPaneel(tab);
      // Elk mogelijk doel krijgt zijn eigen doelwit-markering, alleen als de
      // aanwijzer er echt boven zit — havenBovenPaneel alleen zegt "boven een
      // van de twee", niet welke, en zou hier het verkeerde element lichten.
      const paneel = document.getElementById('havenPlaatsPaneel');
      if(paneel) paneel.classList.toggle('doelwit', !paneel.hidden && havenBinnenElement(paneel, ev));
      document.querySelectorAll('#havenLegeKolom, #havenPalenKolom').forEach(k =>
        k.classList.toggle('doelwit', !k.hidden && havenBinnenElement(k, ev)));
      const zone = (tab || havenBovenPaneel(ev)) ? null : zoekZone(ev.clientX, ev.clientY).zone;
      licht(zone);
      havenWisGhost(svg);
      if(zone){
        const z = zoekZone(ev.clientX, ev.clientY);
        const set = havenKolomSet(kaart.dataset.wachtset);
        if(set) havenToonGhost(svg, set.bakken.map(b => b.naam), zone.id,
                               havenSlotOnderSvg(zone, z.p.x, z.p.y), true);
      }
      ev.preventDefault();
    };

    const los = async (ev) => {
      document.removeEventListener('pointermove', beweeg);
      document.removeEventListener('pointerup', los);
      document.removeEventListener('pointercancel', los);
      kaart.classList.remove('wordtGesleept');
      if(zweef) zweef.remove();
      licht(null);
      havenWisGhost(svg);

      /* Niet gesleept maar getikt: de tegel vergroot zich in het midden en de
         plekken waar hij past lichten op — net als op de lege bakkenplaats.
         Tik je dan een plek aan, dan komt de hele set daar binnen.

         Vóór v1.193 zette een tik hier alleen de set "gekozen" en moest je
         daarna zelf een bestemming zoeken zonder te zien waar hij paste. */
      if(!bewogen){
        if(havenGezoomdeTegel === kaart){
          havenVerbergTegelZoom();
        } else {
          const set = havenKolomSet(kaart.dataset.wachtset);
          havenGezoomdeTegelNamen = set ? set.bakken.map(b => b.naam) : [];
          havenToonTegelZoom(kaart, false);
          havenToonAlleGloei(havenGezoomdeTegelNamen);
        }
        return;
      }

      document.querySelectorAll('.haven-plaatstab').forEach(k => k.classList.remove('doelwit'));
      const paneelEl = document.getElementById('havenPlaatsPaneel');
      if(paneelEl) paneelEl.classList.remove('doelwit');
      document.querySelectorAll('#havenLegeKolom, #havenPalenKolom').forEach(k => k.classList.remove('doelwit'));

      const doelPlaats = havenTabOnderAanwijzer(ev) || havenPlaatsZoneOnderAanwijzer(ev);
      if(doelPlaats){
        await havenLaatSetBinnen(kaart.dataset.wachtset, doelPlaats);
        havenZetPlaatsPaneel(null);
        render();
        return;
      }

      const { zone, p } = zoekZone(ev.clientX, ev.clientY);
      if(zone){
        const slot = havenSlotOnderSvg(zone, p.x, p.y);
        await havenLaatSetBinnen(kaart.dataset.wachtset, zone.id, slot);
      }
      render();
    };

    document.addEventListener('pointermove', beweeg);
    document.addEventListener('pointerup', los);
    document.addEventListener('pointercancel', los);
  });
}

/* ── Bakkenplaatsen als paneel ────────────────────────────────────────
   De lege en de volle bakkenplaats lagen midden in de haventekening en
   hielden daarmee de kades klein. Ze zitten nu achter een tabje: normaal
   zie je alleen de kades, en het paneel schuift er overheen zodra je het
   nodig hebt. De haven blijft er zichtbaar achter.

   Tijdens een sleepbeweging opent een tabje vanzelf als je erboven komt.
   Zo sleep je een set uit Onderweg naar de lege plaats zonder eerst iets
   aan te klikken, en sleep je er even goed weer eentje uit naar de kade. */
