/* Het meebewegende kaartje komt niet precies onder je vinger maar iets naar
   rechtsboven. Onder je vinger valt het weg — juist op het moment dat je wilt
   lezen wélke set je vasthebt. Met een muis maakt het niets uit; met een duim
   scheelt het alles. */
/* De vinger loopt vóór de tegel uit: het kaartje hangt links van je vinger,
   met de rechterrand er net naast. Zo wijs je met je vinger de plek aan en
   blijft de tegel leesbaar in plaats van eronder te verdwijnen. */
// Breedte van een bakje plus tussenruimte in een paneel. Eén hele baklengte
// verschuiving is dus deze maat; een halve bak de helft ervan.
const PANEEL_BAKJE_PX = 68;
/* Een vaste hoogte per rij (of die nou 56 was of 92) blijft altijd een gok:
   soms te veel lucht onder een lage tegel, soms bijna geen lucht meer voor
   een hoge. Op verzoek bepaalt de tegel zelf nu hoe ver de volgende tegel
   weg staat — havenZetPlaatsPaneel meet elke tegel na het tekenen echt op
   (offsetHeight) en zet 'm daarna pas definitief op zijn rij. Drie maten
   blijven daarvoor nodig:

   - PANEEL_RIJ_SCHATTING_PX: alleen de allereerste, voorlopige top waarmee
     een tegel tekent vóór die meting heeft kunnen lopen (zie havenPlaatsTegel)
     en de beginhoogte van het raster in de sjabloon hieronder — geen van
     beide is ooit het laatste woord, dus de precieze waarde maakt weinig uit.
   - PANEEL_TEGEL_GAP_PX: de tussenruimte tussen twee tegels die wél iets
     bevatten. Op verzoek dezelfde maat als tussen twee sets in de Onderweg-
     kolom (.haven-wachtrij-set, Tailwind mb-2 = 8px) — ziet er zo hetzelfde
     "aangesloten" uit als daar. Wil je meer lucht, is dit het getal om op te
     hogen; de rest van de berekening (havenZetPlaatsPaneel) past zich er
     vanzelf op aan.
   - PANEEL_LEGE_RIJ_PX: een rij zonder tegel is nog steeds een geldige plek
     om iets op te leggen (zie havenSchuifSetNaarRij) en moet dus een eigen,
     aantikbare band houden — alleen een kleinere dan een echte tegel ooit
     nodig heeft, in plaats van de volle (oude) rijmaat. */
const PANEEL_RIJ_SCHATTING_PX = 60;
const PANEEL_TEGEL_GAP_PX = 8;
const PANEEL_LEGE_RIJ_PX = 28;
/* Op de volle plaats is een lege rij een échte vrije rij, zo hoog als een set —
   geen smalle band. Een gat dat je tussen twee sets laat, hoort een echt gat te
   zijn dat de ligging op de kade nabootst; het vlak wordt daardoor hoger en
   scrollt verticaal (keuze Herman, okt 2026). De lege plaats houdt de kleine
   band (PANEEL_LEGE_RIJ_PX): daar is het puur een aantikbare tussenstrook. */
const PANEEL_VOLLE_LEGE_RIJ_PX = PANEEL_RIJ_SCHATTING_PX;
/* Hoeveel de aanwijzer mag bewegen voordat het een sleep wordt in plaats van
   een tik.

   Met een muis is zes pixels prima: die staat stil als je klikt. Een vinger
   op glas doet dat niet — bij een gewone tik rolt hij al snel tien pixels of
   meer over het scherm, en dan werd de tik als sleep gelezen en gebeurde er
   niets. Op de tablet leek tikken daardoor niet te werken (soms lukte het
   alleen met een dubbeltik, omdat de tweede tik toevallig stiller was);
   achter de PC viel het nooit op. */
function havenTikDrempel(e){
  return (e && e.pointerType === 'touch') ? 14 : 6;
}

const SLEEP_VERSCHUIVING = { y: -26, marge: 14 };
function sleepLinksVan(x, breedte){ return x - breedte - SLEEP_VERSCHUIVING.marge; }

let havenOpenPlaats = null;      // 'leeg' | 'vol' | null
/* Cumulatieve top (px) per rij van het open paneel, ná het echt inpakken
   (zie havenZetPlaatsPaneel) — rijTops[r] is waar rij r begint. Leeg zolang
   er geen paneel open staat of het nog niets bevat. Bestaat alleen zodat
   havenKoppelPaneelSlepen bij het loslaten een gesleepte pixelpositie kan
   terugvertalen naar de dichtstbijzijnde rij (havenRijVoorTop) — met tegels
   van ongelijke hoogte is dat geen vaste deling meer, zie de rij-inpakking
   daar. */
let havenPlaatsRijTops = [];
/* Welke rij ligt het dichtst bij deze pixelpositie? Voor het loslaten van
   een sleep (havenKoppelPaneelSlepen): de rijen liggen niet meer op gelijke
   afstand (elke tegel bepaalt zijn eigen hoogte), dus "top/vaste-rijhoogte"
   werkt niet meer — dit zoekt gewoon de rij waarvan de eigen beginhoogte het
   dichtst bij top ligt. */
function havenRijVoorTop(top){
  if(!havenPlaatsRijTops.length) return 0;
  let beste = 0, besteAfstand = Infinity;
  havenPlaatsRijTops.forEach((rijTop, r) => {
    const afstand = Math.abs(rijTop - top);
    if(afstand < besteAfstand){ besteAfstand = afstand; beste = r; }
  });
  return beste;
}

/* Aantikken in plaats van slepen.
 *
 * Slepen werkt, maar over een breed scherm met een vinger is het een lange
 * beweging, en onderweg kan van alles in de weg komen. Tik daarom een set in
 * Onderweg aan, tik er gerust nog een paar aan, en tik dan de bestemming: een
 * bakkenplaats-knop of een laadlengte. Alles wat aanstaat verhuist in één keer.
 *
 * Aantikken verplaatst nooit iets uit zichzelf — er moet altijd een tweede tik
 * op een bestemming volgen. Zo kun je rustig kiezen zonder dat er iets gebeurt.
 */
let havenGekozenSets = new Set();

/* Losse bakken die je in een bakkenplaats-paneel hebt aangetikt. Die staan
 * apart van havenSelectie — dat is de selectie ín de tekening, waar je juist
 * meerdere bakken achter elkaar mee aanwijst. Hield je die twee op één hoop,
 * dan kon je na de eerste tik in de haven geen tweede set meer aantikken:
 * elke volgende tik werd als bestemming gelezen. */
let havenGekozenBakken = new Set();

function havenKiesSet(key){
  if(!key) return;
  if(havenGekozenSets.has(key)) havenGekozenSets.delete(key);
  else havenGekozenSets.add(key);
  havenToonGekozenSets();
}

function havenKiesLosseBak(sleutel){
  if(!sleutel) return;
  /* Staat er op de volle plaats een kolomknop aan (achter/midden/kop) en tik je
     een bak in die plaats aan, dan gaat hij meteen naar die kolom (1.341). De
     knop blijft aan, zodat je er meer kunt aantikken; nog een tik zet hem uit. */
  const vlak = document.getElementById('havenVolVlak');
  if(havenVolKolomKeuze && vlak && vlak.querySelector(`.plaats-set .haven-wachtrij-bak[data-baksleutel="${CSS.escape(sleutel)}"]`)){
    havenGekozenBakken = new Set([sleutel]);
    havenZetGekozenInKolom(vlak, havenVolKolomKeuze);
    return;
  }
  if(havenGekozenBakken.has(sleutel)) havenGekozenBakken.delete(sleutel);
  else havenGekozenBakken.add(sleutel);
  havenToonGekozenSets();
}

// Staat er iets klaar dat op een bestemming wacht? Een tik op de kade is dan
// het aanwijzen van die bestemming en niet het maken van een nieuwe selectie.
function havenWachtOpBestemming(){
  return havenGekozenSets.size > 0 || havenGekozenBakken.size > 0;
}

/* Toont/verbergt de schaduwvakken (.plaats-schaduw, zie havenVulPlaatsContainer)
   op de lege-bakkenplaats-kolom — puur een klasse-toggle, geen hertekening.
   Geldt voor alledrie de manieren om iets te kiezen: een set in Onderweg of
   het paneel (havenGekozenSets), een los bakje (havenGekozenBakken), en een
   bak in de tekening zelf (havenSelectie) — havenToonSelectie() roept hieronder
   toch al havenToonGekozenSets() aan, dus één aanroep hier dekt alledrie. */
function havenVerversSchaduw(){
  const kolom = document.getElementById('havenLegeKolom');
  if(!kolom) return;
  const actief = havenGekozenSets.size > 0 || havenGekozenBakken.size > 0 || havenSelectie.size > 0;
  kolom.classList.toggle('toont-schaduw', actief);
}

let havenGezoomdeTegel = null;
// De baknamen van de vergrote tegel. Die houden we apart bij omdat elke
// render() de tegel opnieuw opbouwt: de DOM-verwijzing hierboven is dan een
// ander element, maar wát er verplaatst moet worden blijft hetzelfde.
let havenGezoomdeTegelNamen = [];

function havenVerbergTegelZoom(){
  if(havenGezoomdeTegel){
    havenGezoomdeTegel.classList.remove('gezoomd');
    havenGezoomdeTegel = null;
  }
  havenGezoomdeTegelNamen = [];
  havenVerbergAlleGloei();
  const scrim = document.getElementById('havenTegelZoomScrim');
  if(scrim) scrim.remove();
  document.removeEventListener('keydown', havenTegelZoomEscape);
  document.removeEventListener('click', havenTegelZoomBuitenklik, true);
}

function havenTegelZoomEscape(ev){
  if(ev.key === 'Escape') havenVerbergTegelZoom();
}

/* Sluiten door ergens anders te tikken. Alleen nodig in het pad zónder
   verduistering: daar ligt de haven gewoon open en klikbaar onder de vergrote
   tegel, dus er is geen scherm dat de tik opvangt. Een tik op de tegel zelf
   of op een oplichtende plek heeft zijn eigen afhandeling en telt hier niet. */
function havenTegelZoomBuitenklik(ev){
  if(!havenGezoomdeTegel) return;
  if(havenGezoomdeTegel.contains(ev.target)) return;
  if(ev.target.closest && ev.target.closest('.haven-gloei, .plaats-schaduw')) return;
  havenVerbergTegelZoom();
}

function havenToonTegelZoom(el, metScrim = true){
  if(havenGezoomdeTegel && havenGezoomdeTegel !== el) havenVerbergTegelZoom();
  el.classList.add('gezoomd');
  havenGezoomdeTegel = el;
  if(metScrim && !document.getElementById('havenTegelZoomScrim')){
    const scrim = document.createElement('div');
    scrim.id = 'havenTegelZoomScrim';
    scrim.className = 'haven-tegel-zoom-scrim';
    scrim.addEventListener('click', havenVerbergTegelZoom);
    document.body.appendChild(scrim);
  }
  // Zonder verduistering blijft de haven zichtbaar én aantikbaar — dat is
  // precies de bedoeling als de laadlengtes oplichten om er een te kiezen.
  if(!metScrim) document.addEventListener('click', havenTegelZoomBuitenklik, true);
  document.addEventListener('keydown', havenTegelZoomEscape);
}

function havenToonGekozenSets(){
  havenVerversSchaduw();
  // aria-pressed alleen op de twee die ook echt tabindex/role="button" hebben
  // (Onderweg-kaarten en losse bakjes); de tegel in het paneel zelf is dat
  // niet — daar zijn de bakjes erin de focusbare elementen, zie
  // havenKoppelPaneelSlepen.
  document.querySelectorAll('.haven-wachtrij-set[data-wachtset]').forEach(el => {
    const aan = havenGekozenSets.has(el.dataset.wachtset);
    el.classList.toggle('gekozen', aan);
    el.setAttribute('aria-pressed', String(aan));
  });
  document.querySelectorAll('.haven-wachtrij-set[data-plaatsset]').forEach(el => {
    el.classList.toggle('gekozen', havenGekozenSets.has(el.dataset.plaatsset));
  });
  document.querySelectorAll('.haven-wachtrij-bak[data-baksleutel]').forEach(el => {
    const aan = havenGekozenBakken.has(el.dataset.baksleutel);
    el.classList.toggle('gekozen', aan);
    el.setAttribute('aria-pressed', String(aan));
  });
  /* De balk onderin ("N bakken gekozen — tik nu...") is er op verzoek uit:
     wat je hebt aangetikt zie je al aan de tegel of het bakje zelf, dus die
     regel voegde niets toe. Nog een keer aantikken zet de keuze weer uit. */
}

/* Vaart (1.335): tik een set aan, tik een plek — dan glijdt elke bak van zijn
   oude naar zijn nieuwe plek, als bevestiging dat hij echt verhuisd is.
   Werkt los van de tekening: vóór de verplaatsing elke bak opmeten, na het
   hertekenen opnieuw, en voor elke bak die verschoof een zwevend bakje
   (position:fixed) laten varen terwijl de echte even onzichtbaar is. Zo maakt
   het niet uit of de bak in de SVG-haven of in een paneel ligt. Alleen bij
   tikken: bij slepen ligt de bak al waar je hem loslaat. */
const HAVEN_VAART_MS = 1800;   // "iets van 2 sec" — hier bijstellen
let havenVaartBezig = false;

function havenBakkenOpScherm(){
  const uit = new Map();
  document.querySelectorAll('#havenSvg .haven-bak[data-bak], .haven-wachtrij-bak[data-zoeksleutel]:not(.ontbreekt)').forEach(el => {
    const r = el.getBoundingClientRect();
    if(!r.width || !r.height) return;                 // ingeklapt of verborgen
    const svgBak = el.matches('.haven-bak');
    const sleutel = svgBak ? el.dataset.bak : el.dataset.zoeksleutel;
    if(uit.has(sleutel)) return;
    const vlak = svgBak ? el.querySelector('.haven-bak-vlak') : el;
    uit.set(sleutel, { el, r,
      naam: svgBak ? ((el.querySelector('.haven-bak-nr') || {}).textContent || sleutel) : el.firstChild?.textContent || sleutel,
      kleur: svgBak ? getComputedStyle(vlak).stroke : getComputedStyle(el).borderColor });
  });
  return uit;
}

async function havenMetVaart(verplaats){
  if(havenVaartBezig || matchMedia('(prefers-reduced-motion: reduce)').matches) return verplaats();
  havenVaartBezig = true;
  let voor, uitkomst;
  try {
    voor = havenBakkenOpScherm();
    uitkomst = await verplaats();
  } finally { havenVaartBezig = false; }
  const na = havenBakkenOpScherm();
  na.forEach((n, sleutel) => {
    const v = voor.get(sleutel);
    if(!v || (Math.abs(v.r.left - n.r.left) < 4 && Math.abs(v.r.top - n.r.top) < 4)) return;
    const boot = document.createElement('div');
    boot.className = 'haven-vaart';
    boot.textContent = n.naam;
    boot.style.borderColor = n.kleur;
    document.body.appendChild(boot);
    n.el.style.visibility = 'hidden';
    const vak = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    const vaart = boot.animate([vak(v.r), vak(n.r)], { duration: HAVEN_VAART_MS, easing: 'ease-in-out', fill: 'forwards' });
    const klaar = () => { boot.remove(); n.el.style.visibility = ''; };
    vaart.onfinish = klaar; vaart.oncancel = klaar;
  });
  return uitkomst;
}
function havenZetGekozenSets(zoneId, startSlot){
  return havenMetVaart(() => havenZetGekozenSetsDirect(zoneId, startSlot));
}
function havenPlaatsGezoomdeTegel(zoneId, startSlot){
  return havenMetVaart(() => havenPlaatsGezoomdeTegelDirect(zoneId, startSlot));
}

/* Brengt alles wat aanstaat naar een bestemming. Zone-id van een bakkenplaats
   of van een kade; bij een kade mag er een plek bij, zodat een tik op de 3e
   lengte daar ook echt terechtkomt. */
async function havenZetGekozenSetsDirect(zoneId, startSlot){
  /* Eerst de losse bakken die in een paneel zijn aangetikt. Die krijgen de
     aangewezen plek; komen er daarna nog sets, dan sluiten die aan. */
  if(havenGekozenBakken.size){
    const namen = havenBakken().filter(b => havenGekozenBakken.has(b.sleutel)).map(b => b.naam);
    const ok = namen.length && await havenVerplaatsBakken(namen, zoneId, startSlot, true);
    havenGekozenBakken.clear();
    startSlot = undefined;
    if(!havenGekozenSets.size){
      havenToonGekozenSets();
      render();
      showToast(ok
        ? `${namen.length} bak${namen.length === 1 ? '' : 'ken'} naar ${havenZoneNaam(zoneId)}.`
        : `Daar is geen ruimte op ${havenZoneNaam(zoneId)}.`);
      return true;
    }
  }
  // Losse bakken die in de tekening zijn aangetikt tellen ook mee als er
  // verder niets gekozen is. Zo werkt aanwijzen overal hetzelfde.
  if(!havenGekozenSets.size && havenSelectie.size){
    const namen = havenBakken().filter(b => havenSelectie.has(b.sleutel)).map(b => b.naam);
    if(namen.length){
      const ok = await havenVerplaatsBakken(namen, zoneId, startSlot, true);
      havenSelectie.clear();
      havenToonSelectie();
      render();
      showToast(ok
        ? `${namen.length} bak${namen.length === 1 ? '' : 'ken'} naar ${havenZoneNaam(zoneId)}.`
        : `Daar is geen ruimte op ${havenZoneNaam(zoneId)}.`);
      return true;
    }
  }
  if(!havenGekozenSets.size) return false;

  const keys = [...havenGekozenSets];
  let gelukt = 0, mislukt = [];

  for(const key of keys){
    /* Een gekozen set staat óf nog in Onderweg, óf ligt al ergens in de haven.
       Dat vraagt een andere weg: binnenhalen zet ook de tegels op aanwezig,
       verplaatsen doet dat niet. De sleutel is in beide gevallen dezelfde, dus
       we kijken simpelweg waar hij nu staat. */
    const wacht = havenKolomSet(key);
    if(wacht){
      const ok = await havenLaatSetBinnen(key, zoneId, startSlot);
      if(ok) gelukt++; else mislukt.push(wacht.schip || key);
    } else {
      // Op de volle plaats is de setsleutel de vertreksleutel (havenPlaatsGroepKey),
      // niet de aankomst-tegelSleutel — anders vond dit geen enkele bak en sprong
      // de set terug naar waar hij lag. Voor de andere zones is het hetzelfde.
      const namen = havenBakkenMetPlek()
        .filter(b => havenPlaatsGroepKey(b) === key && b.plek).map(b => b.naam);
      if(!namen.length) continue;
      const ok = await havenVerplaatsBakken(namen, zoneId, startSlot, true);
      if(ok) gelukt++; else mislukt.push(namen[0]);
    }
    // Alleen de eerste set krijgt de aangewezen plek; de rest sluit aan,
    // anders zouden ze allemaal op dezelfde plaats willen liggen.
    startSlot = undefined;
  }

  havenGekozenSets.clear();
  havenToonGekozenSets();
  render();
  if(mislukt.length) showToast(`Niet gelukt voor ${mislukt.join(', ')} — daar is geen ruimte.`);
  else if(gelukt) showToast(`${gelukt} set${gelukt === 1 ? '' : 's'} verplaatst naar ${havenZoneNaam(zoneId)}.`);
  return true;
}

/* Een set uit het paneel naar de kade slepen. Zelfde werkwijze als vanuit de
   Onderweg-kolom: een meebewegend kopietje volgen op documentniveau, en bij
   het loslaten omrekenen naar de coördinaten van de tekening. Het paneel gaat
   dicht zodra de set eruit gehaald is — anders blijft het over de haven liggen
   die je net weer nodig hebt. */
/* zoneId: welke plaats dit exemplaar bedient ('leeg' of 'vol'). Vroeger las
   deze functie daarvoor de globale havenOpenPlaats, wat prima was toen er
   maar één bakkenplaats-container tegelijk bestond (#havenPlaatsPaneel, om
   en om leeg of vol). Sinds de lege plaats een eigen, permanente kolom heeft
   (havenTekenLegeKolom) draait dit twee keer tegelijk — één keer voor
   #havenPlaatsPaneel (nog steeds vol, en leeg op telefoonbreedte) en één
   keer voor #havenLegeKolom (altijd 'leeg') — en moet elk exemplaar zijn
   eigen zone kennen in plaats van een gedeelde globale variabele. */
function havenKoppelPaneelSlepen(paneel, svg, zoneId){
  if(!paneel) return;

  /* Toetsenbordbediening: Enter/spatie op een los bakje kiest die ene bak,
     hetzelfde als hem er met de muis los aftikken (zie hieronder). Er is
     bewust geen toetsenbordpad om in één keer de hele tegel te kiezen zoals
     de muis kan door tussen de bakjes te tikken — dat is hier overbodig, want
     elk bakje van een set is gewoon los te kiezen, en samen leveren ze
     dezelfde bestemmingskeuze op. Zo hoeft er geen rol="button" om een tegel
     heen die zelf al role="button"-bakjes bevat. */
  paneel.addEventListener('keydown', (e) => {
    const bakje = e.target.closest('.haven-wachtrij-bak.los');
    if(!bakje) return;
    // V: vertrekboot met de hand, hetzelfde als een dubbeltik.
    if(e.key === 'v' || e.key === 'V'){
      e.preventDefault();
      havenVraagVertrekboot(bakje.dataset.baksleutel || normalizeBargeName(bakje.dataset.losbak));
      return;
    }
    if(e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    havenKiesLosseBak(normalizeBargeName(bakje.dataset.losbak));
  });

  paneel.addEventListener('pointerdown', (e) => {
    const kaart = e.target.closest('.haven-wachtrij-set');
    if(!kaart || !kaart.dataset.plaatsset) return;
    if(e.button != null && e.button !== 0) return;
    e.preventDefault();


    /* Pak je een los bakje beet, dan gaat alleen die bak mee en blijft de rest
       van de set liggen. Pak je de tegel ergens anders vast, dan verhuist de
       hele set. Dat onderscheid zit in wat je aanraakt, niet in een knop —
       op een tablet is dat het verschil tussen één en twee handelingen. */
    const losBakje = e.target.closest('.haven-wachtrij-bak.los');
    const setKey = kaart.dataset.plaatsset;
    const namen = losBakje
      ? [losBakje.dataset.losbak]
      : havenBakkenMetPlek()
          .filter(b => havenPlaatsGroepKey(b) === setKey && b.zone === zoneId && b.plek)
          .map(b => b.naam);
    if(!namen.length || !namen[0]) return;

    // Het meebewegende kopietje is het bakje zelf als je er eentje losmaakt,
    // anders de hele tegel.
    const greepEl = losBakje || kaart;
    // Voor de verticale sleep (naar een andere rij): waar de tegel nu al
    // staat, in px (havenZetPlaatsPaneel heeft 'm net ingepakt). Bij een
    // mislukte plaatsing tekent havenZetPlaatsPaneel toch alles opnieuw uit
    // havenPosities, dus dit is puur voor de live voorvertoning tijdens het
    // slepen zelf.
    kaart.dataset.basisTop = parseFloat(kaart.style.top) || 0;
    const vak = greepEl.getBoundingClientRect();
    const greep = { x: e.clientX - vak.left, y: e.clientY - vak.top };
    // tegelBoven blijft staan tussen twee zones, anders springt de tegel op en neer.
    let bewogen = false, zweef = null, verlaten = false, tegelBoven = false;
    /* Idee 5: op Vol de bootnaam naar rechts vegen = vertrokken. Elke andere
       richting blijft slepen. null = nog niet beslist. */
    const kop = zoneId === 'vol' && !losBakje && e.target.closest('.plaats-schip');
    let veeg = null, veegDx = 0, veegVlak = null;

    const beweeg = (ev) => {
      if(kop && veeg !== false){
        const dx = ev.clientX - e.clientX, dy = ev.clientY - e.clientY;
        if(veeg === null){
          if(Math.hypot(dx, dy) < havenTikDrempel(e)) return;
          veeg = dx > 0 && dx > Math.abs(dy);
          if(veeg){
            veegVlak = document.createElement('div');
            veegVlak.className = 'plaats-veeg';
            veegVlak.textContent = 'Vertrokken →';
            veegVlak.style.cssText = `top:${kaart.offsetTop}px;left:${kaart.offsetLeft}px;width:${kaart.offsetWidth}px;height:${kaart.offsetHeight}px`;
            kaart.before(veegVlak);
          }
        }
        if(veeg){
          veegDx = Math.max(0, dx);
          kaart.style.transform = `translateX(${veegDx}px)`;
          kaart.style.opacity = String(1 - Math.min(veegDx / 300, 0.5));
          ev.preventDefault();
          return;
        }
      }
      if(!bewogen){
        if(Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < havenTikDrempel(e)) return;
        bewogen = true;
        /* Een echte sleep begint altijd vanuit de normale, niet-vergrote
           tegel: anders zou het meebewegende kopietje hierna .gezoomd
           meekopiëren (position:fixed + scale) en op de verkeerde plek/maat
           gaan zweven. kaart.style.top (basisTop hierboven al vastgelegd) is
           dan ook weer de echte, ingepakte positie in plaats van het midden
           van het scherm. */
        if(kaart.classList.contains('gezoomd')) havenVerbergTegelZoom();
        zweef = greepEl.cloneNode(true);
        zweef.classList.add('zweeft');
        zweef.style.width = vak.width + 'px';
        document.body.appendChild(zweef);
        greepEl.classList.add('wordtGesleept');
      }
      zweef.style.left = sleepLinksVan(ev.clientX, vak.width) + 'px';
      zweef.style.top  = (ev.clientY - greep.y + SLEEP_VERSCHUIVING.y) + 'px';

      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
      havenWisGhost(svg);

      /* Binnen het paneel verschuif je de set langs de plaats; buiten het
         paneel sleep je hem de haven in.

         Zodra je het paneel één keer verlaten hebt blijft het weg tot je
         loslaat. Eerder keek dit alleen naar waar de aanwijzer nú was, en
         dan kwam het paneel terug zodra je erboven kwam — en de 4e lengte
         ligt in het westen, precies onder het paneel dat vanaf links opent.
         Je kon daar dus niets neerleggen: het menu schoof er telkens
         voor.

         havenBinnenElement(paneel, ev) i.p.v. het bredere havenBovenPaneel():
         dit gaat over het EIGEN paneel van dít exemplaar (leeg-kolom of
         vol-paneel), niet "sta ik boven een van de twee bakkenplaatsen" —
         anders zou binnen de lege kolom slepen soms per ongeluk denken dat
         je het volle paneel verlaten hebt, of andersom. */
      if(!havenBinnenElement(paneel, ev)) verlaten = true;
      const binnen = !verlaten && havenBinnenElement(paneel, ev);
      /* Alleen het in/uitschuivende paneel (volle plaats, of lege plaats op
         telefoon) mag zichzelf verbergen zodra de tegel 'm verlaat — dat
         hoorde bij het dichtschuiven. De vaste kolom blijft altijd staan,
         net als Onderweg: op verzoek, nadat hij verdween zodra je de laatste
         tegel wegsleepte. */
      // Alleen het in/uitschuivende paneel (#havenPlaatsPaneel) mag zichzelf
      // verbergen zodra de tegel het verlaat. De vaste kolom én het vaste
      // volle-plaats-vlak blijven altijd staan — anders verdwijnt de hele
      // plaats onder je handen zodra je er een set uit sleept.
      if(!['havenLegeKolom', 'havenPalenKolom', 'havenVolVlak'].includes(paneel.id))
        paneel.style.visibility = binnen ? '' : 'hidden';
      const vertrekvak = paneel.querySelector('#havenVertrekvak');
      if(vertrekvak) vertrekvak.classList.toggle('doelwit',
        binnen && havenBinnenElement(vertrekvak, ev));

      /* Sleep je één bakje, dan licht de tegel op waar hij in terecht zou
         komen — zonder dat zie je pas ná het loslaten of je goed gemikt hebt. */
      paneel.querySelectorAll('.plaats-set.doelwit').forEach(t => t.classList.remove('doelwit'));
      if(binnen && losBakje){
        const doelTegel = havenTegelOnderAanwijzer(paneel, ev);
        if(doelTegel && doelTegel !== kaart) doelTegel.classList.add('doelwit');
      }

      if(binnen && !losBakje){
        if(vertrekvak && havenBinnenElement(vertrekvak, ev)){
          kaart.style.outline = '';
          kaart.classList.remove('wordt-verschoven');
        } else {
          /* De tegel volgt de aanwijzer 1-op-1 naar zijn eigen nieuwe rij.
             Geen andere tegel schuift alvast mee — dat was precies het
             "automatisch aansluiten" dat niet meer moet. Wat er uiteindelijk
             mag (alleen verplaatsen, of één buur één stap opzij als daar
             ruimte voor is) bepaalt havenSchuifSetNaarRij pas bij het
             loslaten.

             Zijwaarts slepen bestaat niet meer, op geen van beide plaatsen:
             de tegels staan nu onder elkaar uitgelijnd, dus een tegel opzij
             schuiven was een beweging waar je niets van terugzag. */
          kaart.style.outline = '';
          kaart.classList.add('wordt-verschoven');
          const basisTop = parseFloat(kaart.dataset.basisTop) || 0;
          kaart.style.top = Math.max(0, basisTop + (ev.clientY - e.clientY)) + 'px';
        }
      }

      // Boven het tabje van de ándere bakkenplaats: daarheen verplaatsen.
      const tab = havenTabOnderAanwijzer(ev);
      document.querySelectorAll('.haven-plaatstab').forEach(k =>
        k.classList.toggle('doelwit', k.dataset.plaats === tab));

      let ghost = null;
      if(!tab){
        const zone = havenZoneOnderSvg(p.x, p.y);
        if(zone){
          ghost = havenToonGhost(svg, namen, zone.id, havenSlotGecentreerd(zone, p.x, p.y, namen), true);
          tegelBoven = zone.id === 'b2b3-kade';
        }
      }
      // Buiten het menu: tegel en ghost op één lijn (zie havenZweefBijGhost).
      if(verlaten) havenZweefBijGhost(zweef, ev, ghost, tegelBoven);
      ev.preventDefault();
    };

    const los = async (ev) => {
      document.removeEventListener('pointermove', beweeg);
      document.removeEventListener('pointerup', los);
      document.removeEventListener('pointercancel', los);
      greepEl.classList.remove('wordtGesleept');
      if(zweef) zweef.remove();
      paneel.style.visibility = '';
      if(veeg){
        if(veegVlak) veegVlak.remove();
        if(veegDx > Math.min(140, kaart.offsetWidth * 0.35)) await havenVeegVertrek(kaart, setKey, paneel, zoneId);
        kaart.style.transform = '';
        kaart.style.opacity = '';
        return;
      }
      // Getikt, niet gesleept: de set aan- of uitzetten. Daarna wijs je een
      // bestemming aan, net als in Onderweg.
      if(!bewogen){
        svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
        havenWisGhost(svg);
        /* Tik je een los bakje aan, dan gaat het om die ene bak — net als bij
           slepen, waar het bakje zelf losgaat en de rest van de set blijft
           liggen. Eerder ging bij elke tik de hele set aan, en dan kun je
           geen enkele bak meer apart wegzetten. */
        /* Staat er een tegel vergroot en tik je een los bakje van een ándere
           tegel aan, dan voeg je dat bakje bij de vergrote tegel. Dat is een
           handmatige keuze die blijft staan (havenTegelOverrides), want de
           aankomstlijst blijft zeggen dat hij ergens anders bij hoort. Zijn
           vertrekboot en -tijd komen mee, dus de tegel krijgt er vanzelf een
           tabje bij als het een andere boot is. */
        /* Volle plaats: staan er bakken van elders klaar (aangetikt in de
           haven of een paneel), dan is een tik op een tegel "voeg ze hierbij"
           — geen lege ghost-rij meer nodig. */
        /* Tik op een ghost terwijl er niets gekozen is (1.355): laat zien waar
           die bak nu ligt, net als Zoeken — maar met de bak zelf als doel. */
        const ghostEl = e.target.closest('.haven-wachtrij-bak.ontbreekt');
        if(ghostEl && ghostEl.dataset.zoeksleutel && !havenGekozenBakken.size && !havenSelectie.size){
          snelzoekNaarBak(ghostEl.dataset.zoeksleutel, false, true);
          return;
        }
        if(zoneId === 'vol'){
          /* Tikken binnen de tegel (fout 20): staat er één bak van deze tegel
             aan en tik je een andere cel van dezelfde tegel, dan wisselen ze —
             precies wat slepen doet. Een ghost of lege cel: de bak schuift
             erheen. */
          const hierGekozen = [...kaart.querySelectorAll('.haven-wachtrij-bak[data-baksleutel]')]
            .filter(el => havenGekozenBakken.has(el.dataset.baksleutel));
          if(hierGekozen.length === 1 && hierGekozen[0] !== losBakje){
            const sl = hierGekozen[0].dataset.baksleutel;
            havenGekozenBakken.delete(sl);
            if(await havenWisselBakBinnenTegel(hierGekozen[0], ev, kaart, paneel, zoneId)) return;
            havenGekozenBakken.add(sl);
          }
          const gekozen = new Set([...havenGekozenBakken, ...havenSelectie]);
          const erbij = havenBakken().filter(b => gekozen.has(b.sleutel)
            && !kaart.querySelector(`[data-baksleutel="${CSS.escape(b.sleutel)}"]`));
          /* Komt er een bak uit een ándere set op Vol bij, dan dezelfde vraag als
             bij slepen: is de bergvaart veranderd? Nee = alles blijft liggen. */
          const opVol = new Set(havenBakkenMetPlek().filter(b => b.zone === 'vol').map(b => b.sleutel));
          const vanVol = erbij.filter(b => opVol.has(b.sleutel));
          if(vanVol.length){
            const ja = await vraagBevestiging({
              titel: 'Is de bergvaart veranderd?',
              tekst: `${vanVol.map(b => b.naam).join(', ')} gaat naar een andere set. Ja: hij komt bij die set en krijgt die bergvaart-kleur. Nee: hij blijft waar hij lag.`,
              bevestig: 'Ja', annuleer: 'Nee'
            });
            if(!ja){
              havenGekozenBakken.clear();
              havenSelectie.clear();
              havenToonSelectie();
              render();
              return;
            }
            const doelBak = havenBakkenMetPlek()
              .find(b => havenPlaatsGroepKey(b) === setKey && b.zone === zoneId && b.plek && b.kleur);
            if(doelBak){
              vanVol.forEach(b => { havenKleurOverrides[b.sleutel] = doelBak.kleur; });
              await saveHavenKleurOverrides();
            }
          }
          if(erbij.length){
            const ok = await havenVoegBakkenBijTegel(erbij.map(b => b.naam), setKey, zoneId, kaart);
            havenGekozenBakken.clear();
            havenSelectie.clear();
            havenToonSelectie();
            render();
            showToast(ok ? `${erbij.length} bak${erbij.length === 1 ? '' : 'ken'} bij deze set gezet.`
                         : 'Dat lukte niet — de bakken blijven liggen waar ze lagen.');
            return;
          }
        }
        if(losBakje && havenGezoomdeTegel && !havenGezoomdeTegel.contains(losBakje)){
          havenVoegBakBijTegel(losBakje.dataset.losbak, havenGezoomdeTegel.dataset.plaatsset, zoneId);
          return;
        }
        if(losBakje){
          const sl = losBakje.dataset.baksleutel || normalizeBargeName(losBakje.dataset.losbak);
          havenKiesLosseBak(sl);
          /* Dubbeltik = vertrekboot met de hand, net als in de tekening. De
             twee tikken zetten de keuze aan en weer uit. */
          if(havenIsDubbeltik(sl)) havenVraagVertrekboot(sl);
        } else if(zoneId === 'leeg'){
          /* Lege plaats: tikken vergroot de tegel én laat alle laadlengtes
             oplichten waar hij past. Bewust géén havenKiesSet() hier — dan
             zou ook de keuzebalk onderin verschijnen, en die is in dit pad
             overbodig: de vergrote tegel en de oplichtende plekken zeggen zelf
             al wat er staat te gebeuren. Nog een keer tikken zet het uit. */
          if(havenGezoomdeTegel === kaart){
            havenVerbergTegelZoom();
          } else {
            havenGezoomdeTegelNamen = namen.slice();
            havenToonTegelZoom(kaart, false);
            havenToonAlleGloei(havenGezoomdeTegelNamen);
          }
        } else {
          havenKiesSet(setKey);
        }
        return;
      }
      svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
      document.querySelectorAll('.haven-plaatstab').forEach(k => k.classList.remove('doelwit'));
      havenWisGhost(svg);
      if(!bewogen) return;

      kaart.style.outline = '';

      paneel.querySelectorAll('.plaats-set.doelwit').forEach(t => t.classList.remove('doelwit'));

      /* Op het vertrekvak losgelaten: de haven uit. Een hele tegel, óf — als je
         één bakje beetpakte — alleen die bak. Dit staat vóór het "los bakje op
         een andere tegel"-blok hieronder: pak je een bakje en laat je het op
         het vertrekvak vallen, dan vertrekt die bak en wordt hij niet bij een
         tegel onder de aanwijzer gevoegd. Voorheen kon alleen een hele tegel
         vertrekken, en omdat vrijwel de hele tegel uit bakjes bestaat pakte je
         er bijna altijd eentje los — en dan gebeurde er niets. */
      const vertrekvak = paneel.querySelector('#havenVertrekvak');
      if(!verlaten && havenBinnenElement(paneel, ev)
         && vertrekvak && havenBinnenElement(vertrekvak, ev)){
        if(losBakje) await havenLaatBakkenVertrekken(namen);
        else await havenLaatSetVertrekken(setKey);
        havenHertekenPlaatsContainer(paneel, zoneId);
        render();
        return;
      }

      /* Een los bakje op een ándere tegel laten vallen: dan hoort hij daar
         voortaan bij. De aankomstlijst blijft zeggen dat hij bij zijn eigen
         stel hoort, dus dit wordt als jouw eigen keuze onthouden
         (havenTegelOverrides) — anders haalt de eerstvolgende hertekening of
         import hem er weer uit. */
      if(losBakje && !verlaten && havenBinnenElement(paneel, ev)){
        const doelTegel = havenTegelOnderAanwijzer(paneel, ev);
        // Binnen dezelfde tegel op een andere cel: de bak wisselt daar van plek
        // (bak↔bak of bak↔ghost). Alleen op de volle plaats.
        if(doelTegel === kaart && zoneId === 'vol'){
          if(await havenWisselBakBinnenTegel(losBakje, ev, kaart, paneel, zoneId)) return;
        }
        if(doelTegel && doelTegel !== kaart){
          const doelSleutel = doelTegel.dataset.plaatsset;
          const naam = losBakje.dataset.losbak;
          const baksleutel = losBakje.dataset.baksleutel || normalizeBargeName(naam);
          /* Op de volle plaats een bak naar een ándere set slepen: dan is de
             vraag of de bergvaart is veranderd. Ja → hij hoort nu bij die set en
             krijgt die kleur. Nee → hij blijft waar hij lag (terugtekenen). */
          if(zoneId === 'vol'){
            const ja = await vraagBevestiging({
              titel: 'Is de bergvaart veranderd?',
              tekst: `${naam} gaat naar een andere set. Ja: hij komt bij die set en krijgt die bergvaart-kleur. Nee: hij blijft waar hij lag.`,
              bevestig: 'Ja', annuleer: 'Nee'
            });
            if(!ja){ havenHertekenPlaatsContainer(paneel, zoneId); return; }
            const doelBak = havenBakkenMetPlek()
              .find(b => havenPlaatsGroepKey(b) === doelSleutel && b.zone === zoneId && b.plek && b.kleur);
            if(doelBak){
              havenKleurOverrides[baksleutel] = doelBak.kleur;
              await saveHavenKleurOverrides();
            }
          }
          await havenVoegBakBijTegel(naam, doelSleutel, zoneId);
          return;
        }
        /* Op Vol een bak op een lege rij laten vallen: de tegel uit elkaar
           halen — die bak wordt daar een eigen tegel (havenHoudTegelsBijElkaar). */
        if(!doelTegel && zoneId === 'vol'){
          const schaduw = document.elementsFromPoint(ev.clientX, ev.clientY)
            .find(el => el.classList.contains('plaats-schaduw') && paneel.contains(el));
          if(schaduw && await havenVerplaatsBakken(namen, zoneId, +schaduw.dataset.schaduwSlot, true)){
            havenHertekenPlaatsContainer(paneel, zoneId);
            render();
            return;
          }
        }
      }

      // Binnen het paneel losgelaten: de set gaat naar een andere rij
      // (havenSchuifSetNaarRij).
      if(!verlaten && havenBinnenElement(paneel, ev) && zoneId && !losBakje){
        const plaats = zoneId;

        /* Naar welke rij? Naar waar de tegel nu, na het live volgen tijdens
           het slepen, visueel staat (kaart.style.top) — teruggezocht via
           havenRijVoorTop (havenPlaatsRijTops, door havenZetPlaatsPaneel
           bijgehouden). Rijen liggen sinds de tegels hun eigen hoogte bepalen
           niet meer op gelijke afstand, dus een vaste deling kan hier niet
           meer. Past het niet (een buur die niet opzij kan, of meer dan één
           buur geraakt), dan verandert er niets en zegt een toast waarom;
           havenHertekenPlaatsContainer tekent hoe dan ook de werkelijke stand
           weer uit. */
        kaart.classList.remove('wordt-verschoven');
        const doelRij = havenRijVoorTop(parseFloat(kaart.style.top) || 0);
        const gelukt = await havenSchuifSetNaarRij(plaats, setKey, doelRij);
        if(!gelukt) showToast(`Daar past deze tegel niet — hij blijft liggen waar hij lag.`);
        havenHertekenPlaatsContainer(paneel, plaats);
        render();
        return;
      }

      /* Losgelaten op een ándere bakkenplaats-kolom (lege plaats, palen,
         volle plaats): de set of bak gaat daarheen. */
      const anderePlaats = havenPlaatsZoneOnderAanwijzer(ev);
      if(anderePlaats && anderePlaats !== zoneId){
        await havenVerplaatsBakken(namen, anderePlaats, undefined, true);
        render();
        return;
      }

      // Naar de andere bakkenplaats: van vol naar leeg of andersom.
      const tab = havenTabOnderAanwijzer(ev);
      if(tab){
        if(tab !== zoneId) await havenVerplaatsBakken(namen, tab, undefined, true);
        havenZetPlaatsPaneel(tab);
        render();
        return;
      }

      /* Het vaste volle-plaats-vlak ligt als overlay óver de haven — o.a. over
         de palen. Laat je een set lós boven dat vlak, dan zou havenZoneOnderSvg
         hieronder de zone eronder vinden en de set daarheen verplaatsen: hij zou
         dan achter het vlak verdwijnen. Een drop binnen het vlak blijft dus
         gewoon in Vol (de set terug op zijn rij tekenen). */
      if(paneel.id === 'havenVolVlak' && havenBinnenElement(paneel, ev)){
        kaart.classList.remove('wordt-verschoven');
        havenHertekenPlaatsContainer(paneel, zoneId);
        render();
        return;
      }

      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const zone = havenZoneOnderSvg(p.x, p.y);
      if(zone){
        const slot = havenSlotGecentreerd(zone, p.x, p.y, namen);
        if(await havenVerplaatsBakken(namen, zone.id, slot, true)) havenZetPlaatsPaneel(null);
      }
      render();
    };

    document.addEventListener('pointermove', beweeg);
    document.addEventListener('pointerup', los);
    document.addEventListener('pointercancel', los);
  });
}

/* De bakjes van een set, gerangschikt naar hun positiecode: dwarsscheeps
 * (bakboord/midden/stuurboord, tot 3 waarden) en langsscheeps (voor/achter,
 * tot 2 waarden) bepalen samen de plek in het raster, maar welke van de twee
 * de rij is en welke de kolom hangt af van de plaats (vol):
 *
 * - Volle plaats ("lange formatie"/bergvaart, geladen en klaar voor
 *   vertrek): dwars bepaalt de kolom, langs de rij — tot 3 breed x 2 lang,
 *   in de vaarrichting uitgerekt.
 * - Lege plaats en Onderweg ("brede formatie"/daalvaart): dwars bepaalt de
 *   rij, langs de kolom — tot 3 rijen hoog x 2 breed, stuurboord/midden/
 *   bakboord dus elk hun eigen rij, voor/achter ernaast.
 *
 * Ontbreekt een positie, dan gewoon op volgorde.
 *
 * Deze twee stonden verwisseld tot v1.174: de lege plaats/Onderweg hadden
 * toen zelf "dwars bepaalt de kolom" (zoals hierboven nu bij vol staat).
 * Herman controleerde dat na met een setje van vier (SV/SA/BV/BA) en zag dat
 * stuurboord-achter en bakboord-voor daardoor verwisseld op de tegel stonden
 * — pas na een tussenstap waarin per ongeluk bij állebei de plaatsen "dwars
 * bepaalt de rij" kwam te staan (getest en afgekeurd op de volle plaats,
 * die juist "3 breed" nodig heeft) bleek dat de twee plaatsen gewoon
 * omgewisseld moesten worden, niet gelijkgetrokken.
 *
 * De breedte (kolommen) ligt voor de hele tegel vast — niet per rij apart
 * bepaald — zodat twee tegels met dezelfde vorm (bijv. allebei "2 breed")
 * ook pixelgelijk zijn, ongeacht hoeveel bakken ze werkelijk hebben. Eerder
 * werd een onvolledige rij aan het eind ingekort, en oogde een tegel met
 * minder bakken dan zijn eigen rijen aankunnen daardoor smaller. */
function havenBakBlokjes(bakken, valKleur, losSleepbaar, ontbreekt, vol){
  ontbreekt = ontbreekt || [];
  const { raster, breedte, ghostPlek } = havenBakRaster(bakken, losSleepbaar, ontbreekt, vol);

  // Geen inkorting meer: elke rij toont altijd de volle breedte, ook als een
  // cel leeg blijft — anders dan de vaste tegelmaat hierboven belooft.
  return raster.map((rij, r) => {
    const cellen = rij.map((b, k) => ({ b, k, cel: r * breedte + k, ghost: ghostPlek.get(r + ',' + k) }));
    return `<div class="haven-wachtrij-rij">` + cellen.map(({ b, k, cel, ghost }) => b
      // tabindex/role/aria-pressed alleen als het bakje echt los te kiezen is
      // (losSleepbaar) — anders is het hier puur een blokje in een Onderweg-
      // tegel, net als vóór deze wijziging. De baknaam staat al zichtbaar in
      // het bakje; dat is meteen de naam die een schermlezer voorleest.
      // data-cel is de lineaire celindex in de tegel (voor de intra-set swap).
      ? `<span class="haven-wachtrij-bak${losSleepbaar ? ' los' : ''}${
          losSleepbaar && havenGekozenBakken.has(b.sleutel || normalizeBargeName(b.naam)) ? ' gekozen' : ''}${
          b.status === 'repareren' ? ' repareren' : ''}${isDummyName(b.naam) ? ' dummy' : ''}" data-cel="${cel}" data-r="${r}" data-k="${k}" data-zoeksleutel="${esc(b.sleutel || normalizeBargeName(b.naam))}"${
          losSleepbaar ? ` data-losbak="${esc(b.naam)}" data-baksleutel="${esc(b.sleutel || normalizeBargeName(b.naam))}"
             tabindex="0" role="button" aria-pressed="${havenGekozenBakken.has(b.sleutel || normalizeBargeName(b.naam))}"` : ''}` +
        `${b.status === 'repareren' ? ' title="Moet repareren"' : ''} style="border-color:${safeColor(b.kleur || valKleur)}">${
          b.status === 'repareren' ? '<span aria-hidden="true">⚙</span> ' : ''}${esc(bakLabel(b))}${havenBakMerkenHtml(b)}</span>`
      : ghost
        ? `<span class="haven-wachtrij-bak ontbreekt" data-cel="${cel}" data-r="${r}" data-k="${k}" data-zoeksleutel="${esc(normalizeBargeName(ghost.naam || ''))}" title="${esc(havenKomtUitleg(ghost))}">${esc(bakLabel(ghost))}${
            ghost.elders ? `<small class="bak-elders">${esc(ghost.elders)}</small>` : ''}</span>`
        : `<span class="haven-wachtrij-bak leeg" data-cel="${cel}" data-r="${r}" data-k="${k}"></span>`).join('') + `</div>`;
  }).join('');
}

/* Het raster van een tegel zonder de HTML: welke bak in welke cel {r,k}. Los
   van havenBakBlokjes zodat het verslepen vanaf de lege plaats precies de vorm
   kan meenemen die de tegel tekent (zie havenRelatieveIndeling). */
function havenBakRaster(bakken, losSleepbaar, ontbreekt, vol){
  ontbreekt = ontbreekt || [];
  const kolomVeld = vol ? 'dwars' : 'langs';
  const rijVeld = vol ? 'langs' : 'dwars';
  const kolomWaarden = [...new Set(bakken.map(b => ontleedPositie(b.positie)?.[kolomVeld])
                                  .filter(v => v != null))].sort((a,b) => a-b);
  const rijWaarden = [...new Set(bakken.map(b => ontleedPositie(b.positie)?.[rijVeld])
                                  .filter(v => v != null))].sort((a,b) => a-b);
  // Ontbrekende bakken krijgen een eigen plek in het raster, zodat je ziet
  // hoeveel er nog bij moeten en in welke vorm.
  const totaal = bakken.length + ontbreekt.length;
  /* Op de volle plaats leest een tegel van links naar rechts als paren: de
     vertrekboot, en dan setjes van twee. Een set van zes is dus drie paren
     naast elkaar, niet een sliert.

     De positiecodes mogen breder maken (drie dwarsscheepse waarden = drie
     kolommen), maar niet smaller: twee bakken die allebei stuurboord liggen
     gaven één kolom, en dan werd een set van vier een toren van vier hoog.
     Dat is wat er op het scherm een rommeltje van maakte. */
  /* Vaste cellen {r,k} (havenBakPlekOverrides) — overgenomen uit de haven of
     met de hand geschoven — gelden alleen op de volle plaats. Het raster wordt
     er zo nodig breder/hoger voor: twee bakken die in de haven naast elkaar
     lagen moeten hier ook naast elkaar liggen, niet onder elkaar. */
  const vasteCel = b => {
    if(!losSleepbaar || !vol) return null;
    const ov = havenBakPlekOverrides[b.sleutel || normalizeBargeName(b.naam)];
    return ov && Number.isInteger(ov.r) && Number.isInteger(ov.k) ? ov : null;
  };
  const vasteCellen = bakken.map(vasteCel).filter(Boolean);
  /* Op de volle plaats bepaalt de dwars-letter niet meer hoe breed de tegel is
     (fout 20): een set van 4 met S, M en B erin werd 3 breed en kreeg een
     kopbak. Paren: 4 = 2×2 achter + midden, 5 of 6 = 3 breed. Alleen een
     vaste cel (kade-ligging of met de hand) maakt hem breder. */
  const breedte = vol
    ? Math.max(Math.ceil(totaal / 2), 1, ...vasteCellen.map(c => c.k + 1))
    : (kolomWaarden.length || Math.min(2, Math.max(1, bakken.length)));
  const dwarsIsKolom = kolomWaarden.length > 0 && kolomWaarden.length <= breedte;
  const rijen = Math.max(rijWaarden.length, Math.ceil(totaal / breedte),
                         vol && totaal >= 2 ? 2 : 1, ...vasteCellen.map(c => c.r + 1));
  const raster = Array.from({ length: rijen }, () => Array(breedte).fill(null));

  /* Er mag nooit een bak wegvallen.

     De plek in het raster komt uit de positiecode (bakboord/stuurboord ×
     voor/achter), en dat zijn maar vier mogelijkheden. Een set van vijf of zes
     heeft er dus meer dan er codes zijn, en dan kwamen twee bakken op dezelfde
     plek terecht — de tweede overschreef de eerste en verdween stilletjes uit
     de tegel. Is de eigen plek bezet, dan schuift hij nu door naar de eerste
     vrije, desnoods op een nieuwe rij. De tegel wordt dan vanzelf hoger. */
  const eersteVrije = () => {
    for(let r = 0; r < raster.length; r++)
      for(let k = 0; k < breedte; k++)
        if(!raster[r][k]) return { r, k };
    raster.push(Array(breedte).fill(null));
    return { r: raster.length - 1, k: 0 };
  };

  /* Handmatige cel-override eerst (alleen op de volle plaats, waar je bakjes
     kunt verslepen): die bakken gaan op hun gekozen cel, de rest schikt zich
     eromheen. Past de cel niet (bezet of buiten het raster), dan valt de bak
     gewoon terug op de normale plaatsing hieronder. */
  const handmatigGeplaatst = new Set();
  if(losSleepbaar && vol){
    bakken.forEach(b => {
      const ov = vasteCel(b);
      if(!ov) return;
      const { r, k } = ov;
      if(r >= 0 && r < raster.length && k >= 0 && k < breedte && !raster[r][k]){
        raster[r][k] = b;
        handmatigGeplaatst.add(b);
      }
    });
  }

  bakken.forEach((b, i) => {
    if(handmatigGeplaatst.has(b)) return;   // al op zijn gekozen cel gezet
    const p = ontleedPositie(b.positie);
    /* Zonder positiecode: op de volle plaats kolom voor kolom (paren onder
       elkaar — B1/B2, C1/C2, zoals ze in het echt liggen), op de lege plaats
       rij voor rij in leesvolgorde. Tot 1.211 las de volle plaats óók over de
       rijen, en dan lagen de paren dwars op de werkelijkheid. */
    const valR = vol ? (i % rijen) : Math.floor(i / breedte);
    const valK = vol ? Math.floor(i / rijen) : (i % breedte);
    let r = p && rijWaarden.length ? Math.max(0, rijWaarden.indexOf(p[rijVeld])) : valR;
    let k = p && dwarsIsKolom ? Math.min(breedte - 1, Math.max(0, kolomWaarden.indexOf(p[kolomVeld]))) : valK;
    const zes = vol && totaal === 6 && p && HAVEN_VOL_ZES[p.code];
    if(zes && breedte === 3 && raster.length === 2){ r = zes.r; k = zes.k; }
    if(!raster[r] || raster[r][k]) ({ r, k } = eersteVrije());
    raster[r][k] = b;
  });
  /* De open plekken vullen we van achteren naar voren op, want wat mist is
     wat er nog bij moet — dat sluit achteraan aan. De naam van de bak die
     daar hoort te komen zetten we er meteen bij: een leeg streepjesvakje
     vertelt je wel dát er iets mist, maar niet wát, en daar heb je op de kade
     niets aan. Toewijzen gebeurt in leesvolgorde, zodat de namen in dezelfde
     volgorde staan als in de lijst eronder. */
  // Op de volle plaats voorspellen we waar ze komen (blokjes, set van zes).
  if(vol) return { raster, breedte, ghostPlek: havenVoorspelGhosts(raster, breedte, ontbreekt, totaal) };
  let nogTeVullen = ontbreekt.length;
  const ghostPlek = new Map();
  const achterstevoren = [];
  for(let r = raster.length - 1; r >= 0 && nogTeVullen > 0; r--){
    for(let k = breedte - 1; k >= 0 && nogTeVullen > 0; k--){
      if(raster[r][k]) continue;
      achterstevoren.push([r, k]);
      nogTeVullen--;
    }
  }
  achterstevoren.sort((a, b) => a[0] - b[0] || a[1] - b[1])
                .forEach(([r, k], i) => ghostPlek.set(r + ',' + k, ontbreekt[i]));

  return { raster, breedte, ghostPlek };
}

/* Hoeveel bakken hoort deze set volgens de VH/HGK-lijst te hebben?

   Op de volle bakkenplaats ligt een set klaar om te vertrekken. Staat er in de
   lijst dat de boot met vier bakken gaat en liggen er pas drie, dan mist er
   eentje — en dat moet je zien vóórdat de boot komt, niet erna. De ontbrekende
   plekken worden als ghost getekend. */
function havenSetVerwacht(setKey){
  let aantal = 0;
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.forEach(v => {
      if(!v.naam) return;
      if(bakGroupKey(v, bron) === setKey) aantal++;
    });
  });
  return aantal;
}

/* Een set die de haven uit is.

   De volle bakkenplaats is een wachtruimte: daar liggen geladen bakken tot hun
   boot ze komt halen. Zonder een manier om ze weg te halen loopt die plaats
   eindeloos vol, want afronden zet er juist bakken bíj. Sleep een tegel naar
   het vertrekvak onderin en de set is weg uit de haven: geen ligplaats meer,
   niet meer aangemeerd, en dus ook uit de tekening.

   De rit zelf blijft staan waar hij stond — in de historie als hij afgerond
   was, in de planlijst als dat nog niet zo is. Vertrokken gaat over waar de
   bakken liggen, niet over of het werk af is. */
async function havenLaatSetVertrekken(setKey){
  /* De sleutel komt van de tegel die je naar het vertrekvak sleept. Op de volle
     plaats is dat de vertrekset (vertrekboot + vertrektijd), op de lege de
     aankomsttegel — havenPlaatsGroepKey kent het verschil. De rem hieronder
     blijft ongewijzigd: een rit gaat alleen op "niet aangemeerd" als er écht
     niets meer van in de haven ligt. */
  return havenVertrekBakken(
    havenBakkenMetPlek().filter(b => havenPlaatsGroepKey(b) === setKey && b.plek));
}

/* Eén of een paar losse bakken laten vertrekken, in plaats van een hele tegel.
   Pak je op de volle plaats één bakje beet en sleep je dat naar het vertrekvak,
   dan gaat alleen die bak de haven uit — je hoeft niet de hele tegel te pakken
   (en de meeste tegeloppervlakte ís bakje, dus dat is wat je vanzelf vastpakt). */
async function havenLaatBakkenVertrekken(namen){
  const sleutels = new Set(namen.map(normalizeBargeName));
  return havenVertrekBakken(
    havenBakkenMetPlek().filter(b => sleutels.has(b.sleutel) && b.plek));
}

/* Idee 5: een set op Vol weggeveegd. Nog bakken onderweg (ghosts in de
   tegel)? Eerst vragen. Daarna vertrekken met "Ongedaan maken": dat zet de
   ligplaatsen, vaste plekken in de tegel en de reizen precies terug. */
async function havenVeegVertrek(kaart, setKey, paneel, zoneId){
  const bakken = havenBakkenMetPlek().filter(b => havenPlaatsGroepKey(b) === setKey && b.plek);
  if(!bakken.length) return false;
  const boot = bakken[0].vertrekboot || '?';
  const mist = kaart.querySelectorAll('.haven-wachtrij-bak.ontbreekt').length;
  if(mist && !await vraagBevestiging({
    titel: `${boot} is nog niet compleet`,
    tekst: `Er ${mist === 1 ? 'is nog 1 bak' : `zijn nog ${mist} bakken`} onderweg voor deze set. Toch laten vertrekken?`,
    bevestig: 'Toch vertrekken', annuleer: 'Nee'
  })) return false;
  const kopie = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
  const was = bakken.map(b => ({ sl: b.sleutel, pos: kopie(havenPosities[b.sleutel]), plek: kopie(havenBakPlekOverrides[b.sleutel]) }));
  const ids = new Set(bakken.map(b => b.tripId).filter(Boolean));
  const reizen = trips.filter(t => ids.has(t.id))
    .map(t => ({ t, aangemeerd: t.aangemeerd, klaar: t.klaarOmTeLaden, inHaven: kopie(t.bakkenInHaven) }));
  if(!await havenVertrekBakken(bakken)) return false;
  havenHertekenPlaatsContainer(paneel, zoneId);
  render();
  showToast(`${boot} is vertrokken — ${bakken.length} bak${bakken.length === 1 ? '' : 'ken'} uit de haven.`, async () => {
    was.forEach(w => {
      if(w.pos) havenPosities[w.sl] = w.pos; else delete havenPosities[w.sl];
      if(w.plek) havenBakPlekOverrides[w.sl] = w.plek;
    });
    reizen.forEach(r => {
      r.t.aangemeerd = r.aangemeerd; r.t.klaarOmTeLaden = r.klaar;
      if(r.inHaven !== undefined) r.t.bakkenInHaven = r.inHaven;
    });
    await logAction(`Haven: vertrek van "${boot}" ongedaan gemaakt`);
    await saveHavenPosities();
    await saveHavenBakPlekOverrides();
    await saveTrips();
    havenVergeetBerekening();
    render();
  });
  return true;
}

async function havenVertrekBakken(bakken){
  if(!bakken.length) return false;

  const boot = bakken[0].vertrekboot || '?';
  await logAction(`Haven: set "${boot}" vertrokken (${bakken.map(b => b.naam).join(', ')})`);

  /* Per bak wegzetten, niet per tegel. Een tegel kan meer dan één set bevatten
     — drie erts en één kolen bijvoorbeeld — en dan zou "niet meer aangemeerd"
     ook de andere set uit de haven halen. De ligplaats krijgt daarom een eigen
     stand: vertrokken. Een bak met die stand telt niet mee in de haven, en hij
     verdwijnt zodra hij ergens anders wordt neergelegd of zijn tegel weer op
     aanwezig gaat. */
  const nu = Date.now();
  bakken.forEach(b => { havenPosities[b.sleutel] = { zone: HAVEN_VERTROKKEN, sinds: nu }; });
  // Vertrokken: de vaste plek in de tegel (kopbak e.d.) vervalt; bij een volgende
  // planning komt hij vers binnen (1.340).
  bakken.forEach(b => { delete havenBakPlekOverrides[b.sleutel]; });
  await saveHavenBakPlekOverrides();

  // Is er van een rit niets meer over in de haven, dan klopt "aanwezig" ook
  // niet meer.
  const nogBinnen = new Set(havenBakken().map(b => b.tripId).filter(Boolean));
  new Set(bakken.map(b => b.tripId).filter(Boolean)).forEach(id => {
    if(nogBinnen.has(id)) return;
    const t = trips.find(x => x.id === id);
    if(!t) return;
    t.aangemeerd = false;
    t.klaarOmTeLaden = false;
    delete t.bakkenInHaven;
  });

  await saveHavenPosities();
  await saveTrips();
  showToast(`${boot} is vertrokken — ${bakken.length} bak${bakken.length === 1 ? '' : 'ken'} uit de haven.`);
  return true;
}

/* Eén set naar een andere rij op dezelfde bakkenplaats verslepen, zonder dat
   iets anders vanzelf meeschuift.

   "Op iedere rij een tegel kunnen neerzetten, zonder dat ze automatisch
   aansluiten" betekent: een rij die leeg is, blijft leeg tot je er zelf iets
   neerlegt, en een set die je ergens weghaalt laat geen gat achter dat de rest
   opvult. Er is dus maar één ander stuk grond waar deze aanroep tegenaan kan
   lopen: een set die al op de doelrij ligt. Dan mag precies díe ene buur één
   stap opzij, in de richting waar de gesleepte set vandaan komt, áls daar
   plek voor is — past dat niet, of raakt de buur zelf weer een derde set, dan
   gebeurt er niets en meldt de aanroeper (havenKoppelPaneelSlepen) waarom.

   Kolom en vorm blijven zoals ze waren: alleen de rij verandert, dus het
   anker is dezelfde meest-westelijke kolom die de set al had. */
async function havenSchuifSetNaarRij(zoneId, setKey, doelRij){
  const zone = havenZone(zoneId);
  if(!zone) return false;
  const alle = havenBakkenMetPlek().filter(b => b.zone === zoneId && b.plek);
  const eigen = alle.filter(b => havenPlaatsGroepKey(b) === setKey);
  if(!eigen.length) return false;

  const eigenMinRij = Math.min(...eigen.map(b => b.plek.rij));
  const eigenMinKol = Math.min(...eigen.map(b => b.plek.kol));
  const hoogte = Math.max(...eigen.map(b => b.plek.rij)) - eigenMinRij + 1;
  const eigenNamen = eigen.map(b => b.naam);
  if(doelRij === eigenMinRij) return true;   // niet verplaatst

  const kolommen = havenZoneKolommen(zone);
  const rijenInZone = Math.max(1, Math.floor(havenZoneSlots(zone).length / kolommen));
  const doelMin = doelRij, doelMax = doelRij + hoogte - 1;
  if(doelMin < 0 || doelMax >= rijenInZone) return false;

  // De andere sets op deze plaats, elk met hun eigen rij-bereik.
  const perAndereSet = new Map();
  alle.forEach(b => {
    const bk = havenPlaatsGroepKey(b);
    if(bk === setKey) return;
    if(!perAndereSet.has(bk)) perAndereSet.set(bk, []);
    perAndereSet.get(bk).push(b);
  });
  const anderen = [...perAndereSet.entries()].map(([key, bakken]) => ({
    key, namen: bakken.map(b => b.naam),
    minRij: Math.min(...bakken.map(b => b.plek.rij)),
    maxRij: Math.max(...bakken.map(b => b.plek.rij)),
    minKol: Math.min(...bakken.map(b => b.plek.kol))
  }));
  const overlapt = (a1, a2, b1, b2) => a1 <= b2 && b1 <= a2;

  const zetOpRij = (namen, kol, rij) => {
    const slot = havenZoneSlots(zone).find(s => s.rij === rij && s.kol === kol);
    return slot ? havenVerplaatsBakken(namen, zoneId, slot.index, false, null, true) : false;
  };

  const overlappers = anderen.filter(o => overlapt(doelMin, doelMax, o.minRij, o.maxRij));
  if(!overlappers.length) return zetOpRij(eigenNamen, eigenMinKol, doelMin);
  if(overlappers.length > 1) return false;   // meer dan één buur geraakt: niet doen

  const buur = overlappers[0];
  const buurHoogte = buur.maxRij - buur.minRij + 1;
  const richting = doelMin < eigenMinRij ? 'omhoog' : 'omlaag';
  const buurNieuwMin = richting === 'omhoog' ? doelMax + 1 : doelMin - buurHoogte;
  const buurNieuwMax = buurNieuwMin + buurHoogte - 1;
  if(buurNieuwMin < 0 || buurNieuwMax >= rijenInZone) return false;
  // De buur mag zelf ook niemand anders raken op zijn nieuwe plek.
  if(anderen.some(o => o.key !== buur.key && overlapt(buurNieuwMin, buurNieuwMax, o.minRij, o.maxRij))) return false;

  const buurGelukt = await zetOpRij(buur.namen, buur.minKol, buurNieuwMin);
  if(!buurGelukt) return false;
  return zetOpRij(eigenNamen, eigenMinKol, doelMin);
}

function havenPlaatsSets(zoneId){
  const sets = new Map();
  havenBakkenMetPlek().forEach(b => {
    if(b.zone !== zoneId || !b.plek) return;
    const sleutel = havenPlaatsGroepKey(b);
    if(!sets.has(sleutel)) sets.set(sleutel, { key:sleutel, bakken:[] });
    sets.get(sleutel).bakken.push(b);
  });
  // De volgorde volgt de ligging: bovenste rij eerst, dan van links naar rechts.
  return [...sets.values()].map(s => {
    s.bakken.sort((a, b) => a.plek.rij - b.plek.rij || a.plek.kol - b.plek.kol);
    s.vertrekboot = s.bakken[0].vertrekboot;
    /* Hier stond ook een lijst vertrekboten voor de tabjes onder een tegel in
       de kolom. Die tabjes staan sinds v1.184 in de haventekening zelf (zie
       havenTekenTegelsInTekening), en deze lijst werd nergens meer gelezen —
       met als extra risico dat hij nog het oude `vertrekboot`-veld gebruikte,
       dat terugvalt op het aankomstschip. Weggehaald. */
    s.aankomstschip = s.bakken.map(b => b.aankomstschip).find(Boolean) || null;
    // Het echte rij-/kolombereik van deze set — de tegel wordt hierop
    // gepositioneerd (zie havenPlaatsTegel/havenZetPlaatsPaneel). Een "fles"
    // (twee rijen diep) krijgt zo een tegel die twee rijen hoog is, niet één.
    s.rij = Math.min(...s.bakken.map(b => b.plek.rij));
    s.hoogte = Math.max(...s.bakken.map(b => b.plek.rij)) - s.rij + 1;
    s.kol = Math.min(...s.bakken.map(b => b.plek.kol));
    return s;
  /* Eerst de rij, dan de kolom. Twee sets kunnen náást elkaar in dezelfde rij
     liggen, en zonder die tweede vergelijking lag hun volgorde vast op de
     volgorde waarin ze toevallig uit de haven kwamen rollen. Bij het
     herschikken zag je de tegels dan in de ene volgorde staan en kwamen ze in
     een andere terug. */
  }).sort((a, b) => a.rij - b.rij || a.kol - b.kol);
}

function havenTekenPlaatsTabs(){
  const balk = document.getElementById('havenPlaatsTabs');
  if(!balk) return;
  // De volle bakkenplaats staat sinds het herontwerp als vast vlak onder de
  // tekening (havenTekenVolVlak); de aan/uit-knop die het oude paneel opende is
  // daarmee vervallen. Op telefoon is deze balk sowieso verborgen en loopt
  // 'vol' via het mobiele tabblad. De balk blijft leeg in de DOM staan.
  balk.innerHTML = '';
}

/* Eén tegel in een bakkenplaats-paneel. Lege plaats leest bakken-eerst (wát
 * ligt er), volle plaats boot-eerst in paren van twee (wíé vertrekt, is de set
 * compleet). Ontbrekende bakken krijgen een eigen vakje met wie ze brengt.
 * Elke tegel staat op zijn eigen rij (top/px, absolute binnen een relative
 * .haven-plaatsinhoud — zie havenZetPlaatsPaneel) zodat niets dichtschuift.
 * Zie docs/NOTITIES.md — havenPlaatsTegel. */
/* Welke bakken horen bij deze kleurset volgens de VH/HGK-lijst? havenSetVerwacht
   telt ze al; dit geeft ook de namen, want "er mist er één" zonder te zeggen
   welke is maar de helft van het antwoord. */
function havenSetLeden(setKey){
  const namen = [];
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    (lijst || []).forEach(v => {
      if(!v.naam) return;
      if(bakGroupKey(v, bron) === setKey) namen.push(v.naam);
    });
  });
  return namen;
}

/* Waar ligt een bak op dit moment? In zonetaal, niet in stationtaal: je wilt
   weten waar je hem moet halen. */
const HAVEN_PLEKNAAM = { 'b2b3-kade':'kade B2/B3', 'b4-kade':'kade B4',
                         'leeg':'lege plaats', 'vol':'volle plaats', 'palen':'de palen' };
function havenWaarLigt(naam){
  const sleutel = normalizeBargeName(naam);
  const inHaven = havenBakkenMetPlek().find(b => normalizeBargeName(b.naam) === sleutel);
  if(inHaven) return HAVEN_PLEKNAAM[inHaven.zone] || inHaven.zone;
  const onderweg = havenWachtrij().some(set => set.bakken.some(b => b.sleutel === sleutel));
  return onderweg ? 'onderweg' : null;
}

/* Wat mist er nog aan deze tegel, en waar ligt dat dan? Per kleurset, want
   dat is de eenheid die samen vertrekt. Eén tegel kan meerdere kleursets
   bevatten — dezelfde optelling die havenPlaatsTegel voor het aantal doet. */
function havenSetOntbreekt(bakken){
  const aanwezig = new Set(bakken.map(b => normalizeBargeName(b.naam)));
  const uit = [];
  [...new Set(bakken.map(b => b.setKey))].forEach(key => {
    havenSetLeden(key).forEach(naam => {
      if(aanwezig.has(normalizeBargeName(naam))) return;
      if(uit.some(x => normalizeBargeName(x.naam) === normalizeBargeName(naam))) return;
      uit.push({ naam, waar: havenWaarLigt(naam), positie: havenPositieUitLijst(naam), blok: havenBlokVan(naam), ...havenKomtMet(naam) });
    });
  });
  return uit;
}

/* Ligt deze bak al ergens in de haven? Zo ja, waar — in gewoon Nederlands.
   "onderweg" telt hier niet als liggen: dan is de vraag juist wie hem brengt
   en hoe laat, en dat is precies wat er dan moet staan. */
function havenLigtOp(waar){
  if(!waar || waar === 'onderweg') return null;
  return `ligt op ${/^(de |kade )/.test(waar) ? '' : 'de '}${waar}`;
}

/* Wie brengt deze bak, en hoe laat? Staat in de VH/HGK-lijst: bij elke bak
   het aankomstschip met zijn tijd. Ligt hij al ergens in de haven, dan is dat
   het antwoord — zie havenWaarLigt. */
function havenKomtMet(naam){
  const sleutel = normalizeBargeName(naam);
  for(const lijst of [vhBakken, hgkBakken]){
    const v = (lijst || []).find(x => x.naam && normalizeBargeName(x.naam) === sleutel);
    // elders: laadt deze bak volgens de lijst ergens anders (Gent/EBS/EMO/
    // Terneuzen/Hoge Waard)? Dan hoort dat in het ghost-vakje, zodat je ziet
    // waaróm de bak hier nog niet ligt.
    if(v) return { boot: v.schip || null, tijd: v.tijd || null, elders: plekNuBuitenDeHaven(v) || null };
  }
  return { boot: null, tijd: null, elders: null };
}

/* Eén regel tekst over een bak die er nog niet is — ook gebruikt als titel
   op het spookvakje zelf, want daar past alleen de naam. */
function havenKomtUitleg(o){
  if(!o) return '';
  const waar = havenLigtOp(o.waar);
  if(waar) return `${o.naam} ${waar}`;
  if(o.boot) return `${o.naam} komt met ${o.boot}${o.tijd ? ' om ' + o.tijd : ''}`;
  return `${o.naam} — aankomst onbekend`;
}

function havenPlaatsTegel(s, vol, idx){
  /* havenSetVerwacht() telt per vertrekset ("welke bakken vertrekken samen").
     Een volle-plaats-tegel groepeert sinds de regrouping (na v1.302) óók op
     vertrek (havenPlaatsGroepKey → setKey), dus normaal is dit één sleutel.
     Heb je zelf een bak bij een andere set gelegd (override), dan kan de tegel
     bakken met een andere oorspronkelijke setKey bevatten; de som over de
     aanwezige setKeys telt die correct mee. */
  const verwacht = vol
    ? [...new Set(s.bakken.map(b => b.setKey))].reduce((n, k) => n + havenSetVerwacht(k), 0)
    : 0;
  const tekort = Math.max(0, verwacht - s.bakken.length);
  /* Een vertrekset is 2 breed × 3 lang = ten hoogste 6 bakken. Komen er toch
     meer op één tegel terecht — bijvoorbeeld bakken zonder vertrekinfo die in
     de verzamelsleutel "VH||" samenklonteren, of een foutieve lijst — dan is
     dat geen geldige set en moet het opvallen, niet stilweg samengevoegd worden
     tot "4 van 8". Zie bug-melding na v1.302, punt 3. */
  const teveel = vol && Math.max(s.bakken.length, verwacht) > 6;
  /* De bakken die er nog niet zijn, mét wie ze brengt en hoe laat. Ze krijgen
     een spookvakje ín de tegel (op hun eigen plek in de formatie) en daarnaast
     een regel eronder — het vakje toont de naam, de regel de herkomst. */
  const ontbreekt = vol ? havenSetOntbreekt(s.bakken).slice(0, tekort || undefined) : [];
  const blokjes = havenBakBlokjes(s.bakken, null, true, ontbreekt, vol);
  const boot = esc(verkortSchipnaam(s.vertrekboot) || '?');
  const schip = esc(verkortSchipnaam(s.aankomstschip) || verkortSchipnaam(s.vertrekboot) || '?');
  /* Het aantal staat er alleen bij vanaf drie bakken. Bij één of twee zie je
     in één oogopslag wat er ligt en is het getal alleen maar drukte; vanaf
     drie wil je weten hoeveel er hóren te liggen. */
  const telling = Math.max(s.bakken.length, verwacht) >= 3
    ? `${s.bakken.length}${tekort ? ' van ' + verwacht : ''} bakken`
    : '';

  /* Twee dingen die hier tot 1.199 stilzwijgend misgingen.

     Eén: bij een tekort verschenen er spookplekjes in het raster, maar zonder
     naam. Dan weet je wel dát er iets mist en niet wát, laat staan waar je het
     moet halen. Nu staan ze eronder, met hun plek erbij.

     Twee: verwacht is 0 zodra de bakken niet in de VH/HGK-lijst staan — dan
     heeft de set een LOS-sleutel in plaats van een kleurgroep. De tegel zei
     dan gewoon "4 bakken", alsof dat het hele stel was. Dat is geen weten maar
     niet-weten, en dat hoort er te staan. */
  const aantalOnbekend = vol && verwacht === 0 && s.bakken.length >= 2;
  /* De ontbrekende bakken staan al als ghost op hun eigen plek ín de set, mét
     hun naam (zie havenBakBlokjes). De losse "wacht op: …"-regel eronder is op
     verzoek vervallen — de naam hoort in de ghost-positie, niet onder de tegel.
     "aantal onbekend" blijft: dat is niet-weten, geen naam. */
  const mistHtml = teveel
    ? `<div class="plaats-mist fout" title="Een vertrekset telt hoogstens 6 bakken (2 breed × 3 lang). Hier staan er meer — waarschijnlijk bakken zonder vertrekboot/-tijd die samenvallen, of een afwijking in de VH/HGK-lijst. Controleer de lijst of leg de losse bakken bij hun eigen set.">⚠ ${s.bakken.length} bakken — meer dan 6, controleer de lijst</div>`
    : aantalOnbekend
    ? `<div class="plaats-mist onbekend" title="Deze bakken staan niet in de VH- of HGK-lijst, dus de app weet niet hoeveel er bij dit stel horen. Lees die lijst in en het vult zich vanzelf.">aantal onbekend</div>`
    : '';

  /* Geen height meer hier: die dwong elke tegel op een volle vaste rijmaat,
     ook een tegeltje van 2 bakken dat aan een fractie daarvan genoeg heeft —
     de tegel omkadert nu gewoon zijn eigen inhoud, net als in de Onderweg-
     kolom. top is hier nog een grove schatting (PANEEL_RIJ_SCHATTING_PX):
     havenZetPlaatsPaneel meet elke tegel meteen na het tekenen echt op en
     zet 'm dan definitief op zijn rij, dicht op de vorige. */
  const schuif = ` style="top:${s.rij * PANEEL_RIJ_SCHATTING_PX}px"`;

  return vol
    ? `<div class="haven-wachtrij-set plaats-set vol-set${idx % 2 === 1 ? ' verstek' : ''}${teveel ? ' fout' : ''}" data-plaatsset="${esc(s.key)}"${schuif}>
         <div class="plaats-schip">
           <div class="haven-wachtrij-schip">${boot}</div>
         </div>
         <div class="plaats-bakken">${blokjes}</div>
         ${mistHtml}
       </div>`
    : `<div class="haven-wachtrij-set plaats-set" data-plaatsset="${esc(s.key)}"${schuif}>
         <div class="plaats-bakken">${blokjes}</div>
         <div class="plaats-schip">
           <div class="haven-wachtrij-schip">${schip}</div>
           ${telling ? `<div class="haven-wachtrij-tijd">${telling}</div>` : ''}
         </div>
       </div>`;
}
/* De duwboot-tabjes stonden hier eerst ook, onder elke tegel in de lege
   kolom. Op verzoek weggehaald: die kolom toont alleen de baknamen met hun
   kleur en het aankomstschip. De tabjes horen bij de tegels in de haven zelf
   — zie havenTekenTegelsInTekening(). */

/* Bouwt de kop + tegel-inhoud van een bakkenplaats (leeg of vol) in
   `container` — alleen de inhoud, niet het tonen/verbergen/schuiven/de greep
   (dat is aan de aanroeper). Gedeeld door havenZetPlaatsPaneel (het
   in/uitschuivende paneel: altijd voor vol, en voor leeg op telefoonbreedte)
   en havenTekenLegeKolom (de permanente kolom voor leeg op een breed scherm)
   — één meet-en-pak-implementatie voor allebei, in plaats van twee die uit
   elkaar kunnen lopen.

   opties:
   - extraHtml: extra HTML aan het eind (het paneel gebruikt dit voor de
     schuifgreep-knoppen; de vaste kolom laat dit weg).
   - autoBreedte: meet de breedste tegel en zet die als style.width — voor
     het paneel (dat geen vaste CSS-breedte heeft); de kolom laat dit weg.
   - schaduw: teken op elke lege rij een aantikbare .plaats-schaduw (alleen
     zichtbaar zolang er iets gekozen staat, zie havenVerversSchaduw) — alleen
     voor de permanente kolom, niet voor het paneel. */
function havenVulPlaatsContainer(id, container, opties){
  opties = opties || {};
  const zone = havenZone(id);
  const vol = id === 'vol';
  const sets = havenPlaatsSets(id);

  /* De tegels stonden hier onderling verspringend, elk met een verstek-marge
     die hun kolom op de plaats nabootste. Dat leverde een rafelrand op in
     plaats van een leesbare lijst, en op verzoek staan ze nu — net als in de
     lege kolom — netjes onder elkaar uitgelijnd. Welke kolom een set echt
     inneemt lees je in de haventekening zelf; dit paneel is een lijst.

     Daarmee vervalt ook het zijwaarts slepen: elke sleep binnen het paneel
     gaat voortaan over de rij (zie havenKoppelPaneelSlepen). */

  const kolommenInZone = havenZoneKolommen(zone);
  const plekken = havenZoneSlots(zone).length;
  const rijenInZone = Math.max(1, Math.floor(plekken / kolommenInZone));
  const bezet = havenBakkenMetPlek().filter(b => b.zone === id && b.plek).length;

  /* Het raster reserveerde altijd de volle zonediepte (bijv. 22 rijen op de
     lege plaats) — ook met maar één setje erop. Dat is precies wat het paneel
     "veel te groot" maakte: een enkel tegeltje boven een verder lege
     scrollende vlakte. Nu alleen zo diep als er al ligt plus twee rijen
     speelruimte om iets nieuws neer te zetten — verder scrollen kan nog
     steeds, want havenSchuifSetNaarRij begrenst niet op wat er nu getekend
     wordt, en de volgende hertekening (bijv. na het slepen naar een verder
     gelegen rij) groeit gewoon mee. */
  const rijenGebruikt = sets.length ? Math.max(...sets.map(s => s.rij + s.hoogte)) : 0;
  /* De volle plaats toont altijd al zijn posities (de volle zonediepte, 12
     rijen) — ook als er maar een paar bezet zijn, zodat je standaard 12 plekken
     ziet om een vertrekset neer te leggen (keuze Herman, okt 2026). De lege
     plaats blijft meegroeien met wat er ligt plus wat speelruimte, anders wordt
     dat paneel onnodig lang. */
  const rijenGetekend = (vol || id === 'palen')
    ? rijenInZone
    : Math.min(rijenInZone, Math.max(rijenGebruikt + 4, 4));

  /* Het raster staat er nu altijd (ook zonder één tegel erop) — anders is er
     bij een helemaal lege plaats nergens om een schaduwvak (opties.schaduw)
     op te tekenen zodra je voor het eerst iets kiest. "Hier ligt niets" blijft
     als aparte regel ernaast staan wanneer dat zo is. */
  container.innerHTML = `
    <div class="haven-plaatskop">
      <span>${esc(zone.label)}</span>
      <span class="haven-plaatsvrij">${bezet} van ${plekken} plekken bezet</span>
    </div>
    <div class="haven-plaatsinhoud${vol ? ' naar-oost' : ''}">
      ${!sets.length ? '<p class="haven-wachtrij-leeg">Hier ligt niets.</p>' : ''}
      <div class="haven-plaatsraster" style="height:${rijenGetekend * PANEEL_RIJ_SCHATTING_PX}px">${
        sets.map((s, i) => havenPlaatsTegel(s, vol, i)).join('')}</div>
    </div>${vol ? `
    <div class="haven-vertrekvak" id="havenVertrekvak">
      <span>⤴ Vertrokken</span>
      <small>sleep een tegel hierheen als de boot hem heeft opgehaald</small>
    </div>` : ''}${opties.extraHtml || ''}`;

  /* Het paneel stond vast op de helft van het canvas (zie de CSS), los van
     wat erin staat — voor een paar tegels bleef zo een groot leeg stuk over
     tot aan de greep. Nu past hij zich aan de breedste tegel aan. Zonder
     tegels (of vlak na openen, vóór de eerste meting) valt hij terug op de
     CSS-breedte. Alleen voor het paneel — de vaste kolom heeft al een eigen
     CSS-breedte.

     De extra ruimte die hier vroeger bij kwam was voor de zijwaartse
     verstek-verschuiving. Die bestaat niet meer (de tegels staan onder elkaar
     uitgelijnd), dus die reserve ook niet. */
  if(opties.autoBreedte){
    container.style.width = '';
    const tegelsVoorBreedte = [...container.querySelectorAll('.plaats-set')];
    if(tegelsVoorBreedte.length){
      const breedsteTegel = Math.max(...tegelsVoorBreedte.map(t => t.offsetWidth));
      const chrome = 40; // padding van .haven-plaatsinhoud + wat lucht
      container.style.width = Math.round(breedsteTegel + chrome) + 'px';
    }
  }

  /* Nu elke tegel al eenmaal getekend is (en dus een echte offsetHeight
     heeft), de rijen dicht inpakken: de rand van de ene tegel bepaalt de
     afstand tot de volgende, niet een vast rijgetal. Rijen zonder tegel
     blijven een kleinere, maar nog altijd aantikbare band (PANEEL_LEGE_RIJ_PX)
     — anders is er nergens meer lege rij om een tegel op te leggen. Alles
     gebeurt in dezelfde synchrone doorloop als de breedtemeting hierboven,
     dus er is geen zichtbare tussenstap: de browser tekent pas de uiteindelijke
     stand. havenPlaatsRijTops onthoudt het resultaat voor havenKoppelPaneelSlepen
     (havenRijVoorTop), dat bij het loslaten van een sleep dezelfde rijen
     moet kunnen terugvinden.

     Twee sets kunnen dezelfde rij delen zonder elkaar te raken — ze liggen
     dan in een andere kolom, zoals de bakkenplaats-plekken dat toestaan. Deze
     weergave heeft daar geen naast-elkaar-lay-out voor: alle tegels beginnen
     links. Zo'n tweede tegel krijgt hier dus gewoon zijn eigen volgende regel,
     meteen ná de eerste, precies zoals de tekst er zelf al over zegt: "de bakken van
     alle tegels [staan] onder elkaar uitgelijnd en je leest de plaats als een
     lijst" (zie de toelichting boven havenPlaatsTegel). Eerst alles op de rij
     eronder proberen te persen gaf ze allebei dezelfde top en dus zichtbare
     overlap. */
  const tegels = [...container.querySelectorAll('.plaats-set')];
  const tegelPerSleutel = new Map(tegels.map(t => [t.dataset.plaatsset, t]));
  // sets staat al gesorteerd op rij (dan kolom) — zie havenPlaatsSets.
  /* Een lege rij: op de volle én (sinds v1.309) de lege plaats een échte
     rij, zo hoog als een set — dezelfde ghosts op beide plaatsen. Op de palen
     ligt één bak per rij, daar volstaat de smalle band. */
  const legeRijPx = id === 'palen' ? PANEEL_LEGE_RIJ_PX : PANEEL_VOLLE_LEGE_RIJ_PX;
  const rijTops = [];
  let y = 0, volgende = 0;
  for(let r = 0; r < rijenGetekend; r++){
    let gezien = false;
    while(volgende < sets.length && sets[volgende].rij === r){
      const s = sets[volgende++];
      const el = tegelPerSleutel.get(s.key);
      const hoogte = el ? el.offsetHeight : PANEEL_LEGE_RIJ_PX;
      if(el) el.style.top = y + 'px';
      if(!gezien) rijTops[r] = y;
      // Een "fles" (s.hoogte > 1) loopt door in de rij(en) erna — die
      // krijgen, als er zelf nog niets anders op ligt, dezelfde beginhoogte
      // in plaats van een eigen lege-rij-toeslag erbovenop.
      for(let k = 1; k < s.hoogte; k++){ if(rijTops[r + k] == null) rijTops[r + k] = y; }
      y += hoogte + PANEEL_TEGEL_GAP_PX;
      gezien = true;
    }
    if(!gezien && rijTops[r] == null){
      rijTops[r] = y;
      y += legeRijPx + PANEEL_TEGEL_GAP_PX;
    }
  }
  const raster = container.querySelector('.haven-plaatsraster');
  if(raster) raster.style.height = Math.max(0, y - PANEEL_TEGEL_GAP_PX) + 'px';
  havenPlaatsRijTops = rijTops;

  /* Schaduwvakken: één per lege rij, met de eerste slot-index van die rij
     (kolom 0) als bestemming — zelfde aanpak als zetOpRij() in
     havenSchuifSetNaarRij gebruikt voor een specifieke rij. Onzichtbaar tot
     .toont-schaduw op de kolom staat (havenVerversSchaduw), dus dit hoeft
     niet bij elke keuzewijziging opnieuw getekend te worden. */
  if(opties.schaduw && raster){
