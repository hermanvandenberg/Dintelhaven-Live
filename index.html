  t.classList.add('weg');
  const weg = () => t.remove();
  t.addEventListener('transitionend', weg, { once: true });
  setTimeout(weg, 400);
}

</script>

<script>
/* Auteur: HvdB */
/* ═══════════════════════════════════════════════════════════════════
   HAVEN — TOP-DOWN WEERGAVE VAN DE DINTELHAVEN          [blok: begin]

   Zelfstandig blok. Wil je dit later in een eigen bestand zetten, dan
   verhuist alles tussen [blok: begin] en [blok: einde], plus deze
   gedeelde helpers uit de rest van index.html:

     normalizeBargeName, isDummyName, esc, loadJson/saveJson,
     getEffectiveGroupForRow, bakGroupKey, trips, saveTrips, render

   De koppelpunten met de rest van de app staan met HAVEN-KOPPELING
   gemarkeerd; dat zijn de enige plekken buiten dit blok.

   Uitgangspunt: waar een bak ligt is een eigenschap van de BAK, niet
   van de tegel. Daarom staan posities in een eigen opslag op baknaam.
   Zo overleven ze een her-import (die vervangt trip.rows volledig) en
   hoeft een tegel niet te splitsen als zijn bakken verspreid liggen.
   ═══════════════════════════════════════════════════════════════════ */

// --- Indeling van de haven -----------------------------------------
// Voorlopige maatvoering. Alle coördinaten liggen binnen breedte×hoogte;
// vervang de getallen zodra de echte plattegrond er is. De rest van de
// code leest uitsluitend uit deze lijst en kent geen vaste plekken.
// Afmetingen in meters. Een duwbak is 76,5 × 11,5 m; vier bakken liggen als
// 2 lang × 2 breed en beslaan dus 153 m kade en 23 m diepte.
const BAK_LENGTE_M   = 76.5;
const BAK_BREEDTE_M  = 11.5;
// Bij B2/B3 en B4 — de kolen- en de ertskade — wordt in de praktijk
// regelmatig 3 tot 6 bakken diep gelegd, niet om te laden (dat blijft altijd
// vanuit de voorste 2 rijen gebeuren) maar om efficiënter te kunnen varen.
// Was ×2 (23 m); ×6 geeft ruimte voor die extra rijen. De duwbakkenpalen
// gebruiken met opzet niet deze constante (zie bouwHavenZones): die blijven
// altijd 1 bak diep.
const LIGDIEPTE_M    = BAK_BREEDTE_M * 6;   // 69 m

// De havenweergave gebruikt de volle schermbreedte, en daardoor past de
// hele haven op ware schaal — geen uitvergroting meer nodig.
// Een bak is in het echt 6,6 keer zo lang als breed. Op schaal getekend wordt
// hij daarmee een streepje van een paar pixels hoog, en daar past geen nummer
// in. De diepte-as wordt daarom opgerekt tot een bak dezelfde verhouding
// krijgt als een bakje in de Onderweg-kolom (ongeveer 4,4 : 1). De lengte
// langs de kade blijft wél op schaal, dus de indeling klopt nog steeds.
const HAVEN_DIEPTEFACTOR = 1.5;
const mDiep = m => m * HAVEN_DIEPTEFACTOR;

const HAVEN_MARGE_M    = 20;    // vrije rand rond de haven
// In het echt ligt er 350 m tussen de kades, maar daar lag de bakkenplaats in.
// Die staat nu in een eigen paneel, dus die 350 m zou leeg water zijn dat de
// kades klein houdt. Voor de tekening is het teruggebracht tot een strook die
// nog steeds als water leest.
// Was 110, toen 80 (om de palenzone ruimte te geven). Sinds 1.309 staan de
// palen in een eigen kolom, dus hoeft het alleen nog als water te lezen: tussen
// de twee kades ligt al hun ligdiepte (2 × 69 m, de sleepruimte voor 6 rijen),
// en dat lege deel leest al als water. In 1.368 eerst 30 m, in 1.371 op
// Hermans schets helemaal weg: de twee ligruimtes sluiten nu op elkaar aan,
// de kades staan zo dicht bij elkaar als de sleepruimte toelaat. Langs de
// kade verandert niets: B4 lengte 1 ligt nog recht tegenover B3 lengte 4.
const HAVEN_VAARWATER_M = 0;
// De twee bakkenplaatsen, gemeten in bakken. "lang" is langs de haven (x),
// "diep" is dwars erop (y).
//   leeg — tussen B3 lengte 4 en B4 lengte 1, even groot als een laadlengte
//   vol  — ankerplaats; daar liggen de bakken in verstek, elke volgende rij
//          een halve baklengte verschoven zodat sets elkaar half overlappen
const BAKKENPLAATSEN = {
  // Diep telt in bakbreedtes. De lege plaats ontleende zijn diepte eerder aan
  // de breedte van het vaarwater; nu hij een eigen paneel heeft moet dat hier
  // staan. 3 lang x 22 diep is 66 plekken — ruim boven de ~40 bakken die er
  // normaal in de haven liggen.
  // verstek stond op de volle plaats aan: elke tweede rij een halve baklengte
  // verschoven. Dat trok een set van vier uit elkaar zodra hij over zo'n grens
  // viel, en sinds de bakkenplaatsen een paneel zijn is er van dat verstek toch
  // niets meer te zien. Eruit dus.
  // lang was 2, nu 3: sinds plaatsPerPositie dwars (tot 3, bakboord/midden/
  // stuurboord) als kolom gebruikt in plaats van als rij (zie die functie),
  // heeft een echt 3-breed sleepstel drie kolommen nodig om niet over te lopen.
  leeg: { label:'Lege bakkenplaats', lang:3, diep:22 },
  // lang:6 (was 4): een vertrekset is maximaal 6 bakken breed; met 6 baklengtes
  // past elke set op één rij i.p.v. over meerdere rijen te vouwen. Zo is er per
  // rij precies één set-positie en levert diep:12 de 12 posities op die Herman
  // op de volle plaats wil zien (okt 2026).
  vol:  { label:'Volle bakkenplaats', lang:6, diep:12 }
};

// Voorlopige maatvoering — de haven is ±1200 m lang en 350-400 m breed,
// exacte maten volgen. B2 en B3 delen één kade van ±1000 m; B4 ligt daar
// tegenover op een eigen kade van ±600 m met wat meer speelruimte.
// Beide kades zijn links uitgelijnd en hun laadlengtes beginnen op dezelfde
// hoogte: B4 lengte 1 ligt recht tegenover B3 lengte 4. B2/B3 ligt boven,
// B4 onder, met 350 m vaarwater ertussen.
// Een laadlengte is normaal twee baklengtes. "Normaal", want er wordt niets
// door begrensd: leg je zes bakken neer, dan beslaan die drie baklengtes en
// snoept de set een baklengte van de buurlengte af.
const BAKLENGTES_PER_LAADLENGTE = 2;

/* Het oranje vak van een laadlengte toonde eerder de hele kadediepte
   (LIGDIEPTE_M, tot 6 rijen) — daarmee oogde het vak groot genoeg voor
   twaalf bakken, terwijl een laadlengte in de praktijk twee breed en twee
   diep is: vier bakken. Meer bakken neerleggen kan nog steeds (de plekken
   lopen door, zie havenZoneSlots), maar wat er dan bij komt hoort zichtbaar
   buíten het vak te vallen, niet erin te passen. Het vak zelf blijft dus op
   twee rijen staan, ongeacht hoe diep de kade daadwerkelijk is. */
const LAADLENGTE_VAK_RIJEN = 2;

/* Het raster telt in halve baklengtes, niet in hele. Een bak beslaat dus
   twee kolommen. Daarmee kun je een set precies een halve bak verschoven
   neerleggen — zoals dat in de haven ook gebeurt als twee sets elkaar half
   overlappen — zonder dat de botsingscontrole erop stukloopt: die kijkt
   gewoon of beide helften vrij zijn. */
const HALVE_BAK_M = BAK_LENGTE_M / 2;
const KOLOMMEN_PER_BAK = 2;

/* Een laadlengte is vier kolommen breed (twee bakken), en tussen twee
   laadlengtes ligt één kolom: de halve baklengte waar in het echt de duwboot
   staat.

   Dat gat was eerder extra afstand in méters die nergens in het raster stond.
   De kolommen verschoven er wel achter mee, en daardoor was een halve bak
   opschuiven niet overal mogelijk: rond zo'n gat sloeg de tekening een stukje
   over. Nu is het gat gewoon een kolom. Daarmee loopt de kade van de 4e tot
   en met de 1e lengte door in stappen van een halve bak, en die twee uiteinden
   zijn meteen de grens: verder dan de laadlengtes kan een bak niet liggen.

   De rekensom klopt met de kade: vier laadlengtes van vier kolommen plus drie
   gatkolommen is negentien kolommen, en daar liggen er negen bakken naast
   elkaar in — twee rijen diep is achttien bakken, oftewel drie sets van zes.
   B4 komt zo op negen kolommen: twee sets van vier. */
const KOLOMMEN_PER_LAADLENGTE = BAKLENGTES_PER_LAADLENGTE * KOLOMMEN_PER_BAK;
const GATKOLOMMEN = 1;
const KOLOMSTAP_PER_LAADLENGTE = KOLOMMEN_PER_LAADLENGTE + GATKOLOMMEN;

function kadeKolommen(kade){
  return kade.lengtes * KOLOMMEN_PER_LAADLENGTE + (kade.lengtes - 1) * GATKOLOMMEN;
}

// Eén constante voor de bovenmarge van B2/B3, in plaats van "+30" op twee
// plekken (hier en in de yM van B4 hieronder) apart uit te schrijven — die
// twee moeten altijd gelijk op lopen. Verkleind van 30 naar 8: dat schuift
// B2/B3 omhoog en maakt de vrijgekomen ruimte onderdeel van het vaarwater,
// nodig nu de kades met LIGDIEPTE_M tot 6 bakken diep kunnen worden.
const KADE_B2B3_TOP_M = HAVEN_MARGE_M + 8;

const HAVEN_KADES = [
  {
    id: 'b2b3', label: 'Kade B2 / B3', yM: KADE_B2B3_TOP_M,
    vanM: HAVEN_MARGE_M,
    richting: 'rtl',                  // lengte 1 rechts, dus 4 het meest links
    lengtes: 4,
    // De hele kade van punt B3 tot punt B2: vier laadlengtes met een halve
    // baklengte ertussen, samen negentien kolommen. Daar liggen negen bakken
    // naast elkaar, twee diep — achttien bakken, drie sets van zes.
    // Wie waar laadt: B2 doet de 1e en 2e lengte, B3 de 3e en 4e.
    lengteStations: { 1:'B2', 2:'B2', 3:'B3', 4:'B3' },
    // De werkverdeling over de gedeelde kade: B2 doet lengte 1 en 2, B3 doet
    // 3 en 4. Fysiek reiken de machines verder dan dat (B2 tot half 3, B3 tot
    // half 1), maar in de planning wordt de kade zo verdeeld — één machine per
    // lengte, zonder overlap in de labels.
    // Bereik in kolommen van het raster, vanaf het westen geteld (4e lengte
    // 0–3, 3e 5–8, 2e 10–13, 1e 15–18; een bak = twee kolommen). Volgens
    // Herman (12-10-2026): B2 komt van de 1e tot het midden van de 3e lengte
    // (oostelijke bak, kolom 7–8), niet op de 4e. B3 komt van de 4e tot de
    // westelijke bak van de 1e (kolom 15–16), niet op 1e oost. Ze overlappen
    // in het midden, en daar kunnen ze elkaar dus aflossen. De laadlengtekeuze
    // op de tegel volgt dit bereik (laadlengteOpties).
    machines: [
      { station:'B3', vanKolom:0, totKolom:16 },
      { station:'B2', vanKolom:7, totKolom:18 }
    ],
    bakkenplaats: { id:'leeg', label:'Lege bakkenplaats', sub:'achterin de haven' }
  },
  {
    id: 'b4', label: 'Kade B4',
    yM: KADE_B2B3_TOP_M + LIGDIEPTE_M + HAVEN_VAARWATER_M,
    vanM: HAVEN_MARGE_M,
    richting: 'ltr',                  // lengte 1 links
    lengtes: 2,                       // twee sets van vier
    lengteStations: { 1:'B4', 2:'B4' },
    // MB1 staat aan dezelfde kade als B4 en springt in als B4 defect is of
    // onderhoud heeft: hij laadt op de 1e en de 2e lengte van de kolenkade, en
    // heeft niets met de ertskade te maken.
    machines: [
      { station:'B4', vanKolom:0, totKolom:8 },
      { station:'MB1', vanKolom:0, totKolom:8, reserve:true }
    ],
    // Reservemachines per lengte, voor het label in de tekening.
    lengteReserve: { 1:'MB1', 2:'MB1' },
    bakkenplaats: { id:'vol', label:'Volle bakkenplaats', sub:'klaar voor vertrek' }
  }
];
// De kade is precies zo lang als wat erop ligt. In werkelijkheid zijn de
// kades langer (1000 en 600 m), maar de lege stukken tekenen levert alleen
// beeldruimte in zonder iets te vertellen.
/* Beide kades beginnen op dezelfde hoogte, zodat de westelijke bak van de 4e
   lengte (B3) exact tegenover die van de 1e lengte van B4 ligt. Zo ligt de
   ertskade in lijn met de kolenkade.

   Hier stond nog een berekening uit het oude model, met een gat vóór de eerste
   laadlengte dat per kade verschilde. Die duwde B4 vijfendertig meter naar het
   oosten en zette de twee kades dus juist uit elkaar. */
{
  HAVEN_KADES.forEach(k => {
    k.vanM = HAVEN_MARGE_M;
    k.kolommen = kadeKolommen(k);
    k.langM = k.kolommen * HALVE_BAK_M;
    k.totM  = k.vanM + k.langM;
  });
}

// De laadlengtes liggen links op de kade, met een gat ervoor, ertussen en
// erachter. De telrichting bepaalt alleen wélk nummer waar ligt, niet waar
// het blok staat — daardoor ligt B4 lengte 1 tegenover B3 lengte 4.
/* Waar een laadlengte op de kade begint, geteld in baklengtes vanaf links.
   Bij B2/B3 ligt de 1e lengte rechts, dus telt nummer 4 vanaf kolom 0. */
// Let op: in kolommen van het raster, en dat telt in halve baklengtes. Een
// laadlengte van twee bakken is dus vier kolommen breed. Dit stond nog in
// hele bakken, waardoor de oranje vakken op de helft van hun plek terecht
// kwamen toen het raster fijner werd.
function lengteStartKolom(kade, nummer){
  const plaats = kade.richting === 'rtl' ? (kade.lengtes - nummer) : (nummer - 1);
  return plaats * KOLOMSTAP_PER_LAADLENGTE;
}

function bouwHavenZones(){
  const zones = [];

  /* De kade is één doorlopende strook, gemeten in baklengtes en twee bakken
     diep. Dat was eerder een rijtje losse vakken van elk twee baklengtes, met
     een gat ertussen — en daardoor kon een set van zes er niet op.

     In het echt werkt het anders: leg je zes bakken op de 4e lengte, dan
     beslaat die drie baklengtes en snoept hij er één van de 3e af. De nummers
     zijn dus een plek op de kade, geen vak dat iets begrenst. Ze blijven wel
     bestaan, want er wordt in de planning mee gewerkt.

     Wat er van een laadlengte overblijft is een markering: waar hij begint en
     hoe breed hij normaal is. Bezetting is een rekensom in baklengtes. */
  HAVEN_KADES.forEach(kade => {
    zones.push({
      id: `${kade.id}-kade`,
      type: 'kade',
      kade: kade.id,
      label: kade.label,
      // Reservemachines tellen niet mee in de naam van de kade ("kade B4").
      stations: kade.machines.filter(m => !m.reserve).map(m => m.station),
      station: kade.machines[0] ? kade.machines[0].station : null,
      x: kade.vanM,
      y: kade.yM,
      w: kade.kolommen * HALVE_BAK_M,
      h: LIGDIEPTE_M,
      kolommen: kade.kolommen,
      // markeringen, geen grenzen — behalve de buitenste twee: verder dan de
      // eerste en de laatste laadlengte loopt de kade niet door.
      lengtes: Array.from({length: kade.lengtes}, (_, i) => {
        const nummer = i + 1;
        return {
          nummer,
          lengte: `${nummer}e lengte`,
          vanKolom: lengteStartKolom(kade, nummer),
          kolommen: KOLOMMEN_PER_LAADLENGTE,
          station: (kade.lengteStations || {})[nummer] || null,
          reserve: (kade.lengteReserve || {})[nummer] || null
        };
      }),
      machines: kade.machines
    });
  });

  // Lege bakkenplaats: vult het hele vaarwater tussen B3 lengte 4 en B4
  // lengte 1, twee baklengtes breed. Bakken liggen hier per set, gerangschikt
  // naar hun positie in de eenheid (BA / MA / SA uit de VH- of HGK-lijst).
  // Vier bakbreedtes vrij aan de boven- en aan de onderkant.
  /* De twee bakkenplaatsen worden niet meer in de haventekening getekend maar
     in een eigen paneel. Ze hoeven dus geen plek meer te vinden tussen de
     kades, en dat scheelt precies de ruimte die de kades nodig hebben om
     groter in beeld te komen.

     Ze bestaan nog wél als zone: daar hangt de plekkenberekening aan, en die
     bepaalt hoeveel bakken erop kunnen. Hun ligging is daarom een rekenmaat
     geworden, geen tekening — vandaar virtueel. Zones met die vlag worden
     overgeslagen bij het tekenen en bij het zoeken naar een sleepdoel. */
  const leeg = BAKKENPLAATSEN.leeg;
  zones.push({
    id:'leeg', type:'bakkenplaats', label:leeg.label,
    virtueel: true, perPositie: true,
    x: 0, y: 0,
    w: leeg.lang * BAK_LENGTE_M,
    h: leeg.diep * BAK_BREEDTE_M
  });

  const vol = BAKKENPLAATSEN.vol;
  zones.push({
    id:'vol', type:'bakkenplaats', label:vol.label,
    virtueel: true,
    x: 0, y: 0,
    w: vol.lang * BAK_LENGTE_M,
    h: vol.diep * BAK_BREEDTE_M
  });

  /* De twee duwbakkenpalen: vier bakken achter elkaar tussen de palen, 1 bak
     breed en 4 diep. Stond tot v1.309 als vak in het vaarwater van de
     tekening; op verzoek (Herman, okt 2026) nu een eigen kolom boven Onderweg
     (#havenPalenKolom, havenTekenPalenKolom) — vandaar virtueel. perPositie:
     elke kolom is een hele bak, net als op de lege plaats. Het type blijft
     'palen', geen bakkenplaats: klaar-om-te-laden hoort er niet bij. */
  zones.push({
    id:'palen', type:'palen', label:'Palen',
    virtueel: true, perPositie: true,
    x: 0, y: 0,
    w: BAK_LENGTE_M,
    h: 4 * BAK_BREEDTE_M
  });

  return zones;
}

const HAVEN_LAYOUT = {
  zones: bouwHavenZones(),
  kades: HAVEN_KADES.map(k => ({
    id:k.id, label:k.label, yM:k.yM, vanM:k.vanM, totM:k.totM,
    // B2/B3 ligt bovenaan, dus zijn kadelijn en labels staan erboven;
    // bij B4 onderaan staan ze eronder.
    kant: k.id === 'b2b3' ? 'boven' : 'onder'
    /* Hier stond nog een omrekening van het machinebereik naar balkjes op de
       kade. Die balkjes zijn er niet meer — het station staat nu bij de
       laadlengte zelf — en de omrekening las velden die niet bestonden, dus
       er kwam NaN uit. Het bereik zelf staat in zone.machines. */
  }))
};
const getekendeZones = HAVEN_LAYOUT.zones.filter(z => !z.virtueel);
HAVEN_LAYOUT.breedte = Math.max(
  ...HAVEN_KADES.map(k => k.totM),
  ...getekendeZones.map(z => z.x + havenZoneBreedteM(z))
) + HAVEN_MARGE_M;
// Onder de onderste kade staan nog de namen van de laadlengtes (sinds 1.370
// een regel lager, dus 13 meer ruimte).
HAVEN_LAYOUT.hoogte = mDiep(
  Math.max(...getekendeZones.map(z => z.y + z.h))
) + 39 + HAVEN_MARGE_M;

const HAVEN_START_ZONE = 'leeg';   // waar een nog niet verplaatste bak ligt
/* Geen plek maar een stand: deze bak is de haven uit, opgehaald door zijn
   boot. Staat in dezelfde lijst als de ligplaatsen, zodat hij een herstart
   overleeft en met ongedaan maken terugkomt. */
const HAVEN_VERTROKKEN = 'vertrokken';

// --- Plekken binnen een zone ---------------------------------------
// Elke zone is een raster van bakplekken: langs de kade past er om de
// 76,5 m een bak, en er liggen er twee achter elkaar. De capaciteit volgt
// dus uit de afmeting; komen de echte maten binnen, dan klopt hij vanzelf.
/* De stap tussen twee opeenvolgende kolommen. Een kade en de palen tellen in
   halve baklengtes (zie HALVE_BAK_M/KOLOMMEN_PER_BAK hierboven) — dat maakt
   een halve-bak-verschoven set en het gat tussen twee laadlengtes mogelijk.
   Een bakkenplaats (leeg/vol) kent dat niet: daar is elke kolom gewoon één
   bak, precies zoals havenRelatieveIndeling voor zo'n zone al aanneemt ("bij
   een bakkenplaats loopt kol gewoon 0, 1, 2, ... per bak"). Zonder dit
   onderscheid rekende dit bestand ook daar in halve baklengtes, en kreeg
   plaatsPerPositie (die zijn eigen, hele-bakken-tellende kolomnummer zo'n
   raster in laat lopen) een kolom die maar half zijn eigen plek was — bakken
   overlapten hun buurman en oogden daardoor als twee bakken lang. */
function havenKolomStap(zone){ return zone.perPositie ? BAK_LENGTE_M : HALVE_BAK_M; }

/* Waar kolom k van deze zone begint. Op een kade staat er een halve baklengte
   tussen de laadlengtes — ruimte voor de duwboot — en daar schuiven alle
   kolommen achter mee op. Elders liggen de kolommen gewoon tegen elkaar.

   Het blijft één doorlopend raster: de gaten zitten in de plaatsing op het
   scherm, niet in de nummering. Kolom 2 is nog steeds de kolom ná kolom 1,
   ook al ligt er een stuk kade tussen. */
function havenKolomX(zone, kol){
  // Overal even brede kolommen, ook op een kade: het gat tussen twee
  // laadlengtes is daar zelf een kolom.
  return zone.x + kol * havenKolomStap(zone);
}

function havenZoneKolommen(zone){
  if(zone.perPositie) return Math.max(1, Math.floor(zone.w / BAK_LENGTE_M));
  return Math.max(KOLOMMEN_PER_BAK, Math.round(zone.w / HALVE_BAK_M));
}
function havenZoneBreedteM(zone){
  const k = havenZoneKolommen(zone);
  return havenKolomX(zone, k - KOLOMMEN_PER_BAK) + BAK_LENGTE_M - zone.x;
}

function havenZoneSlots(zone){
  const kolommen = havenZoneKolommen(zone);
  const rijen    = Math.max(1, Math.floor(zone.h / BAK_BREEDTE_M));
  const breedte  = havenKolomStap(zone);
  const slots = [];
  let index = 0;
  for(let r = 0; r < rijen; r++){
    for(let k = 0; k < kolommen; k++){
      slots.push({
        index: index++,
        rij: r, kol: k,
        x: havenKolomX(zone, k),
        y: zone.y + r*BAK_BREEDTE_M,
        w: breedte,              // op een kade beslaat een bak er twee; op een bakkenplaats is dit al de hele bak
        h: BAK_BREEDTE_M
      });
    }
  }
  return slots;
}
function havenZone(id){ return HAVEN_LAYOUT.zones.find(z => z.id === id) || null; }

// --- Opslag van de posities ----------------------------------------
const HAVEN_POSITIES_KEY = 'duwbakken-haven-posities';
let havenPosities = {};            // genormaliseerde baknaam -> { zone, sinds }

/* Tot v1.114 had elke laadlengte een eigen zone: b2b3-L1 tot en met b2b3-L4 en
   b4-L1/L2. Sinds de kade één doorlopende strook is bestaan die niet meer, en
   een bak die er nog naar verwijst zou terugvallen op de lege bakkenplaats —
   dus zou de hele haven bij het opstarten leeglopen.

   Ze worden daarom eenmalig omgerekend naar de nieuwe kade: dezelfde rij, en
   de kolom verschoven met de startkolom van die laadlengte. Een bak die op de
   2e lengte in kolom 1 lag, ligt daarna op kolom 5 van de kade — precies waar
   hij ook echt lag. */
function migreerLaadlengtePosities(){
  let omgezet = 0;
  Object.entries(havenPosities).forEach(([sleutel, p]) => {
    const m = p && typeof p.zone === 'string' && p.zone.match(/^(b2b3|b4)-L(\d)$/);
    if(!m) return;
    const kadeId = m[1], nummer = Number(m[2]);
    const kade = HAVEN_KADES.find(k => k.id === kadeId);
    const zone = havenZone(`${kadeId}-kade`);
    if(!kade || !zone){ delete havenPosities[sleutel]; omgezet++; return; }

    // De oude zone was twee baklengtes breed, dus twee kolommen per rij.
    const oudeKolom = Number.isInteger(p.slot) ? p.slot % BAKLENGTES_PER_LAADLENGTE : 0;
    const oudeRij   = Number.isInteger(p.slot) ? Math.floor(p.slot / BAKLENGTES_PER_LAADLENGTE) : 0;
    const nieuweKolom = lengteStartKolom(kade, nummer) + oudeKolom * KOLOMMEN_PER_BAK;

    const slot = havenZoneSlots(zone).find(s => s.rij === oudeRij && s.kol === nieuweKolom);
    if(slot){ havenPosities[sleutel] = { zone: zone.id, slot: slot.index, sinds: p.sinds || Date.now(), binnen: p.binnen || p.sinds }; }
    else { delete havenPosities[sleutel]; }
    omgezet++;
  });
  return omgezet;
}

/* Het raster telt sinds v1.118 in halve baklengtes, dus er zijn twee keer zo
   veel kolommen per rij. Een opgeslagen plekindex uit het oude raster wijst
   daardoor naar de verkeerde plek — vaak zelfs naar een andere rij.

   Eenmalig omrekenen: uit de oude index volgt rij en kolom, en die kolom telt
   nu dubbel. Bakken waarvan de plek niet meer bestaat laten we los; die krijgen
   bij het tekenen vanzelf een vrije plek toegewezen. */
const HAVEN_RASTER_VERSIE_KEY = 'duwbakken-haven-raster';

async function migreerHalveKolommen(){
  let gedaan = null;
  try{ gedaan = localStorage.getItem(HAVEN_RASTER_VERSIE_KEY); }catch(e){ /* geen opslag */ }
  if(gedaan === 'half') return 0;

  let omgezet = 0;
  Object.entries(havenPosities).forEach(([sleutel, p]) => {
    const zone = p && havenZone(p.zone);
    if(!zone || !Number.isInteger(p.slot)) return;
    const nieuweKolommen = havenZoneKolommen(zone);
    const oudeKolommen = Math.max(1, Math.round(nieuweKolommen / KOLOMMEN_PER_BAK));
    const rij = Math.floor(p.slot / oudeKolommen);
    const kol = p.slot % oudeKolommen;
    const nieuweIndex = rij * nieuweKolommen + kol * KOLOMMEN_PER_BAK;
    if(nieuweIndex >= rij * nieuweKolommen + nieuweKolommen) delete havenPosities[sleutel];
    else p.slot = nieuweIndex;
    omgezet++;
  });

  try{ localStorage.setItem(HAVEN_RASTER_VERSIE_KEY, 'half'); }catch(e){ meldOpslagProbleem(HAVEN_RASTER_VERSIE_KEY, e); }
  return omgezet;
}

async function loadHavenPosities(){
  havenPosities = await loadJson(HAVEN_POSITIES_KEY, {});
  // Eerst het raster, dan de oude zones. Andersom zou een plek die de
  // zonemigratie net goed had gezet daarna nog eens verdubbeld worden.
  let gewijzigd = await migreerHalveKolommen();
  gewijzigd += migreerLaadlengtePosities();
  // Rechtstreeks opslaan: tijdens het laden staan ritten en de andere
  // haven-opslag nog niet klaar, dus havenTegelsVolgen mag hier niet draaien.
  if(gewijzigd) await saveJson(HAVEN_POSITIES_KEY, havenPosities);
}
async function saveHavenPosities(){
  havenVergeetBerekening();   // waar de bakken liggen is net veranderd
  await saveJson(HAVEN_POSITIES_KEY, havenPosities);
  await havenTegelsVolgen();
}

/* De planlijst volgt de haven (1.356). Elke verplaatsing loopt via
   saveHavenPosities, dus hier is de ene plek waar slepen, tikken, het tabje
   en achter/midden/kop allemaal langskomen.

   Per bak van een tegel: de zone waar hij in de haven ligt, of null als hij
   er (nog) niet is — Onderweg, of op "niet aanwezig" gezet, wat hier
   hetzelfde betekent. Een bak op "repareren" komt nooit op Vol en telt niet
   mee. */
function havenTegelStand(trip, perRit){
  const inHaven = new Map((perRit ? perRit.get(trip.id) || [] : havenBakken().filter(b => b.tripId === trip.id))
    .map(b => [b.sleutel, b.zone]));
  const zoneVan = r => r.bakStatus === 'niet_aanwezig' ? null
    : inHaven.get(normalizeBargeName(r.leichter)) || null;
  const zones = trip.rows
    .filter(r => r.leichter && r.leichter.trim() && r.bakStatus !== 'repareren')
    .map(zoneVan);
  return {
    zoneVan,
    allesVol: zones.length > 0 && zones.every(z => z === 'vol'),
    // minstens één bak is al van de lege plaats af (laadlengte of Vol)
    deelsOvergebracht: zones.some(z => z && z !== 'leeg' && z !== 'palen')
  };
}

// completeTrip zet de bakken zelf op Vol en logt zelf; dan niet nog eens.
let havenTegelsVolgenUit = false;

async function havenTegelsVolgen(){
  if(havenTegelsVolgenUit) return;
  const perRit = new Map();
  havenBakken().forEach(b => {
    if(!b.tripId) return;
    if(!perRit.has(b.tripId)) perRit.set(b.tripId, []);
    perRit.get(b.tripId).push(b);
  });
  let gewijzigd = false;
  for(const t of trips){
    const bakken = perRit.get(t.id) || [];
    if(t.status === 'actief' && t.aangemeerd && havenTegelStand(t, perRit).allesVol){
      await logAction(`Reis afgerond (via haven): ${t.schubboot||'?'} (${t.station||'?'})`);
      t.status = 'historie';
      t.completedAt = Date.now();
      t.bakkenInHaven = true;
      showToast(`${t.schubboot||'Reis'} ligt vol op de ankerplaats — afgerond`);
      gewijzigd = true;
    } else if(t.status === 'historie' && t.bakkenInHaven && bakken.some(b => b.zone !== 'vol')){
      // Een bak gaat van Vol terug naar een laadlengte (of elders, niet
      // vertrokken): de tegel hoort weer op de planlijst.
      await logAction(`Reis teruggezet (via haven): ${t.schubboot||'?'} (${t.station||'?'})`);
      t.status = 'actief';
      t.completedAt = null;
      delete t.bakkenInHaven;
      showToast(`${t.schubboot||'Reis'} staat weer op de planlijst`);
      gewijzigd = true;
    }
  }
  if(gewijzigd){
    havenVergeetBerekening();
    await saveTrips();
  }
}

/* Een bak die jij zelf bij een andere tegel hebt gezet.

   Normaal volgt de tegelindeling de aankomstlijst: bakken die met hetzelfde
   schip op hetzelfde moment binnenkwamen horen bij elkaar. Soms klopt dat in
   de praktijk niet meer — dan sleep/tik je een losse bak bij een andere tegel
   en moet die daar blijven liggen, ook na een hertekening of een nieuwe
   import. Dat is wat hier wordt onthouden: genormaliseerde baknaam ->
   tegelsleutel. Alleen door jouw eigen handeling gevuld, nooit automatisch. */
const HAVEN_TEGEL_KEY = 'duwbakken-haven-tegels';
let havenTegelOverrides = {};

async function loadHavenTegelOverrides(){
  havenTegelOverrides = await loadJson(HAVEN_TEGEL_KEY, {});
}
async function saveHavenTegelOverrides(){
  havenVergeetBerekening();   // een bak hoort nu bij een andere tegel
  await saveJson(HAVEN_TEGEL_KEY, havenTegelOverrides);
}
function havenTegelVanBak(naam, standaard){
  return havenTegelOverrides[normalizeBargeName(naam)] || standaard;
}

/* Op welke sleutel groepeert een bakkenplaats zijn tegels?

   - Lege plaats: op aankomst (schip + tijd = b.tegelSleutel) — je kijkt wát er
     samen binnenkwam.
   - Volle plaats: op vertrek (vertrekboot + vertrektijd, inclusief datum, =
     b.setKey) — je kijkt wíé er samen vertrekt. Twee vertrekken die toevallig
     met hetzelfde schip binnenkwamen deelden anders één aankomsttegel en lazen
     als bijv. "4 van 8"; en zo'n samengevoegde tegel kon meer dan 6 bakken
     tellen, wat het celraster scheeftrok. Zie bug-melding na v1.302.

   Een eigen sleep-keuze (havenTegelOverrides, baknaam -> tegel) wint in beide
   gevallen, net als bij havenTegelVanBak — dat is hoe "bak bij andere set" op de
   volle plaats onthouden wordt. */
function havenPlaatsGroepKey(b){
  if(!b) return '';
  /* Bij de palen liggen de bakken altijd naast elkaar, nooit voor elkaar (geen
     fles): elke bak is daar een eigen tegel, ook als hij met zijn set kwam. */
  if(b.zone === 'palen') return 'paal:' + normalizeBargeName(b.naam);
  const basis = b.zone === 'vol' ? (b.setKey || b.tegelSleutel) : b.tegelSleutel;
  return havenTegelOverrides[normalizeBargeName(b.naam)] || basis;
}

/* Kleur-override: sleep je op de volle plaats een bak naar een ándere set en
   bevestig je dat de bergvaart is veranderd, dan krijgt die bak de kleur van
   die set — anders zou hij in de nieuwe tegel zijn oude setkleur houden en niet
   als onderdeel van het stel lezen. Alleen door jouw eigen handeling gevuld,
   net als havenTegelOverrides; genormaliseerde baknaam -> kleur. */
const HAVEN_KLEUR_KEY = 'duwbakken-haven-kleuren';
let havenKleurOverrides = {};
async function loadHavenKleurOverrides(){
  havenKleurOverrides = await loadJson(HAVEN_KLEUR_KEY, {});
}
async function saveHavenKleurOverrides(){
  havenVergeetBerekening();   // de kleur van een bak is gewijzigd
  await saveJson(HAVEN_KLEUR_KEY, havenKleurOverrides);
}

/* Plek-override binnen een tegel: op de volle plaats mag je zelf de exacte plek
   van elke bak in de set bepalen door hem op een andere cel te slepen (bak↔bak
   of bak↔ghost wisselen). Genormaliseerde baknaam -> lineaire celindex in het
   tegelraster (rij*breedte + kolom). Alleen door jouw eigen handeling gevuld.
   (De oude "vaste plek in de tegel" was in v1.246 verwijderd; dit brengt 'm
   terug, nu puur als weergave-override, los van de ligplaats-slots.) */
const HAVEN_BAKPLEK_KEY = 'duwbakken-haven-bakplek';
let havenBakPlekOverrides = {};
async function loadHavenBakPlekOverrides(){
  havenBakPlekOverrides = await loadJson(HAVEN_BAKPLEK_KEY, {});
}
async function saveHavenBakPlekOverrides(){
  await saveJson(HAVEN_BAKPLEK_KEY, havenBakPlekOverrides);
}

/* De haven als eigen waarheid (idee 6). Een bak die in de haven ligt, blijft
   daar tot iemand hem laat vertrekken — ook als hij van de planlijst of de
   VH/HGK-lijst afvalt. Daarvoor onthouden we per bak wat we laatst over hem
   wisten (naam, set, kleur, vertrekboot). Alleen bakken die de app zelf in de
   haven heeft zien liggen krijgen zo'n momentopname; oude ligplaatsen van
   vóór v1.321 komen dus niet ineens terug. Genormaliseerde baknaam -> gegevens. */
const HAVEN_BEWAARD_KEY = 'duwbakken-haven-bewaard';
let havenBewaard = {};
let havenBewaardOpslaanGepland = false;
async function loadHavenBewaard(){
  havenBewaard = await loadJson(HAVEN_BEWAARD_KEY, {});
}
function havenBewaardOpslaan(){
  if(havenBewaardOpslaanGepland) return;
  havenBewaardOpslaanGepland = true;
  setTimeout(() => { havenBewaardOpslaanGepland = false; saveJson(HAVEN_BEWAARD_KEY, havenBewaard); }, 0);
}

/* Vertrekboot met de hand (idee 6): vertrekt een bak na lang liggen met een
   andere boot dan op de lijst stond, dan wint wat jij invult — ook na een
   nieuwe lijst. Op Vol verhuist hij mee naar de set van die boot en neemt
   dan diens vertrektijd over (havenVolgVertrekboot).
   Genormaliseerde baknaam -> { boot, tijd? }. Dubbeltik op een bak in de haven of op
   de lege/volle plaats (of V met het toetsenbord) opent de vraag; leeg laten =
   terug naar wat de lijst zegt. */
const HAVEN_VERTREK_KEY = 'duwbakken-haven-vertrekboot';
let havenVertrekOverrides = {};
async function loadHavenVertrekOverrides(){
  havenVertrekOverrides = await loadJson(HAVEN_VERTREK_KEY, {});
}
async function saveHavenVertrekOverrides(){
  havenVergeetBerekening();
  await saveJson(HAVEN_VERTREK_KEY, havenVertrekOverrides);
}
let havenVorigeTik = null;   // { sleutel, t } — voor de dubbeltik
// Tweede tik op dezelfde bak binnen 400 ms? Tekening en bakkenplaatsen delen dit.
function havenIsDubbeltik(sleutel){
  const nu = Date.now();
  const dubbel = havenVorigeTik && havenVorigeTik.sleutel === sleutel && nu - havenVorigeTik.t < 400;
  havenVorigeTik = dubbel ? null : { sleutel, t: nu };
  return dubbel;
}
async function havenVraagVertrekboot(sleutel){
  const b = havenBakken().find(x => x.sleutel === sleutel);
  if(!b) return;
  const hand = havenVertrekOverrides[sleutel];
  const boot = await kiesVertrekboot(b, hand);
  if(boot === null) return;                       // geannuleerd
  const nieuw = boot.trim();
  if(nieuw === (hand ? hand.boot : '') || (!hand && nieuw === (b.vertrekbootEcht || ''))) return;   // niets veranderd
  await logAction(nieuw ? `Vertrekboot met de hand: ${b.naam} → ${nieuw}` : `Vertrekboot van ${b.naam} weer volgens de lijst`);
  if(nieuw) havenVertrekOverrides[sleutel] = { boot: nieuw };
  else delete havenVertrekOverrides[sleutel];
  await saveHavenVertrekOverrides();
  await havenVolgVertrekboot(sleutel, nieuw);
  render();
}

/* De vertrekboot kiezen zonder toetsenbord (22-10-2026): het Zoeken-scherm
   met HK/VH als voorvoegsel, het numpad, en de bekende vertrekboten in de
   lijst. Bovenaan "volgens de lijst" als er met de hand iets staat. Geeft de
   bootnaam, '' (= volgens de lijst) of null (gesloten). */
const VERTREK_VOOR = [['HK', 'HK', 'Herkules'], ['VH', 'VH', 'Veerhaven']];
function kiesVertrekboot(b, hand){
  const kort = n => verkortSchipnaam(n) || n;
  const sleutelVan = n => normalizeBargeName(kort(n));
  const boten = new Map();
  [...(vhBakken || []), ...(hgkBakken || [])].map(v => v && v.vertrekboot)
    .concat(Object.values(havenVertrekOverrides).map(o => o.boot))
    .filter(Boolean).forEach(n => { if(!boten.has(sleutelVan(n))) boten.set(sleutelVan(n), n); });
  const nuBoot = hand ? hand.boot : b.vertrekbootEcht;
  const lijstBoot = hand ? b.vertrekbootLijst : null;
  return new Promise(resolve => {
    let klaar = false;
    const geef = w => { if(klaar) return; klaar = true; resolve(w); };
    const item = (naam, extra) => {
      const t = parseShipToken(naam), fam = VERTREK_VOOR.find(v => shipFamilyOf(v[0]) === shipFamilyOf(t.prefix));
      return { groep: 'Boten', wat: kort(naam), tekst: kort(naam) !== naam ? naam : '', waar: '',
        fam: fam ? fam[0] : '', num: t.number != null ? String(t.number) : '', zoek: naam + ' ' + kort(naam),
        doe: () => geef(naam), ...extra };
    };
    const index = [...boten.values()].sort((x, y) => kort(x).localeCompare(kort(y), 'nl', { numeric: true }))
      .map(n => item(n, sleutelVan(n) === sleutelVan(nuBoot || '') ? { waar: 'nu' } : {}));
    const terug = hand ? [{ groep: 'Boten', wat: 'Lijst', tekst: `volgens de lijst${lijstBoot ? ': ' + kort(lijstBoot) : ''}`, waar: '', zoek: '', doe: () => geef('') }] : [];
    const treffers = (idx, invoer) => {
      const v = invoer.trim().toUpperCase();
      if(!v) return [...terug, ...idx];
      const m = v.match(/^([A-Z]*)\s*(\d*)$/);
      const fam = m && VERTREK_VOOR.find(f => f[0] === m[1]);
      let uit;
      if(m && (fam || !m[1])) uit = idx.filter(it => it.num && it.num.startsWith(m[2]) && (!fam || it.fam === fam[0]));
      else uit = idx.filter(it => snelzoekNorm(it.zoek).includes(snelzoekNorm(v)));
      // Niet bekend: wat er getypt staat als nieuwe boot ("HK 12" -> Herkules 12).
      const nieuw = fam && m[2] ? `${fam[2]} ${m[2]}` : (!m || m[1] && !fam) ? v.charAt(0) + v.slice(1).toLowerCase() : null;
      // Precies wat er getypt staat eerst: "HK 1" boven "HK 12".
      if(m) uit.sort((x, y) => (y.num === m[2]) - (x.num === m[2]));
      if(nieuw && !uit.some(it => sleutelVan(it.wat) === sleutelVan(nieuw)))
        uit.unshift(item(nieuw, { waar: 'nieuw' }));
      return uit;
    };
    openSnelzoeken({
      index, treffers, voor: VERTREK_VOOR, max: 6,
      isFamilie: l => VERTREK_VOOR.some(f => f[0] === l), families: l => [l],
      label: `Vertrekboot voor ${b.naam}`,
      placeholder: `${b.naam} · nu ${nuBoot ? kort(nuBoot) : 'onbekend'}`,
      leegTekst: 'Nog geen vertrekboten bekend. Kies HK of VH en tik het nummer.',
      nietsTekst: 'Geen boot gevonden voor'
    });
    // Gesloten zonder keuze (Sluit, Esc, naast tikken) = annuleren.
    const bd = document.getElementById('modalBackdrop');
    const kijk = new MutationObserver(() => { if(!bd.isConnected){ kijk.disconnect(); geef(null); } });
    kijk.observe(document.body, { childList: true, subtree: true });
  });
}

/* Op Vol hoort een bak bij de set waarmee hij vertrekt (22-10-2026). Na een
   andere vertrekboot met de hand: na een vraag naar de tegel van die boot,
   met diens kleur en vertrektijd; ligt die boot er nog niet, dan een eigen
   tegel op een vrije rij. Leeg gemaakt (nieuw = '') = terug naar zijn set
   volgens de lijst. Nee = hij blijft liggen, alleen het label is anders. */
async function havenVolgVertrekboot(sleutel, nieuw){
  const opVol = havenBakkenMetPlek().filter(x => x.zone === 'vol' && x.plek);
  const b = opVol.find(x => x.sleutel === sleutel);
  if(!b) return;
  const anderen = opVol.filter(x => x.sleutel !== sleutel);
  const eigenTegel = havenPlaatsGroepKey(b);
  const gelijk = (x, y) => !!x && !!y && shipNamesMatch(x, y);   // "HK 12" = "Herkules XII"
  const doel = nieuw ? anderen.find(x => gelijk(x.vertrekbootEcht, nieuw))
                     : anderen.find(x => havenPlaatsGroepKey(x) === b.setKey);
  if(doel && havenPlaatsGroepKey(doel) === eigenTegel) return;          // ligt er al bij
  const alleen = !anderen.some(x => havenPlaatsGroepKey(x) === eigenTegel);
  if(!doel && alleen){                                                    // is al een eigen tegel
    if(!nieuw){ delete havenTegelOverrides[sleutel]; delete havenKleurOverrides[sleutel];
                await saveHavenTegelOverrides(); await saveHavenKleurOverrides(); }
    return;
  }
  const boot = nieuw || b.vertrekbootEcht || 'zijn boot volgens de lijst';
  // Eerst de Enter uit het invulveld laten uitwerken: anders beantwoordt
  // diezelfde toetsdruk deze vraag meteen met Ja.
  await new Promise(r => setTimeout(r));
  const ja = await vraagBevestiging({
    titel: `${b.naam} mee naar de ${boot}?`,
    tekst: doel
      ? `Ja: hij komt bij de set van de ${boot} en krijgt die kleur en vertrektijd. Nee: hij blijft liggen waar hij ligt.`
      : `De ${boot} heeft nog geen set op de volle plaats. Ja: hij wordt daar een eigen tegel. Nee: hij blijft liggen waar hij ligt.`,
    bevestig: 'Ja', annuleer: 'Nee'
  });
  if(!ja) return;
  if(!nieuw) delete havenKleurOverrides[sleutel];
  if(doel){
    if(nieuw){
      if(doel.kleur) havenKleurOverrides[sleutel] = doel.kleur;
      havenVertrekOverrides[sleutel] = { boot: nieuw, tijd: doel.vertrektijd || null };
      await saveHavenVertrekOverrides();
    }
    await saveHavenKleurOverrides();
    await havenVoegBakBijTegel(b.naam, havenPlaatsGroepKey(doel), 'vol');
    return;
  }
  // Eigen tegel: de eerste rij waar nog niets ligt. havenVerplaatsBakken maakt
  // er zelf een los deel van (havenBronTegels/havenHoudTegelsBijElkaar).
  if(!nieuw) delete havenTegelOverrides[sleutel];
  await saveHavenTegelOverrides();
  await saveHavenKleurOverrides();
  const bezet = new Set(anderen.map(x => x.plek.rij));
  const vrij = havenZoneSlots(havenZone('vol')).find(sl => sl.kol === 0 && !bezet.has(sl.rij));
  if(!vrij || !await havenVerplaatsBakken([b.naam], 'vol', vrij.index, true))
    showToast(`Geen vrije rij op de volle plaats — ${b.naam} blijft liggen.`);
}

/* Een nieuwe ligplaats voor een bak. `binnen` is het moment dat hij de haven
   binnenkwam en blijft staan bij elke verplaatsing; `sinds` is de laatste
   verplaatsing. Kwam hij uit Onderweg of was hij vertrokken, dan begint
   `binnen` opnieuw. Oude posities zonder `binnen` vallen terug op `sinds`. */
function havenNieuwePositie(sleutel, zone, slot, nu){
  const oud = havenPosities[sleutel];
  const binnen = oud && oud.zone !== HAVEN_VERTROKKEN ? (oud.binnen || oud.sinds || nu) : nu;
  return { zone, slot, sinds: nu, binnen };
}

/* Wat er op een bak getekend wordt naast zijn naam: hoeveel dagen hij al
   binnen ligt (vanaf 1 dag; oranje vanaf 3, rood vanaf 7), of hij nergens
   meer op een lijst staat, en of de vertrekboot met de hand is gezet. */
function havenBakMerken(b){
  const dagen = b.binnenSinds ? Math.floor((Date.now() - b.binnenSinds) / 86400000) : 0;
  return {
    dagen: dagen >= 1 ? dagen : 0,
    dagenKlasse: dagen >= 7 ? 'rood' : dagen >= 3 ? 'oranje' : '',
    nietOpLijst: !!b.nietOpLijst,
    hand: !!b.vertrekHand
  };
}

// Zelfde merken als HTML, voor de bakjes op de bakkenplaatsen (havenBakBlokjes).
function havenBakMerkenHtml(b){
  const m = havenBakMerken(b);
  const uitleg = [m.nietOpLijst && 'staat op geen enkele lijst meer', m.hand && 'vertrekboot met de hand gezet',
                  m.dagen && `${m.dagen} dag${m.dagen === 1 ? '' : 'en'} binnen`].filter(Boolean).join(', ');
  if(!uitleg) return '';
  return `<small class="bak-merken" title="${esc(uitleg)}"><span class="bak-merk-uitleg">, ${esc(uitleg)}</span>` +
    `<span aria-hidden="true">${m.nietOpLijst ? '⊘' : ''}${m.hand ? '✎' : ''}${
      m.dagen ? `<b class="bak-dagen ${m.dagenKlasse}">${m.dagen}d</b>` : ''}</span></small>`;
}

function havenIsVertrokken(naam){
  const p = havenPosities[normalizeBargeName(naam)];
  return !!(p && p.zone === HAVEN_VERTROKKEN);
}

function havenPositieVanBak(naam){
  const p = havenPosities[normalizeBargeName(naam)];
  return p && havenZone(p.zone) ? p.zone : HAVEN_START_ZONE;
}
function havenSlotVanBak(naam){
  const p = havenPosities[normalizeBargeName(naam)];
  return p && Number.isInteger(p.slot) ? p.slot : null;
}

// Positiecode uit de VH/HGK-lijst, bijv. "BA" = bakboord achter, "MA" =
// midden achter, "SA" = stuurboord achter. Eerste letter dwarsscheeps,
// tweede letter langsscheeps.
function ontleedPositie(code){
  if(!code) return null;
  const m = String(code).trim().toUpperCase().replace(/\s+/g,'').match(/^([BMS])([AV])$/);
  if(!m) return null;
  // In de tekening: voor ligt links en achter rechts; stuurboord ligt boven
  // en bakboord onder. BA komt dus rechtsonder, SV linksboven.
  return { dwars: { S:0, M:1, B:2 }[m[1]], langs: m[2] === 'V' ? 0 : 1, code: m[0] };
}

/* Welke boot haalt deze vertrekset, en wanneer. De vertrekcel staat in de
   VH/HGK-lijst vaak op één regel van een kleurblok ingevuld maar hoort bij de
   hele set — anders kreeg maar één bak een tabje. Daarom per kleursleutel
   (bakGroupKey) aangevuld. */
function vertrekPerGroep(){
  const uit = new Map();
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.forEach(v => {
      if(!v.naam || !v.vertrekboot) return;
      const key = bakGroupKey(v, bron);
      if(!uit.has(key)) uit.set(key, { boot: v.vertrekboot, tijd: v.vertrektijd || null });
    });
  });
  return uit;
}

/* Even onthouden wat er net al uitgerekend is.

   Bij één verplaatsing liep havenBakken() tien keer en havenBakkenMetPlek()
   acht keer — elke keer opnieuw door alle ritten, regels en lijsten. Op de PC
   is dat 0,1 ms per keer en dus onzichtbaar, op de tablet telt het op.

   De uitkomst blijft daarom gelden zolang de huidige handeling loopt, en
   vervalt daarna vanzelf (queueMicrotask: alles wat synchroon achter elkaar
   staat deelt de uitkomst, alles ná een await rekent opnieuw). Plus de
   plekken die de gegevens zélf wijzigen zetten hem meteen weg — zie
   havenVergeetBerekening().

   Belangrijk: elke aanroeper krijgt zijn eigen kopieën. havenBakkenMetPlek()
   schrijft `slot` en `plek` op de objecten die het teruggeeft, en twee
   aanroepers mogen elkaars uitkomst niet onder handen nemen. */
let havenBerekendBakken = null;
let havenBerekendMetPlek = null;
let havenBerekendStempel = '';
let havenVergeetGepland = false;

function havenVergeetBerekening(){
  havenBerekendBakken = null;
  havenBerekendMetPlek = null;
  havenBerekendStempel = '';
}
function havenBewaarBerekening(){
  if(havenVergeetGepland) return;
  havenVergeetGepland = true;
  queueMicrotask(() => { havenVergeetGepland = false; havenVergeetBerekening(); });
}

/* Een goedkoop kenmerk van de gegevens waar de haven op leunt.

   Niet elke wijziging loopt via een save — een tegel op "aanwezig" zetten
   verandert eerst alleen `trip.aangemeerd` in het geheugen, en dán pas mag de
   volgende aanroep niet met een verouderde uitkomst komen. Alles tellen is te
   duur; dit telt alleen wat de uitkomst daadwerkelijk kan veranderen, en dat
   is bij vijftien ritten verwaarloosbaar. Klopt het kenmerk niet meer, dan
   wordt er gewoon opnieuw gerekend. */
function havenBerekeningStempel(){
  let aangemeerd = 0, actief = 0;
  for(const t of trips){
    if(t.aangemeerd) aangemeerd++;
    if(t.status === 'actief') actief++;
  }
  return `${trips.length}|${aangemeerd}|${actief}|${vhBakken.length}|${hgkBakken.length}` +
         `|${Object.keys(havenPosities).length}|${vhGroupColorMap.size}`;
}

const havenKopieBak = (b) => {
  const k = { ...b, plek: b.plek ? { ...b.plek } : b.plek };
  const ov = b.sleutel && havenKleurOverrides[b.sleutel];
  if(ov) k.kleur = ov;     // handmatig bij een andere bergvaart gezet
  const vb = b.sleutel && havenVertrekOverrides[b.sleutel];
  if(vb && vb.boot){       // vertrekboot met de hand gezet (idee 6): wint van de lijst
    k.vertrekbootLijst = k.vertrekbootEcht;   // voor "volgens de lijst" in de kiezer
    k.vertrekboot = k.vertrekbootEcht = vb.boot;
    if(vb.tijd) k.vertrektijd = vb.tijd;   // meeverhuisd naar de set van die boot
    k.vertrekHand = true;
  }
  const p = b.sleutel && havenPosities[b.sleutel];
  k.binnenSinds = p && p.zone !== HAVEN_VERTROKKEN ? (p.binnen || p.sinds || null) : null;
  return k;
};

function havenBakken(){
  const stempel = havenBerekeningStempel();
  if(havenBerekendBakken && havenBerekendStempel !== stempel) havenVergeetBerekening();
  if(!havenBerekendBakken){
    havenBerekendBakken = havenBakkenBereken();
    havenBerekendStempel = stempel;
    havenBewaarBerekening();
  }
  return havenBerekendBakken.map(havenKopieBak);
}

function havenBakkenBereken(){
  const uit = [];
  const vertrekGroep = vertrekPerGroep();
  /* Welke bakken er al in staan, als verzameling. Hier stond twee keer een
     `uit.some(...)`: een lineaire zoektocht door alles wat er al lag, voor elke
     volgende bak, met twee normalisaties per vergelijking. Met 180 bakken zijn
     dat er al gauw zestienduizend. */
  const gezien = new Set();
  // bakkenInHaven: een afgeronde rit telt nog mee zolang zijn bakken op de
  // volle plaats op hun boot wachten (tegel weg uit de planlijst, bakken fysiek
  // nog aanwezig). Historie-ritten hebben de vlag niet.
  trips.filter(t => t.aangemeerd && (t.status === 'actief' || t.bakkenInHaven)).forEach(trip => {
    trip.rows.forEach(r => {
      if(!r.leichter || !r.leichter.trim() || isDummyName(r.leichter)) return;
      if(havenIsVertrokken(r.leichter)) return;          // opgehaald door zijn boot
      const grp = getEffectiveGroupForRow(r);
      const setKey = grp ? grp.key : `LOS|${trip.id}`;
      const sleutel = normalizeBargeName(r.leichter);
      if(gezien.has(sleutel)) return;
      gezien.add(sleutel);
      uit.push({
        naam: r.leichter,
        sleutel,
        tripId: trip.id,
        setKey,
        gekoppeld: !!grp,
        kleur: (grp && grp.entry && grp.entry.kleur && vhGroupColorMap.get(grp.key)) || '#8D98A5',
        vertrekboot: (grp && grp.entry && (grp.entry.vertrekboot || grp.entry.schip)) || trip.schubboot || '?',
        /* Alleen de écht vertrekkende boot, zonder de terugval op het
           aankomstschip die `vertrekboot` hierboven wel heeft. De tabjes onder
           een tegel horen te zeggen wie hem kómt halen; stond daar de
           aankomstboot, dan las je alleen terug waar hij vandaan kwam. Is de
           vertrekboot nog niet bekend, dan hoort er dus ook geen tabje. */
        vertrekbootEcht: (grp && grp.entry && grp.entry.vertrekboot)
                         || (vertrekGroep.get(setKey) || {}).boot || null,
        // Het schip waarmee de bak is binnengekomen. Dat stond nergens op de
        // bak zelf, terwijl de bakkenplaats er juist naar geordend wordt.
        aankomstschip: (grp && grp.entry && grp.entry.schip) || r.ankunftsboot || null,
        tijd: (grp && grp.entry && grp.entry.tijd) || null,
        vertrektijd: (grp && grp.entry && grp.entry.vertrektijd)
                     || (vertrekGroep.get(setKey) || {}).tijd || null,
        // Bij welke tegel hoort deze bak — zie havenTegelSleutel(). Zonder
        // VH/HGK-match stond hij nooit in Onderweg, dus dan blijft de rit zelf
        // de eenheid. Heb jij hem zelf bij een andere tegel gezet, dan wint dat.
        tegelSleutel: havenTegelVanBak(r.leichter, grp
          ? havenTegelSleutel((grp.entry && grp.entry.schip) || r.ankunftsboot, grp.entry && grp.entry.tijd)
          : `LOS|${trip.id}`),
        materiaal: r.materiaal || '',
        // Zie openBakStatusModal (src/06): 'niet_aanwezig' of 'repareren',
        // gezet op de planlijst-tegel. De haven toont alleen 'repareren' —
        // dat is waar je in de haven iets aan moet dóen (de machine moet
        // weten dat hij hem niet moet laden); 'niet_aanwezig' betekent
        // juist dat de bak hier niet ligt, dus daar is in de haven niets
        // bij te tekenen.
        status: r.bakStatus || null,
        positie: (grp && grp.entry && grp.entry.positie) || null,
        zone: havenPositieVanBak(r.leichter),
        slot: havenSlotVanBak(r.leichter)
      });
    });
  });

  // Bakken die wél op de VH/HGK-lijst staan maar geen EECV-tegel hebben,
  // horen bij hun set en moeten dus meekomen als die set binnenvaart. Ze
  // hangen aan geen enkele rit, dus hun aanwezigheid volgt die van hun set:
  // ligt er een aangemeerde tegel in de set, dan liggen zij er ook. Zet je
  // die tegel weer op niet-aanwezig, dan gaan zij mee terug naar Onderweg.
  // Ook bakken zonder celkleur tellen mee. bakGroupKey() valt voor die bakken
  // terug op schip + tijd, dus ze horen gewoon bij hun aankomstset.
  /* Eén kaart van baksleutel naar de actieve ritten waarin die bak voorkomt.

     Hier stonden drie lussen in elkaar: per bak, per rit, per ladingsregel, met
     een naamvergelijking in de kern — en `trips.filter(...)` draaide bij elke
     bak opnieuw. Bij 180 bakken, 45 ritten en 4 regels is dat 32.400
     naamvergelijkingen per aanroep, en havenBakken() draait vijf keer per
     hertekening. Nu wordt de kaart één keer opgebouwd en daarna opgezocht. */
  const ritPerSleutel = new Map();
  trips.filter(t => t.status === 'actief').forEach(t => {
    t.rows.forEach(r => {
      if(!r.leichter) return;
      for(const k of bargeSleutels(r.leichter)){
        let ritten = ritPerSleutel.get(k);
        if(!ritten){ ritten = new Set(); ritPerSleutel.set(k, ritten); }
        ritten.add(t);
      }
    });
  });

  const setHeeftRit = new Set(), setIsAangemeerd = new Set();
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.forEach(v => {
      if(!v.naam) return;
      const key = bakGroupKey(v, bron);
      for(const k of bargeSleutels(v.naam)){
        const ritten = ritPerSleutel.get(k);
        if(!ritten) continue;
        ritten.forEach(t => {
          setHeeftRit.add(key);
          if(t.aangemeerd) setIsAangemeerd.add(key);
        });
      }
    });
  });

  /* Per lijst apart, want `vhBakken.includes(v)` verderop was een lineaire
     zoektocht per bak om te weten uit welke lijst hij kwam — terwijl we dat
     hier gewoon weten. */
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.forEach(v => {
    // Geen celkleur is geen reden om een bak buiten de haven te houden. Sinds
    // Onderweg per aankomstschip+tijd groepeert (1.79) staan kleurloze bakken
    // wél in de wachtrij; zonder deze regel sleepte je een set van vier naar
    // binnen en bleef die ene zonder kleur zichtbaar achter in Onderweg.
    if(!v.naam) return;
    if(havenIsVertrokken(v.naam)) return;               // opgehaald door zijn boot
    const sleutel = normalizeBargeName(v.naam);
    // Laadt hij ergens anders — Gent, EBS, EMO, de werf — dan ligt hij hier
    // normaal niet, en hoort hij dus ook niet op een bakkenplaats. Maar heb jij
    // hem er zelf naartoe gesleept (een vastgelegde ligplaats), dan wint die
    // handeling: hij ligt waar je hem neerlegde, net als elke andere bak.
    if(plekBuitenDeHaven(v) && !havenPosities[sleutel]) return;
    /* Staat er geen aankomsttijd bij, dan ligt de bak er al — de lijst noemt
       een tijd alleen voor wat nog moet komen. Zo'n bak hoort dus op de lege
       bakkenplaats, ook als er nooit een ligplaats voor is vastgelegd en er
       geen tegel bij hoort. Zonder dit bleef hij in Onderweg staan terwijl
       hij in het echt gewoon in de haven lag. */
    const alBinnen = !(v.tijd && String(v.tijd).trim());
    if(!havenPosities[sleutel] && !alBinnen) return;    // moet nog komen
    if(gezien.has(sleutel)) return;                     // al via een rit binnen
    const key = bakGroupKey(v, bron);
    // hoort de set bij ritten die allemaal op niet-aanwezig staan, dan
    // ligt deze bak er ook niet meer
    if(setHeeftRit.has(key) && !setIsAangemeerd.has(key)) return;
    gezien.add(sleutel);
    uit.push({
      naam: v.naam,
      sleutel,
      tripId: null,
      setKey: key,
      gekoppeld: true,
      zonderRit: true,
      kleur: (v.kleur && vhGroupColorMap.get(key)) || '#8D98A5',
      vertrekboot: v.vertrekboot || v.schip || '?',
      vertrekbootEcht: v.vertrekboot || (vertrekGroep.get(key) || {}).boot || null,
      aankomstschip: v.schip || null,
      tijd: v.tijd || null,
      vertrektijd: v.vertrektijd || (vertrekGroep.get(key) || {}).tijd || null,
      tegelSleutel: havenTegelVanBak(v.naam, havenTegelSleutel(v.schip, v.tijd)),
      materiaal: '',
      positie: v.positie || null,
      zone: havenPositieVanBak(v.naam),
      slot: havenSlotVanBak(v.naam)
    });
    });
  });

  /* De haven als eigen waarheid (idee 6). Eerst: van elke bak die echt een
     ligplaats in de haven heeft, onthouden wat we nu over hem weten. */
  const ligtHier = s => { const p = havenPosities[s]; return !!(p && p.zone !== HAVEN_VERTROKKEN && havenZone(p.zone)); };
  let bewaardGewijzigd = false;
  uit.forEach(b => {
    if(!ligtHier(b.sleutel)) return;
    const { naam, setKey, kleur, vertrekboot, vertrekbootEcht, aankomstschip, tijd, vertrektijd, tegelSleutel, materiaal, positie } = b;
    const nieuw = { naam, setKey, kleur, vertrekboot, vertrekbootEcht, aankomstschip, tijd, vertrektijd, tegelSleutel, materiaal, positie };
    if(JSON.stringify(havenBewaard[b.sleutel]) !== JSON.stringify(nieuw)){ havenBewaard[b.sleutel] = nieuw; bewaardGewijzigd = true; }
  });
  if(bewaardGewijzigd) havenBewaardOpslaan();

  /* Dan: een bak die in de haven ligt maar op geen enkele actieve rit en in
     geen enkele lijst meer voorkomt, valt niet stil weg. Hij blijft liggen met
     zijn laatst bekende gegevens en een "niet op lijst"-merk, tot iemand hem
     laat vertrekken. Staat hij nog wél ergens (bijv. zijn tegel op niet-
     aanwezig gezet), dan geldt het gewone gedrag: terug naar Onderweg. */
  const opLijst = new Set();
  [vhBakken, hgkBakken].forEach(l => l.forEach(v => { if(v.naam) bargeSleutels(v.naam).forEach(k => opLijst.add(k)); }));
  const ergensBekend = s => bargeSleutels(s).some(k => ritPerSleutel.has(k) || opLijst.has(k));
  Object.keys(havenPosities).forEach(s => {
    const snap = havenBewaard[s];
    if(!snap || gezien.has(s) || !ligtHier(s) || ergensBekend(snap.naam)) return;
    gezien.add(s);
    uit.push({
      ...snap, sleutel: s, tripId: null, gekoppeld: false, zonderRit: true, nietOpLijst: true,
      zone: havenPositieVanBak(snap.naam), slot: havenSlotVanBak(snap.naam)
    });
  });

  return uit;
}

// Legt elke set als eigen blok neer, met de bakken op hun eigen plaats in
// de eenheid: dwarsscheeps (bakboord / midden / stuurboord, tot 3 waarden)
// bepaalt de kolom — dat is de kant die in het echt naast elkaar ligt, tot
// drie bakken breed. Langsscheeps (voor / achter, 2 waarden) bepaalt de rij:
// een set die alleen in de lengte verschilt ("in fles", achter elkaar) komt
// zo onder elkaar te liggen in plaats van naast elkaar. Was andersom (dwars
// als rij, langs als kolom) — dat liet een sleepstel dat volgens de lijst
// gewoon naast elkaar ligt "in fles" ogen: smal en hoog, met een kolom leeg.
// Sets zelf komen nog steeds onder elkaar (rijCursor schuift per set door).
function plaatsPerPositie(zone, lijst){
  // Zelfde getal als havenZoneKolommen(zone) geeft (een bakkenplaats telt in
  // hele bakken) — hier apart uitgerekend gelaten was eerder onschuldig,
  // maar sinds havenZoneSlots() diezelfde telling gebruikt om de plekken zelf
  // te nummeren, moeten deze twee wel exact gelijk blijven lopen. Vandaar
  // dezelfde functie, niet twee keer dezelfde som.
  const kolommen = havenZoneKolommen(zone);
  const slots = havenZoneSlots(zone);
  const bezet = new Set();

  // Een bak die al een plek heeft gekregen blijft daar liggen. Haal je er
  // een weg, dan schuift de rest dus niet op — alleen jij verplaatst bakken.
  const nieuw = [];
  lijst.forEach(b => {
    if(b.slot != null && b.slot < slots.length && !bezet.has(b.slot)){
      bezet.add(b.slot);
      b.plek = slots[b.slot];
    } else {
      b.slot = null;
      nieuw.push(b);
    }
  });

  // groepeer de nog niet geplaatste bakken per tegel (aankomstschip + tijd,
  // niet per kleur — anders komt een meerkleurige set in losse stukken neer)
  const volgorde = [];
  const perSet = new Map();
  nieuw.forEach(b => {
    if(!perSet.has(b.tegelSleutel)){ perSet.set(b.tegelSleutel, []); volgorde.push(b.tegelSleutel); }
    perSet.get(b.tegelSleutel).push(b);
  });

  // zoek de eerste rij waar een hele set nog vrij is
  const rijVrij = (rij, hoogte) => {
    for(let r = rij; r < rij + hoogte; r++)
      for(let k = 0; k < kolommen; k++)
        if(bezet.has(r*kolommen + k)) return false;
    return true;
  };

  let rijCursor = 0;
  volgorde.forEach(key => {
    const bakken = perSet.get(key);
    // Welke dwars- (kolom) en langs- (rij) waarden komen in deze set voor.
    // Alleen de waarden die er echt zijn tellen mee (indexOf hieronder) —
    // komt er bijvoorbeeld geen "midden" voor, dan blijft er geen lege
    // kolom/rij hangen tussen bakboord en stuurboord.
    const dwarsWaarden = [...new Set(bakken.map(b => ontleedPositie(b.positie)?.dwars)
                                    .filter(v => v != null))].sort((a,b) => a - b);
    const langsWaarden = [...new Set(bakken.map(b => ontleedPositie(b.positie)?.langs)
                                    .filter(v => v != null))].sort((a,b) => a - b);
    const hoogte = Math.max(langsWaarden.length, Math.ceil(bakken.length / kolommen), 1);
    const maxRij = Math.max(1, Math.floor(slots.length / kolommen));
    while(rijCursor + hoogte <= maxRij && !rijVrij(rijCursor, hoogte)) rijCursor++;

    bakken.forEach((b, i) => {
      const p = ontleedPositie(b.positie);
      let rij, kol;
      if(p && dwarsWaarden.length){
        kol = Math.min(kolommen - 1, Math.max(0, dwarsWaarden.indexOf(p.dwars)));
        rij = rijCursor + Math.max(0, langsWaarden.indexOf(p.langs));
      } else {                                  // geen bruikbare code: op volgorde
        rij = rijCursor + Math.floor(i / kolommen);
        kol = i % kolommen;
      }
      let idx = rij * kolommen + kol;
      // botsing of buiten de plaats: schuif door naar de eerstvolgende vrije
      while(idx < slots.length && bezet.has(idx)) idx++;
      if(idx < slots.length){
        bezet.add(idx);
        b.slot = idx;
        b.plek = slots[idx];
      } else {
        b.slot = null;
        b.plek = null;
      }
    });

    rijCursor += hoogte;
  });
}

// Verdeelt de bakken over de vrije plekken van een zone. Bakken met een
// vastgelegde plek houden die; de rest schuift naar de eerstvolgende vrije.
function havenBakkenMetPlek(){
  // havenBakken() hieronder controleert zelf of het kenmerk nog klopt en zet
  // de hele berekening weg als dat niet zo is — vandaar deze volgorde.
  const vers = havenBakken();
  if(!havenBerekendMetPlek){
    havenBerekendMetPlek = havenBakkenMetPlekBereken(vers);
    havenBewaarBerekening();
  }
  return havenBerekendMetPlek.map(havenKopieBak);
}

/* De volle plaats als lijst van posities: elke vertrekset krijgt zijn eigen rij
   (één set per rij, hoogstens 6 bakken breed = de volle zonebreedte). Zo is er
   per rij precies één plek en levert de zonediepte 12 posities op die Herman op
   de volle plaats wil zien (okt 2026). Een set met een vastgelegde rij (uit
   havenPosities, via het slot van zijn bakken) houdt die rij; de rest schuift
   naar de eerste vrije rij. De 2D-vorm van de set (paren naast elkaar) zit in de
   weergave (havenBakBlokjes), niet meer in de ligging hier — anders besloeg een
   set van zes meerdere rijen en klopte het aantal posities niet. */
function plaatsVolPerRij(zone, lijst){
  const kolommen = havenZoneKolommen(zone);
  const slots = havenZoneSlots(zone);
  const rijen = Math.max(1, Math.floor(slots.length / kolommen));
  const slotOp = (rij, kol) => slots.find(s => s.rij === rij && s.kol === kol) || null;

  const perSet = new Map(), volgorde = [];
  lijst.forEach(b => {
    const k = havenPlaatsGroepKey(b);
    if(!perSet.has(k)){ perSet.set(k, []); volgorde.push(k); }
    perSet.get(k).push(b);
  });

  // De rij die een set al had: de laagste vastgelegde slot-rij van zijn bakken.
  const vasteRij = bak => {
    const rs = bak.map(b => (b.slot != null && slots[b.slot]) ? slots[b.slot].rij : null)
                  .filter(r => r != null);
    return rs.length ? Math.min(...rs) : null;
  };

  const bezet = new Set();
  const sets = volgorde.map(k => ({ bak: perSet.get(k), rij: vasteRij(perSet.get(k)) }));
  // Eerst de sets met een geldige, nog vrije rij vastzetten.
  sets.forEach(s => {
    if(s.rij != null && s.rij >= 0 && s.rij < rijen && !bezet.has(s.rij)) bezet.add(s.rij);
    else s.rij = null;
  });
  // De rest naar de eerste vrije rij.
  let volgende = 0;
  sets.forEach(s => {
    if(s.rij == null){
      while(volgende < rijen && bezet.has(volgende)) volgende++;
      s.rij = volgende < rijen ? volgende : null;
      if(s.rij != null) bezet.add(s.rij);
    }
    s.bak.forEach((b, i) => {
      const kol = i * KOLOMMEN_PER_BAK;
      const slot = (s.rij != null && kol + KOLOMMEN_PER_BAK <= kolommen) ? slotOp(s.rij, kol) : null;
      if(slot){ b.slot = slot.index; b.plek = { ...slot, w: BAK_LENGTE_M }; }
      else { b.slot = null; b.plek = null; }
    });
  });
}

function havenBakkenMetPlekBereken(bakkenIn){
  const bakken = bakkenIn || havenBakken();
  const perZone = {};
  bakken.forEach(b => { (perZone[b.zone] ||= []).push(b); });

  Object.entries(perZone).forEach(([zoneId, lijst]) => {
    const zone = havenZone(zoneId);
    if(!zone) return;
    if(zone.perPositie){ plaatsPerPositie(zone, lijst); return; }
    if(zoneId === 'vol'){ plaatsVolPerRij(zone, lijst); return; }
    const slots = havenZoneSlots(zone);
    const kolommen = havenZoneKolommen(zone);
    const bezet = new Set();
    // Een bak beslaat twee halve kolommen; allebei moeten ze vrij zijn en
    // in dezelfde rij liggen.
    const paar = (i) => {
      const s = slots[i];
      if(!s) return null;
      const t = slots[i + 1];
      return (t && t.rij === s.rij) ? [i, i + 1] : null;
    };
    const vrij = (i) => { const p = paar(i); return p && !bezet.has(p[0]) && !bezet.has(p[1]); };
    const neem = (i) => { const p = paar(i); p.forEach(x => bezet.add(x)); };
    lijst.forEach(b => {
      if(b.slot != null && vrij(b.slot)) neem(b.slot);
      else b.slot = null;
    });
    let volgende = 0;
    lijst.forEach(b => {
      if(b.slot == null){
        while(volgende < slots.length && !vrij(volgende)) volgende++;
        b.slot = volgende < slots.length ? volgende : null;   // null = past niet
        if(b.slot != null) neem(b.slot);
      }
      b.plek = b.slot != null
        ? { ...slots[b.slot], w: BAK_LENGTE_M }   // twee halve kolommen breed
        : null;
    });
  });

  /* Een eenheid mag nooit uit elkaar getrokken worden.

     Het gat tussen twee laadlengtes zit in de kolomposities, en een set die
     over zo'n grens valt kreeg dat gat dus middenin — twee bakken tegen de 3e
     aan, twee op de 3e, met een halve baklengte ertussen. Dat is geen set
     meer.

     Het gat is vrije kade, geen muur: liggen er bakken van één eenheid
     overheen, dan staan die gewoon tegen elkaar. Daarom worden de bakken van
     een set hier aaneengesloten gelegd, vanaf de plek van de meest westelijke
     bak. Verder naar het oosten komt niets in de knel: een set die een gat
     overslaat wordt korter dan het raster toestaat, nooit langer. */
  const perZoneSet = new Map();
  bakken.forEach(b => {
    if(!b.plek || b.slot == null) return;
    const k = b.zone + '|' + havenPlaatsGroepKey(b);
    if(!perZoneSet.has(k)) perZoneSet.set(k, []);
    perZoneSet.get(k).push(b);
  });

  perZoneSet.forEach(lijst => {
    if(lijst.length < 2) return;
    const zone = havenZone(lijst[0].zone);
    if(!zone) return;
    const westKolom = Math.min(...lijst.map(b => b.plek.kol));
    const westX = havenKolomX(zone, westKolom);
    const stap = havenKolomStap(zone);
    lijst.forEach(b => {
      b.plek = { ...b.plek, x: westX + (b.plek.kol - westKolom) * stap };
    });
  });

  return bakken;
}

// Ligt een hele tegel op één laadlengte? Dan mag station/liegeplaats mee.
// Anders laten we die velden met rust en markeren we de tegel als verdeeld.
function havenTegelPositie(trip){
  const bakken = trip.rows.filter(r => r.leichter && r.leichter.trim() && !isDummyName(r.leichter));
  if(!bakken.length) return { verdeeld:false, zone:null, zones:[] };
  const zones = [...new Set(bakken.map(r => havenPositieVanBak(r.leichter)))];
  return { verdeeld: zones.length > 1, zone: zones[0], zones };
}

// Legt de plekken vast die zojuist automatisch zijn toegekend. Zonder dit
// zou een bak bij het volgende hertekenen opnieuw ingedeeld worden en dus
// opschuiven zodra er eentje weggaat.
async function havenVerankerPosities(){
  const bakken = havenBakkenMetPlek();
  let gewijzigd = false;
  bakken.forEach(b => {
    if(b.slot == null) return;
    const bestaand = havenPosities[b.sleutel];
    if(!bestaand || bestaand.zone !== b.zone || bestaand.slot !== b.slot){
      havenPosities[b.sleutel] = havenNieuwePositie(b.sleutel, b.zone, b.slot, Date.now());
      gewijzigd = true;
    }
  });
  if(gewijzigd) await saveHavenPosities();
  return gewijzigd;
}

// --- Bakken verplaatsen --------------------------------------------
// Bepaalt hoe de meeverhuizende bakken onderling liggen, als (rij, kol)
// vanaf linksboven. Eerste keus is hoe ze nu in de haven liggen — daarmee
// blijft een handmatig verschoven bak op zijn plek. Ligt er nog niets
// (bijvoorbeeld een set die net uit Onderweg komt), dan volgt de indeling
// uit de positiecode: stuurboord boven, bakboord onder, voor links.
//
// Met negeerHuidige sla je die eerste keus over. Dat is nodig bij het
// hergroeperen van een set: dan wil je juist níét de huidige ligging
// behouden, want die is precies wat er mis is — anders verhuist het
// uit elkaar getrokken patroon gewoon mee.
function havenRelatieveIndeling(namen, negeerHuidige, doelZone){
  const sleutels = namen.map(normalizeBargeName);
  const geplaatst = havenBakkenMetPlek()
    .filter(b => sleutels.includes(b.sleutel) && b.plek);

  /* "Hoe ze nu liggen" is alleen een geldige vorm als ze nu allemaal in
     dezelfde zone liggen, en die zone in hele bakken-paren telt zoals een
     kade of de palen (havenZoneSlots: twee halve kolommen per bak). Een
     bakkenplaats (leeg/vol) telt met perPositie juist één plek per bak —
     daar loopt kol gewoon 0, 1, 2, ... per bak, niet per paar halve kolommen.
     Werd die waarde hier alsnog door KOLOMMEN_PER_BAK (2) gedeeld, dan kwam
     er een halve kolom uit voor elke oneven bak (0, 0,5, 1, ...) — en daarmee
     paste het "blok" nergens meer precies, met een sleepsom tot gevolg die
     de set uit elkaar trok: twee bakken op de bedoelde laadlengte, de derde
     ergens anders op de kade. Gebeurde bij elke tegel die voor het eerst
     vanaf de lege bakkenplaats "klaar om te laden" ging. Zonder één zone die
     zo telt, valt dit terug op de positiecode hieronder — die is overal
     geldig, want die kent geen zone. */
  const eenZone = geplaatst.length && new Set(geplaatst.map(b => b.zone)).size === 1
    ? havenZone(geplaatst[0].zone) : null;

  if(!negeerHuidige && geplaatst.length === namen.length && eenZone && !eenZone.perPositie){
    const minR = Math.min(...geplaatst.map(b => b.plek.rij));
    const minK = Math.min(...geplaatst.map(b => b.plek.kol));
    /* `kol` telt hier in bakken, net als in de andere twee takken hieronder —
       het raster telt in halve bakken en de gebruiker vermenigvuldigt zelf.
       Deze tak gaf de afstand in hálve bakken door, en dan werd die dus twee
       keer geteld: een set die op 0 en 2 lag kwam na verslepen op 0 en 4 te
       liggen, de keer daarna op 0 en 8. Elke sleepbeweging trok de set verder
       uit elkaar. Een halve getal blijft gewoon staan — zo houdt een set die
       een halve bak verspringt die verspringing. */
    return geplaatst.map(b => ({
      sleutel: b.sleutel, rij: b.plek.rij - minR,
      kol: (b.plek.kol - minK) / KOLOMMEN_PER_BAK
    }));
  }

  /* Vanaf de lege bakkenplaats naar een kade of de palen: de vorm zoals de
     tegel hem tekent. Rij op de tegel = dwars = rij op de kade, kolom = langs.
     Hier werd eerst opnieuw uit de positiecodes gerekend, en had één bak geen
     code, dan viel het terug op "twee breed": drie bakken die op de tegel naast
     elkaar lagen, kwamen op de kade als twee achter elkaar met de derde ervoor. */
  if(doelZone && !doelZone.perPositie && geplaatst.length === namen.length
     && geplaatst.every(b => b.zone === 'leeg')){
    const tegel = havenPlaatsSets('leeg').find(s => s.bakken.some(b => b.sleutel === sleutels[0]));
    const cellen = new Map();
    if(tegel) havenBakRaster(tegel.bakken).raster
      .forEach((rij, r) => rij.forEach((b, k) => { if(b) cellen.set(b.sleutel, { r, k }); }));
    if(sleutels.every(s => cellen.has(s))){
      const minR = Math.min(...sleutels.map(s => cellen.get(s).r));
      const minK = Math.min(...sleutels.map(s => cellen.get(s).k));
      return sleutels.map(s => ({ sleutel: s, rij: cellen.get(s).r - minR, kol: cellen.get(s).k - minK }));
    }
  }

  // uit de positiecodes van de VH/HGK-lijst
  const bron = new Map();
  const lijstVolgorde = new Map();
  [...vhBakken, ...hgkBakken].forEach((v, i) => {
    const s = normalizeBargeName(v.naam);
    if(!sleutels.includes(s)) return;
    if(!bron.has(s)) bron.set(s, v.positie);
    if(!lijstVolgorde.has(s)) lijstVolgorde.set(s, i);
  });
  const codes = sleutels.map(s => ontleedPositie(bron.get(s)));
  const dwars = [...new Set(codes.filter(Boolean).map(c => c.dwars))].sort((a,b) => a-b);
  const langs = [...new Set(codes.filter(Boolean).map(c => c.langs))].sort((a,b) => a-b);
  // Op een kade/palen (halve-kolom-tellend) bepaalt dwars de rij en langs de
  // kolom — zo lag het al vóór deze wijziging, en dat is gevalideerd gedrag
  // (v1.161). Op een bakkenplaats (perPositie) is het net als in
  // plaatsPerPositie/havenBakBlokjes omgedraaid: dwars (tot 3, "hoeveel
  // bakken breed") is daar de kolom, langs ("in fles") de rij. Zonder dit
  // onderscheid rekende deze functie hier nog met de kade-indeling, ook als
  // het doel een bakkenplaats was — en trok dat een set die net naar een
  // andere rij verschoof (havenSchuifSetNaarRij) alsnog uit elkaar.
  const kadeIndeling = !doelZone || !doelZone.perPositie;

  if(dwars.length && codes.every(Boolean)){
    const uit = sleutels.map((s, i) => kadeIndeling
      ? { sleutel: s, rij: dwars.indexOf(codes[i].dwars), kol: codes[i].langs }
      : { sleutel: s, rij: langs.indexOf(codes[i].langs), kol: dwars.indexOf(codes[i].dwars) }
    );
    // Een positiecode beschrijft een plek binnen één eenheid. Verplaats je
    // bakken uit twee verschillende sets tegelijk, dan botsen de codes en
    // zouden er twee bakken op dezelfde plek belanden — waarna de ene de
    // andere overschrijft en er stilletjes eentje verdwijnt. In dat geval
    // valt hij terug op een gewone volgorde.
    const bezet = new Set(uit.map(v => v.rij + ',' + v.kol));
    if(bezet.size === uit.length) return uit;
  }

  // Geen volledige positiecodes: twee breed, maar wél in de volgorde waarin de
  // bakken op de VH/HGK-lijst staan. Eerder werd de volgorde genomen waarin ze
  // toevallig werden aangeleverd, en dan lag dezelfde set de ene keer anders
  // dan de andere. Bakken die niet op de lijst staan sluiten achteraan aan.
  const opVolgorde = [...sleutels].sort((a, b) => {
    const ia = lijstVolgorde.has(a) ? lijstVolgorde.get(a) : Number.MAX_SAFE_INTEGER;
    const ib = lijstVolgorde.has(b) ? lijstVolgorde.get(b) : Number.MAX_SAFE_INTEGER;
    if(ia !== ib) return ia - ib;
    return sleutels.indexOf(a) - sleutels.indexOf(b);
  });
  return opVolgorde.map((s, i) => ({ sleutel: s, rij: Math.floor(i/2), kol: i % 2 }));
}

// Werkt voor één bak, een deel van een set of een hele set: geef de
// baknamen mee die samen moeten verhuizen.
/* Zoekt waar een set terecht zou komen, zonder iets te verplaatsen.
 *
 * Stond eerder middenin havenVerplaatsBakken(). Het is er uit getild zodat de
 * ghost tijdens het slepen precies dezelfde berekening kan gebruiken als de
 * verplaatsing zelf — anders laat je iets zien dat net niet klopt met wat er
 * daarna gebeurt, en dat is erger dan niets laten zien.
 *
 * Levert null als het nergens past. */
/* `strikt` betekent: precies hier of nergens.

   Normaal zoekt de app een vrije plek in de buurt als de aangewezen plek
   bezet is. Bij slepen is dat prettig — de ghost laat zien waar hij landt.
   Maar bij het opschuiven van een tegel in een bakkenplaats-menu wijs je een
   exacte plek aan zonder ghost, en dan zag je alleen dat de tegel na afloop
   weer stond waar hij stond: de app had hem stilletjes teruggelegd omdat er
   geen ruimte was. Strikt wil dat niet; die zegt gewoon nee. */
/* Aan welke kant van de zone ligt de wal?

   B2/B3 ligt met de kade bovenaan in beeld, B4 onderaan. Bakken horen tegen
   de wal te liggen, niet tegen het water — op B4 vullen de rijen dus van
   onderen naar boven. Zonder dit kwam een set op B4 bovenin de laadlengte
   terecht, met open water tussen de bakken en de kade. */
function havenVultVanOnderen(zone){
  return !!zone && zone.type === 'kade' && zone.kade === 'b4';
}

/* Tik je op een laadlengte, dan bedoel je die laadlengte — niet de halve bak
   waar je vinger toevallig neerkwam. De set begint dus op de eerste plek van
   dat oranje vak; past hij daar niet, dan zoekt havenZoekPlaats hieronder zo
   dicht mogelijk aansluitend een plek, en past het nergens dan blijft alles
   staan en zegt de app waarom. */
function havenSlotOpLaadlengte(zone, slotIndex){
  if(!zone || zone.type !== 'kade' || slotIndex == null) return slotIndex;
  const slots = havenZoneSlots(zone);
  const onder = slots.find(s => s.index === slotIndex);
  if(!onder) return slotIndex;
  const lengte = (zone.lengtes || []).find(l =>
    onder.kol >= l.vanKolom && onder.kol < l.vanKolom + l.kolommen);
  if(!lengte) return slotIndex;
  /* Ook de rij gaat naar de walkant: op B4 ligt de wal onderin, dus tik je
     daar een laadlengte aan, dan hoort de set tegen de wal te komen en niet
     op de rij waar je vinger toevallig terechtkwam. havenZoekPlaats schuift
     vervolgens zover terug als de set diep is. */
  const rijen = slots.length ? slots[slots.length - 1].rij + 1 : 1;
  const rij = havenVultVanOnderen(zone) ? rijen - 1 : onder.rij;
  const start = slots.find(s => s.rij === rij && s.kol === lengte.vanKolom);
  return start ? start.index : slotIndex;
}

/* De bezette rastervakken van een zone, zonder de bakken die zelf verhuizen.
   Op een kade beslaat een bak twee halve kolommen, dus ook het vak ernaast. */
function havenBezetteSlots(zone, sleutels){
  const bezet = new Set();
  havenBakkenMetPlek()
    .filter(b => b.zone === zone.id && !sleutels.includes(b.sleutel) && b.slot != null)
    .forEach(b => {
      bezet.add(b.slot);
      if(!zone.perPositie) bezet.add(b.slot + 1);
    });
  return bezet;
}

/* Hoeveel losse bakken passen er nog op een laadlengte (fout 9). Per rij van
   west naar oost: twee vrije halve kolommen naast elkaar is één bakplek. De
   bak moet binnen de lengte beginnen, net als een set in havenZoekPlaats. */
function havenVrijeBakplekken(namen, zoneId, binnen){
  const zone = havenZone(zoneId);
  if(!zone || !binnen) return 0;
  const bezet = havenBezetteSlots(zone, namen.map(normalizeBargeName));
  const slots = havenZoneSlots(zone);
  const vrij = (r, k) => { const s = slots.find(x => x.rij === r && x.kol === k); return !!s && !bezet.has(s.index); };
  const rijen = slots.length ? slots[slots.length - 1].rij + 1 : 0;
  let aantal = 0;
  for(let r = 0; r < rijen; r++){
    for(let k = binnen.vanKolom; k <= binnen.totKolom - 1; ){
      if(vrij(r, k) && vrij(r, k + 1)){ aantal++; k += KOLOMMEN_PER_BAK; } else k++;
    }
  }
  return aantal;
}

/* `strikt` kan ook een laadlengte zijn: { vanKolom, totKolom, bereik }.
   Dan mag de set overal binnen die lengte beginnen waar hij past — eerst
   tegen de wal, dan opschuivend het water in (fout 9: één bak op de 2e lengte
   maakte de hele lengte "vol"). `bereik` is het stuk kade waar de machine bij
   kan; een plek waar de hele set daarbinnen ligt gaat voor. */
function havenZoekPlaats(namen, zoneId, startSlot, herindelen, strikt){
  const zone = havenZone(zoneId);
  if(!zone || !namen.length) return null;

  const slots = havenZoneSlots(zone);
  const sleutels = namen.map(normalizeBargeName);
  const rijen = slots.length ? slots[slots.length-1].rij + 1 : 0;
  const opRijKol = (r, k) => slots.find(s => s.rij === r && s.kol === k) || null;

  /* Op een kade/palen beslaat een bak twee halve kolommen (KOLOMMEN_PER_BAK);
     op een bakkenplaats (perPositie) is een kolom al een hele bak, dus is er
     geen tweede helft om óók te blokkeren. Zonder dit onderscheid markeerde
     de regel hieronder voor élke bezette bak op een bakkenplaats ook nog de
     kolom ernaast als bezet — een vak dat er niets mee te maken had, en bij
     de laatste kolom van een rij zelfs de eerste kolom van de vólgende rij. */
  const stapPerBak = zone.perPositie ? 1 : KOLOMMEN_PER_BAK;
  const bezet = havenBezetteSlots(zone, sleutels);

  // De onderlinge ligging binnen een eenheid moet meeverhuizen: een bak
  // verandert pas van plaats als je hem los oppakt.
  let indeling = havenRelatieveIndeling(namen, herindelen, zone);

  /* Een set ligt altijd twee bakken diep, maar "diep" ligt anders op een kade
     dan op een bakkenplaats. De bakkenplaats is twee kolommen breed en veel
     rijen diep; de kade is twee rijen diep en negen kolommen lang. Dezelfde
     set van zes is daar dus 2 breed × 3 diep, en hier 3 lang × 2 diep.

     Past het blok niet in de hoogte van de zone maar gekanteld wel, dan
     kantelen we het. Zonder dit belandde een set van zes op de kade in drie
     rijen, terwijl er maar twee zijn — en dan viel de helft weg.

     En andersom net zo goed: de duwbakkenpalen zijn één bak breed en vier
