  VH:    { letter: 'V', naam: 'Veerhaven' },
  WZ:    { letter: 'W', naam: 'Willem Zwaan' },
  HGK:   { letter: 'H', naam: 'HGK' },
  ESP:   { letter: 'E', naam: 'Espera' },
  ANCIS: { letter: 'A', naam: 'Ancis' },
  ANT:   { letter: 'A', naam: 'Antwerpia' }
};
function bakEigenaar(naam){
  const t = parseBargeToken(naam);
  if(!t) return null;
  const fam = t.prefix === 'A' ? (Number(t.number) <= 10 ? 'ANCIS' : 'ANT') : bargeFamiliesOf(t.prefix)[0];
  return EIGENAAR_PER_FAMILIE[fam] || null;
}
/* Het gekleurde letterbadge vóór een baknaam; leeg als de eigenaar onbekend is. */
function eigenaarBadge(naam){
  const e = bakEigenaar(naam);
  return e ? `<span class="eig eig-${e.letter.toLowerCase()}" title="${e.naam}">${e.letter}</span>` : '';
}
/* De sleutels waaronder een baknaam bekend staat. Twee namen horen bij dezelfde
   bak precies als hun sleutelverzamelingen elkaar raken — zo wordt matchen een
   Map-opzoeking i.p.v. paarsgewijs de hele lijst doorlopen. Soorten sleutels:
   'B|<familie>|<nummer>' (ontleedbaar) en '=<genormaliseerd>' (de rest).
   Zie docs/NOTITIES.md — bargeSleutels. */
const SLEUTEL_GEHEUGEN = new Map();
function bargeSleutels(naam){
  /* Onthouden op de genórmaliseerde naam, niet op de ruwe. "VH 3", "vh 3" en
     "VH  3" leveren dezelfde sleutels op, dus met de ruwe naam als ingang zou
     elk van die schrijfwijzen een eigen plekje krijgen. Normaliseren is toch al
     gratis — dat heeft zijn eigen geheugen. */
  const s = normalizeBargeName(naam);
  const klaar = SLEUTEL_GEHEUGEN.get(s);
  if(klaar !== undefined) return klaar;
  const t = parseBargeToken(s);
  /* Bevroren, want de uitkomst wordt gedeeld: iedereen die dezelfde naam
     opvraagt krijgt dezelfde array terug. Eén .sort() of .push() door een
     latere aanroeper zou het geheugen voor de rest van de sessie vervuilen. */
  const uit = Object.freeze(t
    ? bargeFamiliesOf(t.prefix).map(f => 'B|' + f + '|' + t.number)
    : ['=' + s]);
  if(SLEUTEL_GEHEUGEN.size >= 5000) SLEUTEL_GEHEUGEN.clear();
  SLEUTEL_GEHEUGEN.set(s, uit);
  return uit;
}

// Vergelijkt twee baknamen met begrip van afkortingsvarianten en de
// dubbelzinnige "A" — i.p.v. alleen letterlijke tekstgelijkheid. De regel zelf
// staat in bargeSleutels; hier blijft alleen de vraag of ze elkaar raken.
function bargeNamesMatch(a, b){
  const ka = bargeSleutels(a), kb = bargeSleutels(b);
  for(const k of ka) if(kb.indexOf(k) !== -1) return true;
  return false;
}

// Sommige sleepboten worden op de ene lijst afgekort genoteerd met een
// gewoon cijfer (bijv. "HK 8"), en op de andere voluit met een Romeins
// cijfer (bijv. "Herkules VIII") — dat is hetzelfde schip, geen verschil om
// te melden. Uitbreidbaar met meer schip-alias-families indien nodig.
const SHIP_NAME_FAMILIES = [
  { family: 'HERKULES', variants: ['HK', 'HERKULES', 'HERCULES'] },
  // Veerhaven-duwboten worden voluit ("Veerhaven 5") of kort ("VH 5")
  // genoteerd; op het scherm willen we altijd de korte vorm, net als bij HK.
  { family: 'VEERHAVEN', variants: ['VH', 'VEERHAVEN'] }
];
// Scheepstype-aanduidingen die voor de naam kunnen staan
const SHIP_NAME_PREFIXES = /^(MS|MTS|MV|SB|TMS)\s+/;

function romanToInt(s){
  const map = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 };
  s = (s || '').toUpperCase();
  // Alleen geldige Romeinse notatie accepteren. Zo wordt een verhaspeld
  // "VLLL" niet stilzwijgend als 145 gelezen.
  if(!s || !/^M{0,3}(CM|CD|D?C{0,3})(XC|XL|L?X{0,3})(IX|IV|V?I{0,3})$/.test(s)) return null;
  let total = 0;
  for(let i = 0; i < s.length; i++){
    const cur = map[s[i]], next = map[s[i+1]];
    total += (next && cur < next) ? -cur : cur;
  }
  return total || null;
}

function parseShipToken(name){
  let s = normalizeBargeName(name);
  s = s.replace(SHIP_NAME_PREFIXES, '');       // "MS Herkules VIII" -> "HERKULES VIII"
  s = s.replace(/\s*\([^)]*\)/g, '');          // "Herkules VIII (SB)" -> "HERKULES VIII"
  s = s.replace(/[\/,].*$/, '');               // "Herkules VIII/2"    -> "HERKULES VIII"
  s = s.trim();
  // Scheiding tussen naam en nummer mag een spatie, koppelteken, punt,
  // liggend streepje of helemaal niets zijn: "HK8", "HK 8", "HK-8".
  const m = s.match(/^([A-Z]+)[\s\-_.]*([A-Z0-9]+)$/);
  if(!m) return { prefix: s, number: null };
  const prefix = m[1];
  const tail = m[2];
  const number = /^\d+$/.test(tail) ? parseInt(tail, 10) : romanToInt(tail);
  return { prefix, number };
}
function shipFamilyOf(prefix){
  const found = SHIP_NAME_FAMILIES.find(f => f.variants.includes(prefix));
  return found ? found.family : prefix;
}
function shipNamesMatch(a, b){
  if(!a || !b) return false;
  if(normalizeBargeName(a) === normalizeBargeName(b)) return true;
  const ta = parseShipToken(a), tb = parseShipToken(b);
  if(ta.number == null || tb.number == null) return false;
  return ta.number === tb.number && shipFamilyOf(ta.prefix) === shipFamilyOf(tb.prefix);
}

/* Import-controle (1.211): weiger de verkeerde lijst. Herman las ooit per
   ongeluk het HGK-bestand onder VH in — daar kwam de "zelfde bak in beide
   lijsten met een andere vertrekboot"-puzzel vandaan. De herkenning gaat over
   de dúwboten in de aankomst- en vertrekkolom, niet over de baknamen (die
   overlappen juist tussen beide lijsten). Eén herkende duwboot is genoeg. */
const HGK_LOSSE_BOTEN = ['DAAN', 'VEERLE'];

function lijstDuwboten(flat){
  const uit = new Set();
  (flat || []).forEach(v => [v.schip, v.vertrekboot].forEach(n => {
    if(n && String(n).trim()) uit.add(String(n).trim());
  }));
  return [...uit];
}
function isVhDuwboot(naam){
  const t = parseShipToken(naam);
  return t.number != null && (t.prefix === 'VH' || t.prefix === 'VEERHAVEN');
}
function isHgkDuwboot(naam){
  if(shipFamilyOf(parseShipToken(naam).prefix) === 'HERKULES') return true;
  return HGK_LOSSE_BOTEN.includes(normalizeBargeName(naam));
}

/* Geeft null als het klopt, anders de melding die de import moet afbreken.

   Alleen een lijst met duwboten van de ándere rederij wordt geweigerd. Staat er
   helemaal geen eigen duwboot in (de duwboten liggen stil en alleen zelfladers van
   derden varen met onze bakken), dan is er niets om de lijst op te herkennen en
   gaat hij gewoon door; lijstZonderEigenDuwboten() laat dat na afloop weten. Eerst
   weigerde de import ook dat geval, en dan was er geen manier meer om zo'n lijst
   in te lezen. */
function controleerLijstsoort(flat, soort){
  const boten = lijstDuwboten(flat);
  const heeftVh = boten.some(isVhDuwboot);
  const heeftHgk = boten.some(isHgkDuwboot);
  if(soort === 'VH'){
    return heeftHgk && !heeftVh
      ? 'Dit lijkt de HGK-lijst: er staan Herkules-, Daan- of Veerle-duwboten in en geen enkele VH-duwboot. '
        + 'De lijst is niet ingelezen. Kies het VH-bestand, of lees dit bestand in bij HGK.'
      : null;
  }
  return heeftVh && !heeftHgk
    ? 'Dit lijkt de VH-lijst: er staan VH-duwboten in en geen enkele Herkules, Daan of Veerle. '
      + 'De lijst is niet ingelezen. Kies het HGK-bestand, of lees dit bestand in bij VH.'
    : null;
}

// Geen enkele duwboot van VH of HGK in aankomst of vertrek: alleen schepen van derden.
function lijstZonderEigenDuwboten(flat){
  const boten = lijstDuwboten(flat);
  return !boten.some(isVhDuwboot) && !boten.some(isHgkDuwboot);
}

/* Korte scheepsnaam voor compacte weergaves (planlijst, Onderweg,
   bakkenplaats-tegels, Overzicht-tijdlijn): "Herkules VIII" -> "HK 8" en
   "Veerhaven 5" -> "VH 5", met dezelfde parseShipToken/romanToInt die hierboven
   al bepalen of twee schrijfwijzen hetzelfde schip zijn — geen tweede, eigen
   Romeins-cijfer-ontleding erbij. "H2Go / Venjo" -> "Venjo": H2Go is de
   vervrachter die de Venjo chartert, geen deel van de scheepsnaam. Puur voor
   weergave: vergelijkingen met de EECV/VH/HGK-lijsten (shipNamesMatch hierboven)
   blijven de volledige, originele naam gebruiken. */
const SCHIP_KORTE_VORM = { HERKULES: 'HK', VEERHAVEN: 'VH' };
function verkortSchipnaam(naam){
  if(!naam) return naam;
  const n = String(naam).replace(/^H2Go\s*\/\s*/i, '').trim();
  const token = parseShipToken(n);
  const kort = SCHIP_KORTE_VORM[shipFamilyOf(token.prefix)];
  if(kort) return token.number != null ? `${kort} ${token.number}` : kort;
  return n;
}

// Kolom F zet de vertrekboot met datum en tijd in één cel, maar VH en HGK
// schrijven dat net anders op:
//
//   VH    "VH 10 26/10:00"
//   HGK   "Veerle / 26.02. ca. 20:00"
//
// Alleen de VH-vorm werd herkend; bij HGK belandde de hele cel in de naam.
// "Veerle / 26.02. ca. 20:00" kwam dan niet meer overeen met "Veerle" op de
// EECV-lijst, waardoor de tegel een afwijking meldde die er niet was. Beide
// vormen worden nu gesplitst — voor de vergelijking telt alleen de naam.
/* Sinds 1.316 twee vormen erbij, allebei gezien in de HGK-lijst van
   12-10-2026 (gelden voor Excel én PDF):

   1. "Vigilia 13.10. ca. 18:00" — HGK-vorm zónder schuine streep. Viel eerst
      door alle patronen heen en werd in z'n geheel de naam van de vertrekboot.
   2. "geen opvaart mogelijk i v m diepgang" — geen vertrekboot maar een
      opmerking in dezelfde kolom. Werd eerst als vertrekboot gelezen, en dan
      lijkt het in de app alsof er een boot met die naam komt. Herkenning: geen
      tijd en vier of meer woorden (een bootnaam is één tot drie woorden:
      "Daan", "Herkules XII", "H2Go / Venjo").

   parseVhBlocks() neemt `opmerking` mee naar de bak; plekBuitenDeHaven() leest
   dat veld al. */
function parseVertrekCell(str){
  if(!str) return { vertrekboot: null, vertrektijd: null, opmerking: null };
  const tekst = String(str).trim().replace(/\s+/g, ' ');

  // VH: naam, spatie, dag/tijd
  let m = tekst.match(/^(.+?) (\d{1,2}\/\d{1,2}:\d{2})$/);
  if(m) return { vertrekboot: m[1].trim(), vertrektijd: m[2], opmerking: null };

  // HGK: naam, eventueel schuine streep, datum, eventueel "ca.", tijd
  m = tekst.match(/^(.+?) ?(?:\/ ?)?(\d{1,2}[.\/]\d{1,2}\.? ?(?:ca\.? ?)?\d{1,2}:\d{2})$/i);
  if(m) return { vertrekboot: m[1].trim(), vertrektijd: m[2].trim(), opmerking: null };

  if(tekst.split(' ').length >= 4) return { vertrekboot: null, vertrektijd: null, opmerking: tekst };
  return { vertrekboot: tekst, vertrektijd: null, opmerking: null };
}

// Lijsten die vóór v1.102 zijn ingelezen hebben de datum nog in de naam staan.
// Eenmalig rechttrekken, zodat er niet opnieuw geïmporteerd hoeft te worden.
function splitsVertrekbootOpnieuw(lijst){
  let aangepast = 0;
  lijst.forEach(b => {
    if(!b.vertrekboot) return;
    const opnieuw = parseVertrekCell(b.vertrekboot);
    if(opnieuw.vertrekboot !== b.vertrekboot){
      b.vertrekboot = opnieuw.vertrekboot;
      if(!b.vertrektijd) b.vertrektijd = opnieuw.vertrektijd;
      if(opnieuw.opmerking && !b.opmerking) b.opmerking = opnieuw.opmerking;
      aangepast++;
    }
  });
  return aangepast;
}

function parseVhBlocks(rows, sheetName){
  const timeRe = /\d{1,2}:\d{2}/; // herkent zowel "20/12:00" (VH) als "03.07. / ca. 05:00" (HGK)
  const blocks = [];
  let cur = null;
  function flush(){
    // Let op: geen kleur op een bak-cel betekent hier "NNB, nog niet bekend"
    // (nog geen vertrekset) — dat mag dus nooit alsnog een kleur van andere
    // bakken in hetzelfde blok overnemen.
    if(cur && cur.bakken.length) blocks.push(cur);
    cur = null;
  }
  rows.forEach(vals => {
    const [a,b,c,d,e,f,kleur] = vals;
    const isEmpty = vals.slice(0,6).every(v => v===null || v===undefined || (typeof v==='string' && !v.trim()));
    if(isEmpty){ flush(); return; }
    if(!cur) cur = { schip: null, tijd: null, bakken: [], bestemming: null, sheet: sheetName };
    if(typeof a === 'string' && a.trim()){
      const s = a.trim();
      if(timeRe.test(s)) cur.tijd = s;
      else if(!cur.schip) cur.schip = s;
    }
    if(c !== null && c !== undefined && String(c).trim()){
      const vertrek = (f !== null && f !== undefined && String(f).trim()) ? parseVertrekCell(f) : { vertrekboot: null, vertrektijd: null, opmerking: null };
      cur.bakken.push({
        positie: (typeof b === 'string' ? b.trim() : b) || null,
        naam: String(c).trim(),
        kleur: kleur || null,
        lading: (e !== null && e !== undefined && String(e).trim()) ? String(e).trim() : null,
        vertrekboot: vertrek.vertrekboot,
        vertrektijd: vertrek.vertrektijd,
        opmerking: vertrek.opmerking || null
      });
    } else if(typeof b === 'string' && /^[BMS][AV]$/.test(b.trim().toUpperCase())){
      /* Idee 22: een aankomende boot met wel een positiecode maar nog geen
         baknaam. Die bak komt wel — als dummy, zodat hij in Onderweg staat.
         De naam volgt in vhBlokkenNaarFlat, als schip en tijd bekend zijn. */
      const vertrek = (f !== null && f !== undefined && String(f).trim()) ? parseVertrekCell(f) : { vertrekboot: null, vertrektijd: null, opmerking: null };
      cur.bakken.push({
        positie: b.trim().toUpperCase(),
        naam: null,
        kleur: kleur || null,
        lading: (e !== null && e !== undefined && String(e).trim()) ? String(e).trim() : null,
        vertrekboot: vertrek.vertrekboot,
        vertrektijd: vertrek.vertrektijd,
        opmerking: vertrek.opmerking || null
      });
    }
    if(e !== null && e !== undefined && String(e).trim() && !cur.bestemming){
      cur.bestemming = String(e).trim();
    }
  });
  flush();
  return blocks;
}

/* HGK stuurt dezelfde lijst soms als Excel, soms als PDF. De PDF is die Excel
   via "Opslaan als PDF": elke cel is één tekstblok dat links op de kolom
   begint, en een celkleur is een gekleurde rechthoek onder de tekst. Hier
   bouwen we daarom precies dezelfde rijen [A, B, C, D, E, F, kleur] als
   parseBakkenExcel() en laat parseVhBlocks() de rest doen. Zo is er één
   ontleding voor beide bestandsvormen, en alles na het inlezen (kleursets,
   vertrek aanvullen, lijstsoortcontrole) werkt voor de PDF vanzelf ook.

   Wat verloren gaat t.o.v. de Excel: tekstkleur. De grijze regel ("ligt in
   de Hartelhaven") wordt een gewone bak zonder setkleur, net als in Excel. */

/* Gekleurde vlakken op een pagina: [{x0,y0,x1,y1,kleur}] in paginacoördinaten
   (zelfde ruimte als getTextContent). Opgebouwd uit de operatorlijst van
   pdf.js 3.x (lib/pdf.min.js 3.11): constructPath = [ops, coords], kleur via
   setFillRGBColor. Wit en bijna-wit telt niet als setkleur. */
async function pdfVulvlakken(page){
  const OPS = pdfjsLib.OPS;
  const argsPerOp = { [OPS.moveTo]: 2, [OPS.lineTo]: 2, [OPS.curveTo]: 6,
                      [OPS.curveTo2]: 4, [OPS.curveTo3]: 4, [OPS.closePath]: 0, [OPS.rectangle]: 4 };
  const vulOps = new Set([OPS.fill, OPS.eoFill, OPS.fillStroke, OPS.eoFillStroke,
                          OPS.closeFillStroke, OPS.closeEOFillStroke]);
  const ol = await page.getOperatorList();
  const vlakken = [];
  let ctm = [1, 0, 0, 1, 0, 0];
  const stapel = [];
  let kleur = '000000';
  let pad = [];      // rechthoeken van het lopende pad, al in paginacoördinaten

  const zet = (x, y) => [ctm[0]*x + ctm[2]*y + ctm[4], ctm[1]*x + ctm[3]*y + ctm[5]];
  const hex = a => typeof a[0] === 'string'
    ? a[0].replace('#', '').toUpperCase()                         // pdf.js 4+: "#rrggbb"
    : [a[0], a[1], a[2]].map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();

  ol.fnArray.forEach((fn, i) => {
    const args = ol.argsArray[i];
    if(fn === OPS.save) stapel.push(ctm);
    else if(fn === OPS.restore) ctm = stapel.pop() || [1, 0, 0, 1, 0, 0];
    else if(fn === OPS.transform){
      const [a, b, c, d, e, f] = args, m = ctm;
      ctm = [m[0]*a + m[2]*b, m[1]*a + m[3]*b, m[0]*c + m[2]*d, m[1]*c + m[3]*d,
             m[0]*e + m[2]*f + m[4], m[1]*e + m[3]*f + m[5]];
    }
    else if(fn === OPS.setFillRGBColor) kleur = hex(args);
    else if(fn === OPS.constructPath){
      const [ops, coords] = args;
      let k = 0;
      ops.forEach(op => {
        if(op === OPS.rectangle){
          const [x, y, w, h] = coords.slice(k, k + 4);
          const [ax, ay] = zet(x, y), [bx, by] = zet(x + w, y + h);
          pad.push({ x0: Math.min(ax, bx), y0: Math.min(ay, by), x1: Math.max(ax, bx), y1: Math.max(ay, by) });
        }
        k += argsPerOp[op] || 0;
      });
    }
    else if(vulOps.has(fn)){
      const r = parseInt(kleur.slice(0, 2), 16), g = parseInt(kleur.slice(2, 4), 16), b = parseInt(kleur.slice(4, 6), 16);
      if(Math.min(r, g, b) < 245) pad.forEach(v => vlakken.push({ ...v, kleur }));
      pad = [];
    }
    else if(fn === OPS.endPath) pad = [];
  });
  return vlakken;
}

const PDF_POSITIE_RE = /^[SMB][VA]$/i;

/* Kolomgrenzen uit de tekst zelf: Excel lijnt elke cel links uit, dus alle
   blokken van één kolom beginnen op (bijna) dezelfde x. Volgorde in de HGK-
   sheet: A schip/tijd, B positie, C bak, (D leeg), E lading, F vertrekboot of
   opmerking. B is de kolom waar de positiecodes staan; die mag ontbreken
   (een lijst zonder één positie). Alles rechts van E is F. */
function pdfKolommen(items){
  const clusters = [];
  [...items].sort((a, b) => a.x - b.x).forEach(it => {
    const laatst = clusters[clusters.length - 1];
    if(laatst && it.x - laatst.x <= 6){ laatst.n++; if(PDF_POSITIE_RE.test(it.str)) laatst.pos++; }
    else clusters.push({ x: it.x, n: 1, pos: PDF_POSITIE_RE.test(it.str) ? 1 : 0 });
  });
  const echt = clusters.filter(c => c.n >= 2);       // losse koptekst (de datum) telt niet mee
  const iB = echt.findIndex(c => c.pos * 2 >= c.n);
  const iC = iB >= 0 ? iB + 1 : 1;
  const A = echt[0], B = iB >= 0 ? echt[iB] : null, C = echt[iC], E = echt[iC + 1];
  if(!A || !C || !E || (B && iB === 0)){
    throw new Error('De kolommen van deze PDF konden niet herkend worden. Is dit de HGK-lijst zoals Excel hem als PDF opslaat?');
  }
  return { B: B ? B.x : null, C: C.x, E: E.x };
}

function pdfKolomVan(x, k){
  if(x < (k.B != null ? k.B : k.C) - 3) return 0;   // A
  if(k.B != null && x < k.C - 3) return 1;          // B
  if(x < k.E - 3) return 2;                         // C
  if(x <= k.E + 6) return 4;                        // E
  return 5;                                         // F
}

/* Eén PDF-pagina -> rijen zoals parseVhBlocks() ze uit Excel krijgt. Een lege
   regel tussen twee groepen staat in de PDF alleen als extra witruimte; die
   zetten we terug als lege rij, want daarop splitst parseVhBlocks() de blokken. */
async function pdfPaginaNaarRijen(page){
  const tc = await page.getTextContent();
  const items = tc.items
    .filter(it => it.str && it.str.trim())
    .map(it => ({ x: it.transform[4], y: it.transform[5], str: it.str.trim().replace(/\s+/g, ' ') }));
  if(!items.length) return [];
  const kol = pdfKolommen(items);
  const vlakken = await pdfVulvlakken(page);

  items.sort((a, b) => b.y - a.y || a.x - b.x);
  const regels = [];
  items.forEach(it => {
    const laatst = regels[regels.length - 1];
    if(laatst && Math.abs(laatst.y - it.y) <= 2) laatst.items.push(it);
    else regels.push({ y: it.y, items: [it] });
  });

  const afstanden = regels.slice(1).map((r, i) => regels[i].y - r.y).sort((a, b) => a - b);
  const regelhoogte = afstanden.length ? afstanden[Math.floor(afstanden.length / 2)] : 0;

  const rijen = [];
  regels.forEach((r, i) => {
    if(i && regelhoogte && regels[i - 1].y - r.y > regelhoogte * 1.5) rijen.push([null, null, null, null, null, null, null]);
    const rij = [null, null, null, null, null, null];
    r.items.sort((a, b) => a.x - b.x).forEach(it => {
      const c = pdfKolomVan(it.x, kol);
      rij[c] = rij[c] ? rij[c] + ' ' + it.str : it.str;
    });
    // Kleur van de bak-cel (kolom C), net als in Excel. Het laatst getekende
    // vlak ligt bovenop; een punt net boven de basislijn zit altijd in de cel.
    const px = kol.C + 1, py = r.y + 3;
    const vlak = vlakken.filter(v => px >= v.x0 && px <= v.x1 && py >= v.y0 && py <= v.y1).pop();
    rij.push(vlak ? vlak.kleur : null);
    rijen.push(rij);
  });
  return rijen;
}

async function parseBakkenPdf(file){
  const pdf = await openPdfDocument(file);
  try{
    let rijen = [];
    for(let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      rijen = rijen.concat(await pdfPaginaNaarRijen(page), [[null, null, null, null, null, null, null]]);
      page.cleanup();
    }
    return vhBlokkenNaarFlat(parseVhBlocks(rijen, 'PDF'));
  }finally{
    if(pdf.cleanup) pdf.cleanup();
    if(pdf.destroy) pdf.destroy();
  }
}

/* Gedeeld door parseBakkenExcel() en parseBakkenPdf(), zodat Excel en PDF
   exact dezelfde velden opleveren. */
/* Naam van een dummy-bak (idee 22): uniek per boot + tijd + positie, en
   herkenbaar voor isDummyName. Op het scherm staat "BA · dummy" (bakLabel) — de code vooraan, want een smal bakje kapt achteraan af. */
function dummyNaam(schip, tijd, positie){
  return ['Dummy', schip, tijd, positie].filter(Boolean).join(' ').replace(/\s+/g, ' ');
}
function bakLabel(b){
  if(!b) return '';
  return isDummyName(b.naam) && b.positie ? `${b.positie} · dummy` : (b.naam || '');
}

function vhBlokkenNaarFlat(blocks){
  // Een dummy zonder aankomstboot is geen aankomst: die laten we weg.
  return blocks.flatMap(bl => bl.bakken.filter(bak => bak.naam || bl.schip).map(bak => ({
    naam: bak.naam || dummyNaam(bl.schip, bl.tijd, bak.positie),
    positie: bak.positie,
    schip: bl.schip,
    tijd: bl.tijd,
    bestemming: bak.lading || bl.bestemming,
    vertrekboot: bak.vertrekboot,
    vertrektijd: bak.vertrektijd,
    opmerking: bak.opmerking || null,
    sheet: bl.sheet,
    kleur: bak.kleur
  })));
}

async function parseBakkenExcel(file){
  await ensureXlsx();
  const buf = await file.arrayBuffer();
  // sheetRows begrenst hoeveel rijen SheetJS zelf inleest — voorkomt dat een
  // sheet met een veel te groot opgemaakt gebied (leeg tot rij 100.000+) het
  // geheugen laat vollopen. cellStyles is nodig om de kleur van een bak-cel
  // te kunnen lezen (zie hieronder).
  const wb = XLSX.read(buf, { type: 'array', cellDates: true, sheetRows: 3000, cellStyles: true });
  const flat = [];
  wb.SheetNames.forEach(sheetName => {
    if(/bijzonderheden/i.test(sheetName)) return; // geen dagplanning, maar keuringsdata
    const ws = wb.Sheets[sheetName];
    if(!ws['!ref']) return;
    // de daadwerkelijke laatste rij met data bepalen i.p.v. het (vaak veel te
    // ruime) opgemaakte gebied in '!ref' te vertrouwen
    let maxRow = -1;
    for(const key in ws){
      if(key.charCodeAt(0) === 33) continue; // '!'-sleutels overslaan
      const m = key.match(/^[A-Z]+(\d+)$/);
      if(m){
        const r = parseInt(m[1], 10) - 1;
        if(r > maxRow) maxRow = r;
      }
    }
    if(maxRow < 0) return;
    maxRow = Math.min(maxRow, 3000);
    const rows = [];
    for(let r = 0; r <= maxRow; r++){
      const row = [];
      let kleur = null;
      for(let c = 0; c < 6; c++){
        const ref = XLSX.utils.encode_cell({ r, c });
        const cell = ws[ref];
        row.push(cell ? cell.v : null);
        // kleur van de bak-naam-cel (kolom C): een handmatige markering die
        // aangeeft welke bakken écht bij elkaar horen, los van de
        // tekstuele blokindeling — soms wijkt dat af van het schip erboven.
        if(c === 2 && cell && cell.s){
          const resolved = resolveCellFillHex(cell.s);
          if(resolved) kleur = resolved;
        }
      }
      row.push(kleur); // 7e element
      rows.push(row);
    }
    flat.push(...vhBlokkenNaarFlat(parseVhBlocks(rows, sheetName)));
  });
  return flat;
}


</script>

<script>
/* Auteur: HvdB */
/* ---------------------------------------------------------------
   IMPORT FLOW
--------------------------------------------------------------- */
/* De drie importknoppen waren <label>'s die naar een verborgen bestandsveld
   wezen. Dat veld is 1 bij 1 pixel en staat buiten beeld, dus met Tab belandde
   de focus daar: onzichtbaar, zonder naam. Nu zijn het echte knoppen die het
   veld zelf openen; het veld is uit de tabvolgorde gehaald. */
document.querySelectorAll('[data-kiest]').forEach(knop => {
  knop.addEventListener('click', () => {
    document.getElementById(knop.dataset.kiest)?.click();
  });
  // Slepen uit Outlook (of Verkenner): sleep de xlsx/pdf-bijlage rechtstreeks
  // op de EECV/VH/HGK-knop. We stoppen het bestand in hetzelfde <input> en
  // vuren 'change' af, zodat de bestaande import-afhandeling het overneemt —
  // welke knop je kiest bepaalt de lijstsoort (een xlsx kan VH óf HGK zijn).
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  knop.addEventListener('dragover', e => { stop(e); e.dataTransfer.dropEffect = 'copy'; knop.style.outline = '2px dashed currentColor'; });
  knop.addEventListener('dragleave', () => { knop.style.outline = ''; });
  knop.addEventListener('drop', e => {
    stop(e); knop.style.outline = '';
    const file = e.dataTransfer.files[0];
    if(!file) return;
    const input = document.getElementById(knop.dataset.kiest);
    if(!input) return;
    const dt = new DataTransfer(); dt.items.add(file);
    input.files = dt.files;
    input.dispatchEvent(new Event('change'));
  });
});

/* ── Topbar op een platte telefoon ──────────────────────────────────
   Zet de klasse die de CSS hierboven (body.landscape-telefoon) gebruikt, én
   verhuist de drie importknoppen en "Ongedaan maken" naar het ⋯-menu — in
   een kolom van 90px is daar geen zinnige plek voor. Verplaatsen, niet
   verbergen-en-dupliceren: dat blijven dezelfde knoppen met dezelfde
   klik-afhandeling (hierboven), die dus niet opnieuw bekabeld hoeft te
   worden, en "Ongedaan maken" houdt zijn eigen aan/uit-logica (elders in de
   code, via zijn id) vanzelf overeind — een kopie zou daar niet in meelopen.

   havenIsTelefoonLandscape() heet zo naar zijn eerste gebruik (de haven),
   maar de voorwaarde erachter — plat en weinig hoogte — is niet haven-
   specifiek, vandaar het hergebruik hier. */
function pasTopbarLandscapeAan(){
  const landscape = havenIsTelefoonLandscape();
  document.body.classList.toggle('landscape-telefoon', landscape);

  const menu = document.getElementById('moreMenu');
  const rij = document.querySelector('.action-row');
  const meerMenuWrap = document.querySelector('.more-menu-wrap');
  if(!menu || !rij || !meerMenuWrap) return;
  const eersteMenuItem = menu.querySelector('.more-item');
  /* Sinds 1.198 zitten de drie importknoppen in één strook (#bronnen) en
     heten ze .bron in plaats van .import-btn. Verplaats die strook als geheel
     — hem uit elkaar trekken zou de omlijning en de scheidingslijntjes
     kapotmaken, en de knoppen erbinnen houden hun eigen data-kiest dus hun
     klikafhandeling loopt gewoon door. */
  const knoppen = [document.getElementById('bronnen'), document.getElementById('undoLink')]
    .filter(Boolean);

  if(landscape){
    knoppen.forEach(knop => {
      // Niet menu.contains(knop): #moreMenu zit zelf ook genest ín
      // .action-row (via .more-menu-wrap), dus die check bleef ook waar
      // vóór de verplaatsing, en dan gebeurt er nooit iets. De directe
      // ouder is wél het juiste onderscheid.
      if(knop.parentElement === menu) return;
      knop.setAttribute('role', 'menuitem');
      menu.insertBefore(knop, eersteMenuItem);
    });
  } else {
    knoppen.forEach(knop => {
      if(knop.parentElement === rij) return;
      knop.removeAttribute('role');
      rij.insertBefore(knop, meerMenuWrap);
    });
  }
}
// De eerste aanroep staat in init() (08-init.js): havenIsTelefoonLandscape()
// komt uit een later geladen module, dus hier bij het laden nog niet bekend.
// Rotatie van de telefoon vuurt 'resize' — verder niets, want render() wordt
// anders alleen bij een statuswijziging opnieuw aangeroepen. Zonder deze
// listener bleef de haven (renderHavenTab()'s eigen havenIsTelefoon()-check)
// bij een draai staan op de indeling van vóór het draaien, tot de eerste
// volgende tik ergens anders. render() is hier veilig: het bouwt alleen het
// huidige tabblad opnieuw op, net als na elke andere wijziging. Ontdaan van
// herhaling: een rotatie vuurt 'resize' soms een paar keer vlak na elkaar.
let topbarResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(topbarResizeTimer);
  topbarResizeTimer = setTimeout(() => { pasTopbarLandscapeAan(); render(); }, 150);
});

/* Het ⋯-menu open en dicht, en dat ook in de code vastleggen met
   aria-expanded — anders weet een schermlezer niet of er iets uitgeklapt is.
   Escape sluit het en geeft de focus terug aan de knop, en met de pijltjes
   loop je door de opties. */
function zetMeerMenu(open){
  const knop = document.getElementById('moreMenuBtn');
  const menu = document.getElementById('moreMenu');
  if(!knop || !menu) return;
  menu.classList.toggle('open', open);
  knop.setAttribute('aria-expanded', String(open));
}

document.getElementById('moreMenuBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const open = !document.getElementById('moreMenu').classList.contains('open');
  zetMeerMenu(open);
  if(open) document.querySelector('#moreMenu .more-item')?.focus();
});

document.getElementById('moreMenu').addEventListener('keydown', (e) => {
  const opties = [...document.querySelectorAll('#moreMenu .more-item')];
  const nu = opties.indexOf(document.activeElement);
  if(e.key === 'Escape'){
    zetMeerMenu(false);
    document.getElementById('moreMenuBtn').focus();
    e.preventDefault();
  } else if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const stap = e.key === 'ArrowDown' ? 1 : -1;
    opties[(nu + stap + opties.length) % opties.length]?.focus();
    e.preventDefault();
  } else if(e.key === 'Home'){ opties[0]?.focus(); e.preventDefault(); }
  else if(e.key === 'End'){ opties[opties.length-1]?.focus(); e.preventDefault(); }
});
// Tab knoppen in menu moeten stopPropagation hebben
document.querySelectorAll('.more-menu .tab').forEach(tab => {
  tab.addEventListener('click', (e) => {
    e.stopPropagation();
  });
});
document.addEventListener('click', (e) => {
  if(!e.target.closest('.more-menu')) {
    zetMeerMenu(false);
  }
});
document.getElementById('resetLink').addEventListener('click', async () => {
  const ja = await vraagBevestiging({
    titel: 'Alles wissen?',
    tekst: 'De actieve planning, de historie, de VH- en HGK-lijsten en alles wat er in de haven ligt worden gewist. Dit kan niet ongedaan gemaakt worden.',
    bevestig: 'Alles wissen',
    gevaarlijk: true
  });
  if(ja) resetAllData();
});

/* Back-up (review 18-10, B2). Alles staat alleen in de browseropslag van dit
   apparaat; Safari wist die na 7 dagen niet openen, en een nieuwe iPad begint
   leeg. Eén JSON met elke duwbakken-*-sleutel zoals hij in de opslag staat. */
const BACKUP_PREFIX = 'duwbakken-';
function maakBackup(){
  const sleutels = {};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k.startsWith(BACKUP_PREFIX)) sleutels[k] = localStorage.getItem(k);
  }
  return { app: 'DintelLink', versie: APP_VERSION, gemaakt: new Date().toISOString(), sleutels };
}
// Geeft de foutmelding terug, of null als de back-up is teruggezet.
function zetBackupTerug(data){
  if(!data || data.app !== 'DintelLink' || !data.sleutels || typeof data.sleutels !== 'object') return 'Dit is geen DintelLink-back-up.';
  const paren = Object.entries(data.sleutels).filter(([k, v]) => k.startsWith(BACKUP_PREFIX) && typeof v === 'string');
  if(!paren.length) return 'Deze back-up is leeg.';
  const oud = maakBackup().sleutels;
  try{
    Object.keys(oud).forEach(k => localStorage.removeItem(k));
    paren.forEach(([k, v]) => localStorage.setItem(k, v));
  }catch(e){
    // Halverwege vol: de oude stand terug, niets half laten staan.
    Object.keys(localStorage).filter(k => k.startsWith(BACKUP_PREFIX)).forEach(k => localStorage.removeItem(k));
    Object.entries(oud).forEach(([k, v]) => { try{ localStorage.setItem(k, v); }catch(e2){ console.error(`Oude stand van "${k}" niet terug te zetten`, e2); } });
    console.error('Back-up terugzetten mislukt:', e);
    return 'Terugzetten mislukt (opslag vol?). Er is niets veranderd.';
  }
  return null;
}
document.getElementById('backupOpslaan').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(maakBackup())], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date(), p = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `DintelLink-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  showToast('Back-up opgeslagen. Bewaar hem buiten deze iPad (bijv. OneDrive of mail).');
});
document.getElementById('backupTerugzetten').addEventListener('click', () => document.getElementById('backupInput').click());
document.getElementById('backupInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(_){ showToast('Dit bestand is geen leesbare back-up.'); return; }
  const ja = await vraagBevestiging({

/* Elke modal gaat hier langs. Veertien losse bouwers deden elk hetzelfde half:
   een vlak over het scherm, maar zonder dat de rest van de app wist dat er een
   venster open stond.

   Wat hier in één keer geregeld wordt:
   - `role="dialog"` met `aria-modal`, en de kop die er toch al in staat als
     naam van het venster;
   - de focus gaat naar het eerste bedienbare element, in plaats van achter te
     blijven op de knop eronder;
   - Tab blijft binnen het venster. Zonder die grens loop je er met een paar
     keer Tab uit naar de pagina erachter — die je niet kunt zien, maar wel
     bedient;
   - Escape sluit;
   - bij het sluiten gaat de focus terug naar waar je vandaan kwam.

   De twee vraagvensters (tekst en bevestiging) regelen Escape zelf omdat ze
   een antwoord moeten teruggeven; die geven `escape: false` mee. Zou deze
   functie daar ook sluiten, dan blijft de belofte hangen en loopt de handeling
   die erop wacht vast. */
let modalVorigeFocus = null;
let modalTeller = 0;
let modalToetsen = null;

const MODAL_FOCUSBAAR =
  'a[href], button:not([disabled]), input:not([type="hidden"]):not([tabindex="-1"]), select, textarea, [tabindex]:not([tabindex="-1"])';

function toonModal(bd, { escape = true } = {}){
  modalVorigeFocus = document.activeElement;

  const kader = bd.querySelector('.modal') || bd;
  kader.setAttribute('role', 'dialog');
  kader.setAttribute('aria-modal', 'true');
  const kop = kader.querySelector('h2');
  if(kop){
    if(!kop.id) kop.id = 'modalkop-' + (++modalTeller);
    kader.setAttribute('aria-labelledby', kop.id);
  } else if(!kader.hasAttribute('aria-label')){
    kader.setAttribute('aria-label', 'Venster');
  }

  document.body.appendChild(bd);

  const focusbaar = () => [...kader.querySelectorAll(MODAL_FOCUSBAAR)]
    .filter(el => el.offsetParent !== null || el === document.activeElement);

  // Een venster dat opengaat hoort de focus te krijgen; anders typ je door in
  // het scherm eronder.
  const eerste = focusbaar()[0];
  if(eerste) eerste.focus();
  else { kader.setAttribute('tabindex', '-1'); kader.focus(); }

  modalToetsen = (e) => {
    if(e.key === 'Escape' && escape){ closeModal(); e.preventDefault(); return; }
    if(e.key !== 'Tab') return;
    const lijst = focusbaar();
    if(!lijst.length) return;
    const eerst = lijst[0], laatst = lijst[lijst.length - 1];
    if(e.shiftKey && document.activeElement === eerst){ laatst.focus(); e.preventDefault(); }
    else if(!e.shiftKey && document.activeElement === laatst){ eerst.focus(); e.preventDefault(); }
  };
  bd.addEventListener('keydown', modalToetsen);
}

/* Terug naar waar je vandaan kwam. Zonder dit begint Tab weer bovenaan de
   pagina en ben je kwijt waar je was. Apart, zodat de vensters die zichzelf
   opruimen (de twee vraagvensters) hem ook kunnen aanroepen. */
function herstelFocusNaModal(){
  if(modalVorigeFocus && modalVorigeFocus.isConnected){
    try { modalVorigeFocus.focus(); } catch(_){}
  }
  modalVorigeFocus = null;
}

function closeModal(){
  const bd = document.getElementById('modalBackdrop');
  if(bd){
    if(modalToetsen) bd.removeEventListener('keydown', modalToetsen);
    bd.remove();
  }
  modalToetsen = null;
  herstelFocusNaModal();
}

/* Eén tekstvraag in een eigen modal, in plaats van prompt(). Die wordt niet
   overal ondersteund — in sommige ingebedde browsers gooit hij een fout en
   loopt de handeling stuk — en hij ziet er anders uit dan de rest van de app.
   Levert de ingevoerde tekst op, of null als er geannuleerd wordt. */
function vraagTekst({ titel, uitleg = '', waarde = '', placeholder = '', maxLengte = 60, bevestig = 'Opslaan', leegMag = false }){
  closeModal();
  return new Promise(resolve => {
    const bd = document.createElement('div');
    bd.className = 'modal-backdrop';
    bd.id = 'modalBackdrop';
    bd.innerHTML = `<div class="modal">
        <h2>${esc(titel)}</h2>
        ${uitleg ? `<div class="sub">${esc(uitleg)}</div>` : ''}
        <input type="text" id="tekstInvoer" autocomplete="off" maxlength="${maxLengte}"
               placeholder="${esc(placeholder)}"
               style="width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);padding:12px;font-size:15px;">
        <div class="modal-actions">
          <button class="btn btn-secondary" id="tekstAnnuleer">Annuleren</button>
          <button class="btn btn-primary" id="tekstOk">${esc(bevestig)}</button>
        </div>
      </div>`;
    // Dit venster geeft een antwoord terug en regelt Escape zelf; zou
    // toonModal ook sluiten, dan blijft de belofte hangen.
    toonModal(bd, { escape: false });

    const invoer = bd.querySelector('#tekstInvoer');
    invoer.value = waarde;
    invoer.focus();
    invoer.select();

    let beantwoord = false;
    const sluit = (uitkomst) => {
      if(beantwoord) return;
      beantwoord = true;
      bd.remove();
      herstelFocusNaModal();
      resolve(uitkomst);
    };
    bd.querySelector('#tekstAnnuleer').addEventListener('click', () => sluit(null));
    // leegMag: een leeg veld is een antwoord (''), geen annuleren (null).
    const antwoord = () => leegMag ? invoer.value.trim() : (invoer.value.trim() || null);
    bd.querySelector('#tekstOk').addEventListener('click', () => sluit(antwoord()));
    invoer.addEventListener('keydown', e => {
      if(e.key === 'Enter') sluit(antwoord());
    });
    // Escape op het hele venster, niet alleen in het invoerveld: sta je met
    // Tab op de annuleerknop, dan werkte Escape daar niet.
    bd.addEventListener('keydown', e => { if(e.key === 'Escape') sluit(null); });
    // klikken naast de modal telt als annuleren
    bd.addEventListener('click', e => { if(e.target === bd) sluit(null); });
  });
}

function matchKey(schubboot, abfahrt, station){
  return (schubboot||'').trim().toLowerCase() + '|' + (abfahrt||'').trim() + '|' + (station||'').trim().toLowerCase();
}

/* De sleutel van een bestaande rit gaat over de gepláánde binnenbelader, niet
   over de huidige.

   De haven verandert die huidige namelijk: leg je een set op de 4e lengte,
   dan hoort die bij B3 en staat er B3 op de tegel, ook als de lijst B2 zei.
   Bij de volgende import werd de rit dan niet meer teruggevonden en kwam er
   een tweede tegel bij — en na een import daarna een derde. Die stapelden
   zich op onder in de lijst, en je moest ze allemaal apart wegvegen.

   `stationGepland` staat er precies voor; alleen keek deze vergelijking er
   niet naar. Oude ritten van vóór dat veld vallen terug op het station. */
function tripMatchKey(t){
  return matchKey(t.schubboot, t.abfahrt, t.stationGepland || t.station);
}

function geplandStation(t){
  return ((t.stationGepland || t.station) || '').trim().toLowerCase();
}

/* Terugvinden op baknummer, als de sleutel hierboven niets oplevert doordat er
   in de lijst een tijd of een lading veranderd is.

   Twee tegels met precies dezelfde bakken bij dezelfde binnenbelader zijn óf
   een kopie, óf een deellading: een bak die in twee keer wordt volgeladen, met
   soms een paar tegels ertussen. Die twee mogen nooit samengevoegd worden,
   want dan verdwijnt er een halve vracht uit de planning.

   Het verschil zit in het tonnage. Bij een deellading zijn de twee vrachten
   samen ongeveer één volle bak; bij een kopie staat er twee keer een hele
   vracht en kom je op het dubbele uit. Binnen één tegel controleert de app
   een deellading al precies zo — dezelfde maatstaf, dezelfde speling van
   50 ton. */
const DEELLADING_MARGE_T = 50;

// De baknummers van een tegel, op alfabet. Dummyregels tellen niet mee.
function bakHandtekening(t){
  return (t.rows || [])
    .filter(r => r.leichter && r.leichter.trim() && !isDummyName(r.leichter))
    .map(r => normalizeBargeName(r.leichter))
    .sort()
    .join('|');
}

// Per bak het tonnage op deze tegel, met de regels van dezelfde bak opgeteld.
function bakTonnages(t){
  const uit = new Map();
  (t.rows || []).forEach(r => {
    if(!r.leichter || !r.leichter.trim() || isDummyName(r.leichter)) return;
    const n = parseMenge(r.menge);
    if(n == null) return;
    const s = normalizeBargeName(r.leichter);
    uit.set(s, (uit.get(s) || 0) + n);
  });
  return uit;
}

/* Wat weegt een volle bak? De mediaan van de bakken die in de hele actieve
   planning maar één keer voorkomen — die zijn in één keer volgeladen. Bakken
   die vaker voorkomen laten we weg, want dat zijn juist de kandidaten voor een
   deellading, en die zouden het gemiddelde omlaag trekken. De mediaan in
   plaats van het gemiddelde, zodat één rare regel het getal niet verschuift. */
function volleBakTonnage(){
  const telling = new Map(), gewicht = new Map();
  trips.filter(t => t.status === 'actief').forEach(t => {
    bakTonnages(t).forEach((n, s) => {
      telling.set(s, (telling.get(s) || 0) + 1);
      gewicht.set(s, n);
    });
  });
  const vol = [...telling.entries()]
    .filter(([s, n]) => n === 1 && gewicht.get(s) > 0)
    .map(([s]) => gewicht.get(s))
    .sort((a, b) => a - b);
  return vol.length ? vol[Math.floor(vol.length / 2)] : null;
}

function lijktOpDeellading(a, b, vol){
  if(vol == null) return false;
  const ta = bakTonnages(a), tb = bakTonnages(b);
  for(const [s, na] of ta){
    const nb = tb.get(s);
    if(nb == null) continue;
    if(Math.abs(na + nb - vol) <= DEELLADING_MARGE_T) return true;
  }
  return false;
}

function findExistingTripViaBakken(parsedTrip){
  const zoek = bakHandtekening(parsedTrip);
  if(!zoek) return null;
  const station = geplandStation(parsedTrip);
  const vol = volleBakTonnage();
  return trips.find(t => t.status === 'actief'
                      && geplandStation(t) === station
                      && bakHandtekening(t) === zoek
                      && !lijktOpDeellading(t, parsedTrip, vol)) || null;
}

function findExistingTrip(parsedTrip){
  const key = matchKey(parsedTrip.schubboot, parsedTrip.abfahrt, parsedTrip.station);
  return trips.find(t => tripMatchKey(t) === key)
      || findExistingTripViaBakken(parsedTrip)
      || null;
}

// Ruimt dubbele actieve ritten op (zelfde schip + vertrektijd + B-machine —
// hetzelfde sleepstel kan bij meerdere binnenbeladers tegelijk lading
// afleveren, dat zijn dan bewust aparte tegels, geen duplicaten). De oudste
// (eerst geïmporteerde) blijft staan; eigen notities en de aanmeerstatus van
// de duplicaten worden overgenomen voordat ze verwijderd worden, zodat er
// geen eigen invoer verloren gaat. Geeft het aantal verwijderde duplicaten terug.
function dedupeActiveTrips(){
  const active = trips.filter(t => t.status === 'actief');
  const seen = new Map(); // key -> canonieke trip
  const toRemove = new Set();
  active.forEach(t => {
    const key = tripMatchKey(t);
    const existing = seen.get(key);
    if(!existing){
      seen.set(key, t);
      return;
    }
    // dupliceert existing — samenvoegen en markeren voor verwijdering
    if(t.note && t.note.trim() && existing.note !== t.note){
      existing.note = existing.note ? (existing.note + ' / ' + t.note) : t.note;
    }
    if(t.aangemeerd) existing.aangemeerd = true;
    toRemove.add(t.id);
  });
  /* Tweede ronde, op baknummer. Verandert er in de lijst een tijd of een
     lading, dan is de sleutel hierboven niet meer gelijk en staan er twee
     tegels met precies dezelfde bakken. Die horen er niet allebei te zijn —
     tenzij het een deellading is, en dat blijkt uit het tonnage. */
  const vol = volleBakTonnage();
  const handtekeningen = new Map();     // "station|handtekening" -> tegels
  trips.filter(t => t.status === 'actief' && !toRemove.has(t.id)).forEach(t => {
    const hand = bakHandtekening(t);
    if(!hand) return;
    const k = geplandStation(t) + '|' + hand;
    const eerder = handtekeningen.get(k) || [];
    const kopieVan = eerder.find(x => !lijktOpDeellading(x, t, vol));
    if(!kopieVan){
      eerder.push(t);
      handtekeningen.set(k, eerder);
      return;
    }
    if(t.note && t.note.trim() && kopieVan.note !== t.note){
      kopieVan.note = kopieVan.note ? (kopieVan.note + ' / ' + t.note) : t.note;
    }
    if(t.aangemeerd) kopieVan.aangemeerd = true;
    toRemove.add(t.id);
  });

  if(toRemove.size){
    trips = trips.filter(t => !toRemove.has(t.id));
  }
  return toRemove.size;
}

function applyCategorizedImport(categorized){
  categorized.forEach(c => {
    if(!c.include) return;
    const t = c.parsed;
    if(c.kind === 'nieuw'){
      delete t.include;
      trips.push(t);
    } else if(c.kind === 'bijgewerkt' || c.kind === 'heropend'){
      const ex = c.existing;
      const stationWasOverridden = ex.station !== ex.stationGepland;
      const liegeplaatsWasOverridden = ex.liegeplaats !== ex.liegeplaatsGepland;
      ex.stationGepland = t.station;
      ex.liegeplaatsGepland = t.liegeplaats;
      if(!stationWasOverridden) ex.station = t.station;
      if(!liegeplaatsWasOverridden) ex.liegeplaats = t.liegeplaats;
      ex.abfahrt = t.abfahrt;
      ex.planbegin = t.planbegin;
      ex.planeinde = t.planeinde;
      ex.rows = t.rows;
      ex.schubbootContact = t.schubbootContact || ex.schubbootContact;
      applyDummyResolutions(ex);
      applyBakKenmerken(ex);        // bakstatus en groepskoppeling terugzetten
      if(c.kind === 'heropend'){
        // stond in Historie, maar staat nog gewoon op de EECV-lijst — dus
        // per definitie nog niet klaar. Terug naar Actief; alleen een
        // expliciete swipe mag een tegel nog naar Historie zetten.
        ex.status = 'actief';
        ex.completedAt = null;
      }
      // note, id blijven ongewijzigd
    }
  });
  dedupeActiveTrips();
}

function categorizeImport(parsedTrips){
  return parsedTrips.map(t => {
    const existing = findExistingTrip(t);
    if(!existing){
      return { kind: 'nieuw', parsed: t, existing: null, include: true };
    }
    if(existing.status === 'historie'){
      return { kind: 'heropend', parsed: t, existing, include: true };
    }
    return { kind: 'bijgewerkt', parsed: t, existing, include: true };
  });
}

// Veiligheidsnet: elke rit die uit de PDF geparsed werd, moet na het
// importeren als actieve tegel terug te vinden zijn. Zo niet, dan is er
// ergens iets misgegaan (bijv. een onverwachte sleutel-botsing) en moet de
// gebruiker daarvoor gewaarschuwd worden — een tegel mag nooit stilzwijgend
// verdwijnen.
function verifyImportCompleteness(categorized){
  return categorized
    .filter(c => {
      const key = matchKey(c.parsed.schubboot, c.parsed.abfahrt, c.parsed.station);
      return !trips.some(t => t.status === 'actief' && tripMatchKey(t) === key);
    })
    .map(c => c.parsed);
}


// Escapet ook aanhalingstekens: veel van deze waarden komen uit
// geïmporteerde Excel/PDF-bestanden van derden en belanden in HTML-attributen.
// Zonder " en ' kan een baknaam daar uit het attribuut breken.
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Kleuren uit een Excel-cel zijn niet te vertrouwen: ze komen uit het bestand.
// Alleen een echte hexcode mag in een style-attribuut terechtkomen.
function safeColor(value, fallback){
  const fb = fallback || '#8D98A5';
  if(!value) return fb;
  const hex = String(value).trim().replace(/^#/, '');
  return /^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(hex) ? '#' + hex : fb;
}

<script>
/* Auteur: HvdB */
/* ---------------------------------------------------------------
   RENDER
--------------------------------------------------------------- */
/* Navigatie: één plek waar het scherm van onderdeel wisselt.
   Eerder zette de tab-klik, de Snel-naar-tegels en Zoeken elk zelf currentTab en
   de actieve knop; Zoeken naar Historie of Verschillen deed zelfs niets, want die
   hebben geen knop om door te klikken. Nu loopt alles via gaNaar().

   - navStack onthoudt waar je vandaan kwam (onderdeel + scrollstand), zodat de
     Terug-knop in de topbalk je daar weer neerzet.
   - Dezelfde stappen staan in de browsergeschiedenis, zodat het terug-gebaar van
     de tablet één stap terug doet in plaats van de app te verlaten.
   - tabGeheugen onthoudt per onderdeel hoe ver je gescrold was; render() bouwt
     het scherm helemaal opnieuw op en je stond anders weer bovenaan.
   Het stationsfilter (stationKeuze) is al globaal en blijft dus vanzelf staan. */
const navStack = [];
const tabGeheugen = new Map();
const NAV_MAX = 20;
const TAB_NAMEN = { dashboard:'Overzicht', advies:'Taken', planlijst:'Planlijst', haven:'Haven',
  gebruikers:'Gebruikers', historie:'Historie', verschillen:'Verschillen' };
let navHistorieOk = true;

function navStand(){ return { tab: currentTab, y: window.scrollY }; }

function navZetActief(){
  document.querySelectorAll('[data-tab]').forEach(t => {
    const actief = t.dataset.tab === currentTab;
    t.classList.toggle('active', actief);
    /* Welk onderdeel je bekijkt moet ook in de code staan, niet alleen in de
       kleur. Niet-huidige knoppen krijgen het attribuut helemaal niet, want
       aria-current="false" is ruis in de voorleesvolgorde. */
    if(actief) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
}

function navToonTerug(){
  const knop = document.getElementById('terugKnop');
  if(!knop) return;
  const vorige = navStack[navStack.length - 1];
  knop.hidden = !vorige;
  if(!vorige) return;
  const naam = TAB_NAMEN[vorige.tab] || vorige.tab;
  knop.querySelector('.terug-naam').textContent = naam;
  knop.setAttribute('aria-label', 'Terug naar ' + naam);
}

/* tab: het onderdeel. stand: alleen bij Terug, dan staat de bestemming al op
   de stack en komt er niets bij. */
function gaNaar(tab, stand = null){
  if(tab === currentTab){ render(); return; }
  tabGeheugen.set(currentTab, navStand());
  if(!stand){
    navStack.push(navStand());
    if(navStack.length > NAV_MAX) navStack.shift();
    try{ history.pushState({ nav: navStack.length }, ''); }catch(_){ navHistorieOk = false; }
  }
  currentTab = tab;
  navZetActief();
  zetMeerMenu(false);
  navToonTerug();
  render();
  const y = (stand || tabGeheugen.get(tab) || { y: 0 }).y;
  window.scrollTo(0, y);
  requestAnimationFrame(() => window.scrollTo(0, y));   // de haven plaatst zijn tegels pas daarna
}

function navNaarVorige(){
  const stand = navStack.pop();
  if(stand) gaNaar(stand.tab, stand);
}

function navTerug(){
  if(!navStack.length) return;
  // Via de browsergeschiedenis, zodat die in de pas blijft; popstate doet de rest.
  if(navHistorieOk && history.state && history.state.nav === navStack.length) history.back();
  else navNaarVorige();
}

window.addEventListener('popstate', (e) => {
  const n = e.state && e.state.nav ? e.state.nav : 0;
  while(navStack.length > n) navNaarVorige();
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-tab]');
  if(el) gaNaar(el.dataset.tab);
  else if(e.target.closest('#terugKnop')) navTerug();
});

/* render() bouwt het hele scherm opnieuw op. Alles wat daar stond is daarna
   weg, inclusief het element waar je focus op stond — en de focus valt dan
   terug op de pagina zelf. Met een muis merk je dat niet; met een toetsenbord
   begin je na elke wijziging weer bovenaan.

   We onthouden daarom niet het élement (dat bestaat straks niet meer) maar
   waaraan het te herkennen is: bij welke rit het hoorde, wat voor element het
   was, en welk kenmerk het onderscheidt van zijn buren. Na de herbouw zoeken
   we dat opnieuw op. Stond de cursor in een tekstveld, dan gaat ook de
   cursorpositie mee — anders spring je naar het begin van je notitie. */
function onthoudFocus(){
  const el = document.activeElement;
  const main = document.getElementById('main');
  if(!el || !main || !main.contains(el)) return null;

  const kaart = el.closest('[data-id]');
  const d = el.dataset || {};
  const kenmerk = d.dir ? `[data-dir="${CSS.escape(d.dir)}"]`
    : d.rowIndices ? `[data-row-indices="${CSS.escape(d.rowIndices)}"]`
    : d.rowIdx ? `[data-row-idx="${CSS.escape(d.rowIdx)}"]`
    : d.accent ? `[data-accent="${CSS.escape(d.accent)}"]`
    : d.station ? `[data-station="${CSS.escape(d.station)}"]`
    // HAVEN-KOPPELING: bak, zone en de Onderweg/paneel-kaarten hertekent
    // renderHavenTab elke keer helemaal, dus zonder deze vier springt de
    // focus na een toetsenbordactie in de haven terug naar de pagina. Een
    // zone bestaat na elke hertekening onder dezelfde id, dus dat is de
    // belangrijkste: daarop land je na het neerzetten van een gekozen set.
    : d.bak ? `[data-bak="${CSS.escape(d.bak)}"]`
    : d.zone ? `[data-zone="${CSS.escape(d.zone)}"]`
    : d.wachtset ? `[data-wachtset="${CSS.escape(d.wachtset)}"]`
    : d.losbak ? `[data-losbak="${CSS.escape(d.losbak)}"]`
    : '';
  let selStart = null, selEnd = null;
  try { selStart = el.selectionStart; selEnd = el.selectionEnd; } catch(_){}

  return { tripId: kaart ? kaart.dataset.id : null, tag: el.tagName.toLowerCase(),
           klasse: [...el.classList][0] || '', kenmerk, selStart, selEnd };
}

function herstelFocus(f){
  if(!f) return;
  let wortel = document.getElementById('main');
  if(f.tripId){
    const kaart = document.querySelector(`[data-id="${CSS.escape(f.tripId)}"]`);
    if(!kaart) return;                    // die rit is er niet meer
    wortel = kaart;
  }
  if(!wortel) return;
  const sel = f.klasse ? `${f.tag}.${CSS.escape(f.klasse)}${f.kenmerk}` : `${f.tag}${f.kenmerk}`;
  let el = null;
  try { el = wortel.querySelector(sel); } catch(_){}
  if(!el) return;
  try {
    el.focus({ preventScroll: true });
    if(f.selStart != null && el.setSelectionRange) el.setSelectionRange(f.selStart, f.selEnd);
  } catch(_){}
}

function render(){
  const focusWas = onthoudFocus();
  rebuildVhGroupColors();
  rebuildBargeLocationMap();
  rebuildStationColors();
  tekenMeldingen();   // o.a. verbergen op de Haven (currentTab is hier al gezet)
  const active = trips.filter(t => t.status === 'actief');
  const history = trips.filter(t => t.status === 'historie').sort((a,b) => (b.completedAt||0) - (a.completedAt||0));

  document.getElementById('countPlanlijst').textContent = active.length ? `(${active.length})` : '';

  const main = document.getElementById('main');
  main.innerHTML = '';
  document.getElementById('app').classList.add('haven-breed');

  const filterBar = document.getElementById('stationFilter');
  if(currentTab === 'planlijst' && active.length){
    filterBar.style.display = 'flex';
    const stationCounts = {};
    active.forEach(t => { const s = t.station || 'Overig'; stationCounts[s] = (stationCounts[s]||0)+1; });
    const knownStations = Object.keys(stationCounts).sort();
    // Een station dat na een import niet meer voorkomt mag niet blijven hangen
    // in de keuze — anders houd je een lege kolom over.
    [...stationKeuze].forEach(s => { if(!knownStations.includes(s)) stationKeuze.delete(s); });
    const alles = stationKeuze.size === 0;
    // Knoppen in plaats van div's: met Tab bereikbaar, met Enter te bedienen,
    // en aria-pressed zegt welke aanstaan — niet alleen de kleur.
    let chips = `<button type="button" class="chip ${alles?'active':''}" data-station="alle" aria-pressed="${alles}">Alle <span class="n">${active.length}</span></button>`;
    chips += knownStations.map(s =>
      `<button type="button" class="chip ${stationKeuze.has(s)?'active':''}" data-station="${esc(s)}" aria-pressed="${stationKeuze.has(s)}">${esc(s)} <span class="n">${stationCounts[s]}</span></button>`
    ).join('');
    // Origineel checken: uit het ⋯-menu gehaald en hier rechts uitgelijnd in de
    // filterrij gezet (margin-left:auto op de knop).
    chips += `<button type="button" class="chip origineel-chip" id="origineelChip" title="Origineel checken">Origineel checken</button>`;
    filterBar.innerHTML = chips;
    filterBar.querySelectorAll('.chip[data-station]').forEach(c => {
      c.addEventListener('click', () => {
        /* Aan- en uitzetten in plaats van één keuze tegelijk. Zet je de

        const s = c.dataset.station;

    });
    filterBar.querySelector('#origineelChip').addEventListener('click', () => openCheckOriginalPicker());
  } else {
    filterBar.style.display = 'none';
    filterBar.innerHTML = '';
  }

  if(currentTab === 'dashboard'){
    renderDashboardTab(main, active, history);
  } else if(currentTab === 'planlijst'){
    if(!active.length){
      main.innerHTML = `<div class="empty-state">
        <h2>Nog geen planning</h2>
        <p>Importeer een planlijst-PDF om te beginnen. Reizen verschijnen hier per binnenbelader, op planvolgorde.</p>
      </div>`;
      return;
    }
    const visible = stationKeuze.size
      ? active.filter(t => stationKeuze.has(t.station || 'Overig'))
      : active;
    if(!visible.length){
      main.innerHTML = `<div class="empty-state">
        <h2>Geen reizen voor ${esc([...stationKeuze].join(', '))}</h2>
        <p>Er staan momenteel geen actieve reizen bij deze binnenbelader.</p>
      </div>`;
      return;
    }
    const byStation = {};
    visible.sort((a,b) => (a.order ?? a.planbegin ?? 0) - (b.order ?? b.planbegin ?? 0));
    visible.forEach(t => { (byStation[t.station||'Overig'] ||= []).push(t); });

    /* Vóór de tegels: één tijdschaal voor het hele scherm en de dubbele
       boekingen. renderCard() leest allebei, dus dit moet hier gebeuren en
       niet per tegel — anders krijgt elke tegel zijn eigen schaal en zegt de
       breedte van een laadblok niets meer. Op de zichtbare ritten, zodat het
       venster niet verspringt bij het filteren op binnenbelader. */
    bepaalPlanlijstVenster(visible);
    bepaalPlanlijstBotsingen(visible);

    let stationKeys = Object.keys(byStation).sort();

    /* Eén kolom per station, zodat B2, B3 en B4 naast elkaar staan. Hoeveel

       Tijdens "Origineel checken" gaat het altijd naar één kolom: dan staat

    if(!origineelCheck && stationKeys.length > 1) {
      const wrapper = document.createElement('div');
      wrapper.className = 'station-kolommen' + (stationKeuze.size ? ' gekozen' : '');
      wrapper.style.setProperty('--kolommen', stationKeys.length);

      stationKeys.forEach(st => {
        const kolom = document.createElement('div');
        kolom.className = 'station-kolom';
        const h = document.createElement('div');
        h.className = 'station-heading';
        h.innerHTML = `<h2>Reizen ${esc(st)}${dubbelTag(byStation[st])}</h2><div class="line"></div>`;
        kolom.appendChild(h);
        kolom.insertAdjacentHTML("beforeend", bezettingsStrookHtml(byStation[st]));
        byStation[st].forEach((t, idx) => kolom.appendChild(renderCard(t, byStation[st], idx)));
        wrapper.appendChild(kolom);
      });

      main.appendChild(wrapper);
    } else {
      // Normale 1-koloms layout
      stationKeys.forEach(st => {
        const h = document.createElement('div');
        h.className = 'station-heading';
        h.innerHTML = `<h2>Reizen ${esc(st)}${dubbelTag(byStation[st])}</h2><div class="line"></div>`;
        main.appendChild(h);
        main.insertAdjacentHTML("beforeend", bezettingsStrookHtml(byStation[st]));
        byStation[st].forEach((t, idx) => main.appendChild(renderCard(t, byStation[st], idx)));
      });
    }
  } else if(currentTab === 'historie'){
    // Gecentreerde middenkolom, net als Advies: alles hieronder in deze wrapper.
    const H = document.createElement('div');
    H.className = 'mid-kolom';
    main.appendChild(H);
    /* Op verzoek: het actielog (tot nu toe alleen zichtbaar als teller in
       Import-archief, en als losse "Ongedaan maken"-knop) hoort thuis in
       Historie, niet als kaal getal ernaast — dan kan Herman zijn eigen
       acties ook echt teruglezen. Hergebruikt de opmaak van de "Recente
       activiteit"-kaart op Overzicht (.dash-act-*): dezelfde rijstijl, hier
       gewoon de volledige lijst in plaats van de laatste 12. */

    /* De opslagmeting + "Opruimen" woonden in het Import-archief, dat op
       verzoek is weggehaald (dezelfde info staat nu in dit activiteitenlog
       hieronder). Deze twee horen er verder niets mee te maken — puur
       opslagbeheer — maar hadden nog wel een plek nodig; Historie is de
       nieuwe, voor de hand liggende plek. */
    const opslagWrap = document.createElement('div');
    opslagWrap.className = 'opslag-regel';
    opslagWrap.style.marginBottom = '14px';
    opslagWrap.innerHTML = `
      <span id="opslagMaat">opslag wordt gemeten…</span>
      <button type="button" class="opslag-knop" id="opruimenKnop"
              title="Ruimt oude actiegeschiedenis en de bewaarde originelen voor 'Origineel checken' op — de planning zelf blijft staan.">Opruimen</button>
    `;
    H.appendChild(opslagWrap);
    toonOpslagMaat();
    opslagWrap.querySelector('#opruimenKnop').addEventListener('click', ruimOpslagOp);

    const actieWrap = document.createElement('div');
    actieWrap.className = 'hist-actielog';
    const acties = actionLog.slice().reverse();
    actieWrap.innerHTML = `
      <h2 style="margin:0 0 2px;">Activiteitenlog</h2>
      <div class="sub" style="margin-bottom:10px;">${acties.length} actie${acties.length===1?'':'s'} in deze planning, nieuwste eerst.</div>
      ${acties.length ? acties.map(a => `
        <div class="dash-act-row">
          <div class="dash-act-dot"></div>
          <div class="dash-act-body">
            <div class="txt">${esc(a.description)}</div>
            <div class="when">${fmtDateTimeExact(a.at)} · ${geledenTekst(a.at)}</div>
          </div>
        </div>`).join('') : `<div class="dash-empty">Nog geen acties gelogd.</div>`}
    `;
    H.appendChild(actieWrap);

    const afgerondKop = document.createElement('h2');
    afgerondKop.style.cssText = 'margin:22px 0 2px;';
    afgerondKop.textContent = 'Afgeronde reizen';
    H.appendChild(afgerondKop);

    const searchWrap = document.createElement('div');
    searchWrap.className = 'search-row';
    searchWrap.innerHTML = `<label class="alleen-voorlezer" for="histSearch">Zoeken in de historie</label>
      <input type="text" id="histSearch" placeholder="Zoek op schip, materiaal, klant…">`;
    H.appendChild(searchWrap);

    const listDiv = document.createElement('div');
    H.appendChild(listDiv);

    function renderList(filter){
      const f = (filter||'').toLowerCase();
      listDiv.innerHTML = '';
      const filtered = history.filter(t => {
        if(!f) return true;
        const hay = [t.schubboot, t.station, t.note, ...t.rows.map(r=>r.materiaal+' '+r.kunde+' '+r.leichter)].join(' ').toLowerCase();

      });

        wrap.innerHTML = `<div class="hist-bg-restore">↺ Terugzetten</div>`;
        div.innerHTML = `<div class="hist-top"><b>${esc(t.schubboot)}</b><span>${esc(t.station)}${t.stationGepland && t.stationGepland!==t.station ? ` <span style="color:var(--danger)">(gepland ${esc(t.stationGepland)})</span>`:''}</span></div>
          <div class="hist-meta">Afgerond ${fmtDateTime(t.completedAt)} · gepland ${fmtDateTime(t.planbegin)}–${fmtDateTime(t.planeinde)}</div>
          <div class="hist-meta" style="margin-top:2px;">${esc(t.liegeplaats)}${t.liegeplaatsGepland && t.liegeplaatsGepland!==t.liegeplaats ? ` (gepland ${esc(t.liegeplaatsGepland)})`:''}</div>
          <div class="hist-meta" style="margin-top:4px;">${materialen}</div>
