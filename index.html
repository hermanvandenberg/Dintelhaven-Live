            havenToonTegelZoom(kaart, false);
            havenToonAlleGloei(havenGezoomdeTegelNamen);
          }
        } else {
          havenKiesSet(setKey);
        }
        return;
      }
      svg.querySelectorAll('.haven-zone-vlak').forEach(r => r.classList.remove('doelwit'));
      document.querySelectorAll('.haven-plaatstab').forEach(k => k.classList.remove('doelwit'));
      havenWisGhost(svg);
      if(!bewogen) return;

      kaart.style.outline = '';

      paneel.querySelectorAll('.plaats-set.doelwit').forEach(t => t.classList.remove('doelwit'));

      /* Op het vertrekvak losgelaten: de haven uit. Een hele tegel, óf — als je
         één bakje beetpakte — alleen die bak. Dit staat vóór het "los bakje op
         een andere tegel"-blok hieronder: pak je een bakje en laat je het op
         het vertrekvak vallen, dan vertrekt die bak en wordt hij niet bij een
         tegel onder de aanwijzer gevoegd. Voorheen kon alleen een hele tegel
         vertrekken, en omdat vrijwel de hele tegel uit bakjes bestaat pakte je
         er bijna altijd eentje los — en dan gebeurde er niets. */
      const vertrekvak = paneel.querySelector('#havenVertrekvak');
      if(!verlaten && havenBinnenElement(paneel, ev)
         && vertrekvak && havenBinnenElement(vertrekvak, ev)){
        if(losBakje) await havenLaatBakkenVertrekken(namen);
        else await havenLaatSetVertrekken(setKey);
        havenHertekenPlaatsContainer(paneel, zoneId);
        render();
        return;
      }

      /* Een los bakje op een ándere tegel laten vallen: dan hoort hij daar
         voortaan bij. De aankomstlijst blijft zeggen dat hij bij zijn eigen
         stel hoort, dus dit wordt als jouw eigen keuze onthouden
         (havenTegelOverrides) — anders haalt de eerstvolgende hertekening of
         import hem er weer uit. */
      if(losBakje && !verlaten && havenBinnenElement(paneel, ev)){
        const doelTegel = havenTegelOnderAanwijzer(paneel, ev);
        // Binnen dezelfde tegel op een andere cel: de bak wisselt daar van plek
        // (bak↔bak of bak↔ghost). Alleen op de volle plaats.
        if(doelTegel === kaart && zoneId === 'vol'){
          if(await havenWisselBakBinnenTegel(losBakje, ev, kaart, paneel, zoneId)) return;
        }
        if(doelTegel && doelTegel !== kaart){
          const doelSleutel = doelTegel.dataset.plaatsset;
          const naam = losBakje.dataset.losbak;
          const baksleutel = losBakje.dataset.baksleutel || normalizeBargeName(naam);
          /* Op de volle plaats een bak naar een ándere set slepen: dan is de
             vraag of de bergvaart is veranderd. Ja → hij hoort nu bij die set en
             krijgt die kleur. Nee → hij blijft waar hij lag (terugtekenen). */
          if(zoneId === 'vol'){
            const ja = await vraagBevestiging({
              titel: 'Is de bergvaart veranderd?',
              tekst: `${naam} gaat naar een andere set. Ja: hij komt bij die set en krijgt die bergvaart-kleur. Nee: hij blijft waar hij lag.`,
              bevestig: 'Ja', annuleer: 'Nee'
            });
            if(!ja){ havenHertekenPlaatsContainer(paneel, zoneId); return; }
            const doelBak = havenBakkenMetPlek()
              .find(b => b.tegelSleutel === doelSleutel && b.zone === zoneId && b.plek && b.kleur);
            if(doelBak){
              havenKleurOverrides[baksleutel] = doelBak.kleur;
              await saveHavenKleurOverrides();
            }
          }
          await havenVoegBakBijTegel(naam, doelSleutel, zoneId);
          return;
        }
      }

      // Binnen het paneel losgelaten: de set gaat naar een andere rij
      // (havenSchuifSetNaarRij).
      if(!verlaten && havenBinnenElement(paneel, ev) && zoneId && !losBakje){
        const plaats = zoneId;

        /* Naar welke rij? Naar waar de tegel nu, na het live volgen tijdens
           het slepen, visueel staat (kaart.style.top) — teruggezocht via
           havenRijVoorTop (havenPlaatsRijTops, door havenZetPlaatsPaneel
           bijgehouden). Rijen liggen sinds de tegels hun eigen hoogte bepalen
           niet meer op gelijke afstand, dus een vaste deling kan hier niet
           meer. Past het niet (een buur die niet opzij kan, of meer dan één
           buur geraakt), dan verandert er niets en zegt een toast waarom;
           havenHertekenPlaatsContainer tekent hoe dan ook de werkelijke stand
           weer uit. */
        kaart.classList.remove('wordt-verschoven');
        const doelRij = havenRijVoorTop(parseFloat(kaart.style.top) || 0);
        const gelukt = await havenSchuifSetNaarRij(plaats, setKey, doelRij);
        if(!gelukt) showToast(`Daar past deze tegel niet — hij blijft liggen waar hij lag.`);
        havenHertekenPlaatsContainer(paneel, plaats);
        render();
        return;
      }

      // Naar de andere bakkenplaats: van vol naar leeg of andersom.
      const tab = havenTabOnderAanwijzer(ev);
      if(tab){
        if(tab !== zoneId) await havenVerplaatsBakken(namen, tab, undefined, true);
        havenZetPlaatsPaneel(tab);
        render();
        return;
      }

      /* Het vaste volle-plaats-vlak ligt als overlay óver de haven — o.a. over
         de palen. Laat je een set lós boven dat vlak, dan zou havenZoneOnderSvg
         hieronder de zone eronder vinden en de set daarheen verplaatsen: hij zou
         dan achter het vlak verdwijnen. Een drop binnen het vlak blijft dus
         gewoon in Vol (de set terug op zijn rij tekenen). */
      if(paneel.id === 'havenVolVlak' && havenBinnenElement(paneel, ev)){
        kaart.classList.remove('wordt-verschoven');
        havenHertekenPlaatsContainer(paneel, zoneId);
        render();
        return;
      }

      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const zone = havenZoneOnderSvg(p.x, p.y);
      if(zone){
        const slot = havenSlotOnderSvg(zone, p.x, p.y);
        if(await havenVerplaatsBakken(namen, zone.id, slot, true)) havenZetPlaatsPaneel(null);
      }
      render();
    };

    document.addEventListener('pointermove', beweeg);
    document.addEventListener('pointerup', los);
    document.addEventListener('pointercancel', los);
  });
}

/* De bakjes van een set, gerangschikt naar hun positiecode: dwarsscheeps
 * (bakboord/midden/stuurboord, tot 3 waarden) en langsscheeps (voor/achter,
 * tot 2 waarden) bepalen samen de plek in het raster, maar welke van de twee
 * de rij is en welke de kolom hangt af van de plaats (vol):
 *
 * - Volle plaats ("lange formatie"/bergvaart, geladen en klaar voor
 *   vertrek): dwars bepaalt de kolom, langs de rij — tot 3 breed x 2 lang,
 *   in de vaarrichting uitgerekt.
 * - Lege plaats en Onderweg ("brede formatie"/daalvaart): dwars bepaalt de
 *   rij, langs de kolom — tot 3 rijen hoog x 2 breed, stuurboord/midden/
 *   bakboord dus elk hun eigen rij, voor/achter ernaast.
 *
 * Ontbreekt een positie, dan gewoon op volgorde.
 *
 * Deze twee stonden verwisseld tot v1.174: de lege plaats/Onderweg hadden
 * toen zelf "dwars bepaalt de kolom" (zoals hierboven nu bij vol staat).
 * Herman controleerde dat na met een setje van vier (SV/SA/BV/BA) en zag dat
 * stuurboord-achter en bakboord-voor daardoor verwisseld op de tegel stonden
 * — pas na een tussenstap waarin per ongeluk bij állebei de plaatsen "dwars
 * bepaalt de rij" kwam te staan (getest en afgekeurd op de volle plaats,
 * die juist "3 breed" nodig heeft) bleek dat de twee plaatsen gewoon
 * omgewisseld moesten worden, niet gelijkgetrokken.
 *
 * De breedte (kolommen) ligt voor de hele tegel vast — niet per rij apart
 * bepaald — zodat twee tegels met dezelfde vorm (bijv. allebei "2 breed")
 * ook pixelgelijk zijn, ongeacht hoeveel bakken ze werkelijk hebben. Eerder
 * werd een onvolledige rij aan het eind ingekort, en oogde een tegel met
 * minder bakken dan zijn eigen rijen aankunnen daardoor smaller. */
function havenBakBlokjes(bakken, valKleur, losSleepbaar, ontbreekt, vol){
  ontbreekt = ontbreekt || [];
  const kolomVeld = vol ? 'dwars' : 'langs';
  const rijVeld = vol ? 'langs' : 'dwars';
  const kolomWaarden = [...new Set(bakken.map(b => ontleedPositie(b.positie)?.[kolomVeld])
                                  .filter(v => v != null))].sort((a,b) => a-b);
  const rijWaarden = [...new Set(bakken.map(b => ontleedPositie(b.positie)?.[rijVeld])
                                  .filter(v => v != null))].sort((a,b) => a-b);
  // Ontbrekende bakken krijgen een eigen plek in het raster, zodat je ziet
  // hoeveel er nog bij moeten en in welke vorm.
  const totaal = bakken.length + ontbreekt.length;
  /* Op de volle plaats leest een tegel van links naar rechts als paren: de
     vertrekboot, en dan setjes van twee. Een set van zes is dus drie paren
     naast elkaar, niet een sliert.

     De positiecodes mogen breder maken (drie dwarsscheepse waarden = drie
     kolommen), maar niet smaller: twee bakken die allebei stuurboord liggen
     gaven één kolom, en dan werd een set van vier een toren van vier hoog.
     Dat is wat er op het scherm een rommeltje van maakte. */
  const breedte = vol
    ? Math.max(kolomWaarden.length, Math.ceil(totaal / 2), 1)
    : (kolomWaarden.length || Math.min(2, Math.max(1, bakken.length)));
  const rijen = Math.max(rijWaarden.length, Math.ceil(totaal / breedte),
                         vol && totaal >= 2 ? 2 : 1);
  const raster = Array.from({ length: rijen }, () => Array(breedte).fill(null));

  /* Er mag nooit een bak wegvallen.

     De plek in het raster komt uit de positiecode (bakboord/stuurboord ×
     voor/achter), en dat zijn maar vier mogelijkheden. Een set van vijf of zes
     heeft er dus meer dan er codes zijn, en dan kwamen twee bakken op dezelfde
     plek terecht — de tweede overschreef de eerste en verdween stilletjes uit
     de tegel. Is de eigen plek bezet, dan schuift hij nu door naar de eerste
     vrije, desnoods op een nieuwe rij. De tegel wordt dan vanzelf hoger. */
  const eersteVrije = () => {
    for(let r = 0; r < raster.length; r++)
      for(let k = 0; k < breedte; k++)
        if(!raster[r][k]) return { r, k };
    raster.push(Array(breedte).fill(null));
    return { r: raster.length - 1, k: 0 };
  };

  /* Handmatige cel-override eerst (alleen op de volle plaats, waar je bakjes
     kunt verslepen): die bakken gaan op hun gekozen cel, de rest schikt zich
     eromheen. Past de cel niet (bezet of buiten het raster), dan valt de bak
     gewoon terug op de normale plaatsing hieronder. */
  const handmatigGeplaatst = new Set();
  if(losSleepbaar){
    bakken.forEach(b => {
      const ov = havenBakPlekOverrides[b.sleutel || normalizeBargeName(b.naam)];
      if(!Number.isInteger(ov)) return;
      const r = Math.floor(ov / breedte), k = ov % breedte;
      if(r >= 0 && r < raster.length && k >= 0 && k < breedte && !raster[r][k]){
        raster[r][k] = b;
        handmatigGeplaatst.add(b);
      }
    });
  }

  bakken.forEach((b, i) => {
    if(handmatigGeplaatst.has(b)) return;   // al op zijn gekozen cel gezet
    const p = ontleedPositie(b.positie);
    /* Zonder positiecode: op de volle plaats kolom voor kolom (paren onder
       elkaar — B1/B2, C1/C2, zoals ze in het echt liggen), op de lege plaats
       rij voor rij in leesvolgorde. Tot 1.211 las de volle plaats óók over de
       rijen, en dan lagen de paren dwars op de werkelijkheid. */
    const valR = vol ? (i % rijen) : Math.floor(i / breedte);
    const valK = vol ? Math.floor(i / rijen) : (i % breedte);
    let r = p && rijWaarden.length ? Math.max(0, rijWaarden.indexOf(p[rijVeld])) : valR;
    let k = p && kolomWaarden.length ? Math.min(breedte - 1, Math.max(0, kolomWaarden.indexOf(p[kolomVeld]))) : valK;
    if(!raster[r] || raster[r][k]) ({ r, k } = eersteVrije());
    raster[r][k] = b;
  });
  /* De open plekken vullen we van achteren naar voren op, want wat mist is
     wat er nog bij moet — dat sluit achteraan aan. De naam van de bak die
     daar hoort te komen zetten we er meteen bij: een leeg streepjesvakje
     vertelt je wel dát er iets mist, maar niet wát, en daar heb je op de kade
     niets aan. Toewijzen gebeurt in leesvolgorde, zodat de namen in dezelfde
     volgorde staan als in de lijst eronder. */
  let nogTeVullen = ontbreekt.length;
  const ghostPlek = new Map();
  const achterstevoren = [];
  for(let r = raster.length - 1; r >= 0 && nogTeVullen > 0; r--){
    for(let k = breedte - 1; k >= 0 && nogTeVullen > 0; k--){
      if(raster[r][k]) continue;
      achterstevoren.push([r, k]);
      nogTeVullen--;
    }
  }
  achterstevoren.sort((a, b) => a[0] - b[0] || a[1] - b[1])
                .forEach(([r, k], i) => ghostPlek.set(r + ',' + k, ontbreekt[i]));

  // Geen inkorting meer: elke rij toont altijd de volle breedte, ook als een
  // cel leeg blijft — anders dan de vaste tegelmaat hierboven belooft.
  return raster.map((rij, r) => {
    const cellen = rij.map((b, k) => ({ b, k, cel: r * breedte + k, ghost: ghostPlek.get(r + ',' + k) }));
    return `<div class="haven-wachtrij-rij">` + cellen.map(({ b, cel, ghost }) => b
      // tabindex/role/aria-pressed alleen als het bakje echt los te kiezen is
      // (losSleepbaar) — anders is het hier puur een blokje in een Onderweg-
      // tegel, net als vóór deze wijziging. De baknaam staat al zichtbaar in
      // het bakje; dat is meteen de naam die een schermlezer voorleest.
      // data-cel is de lineaire celindex in de tegel (voor de intra-set swap).
      ? `<span class="haven-wachtrij-bak${losSleepbaar ? ' los' : ''}${
          losSleepbaar && havenGekozenBakken.has(b.sleutel || normalizeBargeName(b.naam)) ? ' gekozen' : ''}${
          b.status === 'repareren' ? ' repareren' : ''}" data-cel="${cel}"${
          losSleepbaar ? ` data-losbak="${esc(b.naam)}" data-baksleutel="${esc(b.sleutel || normalizeBargeName(b.naam))}"
             tabindex="0" role="button" aria-pressed="${havenGekozenBakken.has(b.sleutel || normalizeBargeName(b.naam))}"` : ''}` +
        `${b.status === 'repareren' ? ' title="Moet repareren"' : ''} style="border-color:${safeColor(b.kleur || valKleur)}">${
          b.status === 'repareren' ? '<span aria-hidden="true">⚙</span> ' : ''}${esc(b.naam)}</span>`
      : ghost
        ? `<span class="haven-wachtrij-bak ontbreekt" data-cel="${cel}" title="${esc(havenKomtUitleg(ghost))}">${esc(ghost.naam || '')}${
            ghost.elders ? `<small class="bak-elders">${esc(ghost.elders)}</small>` : ''}</span>`
        : `<span class="haven-wachtrij-bak leeg" data-cel="${cel}"></span>`).join('') + `</div>`;
  }).join('');
}

/* Hoeveel bakken hoort deze set volgens de VH/HGK-lijst te hebben?

   Op de volle bakkenplaats ligt een set klaar om te vertrekken. Staat er in de
   lijst dat de boot met vier bakken gaat en liggen er pas drie, dan mist er
   eentje — en dat moet je zien vóórdat de boot komt, niet erna. De ontbrekende
   plekken worden als ghost getekend. */
function havenSetVerwacht(setKey){
  let aantal = 0;
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.forEach(v => {
      if(!v.naam) return;
      if(bakGroupKey(v, bron) === setKey) aantal++;
    });
  });
  return aantal;
}

/* Een set die de haven uit is.

   De volle bakkenplaats is een wachtruimte: daar liggen geladen bakken tot hun
   boot ze komt halen. Zonder een manier om ze weg te halen loopt die plaats
   eindeloos vol, want afronden zet er juist bakken bíj. Sleep een tegel naar
   het vertrekvak onderin en de set is weg uit de haven: geen ligplaats meer,
   niet meer aangemeerd, en dus ook uit de tekening.

   De rit zelf blijft staan waar hij stond — in de historie als hij afgerond
   was, in de planlijst als dat nog niet zo is. Vertrokken gaat over waar de
   bakken liggen, niet over of het werk af is. */
async function havenLaatSetVertrekken(setKey){
  /* De sleutel komt van de tegel die je naar het vertrekvak sleept, dus het
     is de tegelsleutel (aankomstschip + tijd). Wil je maar één duwboot uit de
     tegel laten vertrekken, kies die dan eerst met zijn tabje onder de tegel.
     De rem hieronder blijft ongewijzigd: een rit gaat alleen op
     "niet aangemeerd" als er écht niets meer van in de haven ligt. */
  return havenVertrekBakken(
    havenBakkenMetPlek().filter(b => b.tegelSleutel === setKey && b.plek));
}

/* Eén of een paar losse bakken laten vertrekken, in plaats van een hele tegel.
   Pak je op de volle plaats één bakje beet en sleep je dat naar het vertrekvak,
   dan gaat alleen die bak de haven uit — je hoeft niet de hele tegel te pakken
   (en de meeste tegeloppervlakte ís bakje, dus dat is wat je vanzelf vastpakt). */
async function havenLaatBakkenVertrekken(namen){
  const sleutels = new Set(namen.map(normalizeBargeName));
  return havenVertrekBakken(
    havenBakkenMetPlek().filter(b => sleutels.has(b.sleutel) && b.plek));
}

async function havenVertrekBakken(bakken){
  if(!bakken.length) return false;

  const boot = bakken[0].vertrekboot || '?';
  await logAction(`Haven: set "${boot}" vertrokken (${bakken.map(b => b.naam).join(', ')})`);

  /* Per bak wegzetten, niet per tegel. Een tegel kan meer dan één set bevatten
     — drie erts en één kolen bijvoorbeeld — en dan zou "niet meer aangemeerd"
     ook de andere set uit de haven halen. De ligplaats krijgt daarom een eigen
     stand: vertrokken. Een bak met die stand telt niet mee in de haven, en hij
     verdwijnt zodra hij ergens anders wordt neergelegd of zijn tegel weer op
     aanwezig gaat. */
  const nu = Date.now();
  bakken.forEach(b => { havenPosities[b.sleutel] = { zone: HAVEN_VERTROKKEN, sinds: nu }; });

  // Is er van een rit niets meer over in de haven, dan klopt "aanwezig" ook
  // niet meer.
  const nogBinnen = new Set(havenBakken().map(b => b.tripId).filter(Boolean));
  new Set(bakken.map(b => b.tripId).filter(Boolean)).forEach(id => {
    if(nogBinnen.has(id)) return;
    const t = trips.find(x => x.id === id);
    if(!t) return;
    t.aangemeerd = false;
    t.klaarOmTeLaden = false;
    delete t.bakkenInHaven;
  });

  await saveHavenPosities();
  await saveTrips();
  showToast(`${boot} is vertrokken — ${bakken.length} bak${bakken.length === 1 ? '' : 'ken'} uit de haven.`);
  return true;
}

/* Eén set naar een andere rij op dezelfde bakkenplaats verslepen, zonder dat
   iets anders vanzelf meeschuift.

   "Op iedere rij een tegel kunnen neerzetten, zonder dat ze automatisch
   aansluiten" betekent: een rij die leeg is, blijft leeg tot je er zelf iets
   neerlegt, en een set die je ergens weghaalt laat geen gat achter dat de rest
   opvult. Er is dus maar één ander stuk grond waar deze aanroep tegenaan kan
   lopen: een set die al op de doelrij ligt. Dan mag precies díe ene buur één
   stap opzij, in de richting waar de gesleepte set vandaan komt, áls daar
   plek voor is — past dat niet, of raakt de buur zelf weer een derde set, dan
   gebeurt er niets en meldt de aanroeper (havenKoppelPaneelSlepen) waarom.

   Kolom en vorm blijven zoals ze waren: alleen de rij verandert, dus het
   anker is dezelfde meest-westelijke kolom die de set al had. */
async function havenSchuifSetNaarRij(zoneId, setKey, doelRij){
  const zone = havenZone(zoneId);
  if(!zone) return false;
  const alle = havenBakkenMetPlek().filter(b => b.zone === zoneId && b.plek);
  const eigen = alle.filter(b => b.tegelSleutel === setKey);
  if(!eigen.length) return false;

  const eigenMinRij = Math.min(...eigen.map(b => b.plek.rij));
  const eigenMinKol = Math.min(...eigen.map(b => b.plek.kol));
  const hoogte = Math.max(...eigen.map(b => b.plek.rij)) - eigenMinRij + 1;
  const eigenNamen = eigen.map(b => b.naam);
  if(doelRij === eigenMinRij) return true;   // niet verplaatst

  const kolommen = havenZoneKolommen(zone);
  const rijenInZone = Math.max(1, Math.floor(havenZoneSlots(zone).length / kolommen));
  const doelMin = doelRij, doelMax = doelRij + hoogte - 1;
  if(doelMin < 0 || doelMax >= rijenInZone) return false;

  // De andere sets op deze plaats, elk met hun eigen rij-bereik.
  const perAndereSet = new Map();
  alle.forEach(b => {
    if(b.tegelSleutel === setKey) return;
    if(!perAndereSet.has(b.tegelSleutel)) perAndereSet.set(b.tegelSleutel, []);
    perAndereSet.get(b.tegelSleutel).push(b);
  });
  const anderen = [...perAndereSet.entries()].map(([key, bakken]) => ({
    key, namen: bakken.map(b => b.naam),
    minRij: Math.min(...bakken.map(b => b.plek.rij)),
    maxRij: Math.max(...bakken.map(b => b.plek.rij)),
    minKol: Math.min(...bakken.map(b => b.plek.kol))
  }));
  const overlapt = (a1, a2, b1, b2) => a1 <= b2 && b1 <= a2;

  const zetOpRij = (namen, kol, rij) => {
    const slot = havenZoneSlots(zone).find(s => s.rij === rij && s.kol === kol);
    return slot ? havenVerplaatsBakken(namen, zoneId, slot.index, false, null, true) : false;
  };

  const overlappers = anderen.filter(o => overlapt(doelMin, doelMax, o.minRij, o.maxRij));
  if(!overlappers.length) return zetOpRij(eigenNamen, eigenMinKol, doelMin);
  if(overlappers.length > 1) return false;   // meer dan één buur geraakt: niet doen

  const buur = overlappers[0];
  const buurHoogte = buur.maxRij - buur.minRij + 1;
  const richting = doelMin < eigenMinRij ? 'omhoog' : 'omlaag';
  const buurNieuwMin = richting === 'omhoog' ? doelMax + 1 : doelMin - buurHoogte;
  const buurNieuwMax = buurNieuwMin + buurHoogte - 1;
  if(buurNieuwMin < 0 || buurNieuwMax >= rijenInZone) return false;
  // De buur mag zelf ook niemand anders raken op zijn nieuwe plek.
  if(anderen.some(o => o.key !== buur.key && overlapt(buurNieuwMin, buurNieuwMax, o.minRij, o.maxRij))) return false;

  const buurGelukt = await zetOpRij(buur.namen, buur.minKol, buurNieuwMin);
  if(!buurGelukt) return false;
  return zetOpRij(eigenNamen, eigenMinKol, doelMin);
}

function havenPlaatsSets(zoneId){
  const sets = new Map();
  havenBakkenMetPlek().forEach(b => {
    if(b.zone !== zoneId || !b.plek) return;
    if(!sets.has(b.tegelSleutel)) sets.set(b.tegelSleutel, { key:b.tegelSleutel, bakken:[] });
    sets.get(b.tegelSleutel).bakken.push(b);
  });
  // De volgorde volgt de ligging: bovenste rij eerst, dan van links naar rechts.
  return [...sets.values()].map(s => {
    s.bakken.sort((a, b) => a.plek.rij - b.plek.rij || a.plek.kol - b.plek.kol);
    s.vertrekboot = s.bakken[0].vertrekboot;
    /* Hier stond ook een lijst vertrekboten voor de tabjes onder een tegel in
       de kolom. Die tabjes staan sinds v1.184 in de haventekening zelf (zie
       havenTekenTegelsInTekening), en deze lijst werd nergens meer gelezen —
       met als extra risico dat hij nog het oude `vertrekboot`-veld gebruikte,
       dat terugvalt op het aankomstschip. Weggehaald. */
    s.aankomstschip = s.bakken.map(b => b.aankomstschip).find(Boolean) || null;
    // Het echte rij-/kolombereik van deze set — de tegel wordt hierop
    // gepositioneerd (zie havenPlaatsTegel/havenZetPlaatsPaneel). Een "fles"
    // (twee rijen diep) krijgt zo een tegel die twee rijen hoog is, niet één.
    s.rij = Math.min(...s.bakken.map(b => b.plek.rij));
    s.hoogte = Math.max(...s.bakken.map(b => b.plek.rij)) - s.rij + 1;
    s.kol = Math.min(...s.bakken.map(b => b.plek.kol));
    return s;
  /* Eerst de rij, dan de kolom. Twee sets kunnen náást elkaar in dezelfde rij
     liggen, en zonder die tweede vergelijking lag hun volgorde vast op de
     volgorde waarin ze toevallig uit de haven kwamen rollen. Bij het
     herschikken zag je de tegels dan in de ene volgorde staan en kwamen ze in
     een andere terug. */
  }).sort((a, b) => a.rij - b.rij || a.kol - b.kol);
}

function havenTekenPlaatsTabs(){
  const balk = document.getElementById('havenPlaatsTabs');
  if(!balk) return;
  // De volle bakkenplaats staat sinds het herontwerp als vast vlak onder de
  // tekening (havenTekenVolVlak); de aan/uit-knop die het oude paneel opende is
  // daarmee vervallen. Op telefoon is deze balk sowieso verborgen en loopt
  // 'vol' via het mobiele tabblad. De balk blijft leeg in de DOM staan.
  balk.innerHTML = '';
}

/* Eén tegel in een bakkenplaats-paneel. Lege plaats leest bakken-eerst (wát
 * ligt er), volle plaats boot-eerst in paren van twee (wíé vertrekt, is de set
 * compleet). Ontbrekende bakken krijgen een eigen vakje met wie ze brengt.
 * Elke tegel staat op zijn eigen rij (top/px, absolute binnen een relative
 * .haven-plaatsinhoud — zie havenZetPlaatsPaneel) zodat niets dichtschuift.
 * Zie docs/NOTITIES.md — havenPlaatsTegel. */
/* Welke bakken horen bij deze kleurset volgens de VH/HGK-lijst? havenSetVerwacht
   telt ze al; dit geeft ook de namen, want "er mist er één" zonder te zeggen
   welke is maar de helft van het antwoord. */
function havenSetLeden(setKey){
  const namen = [];
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    (lijst || []).forEach(v => {
      if(!v.naam) return;
      if(bakGroupKey(v, bron) === setKey) namen.push(v.naam);
    });
  });
  return namen;
}

/* Waar ligt een bak op dit moment? In zonetaal, niet in stationtaal: je wilt
   weten waar je hem moet halen. */
const HAVEN_PLEKNAAM = { 'b2b3-kade':'kade B2/B3', 'b4-kade':'kade B4',
                         'leeg':'lege plaats', 'vol':'volle plaats', 'palen':'de palen' };
function havenWaarLigt(naam){
  const sleutel = normalizeBargeName(naam);
  const inHaven = havenBakkenMetPlek().find(b => normalizeBargeName(b.naam) === sleutel);
  if(inHaven) return HAVEN_PLEKNAAM[inHaven.zone] || inHaven.zone;
  const onderweg = havenWachtrij().some(set => set.bakken.some(b => b.sleutel === sleutel));
  return onderweg ? 'onderweg' : null;
}

/* Wat mist er nog aan deze tegel, en waar ligt dat dan? Per kleurset, want
   dat is de eenheid die samen vertrekt. Eén tegel kan meerdere kleursets
   bevatten — dezelfde optelling die havenPlaatsTegel voor het aantal doet. */
function havenSetOntbreekt(bakken){
  const aanwezig = new Set(bakken.map(b => normalizeBargeName(b.naam)));
  const uit = [];
  [...new Set(bakken.map(b => b.setKey))].forEach(key => {
    havenSetLeden(key).forEach(naam => {
      if(aanwezig.has(normalizeBargeName(naam))) return;
      if(uit.some(x => normalizeBargeName(x.naam) === normalizeBargeName(naam))) return;
      uit.push({ naam, waar: havenWaarLigt(naam), ...havenKomtMet(naam) });
    });
  });
  return uit;
}

/* Ligt deze bak al ergens in de haven? Zo ja, waar — in gewoon Nederlands.
   "onderweg" telt hier niet als liggen: dan is de vraag juist wie hem brengt
   en hoe laat, en dat is precies wat er dan moet staan. */
function havenLigtOp(waar){
  if(!waar || waar === 'onderweg') return null;
  return `ligt op ${/^(de |kade )/.test(waar) ? '' : 'de '}${waar}`;
}

/* Wie brengt deze bak, en hoe laat? Staat in de VH/HGK-lijst: bij elke bak
   het aankomstschip met zijn tijd. Ligt hij al ergens in de haven, dan is dat
   het antwoord — zie havenWaarLigt. */
function havenKomtMet(naam){
  const sleutel = normalizeBargeName(naam);
  for(const lijst of [vhBakken, hgkBakken]){
    const v = (lijst || []).find(x => x.naam && normalizeBargeName(x.naam) === sleutel);
    // elders: laadt deze bak volgens de lijst ergens anders (Gent/EBS/EMO/
    // Terneuzen/Hoge Waard)? Dan hoort dat in het ghost-vakje, zodat je ziet
    // waaróm de bak hier nog niet ligt.
    if(v) return { boot: v.schip || null, tijd: v.tijd || null, elders: plekBuitenDeHaven(v) || null };
  }
  return { boot: null, tijd: null, elders: null };
}

/* Eén regel tekst over een bak die er nog niet is — ook gebruikt als titel
   op het spookvakje zelf, want daar past alleen de naam. */
function havenKomtUitleg(o){
  if(!o) return '';
  const waar = havenLigtOp(o.waar);
  if(waar) return `${o.naam} ${waar}`;
  if(o.boot) return `${o.naam} komt met ${o.boot}${o.tijd ? ' om ' + o.tijd : ''}`;
  return `${o.naam} — aankomst onbekend`;
}

function havenPlaatsTegel(s, vol, idx){
  /* havenSetVerwacht() telt per kleurset ("welke bakken vertrekken samen"),
     terwijl s.key sinds de tegelsleutel de aankomstset is. Eén tegel kan
     meerdere kleursets bevatten, dus tellen we ze hier bij elkaar op — anders
     zou dit altijd 0 teruggeven en verdween de "3 van 4 bakken"-schaduw. */
  const verwacht = vol
    ? [...new Set(s.bakken.map(b => b.setKey))].reduce((n, k) => n + havenSetVerwacht(k), 0)
    : 0;
  const tekort = Math.max(0, verwacht - s.bakken.length);
  /* De bakken die er nog niet zijn, mét wie ze brengt en hoe laat. Ze krijgen
     een spookvakje ín de tegel (op hun eigen plek in de formatie) en daarnaast
     een regel eronder — het vakje toont de naam, de regel de herkomst. */
  const ontbreekt = vol ? havenSetOntbreekt(s.bakken).slice(0, tekort || undefined) : [];
  const blokjes = havenBakBlokjes(s.bakken, null, true, ontbreekt, vol);
  const boot = esc(verkortSchipnaam(s.vertrekboot) || '?');
  const schip = esc(verkortSchipnaam(s.aankomstschip) || verkortSchipnaam(s.vertrekboot) || '?');
  /* Het aantal staat er alleen bij vanaf drie bakken. Bij één of twee zie je
     in één oogopslag wat er ligt en is het getal alleen maar drukte; vanaf
     drie wil je weten hoeveel er hóren te liggen. */
  const telling = Math.max(s.bakken.length, verwacht) >= 3
    ? `${s.bakken.length}${tekort ? ' van ' + verwacht : ''} bakken`
    : '';

  /* Twee dingen die hier tot 1.199 stilzwijgend misgingen.

     Eén: bij een tekort verschenen er spookplekjes in het raster, maar zonder
     naam. Dan weet je wel dát er iets mist en niet wát, laat staan waar je het
     moet halen. Nu staan ze eronder, met hun plek erbij.

     Twee: verwacht is 0 zodra de bakken niet in de VH/HGK-lijst staan — dan
     heeft de set een LOS-sleutel in plaats van een kleurgroep. De tegel zei
     dan gewoon "4 bakken", alsof dat het hele stel was. Dat is geen weten maar
     niet-weten, en dat hoort er te staan. */
  const aantalOnbekend = vol && verwacht === 0 && s.bakken.length >= 2;
  /* De ontbrekende bakken staan al als ghost op hun eigen plek ín de set, mét
     hun naam (zie havenBakBlokjes). De losse "wacht op: …"-regel eronder is op
     verzoek vervallen — de naam hoort in de ghost-positie, niet onder de tegel.
     "aantal onbekend" blijft: dat is niet-weten, geen naam. */
  const mistHtml = aantalOnbekend
    ? `<div class="plaats-mist onbekend" title="Deze bakken staan niet in de VH- of HGK-lijst, dus de app weet niet hoeveel er bij dit stel horen. Lees die lijst in en het vult zich vanzelf.">aantal onbekend</div>`
    : '';

  /* Geen height meer hier: die dwong elke tegel op een volle vaste rijmaat,
     ook een tegeltje van 2 bakken dat aan een fractie daarvan genoeg heeft —
     de tegel omkadert nu gewoon zijn eigen inhoud, net als in de Onderweg-
     kolom. top is hier nog een grove schatting (PANEEL_RIJ_SCHATTING_PX):
     havenZetPlaatsPaneel meet elke tegel meteen na het tekenen echt op en
     zet 'm dan definitief op zijn rij, dicht op de vorige. */
  const schuif = ` style="top:${s.rij * PANEEL_RIJ_SCHATTING_PX}px"`;

  return vol
    ? `<div class="haven-wachtrij-set plaats-set vol-set${idx % 2 === 1 ? ' verstek' : ''}" data-plaatsset="${esc(s.key)}"${schuif}>
         <div class="plaats-schip">
           <div class="haven-wachtrij-schip">${boot}</div>
           ${telling ? `<div class="haven-wachtrij-tijd${tekort ? ' tekort' : ''}">${telling}</div>` : ''}
         </div>
         <div class="plaats-bakken">${blokjes}</div>
         ${mistHtml}
       </div>`
    : `<div class="haven-wachtrij-set plaats-set" data-plaatsset="${esc(s.key)}"${schuif}>
         <div class="plaats-bakken">${blokjes}</div>
         <div class="plaats-schip">
           <div class="haven-wachtrij-schip">${schip}</div>
           ${telling ? `<div class="haven-wachtrij-tijd">${telling}</div>` : ''}
         </div>
       </div>`;
}
/* De duwboot-tabjes stonden hier eerst ook, onder elke tegel in de lege
   kolom. Op verzoek weggehaald: die kolom toont alleen de baknamen met hun
   kleur en het aankomstschip. De tabjes horen bij de tegels in de haven zelf
   — zie havenTekenTegelsInTekening(). */

/* Bouwt de kop + tegel-inhoud van een bakkenplaats (leeg of vol) in
   `container` — alleen de inhoud, niet het tonen/verbergen/schuiven/de greep
   (dat is aan de aanroeper). Gedeeld door havenZetPlaatsPaneel (het
   in/uitschuivende paneel: altijd voor vol, en voor leeg op telefoonbreedte)
   en havenTekenLegeKolom (de permanente kolom voor leeg op een breed scherm)
   — één meet-en-pak-implementatie voor allebei, in plaats van twee die uit
   elkaar kunnen lopen.

   opties:
   - extraHtml: extra HTML aan het eind (het paneel gebruikt dit voor de
     schuifgreep-knoppen; de vaste kolom laat dit weg).
   - autoBreedte: meet de breedste tegel en zet die als style.width — voor
     het paneel (dat geen vaste CSS-breedte heeft); de kolom laat dit weg.
   - schaduw: teken op elke lege rij een aantikbare .plaats-schaduw (alleen
     zichtbaar zolang er iets gekozen staat, zie havenVerversSchaduw) — alleen
     voor de permanente kolom, niet voor het paneel. */
function havenVulPlaatsContainer(id, container, opties){
  opties = opties || {};
  const zone = havenZone(id);
  const vol = id === 'vol';
  const sets = havenPlaatsSets(id);

  /* De tegels stonden hier onderling verspringend, elk met een verstek-marge
     die hun kolom op de plaats nabootste. Dat leverde een rafelrand op in
     plaats van een leesbare lijst, en op verzoek staan ze nu — net als in de
     lege kolom — netjes onder elkaar uitgelijnd. Welke kolom een set echt
     inneemt lees je in de haventekening zelf; dit paneel is een lijst.

     Daarmee vervalt ook het zijwaarts slepen: elke sleep binnen het paneel
     gaat voortaan over de rij (zie havenKoppelPaneelSlepen). */

  const kolommenInZone = havenZoneKolommen(zone);
  const plekken = havenZoneSlots(zone).length;
  const rijenInZone = Math.max(1, Math.floor(plekken / kolommenInZone));
  const bezet = havenBakkenMetPlek().filter(b => b.zone === id && b.plek).length;

  /* Het raster reserveerde altijd de volle zonediepte (bijv. 22 rijen op de
     lege plaats) — ook met maar één setje erop. Dat is precies wat het paneel
     "veel te groot" maakte: een enkel tegeltje boven een verder lege
     scrollende vlakte. Nu alleen zo diep als er al ligt plus twee rijen
     speelruimte om iets nieuws neer te zetten — verder scrollen kan nog
     steeds, want havenSchuifSetNaarRij begrenst niet op wat er nu getekend
     wordt, en de volgende hertekening (bijv. na het slepen naar een verder
     gelegen rij) groeit gewoon mee. */
  const rijenGebruikt = sets.length ? Math.max(...sets.map(s => s.rij + s.hoogte)) : 0;
  const rijenGetekend = Math.min(rijenInZone, Math.max(rijenGebruikt + 4, 4));

  /* Het raster staat er nu altijd (ook zonder één tegel erop) — anders is er
     bij een helemaal lege plaats nergens om een schaduwvak (opties.schaduw)
     op te tekenen zodra je voor het eerst iets kiest. "Hier ligt niets" blijft
     als aparte regel ernaast staan wanneer dat zo is. */
  container.innerHTML = `
    <div class="haven-plaatskop">
      <span>${esc(zone.label)}</span>
      <span class="haven-plaatsvrij">${bezet} van ${plekken} plekken bezet</span>
    </div>
    <div class="haven-plaatsinhoud${vol ? ' naar-oost' : ''}">
      ${!sets.length ? '<p class="haven-wachtrij-leeg">Hier ligt niets.</p>' : ''}
      <div class="haven-plaatsraster" style="height:${rijenGetekend * PANEEL_RIJ_SCHATTING_PX}px">${
        sets.map((s, i) => havenPlaatsTegel(s, vol, i)).join('')}</div>
    </div>${vol ? `
    <div class="haven-vertrekvak" id="havenVertrekvak">
      <span>⤴ Vertrokken</span>
      <small>sleep een tegel hierheen als de boot hem heeft opgehaald</small>
    </div>` : ''}${opties.extraHtml || ''}`;

  /* Het paneel stond vast op de helft van het canvas (zie de CSS), los van
     wat erin staat — voor een paar tegels bleef zo een groot leeg stuk over
     tot aan de greep. Nu past hij zich aan de breedste tegel aan. Zonder
     tegels (of vlak na openen, vóór de eerste meting) valt hij terug op de
     CSS-breedte. Alleen voor het paneel — de vaste kolom heeft al een eigen
     CSS-breedte.

     De extra ruimte die hier vroeger bij kwam was voor de zijwaartse
     verstek-verschuiving. Die bestaat niet meer (de tegels staan onder elkaar
     uitgelijnd), dus die reserve ook niet. */
  if(opties.autoBreedte){
    container.style.width = '';
    const tegelsVoorBreedte = [...container.querySelectorAll('.plaats-set')];
    if(tegelsVoorBreedte.length){
      const breedsteTegel = Math.max(...tegelsVoorBreedte.map(t => t.offsetWidth));
      const chrome = 40; // padding van .haven-plaatsinhoud + wat lucht
      container.style.width = Math.round(breedsteTegel + chrome) + 'px';
    }
  }

  /* Nu elke tegel al eenmaal getekend is (en dus een echte offsetHeight
     heeft), de rijen dicht inpakken: de rand van de ene tegel bepaalt de
     afstand tot de volgende, niet een vast rijgetal. Rijen zonder tegel
     blijven een kleinere, maar nog altijd aantikbare band (PANEEL_LEGE_RIJ_PX)
     — anders is er nergens meer lege rij om een tegel op te leggen. Alles
     gebeurt in dezelfde synchrone doorloop als de breedtemeting hierboven,
     dus er is geen zichtbare tussenstap: de browser tekent pas de uiteindelijke
     stand. havenPlaatsRijTops onthoudt het resultaat voor havenKoppelPaneelSlepen
     (havenRijVoorTop), dat bij het loslaten van een sleep dezelfde rijen
     moet kunnen terugvinden.

     Twee sets kunnen dezelfde rij delen zonder elkaar te raken — ze liggen
     dan in een andere kolom, zoals de bakkenplaats-plekken dat toestaan. Deze
     weergave heeft daar geen naast-elkaar-lay-out voor: alle tegels beginnen
     links. Zo'n tweede tegel krijgt hier dus gewoon zijn eigen volgende regel,
     meteen ná de eerste, precies zoals de tekst er zelf al over zegt: "de bakken van
     alle tegels [staan] onder elkaar uitgelijnd en je leest de plaats als een
     lijst" (zie de toelichting boven havenPlaatsTegel). Eerst alles op de rij
     eronder proberen te persen gaf ze allebei dezelfde top en dus zichtbare
     overlap. */
  const tegels = [...container.querySelectorAll('.plaats-set')];
  const tegelPerSleutel = new Map(tegels.map(t => [t.dataset.plaatsset, t]));
  // sets staat al gesorteerd op rij (dan kolom) — zie havenPlaatsSets.
  const rijTops = [];
  let y = 0, volgende = 0;
  for(let r = 0; r < rijenGetekend; r++){
    let gezien = false;
    while(volgende < sets.length && sets[volgende].rij === r){
      const s = sets[volgende++];
      const el = tegelPerSleutel.get(s.key);
      const hoogte = el ? el.offsetHeight : PANEEL_LEGE_RIJ_PX;
      if(el) el.style.top = y + 'px';
      if(!gezien) rijTops[r] = y;
      // Een "fles" (s.hoogte > 1) loopt door in de rij(en) erna — die
      // krijgen, als er zelf nog niets anders op ligt, dezelfde beginhoogte
      // in plaats van een eigen lege-rij-toeslag erbovenop.
      for(let k = 1; k < s.hoogte; k++){ if(rijTops[r + k] == null) rijTops[r + k] = y; }
      y += hoogte + PANEEL_TEGEL_GAP_PX;
      gezien = true;
    }
    if(!gezien && rijTops[r] == null){
      rijTops[r] = y;
      y += PANEEL_LEGE_RIJ_PX + PANEEL_TEGEL_GAP_PX;
    }
  }
  const raster = container.querySelector('.haven-plaatsraster');
  if(raster) raster.style.height = Math.max(0, y - PANEEL_TEGEL_GAP_PX) + 'px';
  havenPlaatsRijTops = rijTops;

  /* Schaduwvakken: één per lege rij, met de eerste slot-index van die rij
     (kolom 0) als bestemming — zelfde aanpak als zetOpRij() in
     havenSchuifSetNaarRij gebruikt voor een specifieke rij. Onzichtbaar tot
     .toont-schaduw op de kolom staat (havenVerversSchaduw), dus dit hoeft
     niet bij elke keuzewijziging opnieuw getekend te worden. */
  if(opties.schaduw && raster){
    const zoneSlots = havenZoneSlots(zone);
    const schaduwHtml = [];
    for(let r = 0; r < rijenGetekend; r++){
      const bezetHier = sets.some(s => s.rij <= r && s.rij + s.hoogte > r);
      if(bezetHier) continue;
      const slot = zoneSlots.find(sl => sl.rij === r && sl.kol === 0);
      if(!slot) continue;
      schaduwHtml.push(`<div class="plaats-schaduw" data-schaduw-slot="${slot.index}" style="top:${rijTops[r]}px;height:${PANEEL_LEGE_RIJ_PX}px"></div>`);
    }
    if(schaduwHtml.length) raster.insertAdjacentHTML('beforeend', schaduwHtml.join(''));
    raster.querySelectorAll('.plaats-schaduw').forEach(el => {
      el.addEventListener('click', () => havenZetGekozenSets(id, +el.dataset.schaduwSlot));
    });
  }
}

function havenZetPlaatsPaneel(id){
  const vorige = havenOpenPlaats;
  havenOpenPlaats = id;
  const paneel = document.getElementById('havenPlaatsPaneel');
  if(!paneel) return;
  havenTekenPlaatsTabs();

  if(!id){
    paneel.hidden = true; paneel.innerHTML = '';
    havenOntkoppelBuitenKlik();
    return;
  }
  havenKoppelBuitenKlik();

  const vol = id === 'vol';

  /* Het paneel dekt de haven niet meer helemaal af. De lege plaats opent
     vanaf het westen over de halve haven, de volle vanaf het oosten over
     zeventig procent. Zo blijft er altijd een stuk haven zichtbaar om
     naartoe te slepen — en zie je meteen waar je vandaan komt. */
  paneel.hidden = false;
  paneel.classList.toggle('vanuit-west', id === 'leeg');
  paneel.classList.toggle('vanuit-onder', id === 'vol');

  /* De volle plaats komt van onderen omhoog en krijgt daarom twee grepen: een
     liggende bovenop, waar je hem wegduwt in de richting waar hij vandaan
     kwam, en dezelfde greep aan de zijkant als altijd — met de punt nu ook
     naar beneden, want daar gaat hij heen. */
  const grepen = vol
    ? [{ plek:'op-boven', richting:'naar-onder' }, { plek:'op-links', richting:'naar-onder' }]
    : [{ plek:'op-rechts', richting:'naar-west' }];
  const greepHtml = grepen.map(g => `
    <!-- ❮ en ❯ zijn interpunctie: veel schermlezers slaan die over, en dan
         blijft er letterlijk "knop" over. De title helpt hier niet, want dit
         paneel wordt met de vinger bediend en daar is geen muisaanwijzer. -->
    <button type="button" class="haven-paneelgreep ${g.plek} ${g.richting}"
            aria-label="Menu aan de kant schuiven"
            title="Menu aan de kant schuiven — wat je hebt aangetikt blijft klaarstaan">
      <span class="ribbel"></span>
      <span class="punt" aria-hidden="true">${g.richting === 'naar-west' ? '❮' : '❯'}</span>
      <span class="ribbel"></span>
    </button>`).join('');

  havenVulPlaatsContainer(id, paneel, { extraHtml: greepHtml, autoBreedte: true });

  paneel.querySelectorAll('.haven-paneelgreep').forEach(g =>
    g.addEventListener('click', havenSchuifPaneelDicht));

  /* Openen schuift net zo goed, vanaf de kant waar het paneel hoort. Alleen
     als het paneel er nog niet stond: de haven wordt bij elke wijziging
     opnieuw getekend, en dan zou het menu telkens weer naar binnen komen. */
  if(vorige !== id) havenSchuifPaneelOpen(paneel);
}

/* De lege bakkenplaats als vaste, altijd zichtbare kolom (breed scherm) —
   zie havenVulPlaatsContainer voor de inhoud zelf. Geen greep, geen
   auto-breedte (de kolom heeft een vaste CSS-breedte), nooit verborgen. De
   kop is zelf ook een bestemming: tik 'm aan om een gekozen set hierheen te
   sturen zónder een specifieke schaduw te kiezen — zoals de oude tabknop
   deed (havenTekenPlaatsTabs). */
/* "Wat ligt waar" — per duwboot hoeveel bakken er zijn en op welke plekken.
   Dit stond in het voorstel over de tekening heen, in het lege water midden in
   het bassin. Daar is het niet neer te zetten zonder te gokken: de tekening
   schaalt op hoogte mee met het scherm, dus dat lege stuk zit nooit op een
   vaste plaats en een blok eroverheen zou vroeg of laat een bak afdekken.
   Onder de lege-bakkenplaatskolom is de plek wél voorspelbaar, en daar stond
   toch al bijna tweehonderd pixels niets. */
function havenIndexHtml(){
  const perBoot = new Map();
  const voegToe = (boot, plek) => {
    const naam = verkortSchipnaam(boot) || boot;
    if(!naam) return;
    if(!perBoot.has(naam)) perBoot.set(naam, { totaal: 0, plekken: new Map() });
    const r = perBoot.get(naam);
    r.totaal++;
    r.plekken.set(plek, (r.plekken.get(plek) || 0) + 1);
  };
  havenBakkenMetPlek().forEach(b => {
    if(!b.plek) return;
    voegToe(b.vertrekbootEcht || b.vertrekboot, HAVEN_PLEKNAAM[b.zone] || b.zone);
  });
  havenWachtrij().forEach(set => set.bakken.forEach(() => voegToe(set.schip, 'onderweg')));

  if(!perBoot.size) return '';
  const regels = [...perBoot.entries()]
    .sort((a, b) => b[1].totaal - a[1].totaal)
    .map(([boot, r]) => {
      const plekken = [...r.plekken.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([p, n]) => `${n}× ${esc(p)}`).join(' · ');
      return `<div class="haven-index-regel">
                <span class="boot">${esc(boot)}</span>
                <span class="n">${r.totaal}</span>
                <span class="waar">${plekken}</span>
              </div>`;
    }).join('');
  return `<section class="haven-index" aria-label="Wat ligt waar, per duwboot">
            <h3>Wat ligt waar</h3>${regels}
          </section>`;
}

function havenTekenLegeKolom(){
  const kolom = document.getElementById('havenLegeKolom');
  if(!kolom) return;
  havenVulPlaatsContainer('leeg', kolom, { schaduw: true, extraHtml: havenIndexHtml() });
  const kop = kolom.querySelector('.haven-plaatskop');
  if(kop){
    kop.style.cursor = 'pointer';
    kop.title = 'Tik om een gekozen set hierheen te sturen';
    kop.addEventListener('click', () => havenZetGekozenSets('leeg'));
  }
}

/* De volle bakkenplaats als vast, altijd zichtbaar vlak — overlay op de
   onderkant van de tekening (havenVulPlaatsContainer 'vol', mét het
   Vertrokken-vak), maar zonder schuifgreep en zonder aan/uit-knop. De kop is
   ook een bestemming: tik 'm aan om een gekozen set hierheen te sturen. Een
   greep bovenop klapt het vlak uit/in (geen scroll: in rust de onderste
   eenheden, uitgeklapt alle rijen). Alleen op een breed scherm; op telefoon
   loopt 'vol' nog via het mobiele tabblad + paneel. */
/* De zichtbare container van de volle plaats: op een breed scherm het vaste
   vlak (#havenVolVlak), op telefoon het in/uitschuivende paneel. Sinds het vlak
   bestaat moeten plekken die "het vol-paneel" opzochten hier langs. */
function havenVolContainer(){
  const vlak = document.getElementById('havenVolVlak');
  if(vlak && !vlak.hidden) return vlak;
  return document.getElementById('havenPlaatsPaneel');
}

let havenVolUitgeklapt = false;      // handmatige stand (greep)
let havenVolSleepUit = false;        // transient: uitgeklapt zolang er gesleept wordt
let havenVolResizeGekoppeld = false;
let havenVolSleepDetectieGekoppeld = false;

/* Het vlak op de gemeten grenzen van de beige doek (.haven-water) zetten, niet
   op vaste CSS-percentages van het canvas: de SVG-tekening is binnen het witte
   canvas "geletterboxed" (marges boven/onder of links/rechts die per scherm
   verschillen), dus alleen de echte waterrand houdt het vlak binnen de lijntjes.
   Rechtsonder, met een beige marge rondom. Hoogte: in rust een strook, uitgeklapt
   bijna de hele waterhoogte — de CSS-transition op height animeert het schuiven. */
function havenPositioneerVolVlak(){
  const vlak = document.getElementById('havenVolVlak');
  const canvas = document.getElementById('havenCanvas');
  const water = document.querySelector('#havenSvg .haven-water');
  if(!vlak || !canvas || !water) return;
  const c = canvas.getBoundingClientRect();
  const w = water.getBoundingClientRect();
  if(!w.width || !w.height) return;
  const marge = Math.max(8, Math.round(w.height * 0.04));
  const rechts = Math.round(c.right - w.right) + marge;
  const onder  = Math.round(c.bottom - w.bottom) + marge;
  const links  = Math.round(w.left - c.left) + Math.round(w.width * 0.50);
  const rustH  = Math.round(w.height * 0.42);
  const uitH   = Math.round(w.height - 2 * marge);
  vlak.style.left = links + 'px';
  vlak.style.right = rechts + 'px';
  vlak.style.bottom = onder + 'px';
  vlak.style.top = 'auto';
  vlak.style.height = (havenVolUitgeklapt || havenVolSleepUit ? uitH : rustH) + 'px';
}

/* Automatisch uitklappen zodra er iets gesleept wordt (van leeg, de haven of
   binnen Vol), en weer inklappen bij loslaten — bovenop de handmatige greep.
   Pas vanaf de eerste beweging ná het beetpakken, zodat een gewone tik het vlak
   niet kort open-en-dicht laat flitsen. Eén keer gekoppeld; het vlak wordt op
   id opgezocht omdat het bij elke hertekening opnieuw gemaakt wordt. */
function havenKoppelVolSleepUitklap(){
  if(havenVolSleepDetectieGekoppeld) return;
  havenVolSleepDetectieGekoppeld = true;
  document.addEventListener('pointerdown', e => {
    if(!e.target.closest || !e.target.closest('.haven-wrap')) return;
    const pak = e.target.closest(
      '.haven-wachtrij-set, .plaats-set, .haven-wachtrij-bak.los, [data-bak]');
    if(!pak) return;
    let actief = false;
    const beweeg = () => {
      if(actief) return;
      actief = true;
      havenVolSleepUit = true;
      havenPositioneerVolVlak();
    };
    const stop = () => {
      document.removeEventListener('pointermove', beweeg);
      document.removeEventListener('pointerup', stop);
      document.removeEventListener('pointercancel', stop);
      if(actief){ havenVolSleepUit = false; havenPositioneerVolVlak(); }
    };
    document.addEventListener('pointermove', beweeg);
    document.addEventListener('pointerup', stop);
    document.addEventListener('pointercancel', stop);
  }, true);
}

function havenTekenVolVlak(){
  const vlak = document.getElementById('havenVolVlak');
  if(!vlak) return;
  // schaduw: toon de lege rijen als gestippelde ghost-plekken (drop-doelen),
  // in rust zichtbaar zodat je ziet op welke rij een set kan.
  havenVulPlaatsContainer('vol', vlak, { schaduw: true });
  vlak.classList.toggle('uitgeklapt', havenVolUitgeklapt);
  havenPositioneerVolVlak();
  // Eén keer: bij schermwissel opnieuw op de waterrand zetten (het vlak wordt
  // bij elke hertekening opnieuw gemaakt, dus op id opzoeken).
  if(!havenVolResizeGekoppeld){
    havenVolResizeGekoppeld = true;
    window.addEventListener('resize', () => havenPositioneerVolVlak());
  }
  havenKoppelVolSleepUitklap();
  const kop = vlak.querySelector('.haven-plaatskop');
  if(kop){
    kop.style.cursor = 'pointer';
    kop.title = 'Tik om een gekozen set hierheen te sturen';
    kop.addEventListener('click', () => havenZetGekozenSets('vol'));
  }
  // Greep om uit/in te klappen. Alleen de hoogte-klasse wisselen — niet
  // hertekenen — zodat de sleep-koppeling op de tegels intact blijft.
  const greep = document.createElement('button');
  greep.type = 'button';
  greep.className = 'haven-vol-greep';
  const zetGreep = () => {
    greep.setAttribute('aria-label', havenVolUitgeklapt
      ? 'Volle bakkenplaats inklappen' : 'Volle bakkenplaats uitklappen');
    greep.innerHTML = `<span class="punt" aria-hidden="true">${havenVolUitgeklapt ? '▾' : '▴'}</span>`;
  };
  zetGreep();
  greep.addEventListener('click', () => {
    havenVolUitgeklapt = !havenVolUitgeklapt;
    vlak.classList.toggle('uitgeklapt', havenVolUitgeklapt);
    havenPositioneerVolVlak();
    zetGreep();
  });
  vlak.appendChild(greep);
}

/* Na een sleep die eindigt in zijn eigen container (rij/kolom opschuiven),
   moet precies díe container opnieuw getekend worden. Welke dat is hangt af
   van het element zelf, niet van zoneId: dezelfde 'leeg' kan zowel bij de
   vaste kolom horen (breed scherm) als bij het gedeelde paneel (telefoon).
   Vóór deze functie riep havenKoppelPaneelSlepen hier altijd
   havenZetPlaatsPaneel(zoneId) aan, en dat opent voor 'leeg' op een breed
   scherm per ongeluk het oude, inmiddels overbodige paneel weer. */
function havenHertekenPlaatsContainer(container, zoneId){
  if(container.id === 'havenLegeKolom') havenTekenLegeKolom();
  else if(container.id === 'havenVolVlak') havenTekenVolVlak();
  else havenZetPlaatsPaneel(zoneId);
}

/* Buiten het menu drukken sluit het.

   Het pijltje blijft, maar een menu dat over de haven ligt wil je ook kwijt
   kunnen zonder eerst naar de greep te hoeven. Drie uitzonderingen: binnen
   het menu zelf gebeurt van alles, een tabje regelt zijn eigen open en dicht,
   en staat er iets klaar voor een bestemming, dan is die druk buiten het menu
   juist het aanwijzen van die plek — dan mag het menu niet onder je vinger
   vandaan schuiven. */
let havenBuitenKlikLos = null;

function havenKoppelBuitenKlik(){
  havenOntkoppelBuitenKlik();
  const luister = (e) => {
    const paneel = document.getElementById('havenPlaatsPaneel');
    if(!paneel || paneel.hidden) return;
    if(paneel.contains(e.target)) return;
    if(e.target.closest && e.target.closest('.haven-plaatstab')) return;
    // Op telefoon bepaalt de eigen tabbalk (havenKiesMobielTab, via
    // renderHavenTab) of het paneel open moet — een tik op een ander tabje
    // mag niet ook nog eens de "buiten geklikt"-sluiting triggeren, anders
    // wint de laatste (met een vertraging van 340ms) alsnog en klapt het
    // net-geopende paneel na de tabwissel weer dicht.
    if(e.target.closest && e.target.closest('.haven-mobieltab')) return;
    if(havenWachtOpBestemming()) return;
    havenSchuifPaneelDicht();
  };
  document.addEventListener('pointerdown', luister, true);
  havenBuitenKlikLos = () => document.removeEventListener('pointerdown', luister, true);
}

function havenOntkoppelBuitenKlik(){
  if(havenBuitenKlikLos){ havenBuitenKlikLos(); havenBuitenKlikLos = null; }
}

function havenSchuifPaneelOpen(paneel){
  const doek = paneel.closest('.haven-canvas');
  if(doek) doek.classList.add('schuift');
  paneel.classList.add('schuift-dicht');
  void paneel.offsetWidth;                       // stand vastzetten vóór de overgang
  paneel.classList.remove('schuift-dicht');
  setTimeout(() => { if(doek) doek.classList.remove('schuift'); }, PANEEL_SCHUIF_MS);
}

/* Het menu aan de kant schuiven zonder de keuze te verliezen.
   Met de tikfunctie kies je een set of een bak in het menu en wijs je daarna
   de plek op de kade aan — maar de B3- en B4-lengtes liggen precies onder het
   menu. Dit schuift het weg; wat aanstaat blijft aanstaan, en het tabje
   onderaan zet het weer open. */
const PANEEL_SCHUIF_MS = 340;

function havenSchuifPaneelDicht(){
  const paneel = document.getElementById('havenPlaatsPaneel');
  if(!paneel || paneel.hidden) return havenZetPlaatsPaneel(null);
  const doek = paneel.closest('.haven-canvas');
  if(doek) doek.classList.add('schuift');
  paneel.classList.add('schuift-dicht');
  setTimeout(() => {
    paneel.classList.remove('schuift-dicht');
    havenZetPlaatsPaneel(null);
    if(doek) doek.classList.remove('schuift');
  }, PANEEL_SCHUIF_MS);
}

// Sleep je over een tabje, dan klapt het bijbehorende paneel open. Alleen
// als het nog niet openstaat — anders knippert het bij elke muisbeweging.
function havenTabOnderAanwijzer(e){
  const balk = document.getElementById('havenPlaatsTabs');
  if(!balk) return null;
  for(const knop of balk.querySelectorAll('.haven-plaatstab')){
    const r = knop.getBoundingClientRect();
    if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){
      return knop.dataset.plaats;
    }
  }
  return null;
}

function havenBinnenElement(el, e){
  if(!el) return false;
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right &&
         e.clientY >= r.top  && e.clientY <= r.bottom;
}

/* Welke bakkenplaats ligt onder de aanwijzer, als je hier iets zou laten
   vallen? Eerst de lege-bakkenplaats-kolom (altijd 'leeg' als hij zichtbaar
   is en je erboven zit — geen toggle-status meer nodig, hij staat toch
   altijd op dezelfde plek), dan het in/uitschuivende paneel (dat blijft ofwel
   'vol', ofwel — op telefoon — 'leeg', dus havenOpenPlaats zelf zegt welke).
   Vervangt de oude "havenBovenPaneel(e) ? havenOpenPlaats : null" nu er twee
   containers tegelijk een geldige bestemming kunnen zijn in plaats van één
   gedeelde. */
function havenPlaatsZoneOnderAanwijzer(e){
  const kolom = document.getElementById('havenLegeKolom');
  if(kolom && !kolom.hidden && havenBinnenElement(kolom, e)) return 'leeg';
  // De volle bakkenplaats is sinds het herontwerp een vast vlak onder de
  // tekening (breed scherm) — altijd 'vol' als je erboven zit.
  const volVlak = document.getElementById('havenVolVlak');
  if(volVlak && !volVlak.hidden && havenBinnenElement(volVlak, e)) return 'vol';
  const paneel = document.getElementById('havenPlaatsPaneel');
  if(paneel && !paneel.hidden && havenBinnenElement(paneel, e)) return havenOpenPlaats;
  return null;
}

// Alleen de vraag "sta ik boven een van de twee bakkenplaatsen" — gebruikt
// waar de precieze zone er niet toe doet (doelwit-markering, "heb ik het
// paneel verlaten"-tracking). Voor de bestemming zelf: havenPlaatsZoneOnderAanwijzer.
function havenBovenPaneel(e){
  return havenPlaatsZoneOnderAanwijzer(e) != null;
}

// --- Slepen en selecteren -------------------------------------------
/* Druk je tussen de bakken van een set — het midden van een blok van vier, of
   de naad tussen twee — dan pak je de hele set op. Daar ligt geen bak, dus de
   aanraking komt anders op de zone eronder terecht en zou de selectie wissen.

   Met een vinger is dat de natuurlijke beweging: je legt hem midden op de set
   die je wilt verplaatsen. Een losse bak pak je nog steeds door hem zelf aan te
   raken. */
function havenSetOnderSvgPunt(px, py){
  const perSet = new Map();
  havenBakkenMetPlek().forEach(b => {
    if(!b.plek) return;
    const k = b.zone + '|' + b.tegelSleutel;
    if(!perSet.has(k)) perSet.set(k, []);
    perSet.get(k).push(b);
  });

  let beste = null, besteOppervlak = Infinity;
  perSet.forEach(lijst => {
    if(lijst.length < 2) return;
    const links  = Math.min(...lijst.map(b => hx(b.plek.x)));
    const rechts = Math.max(...lijst.map(b => hx(b.plek.x + b.plek.w)));
    const boven  = Math.min(...lijst.map(b => hy(b.plek.y)));
    const onder  = Math.max(...lijst.map(b => hy(b.plek.y + b.plek.h)));
    if(px < links || px > rechts || py < boven || py > onder) return;
    // Overlappen er twee, dan wint de kleinste — dat is de set die je bedoelt.
    const oppervlak = (rechts - links) * (onder - boven);
    if(oppervlak < besteOppervlak){
      besteOppervlak = oppervlak;
      beste = lijst.map(b => b.sleutel);
    }
  });
  return beste;
}

/* Terugslepen naar Onderweg. Handig als een set te vroeg naar binnen is
   gehaald — dat gebeurt, je ziet een schip aankomen en bent net te snel.

   De ligplaats blijft bewaard: havenWachtrij() zet de set terug in de kolom en
   onthoudt waar hij lag, dus haal je hem later opnieuw binnen dan komt hij op
   dezelfde plek terug. Klaar om te laden gaat wel uit — een set die er nog niet
   is, kan ook niet klaarliggen. */
async function havenTerugNaarOnderweg(sleutels){
  const alle = havenBakken();
  const setKeys = new Set(alle.filter(b => sleutels.includes(b.sleutel)).map(b => b.tegelSleutel));
  const tripIds = new Set(alle.filter(b => setKeys.has(b.tegelSleutel) && b.tripId).map(b => b.tripId));

  // Eerst kijken wát er teruggaat, dan vastleggen, dan pas omzetten — anders
  // bewaart het actielog de stand van ná de wijziging en doet ongedaan maken
  // niets.
  const teruggaand = [...tripIds]
    .map(id => trips.find(x => x.id === id))
    .filter(t => t && t.aangemeerd);

  if(!teruggaand.length){
    showToast('Deze bakken horen bij geen enkele rit — die kunnen niet terug naar Onderweg.');
    return 0;
  }
  const namen = teruggaand.map(t => t.schubboot || t.station || '?');
  await logAction(`Haven: terug naar Onderweg (${namen.join(', ')})`);
  // Ook een afgeronde rit kan zo de haven uit: zijn bakken zijn vertrokken.
  teruggaand.forEach(t => {
    t.aangemeerd = false; t.klaarOmTeLaden = false;
    delete t.bakkenInHaven;
  });
  const aantal = teruggaand.length;
  await saveTrips();
  return aantal;
}

/* Ghost: laat vóór het loslaten zien waar de set terechtkomt.

   Zonder dit sleep je op gevoel en zie je pas ná het loslaten of het goed
   ging — en ging het mis, dan moet je het terugslepen. De ghost gebruikt
   dezelfde berekening als de verplaatsing zelf (havenZoekPlaats), dus wat je
   ziet is precies wat er gebeurt. Past het nergens, dan is er geen ghost en
   weet je meteen dat loslaten niets oplevert. */
function havenWisGhost(svg){
  svg.querySelectorAll('.haven-ghost').forEach(n => n.remove());
}

function havenToonGhost(svg, namen, zoneId, startSlot, herindelen){
  havenWisGhost(svg);
  if(!namen.length) return;
  const plan = havenZoekPlaats(namen, zoneId, startSlot, herindelen);
  if(!plan) return;

  const NS = 'http://www.w3.org/2000/svg';
  const zone = plan.zone;
  const groep = document.createElementNS(NS, 'g');
  groep.setAttribute('class', 'haven-ghost');

  // Net als bij de bakken zelf: aaneengesloten vanaf de westelijke bak, zodat
  // het gat tussen twee laadlengtes niet middenin de ghost valt.
  const westKolom = Math.min(...plan.plekken.map(p => p.kol));
  const westX = havenKolomX(zone, westKolom);
  const stap = havenKolomStap(zone);

  havenZoneSlots(zone).forEach(s => {
    if(!plan.plekken.some(p => p.slot === s.index)) return;
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', hx(westX + (s.kol - westKolom) * stap) + 1.5);
    r.setAttribute('y', hy(s.y) + 1.5);
    // Een plek is een halve baklengte breed, maar een bak beslaat er twee.
    // De ghost moet de bak laten zien, niet de helft ervan.
    r.setAttribute('width',  hx(BAK_LENGTE_M) - 3);
    r.setAttribute('height', hy(s.h) - 3);
    r.setAttribute('rx', 2.5);
    groep.appendChild(r);
  });

  // Vooraan, zodat de ghost niet achter een bak verdwijnt die er al ligt.
  svg.appendChild(groep);
}

/* De tegels in de haventekening: één omlijning om alles wat bij elkaar hoort,
   met onderaan een tabje per duwboot (zelfde vorm als het tabje van de volle
   bakkenplaats: een lip met een pijl erin, zo breed als de naam nodig heeft).

   Aantikken zet alleen de bakken van díe boot in de selectie — daarna wijs je
   een bestemming aan zoals altijd (havenZetGekozenSets kent havenSelectie al
   als geldige bron). */
const TEGELTAB = { hoogte: 11, tekst: 8, padding: 4, gat: 3, teken: 6 };

function havenTegelGroepen(bakken, mobielZone){
  const groepen = new Map();
  bakken.forEach(b => {
    if(!b.plek) return;
    const zone = havenZone(b.zone);
    if(zone && zone.virtueel) return;
    if(mobielZone && b.zone !== mobielZone.id) return;
    const k = b.zone + '|' + b.tegelSleutel;
    if(!groepen.has(k)) groepen.set(k, []);
    groepen.get(k).push(b);
  });
  return groepen;
}

function havenTegelKader(lijst){
  return {
    links:  Math.min(...lijst.map(b => hx(b.plek.x))),
    rechts: Math.max(...lijst.map(b => hx(b.plek.x + b.plek.w))),
    boven:  Math.min(...lijst.map(b => hy(b.plek.y))),
    onder:  Math.max(...lijst.map(b => hy(b.plek.y + b.plek.h)))
  };
}

/* Tegels die dezelfde boot ophaalt, als één vlak getekend — op verzoek.

   havenTegelGroepen hierboven blijft de bron van waarheid voor wát bij
   elkaar hoort (aankomst, zie tegelSleutel): dat blijft zo, want één
   aankomstset met meerdere kleuren/boten moet één eenheid blijven bij een
   her-import, en dát mag dit visuele samenvoegen niet verstoren. Dit is dus
   puur de tékening: twee aparte aankomsttegels die toch met dezelfde boot op
   dezelfde tijd vertrekken (zie ook perZoneBoot hieronder, dat ze al één
   gedeeld tabje gaf) krijgen hier ook één omlijning, zodat je niet meer apart
   hoeft te combineren "deze twee horen eigenlijk bij elkaar".

   Alleen samenvoegen binnen dezelfde zone en als de kaders dicht genoeg bij
   elkaar liggen (MAX_GAT): twee leveringen voor dezelfde boot die toevallig
   aan weerskanten van een hele kade liggen, horen niet tot één gerekt vlak
   over al het water ertussen te worden — dan lees je niet meer waar de
   bakken echt liggen. Ver uit elkaar blijven ze gewoon twee vlakken; het
   gedeelde tabje regelt dan nog steeds dat je ze in één keer kunt
   verplaatsen. */
function havenTegelVisueleGroepen(bakken, mobielZone){
  const groepen = [...havenTegelGroepen(bakken, mobielZone).values()]
    .map(lijst => ({ lijst, zone: lijst[0].zone, kader: havenTegelKader(lijst) }));

  const vertrekSleutels = (g) => new Set(g.lijst
    .filter(b => b.vertrekbootEcht)
    .map(b => b.vertrekbootEcht + '|' + (b.vertrektijd || '')));

  const MAX_GAT = HALVE_BAK_M * 3;   // ruim een baklengte speling
  let gewijzigd = true;
  while(gewijzigd){
    gewijzigd = false;
    buiten:
    for(let i = 0; i < groepen.length; i++){
      for(let j = i + 1; j < groepen.length; j++){
        const a = groepen[i], b = groepen[j];
        if(a.zone !== b.zone) continue;
        const aSleutels = vertrekSleutels(a);
        if(![...vertrekSleutels(b)].some(s => aSleutels.has(s))) continue;
        const gat = Math.max(a.kader.links - b.kader.rechts, b.kader.links - a.kader.rechts, 0);
        if(gat > MAX_GAT) continue;
        a.lijst = a.lijst.concat(b.lijst);
        a.kader = havenTegelKader(a.lijst);
        groepen.splice(j, 1);
        gewijzigd = true;
        break buiten;
      }
    }
  }
  return groepen;
}

/* Het vlak van de tegel — vóór de bakken getekend, zodat de bakjes er net als
   in Onderweg en de lege kolom ín liggen in plaats van erop. */
function havenTekenTegelVlakken(svg, bakken, mobielZone){
  const NS = 'http://www.w3.org/2000/svg';
  const el = (naam, attrs) => {
    const e = document.createElementNS(NS, naam);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  havenTegelVisueleGroepen(bakken, mobielZone).forEach(({ kader: k }) => {
    const x = k.links - 3, y = k.boven - 3;
    const b = (k.rechts - k.links) + 6, h = (k.onder - k.boven) + 6;

    const groep = el('g', { class: 'haven-tegel-vlak-groep' });
    groep.appendChild(el('rect', { x, y, width: b, height: h, rx: 3.5, class: 'haven-tegel-vlak' }));
    svg.appendChild(groep);
  });
}

function havenTekenTegelsInTekening(svg, bakken, mobielZone){
  const NS = 'http://www.w3.org/2000/svg';
  // Eigen hulpje: het gelijknamige in renderHavenTab staat daar lokaal.
  const el = (naam, attrs) => {
    const e = document.createElementNS(NS, naam);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };

  /* Het tabje is een lip van de tegel, geen los knopje: de kant die tegen de
     tegel aan ligt is recht (geen ruimte ertussen), de kant die vrij ligt is
     afgerond. Zo hangt het eraan vast in plaats van ervoor te zweven.
     `omhoog` betekent: de lip hangt bóven de tegel, dus is hij aan de
     bovenkant afgerond en zit hij met zijn onderrand vast. */
  const lipPad = (x, y, b, h, r, omhoog) => omhoog
    ? `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y}` +
      ` L${x + b - r},${y} Q${x + b},${y} ${x + b},${y + r}` +
      ` L${x + b},${y + h} Z`
    : `M${x},${y} L${x + b},${y} L${x + b},${y + h - r}` +
      ` Q${x + b},${y + h} ${x + b - r},${y + h}` +
      ` L${x + r},${y + h} Q${x},${y + h} ${x},${y + h - r} Z`;

  const tegels = havenTegelVisueleGroepen(bakken, mobielZone)
    .map(g => ({ ...g, groep: el('g', { class: 'haven-tegel' }) }));

  /* Eén tabje per duwboot per kade, niet per tegel.

     Liggen er vier bakken op de eerste lengte die allemaal met dezelfde boot
     vertrekken, maar verdeeld over twee tegels, dan stonden er twee tabjes met
     dezelfde naam naast elkaar. Eén is genoeg — en handiger ook: hij pakt dan
     meteen alles wat met die boot meegaat. Dezelfde boot op twee verschillende
     vertrektijden blijft wél twee tabjes: dat zijn in het echt twee vertrekken. */
  const perZoneBoot = new Map();
  tegels.forEach(t => {
    t.lijst.forEach(b => {
      if(!b.vertrekbootEcht) return;          // aankomstboot krijgt geen tabje
      const sleutel = t.zone + '|' + b.vertrekbootEcht + '|' + (b.vertrektijd || '');
      let v = perZoneBoot.get(sleutel);
      if(!v){
        v = { boot: b.vertrekbootEcht, tijd: b.vertrektijd || null, zone: t.zone, bakken: [], tegel: t, west: Infinity };
        perZoneBoot.set(sleutel, v);
      }
      v.bakken.push(b);
      // Het tabje hangt aan de tegel waar de meest westelijke bak van deze
      // boot ligt — daar begint wat je aanwijst.
      if(b.plek.x < v.west){ v.west = b.plek.x; v.tegel = t; }
    });
  });

  /* Een tabje mag nooit over andere bakken heen liggen.

     Ligt er een tegel vlak onder deze, dan lag het tabje dwars over die
     bakken heen: twee baknummers onleesbaar en een naam die je niet kon
     thuisbrengen. Het schuift nu langs de rand van zijn eigen tegel tot het
     vrij ligt — eerst naar rechts en links langs de onderrand, en pas als
     daar niets vrij is naar de bovenrand. Losmaken van de tegel doen we
     nooit: een tabje dat ergens los zweeft hoort zichtbaar bij niets meer.
     Daarom moet het altijd minstens MIN_VAST breed tegen zijn tegel aan
     blijven liggen, en is de terugval (echt nergens plek) gewoon zijn eigen
     hoek — dan ligt hij erover, maar wel aan de juiste tegel. */
  const RAAKT = 0.5;                          // tegen elkaar aan mag, eroverheen niet
  const MIN_VAST = 8;                         // zoveel moet het tabje zijn tegel raken
  const obstakels = tegels.map(t => ({
    x: t.kader.links - 3, y: t.kader.boven - 3,
    b: (t.kader.rechts - t.kader.links) + 6,
    h: (t.kader.onder - t.kader.boven) + 6
  }));
  const botst = (r) => obstakels.some(o =>
    r.x < o.x + o.b - RAAKT && r.x + r.b > o.x + RAAKT &&
    r.y < o.y + o.h - RAAKT && r.y + r.h > o.y + RAAKT);

  function zoekTabPlek(t, breedte){
    const links = t.kader.links - 3;
    const minX = links - (breedte - MIN_VAST);
    const maxX = t.kader.rechts + 3 - MIN_VAST;
    const maxStap = Math.ceil(Math.max(maxX - links, links - minX) / 2);
    for(const omhoog of [false, true]){
      const y = omhoog ? t.kader.boven - 3 - TEGELTAB.hoogte : t.kader.onder + 3;
      for(let stap = 0; stap <= maxStap; stap++){
        // Eerst naar rechts, dan evenver naar links: zo blijft het tabje zo
        // dicht mogelijk bij de linkerhoek waar je hem gewend bent.
        for(const kant of (stap === 0 ? [1] : [1, -1])){
          const x = links + kant * stap * 2;
          if(x < minX || x > maxX) continue;
          if(!botst({ x, y, b: breedte, h: TEGELTAB.hoogte })) return { x, y, omhoog };
        }
      }
    }
    return { x: links, y: t.kader.onder + 3, omhoog: false };
  }

  perZoneBoot.forEach(v => {
    const t = v.tegel;
    const label = verkortSchipnaam(v.boot) || '?';
    // JetBrains Mono is vast van breedte: ~0,6 van de lettergrootte per teken.
    const breedte = Math.round(TEGELTAB.padding * 2 + TEGELTAB.teken +
                               label.length * TEGELTAB.tekst * 0.6) + 2;
    const plek = zoekTabPlek(t, breedte);
    const x = plek.x, y = plek.y;
    // Het volgende tabje moet om dít tabje heen, met een kier ertussen.
    obstakels.push({ x: x - TEGELTAB.gat, y, b: breedte + TEGELTAB.gat * 2, h: TEGELTAB.hoogte });

    /* De kleur van de bakken waar dit tabje bij hoort — dezelfde kleur als de
       rand van die bakken (setKleurVoorThema), zodat je vóór het aantikken al
       ziet welke set eraan hangt. Kleur en vertrekset zijn hetzelfde gegeven,
       dus meer dan één kleur onder één boot hoort niet voor te komen; gebeurt
       het toch, dan wint de kleur die de meeste bakken hebben. */
    const kleurTelling = new Map();
    v.bakken.forEach(b => {
      const c = safeColor(b.kleur, null);
      if(c) kleurTelling.set(c, (kleurTelling.get(c) || 0) + 1);
    });
    let bronKleur = null, meeste = 0;
    kleurTelling.forEach((n, c) => { if(n > meeste){ meeste = n; bronKleur = c; } });
    const vulling = bronKleur ? setKleurVoorThema(bronKleur) : null;
    // Zwarte of witte letters, afhankelijk van hoe licht die vulling uitvalt.
    const opVulling = vulling ? (hexNaarLab(vulling).l > 62 ? '#141414' : '#ffffff') : null;

    const tab = el('g', {
      class: 'haven-boottab',
      'data-boottab': v.boot,
      'data-boottijd': v.tijd || '',
      tabindex: '0', role: 'button',
      'aria-label': `${label}: alle bakken die met deze boot vertrekken kiezen`
    });
    const omtrek = lipPad(x, y, breedte, TEGELTAB.hoogte, 3, plek.omhoog);
    tab.appendChild(el('path', {
      d: omtrek, class: 'haven-boottab-vlak',
      ...(vulling ? { style: `fill:${vulling}` } : {})
    }));
    tab.appendChild(el('path', { d: omtrek, class: 'haven-boottab-keuzerand' }));
    const pijl = el('text', {
      x: x + TEGELTAB.padding, y: y + TEGELTAB.hoogte / 2, class: 'haven-boottab-pijl',
      ...(opVulling ? { style: `fill:${opVulling};fill-opacity:.75` } : {})
    });
    pijl.textContent = '❯';
    tab.appendChild(pijl);
    const naam = el('text', {
      x: x + TEGELTAB.padding + TEGELTAB.teken, y: y + TEGELTAB.hoogte / 2, class: 'haven-boottab-naam',
      ...(opVulling ? { style: `fill:${opVulling}` } : {})
    });
    naam.textContent = label;
    tab.appendChild(naam);
    const titel = document.createElementNS(NS, 'title');
    titel.textContent = `${v.boot}${v.tijd ? ' — ' + v.tijd : ''} · ${v.bakken.map(b => b.naam).join(', ')}`;
    tab.appendChild(titel);

    /* Tik op het tabje = alle bakken die met die boot vertrekken selecteren,
       zodat je ze in één keer kunt verplaatsen. De randen van de bakken worden
       hier meteen bijgewerkt, net als bij een gewone tik op een bak
       (havenSchakelBakSelectie) — zonder dat stond de keuze wel in het geheugen
       maar zag je er niets van. Nog een keer tikken zet de keuze weer uit. */
    const kiesDezeBoot = (ev) => {
      ev.stopPropagation();
      const eigen = v.bakken.map(b => b.sleutel);
      const stondAan = eigen.length && havenSelectie.size === eigen.length
                       && eigen.every(k => havenSelectie.has(k));
      havenSelectie.clear();
      if(!stondAan) eigen.forEach(k => havenSelectie.add(k));
      svg.querySelectorAll('.haven-bak').forEach(n => {
        const aan = havenSelectie.has(n.dataset.bak);
        n.classList.toggle('gekozen', aan);
        n.setAttribute('aria-pressed', String(aan));
      });
      svg.querySelectorAll('.haven-boottab').forEach(x => x.classList.remove('gekozen'));
      if(havenSelectie.size) tab.classList.add('gekozen');
      havenToonSelectie();
      havenVerversGhostVoorSelectie();
    };
    tab.addEventListener('click', kiesDezeBoot);
    tab.addEventListener('keydown', (ev) => {
      if(ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      kiesDezeBoot(ev);
    });
    t.groep.appendChild(tab);
  });

  tegels.forEach(t => svg.appendChild(t.groep));
}

/* Alle plekken laten oplichten waar de vergrote tegel terecht kán.

   Tik je een tegel op de lege plaats aan, dan vergroot die zich én lichten
   alle laadlengtes op waar hij past. Tik je zo'n oplichtende plek aan, dan
   schuift de hele tegel daarheen — als tegel, niet als losse bakken.

   Zelfde berekening als de ghost hierboven (havenZoekPlaats), maar dan voor
   álle zones tegelijk in plaats van alleen die onder de aanwijzer. De
   klik-afhandelaar hangt aan de vakjes die we hier zelf maken, zodat de
   bestaande sleep- en lassocode in havenKoppelSlepen niets hoeft te weten
   van dit pad. */
function havenVerbergAlleGloei(){
  document.querySelectorAll('.haven-gloei').forEach(n => n.remove());
}

function havenToonAlleGloei(namen){
  havenVerbergAlleGloei();
  const svg = document.getElementById('havenSvg');
  if(!svg || !namen || !namen.length) return;

  const NS = 'http://www.w3.org/2000/svg';
  const tekenPlan = (plan) => {
    const groep = document.createElementNS(NS, 'g');
    groep.setAttribute('class', 'haven-gloei');
    const westKolom = Math.min(...plan.plekken.map(p => p.kol));
    const westX = havenKolomX(plan.zone, westKolom);
    const stap = havenKolomStap(plan.zone);

    havenZoneSlots(plan.zone).forEach(s => {
      if(!plan.plekken.some(p => p.slot === s.index)) return;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', hx(westX + (s.kol - westKolom) * stap) + 1.5);
      r.setAttribute('y', hy(s.y) + 1.5);
      r.setAttribute('width',  hx(BAK_LENGTE_M) - 3);
      r.setAttribute('height', hy(s.h) - 3);
      r.setAttribute('rx', 2.5);
      groep.appendChild(r);
    });
    if(!groep.childNodes.length) return;

    const doelZone = plan.zone.id;
    const doelSlot = Math.min(...plan.plekken.map(p => p.slot));
    groep.addEventListener('click', async (e) => {
      e.stopPropagation();
      await havenPlaatsGezoomdeTegel(doelZone, doelSlot);
    });
    svg.appendChild(groep);
  };

  HAVEN_LAYOUT.zones.forEach(zone => {
    // De bakkenplaatsen zijn virtueel (alleen een rekenmaat, geen tekening) —
    // daar valt dus niets op te laten lichten. Die bereik je met hun eigen
    // kolom/paneel, zoals altijd.
    if(zone.virtueel || zone.id === HAVEN_VERTROKKEN) return;

    /* Elke laadlengte waar de set past krijgt zijn eigen schaduw, niet alleen
       de eerste die toevallig vrij is. Eerder lichtte er per kade één plek op;
       tikte je net ernaast, dan gebeurde er niets en leek de set terug te
       vallen naar de lege plaats. Nu is elke plek waar hij zou passen ook echt
       aan te wijzen. */
    const slots = havenZoneSlots(zone);
    const rijen = slots.length ? slots[slots.length - 1].rij + 1 : 0;
    const walRij = havenVultVanOnderen(zone) ? rijen - 1 : 0;
    const ankers = (zone.type === 'kade' && (zone.lengtes || []).length)
      ? zone.lengtes.map(l => {
          const s = slots.find(x => x.rij === walRij && x.kol === l.vanKolom);
          return s ? s.index : null;
        }).filter(v => v != null)
      : [undefined];

    // Twee laadlengtes kunnen op dezelfde plek uitkomen (de zoektocht schuift
    // door als het op de eigen lengte niet past) — die tekenen we één keer.
    const gezien = new Set();
    ankers.forEach(anker => {
      const plan = havenZoekPlaats(namen, zone.id, anker, true);
      if(!plan) return;
      const sleutel = plan.plekken.map(p => p.slot).sort((a, b) => a - b).join(',');
      if(gezien.has(sleutel)) return;
      gezien.add(sleutel);
      tekenPlan(plan);
    });
  });
}

/* Een losse bak bij een tegel voegen. Legt de bak naast de tegel neer én
   onthoudt dat hij daar nu bij hoort, zodat een hertekening of een volgende
   import hem er niet weer uit haalt. Omgekeerd hoeft er niets: een bak die je
   ergens anders neerlegt, hoort daar dan ook weer bij zijn eigen tegel. */
/* Welke tegel ligt er onder de aanwijzer, binnen dít paneel? Niet via
   elementFromPoint: het meebewegende kopietje zit er vlak onder de muis
   tussen, en dat is geen tegel. De tegels zijn absoluut geplaatst en kennen
   hun eigen vak, dus rechttoe rechtaan nameten is hier zowel eenvoudiger als
   betrouwbaarder. */
function havenTegelOnderAanwijzer(paneel, ev){
  return [...paneel.querySelectorAll('.plaats-set')].find(t => {
    const r = t.getBoundingClientRect();
    return ev.clientX >= r.left && ev.clientX <= r.right
        && ev.clientY >= r.top  && ev.clientY <= r.bottom;
  }) || null;
}

/* Intra-set swap: een bak binnen zijn eigen tegel op een andere cel neerleggen.
   De bak onder de aanwijzer (of de ghost/lege cel daar) wisselt van plek met de
   gesleepte bak. Puur een weergave-override (havenBakPlekOverrides, lineaire
   celindex in het tegelraster); de ligplaats-slots blijven ongemoeid. Geeft
   true als er echt iets gewisseld is. */
async function havenWisselBakBinnenTegel(losBakje, ev, kaart, paneel, zoneId){
  const doel = document.elementFromPoint(ev.clientX, ev.clientY);
  const doelCel = doel && doel.closest && doel.closest('.haven-wachtrij-bak[data-cel]');
  // Alleen een cel binnen dezelfde tegel, en niet het bakje zelf.
