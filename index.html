    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openMoveBakModal(trip, btn.dataset.rowIndices.split(',').map(Number));
    });
  });

  wrap.querySelectorAll('.order-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(btn.disabled || !groupList) return;
      const dir = btn.dataset.dir;
      const swapIdx = dir === 'up' ? idx - 1 : idx + 1;
      if(swapIdx < 0 || swapIdx >= groupList.length) return;
      const other = groupList[swapIdx];
      await logAction(`Tegel herschikt: ${trip.schubboot||'?'} ${dir === 'up' ? 'omhoog' : 'omlaag'} (${trip.station||'?'})`);
      const tmp = trip.order ?? trip.planbegin ?? 0;
      trip.order = other.order ?? other.planbegin ?? 0;
      other.order = tmp;
      saveTrips();
      render();
    });
  });

  const stationSelect = wrap.querySelector('.station-select');
  stationSelect.addEventListener('click', e => e.stopPropagation());
  stationSelect.addEventListener('pointerdown', e => e.stopPropagation());
  stationSelect.addEventListener('change', async () => {
    let value = stationSelect.value;
    if(value === '__new__'){
      const custom = await vraagTekst({
        titel: 'Nieuwe binnenbelader',
        uitleg: 'Hoe heet de machine die je wilt toevoegen?',
        placeholder: 'bijv. B5',
        maxLengte: 20,
        bevestig: 'Toevoegen'
      });
      if(!custom){ stationSelect.value = trip.station; return; }
      value = custom;
    }
    await logAction(`B-machine gewijzigd: ${trip.station||'?'} → ${value} (${trip.schubboot||'?'})`);
    trip.station = value;
    saveTrips();
    render();
  });

  /* De laadlengte was een keuzelijst: elke aanraking klapte hem open, ook als
     je alleen "klaar om te laden" wilde zetten. Nu doet de knop twee dingen:
     kort tikken zet klaar om te laden, ingedrukt houden opent de keuze. */
  const lengteKnop = wrap.querySelector('.lengte-knop');
  if(lengteKnop){
    const LANG_INGEDRUKT_MS = 500;
    const SCHUIF_GRENS = 8;      // hierboven telt het als slepen, niet als tik
    let timer = null, startX = 0, startY = 0, langGedaan = false;

    const stop = () => { if(timer){ clearTimeout(timer); timer = null; } };

    lengteKnop.addEventListener('click', e => e.stopPropagation());
    lengteKnop.addEventListener('pointerdown', e => {
      e.stopPropagation();
      langGedaan = false;
      startX = e.clientX; startY = e.clientY;
      stop();
      timer = setTimeout(() => {
        timer = null;
        langGedaan = true;
        if(navigator.vibrate) navigator.vibrate(12);   // voelbaar op de tablet
        openLaadlengteModal(trip);
      }, LANG_INGEDRUKT_MS);
    });
    lengteKnop.addEventListener('pointermove', e => {
      if(!timer) return;
      if(Math.abs(e.clientX - startX) > SCHUIF_GRENS || Math.abs(e.clientY - startY) > SCHUIF_GRENS) stop();
    });
    lengteKnop.addEventListener('pointerup', e => {
      e.stopPropagation();
      if(langGedaan) return;     // de keuze staat al open
      if(!timer) return;         // afgebroken door schuiven
      stop();
      toggleKlaarOmTeLaden(trip, card);
    });
    lengteKnop.addEventListener('pointercancel', stop);
    lengteKnop.addEventListener('pointerleave', stop);
  }

  attachSwipe(card, wrap, trip);
  return wrap;
}

function getKnownStations(){
  const set = new Set(trips.map(t => t.station).filter(Boolean));
  ['B2','B3','B4','MB1'].forEach(s => set.add(s));
  return Array.from(set).sort();
}

/* ---------------------------------------------------------------
   SNELZOEKEN — Ctrl+K, "/" of de Zoeken-knop. Sinds 1.272 een rekenmachine voor
   baknamen: bovenin wat je intikt, links de voorvoegsels (VH, HGK, ESP, ANT,
   ANC, WZ), rechts een numpad. Voorvoegsel + cijfers geeft de bak; Enter springt
   naar de bovenste tegel (zoek-flits). De ABC-knop haalt het letterstoetsenbord
   erbij, voor namen zonder voorvoegsel en voor schepen. De acties (lijsten
   inlezen, thema, enzovoort) zijn eruit: die staan al in de topbalk en het ⋯-menu.
--------------------------------------------------------------- */
function snelzoekNorm(t){ return String(t || '').toLowerCase().replace(/[\s._-]+/g, ''); }

const SNELZOEK_VOOR = [['VH','VH'], ['HGK','HGK'], ['ESP','ESP'], ['ANT','ANT'], ['ANC','ANCIS'], ['WZ','WZ']];

// Eigen letter-toetsenbord (QWERTY) voor het zoeken op namen en schepen. Bewust
// een eigen toetsenbord en niet dat van de tablet: dat komt niet op bij
// programmatische focus (iOS) en dekt, als het wél opkomt, de resultatenlijst
// af. Dit staat ín het zoekpaneel, boven de resultaten, en is overal gelijk.
const SNELZOEK_ABC_RIJEN = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
function snelzoekLetterToetsenbordHtml(){
  const toets = (l) => `<button type="button" class="snelzoek-toets" data-letter="${l}" aria-label="${l}">${l}</button>`;
  const rijen = SNELZOEK_ABC_RIJEN.map((rij, i) =>
    `<div class="snelzoek-abc-rij">${[...rij].map(toets).join('')}${
      i === SNELZOEK_ABC_RIJEN.length - 1 ? '<button type="button" class="snelzoek-toets" data-letter-ctrl="back" aria-label="Wis laatste teken">⌫</button>' : ''
    }</div>`).join('');
  return `<div class="snelzoek-abc" role="group" aria-label="Letters">${rijen}
    <div class="snelzoek-abc-rij">
      <button type="button" class="snelzoek-toets snelzoek-spatie" data-letter=" " aria-label="Spatie">spatie</button>
      <button type="button" class="snelzoek-toets ok" data-letter-ctrl="enter" aria-label="Open de bovenste bak">↵</button>
    </div></div>`;
}

// De letters die iemand typt naar een familie. ANC is de afkorting op het toetsenblok; AN en ANCIS kent de app al.
function snelzoekFamilies(letters){
  return letters === 'ANC' ? ['ANCIS'] : bargeFamiliesOf(letters);
}
function snelzoekIsFamilie(letters){
  return letters === 'ANC' || letters === 'A' || PREFIX_FAMILIES.some(f => f.variants.includes(letters));
}

function snelzoekIndex(){
  const items = [];
  const actief = trips.filter(t => t.status === 'actief');
  const opPlanlijst = new Set();
  const bak = (naam, rest) => {
    const t = parseBargeToken(naam);
    items.push({ groep:'Bakken', wat: naam, fam: t ? bargeFamiliesOf(t.prefix) : [], num: t ? t.number : '', ...rest });
  };
  actief.forEach(t => {
    const boot = verkortSchipnaam(t.schubboot) || t.schubboot || '—';
    const ophalers = vertrekbotenVoorTrip(t);
    items.push({ groep:'Ritten', wat: boot, tekst: ophalers.length ? `→ ${ophalers.join(', ')}` : (t.liegeplaats || ''),
      waar: `${t.station || '?'}${t.liegeplaats ? ' · ' + t.liegeplaats : ''}`,
      zoek: [t.schubboot, boot, ...ophalers, t.station].join(' '), doe: () => snelzoekNaarTegel(t.id) });
    (t.rows || []).forEach(r => {
      if(!r.leichter || isDummyName(r.leichter)) return;
      const sleutel = normalizeBargeName(r.leichter);
      if(opPlanlijst.has(sleutel + t.id)) return;
      opPlanlijst.add(sleutel + t.id); opPlanlijst.add(sleutel);
      const ton = r.menge ? `${r.menge} t` : '';
      bak(r.leichter, { tekst: [r.materiaal, ton, r.kunde].filter(Boolean).join(' · '),
        waar: `${t.station || '?'} · ${boot}`, zoek: [r.leichter, r.kunde].join(' '), doe: () => snelzoekNaarTegel(t.id) });
    });
  });
  // Bakken die (nog) niet op de planlijst staan: onderweg of alleen in VH/HGK.
  [...(vhBakken || []), ...(hgkBakken || [])].forEach(v => {
    if(!v || !v.naam || opPlanlijst.has(normalizeBargeName(v.naam))) return;
    opPlanlijst.add(normalizeBargeName(v.naam));
    bak(v.naam, { tekst: v.schip ? `met ${v.schip}` : '',
      waar: 'Haven', zoek: [v.naam, v.schip, v.vertrekboot].join(' '), doe: () => snelzoekNaarTab('haven') });
  });
  return items;
}

/* Wat er getypt staat naar treffers. Voorvoegsel (en/of cijfers): de bak moet bij
   die familie horen en zijn nummer moet met die cijfers beginnen. Letters die geen
   voorvoegsel zijn (een naam, een schip): gewoon in de tekst zoeken. */
function snelzoekTreffers(index, invoer){
  const v = invoer.trim();
  if(!v) return [];
  const m = v.toUpperCase().match(/^([A-Z]*)\s*(\d*)$/);
  if(m && (!m[1] || snelzoekIsFamilie(m[1]))){
    const fams = m[1] ? snelzoekFamilies(m[1]) : null, cijfers = m[2];
    return index.filter(it => it.groep === 'Bakken' && it.num && it.num.startsWith(cijfers) && (!fams || it.fam.some(f => fams.includes(f))))
      .sort((a, b) => (b.num === cijfers) - (a.num === cijfers) || a.num.length - b.num.length || (+a.num) - (+b.num));
  }
  const vraag = snelzoekNorm(v);
  const bakEerst = it => it.groep === 'Bakken' ? 0 : 1;
  return index.filter(it => snelzoekNorm(it.zoek + ' ' + it.wat).includes(vraag))
    .sort((a, b) => (snelzoekNorm(b.wat).startsWith(vraag) - snelzoekNorm(a.wat).startsWith(vraag)) || bakEerst(a) - bakEerst(b));
}

function snelzoekNaarTab(tab){ gaNaar(tab); }

function snelzoekNaarTegel(tripId){
  stationKeuze.clear();
  if(currentTab !== 'planlijst') snelzoekNaarTab('planlijst'); else render();
  requestAnimationFrame(() => {
    const kaart = document.querySelector(`.card[data-id="${CSS.escape(tripId)}"]`);
    if(!kaart) return;
    kaart.scrollIntoView({ block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    kaart.classList.remove('zoek-flits'); void kaart.offsetWidth; kaart.classList.add('zoek-flits');
    setTimeout(() => kaart.classList.remove('zoek-flits'), 1800);
  });
}

function snelzoekMarkeer(tekst, vraag){
  const t = String(tekst || '');
  if(!vraag) return esc(t);
  // Treffer op genormaliseerde tekens terugvinden in de echte tekst.
  const plat = [], pos = [];
  for(let i = 0; i < t.length; i++){ if(!/[\s._-]/.test(t[i])){ plat.push(t[i].toLowerCase()); pos.push(i); } }
  const at = plat.join('').indexOf(vraag);
  if(at < 0) return esc(t);
  const van = pos[at], tot = pos[at + vraag.length - 1] + 1;
  return esc(t.slice(0, van)) + '<mark>' + esc(t.slice(van, tot)) + '</mark>' + esc(t.slice(tot));
}

function openSnelzoeken(){
  closeModal();
  const index = snelzoekIndex();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop snelzoek-backdrop';
  bd.id = 'modalBackdrop';
  bd.setAttribute('aria-label', 'Bak zoeken');
  bd.innerHTML = `<div class="snelzoek">
      <div class="snelzoek-veld">
        <input type="text" id="snelzoekInvoer" inputmode="none" placeholder="bijv. ESP 480" autocomplete="off" spellcheck="false" aria-controls="snelzoekLijst" aria-label="Baknaam of nummer">
        <button type="button" class="snelzoek-klein" id="snelzoekAbc" aria-pressed="false" title="Letterstoetsenbord voor namen en schepen">ABC</button>
        <button type="button" class="snelzoek-klein" id="snelzoekWis" title="Veld leegmaken">Wis</button>
        <button type="button" class="snelzoek-sluit" aria-label="Sluiten">Sluit</button></div>
      <div class="snelzoek-lijst" id="snelzoekLijst" role="listbox" aria-label="Gevonden bakken"></div>
      <div class="snelzoek-toetsen">
        <div class="snelzoek-voor" role="group" aria-label="Voorvoegsel">${SNELZOEK_VOOR.map(([naam, fam]) =>
          `<button type="button" class="snelzoek-toets" data-voor="${fam}" data-naam="${naam}" aria-pressed="false">${naam}</button>`).join('')}</div>
        <div class="snelzoek-num" role="group" aria-label="Cijfers">${['1','2','3','4','5','6','7','8','9','⌫','0','↵'].map(t =>
          `<button type="button" class="snelzoek-toets${t === '↵' ? ' ok' : ''}" data-toets="${t}" aria-label="${t === '⌫' ? 'Wis laatste teken' : t === '↵' ? 'Open de bovenste bak' : t}">${t}</button>`).join('')}</div>
      </div>
      ${snelzoekLetterToetsenbordHtml()}
      <div class="snelzoek-voet"><span>Voorvoegsel nog een keer aantikken haalt het weg</span><span><span class="kbd">↵</span> opent de bovenste</span><span><span class="kbd">Esc</span> sluit</span></div>
    </div>`;
  toonModal(bd);
  const invoer = bd.querySelector('#snelzoekInvoer');
  const lijst = bd.querySelector('#snelzoekLijst');
  let treffers = [], gekozen = 0;
  const MAX = 4;
  const leesVoorvoegsel = () => {
    const m = invoer.value.trim().toUpperCase().match(/^([A-Z]*)\s*(\d*)$/);
    return m && (!m[1] || snelzoekIsFamilie(m[1])) ? { fams: m[1] ? snelzoekFamilies(m[1]) : [], cijfers: m[2] } : { fams: [], cijfers: '' };
  };
  const teken = () => {
    treffers = snelzoekTreffers(index, invoer.value);
    if(gekozen >= Math.min(treffers.length, MAX)) gekozen = 0;
    const vraag = snelzoekNorm(invoer.value);
    if(!vraag) lijst.innerHTML = '<div class="snelzoek-leeg">Kies een voorvoegsel en tik het nummer.</div>';
    else if(!treffers.length) lijst.innerHTML = `<div class="snelzoek-leeg">Geen bak gevonden voor “${esc(invoer.value.trim())}”.</div>`;
    else {
      lijst.innerHTML = treffers.slice(0, MAX).map((it, i) => `<button type="button" class="snelzoek-regel" role="option" data-i="${i}" aria-selected="${i === gekozen}">
          <span class="wat">${snelzoekMarkeer(it.wat, vraag)}</span><span class="tekst">${esc(it.tekst)}</span><span class="waar">${esc(it.waar)}</span></button>`).join('')
        + (treffers.length > MAX ? `<div class="snelzoek-meer">nog ${treffers.length - MAX} meer, tik nog een cijfer om te verfijnen</div>` : '');
      lijst.querySelectorAll('.snelzoek-regel').forEach(b => b.addEventListener('click', () => kies(+b.dataset.i)));
    }
    const { fams } = leesVoorvoegsel();
    bd.querySelectorAll('[data-voor]').forEach(b => b.setAttribute('aria-pressed', String(fams.includes(b.dataset.voor))));
  };
  const kies = i => { const it = treffers[i]; if(!it) return; closeModal(); it.doe(); };
  const wijzig = () => { gekozen = 0; teken(); };
  bd.querySelectorAll('[data-voor]').forEach(b => b.addEventListener('click', () => {
    const { fams, cijfers } = leesVoorvoegsel();
    invoer.value = fams.includes(b.dataset.voor) ? cijfers : b.dataset.naam + ' ' + cijfers;   // nog een keer aantikken haalt het weg
    wijzig();
  }));
  bd.querySelectorAll('[data-toets]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.toets;
    if(t === '⌫') invoer.value = invoer.value.slice(0, -1).replace(/\s+$/, '');
    else if(t === '↵') return kies(gekozen);
    else invoer.value += /[A-Za-z]$/.test(invoer.value) ? ' ' + t : t;
    wijzig();
  }));
  bd.querySelector('#snelzoekWis').addEventListener('click', () => { invoer.value = ''; wijzig(); invoer.focus(); });
  // ABC wisselt het eigen keypad tussen cijfer-modus (voorvoegsel+cijfers) en
  // letter-modus (QWERTY). inputmode blijft "none": het tablet-toetsenbord komt
  // dus nooit op (en dekt de lijst nooit af); een fysiek toetsenbord typt gewoon
  // rechtstreeks in het veld, want inputmode blokkeert hardware-toetsen niet.
  const paneel = bd.querySelector('.snelzoek');
  bd.querySelector('#snelzoekAbc').addEventListener('click', e => {
    const aan = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(aan));
    paneel.classList.toggle('abc-aan', aan);
    invoer.focus();
  });
  // Letters uit het eigen toetsenbord: rauw toevoegen (geen spatie-logica zoals
  // bij de voorvoegsel+cijfer-toetsen — een naam mag gewoon aaneen).
  bd.querySelectorAll('[data-letter]').forEach(b => b.addEventListener('click', () => {
    invoer.value += b.dataset.letter;
    wijzig();
  }));
  // De ⌫ en ↵ van het letter-toetsenbord: eigen attribuut (niet data-toets),
  // zodat het cijfer-keypad de enige ⌫/↵ houdt en selectors eenduidig blijven.
  bd.querySelectorAll('[data-letter-ctrl]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.letterCtrl === 'back'){ invoer.value = invoer.value.slice(0, -1); wijzig(); }
    else kies(gekozen);
  }));
  invoer.addEventListener('input', wijzig);
  invoer.addEventListener('keydown', e => {
    const n = Math.min(treffers.length, MAX);
    if(e.key === 'ArrowDown'){ gekozen = Math.max(0, Math.min(n - 1, gekozen + 1)); teken(); e.preventDefault(); }
    else if(e.key === 'ArrowUp'){ gekozen = Math.max(0, gekozen - 1); teken(); e.preventDefault(); }
    else if(e.key === 'Enter'){ kies(gekozen); e.preventDefault(); }
  });
  bd.querySelector('.snelzoek-sluit').addEventListener('click', closeModal);
  bd.addEventListener('click', e => { if(e.target === bd) closeModal(); });
  teken();
  invoer.focus();
}

document.addEventListener('keydown', e => {
  const inVeld = e.target && (e.target.closest?.('input, textarea, select, [contenteditable="true"]'));
  const ctrlK = (e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K');
  if(ctrlK || (e.key === '/' && !inVeld && !document.getElementById('modalBackdrop'))){
    e.preventDefault();
    if(document.querySelector('.snelzoek-backdrop')) return;
    openSnelzoeken();
  }
});
document.getElementById('zoekKnop')?.addEventListener('click', openSnelzoeken);

</script>

<script>
/* Auteur: HvdB */
/* ---------------------------------------------------------------
   SWIPE
--------------------------------------------------------------- */
async function restoreTripFromHistory(trip){
  await logAction(`Rit teruggezet naar Actief: ${trip.schubboot||'?'} (${trip.station||'?'})`);
  trip.status = 'actief';
  trip.completedAt = null;
  // De vlag telt alleen zolang de rit afgerond is; als actieve rit tellen de
  // bakken sowieso mee.
  delete trip.bakkenInHaven;
  saveTrips();
  render();
}

// Swipe van rechts naar links op een historie-item om 'm terug te zetten naar Actief.
function attachHistSwipe(item, wrap, trip){
  let startX=0, startY=0, dx=0, dragging=false, locked=null, aanwijzer=null;
  const bgEl = wrap.querySelector('.hist-bg-restore');

  function onDown(e){
    if(e.target.tagName === 'TEXTAREA' || e.target.classList.contains('hist-restore')) return;
    if(aanwijzer !== null && item.hasPointerCapture(aanwijzer)) return;
    aanwijzer = e.pointerId;
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; locked = null;
    item.classList.add('dragging');
    pakGreep(item, e.pointerId);
  }
  function onMove(e){
    if(!dragging || e.pointerId !== aanwijzer) return;
    const ddx = e.clientX - startX;
    const ddy = e.clientY - startY;
    if(locked === null){
      locked = Math.abs(ddx) > Math.abs(ddy) + 4 ? 'x' : (Math.abs(ddy) > 4 ? 'y' : null);
    }
    if(locked === 'y'){
      dragging = false; item.classList.remove('dragging');
      laatGreepLos(item, aanwijzer); aanwijzer = null;
      return;
    }
    if(locked === 'x'){
      if(e.cancelable) e.preventDefault();
      dx = Math.min(0, ddx); // alleen naar links toestaan
      if(bgEl) bgEl.style.opacity = dx < 0 ? '1' : '0';
      item.style.transform = `translateX(${dx}px)`;
      item.style.opacity = String(1 - Math.min(Math.abs(dx) / 300, 0.5));
    }
  }
  function onUp(e){
    if(e.pointerId !== aanwijzer) return;
    aanwijzer = null;
    if(!dragging) return;
    dragging = false;
    item.classList.remove('dragging');
    const threshold = Math.min(140, item.offsetWidth * 0.35);
    if(Math.abs(dx) > threshold){
      item.style.transform = `translateX(-110%)`;
      item.style.opacity = '0';
      setTimeout(() => restoreTripFromHistory(trip), 180);
    } else {
      item.style.transform = 'translateX(0)';
      item.style.opacity = '';
      if(bgEl) bgEl.style.opacity = '';
    }
  }

  // Zie attachSwipe: alleen pointer-events, en op het element zelf.
  item.addEventListener('pointerdown', onDown);
  item.addEventListener('pointermove', onMove);
  item.addEventListener('pointerup', onUp);
  item.addEventListener('pointercancel', onUp);
}

function attachSwipe(card, wrap, trip){
  let startX=0, startY=0, dx=0, dragging=false, locked=null, tapTimer=null, aanwijzer=null;
  const bgEl = wrap.querySelector('.card-bg');

  function onDown(e){
    if(e.target.tagName === 'TEXTAREA') return;
    if(e.button != null && e.button !== 0) return;   // alleen de linkerknop
    /* Ligt er al een vinger op deze tegel én heeft die de greep nog echt, dan
       is dit een tweede vinger: negeren, anders neemt een duim die er per
       ongeluk bijkomt het gebaar over. Is de greep wél weg zonder dat er ooit
       een pointerup kwam, dan is de stand blijven hangen — zonder deze uitweg
       zou de tegel daarna voorgoed niet meer reageren. */
    if(aanwijzer !== null && card.hasPointerCapture(aanwijzer)) return;
    aanwijzer = e.pointerId;
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; locked = null;
    card.classList.add('dragging');
    card.classList.remove('settle');
    pakGreep(card, e.pointerId);
  }
  function onMove(e){
    if(!dragging || e.pointerId !== aanwijzer) return;
    const ddx = e.clientX - startX;
    const ddy = e.clientY - startY;
    if(locked === null){
      locked = Math.abs(ddx) > Math.abs(ddy) + 4 ? 'x' : (Math.abs(ddy) > 4 ? 'y' : null);
    }
    if(locked === 'y'){
      // Verticaal is scrollen, niet swipen. Greep meteen teruggeven, anders
      // blijft deze tegel tot het loslaten alle aanwijsberichten opslokken.
      dragging = false;
      card.classList.remove('dragging');
      laatGreepLos(card, aanwijzer);
      aanwijzer = null;
      return;
    }
    if(locked === 'x'){
      if(e.cancelable) e.preventDefault();
      if(bgEl) bgEl.style.opacity = '1';
      dx = Math.max(0, ddx); // only allow right swipe
      card.style.transform = `translateX(${dx}px)`;
      card.style.opacity = String(1 - Math.min(dx / 300, 0.5));
    }
  }
  function onUp(e){
    if(e.pointerId !== aanwijzer) return;
    aanwijzer = null;
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    card.classList.add('settle');
    if(locked === null){
      // geen beweging: dit was een tik, geen swipe
      card.style.transform = 'translateX(0)';
      card.style.opacity = '';
      if(tapTimer){
        // tweede tik binnen het venster -> dubbeltik
        clearTimeout(tapTimer);
        tapTimer = null;
        toggleKlaarOmTeLaden(trip, card);
      } else {
        tapTimer = setTimeout(() => {
          tapTimer = null;
          toggleAangemeerd(trip, card);
        }, 280);
      }
      return;
    }
    const threshold = Math.min(140, card.offsetWidth * 0.35);
    if(dx > threshold){
      card.style.transform = `translateX(110%)`;
      card.style.opacity = '0';
      setTimeout(() => completeTrip(trip), 180);
    } else {
      card.style.transform = 'translateX(0)';
      card.style.opacity = '';
      if(bgEl) bgEl.style.opacity = '';
    }
  }

  /* Alleen pointer-events (muis + aanraking naast elkaar laat op een tablet
     één tik dubbel binnenkomen = ongewild "klaar om te laden"), en ze staan op
     de tegel i.p.v. window — via setPointerCapture (zie pakGreep) — zodat ze
     met de tegel verdwijnen en window niet volloopt met dode handlers die de
     app door de dag heen traag maken. Zie docs/NOTITIES.md — Sleeptegel. */
  card.addEventListener('pointerdown', onDown);
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerup', onUp);
  card.addEventListener('pointercancel', onUp);
}

/* Tegel -> haven.
   Eerder schreven deze functies een eigen veld `plek` (en overschreven ze
   `setKey`) op de VH/HGK-lijst. De haventekening leest die velden niet: die
   werkt met zones uit HAVEN_LAYOUT en met havenPosities. Het effect was dus
   nul, terwijl de opgeslagen lijsten wél vervuild raakten. Nu gaat het via
   havenVerplaatsBakken(), dezelfde weg als slepen — inclusief het behouden
   van de onderlinge ligging binnen een eenheid. */

// Alle bakken die met deze tegel meekomen. Een aankomstset kan bakken voor
// meerdere tegels bevatten; die horen bij elkaar te blijven, dus we nemen de
// volledige set(s) waar de bakken van deze tegel in zitten.
/* De bakken die op deze tegel staan — en alleen die.

   Dit pakte eerder de hele kleurset erbij: stond er één bak op de tegel en
   hoorden er in de VH/HGK-lijst nog drie bij, dan verhuisden die drie mee
   naar de laadlengte. Dat is niet wat een tegel zegt. Een tegel gaat over
   wat er bij die binnenbelader geladen wordt; de rest van de set kan best
   blijven liggen waar hij ligt. Op een laadlengte mág een set immers
   gesplitst zijn — dat gebeurt in het echt ook.

   Op een bakkenplaats blijven losse delen van eenzelfde set daarna ook
   gewoon liggen waar ze liggen — samenvoegen gebeurt niet vanzelf, dat doet
   de gebruiker zelf door een tegel te verslepen. (Tot en met v1.174 deed
   havenHergroepeerSetsOpBakkenplaats() dat automatisch; Herman meldde dat
   dit ongevraagd andere bakken verplaatste die toevallig dezelfde setKey
   hadden, en wilde geen enkele automatische verplaatsing meer.) */
function havenBakkenVanTegel(trip){
  return havenBakken().filter(b => b.tripId === trip.id).map(b => b.naam);
}

/* Welke laadlengte hoort bij deze kolom? De markeringen liggen twee
   baklengtes uit elkaar; alles daarbuiten valt onder de dichtstbijzijnde. Zo
   houdt een set van zes, die over twee lengtes heen loopt, toch één naam — die
   van de lengte waar hij begint. */
function havenLengteVoorKolom(zone, kol){
  if(!zone || !zone.lengtes || !zone.lengtes.length) return null;
  let beste = zone.lengtes[0], besteAfstand = Infinity;
  zone.lengtes.forEach(l => {
    if(kol >= l.vanKolom && kol < l.vanKolom + l.kolommen){ beste = l; besteAfstand = -1; return; }
    if(besteAfstand === -1) return;
    const afstand = kol < l.vanKolom ? l.vanKolom - kol : kol - (l.vanKolom + l.kolommen - 1);
    if(afstand < besteAfstand){ besteAfstand = afstand; beste = l; }
  });
  return beste;
}

/* Welke machines kunnen bij deze kolom? B2 en B3 overlappen in het midden.

   Het bereik staat in kolommen van het raster. Dat stond eerder in hele
   baklengtes en werd hier omgerekend, maar sinds het gat tussen twee
   laadlengtes zelf een kolom is loopt die omrekening niet meer gelijk op
   met de kade. */
function havenMachinesVoorKolom(zone, kol){
  return (zone.machines || [])
    .filter(m => kol >= m.vanKolom && kol <= m.totKolom)
    .map(m => m.station);
}

/* De laadlengte die op de tegel staat, vertaald naar een plek op de kade.
   Levert de kade én de kolom waar die lengte begint — de kade is nu één
   doorlopende strook, dus alleen de zone is niet genoeg meer. */
function havenLaadlengteZoneVoorTegel(trip){
  const m = String(trip.liegeplaats || '').match(/(\d)/);
  if(!m) return null;
  const nummer = Number(m[1]);

  const kades = HAVEN_LAYOUT.zones.filter(z => z.type === 'kade' &&
    (z.lengtes || []).some(l => l.nummer === nummer));
  if(!kades.length) return null;

  // De kade waar de binnenbelader van deze tegel bij kan. Een reservemachine
  // (MB1) telt niet mee in z.stations, dus die vinden we via zijn bereik.
  const binnenBereik = z => {
    const l = (z.lengtes || []).find(x => x.nummer === nummer);
    return !!l && (z.machines || []).some(mc => mc.station === trip.station &&
      mc.vanKolom <= l.vanKolom + l.kolommen - 1 && mc.totKolom >= l.vanKolom);
  };
  const zone = kades.find(binnenBereik)
    || kades.find(z => (z.stations || []).includes(trip.station)) || kades[0];
  const lengte = (zone.lengtes || []).find(l => l.nummer === nummer);
  if(!lengte) return null;

  const slot = havenZoneSlots(zone).find(s => s.rij === 0 && s.kol === lengte.vanKolom);
  // vanKolom telt al in halve kolommen, dus dit is meteen de juiste plek
  return { zone, startSlot: slot ? slot.index : undefined };
}


async function toggleAangemeerd(trip, card){
  await logAction(`Aanwezig ${!trip.aangemeerd?'aan':'uit'}gezet: ${trip.schubboot||'?'} (${trip.station||'?'})`);
  trip.aangemeerd = !trip.aangemeerd;
  card.classList.toggle('aangemeerd', trip.aangemeerd);

  // Aanwezig zetten haalt de set uit Onderweg naar de lege bakkenplaats.
  // De bakken bestaan pas in havenBakken() nadat aangemeerd aan staat, dus
  // dit moet ná het omzetten van de vlag.
  if(trip.aangemeerd){
    /* Weer aanwezig betekent ook: de vertrokken-stand vervalt. Anders bleven
       bakken die eerder met hun boot zijn meegegaan onzichtbaar terwijl de
       tegel zegt dat ze er zijn. */
    let terug = false;
    trip.rows.forEach(r => {
      if(r.leichter && havenIsVertrokken(r.leichter)){
        delete havenPosities[normalizeBargeName(r.leichter)];
        terug = true;
      }
    });
    if(terug) await saveHavenPosities();
    const namen = havenBakkenVanTegel(trip);
    if(namen.length) await havenVerplaatsBakken(namen, 'leeg', undefined, false, null);
  }

  await saveTrips();
  render();
}

function laadlengteOpties(trip){
  const opties = ['1e lengte','2e lengte','3e lengte','4e lengte'];
  if(trip.liegeplaats && !opties.includes(trip.liegeplaats)) opties.push(trip.liegeplaats);
  return opties;
}

// Stond eerder in de change-handler van de keuzelijst. Nu apart, zodat de
// keuzemodal en eventuele latere aanroepers dezelfde weg volgen.
async function zetLaadlengte(trip, waarde){
  if(!waarde || waarde === trip.liegeplaats) return;
  await logAction(`Laadlengte gewijzigd: ${trip.liegeplaats||'?'} → ${waarde} (${trip.schubboot||'?'})`);
  trip.liegeplaats = waarde;

  // Ligt de set al op een laadlengte, dan verhuist hij mee naar de nieuwe.
  // Strikt: past hij daar niet precies, dan blijft hij liggen waar hij lag —
  // niet ergens anders op de kade, zie de toelichting bij toggleKlaarOmTeLaden.
  if(trip.klaarOmTeLaden && trip.aangemeerd){
    const plek = havenLaadlengteZoneVoorTegel(trip);
    const namen = havenBakkenVanTegel(trip);
    if(plek && namen.length){
      const gelukt = await havenVerplaatsBakken(namen, plek.zone.id, plek.startSlot, false, null, true);
      if(!gelukt){
        showToast(`De set past niet op ${trip.liegeplaats || havenZoneNaam(plek.zone.id)} — daar liggen al bakken. De bakken blijven liggen waar ze lagen.`);
      }
    }
  }

  await saveTrips();
  render();
}


/* `melding` vult een regel bovenaan de keuze — gebruikt als de gekozen
   laadlengte al vol bleek: dan hoef je de knop niet eerst ingedrukt te houden
   om een andere te kiezen, maar staat de keuze meteen open. Bezette lengtes
   krijgen er "vol" bij te staan, zodat je niet nog een keer misgrijpt. */
function openLaadlengteModal(trip, melding){
  closeModal();
  const huidige = trip.liegeplaats || '';
  const namen = havenBakkenVanTegel(trip);
  const past = (lengte) => {
    if(!namen.length) return true;
    const plek = havenLaadlengteZoneVoorTegel({ ...trip, liegeplaats: lengte });
    if(!plek) return true;
    return !!havenZoekPlaats(namen, plek.zone.id, plek.startSlot, false, true);
  };
  const itemsHtml = laadlengteOpties(trip).map(l => {
    const vrij = past(l);
    return `
      <button type="button" class="group-pick-item" data-waarde="${esc(l)}"${l === huidige ? ' aria-current="true" style="background:var(--surface-2);"' : ''}>
        <span>${esc(l)}</span>${l === huidige ? '<span class="lengte-huidig">nu</span>'
          : (vrij ? '' : '<span class="lengte-huidig" style="color:var(--danger);">vol</span>')}
      </button>`;
  }).join('');

  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'modalBackdrop';
  bd.innerHTML = `<div class="modal modal-smal">
      <h2>Laadlengte</h2>
      <div class="sub">${esc(trip.station || '')}${trip.schubboot ? ' · ' + esc(trip.schubboot) : ''}</div>
      ${melding ? `<div class="sub" style="color:var(--danger);margin-top:6px;">${esc(melding)}</div>` : ''}
      ${itemsHtml}
      <div class="modal-actions">
        <button class="btn btn-secondary" id="lengteAnnuleer">Annuleren</button>
      </div>
    </div>`;
  toonModal(bd);

  bd.querySelector('#lengteAnnuleer').addEventListener('click', closeModal);
  bd.addEventListener('click', e => { if(e.target === bd) closeModal(); });
  bd.querySelectorAll('.group-pick-item').forEach(el => {
    el.addEventListener('click', async () => {
      const waarde = el.dataset.waarde;
      closeModal();
      await zetLaadlengte(trip, waarde);
    });
  });
}

async function toggleKlaarOmTeLaden(trip, card){
  await logAction(`Klaar om te laden ${!trip.klaarOmTeLaden?'aan':'uit'}gezet: ${trip.schubboot||'?'} (${trip.station||'?'})`);
  let volleLengte = null;
  trip.klaarOmTeLaden = !trip.klaarOmTeLaden;
  card.classList.toggle('klaar-laden', trip.klaarOmTeLaden);

  // Klaar om te laden brengt de set naar de laadlengte die op de tegel staat.
  if(trip.klaarOmTeLaden){
    // Een tegel die nog niet aanwezig staat heeft nog geen bakken in de haven.
    if(!trip.aangemeerd){
      trip.aangemeerd = true;
      card.classList.add('aangemeerd');
    }
    const plek = havenLaadlengteZoneVoorTegel(trip);
    const namen = havenBakkenVanTegel(trip);
    if(!plek){
      showToast('Geen laadlengte gekozen op deze tegel — de bakken blijven staan waar ze staan.');
    } else if(namen.length){
      /* Strikt: precies op de aangewezen plek, of niet. Zonder strikt zocht
         havenZoekPlaats bij een bezette laadlengte zelf een vrije plek
         verderop — en dan lag de set opeens op een heel andere lengte dan
         waar de knop op stond, zonder dat er iets fout leek te gaan. Past hij
         niet, dan blijft hij liggen waar hij lag (havenVerplaatsBakken
         schrijft bij een mislukte strikte poging niets weg) en zegt de toast
         hieronder waarom. */
      const gelukt = await havenVerplaatsBakken(namen, plek.zone.id, plek.startSlot, false, null, true);
      if(!gelukt){
        /* Vol: meteen de keuze openzetten in plaats van alleen melden. Anders
           moest je de melding lezen, de knop ingedrukt houden en dan pas een
           andere lengte kiezen — drie handelingen voor iets wat je toch al
           wilde. De bakken blijven ondertussen liggen waar ze lagen. */
        volleLengte = `${trip.liegeplaats || havenZoneNaam(plek.zone.id)} is al bezet — kies een andere laadlengte.`;
      }
    }
  }

  await saveTrips();
  render();
  if(volleLengte) openLaadlengteModal(trip, volleLengte);
  if(trip.klaarOmTeLaden){
    const bakkenInReparatie = trip.rows.filter(r => r.bakStatus === 'repareren' && r.leichter);
    if(bakkenInReparatie.length){
      const namen = [...new Set(bakkenInReparatie.map(r => r.leichter))].join(', ');
      showToast(`Let op: ${namen} staat nog op "moet repareren"`);
    }
  }
}

let vhGroupColorMap = new Map();
// Sets waarvan de kleur nog voorlopig is (zonder afstandscontrole vastgelegd
// omdat ze nog nergens te zien waren). Worden alsnog door kiesGroepKleur zodra
// ze zichtbaar worden — zie rebuildVhGroupColors. (1.207)
let vhGroepVoorlopig = new Set();

function bakGroupKey(entry, source){
  // kleur van de bak-cel is leidend voor "welke bakken vertrekken samen" —
  // dat kan afwijken van het tekstuele blok waarin de bak toevallig
  // vermeld staat (bijv. 4 aangekomen bakken waarvan er 2 met een andere
  // boot vertrekken dan de andere 2). Alleen als er geen kleur is,
  // vallen we terug op schip + tijd van het blok.
  //
  // groepKleur is de kleur die een bak zónder eigen kleurcel van zijn blok
  // heeft meegekregen (vulGroepKleurenAan). Die telt hier wél mee — hij hoort
  // bij de set — maar staat met opzet niet in `kleur`, want zo'n bak vaart niet
  // mee en hoort die kleur dus niet te krijgen. Zie 1.208.
  //
  // En de kleur alléén is niet genoeg (1.209): kleur je twee vertrekmomenten in
  // de sheet allebei lichtgroen, dan zag de app dat als één set — volgens Herman
  // dagelijks. Vertrekboot + vertrektijd komt nooit dubbel voor en maakt de set
  // écht uniek; die gaat erachteraan. Is de vertrekboot nog niet bekend, dan
  // blijft het gedrag zoals het was (niets om op te splitsen).
  const kleur = entry.kleur || entry.groepKleur;
  const vertrek = vertrekSleutel(entry);
  if(kleur) return source + '|K|' + kleur + (vertrek ? '|' + vertrek : '');
  return source + '|' + normalizeBargeName(entry.vertrekboot || entry.schip || '')
       + '|' + (entry.vertrektijd || entry.tijd || '');
}

/* Welke bakken vormen samen één tegel — los van welke kleur ze hebben.

   bakGroupKey() hierboven gaat over vertrekken: welke bakken gaan straks met
   dezelfde boot mee. Dat is iets anders dan wat er als één geheel op een
   plaats ligt. Een aankomstset kan meerdere kleuren bevatten (Herman's
   voorbeeld: HK 8 brengt vier bakken met drie kleuren), en die hoort als één
   tegel te blijven — in Onderweg, op de lege plaats én op de laadlengte.

   Onderweg deed dat altijd al goed (aankomstschip + tijd), maar de
   bakkenplaatsen groepeerden op kleur. Een meerkleurige set viel daardoor
   gegarandeerd uiteen zodra hij binnenkwam: dezelfde bakken, maar ineens drie
   tegels. Vandaar deze gedeelde sleutel — beide kanten rekenen hem nu op
   exact dezelfde manier uit. */
function havenTegelSleutel(schip, tijd){
  return `${schip || '?'}-${tijd || 'onbekend'}`;
}

let bargeLocationMap = new Map();
function rebuildBargeLocationMap(){
  // De bakindex hangt aan dezelfde gegevens en vervalt dus op hetzelfde moment.
  markeerBakIndexVerouderd();
  bargeLocationMap = new Map();
  trips.filter(t => t.status === 'actief').forEach(t => {
    t.rows.forEach(r => {
      if(r.leichter && r.leichter.trim()){
        bargeLocationMap.set(normalizeBargeName(r.leichter), t.station || '?');
      }
    });
  });
}
function findBargeLocation(name){
  const exact = bargeLocationMap.get(normalizeBargeName(name));
  if(exact) return exact;
  for(const [naam, station] of bargeLocationMap.entries()){
    if(bargeNamesMatch(naam, name)) return station;
  }
  return null;
}

// Standaard Office-thema kleuren (index 0-9). Nodig omdat Excel sommige
// kleuren (vaak grijstinten, bijv. "Wit, Achtergrond 1, Donkerder 25%")
// opslaat als een thema-index + een verdonkerings-/verlichtingspercentage
// (tint), niet als een directe kleurcode — zonder deze vertaling worden
// zulke bakken onterecht als "geen kleur" (dus "in reparatie") gezien.
const OFFICE_THEME_COLORS = ['FFFFFF','000000','E7E6E6','44546A','4472C4','ED7D31','A5A5A5','FFC000','5B9BD5','70AD47'];

function applyExcelTint(hex, tint){
  if(!tint) return hex;
  const r = parseInt(hex.slice(0,2),16) / 255;
  const g = parseInt(hex.slice(2,4),16) / 255;
  const b = parseInt(hex.slice(4,6),16) / 255;
  const adjust = c => tint < 0 ? c * (1 + tint) : c * (1 - tint) + tint;
  const toHex = v => Math.max(0, Math.min(255, Math.round(v * 255))).toString(16).padStart(2, '0');
  return (toHex(adjust(r)) + toHex(adjust(g)) + toHex(adjust(b))).toUpperCase();
}

// Robuuste vulkleur van een Excel-cel: pakt de directe kleurcode als die er
// is, en vertaalt anders een thema-kleur (met tint) naar een echte hex-kleur
// — zodat geen enkele kleurvariant (ook niet grijs) gemist wordt.
function resolveCellFillHex(cellStyle){
  if(!cellStyle || cellStyle.patternType !== 'solid' || !cellStyle.fgColor) return null;
  const fg = cellStyle.fgColor;
  if(fg.rgb) return fg.rgb.length === 8 ? fg.rgb.slice(2) : fg.rgb; // ARGB -> RGB indien nodig
  if(fg.theme !== undefined && fg.theme !== null){
    const base = OFFICE_THEME_COLORS[fg.theme] || 'FFFFFF';
    return applyExcelTint(base, fg.tint || 0);
  }
  return null;
}

function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

// Zachte, per-B-machine achtergrondtint op de tegel zelf — dezelfde
// donkerte/verzadiging als de standaardachtergrond, alleen de tint
// (hue) verschilt per binnenbelader, zodat de tekst overal even goed
// leesbaar blijft.
let stationColorMap = new Map();
function rebuildStationColors(){
  stationColorMap = new Map();
  // De reservemachine MB1 heeft een vaste eigen tint, zodat B2/B3/B4 hun kleur
  // houden wanneer hij erbij komt.
  const stations = getKnownStations().filter(s => s !== 'MB1');
  stations.forEach((s, i) => {
    const hue = stations.length > 1 ? (i * 360 / stations.length) % 360 : 0;
    stationColorMap.set(s, hue);
  });
  stationColorMap.set('MB1', 60);
}
function stationAccentColor(station){
  if(!station) return null;
  const hue = stationColorMap.has(station) ? stationColorMap.get(station) : 0;
  // Gedempte verzadiging (was 65) zodat de machinekleuren rustiger zijn om naar
  // te kijken; lichtheid iets lager zodat witte tekst erop leesbaar blijft.
  return hslToHex(hue, 42 * pastelFactor, 47);
}

function hexNaarHsl(hex){
  const h = String(hex).replace(/^#/, '');
  const vol = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(vol.slice(0,2),16)/255, g = parseInt(vol.slice(2,4),16)/255, b = parseInt(vol.slice(4,6),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  const l = (max + min) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2*l - 1));
  let t = 0;
  if(d !== 0){
    if(max === r)      t = ((g - b) / d) % 6;
    else if(max === g) t = (b - r) / d + 2;
    else               t = (r - g) / d + 4;
  }
  return { h: ((t * 60) % 360 + 360) % 360, s: s * 100, l: l * 100 };
}

/* De kleur van een vertrekset is de kleur die de bak in de VH/HGK-sheet heeft.

   Daar is die kleur al de betekenisdrager: bakken met dezelfde vulkleur
   vertrekken samen, en daar is de groepering ook op gebouwd. De Onderweg-kolom
   liet hem ook al zo zien. De haven en de planlijst maakten er hun eigen palet
   van, en dan veranderde een bak van kleur op het moment dat hij binnenkwam —
   precies waar je hem wilt blijven volgen.

   Alleen de helderheid wordt bijgetrokken, en pas als het echt nodig is: een
   bleekgele vulling verdwijnt anders in de lichte modus en een donkerblauwe in
   de donkere. De tint blijft altijd staan, dus geel blijft geel. */
/* Hoe licht oogt deze kleur werkelijk? (WCAG relatieve luminantie, 0–1.)

   Dit is niet hetzelfde als de L uit HSL, en dáár ging het mis. #FFFF00 en
   #4363D8 hebben allebei een HSL-lightness rond de 50 — keurig binnen de band
   die setKleurVoorThema hanteerde, dus allebei bleven ze ongemoeid. In het echt
   is geel 0,93 en dat blauw 0,15: zes keer zo licht. Daardoor schreeuwde één
   set over alle andere heen terwijl de code dacht dat hij genivelleerd had. */
function relLuminantie(hex){
  const h = String(hex).replace(/^#/, '');
  const vol = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const [r, g, b] = [0, 2, 4].map(i => {
    const v = parseInt(vol.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

/* Trek de helderheid naar een band, zonder de tint of de verzadiging aan te
   raken — precies wat setKleurVoorThema altijd al beloofde. Omdat de weg van
   HSL-lightness naar echte luminantie per tint verschilt, is er geen formule
   voor: we zoeken de lightness die de gewenste luminantie oplevert. Twintig
   halveringen brengt dat tot ruim onder een tiende procent, en dat is per
   hertekening een handvol microseconden. */
function naarLuminantieBand(hex, min, max){
  const { h, s, l } = hexNaarHsl(hex);
  const nu = relLuminantie(hex);
  if(nu >= min && nu <= max) return hex;
  const doel = nu > max ? max : min;
  let laag = 0, hoog = 100, beste = hex;
  for(let i = 0; i < 20; i++){
    const mid = (laag + hoog) / 2;
    const kandidaat = hslToHex(h, s, mid);
    const lum = relLuminantie(kandidaat);
    beste = kandidaat;
    if(Math.abs(lum - doel) < 0.001) break;
    if(lum > doel) hoog = mid; else laag = mid;
  }
  return beste;
}

/* De banden. Op een donkere ondergrond moet een set opvallen zonder te
   schreeuwen; op een lichte moet hij donker genoeg zijn om als vlak te lezen.
   De marges zijn ruim — het gaat erom de uitschieters binnen te halen, niet om
   alle sets even licht te maken: dan zou je ze juist niet meer uit elkaar
   houden. */
const SETLUM_DONKER = { min: 0.14, max: 0.46 };
const SETLUM_LICHT  = { min: 0.10, max: 0.34 };

function setKleurVoorThema(hex){
  const veilig = safeColor(hex, null);
  if(!veilig) return null;
  const { s } = hexNaarHsl(veilig);
  if(s < 12) return veilig;                       // grijstinten laten we met rust
  const band = themaIsLichtAchtig() ? SETLUM_LICHT : SETLUM_DONKER;
  return naarLuminantieBand(veilig, band.min, band.max);
}

/* Contrastkleuren van Herman zelf — een vaste, met opzet ver-uit-elkaar-
   liggende set (rood, cyaan, bruin, lavendel, groen, magenta, ...). Eerste
   redmiddel als de kleur uit de Excel-sheet te dicht bij een kleur ligt die
   al ergens anders in de haven/Onderweg in gebruik is; zelf een kleur
   verzinnen is pas de allerlaatste stap, hieronder in kiesGroepKleur(). */
const CONTRASTKLEUREN = [
  '#E6194B', '#42D4F4', '#9A6324', '#DCBEFF', '#3CB44B',
  '#F032E6', '#FFFAC8', '#4363D8', '#F58231', '#469990',
  '#FFE119', '#911EB4', '#BFEF45', '#800000', '#FABED4'
];
// Hoeveel twee kleuren minstens uit elkaar moeten liggen (CIE76 ΔE) om als
// "duidelijk te onderscheiden" te gelden — onder de 10 vallen kleuren voor
// de meeste mensen al bijna samen, boven de 20-25 is het verschil op een
// scherm in één oogopslag te zien.
const KLEUR_MIN_AFSTAND = 25;

// sRGB -> CIE Lab, voor een perceptueel kloppende kleurafstand (gewone
// rgb- of hsl-afstand onderschat hoe dicht twee kleuren bij elkaar ogen).
function hexNaarLab(hex){
  const h = String(hex).replace(/^#/, '');
  const vol = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  let r = parseInt(vol.slice(0,2),16)/255, g = parseInt(vol.slice(2,4),16)/255, b = parseInt(vol.slice(4,6),16)/255;
  const lin = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  r = lin(r); g = lin(g); b = lin(b);
  const x = (r*0.4124 + g*0.3576 + b*0.1805) / 0.95047;
  const y = (r*0.2126 + g*0.7152 + b*0.0722);
  const z = (r*0.0193 + g*0.1192 + b*0.9505) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787*t + 16/116);
  const fx = f(x), fy = f(y), fz = f(z);
  return { l: 116*fy - 16, a: 500*(fx-fy), b: 200*(fy-fz) };
}
function kleurAfstand(hexA, hexB){
  const A = hexNaarLab(hexA), B = hexNaarLab(hexB);
  return Math.sqrt((A.l-B.l)**2 + (A.a-B.a)**2 + (A.b-B.b)**2);
}

/* Kiest de kleur voor een nieuwe groep: eerst de kleur uit de Excel-sheet
   zelf (dat blijft de brontabel), dan — als die te dicht bij een kleur ligt
   die al in gebruik is — een van Hermans 15 contrastkleuren, en pas als
   zelfs die allemaal te dichtbij liggen (met zoveel groepen tegelijk in de
   haven dat de 15 op zijn) zelf een hue zoeken die zo ver mogelijk van alles
   wat al gebruikt wordt afligt. */
function kiesGroepKleur(voorkeur, gebruikt){
  const pastEr = kandidaat => gebruikt.every(g => kleurAfstand(kandidaat, g) >= KLEUR_MIN_AFSTAND);
  if(pastEr(voorkeur)) return voorkeur;

  /* Eerst uitwijken bínnen de eigen tint, dan pas ernaast, en pas daarna naar
     een heel andere kleur. Tot 1.200 sloeg dit die eerste twee stappen over:
     een groen dat botste met een ander groen werd meteen karmijnrood, en dan
     is het verband met het bronbestand weg én zie je niet meer dat het om twee
     ladingen van dezelfde soort gaat.

     Dit is ook waar de nuance tussen twee vertrekmomenten vandaan komt: twee
     sets van dezelfde boot krijgen zo een lichte en een donkere variant van
     dezelfde kleur in plaats van twee willekeurige tinten. */
  const band = themaIsLichtAchtig() ? SETLUM_LICHT : SETLUM_DONKER;
  const { h, s } = hexNaarHsl(voorkeur);
  const midden = (band.min + band.max) / 2;

  // 1. Zelfde tint, andere helderheid binnen de band.
  for(const doel of [band.max, band.min, midden]){
    const kandidaat = naarLuminantieBand(hslToHex(h, s, 50), doel, doel);
    if(pastEr(kandidaat)) return kandidaat;
  }
  // 2. Tint een stukje opschuiven, zodat het herkenbaar in de buurt blijft.
  for(const draai of [24, -24, 44, -44]){
    for(const doel of [midden, band.max, band.min]){
      const kandidaat = naarLuminantieBand(hslToHex((h + draai + 360) % 360, s, 50), doel, doel);
      if(pastEr(kandidaat)) return kandidaat;
    }
  }
  // 3. Pas nu een heel andere kleur.
  for(const ruw of CONTRASTKLEUREN){
    const kandidaat = setKleurVoorThema(ruw);
    if(pastEr(kandidaat)) return kandidaat;
  }
  /* Zelf een tint verzinnen. Ook hier langs de luminantieband: met een vaste
     HSL-lightness van 58 levert deze rondgang bij geel en cyaan kandidaten op
     die veel lichter ogen dan bij blauw en paars, en dan introduceert juist de
     noodoplossing een schreeuwer. */
  let beste = voorkeur, besteAfstand = -1;
  for(let hue = 0; hue < 360; hue += 10){
    const kandidaat = setKleurVoorThema(hslToHex(hue, 70, themaIsLichtAchtig() ? 45 : 58));
    const d = gebruikt.length ? Math.min(...gebruikt.map(g => kleurAfstand(kandidaat, g))) : Infinity;
    if(d > besteAfstand){ besteAfstand = d; beste = kandidaat; }
  }
  return beste;
}

// Welke vertrekgroepen op dit moment ergens zichtbaar zijn — in de haven
// (havenBakken(), bevat ook wat er op een bakkenplaats/kade ligt) of nog in
// Onderweg. Alleen tegen déze groepen hoeft een nieuwe kleur zich te
// bewijzen: een allang vertrokken of nog ver weg blok in de VH/HGK-lijst
// staat toch nergens naast een andere kleur op het scherm.
function havenGroepsleutelsInGebruik(){
  const sleutels = new Set();
  const bakken = havenBakken();
  bakken.forEach(b => { if(b.setKey) sleutels.add(b.setKey); });
  const binnen = new Set(bakken.map(b => b.sleutel));
  [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => {
    lijst.forEach(v => {
      if(!v.naam) return;
      if(binnen.has(normalizeBargeName(v.naam))) return;   // al meegeteld via havenBakken()
      if(plekBuitenDeHaven(v)) return;                     // laadt ergens anders, telt niet mee
      sleutels.add(bakGroupKey(v, bron));
    });
  });
  return sleutels;
}

/* Elke groep houdt zijn kleur zolang hij bestaat — deze functie draait bij
   ELKE render(), en zonder die stabiliteit zou een kleur kunnen wisselen
   zonder dat er iets echt veranderd is. Alleen een groep die voor het eerst
   verschijnt (nieuw in de VH/HGK-lijst) krijgt de afstandscontrole
   hierboven; is hij niet (meer) in de haven/Onderweg te zien, dan mag hij
   gewoon zijn Excel-kleur hebben, want er is dan niets om mee te
   verwarren. Verdwijnt een groep helemaal uit de lijst, dan verdwijnt ook
   zijn kleurtoewijzing, zodat zijn plek weer vrijkomt. */
function rebuildVhGroupColors(){
  const huidig = new Map();
  const neem = (list, source) => list.filter(v => v.kleur).forEach(v => {
    const key = bakGroupKey(v, source);
    if(!huidig.has(key)) huidig.set(key, v.kleur);
  });
  neem(vhBakken, 'VH');
  neem(hgkBakken, 'HGK');

  [...vhGroupColorMap.keys()].forEach(key => {
    if(!huidig.has(key)){ vhGroupColorMap.delete(key); vhGroepVoorlopig.delete(key); }
  });

  const relevant = havenGroepsleutelsInGebruik();
  huidig.forEach((ruweKleur, key) => {
    /* Al definitief vastgelegd: niets doen, zodat een kleur nooit verspringt
       zonder reden. Alleen een voorlopige kleur van een set die nú zichtbaar
       wordt, mag alsnog door de afstandscontrole. */
    if(vhGroupColorMap.has(key) && !(vhGroepVoorlopig.has(key) && relevant.has(key))) return;
    const voorkeur = setKleurVoorThema(ruweKleur);
    if(!relevant.has(key)){
      vhGroupColorMap.set(key, voorkeur);
      vhGroepVoorlopig.add(key);          // nog niet tegen iets anders afgewogen
      return;
    }
    const gebruikt = [...relevant]
      .filter(k => k !== key && vhGroupColorMap.has(k))
      .map(k => vhGroupColorMap.get(k));
    vhGroupColorMap.set(key, kiesGroepKleur(voorkeur, gebruikt));
    vhGroepVoorlopig.delete(key);         // vanaf nu vast
  });
}

/* Een bak opzoeken in de VH- of HGK-lijst.

   Hier stond `lijst.find(v => v.kleur && bargeNamesMatch(v.naam, naam))`: een
   lineaire zoektocht door de hele lijst, per ladingsregel. Dit is de plek waar
   de kwadratische tijd vandaan kwam — en niet alleen in de haven, want
   getEffectiveGroupForRow komt hier langs vanuit de planlijst, de
   verschillenlijst en de haven. Gemeten bij 45 ritten en 180 bakken: 65 tot
   71% van de tijd van elke hertekening.

   De index gaat van sleutel naar de posities in de lijst, oplopend. Dat
   oplopend is geen bijkomstigheid: `find` geeft de eérste treffer in
   lijstvolgorde terug, en dat antwoord moet gelijk blijven — staat dezelfde
   bak twee keer in de lijst, dan hoort de eerste eruit te komen.

   De kleurvoorwaarde zit met opzet niet in de index maar in de opzoeking: een
   bak waarvan de kleur verandert (van "in reparatie" naar gewoon) hoeft zo geen
   herbouw. Alleen namen en posities zitten in de index. */
let bakIndexVh = null, bakIndexHgk = null, bakIndexVerouderd = true;

function bouwBakIndex(lijst){
  const idx = new Map();
  for(let i = 0; i < lijst.length; i++){
    const v = lijst[i];
    if(!v || !v.naam) continue;
    for(const k of bargeSleutels(v.naam)){
      let posities = idx.get(k);
      if(!posities){ posities = []; idx.set(k, posities); }
      posities.push(i);
    }
  }
  idx.bron = lijst;            // wélke array dit was
  idx.lengte = lijst.length;   // en hoe lang hij toen was
  return idx;
}

/* De index is afgeleid van vhBakken en hgkBakken en moet dus vervallen zodra
   daar iets in verandert. markeerBakIndexVerouderd() doet dat, en wordt
   aangeroepen vanuit rebuildBargeLocationMap() — dezelfde plek waar de app zijn
   andere afgeleide kaart al bijwerkt, en die draait bij elke hertekening.

   Daarbovenop een vangnet op de lengte. Dat is nodig: de app maakt de lijsten
   op sommige plekken ter plekke leeg (`vhBakken.length = 0`) in plaats van ze
   te vervangen. Een controle op identiteit zou dat niet zien — die val liep ik
   bij het bouwen van deze index zelf in, en het gevolg was een index die naar
   posities wees die niet meer bestonden. */
function markeerBakIndexVerouderd(){ bakIndexVerouderd = true; }

function zorgVoorBakIndex(){
  /* Drie controles, en alle drie zijn ze nodig — ze dekken elk een andere
     manier waarop de lijsten veranderen:
       de vlag   de gewone weg: rebuildBargeLocationMap bij elke hertekening;
       de bron   een import of een herstelde back-up doet `vhBakken = flat`, dus
                 een nieuwe array. Zonder deze controle zou een tweede import
                 met evenveel regels — een verbeterde typefout bijvoorbeeld —
                 door de mazen glippen: de posities kloppen dan nog, maar ze
                 wijzen naar rijen met andere namen;
       de lengte de lijst wordt elders ter plekke leeggemaakt en opnieuw
                 gevuld, en dan blijft de array dezelfde. */
  if(bakIndexVerouderd || !bakIndexVh || !bakIndexHgk ||
     bakIndexVh.bron !== vhBakken || bakIndexHgk.bron !== hgkBakken ||
     bakIndexVh.lengte !== vhBakken.length || bakIndexHgk.lengte !== hgkBakken.length){
    bakIndexVh = bouwBakIndex(vhBakken);
    bakIndexHgk = bouwBakIndex(hgkBakken);
    bakIndexVerouderd = false;
  }
}

// Geeft hetzelfde antwoord als lijst.find(...): de eerste in lijstvolgorde die
// bij de naam hoort en een kleur heeft.
function zoekInBakIndex(lijst, idx, naam){
  let beste = -1;
  for(const k of bargeSleutels(naam)){
    const posities = idx.get(k);
    if(!posities) continue;
    for(const i of posities){
      if(beste !== -1 && i >= beste) break;   // loopt op: verderop staat niets beters
      const v = lijst[i];
      if(v && (v.kleur || v.groepKleur)){ beste = i; break; }   // ook een bak met alleen groepKleur hoort bij zijn set (1.208)
    }
  }
  return beste === -1 ? null : lijst[beste];
}

function findVhMatch(leichterName){
  if(!leichterName || !leichterName.trim()) return null;
  zorgVoorBakIndex();
  return zoekInBakIndex(vhBakken, bakIndexVh, leichterName);
}

function findHgkMatch(leichterName){
  if(!leichterName || !leichterName.trim()) return null;
  zorgVoorBakIndex();
  return zoekInBakIndex(hgkBakken, bakIndexHgk, leichterName);
}

// Zoekt eerst in VH, dan in HGK. Geeft {entry, source, list} terug of null.
function findBakMatch(leichterName){
  const vh = findVhMatch(leichterName);
  if(vh) return { entry: vh, source: 'VH', list: vhBakken };
  const hgk = findHgkMatch(leichterName);
  if(hgk) return { entry: hgk, source: 'HGK', list: hgkBakken };
  return null;
}

// Combineert de automatische VH/HGK-match met een eventuele handmatige
// koppeling (als de gebruiker zelf al weet bij welke groep een bak hoort,
// ook al heeft de app dat zelf niet kunnen vinden).
/* ---------------------------------------------------------------
   AANKOMST- EN VERTREKBOOT CONTROLEREN
   De EECV-lijst is de basis van een tegel, maar VH en HGK zijn leidend: staat
   daar een andere aankomst- of vertrekboot, dan klopt de EECV-lijst niet.

   Let op de vertrekboot: in de VH/HGK-Excel staat die vaak maar op één regel
   van een kleurgroep ingevuld, niet op alle vier. Bij 7 van de 9 groepen in de
   testlijst is dat zo. Een lege cel betekent dus niet "geen vertrekboot", maar
   "dezelfde als de rest van de groep" — daarom vullen we hem aan vanuit de
   groepsgenoten. Zonder die aanvulling mist de controle bakken zoals VH 82,
   die wel degelijk met een andere boot vertrekt dan de tegel zegt.
--------------------------------------------------------------- */
function lijstBotenVoorRegel(row){
  const grp = getEffectiveGroupForRow(row);
  if(!grp) return null;
  const eigen = grp.list.find(v => bargeNamesMatch(v.naam, row.leichter)) || grp.entry;
  let vertrek = eigen.vertrekboot;
  if(!vertrek){
    const genoot = grp.list.find(v => bakGroupKey(v, grp.source) === grp.key && v.vertrekboot);
    if(genoot) vertrek = genoot.vertrekboot;
  }
  return { aankomst: eigen.schip || null, vertrek: vertrek || null, bron: grp.source };
}

// Wat klopt er niet op deze regel? Levert per boot de juiste naam op, of null.
function bootControle(trip, row){
  const uit = { aankomstJuist: null, vertrekJuist: null };
  if(!row || !row.leichter || isDummyName(row.leichter)) return uit;
  const lijst = lijstBotenVoorRegel(row);
  if(!lijst) return uit;
  if(row.ankunftsboot && row.ankunftsboot.trim() && lijst.aankomst
     && !shipNamesMatch(row.ankunftsboot, lijst.aankomst)){
    uit.aankomstJuist = lijst.aankomst;
  }
  if(trip.schubboot && lijst.vertrek && !shipNamesMatch(trip.schubboot, lijst.vertrek)){
    uit.vertrekJuist = lijst.vertrek;
  }
  return uit;
}

function getEffectiveGroupForRow(row){
  if(!row.leichter || isDummyName(row.leichter)) return null;
  const auto = findBakMatch(row.leichter);
  if(auto) return { entry: auto.entry, source: auto.source, list: auto.list, key: bakGroupKey(auto.entry, auto.source), manual: false };
  if(row.manualGroupKey){
    const source = row.manualGroupKey.split('|')[0];
    const list = source === 'VH' ? vhBakken : hgkBakken;
    let rep = list.find(v => bakGroupKey(v, source) === row.manualGroupKey);
    /* Een koppeling die jij zelf hebt gelegd staat opgeslagen bij de rit
       (bakKenmerken.groepKey). In 1.209 is de sleutel langer geworden —
       vertrekboot en -tijd erachteraan — dus een koppeling van vóór die versie
       past niet meer exact. Zonder deze stap zou hij zwijgend vervallen en merk
       je dat pas weken later. De oude sleutel is het begin van de nieuwe, dus
       daarop zoeken en de bijgewerkte sleutel meteen terugschrijven. Viel de
       oude groep inmiddels in tweeën uiteen — precies waar 1.209 voor gemaakt
       is — dan wint de eerste in lijstvolgorde (dezelfde gok als vóór 1.209). */
    if(!rep){
      const voorvoegsel = row.manualGroupKey + '|';
      rep = list.find(v => bakGroupKey(v, source).startsWith(voorvoegsel));
      if(rep) row.manualGroupKey = bakGroupKey(rep, source);
    }
    return { entry: rep || { schip: null }, source, list, key: row.manualGroupKey, manual: true };
  }
  return null;
}

// Aankomst- en vertrektijd voor de tegel. Belangrijk: in de VH/HGK-lijst
// hoort het schip/tijd-veld bij een bak bij de AANKOMST (welke boot de bak
// bracht, en wanneer) — niet bij het vertrek. Dat gebruiken we dus als
// eerste bron voor aankomst, met de EECV-rijgegevens als terugval. Staat er
// wél een aankomstboot maar geen tijd, dan is de bak al binnen. Vertrek
// heeft in VH/HGK geen eigen veld en komt dus altijd uit de EECV-Abfahrt.
function computeTripTimes(trip){
  let aankomstMs = null, aankomstDisplay = null;
  for(const r of trip.rows){
    if(!r.leichter) continue;
    const grp = getEffectiveGroupForRow(r);
    if(grp && grp.entry){
      if(grp.entry.tijd){
        const parsed = parseVhTijd(grp.entry.tijd, trip.planbegin);
        if(parsed){ aankomstMs = parsed; aankomstDisplay = grp.entry.tijd; break; }
      } else {
        /* Geen aankomsttijd in de lijst betekent dat de bak er al ligt: een
           tijd staat er alleen bij wat nog moet komen. Dit keek eerst ook of
           er een aankomstboot bij stond, maar die ontbreekt soms net zo goed
           — en dan bleef de bak ten onrechte in Onderweg staan. */
        aankomstDisplay = 'al binnen';
        break;
      }
    }
  }
  if(aankomstMs === null && !aankomstDisplay){
    const ankunftRow = trip.rows.find(r => r.ankunft && r.ankunft.trim());
    if(ankunftRow){ aankomstMs = parseDate(ankunftRow.ankunft); aankomstDisplay = ankunftRow.ankunft; }
  }
  return {
    aankomstMs,
    aankomstDisplay: aankomstDisplay || '—',
    vertrekMs: parseDate(trip.abfahrt),
    vertrekDisplay: trip.abfahrt || '—'
  };
}

// Zet een tegel automatisch op "aanwezig" zodra VH/HGK "al binnen" meldt.
// Gebeurt maar 1x per rit (via alBinnenAutoApplied) — zet je 'm daarna zelf
// weer uit, dan komt de app daar niet overheen.
function autoMarkAlBinnen(){
  let changed = false;
  trips.filter(t => t.status === 'actief' && !t.alBinnenAutoApplied).forEach(t => {
    if(computeTripTimes(t).aankomstDisplay === 'al binnen'){
      t.aangemeerd = true;
      t.alBinnenAutoApplied = true;
      changed = true;
    }
  });
  return changed;
}

// Bakken zonder kleur in VH/HGK staan "in reparatie" en vertrekken niet.
// Staat zo'n baknummer toch in de actieve EECV-planning, dan is dat een
// planningsconflict dat de gebruiker moet zien.
function getRepairConflicts(bakkenList){
  const activeBarges = [];
  trips.filter(t => t.status === 'actief').forEach(t => {
    t.rows.forEach(r => {
      if(r.leichter && r.leichter.trim()) activeBarges.push({ leichter: r.leichter, trip: t });
    });
  });
  return bakkenList.filter(v => !v.kleur).map(v => {
    const match = activeBarges.find(b => bargeNamesMatch(v.naam, b.leichter));
    return match ? { naam: v.naam, trip: match.trip } : null;
  }).filter(Boolean);
}

/* De telling achter de vergelijking van de EECV-planning met één lijst (VH of
   HGK): gedeeld door het venster en door de kaart op het Overzicht. */
function vergelijkData(bakkenList, matchFn){
  const activeBarges = [];
  trips.filter(t => t.status === 'actief').forEach(t => {
    t.rows.forEach(r => {
      if(r.leichter && r.leichter.trim()) activeBarges.push({ leichter: r.leichter, trip: t });
    });
  });
  const sailingList = bakkenList.filter(v => v.kleur);
  const missingInList = activeBarges.filter(b => !matchFn(b.leichter));
  const missingInPdf = sailingList.filter(v => !activeBarges.some(b => bargeNamesMatch(v.naam, b.leichter)));
  return {
    activeBarges, missingInList, missingInPdf,
    matchedCount: activeBarges.length - missingInList.length,
    repairConflicts: getRepairConflicts(bakkenList)
  };
}

/* Kaart op het Overzicht: twee kolommen (VH en HGK) die elk de EECV-planning
   tegen hun lijst leggen. Groen vinkje als alles klopt, rode pil met het aantal
   afwijkingen als er iets niet overeenkomt. De details staan in het venster. */
function vergelijkKaartHtml(){
  const chips = (namen, max = 6) => namen.slice(0, max).map(n => `<span class="vgl-chip">${eigenaarBadge(n)}${esc(n)}</span>`).join('')
    + (namen.length > max ? `<span class="vgl-meer">+${namen.length - max} meer</span>` : '');
  const kolom = (label, lijst, matchFn) => {
    if(!lijst.length){
      return `<div class="vgl-kol vgl-leeg">
        <div class="vgl-kop"><h4>${label}-lijst</h4><span class="vgl-pil">Niet geïmporteerd</span></div>
        <p class="vgl-tekst">Importeer de ${label}-lijst om hem tegen de EECV-planning te leggen.</p></div>`;
    }
    const d = vergelijkData(lijst, matchFn);
    const afw = d.missingInList.length + d.missingInPdf.length + d.repairConflicts.length;
    return `<div class="vgl-kol ${afw ? 'vgl-fout' : 'vgl-ok'}">
      <div class="vgl-kop"><h4>${label}-lijst</h4>${afw
        ? `<span class="vgl-pil">${afw} afwijking${afw === 1 ? '' : 'en'}</span>`
        : `<span class="vgl-pil"><span aria-hidden="true">✓</span> Klopt</span>`}</div>
      <div class="vgl-getal">${d.matchedCount}<span>/${d.activeBarges.length}</span></div>
      <div class="vgl-tekst">bakken uit de EECV-planning staan in de ${label}-lijst</div>
      ${d.missingInList.length ? `<div class="vgl-regel"><span class="vgl-lbl">Niet in ${label}</span>${chips(d.missingInList.map(b => b.leichter))}</div>` : ''}
      ${d.missingInPdf.length ? `<div class="vgl-regel"><span class="vgl-lbl">Niet in EECV</span>${chips(d.missingInPdf.map(v => v.naam))}</div>` : ''}
      ${d.repairConflicts.length ? `<div class="vgl-regel"><span class="vgl-lbl">In reparatie</span>${chips(d.repairConflicts.map(c => c.naam))}</div>` : ''}
    </div>`;
  };
  return `<div class="dash-card span-12 dash-vgl">
      <div class="dash-card-head"><div class="ic">🔀</div><h3>Vergelijking EECV tegen VH en HGK</h3>
        <button type="button" class="btn btn-secondary vgl-details" data-actie="vergelijking">Details</button></div>
      <div class="vgl-grid">${kolom('VH', vhBakken, findVhMatch)}${kolom('HGK', hgkBakken, findHgkMatch)}</div>
    </div>`;
}

function buildCompareSection(label, bakkenList, matchFn, importedAt){
  if(!bakkenList.length){
    return `<div class="review-item">
        <div class="review-top"><h3 class="review-titel">${esc(label)}</h3></div>
        <div class="review-rowline" style="margin-left:0;color:var(--text-dim);">nog niet geïmporteerd</div>
      </div>`;
  }
  const { activeBarges, missingInList, missingInPdf, matchedCount, repairConflicts } = vergelijkData(bakkenList, matchFn);

  const missListHtml = missingInList.length ? missingInList.map(b =>
    `<div class="review-rowline" style="margin-left:0;color:var(--danger);">${eigenaarBadge(b.leichter)}${esc(b.leichter)} — <span style="color:var(--text-dim);">${esc(b.trip.schubboot)} (${esc(b.trip.station)})</span></div>`
  ).join('') : `<div class="review-rowline" style="margin-left:0;color:var(--text-dim);">geen — alles uit de PDF staat ook in de ${esc(label)}-lijst</div>`;

  const missPdfHtml = missingInPdf.length ? missingInPdf.map(v =>
    `<div class="review-rowline" style="margin-left:0;color:var(--danger);">${eigenaarBadge(v.naam)}${esc(v.naam)} — <span style="color:var(--text-dim);">${esc(v.schip||'?')}${v.bestemming?' · '+esc(v.bestemming):''}</span></div>`
  ).join('') : `<div class="review-rowline" style="margin-left:0;color:var(--text-dim);">geen — alles uit de ${esc(label)}-lijst staat ook in de PDF-planning</div>`;

  const repairHtml = repairConflicts.length ? repairConflicts.map(c =>
    `<div class="review-rowline" style="margin-left:0;color:var(--danger);">${esc(c.naam)} — <span style="color:var(--text-dim);">staat in ${esc(label)} als "in reparatie" (geen kleur), maar wél gepland bij ${esc(c.trip.schubboot)} (${esc(c.trip.station)})</span></div>`
  ).join('') : '';

  return `<div class="review-item">
      <div class="review-top"><h3 class="review-titel">${esc(label)} — ${matchedCount}/${activeBarges.length} bakken gevonden${importedAt?' · geïmporteerd '+fmtDateTime(importedAt):''}</h3></div>
      <div class="review-meta" style="margin:6px 0 2px 0;">In PDF, niet gevonden in ${esc(label)}</div>
      ${missListHtml}
      <div class="review-meta" style="margin:8px 0 2px 0;">In ${esc(label)}, niet gevonden in PDF-planning</div>
      ${missPdfHtml}
      ${repairConflicts.length ? `<div class="review-meta" style="margin:8px 0 2px 0;color:var(--danger);">⚠ In reparatie volgens ${esc(label)}, maar wél in de PDF-planning</div>${repairHtml}` : ''}
    </div>`;
}

async function showOriginalFile(type){
  const entry = lastFiles[type];
  if(!entry) return;
  const labels = { eecv: 'EECV-lijst', vh: 'VH-lijst', hgk: 'HGK-lijst' };
  document.getElementById('originalTitle').textContent = `${labels[type]}: ${entry.filename}`;
  const panel = document.getElementById('originalPanel');
  const content = document.getElementById('originalContent');
  panel.style.display = 'flex';
  document.getElementById('app').classList.add('split-active');
  content.innerHTML = '<div style="padding:20px;color:#555;">Laden…</div>';
  // De planlijst naar één kolom, zodat hij naast de pagina van het origineel
  // past. Je eigen kolomkeuze blijft bewaard en komt terug bij het sluiten.
  origineelCheck = true;
  render();

  // Een te groot origineel is niet meebewaard (zie MAX_ORIGINEEL_BYTES).
  if(!entry.dataUrl){
    content.innerHTML = `<div style="padding:20px;color:#555;">Dit bestand was te groot om te bewaren, of de opslag zat vol. Importeer het opnieuw om het hier te kunnen bekijken.</div>`;
    return;
  }

  const isPdf = entry.dataUrl.startsWith('data:application/pdf') || /\.pdf$/i.test(entry.filename);
  if(isPdf){
    await toonPdfOrigineel(content, entry.dataUrl);
    koppelOrigineelScroll();
    return;
  }
  try{
    await ensureXlsx();
    const wb = XLSX.read(bytesUitDataUrl(entry.dataUrl), { type: 'array', cellStyles: true });
    renderExcelPreview(content, wb);
  }catch(e){
    console.error(e);
    content.innerHTML = '<div style="padding:20px;color:#a00;">Kon dit bestand niet weergeven.</div>';
  }
  koppelOrigineelScroll();
}

function bytesUitDataUrl(dataUrl){
  const binair = atob(dataUrl.split(',')[1]);
  const bytes = new Uint8Array(binair.length);
  for(let i = 0; i < binair.length; i++) bytes[i] = binair.charCodeAt(i);
  return bytes;
}

/* De PDF wordt zelf getekend in plaats van aan de browser overgelaten.
   Dat moest wel: de ingebouwde weergave zat in een afgeschermd kadertje, en
   daar kan de app niet in kijken — dus ook niet zien hoe ver het openstaat.
   Nu staan de pagina's gewoon in de app en kan de planlijst meescrollen.

   Lukt het tekenen niet, dan valt hij terug op het kadertje van de browser.
   Je ziet het bestand dan nog steeds, alleen scrollt de lijst niet mee. */
async function toonPdfOrigineel(content, dataUrl){
  try{
    await ensurePdfWorker();
    let pdf;
    try{
      pdf = await pdfjsLib.getDocument({ data: bytesUitDataUrl(dataUrl), isEvalSupported: false }).promise;
    }catch(e){
      await useBlobWorkerFallback();
      pdf = await pdfjsLib.getDocument({ data: bytesUitDataUrl(dataUrl), isEvalSupported: false }).promise;
    }
    const breedte = content.clientWidth || 700;
    const scherpte = Math.min(2, window.devicePixelRatio || 1);
    content.innerHTML = '';
    for(let p = 1; p <= pdf.numPages; p++){
      const pagina = await pdf.getPage(p);
      const basis = pagina.getViewport({ scale: 1 });
      const schaal = Math.max(0.2, (breedte - 16) / basis.width);
      const kijk = pagina.getViewport({ scale: schaal * scherpte });
      const doek = document.createElement('canvas');
      doek.className = 'original-pdf-pagina';
      doek.width = Math.round(kijk.width);
      doek.height = Math.round(kijk.height);
      doek.style.width = Math.round(kijk.width / scherpte) + 'px';
      content.appendChild(doek);
      await pagina.render({ canvasContext: doek.getContext('2d'), viewport: kijk }).promise;
    }
  }catch(e){
    console.error('Kon de PDF niet zelf tekenen:', e);
    // sandbox: het origineel is een bestand van een externe partij en mag
    // geen scripts draaien of de pagina eromheen aanraken.
    content.innerHTML = `<iframe sandbox src="${esc(dataUrl)}"></iframe>`;
  }
}

/* Het origineel en de planlijst samen laten opschuiven.

   Ze zijn niet even lang, dus het gaat op verhouding: sta je halverwege het
   origineel, dan sta je halverwege de lijst. Wie van de twee de baas is
   bepaalt degene die je beweegt — anders duwen ze elkaar heen en weer.

   Onder 900 px staat het origineel ónder de lijst in plaats van ernaast en
   scrollt alles al samen; dan doet dit niets. */
let origineelScrollLos = null;

function koppelOrigineelScroll(){
  ontkoppelOrigineelScroll();
  const el = document.getElementById('originalContent');
  if(!el || window.matchMedia('(max-width:900px)').matches) return;

  let baas = null, rust = null;
  const stuur = (wie, doe) => () => {
    if(baas && baas !== wie) return;
    baas = wie;
    clearTimeout(rust);
    rust = setTimeout(() => { baas = null; }, 140);
    doe();
  };
  const deel = (nu, max) => max > 0 ? Math.min(1, Math.max(0, nu / max)) : 0;

  const naarLijst = stuur('origineel', () => {
    const f = deel(el.scrollTop, el.scrollHeight - el.clientHeight);
    window.scrollTo(0, Math.round(f * Math.max(0, document.documentElement.scrollHeight - window.innerHeight)));
  });
  const naarOrigineel = stuur('lijst', () => {
    const f = deel(window.scrollY, document.documentElement.scrollHeight - window.innerHeight);
    el.scrollTop = Math.round(f * Math.max(0, el.scrollHeight - el.clientHeight));
  });

  el.addEventListener('scroll', naarLijst, { passive: true });
  window.addEventListener('scroll', naarOrigineel, { passive: true });
  origineelScrollLos = () => {
    el.removeEventListener('scroll', naarLijst);
    window.removeEventListener('scroll', naarOrigineel);
    clearTimeout(rust);
  };
}

function ontkoppelOrigineelScroll(){
  if(origineelScrollLos){ origineelScrollLos(); origineelScrollLos = null; }
}

// Bouwt zelf de tabel op (i.p.v. XLSX.utils.sheet_to_html) zodat de
// celkleuren zichtbaar blijven — precies de kleuren die de app ook gebruikt
// om vertrekgroepen te herkennen, dus dit is meteen de beste controle
// daarop.
function renderExcelPreview(content, wb){
  const sheetNames = wb.SheetNames;
  let active = sheetNames[0];
  function cellFillHex(cell){
    if(!cell || !cell.s) return null;
    const hex = resolveCellFillHex(cell.s);
    return hex ? '#' + hex : null;
  }
  function buildTable(ws){
    if(!ws['!ref']) return '<div style="padding:20px;color:#555;">(leeg werkblad)</div>';
    const range = XLSX.utils.decode_range(ws['!ref']);
    let html = '<table>';
    for(let r = range.s.r; r <= range.e.r; r++){
      html += '<tr>';
      for(let c = range.s.c; c <= range.e.c; c++){
        const ref = XLSX.utils.encode_cell({ r, c });
        const cell = ws[ref];
        const fill = cellFillHex(cell);
        const val = cell ? (cell.w !== undefined ? cell.w : cell.v) : '';
        /* De vulkleur komt rechtstreeks uit het Excel-bestand en ging hier
           ongecontroleerd in een style-attribuut. Een bewerkt bestand kon zo
           het attribuut openbreken en eigen opmaak of code meesturen — precies
           waar BEVEILIGING.md belooft dat celkleuren als hexcode gevalideerd
           worden. safeColor() doet dat: alleen een echte hexcode komt erdoor,
           al het andere valt terug op de standaardkleur. */
        const vulling = fill ? safeColor(fill, null) : null;
        html += `<td${vulling ? ` style="background:${vulling};"` : ''}>${val !== undefined && val !== null ? esc(String(val)) : ''}</td>`;
      }
      html += '</tr>';
    }
    html += '</table>';
    return html;
  }
  function draw(){
    const tabsHtml = sheetNames.length > 1
      ? `<div class="original-sheet-tabs">${sheetNames.map(n => `<button type="button" class="original-sheet-tab${n===active?' active':''}" data-sheet="${esc(n)}" aria-pressed="${n===active}">${esc(n)}</button>`).join('')}</div>`
      : '';
    content.innerHTML = tabsHtml + buildTable(wb.Sheets[active]);
    content.querySelectorAll('.original-sheet-tab').forEach(tab => {
      tab.addEventListener('click', () => { active = tab.dataset.sheet; draw(); });
    });
  }
  draw();
}

function closeOriginalPanel(){
  ontkoppelOrigineelScroll();
  document.getElementById('originalPanel').style.display = 'none';
  document.getElementById('originalContent').innerHTML = '';
  document.getElementById('app').classList.remove('split-active');
  origineelCheck = false;
  render();
}

// Past eerder ingevulde baknamen automatisch weer toe op regels die nog als
// "Dummy ..." binnenkomen bij een nieuwe import, zodat je 'm niet steeds
// opnieuw hoeft in te vullen.
/* Bakstatus (*niet aanwezig* / *moet repareren*) en de handmatige koppeling aan
   een vertrekgroep horen bij de bák, niet bij de ladingsregel. Een her-import
   vervangt `trip.rows` volledig, dus stonden ze daar niet veilig. Ze worden nu
   los bewaard op de tegel, met de genormaliseerde baknaam als sleutel — dezelfde
   opzet als dummyResolutions hierboven — en na een import weer op de verse
   regels gezet. */
function onthoudBakKenmerk(trip, baknaam, veld, waarde){
  if(!baknaam) return;
  if(!trip.bakKenmerken) trip.bakKenmerken = {};
  const sleutel = normalizeBargeName(baknaam);
  const kenmerk = trip.bakKenmerken[sleutel] || {};
  if(waarde == null) delete kenmerk[veld];
  else kenmerk[veld] = waarde;
  if(Object.keys(kenmerk).length) trip.bakKenmerken[sleutel] = kenmerk;
  else delete trip.bakKenmerken[sleutel];
}

// Draait ná applyDummyResolutions: die geeft een dummyregel zijn echte naam,
// en op die naam staan de kenmerken.
function applyBakKenmerken(trip){
  if(!trip.bakKenmerken) return;
  trip.rows.forEach(row => {
    if(!row.leichter) return;
    const kenmerk = trip.bakKenmerken[normalizeBargeName(row.leichter)];
    if(!kenmerk) return;
    if(kenmerk.status != null) row.bakStatus = kenmerk.status;
    if(kenmerk.groepKey != null) row.manualGroupKey = kenmerk.groepKey;
  });
}

function applyDummyResolutions(trip){
  if(!trip.dummyResolutions) return;
  trip.rows.forEach(row => {
    if(row.leichter && isDummyName(row.leichter)){
      const key = normalizeBargeName(row.leichter);
      if(trip.dummyResolutions[key]){
        row._dummyLabel = row.leichter;
        row.leichter = trip.dummyResolutions[key];
      }
    }
  });
}

      <button type="button" class="group-pick-item" data-key="${esc(g.key)}" style="border-left:5px solid ${safeColor(g.color)};">
        <span class="group-pick-swatch" style="background:${safeColor(g.color)}" aria-hidden="true"></span>
        <span>${esc(g.label)} <span style="color:var(--text-dim);">(${esc(g.source)})</span></span>

  bd.innerHTML = `<div class="modal">
      <h2>Koppelen aan vertrekgroep</h2>
      <div class="sub">"${esc(row.leichter)||'(zonder naam)'}" is niet automatisch gevonden. Kies handmatig bij welke vertrekgroep 'm hoort.</div>
      <div id="groupPickList">${groupItemsHtml}</div>
      <div class="modal-actions">
        ${row.manualGroupKey ? '<button class="btn btn-secondary" id="clearGroupPick">Koppeling verwijderen</button>' : ''}
        <button class="btn btn-secondary" id="cancelGroupPick">Annuleren</button>
      </div>
    </div>`;
  toonModal(bd);

  document.getElementById('cancelGroupPick').addEventListener('click', closeModal);
  const clearBtn = document.getElementById('clearGroupPick');
  if(clearBtn){
    clearBtn.addEventListener('click', async () => {
      await logAction(`Groepskoppeling verwijderd: ${row.leichter||'?'} (${trip.station||'?'})`);
      delete row.manualGroupKey;
      onthoudBakKenmerk(trip, row.leichter, 'groepKey', null);
      saveTrips();
      closeModal();

  bd.querySelectorAll('.group-pick-item').forEach(el => {
