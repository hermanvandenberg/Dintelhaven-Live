          <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
            <input type="color" id="bgKleurLicht" value="${esc(s.bgKleurLicht || '#F7F3EC')}"
                   style="width:38px;height:28px;padding:0;border:0;background:none;cursor:pointer;">
            lichte modus
          </label>
          <button type="button" class="btn btn-secondary" id="bgKleurStandaard"
                  style="padding:4px 10px;font-size:12px;">Standaard</button>
        </div>
        <div id="bgKleurUitleg" style="font-size:12px;color:var(--text-dim);margin-top:6px;">
          De kleur bepaalt de tint; hoe licht of donker hij wordt regel je per modus met de schuif hieronder.
        </div>
      </div>
      <div style="margin-top:12px;">
        <label for="darkSlider" style="font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:4px;">
          <span>Donkerte achtergrond (donkere modus)</span>
          <span id="darkSliderWaarde" style="font-family:'JetBrains Mono',monospace;color:var(--text);"></span>
        </label>
        <div style="display:flex;align-items:center;gap:10px;">
          <input type="range" id="darkSlider" min="6" max="24" value="${s.darkBgLightness ?? 14}" style="flex:1;">
          <span id="darkSliderPreview" class="instelling-preview" aria-hidden="true" title="Zo ziet de achtergrond eruit in donkere modus, ongeacht welk thema nu actief is"></span>
        </div>
      </div>
      <div style="margin-top:12px;">
        <label for="lightSlider" style="font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:4px;">
          <span>Donkerte achtergrond (lichte modus)</span>
          <span id="lightSliderWaarde" style="font-family:'JetBrains Mono',monospace;color:var(--text);"></span>
        </label>
        <div style="display:flex;align-items:center;gap:10px;">
          <input type="range" id="lightSlider" min="0" max="30" value="${s.lightBgDonkerte ?? 0}" style="flex:1;">
          <span id="lightSliderPreview" class="instelling-preview" aria-hidden="true" title="Zo ziet de achtergrond eruit in lichte modus, ongeacht welk thema nu actief is"></span>
        </div>
      </div>
      <div style="margin-top:12px;">
        <label for="tegelZoomSlider" style="font-size:13px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:4px;">
          <span>Vergroting bij tikken op een tegel (lege bakkenplaats)</span>
          <span id="tegelZoomSliderWaarde" style="font-family:'JetBrains Mono',monospace;color:var(--text);"></span>
        </label>
        <input type="range" id="tegelZoomSlider" min="120" max="400" step="20" value="${s.tegelZoomPercentage ?? 200}" style="width:100%;">
      </div>
      <div class="modal-actions" style="position:static;border-top:none;padding-top:14px;">
        <button class="btn btn-danger" id="verwijderGebruikerBtn">Gebruiker verwijderen</button>
        <button class="btn btn-secondary" id="changePinBtn">Pincode wijzigen</button>
      </div>`;
    gebrWrap.appendChild(panel);

    const pastelToggle = panel.querySelector('#pastelToggle');
    const darkSlider = panel.querySelector('#darkSlider');
    const lightSlider = panel.querySelector('#lightSlider');
    const tegelZoomSlider = panel.querySelector('#tegelZoomSlider');

    /* Een schuif zonder cijfer erbij liet je nooit de precieze stand zien —
       alleen "ergens tussen 6 en 24" op het oog. En omdat applyCurrentUserSettings()
       alleen de kleuren van het thema wijzigt waar je nú in zit, zag je bij de
       schuif van het andere thema niets gebeuren. Dit blokje rekent daarom
       zelf, los van het actieve thema, uit hoe elke stand eruitziet — via
       dezelfde achtergrondTinten() — en toont dat als cijfer én als vlakje. */
    function verversPreviews(){
      panel.querySelector('#darkSliderWaarde').textContent = darkSlider.value;
      panel.querySelector('#lightSliderWaarde').textContent = lightSlider.value;

      const inst = huidigeInstellingen();
      panel.querySelector('#darkSliderPreview').style.background = achtergrondTinten(false, inst).surface;
      panel.querySelector('#lightSliderPreview').style.background = (achtergrondTinten(true, inst) || { bg: '#F7F3EC' }).bg;

      panel.querySelector('#tegelZoomSliderWaarde').textContent = tegelZoomSlider.value + '%';
    }

    /* De achtergrondkleur staat los van de schuiven: hij levert de tint, zij
       de lichtheid. Leeg betekent "de vaste tint van het thema" — daar zet de
       knop Standaard het ook weer op. Alle instellingen worden voortaan via
       één plek samengesteld, zodat een nieuw veld niet in het ene pad wel en
       in het andere niet meekomt. */
    const bgKleurDonker = panel.querySelector('#bgKleurDonker');
    const bgKleurLicht = panel.querySelector('#bgKleurLicht');
    let eigenBgDonker = (current.settings || {}).bgKleurDonker || '';
    let eigenBgLicht = (current.settings || {}).bgKleurLicht || '';
    const huidigeInstellingen = () => ({
      ...(current.settings || defaultUserSettings()),
      pastel: pastelToggle.checked,
      darkBgLightness: +darkSlider.value,
      lightBgDonkerte: +lightSlider.value,
      tegelZoomPercentage: +tegelZoomSlider.value,
      bgKleurDonker: eigenBgDonker,
      bgKleurLicht: eigenBgLicht
    });
    verversPreviews();

    async function saveSettings(){
      current.settings = huidigeInstellingen();
      await saveUsers();
      applyCurrentUserSettings();
      render();
    }
    // Tijdens het slepen meteen de kleuren bijwerken; pas bij loslaten opslaan
    // en opnieuw tekenen. Met alleen 'change' gebeurde er niets zolang je aan
    // het schuiven was, en dat voelt alsof de schuif niet werkt.
    function toonDirect(){
      current.settings = huidigeInstellingen();
      applyCurrentUserSettings();
    }

    /* Meteen meekijken terwijl je de kleur uitzoekt, en pas opslaan als je 'm
       loslaat — net als bij de schuiven.

       Er stond hier ook een contrastwaarschuwing, maar die kon nooit afgaan:
       de lichtheid komt van de schuiven, dus een kleurkeuze verschuift alleen
       de tint. Een onleesbare achtergrond is er zo niet mee te maken. Een
       controle die altijd goedkeurt is erger dan geen controle — die wekt de
       indruk dat er op gelet wordt. */
    bgKleurDonker.addEventListener('input', () => { eigenBgDonker = bgKleurDonker.value; toonDirect(); verversPreviews(); });
    bgKleurLicht.addEventListener('input', () => { eigenBgLicht = bgKleurLicht.value; toonDirect(); verversPreviews(); });
    [bgKleurDonker, bgKleurLicht].forEach(el => el.addEventListener('change', saveSettings));
    panel.querySelector('#bgKleurStandaard').addEventListener('click', async () => {
      eigenBgDonker = ''; eigenBgLicht = '';
      bgKleurDonker.value = '#0D1620';
      bgKleurLicht.value = '#F7F3EC';
      await saveSettings();
    });
    [darkSlider, lightSlider, tegelZoomSlider].forEach(el => {
      el.addEventListener('input', () => { toonDirect(); verversPreviews(); });
      el.addEventListener('change', saveSettings);
    });
    pastelToggle.addEventListener('change', saveSettings);

    panel.querySelectorAll('.accent-knop').forEach(knop => {
      knop.addEventListener('click', async () => {
        current.settings = { ...(current.settings || defaultUserSettings()), accent: knop.dataset.accent };
        await saveUsers();
        applyCurrentUserSettings();
        render();
      });
    });

    // Thema per gebruiker: setTheme() schrijft de keuze naar deze (actieve)
    // gebruiker en past hem meteen toe.
    panel.querySelectorAll('.thema-knop').forEach(knop => {
      knop.addEventListener('click', () => setTheme(knop.dataset.thema));
    });

    panel.querySelector('#changePinBtn').addEventListener('click', () => openChangePinModal(current));
    panel.querySelector('#verwijderGebruikerBtn').addEventListener('click', async () => {
      const ja = await vraagBevestiging({ titel: `${current.naam} verwijderen?`,
        tekst: 'Het profiel en de instellingen verdwijnen. Dit kan niet ongedaan gemaakt worden.',
        bevestig: 'Verwijderen', gevaarlijk: true });
      if(!ja) return;
      users = users.filter(u => u.id !== current.id);
      currentUserId = null;
      instellingenOpenVoor = null;
      await saveUsers();
      pasGebruikersThemaToe();
      render();
    });
  }

  addBtn.addEventListener('click', async () => {
    const naam = await vraagTekst({
      titel: 'Nieuwe gebruiker',
      uitleg: 'Onder welke naam moet dit profiel in de lijst komen?',
      placeholder: 'bijv. Herman',
      bevestig: 'Aanmaken'
    });
    if(!naam) return;
    const user = {
      id: 'u_' + Date.now() + '_' + bytesNaarHex(crypto.getRandomValues(new Uint8Array(4))),
      naam: naam.trim().slice(0, 60),
      settings: defaultUserSettings(),
      pinIsStandaard: true
    };
    try{
      await setUserPin(user, '1234');
    }catch(e){
      console.error('Pincode instellen mislukt:', e);
      showToast('Deze browser ondersteunt het veilig opslaan van een pincode niet — gebruiker niet aangemaakt.');
      return;
    }
    users.push(user);
    // Is er nog niemand actief, dan wordt dit profiel het meteen. Anders maak je
    // een gebruiker aan, gebeurt er zichtbaar niets, en blijven de instellingen
    // verborgen tot je toevallig op "Wisselen" klikt.
    const wasNiemandActief = !getCurrentUser();
    if(wasNiemandActief) currentUserId = user.id;
    await saveUsers();
    pasGebruikersThemaToe();
    render();
    showToast(wasNiemandActief
      ? `"${user.naam}" aangemaakt en meteen actief. Standaardpincode 1234 — wijzig deze.`
      : `"${user.naam}" aangemaakt met standaardpincode 1234 — wijzig deze meteen.`);
  });
  main.querySelectorAll('.user-switch-btn').forEach(el => {
    el.addEventListener('click', () => {
      const target = users.find(u => u.id === el.dataset.id);
      // Wisselen zonder pincode (idee 16); de pincode zit op de instellingen.
      if(target) maakDienstActief(target);
    });
  });
}

/* Idee 16 — wie heeft er dienst. Gebruiker wisselen gaat zonder pincode; de
   pincode beschermt alleen de instellingen. instellingenOpenVoor = id van de
   gebruiker wiens instellingen ontgrendeld zijn (null = op slot). */
let instellingenOpenVoor = null;

async function maakDienstActief(user){
  currentUserId = user.id;
  dienstGekozenOp = Date.now();
  instellingenOpenVoor = null;
  await saveUsers();
  pasGebruikersThemaToe();
  render();
}

/* Verplicht kiezen: geen sluitknop, Escape doet niets. Staat er al een ander
   venster open (import, pincode), dan wachten tot dat dicht is — de controle
   draait elke halve minuut opnieuw. */
function controleerDienst(){
  if(!dienstVraagNodig()) return;
  instellingenOpenVoor = null;   // ploegwissel: instellingen weer op slot
  if(document.getElementById('modalBackdrop')) return;
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'modalBackdrop';
  bd.innerHTML = `<div class="modal dienst-keuze">
      <h2>Wie heeft er dienst?</h2>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
        ${users.map(u => `<button type="button" class="btn ${u.id===currentUserId?'btn-primary':'btn-secondary'} dienst-naam" data-id="${esc(u.id)}">${esc(u.naam)}</button>`).join('')}
      </div>
    </div>`;
  toonModal(bd, { escape: false });
  bd.querySelectorAll('.dienst-naam').forEach(knop => knop.addEventListener('click', async () => {
    const user = users.find(u => u.id === knop.dataset.id);
    if(!user) return;
    closeModal();
    await maakDienstActief(user);
  }));
}

function openPinModal(user, onSuccess){
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'modalBackdrop';
  bd.innerHTML = `<div class="modal">
      <h2>Pincode voor ${esc(user.naam)}</h2>
      <div class="sub">Vul de pincode in om door te gaan.</div>
      <label class="alleen-voorlezer" for="pinInput">Pincode</label>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="6" autocomplete="current-password" aria-describedby="pinError" placeholder="••••" style="width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);padding:12px;font-size:20px;letter-spacing:6px;text-align:center;">
      <div id="pinError" role="alert" style="color:var(--danger);font-size:13px;margin-top:8px;display:none;">Onjuiste pincode.</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelPin">Annuleren</button>
        <button class="btn btn-primary" id="confirmPin">Bevestigen</button>
      </div>
    </div>`;
  toonModal(bd);
  const input = document.getElementById('pinInput');
  const foutmelding = document.getElementById('pinError');
  const bevestigKnop = document.getElementById('confirmPin');
  input.focus();
  document.getElementById('cancelPin').addEventListener('click', closeModal);

  function toonFout(tekst){
    foutmelding.textContent = tekst;
    foutmelding.style.display = 'block';
    // Het veld zelf meldt dat er iets mis is; role="alert" op de melding zorgt
    // dat hij ook voorgelezen wordt in plaats van alleen rood te kleuren.
    input.setAttribute('aria-invalid', 'true');
  }

  let bezig = false;
  async function tryConfirm(){
    if(bezig) return;
    const rest = pinBlokkadeRest(user.id);
    if(rest > 0){
      toonFout(`Te veel pogingen. Probeer over ${rest} seconden opnieuw.`);
      return;
    }
    bezig = true;
    bevestigKnop.disabled = true;
    try{
      const goed = await verifyUserPin(user, input.value);
      if(goed){
        wisPinPogingen(user.id);
        closeModal();
        // Nog de standaardpincode (1234): eerst een eigen kiezen (review H1).
        if(user.pinIsStandaard === true) openChangePinModal(user, { verplicht: true, naOpslaan: onSuccess });
        else onSuccess();
        return;
      }
      registreerPinFout(user.id);
      const nieuweRest = pinBlokkadeRest(user.id);
      toonFout(nieuweRest > 0
        ? `Onjuiste pincode. Te veel pogingen — wacht ${nieuweRest} seconden.`
        : 'Onjuiste pincode.');
      input.value = '';
    }catch(e){
      console.error('Pincodecontrole mislukt:', e);
      toonFout('Pincode kan niet gecontroleerd worden in deze browser.');
    }finally{
      bezig = false;
      bevestigKnop.disabled = false;
    }
  }
  bevestigKnop.addEventListener('click', tryConfirm);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') tryConfirm(); });
}

function openChangePinModal(user, { verplicht = false, naOpslaan = null } = {}){
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'modalBackdrop';
  bd.innerHTML = `<div class="modal">
      <h2>Pincode wijzigen</h2>
      <div class="sub">${verplicht ? 'Je hebt nog de standaardpincode. ' : ''}Kies een nieuwe pincode van 4 of 6 cijfers.</div>
      <input type="password" id="newPinInput" inputmode="numeric" maxlength="6" placeholder="Nieuwe pincode" style="width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);padding:12px;font-size:20px;letter-spacing:6px;text-align:center;">
      <div id="newPinError" style="color:var(--danger);font-size:13px;margin-top:8px;display:none;">Moet precies 4 of 6 cijfers zijn.</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelNewPin">Annuleren</button>
        <button class="btn btn-primary" id="confirmNewPin">Opslaan</button>
      </div>
    </div>`;
  toonModal(bd);
  // Verplicht: Annuleren betekent niet ontgrendelen, de standaardpincode blijft.
  document.getElementById('cancelNewPin').addEventListener('click', closeModal);
  document.getElementById('confirmNewPin').addEventListener('click', async () => {
    const val = document.getElementById('newPinInput').value;
    const fout = document.getElementById('newPinError');
    if(!/^\d{4}$|^\d{6}$/.test(val)){
      fout.textContent = 'Moet precies 4 of 6 cijfers zijn.';
      fout.style.display = 'block';
      return;
    }
    if(/^(\d)\1+$/.test(val) || val === '1234' || val === '123456'){
      fout.textContent = 'Kies een minder voor de hand liggende pincode.';
      fout.style.display = 'block';
      return;
    }
    try{
      await setUserPin(user, val);
      user.pinIsStandaard = false;
    }catch(e){
      console.error('Pincode instellen mislukt:', e);
      fout.textContent = 'Deze browser ondersteunt het veilig opslaan van een pincode niet.';
      fout.style.display = 'block';
      return;
    }
    await saveUsers();
    closeModal();
    if(naOpslaan) naOpslaan();
    else render();
  });
}

// Plekhouder voor een scheepsnaam die nergens (EECV, VH, HGK) bekend is. Een
// kaal "?" oogde als een fout in de gegevens; dit zegt met een woord en een
// title wat er werkelijk aan de hand is: het is nog niet ingevuld.
const ONBEKEND_VELD_HTML = '<span class="onbekend-veld" title="Nog niet bekend uit de EECV-, VH- of HGK-lijst">onbekend</span>';

function renderCard(trip, groupList, idx){
  const wrap = document.createElement('div');
  wrap.className = 'card-wrap';
  const stations = getKnownStations();
  const optionsHtml = stations.map(s => `<option value="${esc(s)}" ${s===trip.station?'selected':''}>${esc(s)}</option>`).join('')
    + `<option value="__new__">+ nieuwe…</option>`;
  const isFirst = !groupList || idx === 0;
  const isLast = !groupList || idx === groupList.length - 1;
  const accentColor = stationAccentColor(trip.station);
  const times = computeTripTimes(trip);
  const planbeginMs = trip.planbegin ? new Date(trip.planbegin).getTime() : null;
  const planeindeMs = trip.planeinde ? new Date(trip.planeinde).getTime() : null;
  const planbeginBad = times.aankomstMs != null && planbeginMs != null && planbeginMs < times.aankomstMs;
  const planeindeBad = times.vertrekMs != null && planeindeMs != null && planeindeMs > times.vertrekMs;
  const orderControlsHtml = `<div class="order-controls">
          <button type="button" class="order-btn" data-dir="up" ${isFirst?'disabled':''} aria-label="Tegel naar boven" title="Naar boven"><span aria-hidden="true">▲</span></button>
          <button type="button" class="order-btn" data-dir="down" ${isLast?'disabled':''} aria-label="Tegel naar beneden" title="Naar beneden"><span aria-hidden="true">▼</span></button>
        </div>`;
  const stationSelectHtml = `<div class="station-badge"><select class="station-select" aria-label="Binnenbelader voor ${esc(trip.schubboot || 'deze reis')}">${optionsHtml}</select></div>`;
  // Zonder liegeplaats is de zichtbare tekst een kastlijntje, en dat is geen
  // naam. De waarde blijft er letterlijk in staan, zodat spraakbediening de
  // knop op zijn zichtbare tekst kan vinden.
  // "1e lengte" bestaat op beide kades; erts/kolen erbij (rest van idee 8).
  // Alleen als de machine er ook bij kan, anders zegt de kade niets.
  const lengteKade = trip.liegeplaats && laadlengteBereikbaar(trip).includes(trip.liegeplaats)
    ? laadlengteKade(trip, trip.liegeplaats) : '';
  const lengteKnopHtml = `<button type="button" class="lengte-badge lengte-knop"
                  aria-label="Laadlengte ${esc(trip.liegeplaats) || 'nog niet gekozen'}${lengteKade ? ' ' + lengteKade : ''} — tik om klaar om te laden te zetten"
                  title="Tik: klaar om te laden. Ingedrukt houden: andere laadlengte kiezen.">${esc(trip.liegeplaats || '—')}${lengteKade ? ` · ${lengteKade}` : ''}</button>`;
  /* De vier tijden waren vier stempels in een 2×2-rooster op 10 px. Het zijn
     geen vier losse feiten maar één tijdvak: je komt aan, wacht, laadt, en
     vertrekt. Als balk lees je die vorm meteen — en naast elkaar op één schaal
     zie je ook welke ritten elkaar in de weg zitten.

     Zonder plantijden (of met maar één rit in beeld, dan is er geen schaal om
     op te vergelijken) valt het terug op de oude regels: dan is een balk
     zonder venster misleidend, en vier stempels nog altijd leesbaar. */
  const botsingen = planlijstBotsingen.get(trip.id) || [];
  const pbPct = planlijstPct(planbeginMs), pePct = planlijstPct(planeindeMs);
  const uurTekst = (ms) => (ms / 3600000).toFixed(1).replace('.', ',') + ' u';

  const cardTimesHtml = (planlijstVenster && pbPct != null && pePct != null) ? (() => {
    const aPct = planlijstPct(times.aankomstMs);
    const vPct = planlijstPct(times.vertrekMs);
    const wachtVan = aPct != null ? Math.min(aPct, pbPct) : pbPct;
    return `<div class="rit-tijdvak">
          <div class="rit-balk" data-botsing="${botsingen.length ? 'ja' : 'nee'}"
               title="${esc(times.aankomstDisplay)} aangekomen · laden ${fmtDateTime(trip.planbegin)} tot ${fmtDateTime(trip.planeinde)} · vertrek ${esc(times.vertrekDisplay)}">
            <span class="spoor"></span>
            <span class="wacht" style="left:${wachtVan}%;width:${Math.max(0, pbPct - wachtVan)}%"></span>
            <span class="laden" style="left:${pbPct}%;width:${Math.max(1, pePct - pbPct)}%"></span>
            ${aPct != null ? `<span class="merk" style="left:${aPct}%"></span>` : ''}
            ${vPct != null ? `<span class="merk vertrek" style="left:${vPct}%"></span>` : ''}
          </div>
          <div class="rit-tijden">
            <span${planbeginBad ? ' class="fout"' : ''}>${fmtDateTime(trip.planbegin)}</span>
            <span class="duur">laden ${uurTekst(planeindeMs - planbeginMs)}</span>
            <span${planeindeBad ? ' class="fout"' : ''}>${fmtDateTime(trip.planeinde)}</span>
          </div>
        </div>`;
  })() : `<div class="card-times">
          <div>Aankomst <b>${esc(times.aankomstDisplay)}</b></div>
          <div>Planbegin <b${planbeginBad?' class="time-bad"':''}>${fmtDateTime(trip.planbegin)}</b></div>
          <div>Planeinde <b${planeindeBad?' class="time-bad"':''}>${fmtDateTime(trip.planeinde)}</b></div>
          <div>Vertrek <b>${esc(times.vertrekDisplay)}</b></div>
        </div>`;

  /* Kop op één regel: [▲▼] [laadlengte] [——tijdbalk——] [B-machine]. De
     tijdbalk zit in de 1fr-kolom tussen de laadlengte en de vierkante B-knop
     rechts, zodat hij de volle vrije breedte pakt in plaats van op een eigen
     regel eronder te staan (dat kostte een hele regel tegel­hoogte). Op smal
     scherm valt de balk via een media-query alsnog naar een eigen regel terug.

     De "gepland:"- en "verdeeld:"-tags zijn zeldzaam (alleen bij een omplanning
     of een over meerdere plekken verdeelde set). Ze vallen daarom naar een
     eigen regel ónder de kop: zo maken ze de vierkante B-knop niet breder en
     drukken ze de tijdbalk niet weg. */
  const annotatiesHtml = [
    trip.liegeplaatsGepland && trip.liegeplaatsGepland !== trip.liegeplaats ? `<span class="was-tag left">laadlengte gepland: ${esc(trip.liegeplaatsGepland)}</span>` : '',
    trip.stationGepland && trip.stationGepland !== trip.station ? `<span class="was-tag left">B-machine gepland: ${esc(trip.stationGepland)}</span>` : '',
    havenVerdeeldTag(trip)
  ].filter(Boolean).join('');
  const cardTopHtml = `
      <div class="card-top">
        ${orderControlsHtml}
        <div class="lengte-col">
          ${lengteKnopHtml}
        </div>
        ${cardTimesHtml}
        <div class="station-col">
          ${stationSelectHtml}
        </div>
        ${annotatiesHtml ? `<div class="card-top-annotaties">${annotatiesHtml}</div>` : ''}
      </div>`;

  const rowsHtml = (() => {
          const displayGroups = buildDisplayRowGroups(trip);
          const refTonnage = referenceTonnageForTrip(displayGroups);
          const setInfo = setInfoVoorTegel(trip, displayGroups);
          const beugels = setBeugelKlassen(setInfo);
          // Waar de bakken in de haven liggen (1.356): tekst achter de bak
          // zolang de tegel half is overgebracht.
          const havenStand = trip.status === 'actief' ? havenTegelStand(trip) : null;
          return displayGroups.map((group, gIdx) => {
          const rIdx = group.indices[0];
          const set = setInfo[gIdx];
          const toonSet = set && set.kleur;
          const r = {
            leichter: group.rows[0].leichter,
            ankunftsboot: group.rows[0].ankunftsboot,
            materiaal: group.rows.map(x => x.materiaal || '—').join(' / '),
            menge: group.rows.map(x => x.menge || '?').join(' / '),
            kunde: [...new Set(group.rows.map(x => x.kunde).filter(Boolean))].join(' / ')
          };
          const isDeellading = group.rows.length > 1;
          let tonnageBad = false;
          if(isDeellading && refTonnage != null){
            const parts = group.rows.map(x => parseMenge(x.menge)).filter(n => n != null);
            if(parts.length === group.rows.length){
              const sum = parts.reduce((a,b) => a+b, 0);
              tonnageBad = Math.abs(sum - refTonnage) > 50;
            }
          }
          const isDummy = r.leichter && isDummyName(r.leichter);
          let vhLine = '';
          const anyListLoaded = vhBakken.length || hgkBakken.length;
          let manualFlag = false;
          let grp = null;
          if(!isDummy && r.leichter){
            grp = getEffectiveGroupForRow(r);
            if(grp){
              manualFlag = grp.manual;
            } else if(anyListLoaded){
              // Was een aparte tekstregel onder de rij ("niet gevonden in VH/HGK-
              // planning") — op verzoek nu een klein rood kruisje vlak achter de
              // baknaam. Zelfde tik-actie (openGroupPickerModal), alleen compacter.
              vhLine = `<button class="bak-mismatch" data-row-idx="${rIdx}" title="Niet gevonden in VH/HGK-planning — tik om handmatig aan een vertrekgroep te koppelen">✕</button>`;
            }
          }
          // scheepsnamen (geen VH/HGK/ANT/ANTV/WZ/ESP-patroon) leveren nooit een match op — geen melding nodig
          let ankomst, ankomstOnzeker = false;
          if(r.ankunftsboot && r.ankunftsboot.trim()){
            ankomst = esc(r.ankunftsboot);
          } else if(grp && grp.entry.schip){
            // EECV weet het niet — aanvullen met het schip dat VH/HGK bij deze bak noemt
            ankomst = esc(grp.entry.schip);
            ankomstOnzeker = true;
          } else {
            // Een kaal vraagteken zonder opschrift oogde als een storing in
            // plaats van "nog niet bekend".
            ankomst = ONBEKEND_VELD_HTML;
          }
          const vertrek = trip.schubboot ? esc(trip.schubboot) : ONBEKEND_VELD_HTML;
          // VH/HGK zijn leidend: wijkt de EECV-lijst af, dan kleurt die naam rood
          // en zetten we de juiste er klein achter.
          const controle = bootControle(trip, r);
          // De juiste naam (uit VH/HGK) staat vooraan en groot; wat de EECV-lijst
          // ervan maakte komt er klein en rood achter. Klopt alles, dan blijft de
          // naam gewoon in de normale kleur staan.
          const toon = (eecvNaam, juist, wat) => juist
            ? `<span class="boot-juist" title="Volgens de ${esc(lijstBotenVoorRegel(r).bron)}-lijst is de ${wat} ${esc(juist)}">${esc(juist)}</span>` +
              // eecvNaam is door de aanroeper al geëscaped; er nóg een keer
              // esc() overheen maakte van een & in een scheepsnaam "&amp;" in
              // de tooltip.
              `<span class="boot-fout" title="De EECV-lijst zegt ${eecvNaam} — dat klopt niet">${eecvNaam}</span>`
            : eecvNaam;
          const ankomstHtml = toon(ankomst, controle.aankomstJuist, 'aankomstboot');
          const vertrekHtml = toon(vertrek, controle.vertrekJuist, 'vertrekboot');
          // Zelflader (ingehuurd schip): aankomstboot, vertrekboot én bak dragen
          // dezelfde naam. Dan is het geen duwbak; de naam één keer tonen volstaat.
          const isZelflader = !isDummy && rijIsZelflader(trip, r);
          const shipNameHtml = isZelflader
            ? `<span class="ship-name zelflader" title="Zelflader: aankomstboot, vertrekboot en bak dragen dezelfde naam — ingehuurd schip, geen duwbak">zelflader${manualFlag?' ✎':''}</span>`
            : `<span class="ship-name">${ankomstHtml}${ankomstOnzeker?'<span class="onzeker" title="Niet bekend uit de EECV-lijst, aangevuld vanuit VH/HGK">?</span>':''} &rarr; ${vertrekHtml}${manualFlag?' ✎':''}</span>`;
          const bakStatus = group.rows[0].bakStatus || null;
          let bakHtml;
          if(isDummy){
            bakHtml = `<button class="bak-nummer dummy-pending" data-row-idx="${rIdx}" title="Tik om de echte baknaam in te vullen">${esc(r.leichter)}</button>`;
          } else {
            // Hoort de bak bij een set die over meerdere tegels ligt, dan
            // krijgt hij dezelfde gekleurde rand als op de kade.
            const setTitel = toonSet
              ? `Gaat samen de berg op met ${set.aantal - 1} andere bak${set.aantal === 2 ? '' : 'ken'}${
                  set.boot ? ` achter ${set.boot}` : ''}` +
                (set.elders
                  ? ` — ${set.elders} daarvan ${set.elders === 1 ? 'staat' : 'staan'} niet op deze tegel.`
                  : ` — de hele set staat op deze tegel.`) +
                ` Tik om de status van deze bak aan te passen.`
              : 'Tik om de status van deze bak aan te passen';
            bakHtml = `<button class="bak-nummer bak-status-btn${toonSet ? ' in-set' : ''}"${
              toonSet ? ` style="border-color:${safeColor(set.kleur)}"` : ''
            } data-row-indices="${group.indices.join(',')}" title="${esc(setTitel)}">${esc(r.leichter)||'—'}</button>${group.rows[0]._dummyLabel ? ` <button class="dummy-edit-btn" data-row-idx="${rIdx}" aria-label="Baknaam wijzigen voor ${esc(r.leichter) || 'deze regel'}" title="Baknaam wijzigen"><span aria-hidden="true">✎</span></button>` : ''}`;
          }
          const statusTagHtml = bakStatus === 'niet_aanwezig' ? '<span class="status-tag">niet aanwezig</span>'
            : bakStatus === 'repareren' ? '<span class="status-tag repareren" title="Moet repareren"><span aria-hidden="true">⚙</span> Repareren</span>' : '';
          const havenZone = havenStand && havenStand.zoneVan(group.rows[0]);
          const plekTagHtml = havenZone === 'vol' ? '<span class="plek-tag">vol op ankerplaats</span>'
            : havenZone === 'leeg' && havenStand.deelsOvergebracht ? '<span class="plek-tag">ligt nog op lege bakkenplaats</span>' : '';
          const rowStatusClass = bakStatus === 'niet_aanwezig' ? ' status-niet-aanwezig' : bakStatus === 'repareren' ? ' status-repareren' : '';
          // De ⇄ is op de tablet het enige dat deze knop benoemt: daar is geen
          // muisaanwijzer, dus de title verschijnt er nooit. De baknaam gaat mee
          // in de naam, want er staan er meerdere onder elkaar.
          const moveBtnHtml = `<button class="move-btn" data-row-indices="${group.indices.join(',')}"
                    aria-label="Verplaats ${esc(r.leichter) || 'deze bak'} naar een andere tegel"
                    title="Verplaats naar andere tegel"><span aria-hidden="true">⇄</span></button>`;
          return `<div class="card-row${rowStatusClass}${beugels[gIdx]}"${
            toonSet ? ` style="--setkleur:${safeColor(set.kleur)}"` : ''}>
            <div class="row-left">
              ${shipNameHtml}
              ${bakHtml}
              ${vhLine}
              ${statusTagHtml}
              ${plekTagHtml}
              <span class="erts" title="${esc(r.materiaal)}${isDeellading?' — deellading (2 soorten lading in 1 bak)':''}">${esc(r.materiaal)}</span>
            </div>
            <span class="tonnage${tonnageBad?' tonnage-bad':''}"${tonnageBad?' title="Som wijkt meer dan 50 ton af van een volle bak op deze tegel"':''}>${esc(r.menge)} t</span>
            <span class="kunde">${esc(r.kunde)}</span>
            ${moveBtnHtml}
          </div>`;
          }).join('');
        })();

  const footerHtml = (() => {
        // unieke sets (VH/HGK-groepen) van deze kaart, één keer getoond i.p.v. per bak-regel
        const ownRowNames = trip.rows.filter(r => r.leichter).map(r => r.leichter);
        const seenGroups = new Set();
        const setLines = [];
        trip.rows.forEach(r => {
          if(!r.leichter) return;
          const grp = getEffectiveGroupForRow(r);
          if(!grp) return;
          const { source, list } = grp;
          const gKey = grp.key;
          if(seenGroups.has(gKey)) return;
          seenGroups.add(gKey);
          const siblings = list.filter(v => bakGroupKey(v, source) === gKey);
          const elders = siblings.filter(s => !ownRowNames.some(n => bargeNamesMatch(s.naam, n)));
          if(!elders.length) return; // hele set staat al op deze tegel
          // groeperen per locatie (of VH/HGK-bestemming als de locatie nog
          // niet bekend is uit de actieve EECV-planning) — bakken die samen
          // op dezelfde tegel staan, komen achter elkaar met de plek er 1x achter.
          // Een gewone ladingsoort (erts/kolen/koks) is geen nuttige locatie-info
          // en laten we hier weg; iets specifieks zoals "VKV LADEN EMO" wel.
          const tagGroups = new Map();
          elders.forEach(s => {
            const bestemmingBruikbaar = s.bestemming && !/^(erts|kolen|koks|cokes)$/i.test(s.bestemming.trim());
            const tag = findBargeLocation(s.naam) || (bestemmingBruikbaar ? s.bestemming : '') || '';
            if(!tagGroups.has(tag)) tagGroups.set(tag, []);
            tagGroups.get(tag).push(s.naam);
          });
          const parts = [];
          tagGroups.forEach((names, tag) => {
            parts.push(tag ? `${names.map(esc).join(', ')} (${esc(tag)})` : names.map(esc).join(', '));
          });
          // welke duwboot deze set meeneemt; staat in de Excel vaak maar op één
          // regel van de kleurgroep ingevuld, dus pak de eerste die hem heeft
          const setVertrekboot = (siblings.find(v => v.vertrekboot) || {}).vertrekboot;
          setLines.push(`<div>Set van ${siblings.length}${
            setVertrekboot ? ` voor ${esc(setVertrekboot)}` : ''
          }: ${parts.join(', ')}</div>`);
        });
        /* Een lege notitie-textarea stond vroeger op élke tegel en kostte zo
           een vaste regel hoogte die bijna altijd leeg bleef. Zonder notitie
           tonen we nu een klein "+ notitie"-knopje; bij een tik verschijnt het
           echte veld (zie de handler hieronder). Staat er al tekst, dan blijft
           het veld gewoon meteen zichtbaar. */
        const heeftNotitie = (trip.note || '').trim() !== '';
        const notitieHtml = heeftNotitie
          ? `<div class="card-note">
              <textarea placeholder="Notitie…" aria-label="Notitie bij ${esc(trip.schubboot || 'deze reis')}">${esc(trip.note)}</textarea>
            </div>`
          : `<button type="button" class="notitie-toevoegen" aria-label="Notitie toevoegen bij ${esc(trip.schubboot || 'deze reis')}">+ notitie</button>`;
        return `<div class="card-footer${heeftNotitie ? '' : ' leeg'}">
          ${notitieHtml}
        </div>
        ${setLines.length ? `<div class="vh-set-footer">${setLines.join('')}</div>` : ''}`;
      })();

  wrap.innerHTML = `
    <div class="card-bg right">✓ Afronden</div>
    <div class="card${trip.aangemeerd?' aangemeerd':''}${trip.klaarOmTeLaden?' klaar-laden':''}" data-id="${trip.id}">
      ${cardTopHtml}
      <div class="card-rows">
        ${rowsHtml}
      </div>
      ${footerHtml}
    </div>
  `;

  const card = wrap.querySelector('.card');

  // De notitie-textarea bestaat alleen nog als er al tekst staat (zie footer).
  // Eén plek die een textarea bedienbaar maakt, zodat het ook klopt voor het
  // veld dat pas na "+ notitie" wordt ingevoegd.
  function wireNotitie(textarea){
    textarea.addEventListener('pointerdown', e => e.stopPropagation());
    textarea.addEventListener('click', e => e.stopPropagation());
    textarea.addEventListener('change', async () => {
      await logAction(`Notitie gewijzigd: ${trip.schubboot||'?'} (${trip.station||'?'})`);
      trip.note = textarea.value;
      saveTrips();
    });
  }
  const bestaandeNotitie = wrap.querySelector('.card-note textarea');
  if(bestaandeNotitie) wireNotitie(bestaandeNotitie);

  const notitieKnop = wrap.querySelector('.notitie-toevoegen');
  if(notitieKnop){
    notitieKnop.addEventListener('pointerdown', e => e.stopPropagation());
    notitieKnop.addEventListener('click', (e) => {
      e.stopPropagation();
      const footer = notitieKnop.closest('.card-footer');
      footer.classList.remove('leeg');
      footer.innerHTML = `<div class="card-note">
        <textarea placeholder="Notitie…" aria-label="Notitie bij ${esc(trip.schubboot || 'deze reis')}"></textarea>
      </div>`;
      const ta = footer.querySelector('textarea');
      wireNotitie(ta);
      ta.focus();
    });
  }

  wrap.querySelectorAll('.bak-mismatch').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openGroupPickerModal(trip, +btn.dataset.rowIdx);
    });
  });

  wrap.querySelectorAll('.dummy-pending, .dummy-edit-btn').forEach(el => {
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openDummyNameModal(trip, +el.dataset.rowIdx);
    });
  });

  wrap.querySelectorAll('.bak-status-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openBakStatusModal(trip, btn.dataset.rowIndices.split(',').map(Number));
    });
  });

  // Afgekapte ertssoort: een tik klapt de volledige naam uit (en weer in). Op de
  // tablet is er geen muis, dus de title-tooltip verschijnt daar nooit — dit is
  // de manier om de hele naam te zien. stopPropagation zodat de tik de tegel
  // niet laat vegen of slepen.
  wrap.querySelectorAll('.erts').forEach(el => {
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      el.classList.toggle('erts-open');
    });
  });

  wrap.querySelectorAll('.move-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openMoveBakModal(trip, btn.dataset.rowIndices.split(',').map(Number));
    });
  });

  wrap.querySelectorAll('.order-btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(btn.disabled || !groupList) return;
      const dir = btn.dataset.dir;
      const swapIdx = dir === 'up' ? idx - 1 : idx + 1;
      if(swapIdx < 0 || swapIdx >= groupList.length) return;
      const other = groupList[swapIdx];
      await logAction(`Tegel herschikt: ${trip.schubboot||'?'} ${dir === 'up' ? 'omhoog' : 'omlaag'} (${trip.station||'?'})`);
      const tmp = trip.order ?? trip.planbegin ?? 0;
      trip.order = other.order ?? other.planbegin ?? 0;
      other.order = tmp;
      saveTrips();
      render();
    });
  });

  const stationSelect = wrap.querySelector('.station-select');
  stationSelect.addEventListener('click', e => e.stopPropagation());
  stationSelect.addEventListener('pointerdown', e => e.stopPropagation());
  stationSelect.addEventListener('change', async () => {
    let value = stationSelect.value;
    if(value === '__new__'){
      const custom = await vraagTekst({
        titel: 'Nieuwe binnenbelader',
        uitleg: 'Hoe heet de machine die je wilt toevoegen?',
        placeholder: 'bijv. B5',
        maxLengte: 20,
        bevestig: 'Toevoegen'
      });
      if(!custom){ stationSelect.value = trip.station; return; }
      value = custom;
    }
    await logAction(`B-machine gewijzigd: ${trip.station||'?'} → ${value} (${trip.schubboot||'?'})`);
    trip.station = value;
    saveTrips();
    render();
  });

  /* De laadlengte was een keuzelijst: elke aanraking klapte hem open, ook als
     je alleen "klaar om te laden" wilde zetten. Nu doet de knop twee dingen:
     kort tikken zet klaar om te laden, ingedrukt houden opent de keuze. */
  const lengteKnop = wrap.querySelector('.lengte-knop');
  if(lengteKnop){
    const LANG_INGEDRUKT_MS = 500;
    const SCHUIF_GRENS = 8;      // hierboven telt het als slepen, niet als tik
    let timer = null, startX = 0, startY = 0, langGedaan = false;

    const stop = () => { if(timer){ clearTimeout(timer); timer = null; } };

    lengteKnop.addEventListener('click', e => e.stopPropagation());
    lengteKnop.addEventListener('pointerdown', e => {
      e.stopPropagation();
      langGedaan = false;
      startX = e.clientX; startY = e.clientY;
      stop();
      timer = setTimeout(() => {
        timer = null;
        langGedaan = true;
        if(navigator.vibrate) navigator.vibrate(12);   // voelbaar op de tablet
        openLaadlengteModal(trip);
      }, LANG_INGEDRUKT_MS);
    });
    lengteKnop.addEventListener('pointermove', e => {
      if(!timer) return;
      if(Math.abs(e.clientX - startX) > SCHUIF_GRENS || Math.abs(e.clientY - startY) > SCHUIF_GRENS) stop();
    });
    lengteKnop.addEventListener('pointerup', e => {
      e.stopPropagation();
      if(langGedaan) return;     // de keuze staat al open
      if(!timer) return;         // afgebroken door schuiven
      stop();
      toggleKlaarOmTeLaden(trip, card);
    });
    lengteKnop.addEventListener('pointercancel', stop);
    lengteKnop.addEventListener('pointerleave', stop);
  }

  attachSwipe(card, wrap, trip);
  return wrap;
}

function getKnownStations(){
  const set = new Set(trips.map(t => t.station).filter(Boolean));
  ['B2','B3','B4','MB1'].forEach(s => set.add(s));
  return Array.from(set).sort();
}

/* ---------------------------------------------------------------
   SNELZOEKEN — Ctrl+K, "/" of de Zoeken-knop. Sinds 1.272 een rekenmachine voor
   baknamen: bovenin wat je intikt, links de voorvoegsels (VH, HGK, ESP, ANT,
   ANC, WZ), rechts een numpad. Voorvoegsel + cijfers geeft de bak; Enter springt
   naar de bovenste tegel (zoek-flits). De ABC-knop haalt het letterstoetsenbord
   erbij, voor namen zonder voorvoegsel en voor schepen. De acties (lijsten
   inlezen, thema, enzovoort) zijn eruit: die staan al in de topbalk en het ⋯-menu.
--------------------------------------------------------------- */
function snelzoekNorm(t){ return String(t || '').toLowerCase().replace(/[\s._-]+/g, ''); }

const SNELZOEK_VOOR = [['VH','VH'], ['HGK','HGK'], ['ESP','ESP'], ['ANT','ANT'], ['ANC','ANCIS'], ['WZ','WZ']];

// Eigen letter-toetsenbord (QWERTY) voor het zoeken op namen en schepen. Bewust
// een eigen toetsenbord en niet dat van de tablet: dat komt niet op bij
// programmatische focus (iOS) en dekt, als het wél opkomt, de resultatenlijst
// af. Dit staat ín het zoekpaneel, boven de resultaten, en is overal gelijk.
const SNELZOEK_ABC_RIJEN = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
function snelzoekLetterToetsenbordHtml(){
  const toets = (l) => `<button type="button" class="snelzoek-toets" data-letter="${l}" aria-label="${l}">${l}</button>`;
  const rijen = SNELZOEK_ABC_RIJEN.map((rij, i) =>
    `<div class="snelzoek-abc-rij">${[...rij].map(toets).join('')}${
      i === SNELZOEK_ABC_RIJEN.length - 1 ? '<button type="button" class="snelzoek-toets" data-letter-ctrl="back" aria-label="Wis laatste teken">⌫</button>' : ''
    }</div>`).join('');
  return `<div class="snelzoek-abc" role="group" aria-label="Letters">${rijen}
    <div class="snelzoek-abc-rij">
      <button type="button" class="snelzoek-toets snelzoek-spatie" data-letter=" " aria-label="Spatie">spatie</button>
      <button type="button" class="snelzoek-toets ok" data-letter-ctrl="enter" aria-label="Open de bovenste bak">↵</button>
    </div></div>`;
}

// De letters die iemand typt naar een familie. ANC is de afkorting op het toetsenblok; AN en ANCIS kent de app al.
function snelzoekFamilies(letters){
  return letters === 'ANC' ? ['ANCIS'] : bargeFamiliesOf(letters);
}
function snelzoekIsFamilie(letters){
  return letters === 'ANC' || letters === 'A' || PREFIX_FAMILIES.some(f => f.variants.includes(letters));
}

function snelzoekIndex(){
  const items = [];
  const actief = trips.filter(t => t.status === 'actief');
  const opPlanlijst = new Set();
  const bak = (naam, rest) => {
    const t = parseBargeToken(naam);
    items.push({ groep:'Bakken', wat: naam, fam: t ? bargeFamiliesOf(t.prefix) : [], num: t ? t.number : '', ...rest });
  };
  /* Schepen (1.364): elk schip één regel met zijn bakken als chips eronder —
     de duwboot van een reis (brengt), en uit VH/HGK de boot die bakken komt
     halen en het schip dat bakken brengt die nog niet op de planlijst staan. */
  const kort = n => verkortSchipnaam(n) || n;
  const reisVan = new Map();   // schip -> zijn reis-regel, zodat VH/HGK-bakken van hetzelfde schip daarbij komen
  const schip = (naam, tekst, waar, bakken, naarBak, naarAlles) => {
    const it = { groep:'Schepen', wat: kort(naam), tekst, waar, zoek: naam, chips: bakken.map(b => ({ naam: b, doe: () => naarBak(b) })), doe: naarAlles };
    items.push(it); return it;
  };
  const haalt = new Map(), brengt = new Map();
  const bijSchip = (map, naam, bak) => { const k = snelzoekNorm(kort(naam)); if(!map.has(k)) map.set(k, { naam, bakken: [] }); const s = map.get(k); if(!s.bakken.some(b => normalizeBargeName(b) === normalizeBargeName(bak))) s.bakken.push(bak); };
  actief.forEach(t => {
    const boot = verkortSchipnaam(t.schubboot) || t.schubboot || '—';
    const ophalers = vertrekbotenVoorTrip(t);
    const bakken = [...new Set((t.rows || []).map(r => r.leichter).filter(n => n && !isDummyName(n)))];
    const it = schip(t.schubboot || boot, [`brengt ${bakken.length}`, ophalers.length ? `→ ${ophalers.join(', ')}` : t.liegeplaats].filter(Boolean).join(' · '),
      `${t.station || '?'}${t.liegeplaats ? ' · ' + t.liegeplaats : ''}`, bakken, b => snelzoekNaarTegel(t.id, b), () => snelzoekNaarTegel(t.id));
    it.bakken = bakken.length;
    if(!reisVan.has(snelzoekNorm(it.wat))) reisVan.set(snelzoekNorm(it.wat), it);
    (t.rows || []).forEach(r => {
      if(!r.leichter || isDummyName(r.leichter)) return;
      const sleutel = normalizeBargeName(r.leichter);
      if(opPlanlijst.has(sleutel + t.id)) return;
      opPlanlijst.add(sleutel + t.id); opPlanlijst.add(sleutel);
      const ton = r.menge ? `${r.menge} t` : '';
      bak(r.leichter, { tekst: [r.materiaal, ton, r.kunde].filter(Boolean).join(' · '),
        waar: `${t.station || '?'} · ${boot}`, zoek: [r.leichter, r.kunde].join(' '), doe: () => snelzoekNaarTegel(t.id, r.leichter) });
    });
  });
  // Bakken die (nog) niet op de planlijst staan: onderweg of alleen in VH/HGK.
  [...(vhBakken || []), ...(hgkBakken || [])].forEach(v => {
    if(!v || !v.naam) return;
    const echt = !isDummyName(v.naam);
    if(echt && v.vertrekboot) bijSchip(haalt, v.vertrekboot, v.naam);
    if(opPlanlijst.has(normalizeBargeName(v.naam))) return;
    opPlanlijst.add(normalizeBargeName(v.naam));
    if(echt && v.schip) bijSchip(brengt, v.schip, v.naam);
    /* Waar hij écht ligt (haven, Onderweg of Elders: EMO…) en bij welke set hij
       moet komen — niet blind "Haven": een bak bij de EMO staat wel als ghost in
       zijn set op de volle plaats, maar ligt nog niet hier. */
    const set = v.vertrekboot ? `hoort bij set ${verkortSchipnaam(v.vertrekboot) || v.vertrekboot}` : '';
    bak(v.naam, { tekst: [v.schip ? `met ${v.schip}` : '', set].filter(Boolean).join(' · '),
      waar: taakBakWaar(v.naam).tekst, zoek: v.naam, doe: () => snelzoekNaarBak(v.naam) });
  });
  brengt.forEach((s, k) => {
    const reis = reisVan.get(k);
    if(!reis) return schip(s.naam, `brengt ${s.bakken.length}`, taakBakWaar(s.bakken[0]).tekst, s.bakken, b => snelzoekNaarBak(b), () => snelzoekNaarBak(s.bakken));
    s.bakken.forEach(b => reis.chips.push({ naam: b, doe: () => snelzoekNaarBak(b) }));
    reis.tekst = reis.tekst.replace(`brengt ${reis.bakken}`, `brengt ${reis.chips.length}`);
  });
  haalt.forEach(s => schip(s.naam, `haalt ${s.bakken.length}`, 'vertrek', s.bakken, b => snelzoekNaarBak(b), () => snelzoekNaarBak(s.bakken, true)));
  return items;
}

/* Wat er getypt staat naar treffers. Voorvoegsel (en/of cijfers): de bak moet bij
   die familie horen en zijn nummer moet met die cijfers beginnen. Letters die geen
   voorvoegsel zijn (een naam, een schip): gewoon in de tekst zoeken. */
function snelzoekTreffers(index, invoer){
  const v = invoer.trim();
  if(!v) return [];
  const m = v.toUpperCase().match(/^([A-Z]*)\s*(\d*)$/);
  if(m && (!m[1] || snelzoekIsFamilie(m[1]))){
    const fams = m[1] ? snelzoekFamilies(m[1]) : null, cijfers = m[2];
    return index.filter(it => it.groep === 'Bakken' && it.num && it.num.startsWith(cijfers) && (!fams || it.fam.some(f => fams.includes(f))))
      .sort((a, b) => (b.num === cijfers) - (a.num === cijfers) || a.num.length - b.num.length || (+a.num) - (+b.num));
  }
  const vraag = snelzoekNorm(v);
  // Schepen boven bakken (1.364), zodat elke groep één blok onder zijn kop is.
  const schipEerst = it => it.groep === 'Schepen' ? 0 : 1;
  return index.filter(it => snelzoekNorm(it.zoek + ' ' + it.wat).includes(vraag))
    .sort((a, b) => schipEerst(a) - schipEerst(b) || (snelzoekNorm(b.wat).startsWith(vraag) - snelzoekNorm(a.wat).startsWith(vraag)));
}

function snelzoekNaarTab(tab){ gaNaar(tab); }

/* bakNaam (vanuit Zoeken op een bak): de bak zelf in de tegel in beeld en
   laten knipperen, net als in de haven (zoek-puls). De tegel knippert in
   hetzelfde ritme mee (zoek-flits, 5 × 0,7 s). */
function snelzoekNaarTegel(tripId, bakNaam){
  stationKeuze.clear();
  if(currentTab !== 'planlijst') snelzoekNaarTab('planlijst'); else render();
  requestAnimationFrame(() => {
    const kaart = document.querySelector(`.card[data-id="${CSS.escape(tripId)}"]`);
    if(!kaart) return;
    const sleutel = bakNaam && normalizeBargeName(bakNaam);
    const bak = sleutel && [...kaart.querySelectorAll('.bak-nummer')].find(b => normalizeBargeName(b.textContent) === sleutel);
    (bak || kaart).scrollIntoView({ block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    kaart.classList.remove('zoek-flits'); void kaart.offsetWidth; kaart.classList.add('zoek-flits');
    setTimeout(() => kaart.classList.remove('zoek-flits'), 3600);
    if(bak){
      bak.classList.remove('zoek-puls'); void bak.offsetWidth; bak.classList.add('zoek-puls');
      setTimeout(() => bak.classList.remove('zoek-puls'), 4000);
    }
  });
}

/* Naar de haven en de bak laten opvallen: eerst in beeld scrollen (ook binnen
   een paneel als de volle plaats), dan een paar keer groot-klein knipperen.
   Ligt hij in de haven (tekening of bakkenplaats), dan knippert alleen die bak.
   Zo niet (Elders, Onderweg), dan knippert hij daar én zijn ghost in de set
   waar hij moet komen — scrollen gaat naar die ghost. Ligt het doel in een
   ingeklapte kolom, dan klapt die open.
   `namen` mag ook een lijst zijn (de loep op een aanwezige tegel, 1.352): dan
   knipperen ze allemaal oranje, scrollt het beeld naar de eerste, en met
   `metSetBlok` knippert ook het set-blok op de bakkenplaats waar ze liggen.
   `naarBak` (tik op een ghost, 1.355): scroll naar de bak zelf, niet naar de ghost. */
function snelzoekNaarBak(namen, metSetBlok, naarBak){
  snelzoekStopKnipperen();
  const lijst = [].concat(namen);
  // Op telefoonbreedte staat elk deel op een eigen tabje: kies dat van de bak (anders Onderweg, daar staat Elders).
  if(havenIsTelefoon()){
    const zone = (taakBakWaar(lijst[0]).bak || {}).zone;
    havenMobielTab = HAVEN_MOBIEL_TABS.some(t => t.id === zone) ? zone : 'onderweg';
  }
  gaNaar('haven');
  requestAnimationFrame(() => requestAnimationFrame(() => {   // na de scroll-herstel van gaNaar
    const doelen = lijst.flatMap(naam => {
      const s = CSS.escape(normalizeBargeName(naam));
      const inHaven = document.querySelector(`#havenSvg [data-bak="${s}"], [data-baksleutel="${s}"]`);
      return inHaven ? [inHaven] : [...document.querySelectorAll(`[data-zoeksleutel="${s}"]`)];
    });
    if(!doelen.length) return;
    const hoofd = doelen.find(d => d.classList.contains('ontbreekt') !== !!naarBak) || doelen[0];
    doelen.forEach(d => d.closest('[data-paneel].dicht')?.classList.remove('dicht'));
    const zacht = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
    /* De andere doelen (de bak bij Elders) staan vaak in een eigen scrollende
       kolom: die kolom zelf scrollen, niet de pagina — anders trekt hij de ghost
       weer uit beeld. Twee scrollIntoView's tegelijk breken elkaar af — dus ook
       per kolom maar één keer, en niet de kolom waar het hoofddoel in staat. */
    const gescrold = new Set();
    doelen.filter(d => d !== hoofd).forEach(d => {
      let bak = d.parentElement;
      while(bak && !(bak.scrollHeight > bak.clientHeight && /auto|scroll/.test(getComputedStyle(bak).overflowY))) bak = bak.parentElement;
      if(!bak || bak === document.scrollingElement || bak === document.body) return;
      if(gescrold.has(bak) || bak.contains(hoofd)) return;
      gescrold.add(bak);
      const r = d.getBoundingClientRect(), k = bak.getBoundingClientRect();
      bak.scrollBy({ top: (r.top + r.height / 2) - (k.top + k.height / 2), behavior: zacht });
    });
    hoofd.scrollIntoView({ block:'center', inline:'center', behavior: zacht });
    doelen.forEach(d => {
      // In de SVG draagt de <g> zijn plek als transform; schalen dus op het vlak erin.
      const puls = d.matches('g') ? d.querySelector('.haven-bak-vlak') || d : d;
      snelzoekKnipper(puls, 'zoek-puls');
    });
    if(metSetBlok) new Set(doelen.map(d => d.closest('.plaats-set')).filter(Boolean))
      .forEach(blok => snelzoekKnipper(blok, 'zoek-blok'));
    snelzoekSetgenotenKnipperen(lijst);
  }));
}

/* In de haven blijft het knipperen doorgaan tot je ergens tikt of klikt, of
   tot 15 s voorbij zijn (1.337) — 3,5 s was te kort om alle setgenoten te
   vinden. Een nieuwe zoekopdracht stopt eerst het vorige knipperen. */
const SNELZOEK_KNIPPER_MAX_MS = 15000;
let snelzoekKnippert = [], snelzoekKnipperStop = null;
function snelzoekStopKnipperen(){
  snelzoekKnippert.forEach(([el, klasse]) => el.classList.remove(klasse, 'zoek-blijf'));
  snelzoekKnippert = [];
  if(snelzoekKnipperStop){ snelzoekKnipperStop(); snelzoekKnipperStop = null; }
}
function snelzoekKnipper(el, klasse){
  if(!snelzoekKnipperStop){
    const tik = () => snelzoekStopKnipperen();
    const timer = setTimeout(tik, SNELZOEK_KNIPPER_MAX_MS);
    document.addEventListener('pointerdown', tik, true);
    snelzoekKnipperStop = () => { clearTimeout(timer); document.removeEventListener('pointerdown', tik, true); };
  }
  el.classList.remove(klasse); void el.getBoundingClientRect(); el.classList.add(klasse, 'zoek-blijf');
  snelzoekKnippert.push([el, klasse]);
}

/* De bakken die bij dezelfde set horen knipperen mee, in de kleur van die set
   — zonder de oranje ring, die blijft voor de bak die je zocht (1.336). Waar ze
   ook staan: haven, bakkenplaats, Onderweg of Elders. Meerdere namen (de
   loep op een tegel): elke set één keer, en de gezochte bakken zelf niet. */
function snelzoekSetgenotenKnipperen(namen){
  const zelf = new Set([].concat(namen).map(normalizeBargeName));
  const keys = new Set();
  zelf.forEach(z => {
    let key = (havenBakken().find(b => b.sleutel === z) || {}).setKey;
    if(!key) [['VH', vhBakken], ['HGK', hgkBakken]].some(([bron, lijst]) => {
      const v = (lijst || []).find(x => x.naam && normalizeBargeName(x.naam) === z);
      if(v) key = bakGroupKey(v, bron);
      return !!v;
    });
    if(key) keys.add(key);
  });
  keys.forEach(key => {
    const genoten = new Set(havenBakken().filter(b => b.setKey === key).map(b => b.sleutel));
    [['VH', vhBakken], ['HGK', hgkBakken]].forEach(([bron, lijst]) => (lijst || []).forEach(v => {
      if(v.naam && bakGroupKey(v, bron) === key) genoten.add(normalizeBargeName(v.naam));
    }));
    zelf.forEach(z => genoten.delete(z));
    const kleur = safeColor(vhGroupColorMap.get(key) || '#8D98A5');
    genoten.forEach(s => {
      const k = CSS.escape(s);
      document.querySelectorAll(`#havenSvg [data-bak="${k}"], [data-baksleutel="${k}"], [data-zoeksleutel="${k}"]`).forEach(d => {
        const puls = d.matches('g') ? d.querySelector('.haven-bak-vlak') || d : d;
        puls.style.setProperty('--zoek-kleur', kleur);
        snelzoekKnipper(puls, 'zoek-puls-set');
      });
    });
  });
}

function snelzoekMarkeer(tekst, vraag){
  const t = String(tekst || '');
  if(!vraag) return esc(t);
  // Treffer op genormaliseerde tekens terugvinden in de echte tekst.
  const plat = [], pos = [];
  for(let i = 0; i < t.length; i++){ if(!/[\s._-]/.test(t[i])){ plat.push(t[i].toLowerCase()); pos.push(i); } }
  const at = plat.join('').indexOf(vraag);
  if(at < 0) return esc(t);
  const van = pos[at], tot = pos[at + vraag.length - 1] + 1;
  return esc(t.slice(0, van)) + '<mark>' + esc(t.slice(van, tot)) + '</mark>' + esc(t.slice(tot));
}

/* opties maakt van hetzelfde scherm een kiezer (zie kiesVertrekboot): eigen
   lijst, voorvoegsels, treffers en teksten. Zonder opties: gewoon Zoeken. */
function openSnelzoeken(opties = {}){
  closeModal();
  const index = opties.index || snelzoekIndex();
  const voor = opties.voor || SNELZOEK_VOOR;
  const vindTreffers = opties.treffers || snelzoekTreffers;
  const isFamilie = opties.isFamilie || snelzoekIsFamilie;
  const families = opties.families || snelzoekFamilies;
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop snelzoek-backdrop';
  bd.id = 'modalBackdrop';
  bd.setAttribute('aria-label', opties.label || 'Bak zoeken');
  bd.innerHTML = `<div class="snelzoek">
      <div class="snelzoek-veld">
        <input type="text" id="snelzoekInvoer" inputmode="none" placeholder="${esc(opties.placeholder || 'bijv. ESP 480 of een schip')}" autocomplete="off" spellcheck="false" aria-controls="snelzoekLijst" aria-label="${esc(opties.label || 'Baknaam of nummer')}">
        <button type="button" class="snelzoek-klein" id="snelzoekAbc" aria-pressed="false" title="Letterstoetsenbord voor namen en schepen">ABC</button>
        <button type="button" class="snelzoek-klein" id="snelzoekWis" title="Veld leegmaken">Wis</button>
        <button type="button" class="snelzoek-sluit" aria-label="Sluiten">Sluit</button></div>
      <div class="snelzoek-lijst" id="snelzoekLijst" role="listbox" aria-label="Gevonden bakken"></div>
      <div class="snelzoek-toetsen">
        <div class="snelzoek-voor" role="group" aria-label="Voorvoegsel">${voor.map(([naam, fam]) =>
          `<button type="button" class="snelzoek-toets" data-voor="${fam}" data-naam="${naam}" aria-pressed="false">${naam}</button>`).join('')}</div>
        <div class="snelzoek-num" role="group" aria-label="Cijfers">${['1','2','3','4','5','6','7','8','9','⌫','0','↵'].map(t =>
          `<button type="button" class="snelzoek-toets${t === '↵' ? ' ok' : ''}" data-toets="${t}" aria-label="${t === '⌫' ? 'Wis laatste teken' : t === '↵' ? 'Open de bovenste bak' : t}">${t}</button>`).join('')}</div>
      </div>
      ${snelzoekLetterToetsenbordHtml()}
      <div class="snelzoek-voet"><span>Voorvoegsel nog een keer aantikken haalt het weg</span><span><span class="kbd">↵</span> opent de bovenste</span><span><span class="kbd">Esc</span> sluit</span></div>
    </div>`;
  toonModal(bd);
  const invoer = bd.querySelector('#snelzoekInvoer');
  const lijst = bd.querySelector('#snelzoekLijst');
  let treffers = [], gekozen = 0;
  const MAX = opties.max || 4;
  const leesVoorvoegsel = () => {
    const m = invoer.value.trim().toUpperCase().match(/^([A-Z]*)\s*(\d*)$/);
    return m && (!m[1] || isFamilie(m[1])) ? { fams: m[1] ? families(m[1]) : [], cijfers: m[2] } : { fams: [], cijfers: '' };
  };
  const teken = () => {
    treffers = vindTreffers(index, invoer.value);
    if(gekozen >= Math.min(treffers.length, MAX)) gekozen = 0;
    const vraag = snelzoekNorm(invoer.value);
    if(!vraag && !treffers.length) lijst.innerHTML = `<div class="snelzoek-leeg">${esc(opties.leegTekst || 'Kies een voorvoegsel en tik het nummer, of ABC voor een schip.')}</div>`;
    else if(!treffers.length) lijst.innerHTML = `<div class="snelzoek-leeg">${esc(opties.nietsTekst || 'Geen bak of schip gevonden voor')} “${esc(invoer.value.trim())}”.</div>`;
    else {
      // Een kop per groep zodra er een schip tussen staat; een schip krijgt zijn bakken als chips (1.364).
      const toon = treffers.slice(0, MAX), koppen = toon.some(it => it.groep === 'Schepen');
      const CHIPS = 8;
      lijst.innerHTML = toon.map((it, i) => (koppen && (i === 0 || toon[i - 1].groep !== it.groep) ? `<div class="snelzoek-groep">${esc(it.groep)}</div>` : '')
        + `<button type="button" class="snelzoek-regel" role="option" data-i="${i}" aria-selected="${i === gekozen}">
          <span class="wat">${snelzoekMarkeer(it.wat, vraag)}</span><span class="tekst">${esc(it.tekst)}</span><span class="waar">${esc(it.waar)}</span></button>`
        + (it.chips && it.chips.length ? `<div class="snelzoek-chips" role="group" aria-label="Bakken van ${esc(it.wat)}">${it.chips.slice(0, CHIPS).map((c, j) =>
            `<button type="button" class="snelzoek-chip" data-i="${i}" data-chip="${j}">${esc(c.naam)}</button>`).join('')}${
            it.chips.length > CHIPS ? `<span class="snelzoek-chip-meer">+${it.chips.length - CHIPS}</span>` : ''}</div>` : '')).join('')
        + (treffers.length > MAX ? `<div class="snelzoek-meer">nog ${treffers.length - MAX} meer, tik nog een cijfer om te verfijnen</div>` : '');
      lijst.querySelectorAll('.snelzoek-regel').forEach(b => b.addEventListener('click', () => kies(+b.dataset.i)));
      lijst.querySelectorAll('.snelzoek-chip').forEach(b => b.addEventListener('click', () => {
        const c = treffers[+b.dataset.i].chips[+b.dataset.chip]; closeModal(); c.doe();
      }));
    }
    const { fams } = leesVoorvoegsel();
    bd.querySelectorAll('[data-voor]').forEach(b => b.setAttribute('aria-pressed', String(fams.includes(b.dataset.voor))));
  };
  const kies = i => { const it = treffers[i]; if(!it) return; closeModal(); it.doe(); };
  const wijzig = () => { gekozen = 0; teken(); };
  bd.querySelectorAll('[data-voor]').forEach(b => b.addEventListener('click', () => {
    const { fams, cijfers } = leesVoorvoegsel();
    invoer.value = fams.includes(b.dataset.voor) ? cijfers : b.dataset.naam + ' ' + cijfers;   // nog een keer aantikken haalt het weg
    wijzig();
  }));
  bd.querySelectorAll('[data-toets]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.toets;
    if(t === '⌫') invoer.value = invoer.value.slice(0, -1).replace(/\s+$/, '');
    else if(t === '↵') return kies(gekozen);
    else invoer.value += /[A-Za-z]$/.test(invoer.value) ? ' ' + t : t;
    wijzig();
  }));
  bd.querySelector('#snelzoekWis').addEventListener('click', () => { invoer.value = ''; wijzig(); invoer.focus(); });
  // ABC wisselt het eigen keypad tussen cijfer-modus (voorvoegsel+cijfers) en
  // letter-modus (QWERTY). inputmode blijft "none": het tablet-toetsenbord komt
  // dus nooit op (en dekt de lijst nooit af); een fysiek toetsenbord typt gewoon
  // rechtstreeks in het veld, want inputmode blokkeert hardware-toetsen niet.
  const paneel = bd.querySelector('.snelzoek');
  bd.querySelector('#snelzoekAbc').addEventListener('click', e => {
    const aan = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(aan));
    paneel.classList.toggle('abc-aan', aan);
    invoer.focus();
  });
  // Letters uit het eigen toetsenbord: rauw toevoegen (geen spatie-logica zoals
  // bij de voorvoegsel+cijfer-toetsen — een naam mag gewoon aaneen).
  bd.querySelectorAll('[data-letter]').forEach(b => b.addEventListener('click', () => {
    invoer.value += b.dataset.letter;
    wijzig();
  }));
  // De ⌫ en ↵ van het letter-toetsenbord: eigen attribuut (niet data-toets),
  // zodat het cijfer-keypad de enige ⌫/↵ houdt en selectors eenduidig blijven.
  bd.querySelectorAll('[data-letter-ctrl]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.letterCtrl === 'back'){ invoer.value = invoer.value.slice(0, -1); wijzig(); }
    else kies(gekozen);
  }));
  invoer.addEventListener('input', wijzig);
  invoer.addEventListener('keydown', e => {
    const n = Math.min(treffers.length, MAX);
    if(e.key === 'ArrowDown'){ gekozen = Math.max(0, Math.min(n - 1, gekozen + 1)); teken(); e.preventDefault(); }
    else if(e.key === 'ArrowUp'){ gekozen = Math.max(0, gekozen - 1); teken(); e.preventDefault(); }
    else if(e.key === 'Enter'){ kies(gekozen); e.preventDefault(); }
  });
  bd.querySelector('.snelzoek-sluit').addEventListener('click', closeModal);
  bd.addEventListener('click', e => { if(e.target === bd) closeModal(); });
  teken();
  invoer.focus();
}

document.addEventListener('keydown', e => {
  const inVeld = e.target && (e.target.closest?.('input, textarea, select, [contenteditable="true"]'));
  const ctrlK = (e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K');
  if(ctrlK || (e.key === '/' && !inVeld && !document.getElementById('modalBackdrop'))){

});

/* ---------------------------------------------------------------

--------------------------------------------------------------- */

const WELKOM_KEY = 'duwbakken-welkom';
const WEER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=51.95&longitude=4.12'

  + '&wind_speed_unit=ms&timezone=Europe%2FAmsterdam&forecast_days=2';
const WEER_MAX_OUD = 6 * 3600e3, WEER_VERVERS = 3600e3;

const WELKOM_TEKSTEN = {

  koningsdag: ['Fijne Koningsdag! Ook vandaag draait de haven door, dankzij jou en de ploeg.']

const WEER_ICOON = { mooi:'☀️', helder:'🌙', regen:'🌧', wind:'💨', storm:'🌪', onweer:'⛈', mist:'🌫', vorst:'❄️', hitte:'🥵' };

function leesLokaal(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(_){ return null; } }
function schrijfLokaal(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){ meldOpslagProbleem(key, e); } }

function beaufort(ms){
  const grens = [0.3, 1.6, 3.4, 5.5, 8.0, 10.8, 13.9, 17.2, 20.8, 24.5, 28.5, 32.7];
  const i = grens.findIndex(g => ms < g);
  return i < 0 ? 12 : i;
}
function windrichting(gr){ return ['N','NO','O','ZO','Z','ZW','W','NW'][Math.round(gr / 45) % 8]; }

function feestdag(nu){
  const d = nu.getDate(), m = nu.getMonth() + 1;
  if(m === 12 && d >= 24 && d <= 26) return 'kerst';
  if(m === 12 && d === 31) return 'oudjaar';
  if(m === 1 && d === 1) return 'nieuwjaar';
  if(m === 4 && d === 27) return 'koningsdag';
  return null;
}

/* Het weer over de dienst (12 uur vanaf de laatste wissel), of null als er
   geen bruikbare voorspelling is. */
function dienstWeer(nu = new Date()){
  const w = leesLokaal(WEER_KEY);
  if(!w || !w.hourly || nu - w.opgehaaldOp > WEER_MAX_OUD) return null;
  const start = laatsteDienstWissel(nu), eind = start + 12 * 3600e3;
  const h = w.hourly, uren = [];
  h.time.forEach((t, i) => { const ms = new Date(t).getTime(); if(ms >= start && ms < eind) uren.push(i); });
  if(!uren.length) return null;
  const nuIdx = uren.find(i => new Date(h.time[i]).getTime() + 3600e3 > nu) ?? uren[0];
  const codes = uren.map(i => h.weather_code[i]);
  return {
    nacht: new Date(start).getHours() >= 19,
    codes,
    maxBft: Math.max(...uren.map(i => beaufort(h.wind_speed_10m[i]))),
    regen: Math.round(uren.reduce((s, i) => s + (h.precipitation[i] || 0), 0) * 10) / 10,
    minT: Math.min(...uren.map(i => h.temperature_2m[i])),
    maxT: Math.max(...uren.map(i => h.temperature_2m[i])),
    nuT: Math.round(h.temperature_2m[nuIdx]),
    nuBft: beaufort(h.wind_speed_10m[nuIdx]),
    nuRichting: windrichting(h.wind_direction_10m[nuIdx])
  };
}

// Voorrang (idee 17): onweer > storm > feestdag > mist > vorst > wind > regen > hitte > mooi > standaard.
function welkomSoort(weer, nu = new Date()){
  const f = feestdag(nu);
  if(!weer) return f || 'standaard';
  if(weer.codes.some(c => c >= 95)) return 'onweer';
  if(weer.maxBft >= 8) return 'storm';
  if(f) return f;
  if(weer.codes.some(c => c === 45 || c === 48)) return 'mist';
  if(weer.minT <= 0) return 'vorst';
  if(weer.maxBft >= 6) return 'wind';
  if(weer.regen >= 1) return 'regen';
  if(weer.maxT >= 27) return 'hitte';
  const zonnig = weer.codes.filter(c => c <= 1).length > weer.codes.length / 2;
  if(zonnig && weer.regen === 0) return weer.nacht ? 'helder' : 'mooi';
  return 'standaard';
}

/* Vast per dienst; een nieuwe dienst krijgt nooit dezelfde tekst als de vorige
   in dezelfde soort. Verandert de soort (nieuw weerbericht), dan een nieuwe. */
function welkomTekst(soort){
  const dienst = dienstGekozenOp || laatsteDienstWissel();
  const lijst = WELKOM_TEKSTEN[soort];
  const vorige = leesLokaal(WELKOM_KEY) || {};
  if(vorige.dienst === dienst && vorige.soort === soort && lijst[vorige.idx]) return lijst[vorige.idx];
  let idx = Math.floor(Math.random() * lijst.length);
  if(vorige.soort === soort && idx === vorige.idx && lijst.length > 1) idx = (idx + 1) % lijst.length;
  schrijfLokaal(WELKOM_KEY, { dienst, soort, idx });
  return lijst[idx];
}

function welkomHtml(nu = new Date()){
  const user = getCurrentUser();
  const u = nu.getHours();
  const groet = u < 6 ? 'Goedenacht' : u < 12 ? 'Goedemorgen' : u < 18 ? 'Goedemiddag' : 'Goedenavond';
  const weer = dienstWeer(nu);
  const soort = welkomSoort(weer, nu);
  const kop = user ? `${groet} ${String(user.naam).trim().split(/\s+/)[0]}` : 'Welkom aan boord';
  const cijfers = weer
    ? `${WEER_ICOON[soort] || '🌤'} ${weer.nuT}° · ${weer.nuRichting} ${weer.nuBft} Bft${weer.regen > 0 ? ` · ${String(weer.regen).replace('.', ',')} mm` : ''}`
    : '';
  return `<div class="dash-welkom-groet">${esc(kop)}</div>
    <div class="dash-welkom-tekst">${esc(welkomTekst(soort))}</div>
    ${cijfers ? `<div class="dash-welkom-weer">${esc(cijfers)}</div>` : ''}`;
}

// Ophalen als het bericht ouder is dan een uur; mislukt het, dan stil.
let weerBezig = false;
async function haalWeerOp(){
  const w = leesLokaal(WEER_KEY);
  if(weerBezig || (w && Date.now() - w.opgehaaldOp < WEER_VERVERS) || navigator.onLine === false) return;
  weerBezig = true;
  try{
    const res = await fetch(WEER_URL);
    if(!res.ok) return;
    const data = await res.json();
    if(!data.hourly || !Array.isArray(data.hourly.time)) return;
    schrijfLokaal(WEER_KEY, { opgehaaldOp: Date.now(), hourly: data.hourly });
    const el = document.getElementById('dashWelkom');
    if(el) el.innerHTML = welkomHtml();
  }catch(_){ /* geen internet: de standaardmelding blijft staan */ }
  finally{ weerBezig = false; }
}
